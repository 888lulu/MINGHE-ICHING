
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易經 · 六十四卦</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+TC:wght@300;400;500;600;700;900&display=swap">
<style>
:root {
  --bg-deep: #080808;
  --bg-card: #121212;
  --bg-card-hover: #1a1814;
  --ink: #e8e0d0;
  --ink-dim: #8a8070;
  --ink-faint: #4a4438;
  --gold: #c9a87c;
  --gold-bright: #e0c49a;
  --gold-dim: #8a7050;
  --transition: cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  background: var(--bg-deep);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--gold); text-decoration: none; transition: color 0.3s; }
a:hover { color: var(--gold-bright); }
.view { display: none; opacity: 0; transition: opacity 0.6s var(--transition); }
.view.active { display: block; opacity: 1; }

/* 開場動畫 */
#intro-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg-deep);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 1s var(--transition);
}
#intro-overlay.fade-out { opacity: 0; pointer-events: none; }
.intro-stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.intro-phase {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.8s var(--transition);
}
.intro-phase.visible { opacity: 1; }
.taiji {
  width: 200px; height: 200px; border-radius: 50%;
  background: linear-gradient(to right, var(--ink) 50%, var(--bg-deep) 50%);
  position: relative; animation: taiji-spin 6s linear infinite;
  box-shadow: 0 0 60px rgba(201, 168, 124, 0.15);
}
.taiji::before, .taiji::after { content: ''; position: absolute; width: 100px; height: 100px; border-radius: 50%; left: 50px; }
.taiji::before { top: 0; background: var(--ink); }
.taiji::after { bottom: 0; background: var(--bg-deep); }
.taiji-dot { position: absolute; width: 20px; height: 20px; border-radius: 50%; left: 90px; z-index: 2; }
.taiji-dot.top { top: 40px; background: var(--bg-deep); }
.taiji-dot.bottom { bottom: 40px; background: var(--ink); }
@keyframes taiji-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.intro-label { margin-top: 40px; font-size: 1.1rem; letter-spacing: 0.5em; color: var(--ink-dim); text-indent: 0.5em; }

/* 背景豎排文字 */
.bg-vertical-text {
  position: absolute; writing-mode: vertical-rl;
  color: rgba(201, 168, 124, 0.12); letter-spacing: 0.5em;
  z-index: 0; user-select: none; pointer-events: none;
}
.bg-text-left { left: 12%; top: 50%; transform: translateY(-50%); font-size: 1.5rem; }
.bg-text-right { right: 12%; top: 50%; transform: translateY(-50%); font-size: 0.85rem; letter-spacing: 0.35em; text-transform: lowercase; }

/* 五行 */
.wuxing-container { position: absolute; width: 400px; height: 400px; z-index: 1; }
.wuxing {
  position: absolute; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--gold-dim); display: flex; align-items: center; justify-content: center;
  font-size: 1rem; color: var(--gold); animation: wuxing-pulse 3s ease-in-out infinite;
}
.wuxing-water { top: 0; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
.wuxing-fire { bottom: 0; left: 50%; transform: translateX(-50%); animation-delay: 0.6s; }
.wuxing-wood { left: 0; top: 50%; transform: translateY(-50%); animation-delay: 1.2s; }
.wuxing-metal { right: 0; top: 50%; transform: translateY(-50%); animation-delay: 1.8s; }
.wuxing-earth { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; font-size: 1.3rem; animation-delay: 2.4s; background: rgba(201, 168, 124, 0.06); }
@keyframes wuxing-pulse {
  0%, 100% { opacity: 0.45; box-shadow: 0 0 0 0 rgba(201, 168, 124, 0.15); }
  50% { opacity: 1; box-shadow: 0 0 18px 4px rgba(201, 168, 124, 0.12); }
}

/* 八卦 */
.bagua-container { position: relative; width: 280px; height: 280px; animation: bagua-rotate 20s linear infinite; z-index: 2; }
@keyframes bagua-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.trigram {
  position: absolute; width: 60px; height: 60px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.trigram .yao-line { width: 48px; height: 6px; }
.trigram .yao-line.yang { background: var(--gold); }
.trigram .yao-line.yin { background: transparent; position: relative; }
.trigram .yao-line.yin::before, .trigram .yao-line.yin::after { content: ''; position: absolute; top: 0; width: 19px; height: 6px; background: var(--gold); }
.trigram .yao-line.yin::before { left: 0; }
.trigram .yao-line.yin::after { right: 0; }
.tg-qian { top: 0; left: 50%; transform: translateX(-50%); }
.tg-dui { top: 15%; right: 5%; }
.tg-li { top: 50%; right: 0; transform: translateY(-50%); }
.tg-zhen { bottom: 15%; right: 5%; }
.tg-xun { top: 15%; left: 5%; }
.tg-kan { top: 50%; left: 0; transform: translateY(-50%); }
.tg-gen { bottom: 15%; left: 5%; }
.tg-kun { bottom: 0; left: 50%; transform: translateX(-50%); }

/* 六十四卦湧現 */
.hex-grid-intro { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; width: 90%; max-width: 700px; }
.hex-cell-intro {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 1px solid var(--ink-faint); border-radius: 4px;
  opacity: 0; transform: scale(0.5); animation: hex-appear 0.4s var(--transition) forwards;
}
@keyframes hex-appear { to { opacity: 1; transform: scale(1); } }
.hex-cell-intro .mini-yao { width: 60%; height: 3px; }
.hex-cell-intro .mini-yao.yang { background: var(--gold); }
.hex-cell-intro .mini-yao.yin { background: transparent; position: relative; }
.hex-cell-intro .mini-yao.yin::before, .hex-cell-intro .mini-yao.yin::after { content: ''; position: absolute; top: 0; width: 42%; height: 3px; background: var(--gold); }
.hex-cell-intro .mini-yao.yin::before { left: 0; }
.hex-cell-intro .mini-yao.yin::after { right: 0; }

/* 主界面 */
#main-view { min-height: 100vh; padding-bottom: 80px; }
.site-header { padding: 48px 24px 32px; text-align: center; border-bottom: 1px solid var(--ink-faint); }
.site-title { font-size: 2.4rem; font-weight: 700; letter-spacing: 0.3em; color: var(--ink); text-indent: 0.3em; }
.site-subtitle { margin-top: 12px; font-size: 0.85rem; letter-spacing: 0.4em; color: var(--ink-dim); text-indent: 0.4em; }
.toolbar { display: flex; justify-content: center; gap: 16px; padding: 24px; flex-wrap: wrap; }
.btn {
  padding: 10px 28px; border: 1px solid var(--gold-dim); background: transparent; color: var(--gold);
  font-family: inherit; font-size: 0.9rem; letter-spacing: 0.2em; cursor: pointer;
  transition: all 0.3s var(--transition); border-radius: 2px;
}
.btn:hover { background: var(--gold); color: var(--bg-deep); border-color: var(--gold); }
.hex-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; padding: 0 32px 48px; max-width: 1200px; margin: 0 auto; }
.hex-card {
  background: var(--bg-card); border: 1px solid var(--ink-faint); border-radius: 4px; padding: 16px 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; transition: all 0.4s var(--transition); position: relative; overflow: hidden;
}
.hex-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(201,168,124,0.05), transparent); opacity: 0; transition: opacity 0.4s; }
.hex-card:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 8px 30px rgba(201, 168, 124, 0.1); }
.hex-card:hover::before { opacity: 1; }
.hex-card .hex-num { font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 8px; letter-spacing: 0.1em; }
.hex-card .hex-symbol { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.hex-card .hex-symbol .yao { width: 40px; height: 5px; }
.hex-card .hex-symbol .yao.yang { background: var(--gold); }
.hex-card .hex-symbol .yao.yin { background: transparent; position: relative; }
.hex-card .hex-symbol .yao.yin::before, .hex-card .hex-symbol .yao.yin::after { content: ''; position: absolute; top: 0; width: 17px; height: 5px; background: var(--gold); }
.hex-card .hex-symbol .yao.yin::before { left: 0; }
.hex-card .hex-symbol .yao.yin::after { right: 0; }
.hex-card .hex-name { font-size: 1.1rem; font-weight: 600; color: var(--ink); letter-spacing: 0.1em; }

/* 詳情頁 */
#detail-view { min-height: 100vh; padding: 32px 24px 80px; max-width: 800px; margin: 0 auto; }
.back-bar { display: flex; align-items: center; gap: 12px; padding: 16px 0; margin-bottom: 24px; border-bottom: 1px solid var(--ink-faint); }
.back-btn {
  display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--ink-faint);
  color: var(--ink-dim); padding: 8px 20px; cursor: pointer; font-family: inherit; font-size: 0.85rem;
  letter-spacing: 0.15em; transition: all 0.3s; border-radius: 2px;
}
.back-btn:hover { border-color: var(--gold); color: var(--gold); }
.back-btn svg { width: 16px; height: 16px; }
.detail-header { text-align: center; padding: 32px 0; }
.detail-num { font-size: 0.8rem; color: var(--ink-faint); letter-spacing: 0.3em; margin-bottom: 12px; }
.detail-name { font-size: 2.8rem; font-weight: 700; color: var(--ink); letter-spacing: 0.2em; margin-bottom: 8px; }
.detail-fullname { font-size: 1rem; color: var(--ink-dim); letter-spacing: 0.3em; }
.detail-trigrams { margin-top: 16px; font-size: 0.85rem; color: var(--ink-faint); letter-spacing: 0.2em; }
.detail-hexagram {
  display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 32px 0; margin: 24px 0;
  border-top: 1px solid var(--ink-faint); border-bottom: 1px solid var(--ink-faint);
}
.detail-hexagram .yao { width: 200px; height: 12px; position: relative; }
.detail-hexagram .yao.yang { background: var(--gold); }
.detail-hexagram .yao.yin { background: transparent; }
.detail-hexagram .yao.yin::before, .detail-hexagram .yao.yin::after { content: ''; position: absolute; top: 0; width: 88px; height: 12px; background: var(--gold); }
.detail-hexagram .yao.yin::before { left: 0; }
.detail-hexagram .yao.yin::after { right: 0; }
.detail-hexagram .yao-label { position: absolute; right: -80px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; color: var(--ink-dim); letter-spacing: 0.1em; white-space: nowrap; }
.judgment-section { padding: 32px 0; text-align: center; }
.section-label { font-size: 0.75rem; color: var(--gold); letter-spacing: 0.4em; margin-bottom: 20px; text-indent: 0.4em; }
.judgment-text { font-size: 1.2rem; line-height: 2.2; color: var(--ink); max-width: 600px; margin: 0 auto; letter-spacing: 0.05em; }
.lines-section { padding: 32px 0; }
.line-item { display: flex; gap: 24px; padding: 20px 0; border-bottom: 1px solid rgba(74, 68, 56, 0.3); align-items: flex-start; }
.line-item:last-child { border-bottom: none; }
.line-position { flex-shrink: 0; width: 60px; font-size: 0.9rem; color: var(--gold); font-weight: 600; letter-spacing: 0.1em; padding-top: 2px; }
.line-text { flex: 1; font-size: 1rem; line-height: 2; color: var(--ink); letter-spacing: 0.03em; }

/* 底部文獻鏈接 */
.footer-links { max-width: 1200px; margin: 0 auto; padding: 48px 32px; border-top: 1px solid var(--ink-faint); }
.footer-title { text-align: center; font-size: 0.85rem; color: var(--ink-dim); letter-spacing: 0.4em; margin-bottom: 32px; text-indent: 0.4em; }
.link-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.link-card {
  background: var(--bg-card); border: 1px solid var(--ink-faint); border-radius: 4px; padding: 24px 20px;
  text-align: center; transition: all 0.4s var(--transition); display: block;
}
.link-card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(201, 168, 124, 0.08); }
.link-card .link-icon { width: 36px; height: 36px; margin: 0 auto 12px; border: 1px solid var(--gold-dim); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.link-card .link-icon svg { width: 16px; height: 16px; fill: var(--gold); }
.link-card .link-name { font-size: 0.9rem; color: var(--ink); margin-bottom: 6px; letter-spacing: 0.1em; }
.link-card .link-desc { font-size: 0.75rem; color: var(--ink-faint); letter-spacing: 0.05em; }
.site-footer { text-align: center; padding: 32px; font-size: 0.75rem; color: var(--ink-faint); letter-spacing: 0.2em; }

/* 隨機抽卦模態框 */
.modal-overlay { position: fixed; inset: 0; z-index: 900; background: rgba(8, 8, 8, 0.92); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.4s; }
.modal-overlay.active { display: flex; opacity: 1; }
.draw-card { width: 280px; height: 420px; perspective: 1000px; cursor: pointer; }
.draw-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s var(--transition); transform-style: preserve-3d; }
.draw-card.flipped .draw-card-inner { transform: rotateY(180deg); }
.draw-card-face { position: absolute; inset: 0; backface-visibility: hidden; border: 1px solid var(--gold-dim); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; }
.draw-card-front { background: linear-gradient(145deg, #1a1814, #0e0d0b); }
.draw-card-front .card-pattern { font-size: 3rem; color: var(--gold); margin-bottom: 24px; opacity: 0.6; }
.draw-card-front .card-text { font-size: 1rem; color: var(--ink-dim); letter-spacing: 0.3em; text-indent: 0.3em; }
.draw-card-front .card-hint { margin-top: 16px; font-size: 0.7rem; color: var(--ink-faint); letter-spacing: 0.2em; }
.draw-card-back { background: linear-gradient(145deg, #1a1814, #0e0d0b); transform: rotateY(180deg); }
.draw-card-back .result-num { font-size: 0.75rem; color: var(--ink-faint); letter-spacing: 0.3em; margin-bottom: 12px; }
.draw-card-back .result-name { font-size: 2.2rem; font-weight: 700; color: var(--ink); letter-spacing: 0.15em; margin-bottom: 8px; }
.draw-card-back .result-fullname { font-size: 0.85rem; color: var(--ink-dim); letter-spacing: 0.2em; margin-bottom: 24px; }
.draw-card-back .result-symbol { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
.draw-card-back .result-symbol .yao { width: 100px; height: 7px; }
.draw-card-back .result-symbol .yao.yang { background: var(--gold); }
.draw-card-back .result-symbol .yao.yin { background: transparent; position: relative; }
.draw-card-back .result-symbol .yao.yin::before, .draw-card-back .result-symbol .yao.yin::after { content: ''; position: absolute; top: 0; width: 44px; height: 7px; background: var(--gold); }
.draw-card-back .result-symbol .yao.yin::before { left: 0; }
.draw-card-back .result-symbol .yao.yin::after { right: 0; }
.draw-card-back .result-judgment { font-size: 0.8rem; color: var(--ink-dim); line-height: 1.8; text-align: center; max-width: 200px; }
.draw-card-back .result-action { margin-top: 20px; font-size: 0.75rem; color: var(--gold); letter-spacing: 0.2em; border: 1px solid var(--gold-dim); padding: 8px 20px; border-radius: 2px; }
.modal-close { position: absolute; top: 24px; right: 24px; background: none; border: 1px solid var(--ink-faint); color: var(--ink-dim); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s; font-family: inherit; }
.modal-close:hover { border-color: var(--gold); color: var(--gold); }

/* 響應式 */
@media (max-width: 1024px) { .hex-grid { grid-template-columns: repeat(6, 1fr); padding: 0 20px 40px; } }
@media (max-width: 768px) {
  .hex-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 16px 32px; }
  .hex-card { padding: 12px 4px; }
  .hex-card .hex-symbol .yao { width: 32px; height: 4px; }
  .hex-card .hex-symbol .yao.yin::before, .hex-card .hex-symbol .yao.yin::after { width: 13px; height: 4px; }
  .hex-card .hex-name { font-size: 0.95rem; }
  .link-grid { grid-template-columns: repeat(3, 1fr); }
  .related-grid { grid-template-columns: repeat(2, 1fr); }
  .site-title { font-size: 1.8rem; }
  .detail-name { font-size: 2rem; }
  .detail-hexagram .yao { width: 140px; height: 10px; }
  .detail-hexagram .yao.yin::before, .detail-hexagram .yao.yin::after { width: 60px; height: 10px; }
  .detail-hexagram .yao-label { right: -65px; font-size: 0.65rem; }
  .hex-grid-intro { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bagua-container { width: 220px; height: 220px; }
  .wuxing-container { width: 320px; height: 320px; }
  .wuxing { width: 36px; height: 36px; font-size: 0.85rem; }
  .wuxing-earth { width: 48px; height: 48px; font-size: 1.1rem; }
  .bg-text-left { font-size: 1.1rem; left: 8%; }
  .bg-text-right { font-size: 0.7rem; right: 8%; }
  .taiji { width: 160px; height: 160px; }
  .taiji::before, .taiji::after { width: 80px; height: 80px; left: 40px; }
  .taiji-dot { width: 16px; height: 16px; left: 72px; }
  .taiji-dot.top { top: 32px; }
  .taiji-dot.bottom { bottom: 32px; }
}
@media (max-width: 480px) {
  .hex-grid { grid-template-columns: repeat(3, 1fr); }
  .link-grid { grid-template-columns: 1fr; }
  .related-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .related-card { padding: 14px 8px; }
  .detail-hexagram .yao-label { display: none; }
  .line-item { flex-direction: column; gap: 8px; }
  .line-position { width: auto; }
  .draw-card { width: 240px; height: 380px; }
}
@media (prefers-reduced-motion: reduce) {
  .taiji, .bagua-container, .wuxing { animation: none; }
  * { transition-duration: 0.01ms !important; }
}


/* 十翼折叠面板 */
.shiyi-section { padding: 24px 0; border-top: 1px solid var(--ink-faint); }
.accordion-item { border-bottom: 1px solid rgba(74, 68, 56, 0.3); }
.accordion-item:last-child { border-bottom: none; }
.accordion-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0; cursor: pointer; user-select: none;
  transition: color 0.3s;
}
.accordion-header:hover { color: var(--gold); }
.accordion-header .acc-title {
  font-size: 0.95rem; font-weight: 600; letter-spacing: 0.15em;
  color: var(--ink);
}
.accordion-header .acc-icon {
  width: 20px; height: 20px; position: relative; flex-shrink: 0;
  transition: transform 0.3s var(--transition);
}
.accordion-header .acc-icon::before, .accordion-header .acc-icon::after {
  content: ''; position: absolute; background: var(--gold-dim);
  transition: background 0.3s;
}
.accordion-header .acc-icon::before { top: 50%; left: 0; right: 0; height: 1.5px; transform: translateY(-50%); }
.accordion-header .acc-icon::after { left: 50%; top: 0; bottom: 0; width: 1.5px; transform: translateX(-50%); }
.accordion-item.open .accordion-header .acc-icon::after { transform: translateX(-50%) scaleY(0); }
.accordion-item.open .accordion-header .acc-title { color: var(--gold); }
.accordion-body {
  max-height: 0; overflow: hidden;
  transition: max-height 0.4s var(--transition), padding 0.4s var(--transition);
}
.accordion-item.open .accordion-body { max-height: 2000px; padding-bottom: 20px; }
.accordion-content {
  font-size: 0.95rem; line-height: 2; color: var(--ink);
  letter-spacing: 0.03em; padding-left: 8px;
}
.accordion-content .source-label {
  display: inline-block; font-size: 0.7rem; color: var(--gold-dim);
  letter-spacing: 0.15em; margin-bottom: 8px;
}
.line-xiang {
  margin-top: 8px; font-size: 0.85rem; color: var(--ink-dim);
  line-height: 1.8; padding-left: 12px; border-left: 2px solid var(--gold-dim);
}
.line-xiang .xiang-label { color: var(--gold); font-size: 0.75rem; margin-right: 6px; }


/* 關聯卦區 */
.related-hex-section { padding: 32px 0; border-top: 1px solid var(--ink-faint); margin-top: 16px; }
.related-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 24px; }
.related-card {
  background: var(--bg-card); border: 1px solid var(--ink-faint); border-radius: 4px;
  padding: 20px 12px; cursor: pointer; text-align: center;
  transition: all 0.4s var(--transition); position: relative; overflow: hidden;
}
.related-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(201,168,124,0.06), transparent); opacity: 0; transition: opacity 0.4s; }
.related-card:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(201, 168, 124, 0.12); }
.related-card:hover::before { opacity: 1; }
.related-type { font-size: 0.75rem; color: var(--gold); letter-spacing: 0.25em; margin-bottom: 8px; text-indent: 0.25em; }
.related-desc { font-size: 0.65rem; color: var(--ink-faint); letter-spacing: 0.05em; margin-bottom: 14px; line-height: 1.6; min-height: 2em; }

.coin-face {
  position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; overflow: hidden;
  display: flex; align-items: center; justify-content: center; border: 2.5px solid #6a5030;
}
.coin-zi { background: radial-gradient(circle at 38% 32%, #d9b98f 0%, #b08d5c 45%, #7d5f38 100%); }
.coin-hua { background: radial-gradient(circle at 38% 32%, #c9a87c 0%, #a07d4c 45%, #6d5028 100%); transform: rotateY(180deg); }
.coin-hole { width: 17px; height: 17px; background: #1a1208; border: 1.5px solid #5a4020; position: relative; z-index: 3; box-shadow: inset 0 0 4px rgba(0,0,0,0.8); }
.coin-char { position: absolute; z-index: 2; color: #4a3015; font-weight: 700; font-size: 0.62rem; line-height: 1; }
.cc-top { top: 5px; left: 50%; transform: translateX(-50%); }
.cc-bottom { bottom: 5px; left: 50%; transform: translateX(-50%); }
.cc-right { right: 5px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; }
.cc-left { left: 5px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; }
.coin-hua-mark { position: absolute; z-index: 2; color: #3d2a12; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; }
.coin.tossing { animation: coin-toss 1.25s cubic-bezier(0.3, 0.1, 0.2, 1) forwards; }
@keyframes coin-toss {
  0% { transform: translateY(0) rotateY(0deg) rotateX(0deg); }
  35% { transform: translateY(-62px) rotateY(900deg) rotateX(22deg); }
  70% { transform: translateY(-12px) rotateY(var(--spin-mid)) rotateX(-12deg); }
  100% { transform: translateY(0) rotateY(var(--spin-end)) rotateX(0deg); }
}
.coin.landed-zi { transform: rotateY(0deg); }
.coin.landed-hua { transform: rotateY(180deg); }
.coin-flash { position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--gold-bright); opacity: 0; pointer-events: none; }
.coin.flash .coin-flash { animation: coin-flash-anim 0.6s ease-out; }
@keyframes coin-flash-anim { 0% { opacity: 0.9; transform: scale(0.9); } 100% { opacity: 0; transform: scale(1.35); } }
.toss-result-line { text-align: center; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; margin-bottom: 14px; }
.toss-yao-name { font-size: 0.95rem; color: var(--gold); letter-spacing: 0.2em; }

.coin-yao-track { display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 14px; border: 1px solid var(--ink-faint); border-radius: 6px; margin-bottom: 16px; background: rgba(0,0,0,0.25); }
.coin-yao-row { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: center; height: 13px; }

.coin-yao-bar { width: 80px; height: 7px; opacity: 0.25; transform: scaleX(0); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s; }
.coin-yao-bar.yang { background: var(--gold-dim); }
.coin-yao-bar.yin { background: transparent; position: relative; }

.coin-yao-bar.yin::after { right: 0; }

var HEXAGRAMS = [
  { id:1, name:'乾', full:'乾爲天', upper:'qian', lower:'qian',
    judgment:'元亨，利貞。',
    lines:[
      {pos:'初九', text:'潛龍，勿用。'},
      {pos:'九二', text:'見龍在田，利見大人。'},
      {pos:'九三', text:'君子終日乾乾，夕惕若，厲，无咎。'},
      {pos:'九四', text:'或躍在淵，无咎。'},
      {pos:'九五', text:'飛龍在天，利見大人。'},
      {pos:'上九', text:'亢龍有悔。'}
    ], extra:{pos:'用九', text:'見羣龍無首，吉。'} },
  { id:2, name:'坤', full:'坤爲地', upper:'kun', lower:'kun',
    judgment:'元亨，利牝馬之貞。君子有攸往，先迷後得主，利西南得朋，東北喪朋。安貞，吉。',

      {pos:'初六', text:'履霜，堅冰至。'},

  { id:3, name:'屯', full:'水雷屯', upper:'kan', lower:'zhen',

    lines:[
      {pos:'初九', text:'磐桓；利居貞，利建侯。'},
      {pos:'六二', text:'屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。'},

  { id:4, name:'蒙', full:'山水蒙', upper:'gen', lower:'kan',

    lines:[
      {pos:'初六', text:'發矇，利用刑人，用說桎梏，以往吝。'},

var SHIYI_TUAN = {"1": "大哉乾元，萬物資始，乃統天。雲行雨施，品物流形。大明終始，六位時成，時乘六龍以御天。乾道變化，各正性命，保合大和，乃利貞。首出庶物，萬國咸寧。", "2": "至哉坤元，萬物資生，乃順承天。坤厚載物，德合無疆。含弘光大，品物咸亨。牝馬地類，行地無疆，柔順利貞。君子攸行，先迷失道，後順得常。西南得朋，乃與類行；東北喪朋，乃終有慶。安貞之吉，應地無疆。", "3": "屯，剛柔始交而難生，動乎險中，大亨貞。雷雨之動滿盈，天造草昧，宜建侯而不寧。", "4": "蒙，山下有險，險而止，蒙。蒙亨，以亨行時中也。匪我求童蒙，童蒙求我，志應也。初筮告，以剛中也。再三瀆，瀆則不告，瀆蒙也。蒙以養正，聖功也。", "5": "需，須也，險在前也。剛健而不陷，其義不困窮矣。需有孚，光亨貞吉，位乎天位，以正中也。利涉大川，往有功也。", "6": "訟，上剛下險，險而健訟。訟有孚窒惕中吉，剛來而得中也。終凶，訟不可成也。利見大人，尚中正也。不利涉大川，入於淵也。", "7": "師，衆也；貞，正也；能以衆正，可以王矣。剛中而應，行險而順，以此毒天下，而民從之，吉又何咎矣。", "8": "比，吉也；比，輔也，下順從也。原筮元永貞无咎，以剛中也。不寧方來，上下應也。後夫凶，其道窮也。", "9": "小畜，柔得位而上下應之，曰小畜。健而巽，剛中而志行，乃亨。密雲不雨，尚往也。自我西郊，施未行也。", "10": "履，柔履剛也。說而應乎乾，是以履虎尾，不咥人，亨。剛中正，履帝位而不疚，光明也。", "11": "泰，小往大來，吉亨。則是天地交而萬物通也，上下交而其志同也。內陽而外陰，內健而外順，內君子而外小人，君子道長，小人道消也。", "12": "否之匪人，不利君子貞，大往小來。則是天地不交而萬物不通也，上下不交而天下無邦也。內陰而外陽，內柔而外剛，內小人而外君子。小人道長，君子道消也。", "13": "同人，柔得位得中，而應乎乾，曰同人。同人曰，同人於野，亨。利涉大川，乾行也。文明以健，中正而應，君子正也。唯君子爲能通天下之志。", "14": "大有，柔得尊位，大中而上下應之，曰大有。其德剛健而文明，應乎天而時行，是以元亨。", "15": "謙，亨，天道下濟而光明，地道卑而上行。天道虧盈而益謙，地道變盈而流謙，鬼神害盈而福謙，人道惡盈而好謙。謙尊而光，卑而不可逾，君子之終也。", "16": "豫，剛應而志行，順以動，豫。豫，順以動，故天地如之，而況建侯行師乎？天地以順動，故日月不過，而四時不忒；聖人以順動，則刑罰清而民服。豫之時義大矣哉。", "17": "隨，剛來而下柔，動而說，隨。大亨貞，无咎，而天下隨時，隨之時義大矣哉。", "18": "蠱，剛上而柔下，巽而止，蠱。蠱，元亨，而天下治也。利涉大川，往有事也。先甲三日，後甲三日，終則有始，天行也。", "19": "臨，剛浸而長。說而順，剛中而應。大亨以正，天之道也。至於八月有凶，消不久也。", "20": "大觀在上，順而巽，中正以觀天下。觀，盥而不薦，有孚顒若，下觀而化也。觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。", "21": "頤中有物，曰噬嗑，噬嗑而亨。剛柔分，動而明，雷電合而章。柔得中而上行，雖不當位，利用獄也。", "22": "賁，亨。柔來而文剛，故亨。分剛上而文柔，故小利有攸往。天文也；文明以止，人文也。觀乎天文，以察時變；觀乎人文，以化成天下。", "23": "剝，剝也，柔變剛也。不利有攸往，小人長也。順而止之，觀象也。君子尚消息盈虛，天行也。", "24": "復，亨。剛反，動而以順行，是以出入無疾，朋來无咎。反覆其道，七日來複，天行也。利有攸往，剛長也。復，其見天地之心乎？", "25": "無妄，剛自外來，而爲主於內。動而健，剛中而應，大亨以正，天之命也。其匪正有眚，不利有攸往。無妄之往，何之矣？天命不佑，行矣哉？", "26": "大畜，剛健篤實輝光，日新其德，剛上而尚賢。能止健，大正也。不家食吉，養賢也。利涉大川，應乎天也。", "27": "頤，貞吉，養正則吉也。觀頤，觀其所養也；自求口實，觀其自養也。天地養萬物，聖人養賢以及萬民。頤之時大矣哉。", "28": "大過，大者過也。棟橈，本末弱也。剛過而中，巽而說行，利有攸往，乃亨。大過之時大矣哉。", "29": "習坎，重險也。水流而不盈，行險而不失其信。維心亨，乃以剛中也。行有尚，往有功也。天險不可升也，地險山川丘陵也，王公設險以守其國。險之時用大矣哉。", "30": "離，麗也；日月麗乎天，百穀草木麗乎土，重明以麗乎正，乃化成天下。柔麗乎中正，故亨，是以畜牝牛吉也。", "31": "鹹，感也。柔上而剛下，二氣感應以相與，止而說，男下女，是以亨利貞，取女吉也。天地感而萬物化生，聖人感人心而天下和平。觀其所感，而天地萬物之情可見矣。", "32": "恆，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恆。恆亨无咎利貞，久於其道也。天地之道，恆久而不已也。利有攸往，終則有始也。日月得天而能久照，四時變化而能久成，聖人久於其道而天下化成。觀其所恆，而天地萬物之情可見矣。", "33": "遁，亨，遁而亨也。剛當位而應，與時行也。小利貞，浸而長也。遁之時義大矣哉。", "34": "大壯，大者壯也。剛以動，故壯。大壯利貞，大者正也。正大而天地之情可見矣。", "35": "晉，進也。明出地上，順而麗乎大明，柔進而上行。是以康侯用錫馬蕃庶，晝日三接也。", "36": "明入地中，明夷。內文明而外柔順，以蒙大難，文王以之。利艱貞，晦其明也，內難而能正其志，箕子以之。", "37": "家人，女正位乎內，男正位乎外，男女正，天地之大義也。家人有嚴君焉，父母之謂也。父父，子子，兄兄，弟弟，夫夫，婦婦，而家道正；正家而天下定矣。", "38": "睽，火動而上，澤動而下；二女同居，其志不同行。說而麗乎明，柔進而上行，得中而應乎剛，是以小事吉。天地睽，而其事同也；男女睽，而其志通也；萬物睽，而其事類也。睽之時用大矣哉。", "39": "蹇，難也，險在前也。見險而能止，知矣哉！蹇利西南，往得中也；不利東北，其道窮也。利見大人，往有功也。當位貞吉，以正邦也。蹇之時用大矣哉。", "40": "解，險以動，動而免乎險，解。解利西南，往得衆也。其來複吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之時大矣哉。", "41": "損，損下益上，其道上行。損而有孚，元吉无咎，可貞，利有攸往。曷之用？二簋可用享。二簋應有時，損剛益柔有時，損益盈虛，與時偕行。", "42": "益，損上益下，民說無疆，自上下下，其道大光。利有攸往，中正有慶。利涉大川，木道乃行。益動而巽，日進無疆。天施地生，其益無方。凡益之道，與時偕行。", "43": "夬，決也，剛決柔也。健而說，決而和，揚於王庭，柔乘五剛也。孚號有厲，其危乃光也。告自邑，不利即戎，所尚乃窮也。利有攸往，剛長乃終也。", "44": "姤，遇也，柔遇剛也。勿用取女，不可與長也。天地相遇，品物鹹章也。剛遇中正，天下大行也。姤之時義大矣哉。", "45": "萃，聚也；順以說，剛中而應，故聚也。王假有廟，致孝享也。利見大人亨，聚以正也。用大牲吉，利有攸往，順天命也。觀其所聚，而天地萬物之情可見矣。", "46": "柔以時升，巽而順，剛中而應，是以大亨。用見大人勿恤，有慶也。南征吉，志行也。", "47": "困，剛掩也。險以說，困而不失其所，亨，其唯君子乎？貞大人吉，以剛中也。有言不信，尚口乃窮也。", "48": "巽乎水而上水，井。井養而不窮也。改邑不改井，乃以剛中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。", "49": "革，水火相息，二女同居，其志不相得，曰革。巳日乃孚，革而信之。文明以說，大亨以正，革而當，其悔乃亡。天地革而四時成，湯武革命，順乎天而應乎人，革之時大矣哉。", "50": "鼎，象也。以木巽火，亨飪也。聖人亨以享上帝，而大亨以養聖賢。巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。", "51": "震，亨。震來虩虩，恐致福也。笑言啞啞，後有則也。震驚百里，驚遠而懼邇也。出可以守宗廟社稷，以爲祭主也。", "52": "艮，止也。時止則止，時行則行，動靜不失其時，其道光明。艮其止，止其所也。上下敵應，不相與也。是以不獲其身，行其庭不見其人，无咎也。", "53": "漸之進也，女歸吉也。進得位，往有功也。進以正，可以正邦也。其位剛得中也。止而巽，動不窮也。", "54": "歸妹，天地之大義也。天地不交，而萬物不興，歸妹人之終始也。說以動，所歸妹也。徵凶，位不當也。無攸利，柔乘剛也。", "55": "豐，大也。明以動，故豐。王假之，尚大也。勿憂宜日中，宜照天下也。日中則昃，月盈則食，天地盈虛，與時消息，而況於人乎？況於鬼神乎？", "56": "旅，小亨，柔得中乎外，而順乎剛，止而麗乎明，是以小亨旅貞吉也。旅之時義大矣哉。", "57": "重巽以申命，剛巽乎中正而志行。柔皆順乎剛，是以小亨，利有攸往，利見大人。", "58": "兌，說也。剛中而柔外，說以利貞，是以順乎天，而應乎人。說以先民，民忘其勞；說以犯難，民忘其死；說之大，民勸矣哉。", "59": "渙，亨。剛來而不窮，柔得位乎外而上同。王假有廟，王乃在中也。利涉大川，乘木有功也。", "60": "節，亨。剛柔分，而剛得中。苦節不可貞，其道窮也。說以行險，當位以節，中正以通。天地節而四時成，節以制度，不傷財，不害民。", "61": "中孚，柔在內而剛得中。說而巽，孚，乃化邦也。豚魚吉，信及豚魚也。利涉大川，乘木舟虛也。中孚以利貞，乃應乎天也。", "62": "小過，小者過而亨也。過以利貞，與時行也。柔得中，是以小事吉也。剛失位而不中，是以不可大事也。有飛鳥之象焉，有飛鳥遺之音，不宜上宜下，大吉；上逆而下順也。", "63": "既濟，亨，小者亨也。利貞，剛柔正而位當也。初吉，柔得中也。終止則亂，其道窮也。", "64": "未濟，亨，柔得中也。小狐汔濟，未出中也。濡其尾，無攸利，不續終也。雖不當位，剛柔應也。"};
var SHIYI_XIANG_DA = {"1": "天行健，君子以自強不息。", "2": "地勢坤，君子以厚德載物。", "3": "雲雷屯，君子以經綸。", "4": "山下出泉，蒙；君子以果行育德。", "5": "雲上於天，需；君子以飲食宴樂。", "6": "天與水違行，訟；君子以作事謀始。", "7": "地中有水，師；君子以容民畜衆。", "8": "地上有水，比；先王以建萬國，親諸侯。", "9": "風行天上，小畜；君子以懿文德。", "10": "上天下澤，履；君子以辨上下，定民志。", "11": "天地交，泰；後以財成天地之道，輔相天地之宜，以左右民。", "12": "天地不交，否；君子以儉德闢難，不可榮以祿。", "13": "天與火，同人；君子以類族辨物。", "14": "火在天上，大有；君子以遏惡揚善，順天休命。", "15": "地中有山，謙；君子以裒多益寡，稱物平施。", "16": "雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。", "17": "澤中有雷，隨；君子以嚮晦入宴息。", "18": "山下有風，蠱；君子以振民育德。", "19": "澤上有地，臨；君子以教思無窮，容保民無疆。", "20": "風行地上，觀；先王以省方，觀民設教。", "21": "雷電噬嗑；先王以明罰敕法。", "22": "山下有火，賁；君子以明庶政，無敢折獄。", "23": "山附於地，剝；上以厚下，安宅。", "24": "雷在地中，復；先王以至日閉關，商旅不行，後不省方。", "25": "天下雷行，物與無妄；先王以茂對時，育萬物。", "26": "天在山中，大畜；君子以多識前言往行，以畜其德。", "27": "山下有雷，頤；君子以慎言語，節飲食。", "28": "澤滅木，大過；君子以獨立不懼，遁世無悶。", "29": "水洊至，習坎；君子以常德行，習教事。", "30": "明兩作，離；大人以繼明照於四方。", "31": "山上有澤，鹹；君子以虛受人。", "32": "雷風，恆；君子以立不易方。", "33": "天下有山，遁；君子以遠小人，不惡而嚴。", "34": "雷在天上，大壯；君子以非禮弗履。", "35": "明出地上，晉；君子以自昭明德。", "36": "明入地中，明夷；君子以蒞衆，用晦而明。", "37": "風自火出，家人；君子以言有物，而行有恆。", "38": "上火下澤，睽；君子以同而異。", "39": "山上有水，蹇；君子以反身修德。", "40": "雷雨作，解；君子以赦過宥罪。", "41": "山下有澤，損；君子以懲忿窒欲。", "42": "風雷，益；君子以見善則遷，有過則改。", "43": "澤上於天，夬；君子以施祿及下，居德則忌。", "44": "天下有風，姤；後以施命誥四方。", "45": "澤上於地，萃；君子以除戎器，戒不虞。", "46": "地中生木，升；君子以順德，積小以高大。", "47": "澤無水，困；君子以致命遂志。", "48": "木上有水，井；君子以勞民勸相。", "49": "澤中有火，革；君子以治歷明時。", "50": "木上有火，鼎；君子以正位凝命。", "51": "洊雷，震；君子以恐懼修省。", "52": "兼山，艮；君子以思不出其位。", "53": "山上有木，漸；君子以居賢德善俗。", "54": "澤上有雷，歸妹；君子以永終知敝。", "55": "雷電皆至，豐；君子以折獄致刑。", "56": "山上有火，旅；君子以明慎用刑，而不留獄。", "57": "隨風，巽；君子以申命行事。", "58": "麗澤，兌；君子以朋友講習。", "59": "風行水上，渙；先王以享於帝立廟。", "60": "澤上有水，節；君子以制數度，議德行。", "61": "澤上有風，中孚；君子以議獄緩死。", "62": "山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。", "63": "水在火上，既濟；君子以思患而豫防之。", "64": "火在水上，未濟；君子以慎辨物居方。"};
var SHIYI_XIANG_XIAO = {"1": {"初九": "潛龍勿用，陽在下也。", "九二": "見龍在田，德施普也。", "九三": "終日乾乾，反覆道也。", "九四": "或躍在淵，進无咎也。", "九五": "飛龍在天，大人造也。", "上九": "亢龍有悔，盈不可久也。", "用九": "用九天德，不可爲首也。"}, "2": {"初六": "履霜堅冰，陰始凝也。馴致其道，至堅冰也。", "六二": "六二之動，直以方也。不習無不利，地道光也。", "六三": "含章可貞，以時發也。或從王事，知光大也。", "六四": "括囊无咎，慎不害也。", "六五": "黃裳元吉，文在中也。", "上六": "龍戰於野，其道窮也。", "用六": "用六永貞，以大終也。"}, "3": {"初九": "雖磐桓，志行正也。以貴下賤，大得民也。", "六二": "六二之難，乘剛也。十年乃字，反常也。", "六三": "即鹿無虞，以從禽也。君子舍之，往吝窮也。", "六四": "求而往，明也。", "九五": "屯其膏，施未光也。", "上六": "泣血漣如，何可長也。"}, "4": {"初六": "利用刑人，以正法也。", "九二": "子克家，剛柔接也。", "六三": "勿用取女，行不順也。", "六四": "困蒙之吝，獨遠實也。", "六五": "童蒙之吉，順以巽也。", "上九": "利用禦寇，上下順也。"}, "5": {"初九": "需於郊，不犯難行也。利用恆无咎，未失常也。", "九二": "需於沙，衍在中也。雖小有言，以終吉也。", "九三": "需於泥，災在外也。自我致寇，敬慎不敗也。", "六四": "需於血，順以聽也。", "九五": "酒食貞吉，以中正也。", "上六": "不速之客來，敬之終吉。雖不當位，未大失也。"}, "6": {"初六": "不永所事，訟不可長也。雖小有言，其辯明也。", "九二": "不克訟，歸逋竄也。自下訟上，患至掇也。", "六三": "食舊德，從上吉也。", "九四": "復即命渝，安貞不失也。", "九五": "訟元吉，以中正也。", "上九": "以訟受服，亦不足敬也。"}, "7": {"初六": "師出以律，失律凶也。", "九二": "在師中吉，承天寵也。王三錫命，懷萬邦也。", "六三": "師或輿尸，大無功也。", "六四": "左次无咎，未失常也。", "六五": "長子帥師，以中行也。弟子輿尸，使不當也。", "上六": "大君有命，以正功也。小人勿用，必亂邦也。"}, "8": {"初六": "比之初六，有它吉也。", "六二": "比之自內，不自失也。", "六三": "比之匪人，不亦傷乎？", "六四": "外比於賢，以從上也。", "九五": "顯比之吉，位正中也。舍逆取順，失前禽也。邑人不誡，上使中也。", "上六": "比之無首，無所終也。"}, "9": {"初九": "復自道，其義吉也。", "九二": "牽覆在中，亦不自失也。", "九三": "夫妻反目，不能正室也。", "六四": "有孚惕出，上合志也。", "九五": "有孚攣如，不獨富也。", "上九": "既雨既處，德積載也。君子徵凶，有所疑也。"}, "10": {"初九": "素履之往，獨行願也。", "九二": "幽人貞吉，中不自亂也。", "六三": "眇能視，不足以有明也。跛能履，不足以與行也。咥人之凶，位不當也。武人爲於大君，志剛也。", "九四": "愬愬終吉，志行也。", "九五": "夬履貞厲，位正當也。", "上九": "元吉在上，大有慶也。"}, "11": {"初九": "拔茅徵吉，志在外也。", "九二": "包荒得尚於中行，以光大也。", "九三": "無往不復，天地際也。", "六四": "翩翩不富，皆失實也。不戒以孚，中心願也。", "六五": "以祉元吉，中以行願也。", "上六": "城復於隍，其命亂也。"}, "12": {"初六": "拔茅貞吉，志在君也。", "六二": "大人否亨，不亂羣也。", "六三": "包羞，位不當也。", "九四": "有命无咎，志行也。", "九五": "大人之吉，位正當也。", "上九": "否終則傾，何可長也。"}, "13": {"初九": "出門同人，又誰咎也。", "六二": "同人於宗，吝道也。", "九三": "伏戎於莽，敵剛也。三歲不興，安行也。", "九四": "乘其墉，義弗克也。其吉，則困而反則也。", "九五": "同人之先，以中直也。大師相遇，言相剋也。", "上九": "同人於郊，志未得也。"}, "14": {"初九": "無交害，匪咎。艱則无咎，明辯晳也。", "九二": "大車以載，積中不敗也。", "九三": "公用亨於天子，小人害也。", "九四": "匪其彭无咎，明辯晳也。", "六五": "厥孚交如，信以發志也。威如之吉，易而無備也。", "上九": "大有上吉，自天祐也。"}, "15": {"初六": "謙謙君子，卑以自牧也。", "六二": "鳴謙貞吉，中心得也。", "九三": "勞謙君子，萬民服也。", "六四": "無不利撝謙，不違則也。", "六五": "利用侵伐，徵不服也。", "上六": "鳴謙，志未得也。可用行師，徵邑國也。"}, "16": {"初六": "初六鳴豫，志窮凶也。", "六二": "不終日貞吉，以中正也。", "六三": "盱豫有悔，位不當也。", "九四": "由豫大有得，志大行也。", "六五": "六五貞疾，乘剛也。恆不死，中未亡也。", "上六": "冥豫在上，何可長也。"}, "17": {"初九": "官有渝，從正吉也。出門交有功，不失也。", "六二": "系小子，弗兼與也。", "六三": "系丈夫，志舍下也。", "九四": "隨有獲，其義凶也。有孚在道，明功也。", "九五": "孚於嘉吉，位正中也。", "上六": "拘繫之，上窮也。"}, "18": {"初六": "幹父之蠱，意承考也。", "九二": "幹母之蠱，得中道也。", "九三": "幹父之蠱，終无咎也。", "六四": "裕父之蠱，往未得也。", "六五": "幹父用譽，承以德也。", "上九": "不事王侯，志可則也。"}, "19": {"初九": "鹹臨貞吉，志行正也。", "九二": "鹹臨吉無不利，未順命也。", "六三": "甘臨，位不當也。既憂之，咎不長也。", "六四": "至臨无咎，位當也。", "六五": "大君之宜，行中之謂也。", "上六": "敦臨之吉，志在內也。"}, "20": {"初六": "初六童觀，小人道也。", "六二": "闚觀女貞，亦可醜也。", "六三": "觀我生進退，未失道也。", "六四": "觀國之光，尚賓也。", "九五": "觀我生，觀民也。", "上九": "觀其生，志未平也。"}, "21": {"初九": "屨校滅趾，不行也。", "六二": "噬膚滅鼻，乘剛也。", "六三": "遇毒，位不當也。", "九四": "利艱貞吉，未光也。", "六五": "貞厲无咎，得當也。", "上九": "何校滅耳，聰不明也。"}, "22": {"初九": "舍車而徒，義弗乘也。", "六二": "賁其須，與上興也。", "九三": "永貞之吉，終莫之陵也。", "六四": "六四，當位疑也。匪寇婚媾，終無尤也。", "六五": "六五之吉，有喜也。", "上九": "白賁无咎，上得志也。"}, "23": {"初六": "剝牀以足，以滅下也。", "六二": "剝牀以辨，未有與也。", "六三": "剝之无咎，失上下也。", "六四": "剝牀以膚，切近災也。", "六五": "以宮人寵，終無尤也。", "上九": "君子得輿，民所載也。小人剝廬，終不可用也。"}, "24": {"初九": "不遠之復，以修身也。", "六二": "休復之吉，以下仁也。", "六三": "頻復之厲，義无咎也。", "六四": "中行獨復，以從道也。", "六五": "敦復無悔，中以自考也。", "上六": "迷復之凶，反君道也。"}, "25": {"初九": "無妄之往，得志也。", "六二": "不耕穫，未富也。", "六三": "行人得牛，邑人災也。", "九四": "可貞无咎，固有之也。", "九五": "無妄之藥，不可試也。", "上九": "無妄之行，窮之災也。"}, "26": {"初九": "有厲利已，不犯災也。", "九二": "輿說輹，中無尤也。", "九三": "利有攸往，上合志也。", "六四": "六四元吉，有喜也。", "六五": "六五之吉，有慶也。", "上九": "何天之衢，道大行也。"}, "27": {"初九": "觀我朵頤，亦不足貴也。", "六二": "六二徵凶，行失類也。", "六三": "十年勿用，道大悖也。", "六四": "顛頤之吉，上施光也。", "六五": "居貞之吉，順以從上也。", "上九": "由頤厲吉，大有慶也。"}, "28": {"初六": "藉用白茅，柔在下也。", "九二": "老夫女妻，過以相與也。", "九三": "棟橈之凶，不可以有輔也。", "九四": "棟隆之吉，不橈乎下也。", "九五": "枯楊生華，何可久也。老婦士夫，亦可醜也。", "上六": "過涉之凶，不可咎也。"}, "29": {"初六": "習坎入坎，失道凶也。", "九二": "求小得，未出中也。", "六三": "來之坎坎，終無功也。", "六四": "樽酒簋貳，剛柔際也。", "九五": "坎不盈，中未大也。", "上六": "上六失道，凶三歲也。"}, "30": {"初九": "履錯之敬，以闢咎也。", "六二": "黃離元吉，得中道也。", "九三": "日昃之離，何可久也。", "九四": "突如其來如，無所容也。", "六五": "六五之吉，離王公也。", "上九": "王用出徵，以正邦也。"}, "31": {"初六": "鹹其拇，志在外也。", "六二": "雖凶居吉，順不害也。", "九三": "鹹其股，亦不處也。志在隨人，所執下也。", "九四": "貞吉悔亡，未感害也。憧憧往來，未光大也。", "九五": "鹹其脢，志末也。", "上六": "鹹其輔頰舌，滕口說也。"}, "32": {"初六": "浚恆之凶，始求深也。", "九二": "九二悔亡，能久中也。", "九三": "不恆其德，無所容也。", "九四": "田無禽，久非其位也。", "六五": "婦人貞吉，從一而終也。夫子制義，從婦凶也。", "上六": "振恆在上，大無功也。"}, "33": {"初六": "遁尾之厲，不往何災也。", "六二": "執用黃牛，固志也。", "九三": "系遁之厲，有疾憊也。畜臣妾吉，不可大事也。", "九四": "君子好遁，小人否也。", "九五": "嘉遁貞吉，以正志也。", "上九": "肥遁無不利，無所疑也。"}, "34": {"初九": "壯於趾，其孚窮也。", "九二": "九二貞吉，以中也。", "九三": "小人用壯，君子罔也。", "九四": "藩決不羸，尚往也。", "六五": "喪羊於易，位不當也。", "上六": "不能退不能遂，不詳也。艱則吉，咎不長也。"}, "35": {"初六": "晉如摧如，獨行正也。裕无咎，未受命也。", "六二": "受茲介福，以中正也。", "六三": "衆允之志，上行也。", "九四": "鼫鼠貞厲，位不當也。", "六五": "失得勿恤，往有慶也。", "上九": "維用伐邑，道未光也。"}, "36": {"初九": "君子於行，義不食也。", "六二": "六二之吉，順以則也。", "九三": "南狩之志，乃大得也。", "六四": "入於左腹，獲心意也。", "六五": "箕子之貞，明不可息也。", "上六": "初登於天，照四國也。後入於地，失則也。"}, "37": {"初九": "閒有家，志未變也。", "六二": "六二之吉，順以巽也。", "九三": "家人嗃嗃，未失也。婦子嘻嘻，失家節也。", "六四": "富家大吉，順在位也。", "九五": "王假有家，交相愛也。", "上九": "威如之吉，反身之謂也。"}, "38": {"初九": "見惡人，以闢咎也。", "九二": "遇主於巷，未失道也。", "六三": "見輿曳，位不當也。無初有終，遇剛也。", "九四": "睽孤遇元夫，交孚也。", "六五": "厥宗噬膚，往有慶也。", "上九": "遇雨之吉，羣疑亡也。"}, "39": {"初六": "往蹇來譽，宜待也。", "六二": "王臣蹇蹇，終無尤也。", "九三": "往蹇來反，內喜之也。", "六四": "往蹇來連，當位實也。", "九五": "大蹇朋來，以中節也。", "上六": "往蹇來碩，志在內也。利見大人，以從貴也。"}, "40": {"初六": "剛柔之際，義无咎也。", "九二": "九二貞吉，得中道也。", "六三": "負且乘，亦可醜也。自我致戎，又誰咎也。", "九四": "解而拇，未當位也。", "六五": "君子有解，小人退也。", "上六": "公用射隼，以解悖也。"}, "41": {"初九": "巳事遄往，尚合志也。", "九二": "九二利貞，中以爲志也。", "六三": "一人行，三則疑也。", "六四": "損其疾，亦可喜也。", "六五": "六五元吉，自上祐也。", "上九": "弗損益之，大得志也。"}, "42": {"初九": "元吉无咎，下不厚事也。", "六二": "或益之，自外來也。", "六三": "益用凶事，固有之也。", "六四": "告公從，以益志也。", "九五": "有孚惠心，勿問之矣。惠我德，大得志也。", "上九": "莫益之，偏辭也。或擊之，自外來也。"}, "43": {"初九": "不勝而往，咎也。", "九二": "有戎勿恤，得中道也。", "九三": "君子夬夬，終无咎也。", "九四": "其行次且，位不當也。聞言不信，聰不明也。", "九五": "中行无咎，中未光也。", "上六": "無號之凶，終不可長也。"}, "44": {"初六": "繫於金柅，柔道牽也。", "九二": "包有魚，義不及賓也。", "九三": "其行次且，行未牽也。", "九四": "無魚之凶，遠民也。", "九五": "九五含章，中正也。有隕自天，志不捨命也。", "上九": "姤其角，上窮吝也。"}, "45": {"初六": "乃亂乃萃，其志亂也。", "六二": "引吉无咎，中未變也。", "六三": "往无咎，上巽也。", "九四": "大吉无咎，位不當也。", "九五": "萃有位，志未光也。", "上六": "齎諮涕洟，未安上也。"}, "46": {"初六": "允升大吉，上合志也。", "九二": "九二之孚，有喜也。", "九三": "升虛邑，無所疑也。", "六四": "王用亨於岐山，順事也。", "六五": "貞吉升階，大得志也。", "上六": "冥升在上，消不富也。"}, "47": {"初六": "入於幽谷，幽不明也。", "九二": "困於酒食，中有慶也。", "六三": "據於蒺蔾，乘剛也。入於其宮，不見其妻，不祥也。", "九四": "來徐徐，志在下也。雖不當位，有與也。", "九五": "劓刖，志未得也。乃徐有說，以中直也。利用祭祀，受福也。", "上六": "困於葛藟，未當也。動悔有悔，吉行也。"}, "48": {"初六": "井泥不食，下也。舊井無禽，時舍也。", "九二": "井谷射鮒，無與也。", "九三": "井渫不食，行惻也。求王明，受福也。", "六四": "井甃无咎，修井也。", "九五": "寒泉之食，中正也。", "上六": "元吉在上，大成也。"}, "49": {"初九": "鞏用黃牛，不可以有爲也。", "六二": "巳日革之，行有嘉也。", "九三": "革言三就，又何之矣。", "九四": "改命之吉，信志也。", "九五": "大人虎變，其文炳也。", "上六": "君子豹變，其文蔚也。小人革面，順以從君也。"}, "50": {"初六": "鼎顛趾，未悖也。利出否，以從貴也。", "九二": "鼎有實，慎所之也。我仇有疾，終無尤也。", "九三": "鼎耳革，失其義也。", "九四": "覆公餗，信如何也。", "六五": "鼎黃耳，中以爲實也。", "上九": "玉鉉在上，剛柔節也。"}, "51": {"初九": "震來虩虩，恐致福也。笑言啞啞，後有則也。", "六二": "震來厲，乘剛也。", "六三": "震蘇蘇，位不當也。", "九四": "震遂泥，未光也。", "六五": "震往來厲，危行也。其事在中，大無喪也。", "上六": "震索索，中未得也。雖凶无咎，畏鄰戒也。"}, "52": {"初六": "艮其趾，未失正也。", "六二": "不拯其隨，未退聽也。", "九三": "艮其限，危薰心也。", "六四": "艮其身，止諸躬也。", "六五": "艮其輔，以中正也。", "上九": "敦艮之吉，以厚終也。"}, "53": {"初六": "小子之厲，義无咎也。", "六二": "飲食衎衎，不素飽也。", "九三": "夫徵不復，離羣醜也。婦孕不育，失其道也。利用禦寇，順相保也。", "六四": "或得其桷，順以巽也。", "九五": "終莫之勝吉，得所願也。", "上九": "其羽可用爲儀，吉不可亂也。"}, "54": {"初九": "歸妹以娣，以恆也。跛能履吉，相承也。", "九二": "利幽人之貞，未變常也。", "六三": "歸妹以須，未當也。", "九四": "愆期之志，有待而行也。", "六五": "帝乙歸妹，不如其娣之袂良也。其位在中，以貴行也。", "上六": "上六無實，承虛筐也。"}, "55": {"初九": "雖旬无咎，過旬災也。", "六二": "有孚發若，信以發志也。", "九三": "豐其沛，不可大事也。折其右肱，終不可用也。", "九四": "豐其蔀，位不當也。日中見鬥，幽不明也。遇其夷主，吉行也。", "六五": "六五之吉，有慶也。", "上六": "豐其屋，天際翔也。窺其戶，闃其無人，自藏也。"}, "56": {"初六": "旅瑣瑣，志窮災也。", "六二": "得童僕貞，終無尤也。", "九三": "旅焚其次，亦以傷矣。以旅與下，其義喪也。", "九四": "旅於處，未得位也。得其資斧，心未快也。", "六五": "終以譽命，上逮也。", "上九": "以旅在上，其義焚也。喪牛於易，終莫之聞也。"}, "57": {"初六": "進退，志疑也。利武人之貞，志治也。", "九二": "紛若之吉，得中也。", "九三": "頻巽之吝，志窮也。", "六四": "田獲三品，有功也。", "九五": "九五之吉，位正中也。", "上九": "巽在牀下，上窮也。喪其資斧，正乎凶也。"}, "58": {"初九": "和兌之吉，行未疑也。", "九二": "孚兌之吉，信志也。", "六三": "來兌之凶，位不當也。", "九四": "商兌未寧，介疾有喜也。", "九五": "孚於剝，位正當也。", "上六": "上六引兌，未光也。"}, "59": {"初六": "初六之吉，順也。", "九二": "渙奔其機，得願也。", "六三": "渙其躬，志在外也。", "六四": "渙其羣，元吉。渙有丘，匪夷所思。", "九五": "王居无咎，正位也。", "上九": "渙其血，遠害也。"}, "60": {"初九": "不出戶庭，知通塞也。", "九二": "不出門庭凶，失時極也。", "六三": "不節之嗟，又誰咎也。", "六四": "安節之亨，承上道也。", "九五": "甘節之吉，居位中也。", "上六": "苦節貞凶，其道窮也。"}, "61": {"初九": "初九虞吉，志未變也。", "九二": "其子和之，中心願也。", "六三": "或鼓或罷，位不當也。", "六四": "馬匹亡，絕類上也。", "九五": "有孚攣如，位正當也。", "上九": "翰音登於天，何可長也。"}, "62": {"初六": "飛鳥以凶，不可如何也。", "六二": "不及其君，臣不可過也。", "九三": "從或戕之，凶如何也。", "九四": "弗過遇之，位不當也。往厲必戒，終不可長也。", "六五": "密雲不雨，已上也。", "上六": "弗遇過之，已亢也。"}, "63": {"初九": "曳其輪，義无咎也。", "六二": "七日得，以中道也。", "九三": "三年克之，憊也。", "六四": "終日戒，有所疑也。", "九五": "東鄰殺牛，不如西鄰之時也。實受其福，吉大來也。", "上六": "濡其首厲，何可久也。"}, "64": {"初六": "濡其尾，亦不知極也。", "九二": "九二貞吉，中以行正也。", "六三": "未濟徵凶，位不當也。", "九四": "貞吉悔亡，志行也。", "六五": "君子之光，其暉吉也。", "上九": "飲酒濡首，亦不知節也。"}};
var SHIYI_XUGUA = {"1": "有天地，然後萬物生焉。", "2": "盈天地之間者唯萬物，故受之以屯。（坤爲地，承乾天而萬物生）", "3": "屯者，盈也；屯者，物之始生也。", "4": "物生必蒙，故受之以蒙。蒙者，蒙也；物之稚也。", "5": "物稚不可不養也，故受之以需。需者，飲食之道也。", "6": "飲食必有訟，故受之以訟。", "7": "訟必有衆起，故受之以師。師者，衆也。", "8": "衆必有所比，故受之以比。比者，比也。", "9": "比必有所畜，故受之以小畜。", "10": "物畜然後有禮，故受之以履。", "11": "履而泰然後安，故受之以泰。泰者，通也。", "12": "物不可以終通，故受之以否。", "13": "物不可以終否，故受之以同人。", "14": "與人同者，物必歸焉，故受之以大有。", "15": "有大者不可以盈，故受之以謙。", "16": "有大而能謙必豫，故受之以豫。", "17": "豫必有隨，故受之以隨。", "18": "以喜隨人者必有事，故受之以蠱。蠱者，事也。", "19": "有事而後可大，故受之以臨。臨者，大也。", "20": "物大然後可觀，故受之以觀。", "21": "可觀而後有所合，故受之以噬嗑。嗑者，合也。", "22": "物不可以苟合而已，故受之以賁。賁者，飾也。", "23": "致飾然後亨則盡矣，故受之以剝。剝者，剝也。", "24": "物不可以終盡，剝窮上反下，故受之以復。", "25": "復則不妄矣，故受之以無妄。", "26": "有無妄然後可畜，故受之以大畜。", "27": "物畜然後可養，故受之以頤。頤者，養也。", "28": "不養則不可動，故受之以大過。", "29": "物不可以終過，故受之以坎。坎者，陷也。", "30": "陷必有所麗，故受之以離。離者，麗也。", "31": "有天地然後有萬物，有萬物然後有男女，有男女然後有夫婦……鹹，感也，夫婦之道由此始。", "32": "夫婦之道不可以不久也，故受之以恆。恆者，久也。", "33": "物不可以久居其所，故受之以遁。遁者，退也。", "34": "物不可以終遁，故受之以大壯。", "35": "物不可以終壯，故受之以晉。晉者，進也。", "36": "進必有所傷，故受之以明夷。夷者，傷也。", "37": "傷於外者必反其家，故受之以家人。", "38": "家道窮必乖，故受之以睽。睽者，乖也。", "39": "乖必有難，故受之以蹇。蹇者，難也。", "40": "物不可以終難，故受之以解。解者，緩也。", "41": "緩必有所失，故受之以損。", "42": "損而不已必益，故受之以益。", "43": "益而不已必決，故受之以夬。夬者，決也。", "44": "決必有所遇，故受之以姤。姤者，遇也。", "45": "物相遇而後聚，故受之以萃。萃者，聚也。", "46": "聚而上者謂之升，故受之以升。", "47": "升而不已必困，故受之以困。", "48": "困乎上者必反下，故受之以井。", "49": "井道不可不革，故受之以革。", "50": "革物者莫若鼎，故受之以鼎。", "51": "主器者莫若長子，故受之以震。震者，動也。", "52": "物不可以終動，止之，故受之以艮。艮者，止也。", "53": "物不可以終止，故受之以漸。漸者，進也。", "54": "進必有所歸，故受之以歸妹。", "55": "得其所歸者必大，故受之以豐。豐者，大也。", "56": "窮大者必失其居，故受之以旅。", "57": "旅而無所容，故受之以巽。巽者，入也。", "58": "入而後說之，故受之以兌。兌者，說也。", "59": "說而後散之，故受之以渙。渙者，離也。", "60": "物不可以終離，故受之以節。", "61": "節而信之，故受之以中孚。", "62": "有其信者必行之，故受之以小過。", "63": "有過物者必濟，故受之以既濟。", "64": "物不可窮也，故受之以未濟終焉。"};
var SHIYI_SHUOGUA = {"qian": "乾爲天，爲圜，爲君，爲父，爲玉，爲金，爲寒，爲冰，爲大赤，爲良馬，爲老馬，爲瘠馬，爲駁馬，爲木果。", "kun": "坤爲地，爲母，爲布，爲釜，爲吝嗇，爲均，爲子母牛，爲大輿，爲文，爲衆，爲柄。其於地也爲黑。", "zhen": "震爲雷，爲龍，爲玄黃，爲旉，爲大塗，爲長子，爲決躁，爲蒼筤竹，爲萑葦。其於馬也爲善鳴，爲馵足，爲作足，爲的顙。其於稼也爲反生。其究爲健，爲蕃鮮。", "xun": "巽爲木，爲風，爲長女，爲繩直，爲工，爲白，爲長，爲高，爲進退，爲不果，爲臭。其於人也爲寡發，爲廣顙，爲多白眼，爲近利市三倍。其究爲躁卦。", "kan": "坎爲水，爲溝瀆，爲隱伏，爲矯輮，爲弓輪。其於人也爲加憂，爲心病，爲耳痛，爲血卦，爲赤。其於馬也爲美脊，爲亟心，爲下首，爲薄蹄，爲曳。其於輿也爲多眚。爲通，爲月，爲盜。其於木也爲堅多心。", "li": "離爲火，爲日，爲電，爲中女，爲甲冑，爲戈兵。其於人也爲大腹。爲乾卦，爲鱉，爲蟹，爲蠃，爲蚌，爲龜。其於木也爲科上槁。", "gen": "艮爲山，爲徑路，爲小石，爲門闕，爲果蓏，爲閽寺，爲指，爲狗，爲鼠，爲黔喙之屬。其於木也爲堅多節。", "dui": "兌爲澤，爲少女，爲巫，爲口舌，爲毀折，爲附決。其於地也爲剛滷。爲妾，爲羊。"};
var SHIYI_XICI = {"1": "《繫辭》：夫乾，天下之至健也，德行恆易以知險。……崇高莫大乎富貴，備物致用，立成器以爲天下利，莫大乎聖人。", "2": "《繫辭》：夫坤，天下之至順也，德行恆簡以知阻。……闔戶謂之坤，闢戶謂之乾，一闔一闢謂之變，往來不窮謂之通。", "9": "《繫辭》：小畜，先事而戒者也。……履和而至，謙尊而光，復小而辨於物，恆雜而不厭，損先難而後易，益長裕而不設，困窮而通，井居其所而遷，巽稱而隱。", "10": "《繫辭》：履，德之基也。……履和而至。", "15": "《繫辭》：謙，德之柄也。……謙尊而光。", "16": "《繫辭》：豫，德之豫也。", "24": "《繫辭》：復，德之本也。……復小而辨於物。", "25": "《繫辭》：無妄，災也。", "26": "《繫辭》：大畜，時也。", "27": "《繫辭》：頤，德之養也。", "28": "《繫辭》：大過，顛也。", "31": "《繫辭》：鹹，速也。", "32": "《繫辭》：恆，德之固也。……恆雜而不厭。", "33": "《繫辭》：遁，德之辨也。", "34": "《繫辭》：大壯，止也。", "41": "《繫辭》：損，德之修也。……損先難而後易。", "42": "《繫辭》：益，德之裕也。……益長裕而不設。", "43": "《繫辭》：夬，決也，剛決柔也。", "44": "《繫辭》：姤，遇也，柔遇剛也。", "47": "《繫辭》：困，德之辨也。……困窮而通。", "48": "《繫辭》：井，德之地也。……井居其所而遷。", "49": "《繫辭》：革，去故也。", "50": "《繫辭》：鼎，取新也。", "57": "《繫辭》：巽，德之制也。……巽稱而隱。", "58": "《繫辭》：兌，德之悅也。", "63": "《繫辭》：既濟，定也。", "64": "《繫辭》：未濟，男之窮也。"};

var JIJIE = {"1": "(乾下乾上)。乾：元、享、利、贞。\n案：《说卦》：乾，健也。言天之体以健为用，运行不息，应化无穷，故圣人则之。欲使人法天之用，不法天之体，故名乾，不名天也。\n《子夏传》曰：元，始也。亨，通也。利，和也。贞，正也。言乾禀纯阳之性，故能首出庶物，各得元始、开通、和谐、贞固，不失其宜。是以君子法乾而行四德，故曰“元、亨、利、贞”矣。\n初九：潜龙勿用。\n崔觐曰：九者，老阳之数，动之所占，故阳称焉。潜，隐也。龙下隐地，潜德不彰，是以君子韬光待时，未成其行。故曰“勿用”。\n《子夏传》曰：龙，所以象阳也。\n马融曰：物莫大于龙，故借龙以喻天之阳气也。初九，建子之月。阳气始动于黄泉，既未萌芽，犹是潜伏，故曰“潜龙”也。\n沈驎士曰：称龙者，假象也。天地之气有升降，君子之道有行藏。龙之为物，能飞能潜，故借龙比君子之德也。初九既尚潜伏，故言“勿用”。\n干宝曰：位始，故称初。阳重，故称九。阳在初九，十一月之时，自复来也。初九，甲子天正之位，而乾元所始也。阳处三泉之下，圣德在愚俗之中，此文王在羑里之爻也。虽有圣明之德，未被时用，故曰“勿用”。\n九二：见龙在田，利见大人。\n王弼曰：出潜离隐，故曰“见龙”。处于地上，故曰“在田”。德施周普，居中不偏，虽非君位，君之德也。初则不彰，三则乾乾，四则或跃，上则过亢。利见大人，唯二五焉。\n郑玄曰：二于三才为地道，地上即田，故称“田”也。\n干宝曰：阳在九二，十二月之时，自临来也。二为地上，田在地之表，而有人功者也。阳气将施，圣人将显，此文王免于羑里之日也。故曰“利见大人”。\n九三：君子终日乾乾，夕惕，若厉，无咎。\n郑玄曰：三于三才为人道。有乾德而在人道，君子之象。\n虞翻曰：谓阳息至三，二变成离。离为日，坤为夕。\n荀爽曰：日以喻君。谓三居下体之终，而为之君，承乾行乾，故曰“乾乾”。夕惕以喻臣。谓三臣于五，则疾修柔顺，危去阳行，故曰“无咎”。\n干宝曰：爻以气表，繇以龙兴，嫌其不关人事，故著君子焉。阳在九三，正月之时，自泰来也。阳气始出地上，而接动物。人为灵，故以人事成天地之功者，在于此爻焉。故君子以之忧深思远，乾夕匪懈。仰忧嘉会之不序，俯惧义和之不逮。反复天道，谋始反终。故曰“终日乾乾”。此盖文王反国大理其政之日也。凡无咎者，忧中之喜，善补过者也。文恨早耀，文明之德，以蒙大难，增修柔顺，以怀多福，故曰“无咎”矣。\n九四：或跃在渊，无咎。\n崔觐曰：言君子进德修业，欲及于时。犹龙自试跃天，疑而处渊。上下进退，非邪离群。故“无咎”。\n干宝曰：阳在九四，二月之时，自大壮来也。四虚中也。跃者，暂起之言，既不安于地，而未能飞于天也。四，以初为应。渊，谓初九甲子，龙之所由升也。或之者，疑之也。此武王举兵孟津，观衅而退之爻也。守柔顺，则逆天人之应；通权道，则违经常之教。故圣人不得已而为之，故其辞疑矣。\n九五：飞龙在天，利见大人。\n郑玄曰：五于三才为天道。天者，清明无形，而龙在焉，飞之象也。\n虞翻曰：谓四已变，则五体离。离为飞，五在天，故“飞龙在天，利见大人”也。谓若庖牺观象于天，造作八卦，备物致用，以利天下，故曰“飞龙在天”。天下之所利见也。\n干宝曰：阳在九五，三月之时，自夬来也。五在天位，故曰“飞龙”。此武王克纣正位之爻也。圣功既就，万物既睹，故曰“利见大人”矣。\n上九：亢龙有悔。\n王肃曰：穷高曰亢。知进忘退，故“悔”也。\n干宝曰：阳在上九，四月之时也。亢，过也。乾体既备，上位既终。天之鼓物，寒暑相报；圣人治世，威德和济；武功既成，义在止戈。盈而不反，必陷于“悔”。案：以人事明之，若桀放于南巢，汤有惭德，斯类是也。\n用九：见群龙无首，吉。\n刘瓛曰：总六爻纯阳之义，故曰“用九”也。王弼曰：九，天之德也。能用天德，乃见群龙之义焉。夫以刚健而居人之首，则物之所不与也。以柔顺而为不正，则佞邪之道也。故乾吉在无首，坤利在永贞矣。\n彖曰：\n刘瓛曰：彖者，断也，断一卦之才也。\n大哉乾元，\n《九家易》曰：阳称大。六爻纯阳，故曰“大”。乾者纯阳，众卦所生，天之象也。观乾之始，以知天德，惟天为大，惟乾则之，故曰“大哉”。元者，气之始也。\n万物资始，\n荀爽曰：谓分为六十四卦，万一千五百二十册，皆受始于乾也。册取始于乾，犹万物之生禀于天。\n乃统天。\n《九家易》曰：乾之为德，乃统继天道，与天合化也。\n云行雨施，品物流形。\n虞翻曰：已成既济，上坎为云，下坎为雨，故“云行雨施”。乾以云雨，流坤之形，万物化成，故曰“品物流形”也。\n大明终始，\n荀爽曰：乾起坎，而终于离。坤起于离，而终于坎。离坎者，乾坤之家，而阴阳之府，故曰“大明终始”也。\n六位时成，\n荀爽曰：六爻随时而成乾。\n时乘六龙以御天。\n侯果曰：大明，日也。六位，天地四时也。六爻效彼而作也。大明以昼夜为终始，六位以相揭为时成。言乾乘六气而陶冶变化，运四时而统御天地，故曰“时乘六龙以御天”也。故《乾凿度》曰：“日月终始万物”，是其义也。\n乾道变化，各正性命。保合大和，乃利贞。首出庶物，万国咸宁。\n刘瓛曰：阳气为万物之所始，故曰“首出庶物”。立君而天下皆宁，故曰“万国咸宁”也。\n《象》曰：\n案：象者，象也，取其法象卦爻之德。\n天行健，\n何妥曰：天体不健，能行之德健也。犹如地体不顺，承弱之势顺也。所以乾卦独变名为健者。宋衷曰：昼夜不懈，以健详其名。余卦各当名，不假于详矣。\n君子以自强不息。\n虞翻曰：君子谓三。乾健，故强。天一日一夜过周一度，故自强不息。老子曰：自胜者强。\n干宝曰：言君子通之于贤也。凡勉强以进德，不必须在位也。故尧舜一日万机，文王日昃不暇食，仲尼终夜不寝，颜子欲罢不能，自此以下，莫敢淫心舍力。故曰“自强不息”矣。\n潜龙勿用，阳在下也。\n荀爽曰：气微位卑，虽有阳德，潜藏在下，故曰“勿用”也。\n见龙在田，德施普也。\n荀爽曰：见者，见居其位。田，谓坤也。二当升坤五。故曰“见龙在田”。大人，谓天子。见据尊位，临长群阴，德施于下，故曰“德施普也”。\n终日乾乾，反复道也。\n虞翻曰：至三体复，故“反复道”，谓否泰反其类也。\n或跃在渊，进无咎也。\n荀爽曰：乾者，君卦。四者，阴位。故上跃居五者，欲下居坤初，求阳之正。地下称渊也。阳道乐进，故曰“进无咎也”。\n飞龙在天，大人造也。\n荀爽曰：飞者，喻无所拘。天者，首事造制。大人造法，见居天位，圣人作为万物睹，是其义也。\n亢龙有悔，盈不可久也。\n《九家易》曰：阳当居五，今乃居上，故曰“盈”也。亢极失位，当下之坤三，故曰“盈不可久”，若太上皇者也。下之坤三，屈为诸侯，故曰“悔”者也。\n用九，天德不可为首也。\n宋衷曰：用九，六位皆九，故曰“见群龙”。纯阳则天德也。万物之始，莫能先之，不可为首。先之者凶，随之者吉，故曰“无首，吉”。\n《文言》曰：\n刘瓛曰：依文而言其理，故曰“文言”。\n姚信曰：乾坤为门户。文说乾坤，六十二卦皆放焉。\n元者，善之长也。\n《九家易》曰：乾者，君卦也。六爻皆当为君，始而大通，君德会合，故元为“善之长也”。\n亨者，嘉之会也。\n《九家易》曰：通者，谓阳合而为乾。众善相继，故曰“嘉之会也”。\n利者，义之和也。\n荀爽曰：阴阳相合，各得其宜，然后利矣。\n贞者，事之干也。\n荀爽曰：阴阳正而位当，则可以干举万事。\n君子体仁，足以长人；\n何妥曰：此明圣人则天，合五常也。仁为木，木主春，故配元为四德之首。君子体仁，故有长人之义也。\n嘉会，足以合礼；\n何妥曰：礼是交接会通之道，故以配通。五礼有吉凶宾军嘉，故以嘉合于礼也。\n利物，足以和义；\n何妥曰：利者，裁成也。君子体此利以利物，足以合于五常之义。\n贞固，足以干事。\n何妥曰：贞，信也。君子贞正，可以委任于事。故《论语》曰：敬事而信，故干事而配信也。\n案：此释非也。夫在天成象者，乾元、亨、利、贞也。言天运四时，以生成万物。在地成形者，仁、义、礼、智、信也。言君法五常，以教化于人。元为善长，故能体仁。仁主春生，东方木也。亨为嘉会，足以合礼。礼主夏养，南方火也。利为物宜，足以和义。义主秋成，西方金也。贞为事干，以配于智。智主冬藏，北方水也。故孔子曰：仁者乐山，智者乐水，则智之明证矣。不言信者，信主土，而统属于君。故中孚云：信及豚鱼，是其义也。若首出庶物，而四时不忒者，乾之象也。厚德载物，而五行相生者，土之功也。土居中宫，分王四季，亦由人君无为皇极，而奄有天下。水火金木，非土不载。仁义礼智，非君不弘。信既统属于君，故先言乾。而后不言信，明矣。\n君子行此四德者，故曰：乾，元、亨、利、贞。\n干宝曰：夫纯阳，天之精气。四行，君之懿德。是故乾冠卦首，辞表篇目，明道义之门在于此矣，犹春秋之备五始也。故夫子留意焉。然则体仁正已，所以化物；观运知时，所以顺天；气用随宜，所以利民；守正一业，所以定俗也。乱则败礼其教淫；逆则拂时，其功否；错则妨用，其事废；忘则失正，其官败。四德者，文王所由兴。四愆者，商纣所由亡。\n初九曰：潜龙勿用，何谓也？\n何妥曰：夫子假设疑问也。后五爻皆放此也。\n子曰：龙德而隐者也。\n何妥曰：此直答言圣人有隐显之龙德。今居初九穷下之地，隐而不见，故云“勿用”矣。\n不易世，\n崔觐曰：言据当潜之时，不易乎世而行者，龙之德也。\n不成名。\n郑玄曰：当隐之时，以从世俗，不自殊异，无所“成名”也。\n遁世无闷，\n崔觐曰：道虽不行，达理“无闷”也。\n不见是而无闷。\n崔觐曰：世人虽不已是，而已知不违道，故“无闷”。\n乐则行之，忧则违之，\n虞翻曰：阴出初震，为乐为行，故“乐则行之”。坤死称忧，隐在坤中，遁世无逆流，故“忧则违之”也。\n确乎其不可拔，潜龙也。\n虞翻曰：确，刚貌也。乾刚潜初，坤乱于上。君子弗用，隐在下位。确乎难拔，潜龙之志也。\n九二曰：见龙在田，利见大人，何谓也？子曰：龙德而正中者也。\n虞翻曰：中下之中，二非阳位，故明言能“正中”也。\n庸言之信，\n荀爽曰：处和应坤，故曰“信”。\n庸行之谨。\n《九家易》曰：以阳居阴位，故曰“谨”也。庸，常也。谓言常以信，行常以谨矣。\n闲邪存其诚，\n宋衷曰：闲，防也。防其邪而存诚焉。二在非其位，故以“闲邪”言之。能处中和，故以“存诚”言之。\n善世而不伐，\n《九家易》曰：阳升居五，处中居上，始以美德利天下。不言所利，即是不伐。故老子曰：上德不德，是以有德。此之谓也。\n德博而化。\n荀爽曰：处五据坤，故“德博”。群阴顺从，故物“化”也。\n《易》曰：见龙在田，利见大人，君德也。\n虞翻曰：阳始触阴，当升五为君。时舍于二，宜利天下。直方而大德，无不利。明言君德，地数始二。故称“易曰”。\n九三曰：君子终日乾乾，夕惕若，厉，无咎。何谓也？子曰：君子进德修业。\n虞翻曰：乾为德，坤为业，以乾通坤，谓为“进德修业”。\n宋衷曰：业，事也。三为三公，君子处公位，所以“进德修业”也。\n忠信，所以进德也。\n翟玄曰：忠于五，所以修德也。\n崔觐曰：推忠于人，以信待物，故其德日新也。\n修辞立其诚，所以居业也。\n荀爽曰：修辞谓“终曰乾乾”。立诚，谓“夕惕若厉”。居业，谓“居三”也。\n翟玄曰：居三修其教令，立共诚信，民敬而从之。\n知至至之，可与言几也。\n翟玄曰：知五可至而“至之”，故可与行几微之事也。\n知终终之，可与存义也。\n姚信曰：知终者，可以知始终。终谓三也。义者，宜也。知存知亡，君子之宜矣。\n崔觐曰：君子，喻文王也。言文王进德修业，所以贻厥武王，至于九五。至于九五，可与进修意合，故言“知至至之”，可与言微也。知天下归周，三分有二，以服事殷，终于臣道。终于臣道，可与进修意合，故言“知终终之，可与存义”。\n是故居上位而不骄。\n虞翻曰：天道三才。一乾而以至三乾成，故为“上”。“夕惕若厉”，故“不骄”也。\n在下位而不忧。\n虞翻曰：“下位”谓初。隐于初，忧则违之，故“不忧”。\n故乾乾因其时而惕，虽危无咎矣。\n王弼曰：惕，怵惕也。处事之极，失时败废，懈怠则旷。故“乾乾因其时而惕，虽危无咎”。\n九四曰：或跃在渊，无咎，何谓也？子曰：上下无常，非为邪也。\n荀爽曰：乾者，君卦。四者，臣位也。故欲上跃。居五下者，当下居坤初，得阳正位。故曰：“上下无常，非为邪也”。\n进退无恒，非离群也。\n荀爽曰：进，谓居五。退，谓居初。故“进退无恒，非离群也”。\n君子进德修业，欲及时也，故无咎。\n崔觐曰：至公欲及时济人，故“无咎”也。\n九五曰：飞龙在天，利见大人，何谓也？子曰：同声相应。\n虞翻曰：谓震巽也。庖牺观变而放八卦，雷风相薄，故“相应”也。\n张璠曰：天者，阳也。君者，阳也。雷风者，天之声。号令者，君之声。明君与天地相应，合德同化，动静不违也。\n同气相求。\n虞翻曰：谓艮兑山泽通气，故“相求”也。\n崔觐曰：方诸与月，同有阴气，相感则水生。阳燧与日，同有阳气，相感则火出也。\n水流湿，\n荀爽曰：阳动之坤而为坎，坤者纯阴，故曰“湿”也。\n火就燥。\n荀爽曰：阴动之乾而成离，乾者纯阳，故曰：“燥”也。\n虞翻曰：离上而坎下，水火不相射。\n崔觐曰：决水先流湿，然火先就燥。\n云从龙，\n荀爽曰：龙，喻王者。谓乾二之坤五为坎也。\n虞翻曰：乾为龙，云生天，故“从龙”也。\n风从虎。\n荀爽曰：虎，喻国君。谓坤五之乾二为巽，而从三也。三者，下体之君，故以喻国君。\n虞翻曰：坤为虎，风生地，故“从虎”也。\n圣人作而万物睹。\n虞翻曰：睹，见也。圣人则庖牺，合德乾五，造作八卦，以通神明之德，以类万物之情。五动成离，日出照物皆相见，故曰“圣人作而万物睹”也。\n陆绩曰：阳气至五，万物茂盛，故譬以圣人在天子之位，功成制作，万物咸见之矣。\n本乎天者亲上，\n荀爽曰：谓乾九二，本出于乾，故曰“本乎天”。而居坤五，故曰“亲上”。\n本乎地者亲下，\n荀爽曰：谓坤六五，本出于坤，故曰：“本乎地”。降居乾二，故曰“亲下”也。\n崔觐曰：谓动物亲于天之动，植物亲于地之静。\n则各从其类也。\n虞翻曰：“方以类聚，物以群分”。“乾道变化，各正性命”。“触类而长”，故“各从其类”。\n上九曰：亢龙有悔，何谓也？子曰：贵而无位，\n荀爽曰：在上，故“贵”。失正，故“无位”。\n高而无民，\n何妥曰：既不处九五帝王之位，故“无民”也。夫率土之滨，莫非王臣。既非王位，则民不隶属也。\n贤人在下位，\n荀爽曰：谓上应三，三阳德正，故曰“贤人”。别体在下，故曰“在下位”。\n而无辅，\n荀爽曰：两阳无应，故“无辅”。\n是以动而有悔也。\n荀爽曰：升极当降，故有“悔”。\n潜龙勿用，下也。\n何妥曰：此第二章，以人事明之。当帝舜耕渔之日，卑贱处下，未为时用，故云“下”。\n见龙在田，时舍也。\n何妥曰：此夫子洙泗之日，开张业艺，教授门徒，自非通舍，孰能如此。虞翻曰：二非王位，时暂“舍”也。\n终日乾乾，行事也。\n何妥曰：此当文王为西伯之时，处人臣之极，必须事上接下，故言“行事”也。\n或跃在渊，自试也。\n何妥曰：欲进其道，犹复疑惑。此当武王观兵之日，欲以试观物情也。\n飞龙在天，上治也。\n何妥曰：此当尧、舜冕旒之日，以圣德而居高位，在上而治民也。\n亢龙有悔，穷之灾也。\n案：此当桀、纣失位之时。亢极骄盈，故致悔恨穷毙之灾祸也。\n乾元用九，天下治也。\n案：此当三皇五帝礼让之时。垂拱无为，而天下治矣。\n王弼曰：此一章全以人事明之也。九，阳也。阳，刚直之物也。夫能全用刚直，放远善柔，非天下之至治，未之能也。故“乾元用九”，则“正下治也”。夫识物之动，则其所以然之理，皆可知也。龙之为德，不为妄者也。潜而勿用乎？必穷处于下也。见而在田，必以时之通舍也。以爻为人，以位为时，人不妄动，则时皆可知也。文王明夷，则主可知矣。仲尼旅人，则国可知矣。\n潜龙勿用，阳气潜藏。\n何妥曰：此第三章，以天道明之。当十一月，阳气虽动，犹在地中，故曰“潜龙”也。\n见龙在田，天下文明。\n案：阳气上达于地，故曰“见龙在田”。百草萌牙孚甲，故曰“文明”。\n孔颖达曰：先儒以为九二当太蔟之月，阳气见地。则九三为建辰之月，九四为建午之月，九五为建申之月，上九为建戌之月，群阴既盛，上九不得言与时偕极。先儒此说，于理稍乖。此乾之阳气渐生，似圣人渐进，宜据十一月之后，建巳之月已来。此九二爻当建丑建寅之间，于时地之萌牙物有生者，即是阳气发见之义也。但阴阳二气，共成岁功。故阴兴之时，仍有阳在；阳生之月，尚有阴气。所以六律六吕，阴阳相关，取象论义，与此不殊也。\n终日乾乾，与时偕行。\n何妥曰：此当三月。阳气浸长，万物将盛，与天之运俱行不息也。\n或跃在渊，乾道乃革。\n何妥曰：此当五月。微阴初起，阳将改变，故云“乃革”也。\n飞龙在天，乃位乎天德。\n何妥曰：此当七月。万物盛长，天功大成，故云“天德”也。\n亢龙有悔，与时偕极。\n何妥曰：此当九月。阳气大衰，向将极尽，故云“偕极”也。\n乾元用九，乃见天则。\n何妥曰：阳消，天气之常。天象法则，自然可见。\n王弼曰：此一章全说天气以明之也。九，刚直之物，唯乾体能用之。用纯刚以观天，天则可见矣。\n乾元者，始而亨者也。\n虞翻曰：乾始开通，以阳通阴，故始通。\n利贞者，性情也。\n干宝曰：以施化利万物之性，以纯一正万物之情。\n王弼曰：不为乾元，何能通物之始。不性其情，何能久行其正。是故始而亨者，必乾元也。利而正者，必性情也。\n乾始而以美利利天下，\n虞翻曰：美利谓云行雨施，品物流形，故“利天下”也。\n不言所利，大矣哉！\n虞翻曰：天何言哉！四时行焉，百物生焉，故利者大也。\n大哉乾乎，刚健中正，纯粹精也。\n崔觐曰：不杂曰纯，不变曰粹。言乾是纯粹之精，故有刚、健、中、正之四德也。\n六爻发挥，旁通情也。\n陆绩曰：乾六爻发挥变动，旁通于坤；坤来入乾，以成六十四卦，故曰“旁通情也”。\n时乘六龙，\n《九家易》曰：谓时之元气，以王而行，履涉众爻，是“乘六龙”也。\n以御天也。\n荀爽曰：御者，行也。阳升阴降，天道行也。\n云行雨施，天下平也。\n荀爽曰：乾升于坤，曰“云行”。坤降于乾，曰“雨施”。乾坤二卦，成雨既济。阴阳和均，和而其正，故曰“天下平”。\n君子以成德为行，\n干宝曰：君子之行，动静可观，进退可度，动以成德，无所苟行也。\n日可见之行也。\n虞翻曰：谓初。乾称君子。阳出成为上德，云行雨施则成离，日新之谓上德，故“日可见之行”。\n潜之为言也，隐而未见，行而未成，是以君子弗用也。\n荀爽曰：“隐而未见”，谓居初也，“行而未成”，谓行之坤四。阳居阴位，未成为君。乾者，君卦也。不成为君，故不用也。\n君子学以聚之，问以辩之，\n虞翻曰：谓二。阳在二。兑在口；震为言，为讲论；坤为文，故“学以聚之，问以辩之”。兑象，君子以朋友讲习。\n宽以居之，仁以行之。\n虞翻曰：震为宽，仁为行，谓居宽行仁，德博而化也。\n《易》曰：见龙在田，利见大人，君德也。\n虞翻曰：重言君德者，大人善世不伐。信有君德，后天而奉天时，故详言之。\n九三：重刚而不中。\n虞翻曰：以乾接乾，故“重刚”。位非二五，故“不中”也。\n上不在天，下不在田。\n何妥曰：上不及五，故云“不在天”。下已过二，故云“不在田”。处此之时，实为危厄也。\n故乾乾因其时而惕，虽危无咎矣。\n何妥曰：处危惧之地，而能乾乾怀厉，至夕犹惕，乃得“无咎”矣。\n九四：重刚而不中，\n案：三居下卦之上，四处上卦之下，俱非得中，故曰“重刚而不中”也。\n上不在天，下不在田，中不在人，\n侯果曰：案下《系》：易有天道，有地道，有人道，兼三才而两之，谓两爻为一才也。初兼二，地也。三兼四，人也。五兼六，天也。四是兼才，非正，故言“不在人”也。\n故或之。或之者，疑之也。故无咎。\n虞翻曰：非其位，故疑之也。\n夫大人者，\n《乾凿度》曰：圣明德备，曰“大人”也。\n与天地合其德，\n荀爽曰：与天合德，谓居五也。与地合德，谓居二也。\n案：谓抚育无私，同天地之覆载。\n与日月合其明，\n荀爽曰：谓坤五之乾二成离，离为日。乾二之坤五为坎，坎为月。\n案：威恩远被，若日月之照临也。\n与四时合其序，\n翟玄曰：乾坤有消息，从四时来也。\n又案：赏罚严明，顺四时之序也。\n与鬼神合其吉凶，\n虞翻曰：谓乾神合吉，坤鬼合凶，以乾之坤，故“与鬼神合其吉凶”。\n案：祸淫福善，叶鬼神之吉凶矣。\n先天而天弗违，\n虞翻曰：乾为天、为先。大人在乾五，乾五之坤五，天象在先。故“先天而天弗违”。\n崔觐曰：行人事，合天心也。\n后天而奉天时。\n虞翻曰：奉，承行。乾四之坤初成震，震为后也，震春兑秋，坎冬离夏，四时象具。故“后天而奉天时”。谓承天时，行顺也。\n崔觐曰：奉天时布政，圣政也。\n天且弗违，况于人乎？\n荀爽曰：人谓三。\n况于鬼神乎？\n荀爽曰：神谓天，鬼谓地也。\n案：大人惟德动天，无远不届。鬼神飨德，夷狄来宾。人神叶从，犹风偃草，岂有违忤哉。\n亢之为言也，知进而不知退，\n荀爽曰：阳位在五，今乃居上，故曰“知进而不知退”也。\n知存而不知亡，\n荀爽曰：在上当阴，今反为阳，故曰“知存而不知亡”也。\n知得而不知丧，\n荀爽曰：得谓阳，丧谓阴。\n案，此论人君骄盈过亢，必有丧亡。若殷纣招牧野之灾，太康遘洛水之怨，即其类矣。\n其唯圣人乎！知进退存亡而不失其正者，其唯圣人乎！\n荀爽曰：进谓居五。退谓居二。存谓五，为阳位。亡谓上，为阴位也。再出圣人者，上圣人谓五，下圣人谓二也。\n案：此则乾元用九，天下治也。言大宝圣君，若能用九天德者，垂拱无为，刍狗万物，生而不有，功成不居，百姓日用而不知，岂荷生成之德者也。此则三皇五帝，乃圣乃神，保合太和，而天下自治矣。今夫子《文言》再称圣人者，叹美用九之君，能知进退存亡，而不失其正，故得“大明终始，万国咸宁，时乘六龙，以御天也”。斯即有始有卒者，其唯圣人乎！是其义也。\n崔觐曰：谓失其正者，若燕哙让位于子之之类是也。\n案：三王五伯，揖让风颓，专恃干戈，递相征伐，失正忘退，其徒实繁。略举宏纲，断可知矣。", "2": "(坤下坤上)。坤：元亨，利牝马之贞。\n干宝曰：阴气之始，妇德之常，故称“元”。与乾合德，故称“亨”。行天者莫若龙，行地者莫若马，故乾以龙繇，坤以马象也。坤，阴类，故称“利牝马之贞”矣。\n虞翻曰：谓阴极阳生，乾流坤形，坤含光大，凝乾之元，终于坤亥，出乾初子，品物咸亨，故“元亨”也。坤为牝，震为马，初动得正，故“利牝马之贞”矣。\n君子有攸往，先迷，后得主，利。\n卢氏曰：坤，臣道也、妻道也。后而不先，先则迷失道矣，故曰“先迷”。阴以阳为主，当后而顺之，则利。故曰“后得主，利”。\n《九家易》曰：坤为牝，为迷。\n西南得朋，东北丧朋，安贞吉。\n崔觐曰：妻道也。西方坤兑，南方巽离，二方皆阴，与坤同类，故曰“西南得朋”。东方艮震，北方乾坎，二方皆阳，与坤非类，故曰“东北丧朋”。以喻在室得朋，犹迷于失道；出嫁丧朋，乃顺而得常。安于承天之正，故言“安贞吉”也。　　《彖》曰：至哉坤元，\n《九家易》曰：谓乾气至坤，万物资受而以生也。坤者纯阴，配乾生物，亦善之始，地之象也，故又叹言至美。\n万物资生，\n荀爽曰：谓万一千五百二十策，皆受始于乾，由坤而生也。策生于坤，犹万物成形，出乎地也。\n乃顺承天。\n刘瓛曰：万物资物于地，故地承天而生也。　　坤厚载物，\n蜀才曰：坤以广厚之德，载含万物，无有穷竟也。\n德合无疆。\n蜀才曰：天有无疆之德，而坤合之，故云“德合无疆”也。\n含宏光大，\n荀爽曰：乾二居坤五为含，坤五居乾二为弘，坤初居乾四为光，乾四居坤初为大也。\n品物咸亨。\n荀爽曰：天地交，万物生，故“咸亨”。\n崔觐曰：含育万物为弘，光华万物为大，动植各遂其性，故言“品物咸亨”也。　　牝马地类，行地无疆，\n侯果曰：地之所以含弘物者，以其顺而承天也。马之所以行地远者，以其柔而伏人也。而又牝马，顺之至也。诫臣子当至顺，故作易者取象焉。\n柔顺利贞。君子攸行。\n《九家易》曰：谓坤爻本在柔顺阴位，则利贞之。乾则阳爻来据之，故曰“君子攸行”。\n先迷失道，后顺得常。\n何妥曰：阴道恶先，故先致迷失。后顺于主，则保其常庆也。\n西南得朋，乃与类行。\n虞翻曰：谓阳得其类，月朔至望，从震至乾，与时偕行，故“乃与类行”。\n东北丧朋，乃终有庆。\n虞翻曰：阳丧灭坤，坤终复生，谓月三日震象出庚，故“乃终有庆”。此指说易道阴阳消息之大要也。谓阳月三日，变而成震，出庚。至月八日成兑，见丁。庚西丁南，故“西南得朋”。谓二阳为朋，故兑“君子以朋友讲习”。《文言》曰：敬义立而德不孤。《彖》曰：乃与类行。二十九日，消乙入坤，灭藏于癸，乙东癸北，故“东北丧朋”。谓之以坤灭乾，坤为丧故也。\n马君云：孟秋之月，阴气始著，而坤之位，同类相得，故“西南得朋”。孟春之月，阳气始著，阴始从阳，失其党类，故“东北丧朋”。失之甚矣。而荀君以为阴起于午，至申三阴，得坤一体，故曰“西南得朋”。阳起于子，至寅三阳，丧坤一体，故曰“东北丧朋”。就如荀说，从午至申，得坤一体，故曰“西南得朋”。阳起于子，至寅三阳，丧坤一体，故曰“东北丧朋”就如荀说，从午至申，经当言南西得朋；子至寅，当言北东丧朋。以乾变坤，而言丧朋，经以乾卦为丧耶？此何异于马也。\n安贞之吉，\n虞翻曰：坤道至静，故“安”；复初得正，故“贞吉”。\n应地无疆。\n虞翻曰：震为应。阳正于初，以承坤阴；地道应，故“应地无疆”。\n《象》曰：地势坤，\n王弼曰：地形不顺，其势顺。\n宋衷曰：地有上下九等之差，故以形势言其性也。\n君子以厚德载物。\n虞翻曰：势，力也。君子谓乾阳，为德动。在坤下，君子之德车。故“厚德载物”。老子曰：胜人者有力也。\n初六：履霜，坚冰至。\n干宝曰：重阴，故称六。刚柔相推，故生变。占变，故有爻。《系》曰：爻者，言乎变者也。故《易》、《系辞》皆称九、六也。阳数奇，阴数偶，是以乾用一也。坤用二也。阴气在初，五月之时，自姤来也。阴气始动乎三泉之下，言阴气之动矣。则必至于履霜，履霜则必至于坚冰，言有渐也。藏器于身，贵其俟时，故阳有潜龙，戒以“勿用”。防祸之原。欲其先几，故阴在三泉，而显以履霜也。\n《象》曰：履霜坚冰，阴始凝也。驯致其道，至坚冰也。\n《九家易》曰：霜者，乾之命也。坚冰者，阴功成也。谓坤初六之乾四，履乾命令而成“坚冰”也。此卦本乾，阴始消，阳起于此爻，故“履霜”也。驯，犹顺也，言阳顺阴之性，成坚冰矣。初六始姤，姤为五月。盛夏而言坚冰，五月阴气始生地中，言始于微霜，终至坚冰，以明渐顺至也。\n六二：直方大。\n荀爽曰：大者，阳也。二应五，五下动之，则应阳出，直布阳于四方。\n不习无不利。\n荀爽曰：物唱乃和，不敢先有所习。阳之所唱，从而和之，“无不利”也。干宝曰：阴气在二，六月之时，自遁来也。阴出地上，佐阳成物，臣道也，妻道也。臣之事君，妻之事夫，义成者也。臣贵其直，义尚其方，地体其大，故曰“直方大”。士该九德，然后可以从王事；女躬四教，然后可以配君子。道成于我，而用之于彼。不妨以仕举为政，不妨以嫁学为妇。故曰“不习无不利”也。\n《象》曰：六二之动，直以方也。\n《九家易》曰：谓阳下动，应之，则直而行，布阳气于四方也。\n不习无不利，地道光也。\n干宝曰：女德光于夫，士德光于国也。\n六三：含章可贞。\n虞翻曰：贞，正也。以阴包阳，故“含章”。三失位，发得正，故“可贞”也。\n或从王事，无成有终。\n虞翻曰：谓三已发成泰，乾为王，坤为事，震为从，故“或从王事”。地道无成而有终，故“无成有终”。\n干宝曰：阴气在三，七月之时，自否来也。阳降在四，三公位也。阴升在三，三公事也。上失其权，位在诸侯。坤体既具，阴党成群。君弱臣强，戒在二国。唯文德之臣，然后可以遭之，运而不失其柔顺之正。坤为文，坤象既成，故曰“含章可贞”。此盖平襄之王垂拱以晋郑之辅也。苟利社稷，专之则可，故曰“或从王事”。迁都诛亲，疑于专命，故亦或之。失后顺之节，故曰“无成”。终于济国安民，故曰“有终”。\n《象》曰：含章可贞，以时发也。\n崔觐曰：阳命则发，非时则含也。\n或从王事，知光大也。\n干宝曰：位弥高，德弥广也。\n六四：括囊，无咎，无誉。\n虞翻曰：括，结也。谓泰反成否。坤为囊，艮为手，巽为绳，故括囊在外多咎也。得位承五，系于包桑，故“无咎”。阴在二多誉，而远在四，故“无誉”。\n干宝曰：阴气在四，八月之时，自观来也。天地将闭，贤人必隐，怀智苟容，以观时衅，此盖甯戚、籧瑗与时卷舒之爻也。不艰其身，则无咎。功业不建，故无誉也。\n《象》曰：括囊，无咎，慎不害也。\n卢氏曰：慎言则无咎也。\n六五：黄裳，元吉。\n干宝曰：阴气在五，九月之时，自剥来也。剥者，反常道也。黄，中之色。裳，下之饰。元，善之长也。中美能黄，上美为元，下美则裳。阴登于五，柔居尊位，若成昭之主，周霍之臣也。百官总已，专断万机，虽情体信顺，而貌近僣疑，周公其犹病诸。言必忠信，行必笃敬，然后可以取信于神明，无尤于四海也。故曰“黄裳，元吉”也。\n《象》曰：黄裳，元吉，文在中也。\n王肃曰：坤为文，五在中，故曰“文在中也”。\n干宝曰：当总已之任，处疑僣之间，而能终元吉之福者，由文德在中也。\n上六：龙战于野，\n荀爽曰：消息之位，坤在于亥。下在伏乾，为其兼于阳，故称“龙”也。\n其血玄黄。\n《九家易》曰：实本坤体，未离其类，故称“血”焉。血以喻阴也。玄黄，天地之杂，言乾坤合居也。\n侯果曰：坤，十月卦也。乾位西北，又当十月。阴穷于亥，穷阴薄阳，所以战也。故《说卦》云“战乎乾”是也。六称龙者，阴盛似龙，故称“龙”也。\n干宝曰：阴在上六，十月之时也。爻终于酉，而卦成于乾。乾体纯刚，不堪阴盛，故曰“龙战”。戌亥，乾之都也，故称“龙”焉。阴德过度，以逼乾战。郭外曰郊，郊外曰野。坤位未申之维，而气溢酉戌之间，故曰“于野”。未离阴类，故曰“血”。阴阳色杂，故曰“玄黄”。言阴阳离则异气，合则同功。君臣夫妻，其义一也。故文王之忠于殷，抑参二之强，以事独夫之纣。盖欲弥缝其阙。而匡救其恶，以祈殷命，以济生民也。纣遂长恶不悛，天命殛之。是以至于武王，遂有牧野之事，是其义也。\n《象》曰：龙战于野，其道穷也。\n干宝曰：天道穷，至于阴阳和薄也。君德穷，至于攻战受诛也。柔顺穷，至于用权变矣。\n用六：利永贞。\n干宝曰：阴体其顺，臣守其柔。所以秉义之和，履贞之干。唯有推变，终归于正。是周公始于负扆南面，以光王道，卒于复子明辟，以终臣节，故曰“利永贞”也。\n《象》曰：用六，永贞，以大终也。\n侯果曰：用六，妻道也，臣道也，利在长正矣。不长正，则不能大终阳事也。\n《文言》曰：\n何妥曰：《坤·文言》唯一章者，以一心奉顺于主也。\n坤至柔，\n荀爽曰：纯阴至顺，故“柔”也。\n而动也刚，\n《九家易》曰：坤一变而成震。阴动生阳，故“动也刚”。\n至静而德方，\n荀爽曰：坤性至静，得阳而动，布于四方也。\n后得主而有常，\n虞翻曰：坤阴，先迷后顺，得常。阳出初，震为主，为常也。\n含万物而化光。\n干宝曰：光，大也。谓坤含藏万物，顺承天施，然后“化光”也。\n坤道其顺乎，承天而时行。\n荀爽曰：承天之施，因四时而行之也。\n积善之家，必有余庆；\n虞翻曰：谓初。乾为积善，以坤牝。阳灭出复，震为余庆，谓“东北丧朋”，乃终有庆也。\n积不善之家，必有余殃。\n虞翻曰：坤积不善，以臣弑君，以乾通坤，极姤生巽，为余殃也。\n案：圣人设教，理贵随宜，故夫子先论人事，则不语怪力乱神，绝四毋必。今于易象，阐扬天道，故曰“积善之家，必有余庆。积不善之家，必有余殃”者：以明阳生阴杀，天道必然。理国修身，积善为本。故于坤爻初六，阴始生时，著此微言，永为深诫。欲使防萌杜渐，灾害不生，开国承家，君臣同德者也。故《系辞》云：善不积，不足以成名。恶不积，不足以灭身。是其义也。\n臣弑其君子弑其父，\n虞翻曰：坤消至二，艮子弑父。至三成否，坤臣弑君。上下不交，天下无邦。故子弑父，臣弑君也。\n非一朝一夕之故，其所由来者渐矣。\n虞翻曰：刚爻为朝，柔爻为夕；乾为寒，坤为暑，相推而成岁焉。故“非一朝一夕”，所由来渐矣。\n由辩之不早辩也。\n孔颖达曰：臣子所以久包祸心，由君父不早辩明故也。此文诫君父防臣子之恶也。\n《易》曰：履霜，坚冰至，盖言顺也。\n荀爽曰：霜者，乾之命令。坤下有伏乾，履霜坚冰，盖言顺也。乾气加之，性而坚，象臣顺君命而成之。\n直其正也，方其义也。\n虞翻曰：谓二。阳称直。乾，其静也专，其动也直，故“直其正”。方为辟，阴开为方。坤，其静也翕，其动也辟，故“方其以也”。\n君子敬以直内，义以方外，敬义立而德不孤。\n虞翻曰：阳息在二，故“敬以直内”。坤位在外，故义以方外。谓阳见兑丁，西南得朋，乃与类行，故德不孤。孔子曰：必有邻也。\n直方大，不习，无不利，则不疑其所行也。\n荀爽曰：直方大，乾之唱也。不习无不利，坤之和也。阳唱阴和，而无所不利，故“不疑其所行也”。\n阴虽有美，含之，以从王事，弗敢成也。\n荀爽曰：六三阳位，下有伏阳。坤阴卦也。虽有伏阳，含藏不显。以从王事，要待乾命，不敢自成也。\n地道也，妻道也，臣道也。\n翟元曰：坤有此三者也。\n地道无成，而代有终也。\n宋衷曰：臣子虽有才美，含藏以从其上，不敢有所成名也。地得终天功，臣得终君事，妇得终夫业，故曰“而代有终也”。\n天地变化，草木蕃。\n虞翻曰：谓阳息坤成泰。天地反，以乾变坤，坤化升乾，万物出震，“故天地变化，草木蕃”矣。\n天地闭，贤人隐。\n虞翻曰：谓四。泰反成否，乾称贤人。隐藏坤中，以俭德避难，不荣以禄，故“贤人隐”矣。\n《易》曰：括囊，无咎，无誉，盖言谨也。\n荀爽曰：六四阴位，迫近于五，虽有成德，当括而囊之，谨慎畏敬也。\n孔颖达曰：括，结也。囊，所以贮物，以譬心藏智也。闭其智而不用，故曰“括囊”。不与物忤，故“无咎”。功名不显，故“无誉”也。\n君子黄中通理，正位居体，\n虞翻曰：谓五。坤息体观，地色黄，坤为理。以乾通坤，故称“通理”。五正阳位，故曰“正位”。艮为居，体谓四支也。艮为两肱，巽为两股。故曰“黄中通理，正位居体”。\n美在其中，而畅于四支，\n虞翻曰：阳称美，在五中四支。谓股肱。\n发于事业，\n《九家易》曰：天地交而万物生也。谓阳德潜藏，变则发见。若五动为比，乃事业之盛。\n美之至也。\n侯果曰：六五以中和通理之德，居体于正位，故能美充于中。而旁畅于万物，形于事业，无不得宜，是“美之至也”。\n阴疑于阳，必战。\n孟喜曰：阴乃上薄，疑似于阳，必与阳战也。\n为其兼于阳也，故称龙焉。\n《九家易》曰：阴阳合居，故曰“兼”。阳谓上六，坤行至亥，下有伏乾，阳者变化，以喻龙焉。\n犹未离其类也，故称血焉。\n荀爽曰：实本坤卦，故曰“未离其类也”。血以喻阴顺也。\n崔觐曰：乾坤交会，乾为大赤，伏阴柔之，故“称血焉”。\n夫玄黄者，天地之杂也。\n荀爽曰：消息之卦，坤位在亥，下有伏乾，阴阳相和，故言“天地之杂也”。\n天玄而地黄。\n王凯冲曰：阴阳交战，故血玄黄。\n荀爽曰：天者阳，始于东北，故色玄也。地者阴，终于西南，故色黄也。", "3": "《序卦》曰：有天地，然后万物生焉。盈天地之间者唯万物，故受之以屯。屯者，盈也。屯者，万物之始生也。\n崔觐曰：此仲尼序文王次卦之意也。不序乾坤之次者，以一生二，二生三，二生万物。则天地之次第可知，而万物之先后宜序也。万物之始生者，言刚柔始交，故万物资始于乾，而资生于坤。\n(震下坎上)。屯：元、亨、利、贞。\n虞翻曰：坎二之初，刚柔交震，故“元、亨”；之初得正，故“利、贞”矣。\n勿用有攸往，利建侯。\n虞翻曰：之外称往。初震得正，起之欲应，动而失位，故“勿用有攸往”。震为侯，初刚难拔，故利以建侯。老子曰：善建者，拔也。\n《彖》曰：屯，刚柔始交而难生。\n虞翻曰：乾刚坤柔，坎二交初，故“始交”。确乎难拔，故“难生”也。\n崔觐曰：十二月阳始浸长，而交于阴，故曰“刚柔始交”。万物萌芽，生于地中，有寒冰之难，故言“难生”。于人事，则是运季业初之际也。\n动乎险中，大亨贞。\n荀爽曰：物难在始生，此本坎卦也。\n案：初六升二，九二降初，是刚柔始交也。交则成震，震为动也，上有坎，是动乎险中也。动则物通而得正。故曰“动乎险中，大亨贞”也。\n雷雨之动满形，\n荀爽曰：雷震雨润，则万物满形而生也。\n虞翻曰：震雷坎雨，坤为形也。谓三巳反正，成既济。坎水流坤，故“满形”。谓雷动雨施，品物流形也。\n天造草昧。\n荀爽曰：谓阳动在下，造物于冥昧之中也。\n宜建侯而不宁。\n苟爽曰：天地初开，世尚屯难，震位承乾，故“宜建侯”。动而遇险，故“不宁”也。\n虞翻曰：造，造生也。草，草创物也。坤冥为昧，故“天造草昧”。成既济定，故曰“不宁”，言宁也。\n干宝曰：水运将终，木德将始，殷周际也。百姓盈盈，匪君子不宁。天下既遭屯险之难，后王宜荡之以雷雨之政，故封诸侯以宁之也。\n《象》曰：云雷，屯。\n《九家易》曰：雷雨者，兴养万物。今言屯者，十二月雷伏藏地中，未得动出。虽有云雨，非时长育，故言屯也。\n君子以经论。\n荀爽曰：屯难之代，万事失正。经者，常驻也。论者，理也。君子以经论，不失常道也。\n姚信曰：经，纬也。时在屯难，是天地经论之日，故君子法之，须经论艰难也。\n初九：盘桓，利居贞，利建侯。\n虞翻曰：震起艮止，动乎险中，故“盘桓”。得正得民，“利居贞”。谓君子居其室，慎密而不出也。\n《象》曰：虽盘桓，志行正也。\n荀爽曰：盘桓者，动而退也。顿谓从二动，而退居初，虽盘桓，得其正也。\n以贵下贱，大得民也。\n荀爽曰：阳贵而阴贱，阳从二来，是以贵下贱，所以得民也。\n六二：屯如邅如，\n荀爽曰：阳动而止，故“屯如”也。阴乘于阳，故“邅如”也，\n乘马班加。\n虞翻曰：屯邅盘桓，谓初也。震为马作足，二乘初，故“乘马”。班，踬也。马不进，故“班如”矣。\n匪寇婚媾，女子贞不字，十年乃字。\n虞翻曰：匪非也。寇谓五。坎为寇盗，应在坎，故“匪寇”。阴阳德正，故“婚媾”。字，妊娠也。三失位，变复体离。离为女子，为大腹，故称“字”。今失位为坤，离象不见，故“女子贞不字”。坤数十。三动反正，离女大腹。故十年反常乃字。谓成既济定也。\n《象》曰：六二之难，乘刚也。\n崔觐曰：下乘初九，故为之难也。\n十年乃字，反常也。\n《九家易》曰：阴出于坤，今还为坤，故曰“反常也”。阴出于坤，谓乾再索而得坎。今变成震，中有坤体，故言阴出于坤。今还于坤，谓二从初即逆，应五顺也。去逆就顺，阴阳道正，乃能长养，故曰“十年乃字”。\n六三：即鹿无虞，惟入于林中，\n虞翻曰：即，就也。虞谓虞人，掌禽兽者。艮为山，山足称麓。麓，林也。三变体坎，坎为丛木。山下，故称“林中”。坤为兕虎；震为麋鹿，又为惊走；艮为狐狼。三变禽走入林中，故曰“即鹿无虞，惟入林中”矣。\n君子几，不如舍，往吝。\n虞翻曰：君子谓阳已正位。几，近。舍，置。吝，疵也。三应于上，之应历险。不可以往，动如失位。故“不如舍”之，往必吝穷矣。\n《象》曰：即鹿无虞，以从禽也。\n案：《白虎通》云：禽者，何鸟？兽之总名，为人所禽制也。即此卦九五爻辞。王用三驱，失前禽，是其义也。\n君子舍之，往吝穷也。\n崔觐曰：君子见动之微，逆知无虞，则不如舍，勿往。往则吝穷也。\n六四：乘马班如，\n虞翻曰：乘，三也。谓三巳变坎，为马，故曰“乘马”。马在险中，故“班如”也。或说乘初，初为建侯，安得乘之也。\n求婚媾，往吉，无不利。\n崔觐曰：屯难之时，勿用攸往。初虽作应，班如不进。既比于五，五来求婚。男求女，“往吉，无不利”。\n《象》曰：求而往，明也。\n虞翻曰：之外称“往”。体离，故“明也”。\n九五：屯其膏，\n虞翻曰：坎雨称“膏”。《诗》云：阴雨膏之，是其义也。\n小贞吉，大贞凶。\n崔觐曰：得屯难之宜，有膏泽之惠。谓与四为婚媾，施虽未光，小贞之道也，故“吉”。至于远求嘉偶，以行大正，赴二之应，冒难攸往，固宜且凶。故曰“大贞凶”也。贞，正也。\n《象》曰：屯其膏，施未光也。\n虞翻曰：阳陷阴中，故“未光也”。\n上六：乘马班如，\n虞翻曰：乘，五也。坎为马，震为行，艮为止，马行而止，故“班如”也。\n泣血涟如。\n《九家易》曰：上六乘阳，故“班如”也。下二四爻虽亦乘阳，皆更得承五，忧解难除。今上无所复承，忧难不解，故“泣血涟如”也。体坎为血，伏离为目，互艮为手，掩目流血，泣之象也。\n《象》曰：泣血涟如，何可长也。\n虞翻曰：谓三变时，离为目。坎为血，震为出。血流出目，故“泣血涟如”。柔乘于刚，故不可长也。", "4": "《序卦》曰：物生必蒙，故受之以蒙。蒙者，蒙也，物之稚也。\n崔觐曰：万物始生之后，渐以长稚，故言“物生必蒙”。\n郑玄曰：蒙，幼小之貌。齐人谓萌之蒙也。\n(坎下艮上)。蒙：亨。\n虞翻曰：艮三之二。亨谓二。震刚柔接，故“亨”。蒙亨，以通行时中也。\n干宝曰：蒙者，离宫阴也。世在四。八月之时，降阳布德，荠麦并生，而息来在寅，故“蒙”。于世为八月，于消息为正月卦也。正月之时，阳气上达，故屯为物之始生，蒙为物之稚也。施之于人，则童蒙也。敬得其运，虽蒙必亨，故曰“蒙亨”。此盖以寄成王之遭周公也。　　匪我求童蒙，童蒙求我。\n虞翻曰：童蒙谓五，艮为童蒙。我谓二也。震为动起，嫌求之五，故曰“匪我求童蒙”。五阴求阳，故“童蒙求我，志应也”。艮为求，二体师象，坎为经。谓礼有来学，无往教。\n初筮告，再三渎，渎则不告，\n崔觐曰：初筮，谓六五求决于九二。二则告之。再三渎，谓三应于上。四隔于三，与二为渎，故二“不告”也。渎，古黩字也。　　利贞。\n虞翻曰：二五失位，利变之正，故“利贞”。蒙以养正，圣功也。\n《彖》曰：蒙，山下有险，险而止，蒙。\n侯果曰：艮为山，坎为险，是山下有险。险被山止，止则未通，蒙昧之象也。\n蒙亨，以亨行时中也。\n荀爽曰：此本艮卦也。案：二进居三，三降居二。刚柔得中，故能通。发蒙时，令得进中矣。故曰“蒙亨，以亨行时中也”。\n匪我求童蒙，\n陆绩曰：六五阴爻，在蒙暗。蒙又体艮，少男，故曰“童蒙”。\n童蒙求我，志应也。\n荀爽曰：二与五志相应也。　　初筮告，以刚中也。\n崔觐曰：以二刚中，能发于蒙也。　　再三渎，渎则不告，渎蒙也。\n荀爽曰：再三，谓三与四也。皆乘阳，不敬，故曰“渎”。渎不能尊阳，蒙气不除，故曰“渎蒙也”。\n蒙以养正，圣功也。\n虞翻曰：体颐，故养。五多功。圣谓二，二志应五，变得正而亡其蒙，故“圣功也”。\n干宝曰：武王之崩，年九十三矣。而成王八岁，言天后成王之年，将以养公正之道，而成三圣之功。\n《象》曰：山下出泉，蒙。\n虞翻曰：艮为山，震为出，坎象流出，故“山下出泉”。\n君子以果行育德。\n虞翻曰：君子谓二。艮为果，震为行。育，养也。二至上有颐养象，故“以果行育德”也。\n初六：发蒙，利用刑人，用说桎梏，以往吝。\n虞翻曰：发蒙之正，初为蒙始，而失其位。发蒙之正以成兑，兑为刑人，坤为用，故曰“利用刑人”矣。坎为穿木，震足艮手，互与坎连，故称“桎梏”。初发成兑，兑为说，坎象毁坏，故曰“用说桎梏”。之应历险，故“以往吝”。吝，小疵也。\n《象》曰：利用刑人，以正法也。\n虞翻曰：坎为法，初发之正，故“正法也”。\n干宝曰：初六戊寅，平明之时，天光始照，故曰“发蒙”。此成王始觉周公至诚之象也。坎为法律，寅为贞廉，以贞用刑，故“利用刑人”矣。此成王将正四国之象也。说，解也。正四国之罪。宜释周公之党，故曰“用说桎梏”。既感金滕之文，追恨昭德之晚，故曰“以往吝”。初二失位，吝之由也。\n九二：包蒙，吉。纳妇，吉。子克家。《象》曰：子克家，刚柔接也。\n虞翻曰：坤为包。应五据初，初与三四同体，包养四阴，故“包蒙，吉”。震刚为夫，伏巽为妇，二以刚接柔，故“纳妇，吉”。二称家。震，长子，主器者。纳妇成初。故有“子克家”也。\n六三：勿用娶女，见金夫，不有躬，无攸利。\n虞翻曰：谓三诫上也。金夫谓二。初发成兑，故三称“女”。兑为见。阳称金。震为夫。三逆乘二阳，所行不顺，为二所淫。上来之三，陟阴。故曰“勿用娶女，见金夫”矣。坤身称躬，三为二所乘，兑泽动下，不得之应，故“不有躬”。失位多凶，故“无攸利”也。\n《象》曰：勿用娶女，行不顺也。\n虞翻曰：失位乘刚，故“行不顺也”。\n六四：困蒙，吝。《象》曰：困蒙之吝，独远实也。\n王弼曰：阳称实也。独远于阳，处两阴之中，暗莫之发，故曰“困蒙”也。困于蒙昧，不能比贤以发其志，亦鄙矣，故曰“吝”。\n六五：童蒙，吉。\n虞翻曰：艮为童蒙，处贵承上，有应于二，动而成巽，故“吉”也。\n《象》曰：童蒙之吉，顺以巽也。\n荀爽曰：顺于上，巽于二，有似成王任用周召也。\n上九：击蒙，不利为寇，利御寇。\n虞翻曰：体艮为手，故“击”。谓五巳变，上动成坎，称寇。而逆乘阳，故“不利为寇”矣。御，止也。此寇谓二。坎为寇，巽为高，艮为山，登山备下，顺有师象，故“利御寇”也。\n《象》曰：利用御寇，上下顺也。\n虞翻曰：自上御下，故“顺”也。", "5": "《序卦》曰：物稚不可不养也。故受之以需。需者，饮食之道也。\n干宝曰：需，坤之游魂也。云升在天，而雨未降，翱翔东西，须之象也。王事未至，饮宴之日也。夫坤者，地也；妇人之职也；百谷果蓏之所生，禽兽鱼鳖之所托也；而在游魂变化之家，即烹爨腥实以为和味者也。故曰“需者，饮食之道也”。\n(乾下坎上)。需：有孚，光亨，贞吉。\n虞翻曰：大壮四之五。孚谓五。离日为光。四之五，得位正中。故“光亨”。“贞吉”，谓“壮于大舆之辐也”。\n利涉大川。\n何妥曰：大川者，大难也。须之待时，本欲涉难，既能以信而待，故可以“利涉大川”矣。\n《彖》曰：需，须也。险在前也，\n何妥曰：此明得名由于坎也。坎为险也。有险在前，不可妄涉，故须待时然后动也。\n刚健而不陷。其义不困穷矣。\n侯果曰：乾体刚健，遇险能通，险不能险，义不穷也。\n需，有孚，光亨，贞吉。位乎天位，以正中也。\n蜀才曰：此本大壮卦。\n案：六五降四，有孚，光亨，贞吉。九四升五，位乎天位，以正中也。\n利涉大川，往有功也。\n虞翻曰：谓二失位，变而涉坎，坎为大川。得位应五，故“利涉大川”。五多功，故“往有功也”。\n《象》曰：云上于天，需。\n宋衷曰：云上于天，须时而降也。\n君子以饮食宴乐。\n虞翻曰：君子谓乾。坎水兑口。水流入口为饮。二失位，变体噬嗑，为食，故“以饮食”。阳在内，称宴。大壮，震为乐，故“宴乐”也。\n初九：需于郊，利用恒，无咎。\n干宝曰：郊，乾坎之际也。既已受命，进道北郊，未可以进，故曰“需于郊”。处不避污，出不辞难，臣之常节也。得位有应，故曰“利用恒”。虽小稽留，终于必达，故曰“无咎”。\n《象》曰：需于郊，不犯难行也。利用恒无咎，未失常也。\n王弼曰：居需之时，最远于险；能抑其进，不犯难行；虽不应几，可以保常，故“无咎”。\n九二：需于沙，小有言，终吉。\n虞翻曰：沙谓五。水中之阳称沙也。二变之阴，称小。大壮震为言，兑为口。四之五，震象半见，故“小有言”。二变应之，故“终吉”。\n《象》曰：需于沙，衍在中也。\n虞翻曰：衍，流也。中谓五也。\n荀爽曰：二应于五，水中之刚，故曰“沙”。知前有沙漠。而不进也。体乾处和，美德优衍在中，而不进也。\n虽小有言，以吉终也。\n荀爽曰：二与四同功，而三据之，故“小有言”。乾虽在下，终当升上，二当居五，故“终吉也”。\n九三：需于泥，致寇至。\n荀爽曰：亲与坎接，故称“泥”。须止不进，不取于四，不致寇害。\n《象》曰：需于泥，灾在外也。\n崔觐曰：泥近乎外者也。三逼于坎，坎为险盗，故“致寇至”。是灾在外也。\n自我致寇，敬慎不败也。\n虞翻曰：离为戎，乾为敬。阴消至五遁，臣将弑君。四上壮坤，故“敬慎不败”。\n六四：需于血，出自穴。\n案：六四体坎。坎为云，又为血卦。血以喻阴。阴体卑弱，宜顺从阳，故曰“需于血”。\n《九家易》曰：云从地出，上升于天。自地出者，莫不由穴。故曰“需于血，出自穴”也。\n《象》曰：需于血，顺以听也。\n王弼曰：穴者，阴之路也。四处坎始，居穴者也。九三刚进，四不能距，见侵则避，顺以听命也。\n《九家易》曰：云欲升天，须时当降。顺以听五，五为天也。\n九五：需于酒食，贞吉。\n荀爽曰：五互离，坎水在火上，酒食之象。需者，饮食之道。故坎在需家，为酒食也。云须时欲降，乾须时当升。五有刚德，处中居正。故能帅群阴，举坎以降。阳能正居其所，则吉。故曰“需于酒食”也。\n《象》曰：酒食贞吉，以中正也。\n《九家易》曰：谓乾二当升五，正位者也。\n卢氏曰：沈湎则凶，中正则吉也。\n上六：入于穴，\n荀爽曰：需道已终，云当下入穴也。云上升极，则降而为雨，故《诗》云：朝跻于西，崇朝其雨，则还入地，故曰“入于穴”。云雨入地，则下三阳动而自至者也。\n有不速之客三人来，敬之终吉。\n荀爽曰：三人，谓下三阳也。须时当升，非有召者，故曰“不速之客”焉。乾升在上，君位以定；坎降在下，当循臣职。故“敬之终吉”也。\n《象》曰：不速之客来，敬之终吉。虽不当位，未大失也。\n荀爽曰：上降居三，虽不当位，承阳有实，故“终吉”，无“大失”矣。", "6": "《序卦》曰：饮食必有讼，故受之以讼也。\n郑玄曰：讼，犹争也，言饮食之会恒多争也。\n(坎下乾上)。讼：有孚，\n干宝曰：讼，离之游魂也。离为戈兵，此天气将刑杀，圣人将用师之卦也。讼，不亲也。兆民未识天命不同之意。\n荀爽曰：阳来居二，而孚于初，故曰“讼有孚”矣。\n窒惕，中吉，\n虞翻曰：遁三之二也。孚谓二。窒，塞止也。惕，惧二也。二失位，故不言贞。遁将成否，则子弑父，臣弑君。三来之二，得中；弑不得行，故“中吉”也。　　终凶。\n虞翻曰：二失位，终止不变，则入于渊，故“终凶”也。\n利见大人，不利涉大川。\n侯果曰：大人，谓五也。断决必中，故“利见”也。讼是阴事，以险涉险，故“不利涉大川”。\n《彖》曰：讼，上刚下险，险而健，讼。\n卢氏曰：险而健者，恒好争讼也。　　讼，有孚窒惕，中吉，刚来而得中也。\n蜀才曰：此本遁卦。\n案：二进居三，三降居二，是刚来而得中也。\n终凶，讼不可成也。\n王肃曰：以讼成功者，终必凶也。\n王弼曰：凡不和而讼，无施而可，涉难特甚焉。唯有信而见塞惧者，乃可以得吉也。犹复不可以终，中乃吉也。不闭其源，使讼不至，虽每不枉，而讼至终竟，此亦凶矣。故虽复有信，而见塞惧，犹不可以为终，故曰“讼，有孚，窒惕，中吉，终凶”也。无善听者，虽有其实，何由得明。而令有信塞惧者，得其中吉，必有善听之主焉。其在二乎？以刚而来，正夫群小，断不失中，应其任矣。\n案：夫为讼，善听之主者，其在五焉。何以明之？案爻辞：九五：讼，元吉。王氏注云：处得尊位，为讼之主，用其中正，以断枉直。即《彖》云：利见大人，尚中正，是其义也。九二《象》曰：不克讼，归逋窜也。自下讼上，患至掇也。九二居讼之时，自救不暇。讼既不克，怀惧逃归，仅得免其终凶祸，岂能为善听之主哉！年代绵流，师资道丧，恐传写字误，以五为二，后贤当审详之也。\n利见大人，尚中正也。\n荀爽曰：二与四讼，利见于五。五以中正之道，解其讼也。\n不利涉大川，入于渊也。\n荀爽曰：阳来居二，坎在下，为渊。\n《象》曰：天与水违行，讼。\n荀爽曰：天自西转，水自东流，上下违行，成讼之象也。\n君子以作事谋始。\n虞翻曰：君子谓乾。三来变坤，为作事。坎为谋。乾知大始。故“以作事谋始”。\n干宝曰：省民之情，以制作也。武王故先观兵孟津，盖以卜天下之心，故曰“作事谋始”也。\n初六：不永所事，小有言，终吉。\n虞翻曰：永，长也。坤为事，初失位，而为讼始，故“不永所事”也。小有言，谓初四易位成震，言三食旧德，震象半见，故“小有言”。初变得正，故“终吉”也。\n《象》曰：不永所事，讼不可长也。虽小有言，其辩明也。\n卢氏曰：初欲应四，而二据之。蹔争，事不至永。虽有小讼，讼必辩明，故“终吉”。\n九二：不克讼，归而逋。\n虞翻曰：谓与四讼，坎为隐伏，故“逋”乾位刚在上，坎濡失正，故“不克”也。\n其邑人三百户，无眚。\n虞翻曰：眚，灾也，坎为眚，谓二变应五。乾为百，坤为户；三爻，故三百户。坎化为坤，故“无眚”。\n《象》曰：不克讼，归逋窜也。\n荀爽曰：三不克讼，故逋而归。坤称邑。二者，邑中之阳人。逋，逃也，谓逃失邑中之阳人。\n自下讼上，患至掇也。\n荀爽曰：下与上争，即取患害，如拾掇小物而不失也。坤有三爻，故云“三百户，无眚”。二者，下体之君。君不争，则百姓无害也。\n六三：食旧德，贞厉，终吉。\n虞翻曰：乾为旧德。食谓初。四二已变之正。三动得位，体噬嗑食。四变食乾，故“食旧德”。三变在坎，正危贞厉，得位二，故“终吉”也。\n或从王事，无成。\n虞翻曰：乾为王。二变否时，坤为事，故“或从王事”。道无成而代有终，故曰“无成”。坤三同义也。\n《象》曰：食旧德，从上吉也。\n侯果曰：虽失其位，专心应上，故能保全旧恩，食旧德者也。处两刚之间，而皆近不相得。乘二负四，正之危也。刚不能侵，故“终吉”也。\n九四：不克讼，复即命渝，安贞吉。\n虞翻曰：失位，故“不克讼”。渝变也。不克讼，故复位。变而成巽，巽为命令，故“复即命渝”。动而得位，故“安贞吉”。谓二已变坤安也。\n《象》曰：复即命渝，安贞吉，不失也。\n侯果曰：初既辩明，四讼妄也。讼既不克，当反就前理。变其诏命，则安静贞吉而不失初也。\n九五：讼，元吉。《象》曰：讼，元吉，以中正也。\n王肃曰：以中正之德，齐乖争之俗，元吉也。\n王弼曰：处得尊位，为讼之主。用其中正，以断枉直。中则不过，正则不邪，刚则无所溺，公则无所偏。故“讼，元吉”。\n上九：或锡之鞶带，\n虞翻曰：锡谓王之锡命。鞶带，大带。男子鞶革。初四已易位，三二之正，巽为腰带，故“鞶带”。\n终朝三拕之。\n虞翻曰：位终乾上。二变时，坤为终。离为日，乾为甲。日出甲上。故称“朝”。应在三，三变时，艮为手，故“终朝三拕之”。使变应已，则去其鞶带。体坎乘阳，故象曰“不足敬也”。\n侯果曰：褫(拕)，解也。乾为衣、为言，故以讼受服。\n荀爽曰：二四争三，三本下体，取之有缘。或者，疑之辞也。以三锡二，于义疑矣。争竞争之世，分理未明，故或以锡二。终朝者，君道明。三者，阳成功也。君明道盛，则夺二与四，故曰“终朝三拕之”也。鞶带，宗庙之服。三应于上，上为宗庙。故曰“鞶带”也。\n翟玄曰：上以六三锡下二阳，群刚交争，得不以让，故终一朝之间，各一夺之，为三拕。\n《象》曰：以讼受服，亦不足敬也。\n虞翻曰：服谓鞶带。终朝见褫(拕)，乾象毁坏。故“不足敬”。\n《九家易》曰：初、二、三、四皆不正，以不正相讼，而得其服，故“不足敬”也。", "7": "《序卦》曰：讼必有众起，故受之以师。师者，众也。\n崔觐曰：因争必起众相攻，故受之以师也。\n(坎下坤上)。师：贞，丈人吉，无咎。\n何晏曰：师者，军旅之名。故《周礼》云：二千五百人为师也。\n王弼曰：丈人，严庄之称，有军正者也。为师之正，丈人乃吉。兴役动众，无功则罪，故“吉”乃“无咎”。\n陆绩曰：丈人者，圣人也。帅师未必圣人，若汉高祖、光武应此义也。\n崔觐曰：《子夏传》作大人，并王者之师也。\n案：此《彖》云：师，众。贞，正也。能以众正，可以王矣。故老子曰：域中有四大，而王居其一焉。由是观之，则知夫为王者，必大人也，岂以丈人而为王哉！故，《乾·文言》曰：夫大人与天地合其德，与日月合其明，先天而天不违，后天而奉天时，天且不违，而况于人乎！况于行师乎！以斯而论，《子夏传》作大人，是也。今王氏曲解大人为丈人，臆云“严庄之称”，学不师古，匪说攸闻，既误违于经旨，辄改正作大人明矣。\n《彖》曰：师，众也。贞，正也。能以众正，可以王矣。\n虞翻曰：坤为众，谓二失位，变之五，为比。故“能以众正“，乃“可以王矣”。\n荀爽曰：谓二有中和之德，而据群阴，上居五位，可以王也。\n刚中而应，行险而顺，\n蜀才曰：此本剥卦。案：上九降二，六二升上，是刚中而应，行险而顺也。\n以此毒天下，而民从之，\n干宝曰：坎为险，坤为顺，兵革刑狱，所以险民也。毒民于险中，而得顺道者，圣王之所难也。毒，荼，苦也。五刑之用，斩刺肌体，六军之锋，残破城邑，皆所以荼毒奸凶之人，使服王法者也。故曰“以此毒天下，而民从之”。毒以治民，明不获已而用之，故于彖象六爻，皆著戒惧之辞也。\n吉又何咎矣。\n崔觐曰：刚能进义，中能正众，既顺且应，行险戡暴，亭毒天下，人皆归往而以为王，“吉又何咎矣”。\n《象》曰：地中有水，师。\n陆绩曰：坎在坤内，故曰“地中有水”。师，众也。坤中众者，莫过于水。\n君子以容民畜众。\n虞翻曰：君子谓二。容，宽也。坤为民众，又畜养也。阳在二，宽以居之，五变执言时，有颐养象。故“以容民畜众矣”。\n初六：师出以律，否臧凶。《象》曰：师出以律，失律凶也。\n案：初六以阴居阳，履失其位，位既匪正，虽令不从。以斯行师，失律者也。凡首率师出必以律，若不以律，虽臧亦凶。故曰“师出以律，失律凶也”。\n《九家易》曰：坎为法律也。　　九二：在师中，吉，无咎。王三锡命。《象》曰：在师中吉，承天宠也。\n《九家易》曰：虽当为王，尚在师中，为天所宠，事克功成。故“吉，无咎”。二非其位，盖谓武王受命而未即位也。受命为王，定天下以师。故曰“在师中，吉”。\n王三锡命，怀万邦也。\n荀爽曰：王谓二也。三者，阳德成也。德纯道盛，故能上居王位，而行锡命，群阴归之。故曰“王三锡命，怀万邦也”。\n案：二互体震，震木。数三，王三锡命之象。《周礼》云：一命受职，再命受服，三命受位，是其义也。\n六三：师或舆尸，凶。\n虞翻曰：坤为尸，坎为车多眚。同人离为戈兵，为折首：失位乘刚无应，尸在车上，故“舆尸，凶”矣。\n《象》曰：师或舆尸，大无功也。\n卢氏曰：失位乘刚，内外无应，以此帅师必大败。故有舆尸之凶，功业大丧也。\n六四：师左次，无咎。\n荀爽曰：左谓二也，阳称左。次，舍也。二与四同功，四承五，五无阳，故呼二舍于五，四得承之，故“无咎”。\n《象》曰：左次无咎，未失常也。\n崔觐曰：偏将军居左。左次，常备师也。师顺用柔，与险无应，进取不可，次舍无咎，得位故也。\n六五：田有禽，利执言，无咎。\n虞翻曰：田谓二。阳称禽。震为言。五失位，变之正，艮为执。故“利执言，无咎”。\n荀爽曰：田，猎也。谓二帅师禽五，五利度二之命，执行其言，故“无咎”也。\n案：六五居尊失位，在师之时，盖由殷纣而被武王擒于鹿台之类是也。以臣伐君，假言田猎。六五离爻，体坤，离为戈兵，田猎行师之象也。\n长子帅师，\n虞翻曰：长子谓二，震为长子，在师中，故“帅师”也。\n弟子舆尸，贞凶。\n虞翻曰：弟子谓三。三体坎。坎震之弟而乾之子，失位乘阳，逆，故“贞凶”。\n《象》曰：长子帅师，以中行也。\n荀爽曰：长子谓九二也。五处中应二，二受任帅师，当上升五。故曰“长子帅师，以中行也”。　　弟子舆尸，使不当也。\n宋衷曰：弟子谓六三也。失位乘阳，处非所据。众不听从，师人分北，或败绩死亡，舆尸而还，故曰“弟子舆尸”。谓使不当其职也。\n上六：大君有命，\n虞翻曰：同人，乾为大君巽为有命。\n干宝曰：大君，圣人也。有命，天命也。五常为王位，至师之家，而变其例者。上为郊也。故易位，以见武王亲征，与师人同处于野也。离上九曰：王用出征，有嘉折首。上六为宗庙，武王以文王行，故正开国之辞于宗庙之爻，明已之受命，文王之德也。故《书·泰誓》曰：予克纣，非予武，惟联文考无罪。纣克予，非朕文考有罪，惟予小子无良。开国，封诸侯也。承家，立都邑也。小人勿用，非所能矣。\n开国承家，\n虞翻曰：承，受也。坤为国。二称家。谓变乾为坤，欲令二上居五，为比，故“开国承家”。\n荀爽曰：大君，谓二。师旅已息，既上居五，当封赏有功，立国命家也。开国，封诸侯。承家，立大夫也。\n宋衷曰：阳当之五，处坤之中，故曰“开国”。阴下之二，在二承五，故曰“承家”。开国，谓析土地以封诸侯，如武王封周公七百里地也。承家立大夫，为差次立大夫。因采地名，正其功勋，行其赏禄。\n小人勿用。\n虞翻曰：阴称小人，坤虚无君，体迷复凶，坤成乾灭，以弑君，故“小人勿用”。\n《象》曰：大君有命，以正功也。\n虞翻曰：谓五多功，五动正位，故“正功也”。\n干宝曰：汤武之事。\n小人勿用，必乱邦也。\n虞翻曰：坤反君道，故“乱邦也”。\n干宝曰：楚灵、齐闵，穷兵之祸也。", "8": "《序卦》曰：众必有所比，故受之以比。比者，比也。\n崔觐曰：方以类聚，物以群分，人众，则群类必有所比矣。上比相阿党，下比相和亲也。相党则相亲，故言比者比也。\n(坤下坎上)。比：吉。\n虞翻曰：师二上之五，得位，众阴顺从，比而辅之，故“吉”。与大有旁通。\n《子夏传》曰：地得水而柔，水得土而流，比之象也。夫凶者生乎乖争，今既亲比，故云“比吉”也　　原筮元永贞，无咎。不宁方来，后夫凶。\n干宝曰：比者，坤之归魂也。亦世于七月，而息来在已。去阴居阳，承乾之命，义与师同也。原，卜也。《周礼》三卜，一曰原兆。砷德变化，反归其所，四方既同，万国既亲，故曰“比吉”。考之蓍龟，以谋王业，大相东土，卜惟洛食，遂乃定鼎郏鄏。卜世三十，卜年七百，德善长于兆民，戩禄永于被业，故曰“原筮元永贞”。逆取顺守。居安如危，故曰“无咎”。天下归德，不唯一方，故曰“不宁方来”。后服之夫，违夭失人，必灾其身故曰“后夫凶”也。\n《彖》曰：比，吉也。比辅也。下顺从也。\n崔觐曰：下比于上，是下顺也。\n原筮元永贞，无咎，以刚中也。\n蜀才曰：此本师卦。\n案：六五降二，九二升五，刚往得中，为比之主。故能原究筮道，以求长正，而“无咎”矣。\n不宁方来，上下应也。\n虞翻曰：水性流动，故“不宁”。坤阴为方，上下应之，故“方来”也。\n后夫凶，\n虞翻曰：后谓上，夫谓五也。坎为后，艮为背。上位在背后，无应乘阳，故“后夫凶”也。\n其道穷也。\n荀爽曰：后夫谓上六。逆礼乘阳，不比圣王，其义当诛，故“其道穷凶”也。\n《象》曰：地上有水，比。\n何宴曰：水性润下，今在地上，更相浸润，比之义也。\n先王以建万国，亲诸侯。\n虞翻曰：先王谓五。初阳已复。震为建，为诸侯。坤为万国，为腹，坎为心。腹心亲比，故“以建万国，亲诸侯”。《诗》曰：公侯腹心，是其义也。\n初六：有孚比之，无咎。\n虞翻曰：孚谓五。初失位，变来得正，故“无咎”也。\n荀爽曰：初在应外，以喻殊俗，圣王之信，光被四表。绝域殊俗，皆来亲比，故“无咎”也。\n有孚盈缶，终来有它，吉。\n虞翻曰：坤器为缶。坎水流坤。初动成屯。屯者，盈也，故“盈缶”。终变得正，故“终来有它吉”。在内称来也。\n《象》曰：比之初六，有它吉也。\n荀爽曰：缶者应内，以喻中国。孚既盈满中国，终来及初，非应，故曰“它”也。《象》云：“有它吉”者，谓信及非应，然后吉也。\n六二：比之自内，贞吉。\n干宝曰：二在坤中。坤，国之象也。得位应五，而体宽大，君乐民人自得之象也，故曰“比之自内，贞吉”矣。\n《象》曰：比之自内，不自失也。\n崔觐曰：自内而比，不失已亲也。\n六三：比之匪人。\n虞翻曰：匪，非也，失位无应，三又多凶，体剥伤象，弑父弑君，故曰“匪人”。\n《象》曰：比之匪人，不亦伤乎。\n干宝曰：六三乙卯，坤之鬼吏。要比之家，有土之君也。周为木德，卯为木辰，同姓之国也。爻失其位，辰体阴贼，管蔡之象也。比建万国，唯去此人。故曰“比之匪人”，不亦伤王政也。\n六四：外比之，贞吉。\n虞翻曰：在外体，故称外。得位比贤，故贞吉也。\n《象》曰：外比于贤，以从上也。\n干宝曰：四为三公，在比之家，而得其位。上比圣主，下御列国，方伯之象也。能外亲九服，贤德之君，务宣上志，绥万邦也。故曰“外比于贤，以从上也”。\n九五：显比。\n虞翻曰：五贵多功，得位正中，初三以变体重明，故“显比”。谓显诸仁也。\n王用三驱，失前禽，\n虞翻曰：坎五称王。三驱，谓驱下三阴，不及于初，故“失前禽”。谓初已变成震，震为鹿，为惊走，鹿之斯奔，则“失前禽”也。\n邑人不戒，吉。\n虞翻曰：坤为邑师，震为人师。时坤虚无君，使师二上居五中，故不诫吉也。\n《象》曰：显比之吉，位正中也。\n虞翻曰：谓离象明。正上中也。　　舍逆取顺，失前禽也。\n虞翻曰：背上六，故“舍逆”。据三阴，故“取顺”。不及初，故“失前禽”。\n邑人不戒，上使中也。\n虞翻曰：谓二，使师二上居五中。\n上六：比之无首，凶。\n荀爽曰：阳欲无首，阴以大终。阴而无首，不以大终。故“凶”也。\n虞翻曰：首，始也。阴道无成，而代有终，“无首，凶”。\n《象》曰：比之无首，无所终也。\n虞翻曰：迷失道，故无所终也。", "9": "《序卦》曰：比必有所畜，故受之以小畜。\n崔觐曰：下顺从而上下应之，则有所畜矣。\n韩康伯曰：由比而畜，故曰“小畜”也。\n(乾下巽上)。小畜：亨。\n侯果曰：四为畜主，体又称小，唯九三被畜，下刚皆通，是以“小畜，亨”也。\n密云不雨，自我西郊。\n崔觐曰：云如不雨，积我西邑之郊，施泽未通，以明小畜之义。\n案：云雨者，阴之气也。今小畜五阳而一阴，既微少，才作密云，故未能为雨。四互居兑，西郊之象也。\n《彖》曰：小畜，柔得位而上下应之，曰小畜。\n王弼曰：谓六四也。成卦之义，在此一爻者也。体无二阴，以分其应，既得其位，而上下应之，三不能陵，小畜之义。\n健而巽，刚中而志行，乃亨。\n虞翻曰：需上变为巽，与豫旁通。豫四之坤初为复，复小阳潜，所畜者少，故曰“小畜”。二失位，五刚中正，二变应之，故“志行乃亨”也。\n密云不雨，尚往也。\n虞翻曰：密，小也。兑为密。需坎升天为云，坠地称雨。上变为阳，坎象半见。故“密云不雨，尚往也”。\n自我西郊，施未行也。\n虞翻曰：豫坤为自我。兑为西，乾为郊，雨生于西，故“自我西郊”。九二未变，故“施未行”矣。\n荀爽曰：体兑位秋，故曰“西郊”也。时当收敛，臣不专赏，故“施未行”。喻文王也。\n《象》曰：风行天上，小畜。\n《九家易》曰：风者，天之命令也。今行天上，则是令未下行，畜而未下，小畜之义也。\n君子以懿文德。\n虞翻曰：君子，谓乾。懿，美也。豫坤为文。乾为德，离为明。初至四体夬，为书契。乾离照坤，故懿文德也。\n初九：复自道，何其咎，吉。《象》曰：复自道，其义吉也。\n虞翻曰：谓从豫四之初成复卦，故复自道。出入无疾，“朋来无咎，何其咎，吉。”乾称道也。\n九二：牵复，吉。\n崔觐曰：四柔得位，群刚所应，二以中和牵复自守，不失于行也。\n《象》曰：牵复在中，亦不自失也。\n虞翻曰：变应五，故不自失，与比二同义也。\n九三：车说辐，\n虞翻曰：豫、坤为车，为辐。至三成乾，坤象不见，故“车说辐”。马君及俗儒皆以乾为车，非也。\n夫妻反目。\n虞翻曰：豫震为夫，为反。巽为妻。离为目。今夫妻共在四，离火动上，目象不正，巽多白眼，夫妻反目。妻当在内，夫当在外，今妻乘夫而出在外，象曰“不能正室”。三体离需，饮食之道。饮食有讼，故争而反目也。\n《象》曰：夫妻反目，不能正室也。\n《九家易》曰：四互体离，离为目也。离既不正，五引而上，三引而下，故反目也。舆以轮成车，夫以妻成室。今以妻乘夫，其道逆，故“不能正室”。\n六四：有孚，血去惕出，无咎。\n虞翻曰：孚谓五。豫坎为血，为惕。惕，忧也。震为出，变成小畜，坎象不见，故血去惕出。得位承五，故“无咎”也。\n《象》曰：有孚惕出，上合志也。\n荀爽曰：血以喻阴。四阴，臣象。有信顺五。惕，疾也。四当去初，疾出从五，故曰“上合志也”。\n九五：有孚挛如，富以其邻。\n虞翻曰：孚五，谓二也。挛，引也。巽为绳。豫、艮为手。二失位，五欲其变，故曰“挛如”。以，及也。五贵，称富。邻，谓三。兑西震东，称邻。二变承三，故富以其邻，《象》曰“不独富”。二变为既济，与东西邻同义。\n《象》曰：有孚挛如，不独富也。\n《九家易》曰：有信，下三爻也。体巽，故“挛如”，如谓连接其邻。邻，谓四也。五以四阴作财，与下三阳共之，故曰“不独富也”。\n上九：既雨既处，尚得载，妇贞厉。\n虞翻曰：既，已也。应在三。坎水零雨。巽为处，谓二已变，三体坎雨，故“既雨既处”。坎云复天，坎为车，积载在坎上，故上得积载。巽为妇，坎成巽坏，故“妇贞厉”。\n月几望，君子征凶。\n虞翻曰：几，近也。坎月离日，上已正，需时成坎，与离相望。兑西震东，日月象对，故“月几望”。上变阳消，之坎为疑，故“君子征，有所疑”矣。与归妹、中孚“月几望”义同也。\n《象》曰：既雨既处，得积载也。\n虞翻曰：巽消承坎，故“得积载”。坎习为积也。\n君子征凶，有所疑也。\n虞翻曰：变坎为盗，故“有所疑也”。", "10": "《序卦》曰：物畜然后有礼，故受之以履。\n崔觐曰：履，礼也。物畜不通，则君子先懿文德，然后以礼导之，故言“物畜物后有礼”也。\n(兑下乾上)。履：履虎尾，不咥人。亨，利贞。\n虞翻曰：谓变讼初为兑也。与谦旁通。以坤履乾，以柔履刚，谦坤为虎，艮为尾，乾为人，乾兑乘谦，震足蹈艮，故“履虎尾”。兑说而应虎口，与上绝，故“不咥人”。刚当位，故通。俗儒皆以兑为虎，乾履兑，非也。兑刚卤，非柔也。\n《彖》曰：履，柔履刚也。\n虞翻曰：坤柔乾刚，谦坤籍乾，故“柔履刚”。\n荀爽曰：谓三履二也。二五无应，故无元。以乾履兑，故有通。六三履二非和正，故云“利贞”也。\n说而应乎乾，\n虞翻曰：说，兑也。明兑不履乾，故言应也。\n《九家易》曰：动来为兑为应上，故曰“说而应乎乾”也。以喻一国之君，应天子命以临下。承上以巽，据下以说，其正应天，故虎为之“不咥人”也。\n是以履虎尾，不咥人。亨。\n《九家易》曰：虎尾，谓三也。三以说道履五，之应上顺于天，故“不咥人，亨”也。能巽说之道，顺应于五，故虽践虎，不见咥噬也。太平之代，虎不食人，亨谓于五也。\n刚中正，履帝位而不疚，光明也。\n虞翻曰：刚中正，谓五。谦震为帝。五，帝位，坎为疾病，乾为大明。五履帝位，坎象不见。故“履帝位而不疚，光明也”。\n《象》曰：上天下泽，履。君子以辩上下，定民志。\n虞翻曰：君子，谓乾。辩，别也。乾天为上，兑泽为下。谦坤为民，坎为志。谦时坤在乾上，变而为履。故“辩上下，定民志也”。\n初九：素履，往无咎。\n虞翻曰：应在巽，为白，故“素”。履四失位，变往得正，故“往无咎”。初已得正，使四独变，在外称往。《象》曰：“独行愿也”。\n《象》曰：素履之往，独行愿也。\n荀爽曰：初九者，潜位。隐而未见，行而未成。素履者，谓布衣之士，未得居位，独行礼义，不失其正，故“无咎也”。\n九二：履道坦坦，幽人贞吉。\n虞翻曰：二失位。变成震，为道、为大涂，故“履道坦坦”。讼时二在坎狱中，故称幽人。之正得位，震出兑说，幽人喜笑，故“贞吉”也。\n《象》曰：幽人贞吉，中不自乱也。\n虞翻曰：虽幽讼狱中，终辩得正，故“不自乱”。\n六三：眇而视，跛而履，\n虞翻曰：离目不正，兑为小，故“眇而视”。视上应也。讼坎为曳。变震时，为足。足曳，故跛而履。俗儒多以兑刑为跛，兑折震足，为刑人见刑断足者，非为跛也。\n履虎尾，咥人，凶。\n虞翻曰：艮为尾，在兑下，故“履虎尾”。位在虎口中，故“咥人凶”。既跛又眇，视步不能，为虎所啮，故“咥人凶”。《象》曰：“位不当也”。\n武人为于大君。\n虞翻曰：乾象在上，为武人。三失位，变而得正，成乾。故曰“武人为于大君”。志刚也。\n《象》曰：眇而视，不足以有明也。跛而履，不足以与行也。\n侯果曰：六三，兑也。互有离巽，离为目，巽为股。体俱非正，虽能视，眇目者也。虽能履，跛足者也。故曰“眇能视，不足以有明。跛能履，不足以与行”。是其义也。\n咥人之凶，位不当也。\n案：六三为履卦之主。体说应乾，下柔上刚，尊卑合道，是以“履虎尾，不咥人，通”。今于当爻以阴处阳，履非其位，互体离兑，水火相刑。故独唯三被咥，凶矣。\n武人为于大君，志刚也。\n案：以阴居阳，武人者也。三互离爻，离为响明，为于大君，南面之象，与乾上应，故曰“志刚”。\n九四：履虎尾，愬愬，终吉。\n虞翻曰：体与下绝，四多惧，故“愬愬”。变体坎，得位，承五应初，故终吉。《象》曰：“志行也”。\n《象》曰：愬愬终吉，志行也。\n侯果曰：愬愬，恐惧也。履乎兑主，履虎尾也。逼近至尊，故恐惧。以其恐惧，故“终吉”也。执乎枢密，故“志行”也。\n九五：夬履，贞厉。\n虞翻曰：谓三。上已变，体夬象，故“夬履”。四变五，在坎中也，为上所乘，故“贞厉”。《象》曰：“位正当也”。　　《象》曰：夬履贞厉，位正当也。\n干宝曰：夬，决也。居中履正，为履贵主。万方所履，一决于前，恐决失正，恒惧危厉。故曰“夬履贞厉，位正当也”。　　上九：视履考详，其旋元吉。\n虞翻曰：应在三，三先视上，故上亦视三。故曰“视履考详”矣。考，稽。详，善也。乾为积善，故“考详”。三上易位，故“其旋元吉”。《象》曰：“大有庆也”。\n《象》曰：元吉在上，大有庆也。\n卢氏曰：王者履礼于上，则万方有庆于下。", "11": "《序卦》曰：履而泰，然后安，故受之以泰。泰者，通也。\n崔觐曰：以礼导之，必通。通然后安，所谓君子以辩上下，定民志，通而安也。\n(乾下坤上)。泰：小往大来，吉、亨。\n虞翻曰：阳息坤反，否也。坤阴诎外，为小往。乾阳信内，称大来。天地交，万物通，故“吉、亨”。\n《彖》曰：泰，小往大来，吉、亨。\n蜀才曰：此本坤卦。小，谓阴也。大，谓阳也。天气下，地气上，阴阳交，万物通，故“吉、亨”。\n则是天地交而万物通也；\n何妥曰：此阴在道泰也。夫泰之为道，本以通生万物。若天气上腾，地气下降，各自闭塞，不能相交，则万物无由得生。明万物生，由天地交也。\n上下交而其志同也；\n何妥曰：此明人事泰也。上之与下，犹君之与臣，君臣相交感，乃可以济养民也。天地以气通，君臣以志同也。\n内阳而外阴，内健而外顺；\n何妥曰：此明天道也。阴阳之名，就爻为语。健顺之称，指卦为言。顺而阴居外，故曰“小往”。健而阳在内，故曰“大来”。\n内君子而外小人，\n崔觐曰：此明人事也。阳为君子，在内，健于行事。阴为小人，在外，顺以听命。\n君子道长，小人道消也。\n《九家易》曰：谓阳息而升，阴消而降也。阳称息者，长也。起复成巽，万物盛长也。阴言消者，起姤终乾。万物成熟。成熟则给用，给用则分散。故阴用特言消也。　　《象》曰：天地交泰，\n荀爽曰：坤气上升，以成天道。乾气下降，以成地道。天地二气，若时不交，则为闭塞。今既相交，乃通泰。\n后以财成天地之道，\n虞翻曰：后，君也。阴升乾位。坤，女主，故称后。坤富，称财。守位以人，聚人以财，故曰“成天地之道”。\n辅相天地之宜，以左右民。\n虞翻曰：相，赞。左右，助之。震为左，兑为右，坤为民，谓以阴辅阳。《诗》曰：宜民宜人，受禄于天。\n郑玄曰：财，节也。辅，相。左右，助也。以者，取其顺阴阳之节，为出内之政。春崇宽仁，夏以长养，秋教收敛，冬敕盖藏，皆可以成物助民也。\n初九：拔茅茹，以其汇，征吉。\n王弼曰：茅之为物，拔其根而相牵引也。茹，相牵引之貌也。三阳同志，俱志在外。初为类首，已举，则从若茅茹也。上顺而应，不为违距，进皆得志。故“以其类，征吉”也。　　《象》曰：拔茅征吉，志在外也。\n虞翻曰：否泰反其类，否巽为茅。茹，茅根。艮为手。汇，类也。初应四，故拔茅茹以汇。震为征，得位应四，征吉。外，谓四也。\n九二：包荒，\n翟玄曰：荒，虚也。二五相应，五虚无阳，二上包之。　　用冯河，不遐遗。\n荀爽曰：河出于乾，行于地中。阳性欲升，阴性欲承。冯河而上，不用舟航。自地升天，道虽辽远，三体俱上，不能止之，故曰“不遐遗”。\n朋亡，得尚于中行。\n荀爽曰：中，谓五。坤为朋，朋亡而下，则二上居五，而行中和矣。\n《象》曰：包荒，得尚于中行，以光大也。\n虞翻曰：在中称包。荒，大川也。冯河，涉河。遐，远；遗，亡也。失位变得正，体坎。坎为大川，为河。震为足。故“用冯河”。乾为远，故“不遐遗”。兑为朋，坤虚无君，欲使二上，故“朋亡”。二与五易位，故得上于中行。震为行，故“光大也”。\n九三：无平不陂，无往不复。\n虞翻曰：陂，倾。谓否上也。平，谓三。天地分，故平。天成地平，谓危者使平，易者使倾。往，谓消外。复，谓息内。从三至上，体复。终日乾乾，反复道。故“无平不陂，无生不复”。\n艰贞无咎。勿恤其孚，于食有福。\n虞翻曰：艰，险。贞，正。恤，忧。孚，信也。二之五，得正，在坎中，故“艰贞”。坎为忧。故“勿恤”。阳在五孚，险坎为孚，故有孚。体噬嗑食也。二上之五据四，则三乘二。故“于食有福”也。\n《象》曰：无平不陂，天地际也。\n宋衷曰：位在乾极，应在坤极，天地之际也。地平极则险陂，天行极则还复，故曰“无平不陂，无往不复”也。\n六四：翩翩，不富以其邻，\n虞翻曰：二五变时，四体离飞，故“翩翩”。坤虚无阳，故“不富”。兑西震东，故称“其邻”。三阴乘阳，不得之应。《象》曰：“皆失实也。”\n不戒以孚。\n虞翻曰：谓坤。邑人不戒，故使二升五，信来孚邑，故“不戒以孚”。二上体坎，中正。《象》曰：“中心愿也。”与比邑人不诫同义也。\n《象》曰：翩翩不富，皆失实也。\n宋衷曰：四互体震，翩翩之象也。阴虚阳实，坤今居上，故言“失实也”。\n不戒以孚，中心愿也。\n《九家易》曰：乾升坤降，各得其正。阴得承阳，皆阳心之所愿也。\n六五：帝乙归妹，以祉元吉。\n《九家易》曰：五者，帝位，震象称乙，是为帝乙。六五以阴处尊位，帝者之姊妹。五在震后，明其为妹也。五应于二，当下嫁二。妇人谓嫁曰归。故言“帝乙归妹”。谓下居二，以中和相承，故“元吉”也。\n虞翻曰：震为帝，坤为乙。帝乙，纣父。归嫁也。震为兄，兑妹，故嫁妹。祉，福也。谓五变体离，离为大腹，则妹嫁而孕，得位正中，故“以祉元吉”也。\n《象》曰：以祉元吉，中以行愿也。\n《九家易》曰：五下于二，而得中正，故言“中以行愿”也。\n上六：城复于隍，\n虞翻曰：否艮为城，故称城坤为积土。隍，城下沟。无水称隍，有水称池。今泰反否，乾坏为土，艮城不见，而体复象，故“城复于隍”也。\n勿用师，自邑告命，贞吝。\n虞翻曰：谓二，动时体师。阴皆乘阳，行不顺，故“勿用师”。坤为自邑，震为言，兑为口，否巽为命。今逆陵阳，故“自邑告命”。命逆不顺，阴道先迷，失实远应，故“贞吝”。\n《象》曰：城复于隍，其命乱也。\n《九家易》曰：乾当来上，不可用师而拒之也。自邑者，谓从坤性而降也。告命者，谓下为巽，宣布君之命令也。三阴自相告语，俱下服顺承乾也。城复于隍，国政崩也。坤为乱，否巽为命，交在泰上，故“其命乱也”。", "12": "《序卦》曰：物不可以终通，故受之以否。\n崔觐曰：物极则反，故不终通而否矣，所谓“城复于隍”者也。\n(坤下乾上)。否：否之匪人，不利君子贞，大往小来。\n虞翻曰：阴消乾，又反泰也。谓三。比坤灭乾，以臣弑其君子弑其父，故曰“匪人”。阴来灭阳，君子道消，故“不利君子贞”。阴信阳诎，故“大往小来”。则是天地不交而万物不通，与比三同义也。\n《彖》曰：否匪人，不利君子贞。\n崔觐曰：否，不通也。于不通之时，小人道长，故云“匪人”。君子道消，故“不利君子贞”也。\n大往小来，\n蜀才曰：此本乾卦。大往，阳往而消。小来，阴来而息也。\n则是天地不交而万物不通也。\n何妥曰：此明天道否也。\n上下不交而天下无邦也。\n何妥曰：此明人事否也。泰中言志同，否中云无邦者，言人志不同，必致离散，而乱邦国。崔觐曰：君臣乖阻，取乱之道，故言“无邦”。\n内阴而外阳，内柔而外刚，\n崔觐曰：阴、柔，谓坤。阳、刚，谓乾也。\n内小人而外君子。小人道长，君子道消也。\n崔觐曰：君子在野，小人在位之义也。\n《象》曰：天地不交，否。\n宋衷曰：天地不交，犹君臣不接。天气上升，而不下降；地气沈下，又不上升。二气特隔，故云“否”也。\n君子以俭德辟难，不可荣以禄。\n虞翻曰：君子谓乾，坤为营，乾为禄，难谓坤为弑君故以“俭德辟难”。巽为入伏，乾为远，艮为山，体遁象，谓辟难远遁入山，故“不可营以禄”。营，或作荣。俭，或作险。\n孔颍达曰：言君子于此否时，以节俭为德，辟其危难，不可荣华其身，以居禄位。若据诸侯公卿而言，是辟时群小之难，不可重受官爵也。若据王者言之，谓节俭为德，辟阴阳厄运之难，不可自重荣贵而骄逸也。　　初六：拔茅茹以其汇，贞吉，亨。\n荀爽曰：拔茅茹，取其相连，汇者，类也。合体同包，调坤三爻同类相连，欲在下也。贞者，正也。谓正居其所则“吉”也。\n《象》曰：拔茅贞吉，志在君也。\n《九家易》曰：阴志在下，欲承君也。\n案：初六，巽爻。巽为草木，阳爻为木，阴爻为草。初六阴爻，草茅之象也。\n六二：包承，小人吉，大人否，亨。\n荀爽曰：二与四同功，为四所包，故曰“包承”也。小人，二也。谓一爻独居，间象相承，得系于阳，故“吉”也。大人，谓五。乾坤分体，天地否隔，故曰“大人否”也。二五相应，否义得通，故曰“否，亨”矣。\n《象》曰：大人否享，不乱群也。\n虞翻曰：否，不也”物三称群，谓坤三阴乱弑君，大人不从，故“不乱群”也。\n六三：包羞。《象》曰：包羞，位不当也。\n荀爽曰：卦性为否，其义否隔。今以不正，与阳相承，为四所包，违义失正，而可羞者，以“位不当”故也。\n九四：有命，无咎，畴离祉。\n《九家易》曰：巽为命。谓受五之命，以据三阴，故“无咎”。无命而据，则有咎也。畴者，类也。谓四应初据三，与二同功，故阴类皆离祉也。离，附。祉，福也。阴皆附之，故曰有福。谓下三阴离，受五四之福也。\n《象》曰：有命无咎，志行也。\n荀爽曰：谓志行于群阴也。\n九五：休否，大人吉。\n《九家易》曰：否者消卦，阴欲消阳。故五处和居正，以否绝之。乾坤异体，升降殊隔，卑不犯尊，故“大人吉”也。\n其亡其亡，\n荀爽曰：阴欲消阳，由四及五，故曰“其亡其亡”。谓坤性顺从，不能消乾使亡。\n系于包桑。\n荀爽曰：包者，乾坤相包也。桑者，上玄下黄，以象乾坤也。乾职在上，坤体在下，虽欲消乾，系其本体，不能亡也。\n京房曰：桑有衣食人之功，圣人亦有天覆地载之德，故以喻。\n陆绩曰：包，本也。言其坚固不亡，如以巽绳系也。\n案：其亡其亡，近死之嗟也。其与几同。几者，近也。九五居否之时，下包六二。二互坤艮，艮山坤地，地上即田也。五互巽木，田上有木，莫过于桑。如曰“其亡其亡，系于苞桑”。言五二包系，根深蒂固，若山之坚，如地之厚者也。虽遭危乱，物莫能害矣。\n郑玄曰：犹纣囚文王于羑里之狱，四臣献珍异之物，而终免于难，系于包桑之谓。\n《象》曰：大人之吉，位正当也。\n崔觐曰：得位居中也。\n上九：倾否，先否后喜。\n侯果曰：倾为覆也。否穷则倾矣。倾犹否，故“先否”也。倾毕则通，故“后喜”也。\n《象》曰：否终则倾，何可长也。\n虞翻曰：否终必倾，盈不可久，故“先否”。下反于初，成益，体震，民说无疆，故“后喜”。以阴剥阳，故不可久也。", "13": "《序卦》曰：物不可以终否，故受之以同人。\n崔觐曰：否终则倾，故同于人。通而利涉矣。\n(离下乾上)。同人：同人于野，亨。\n郑玄曰：乾为天，离为火。卦体有巽，巽为风。天在上，火炎上而从之，是其性同于天也。火得风，然后炎上益炽，是犹人君在上施政教，使天下之人和同而事之。以是为人和同者，君之所为也。故谓之“同人”。风行无所不遍，遍则会通之德大行，故曰“同人于野，亨”。\n利涉大川，利君子贞。\n崔觐曰：以离文明，而合乾健。九五中正，同人于二，为能通天下之志，故能“利涉大川，利君子之贞”。\n《彖》曰：同人，\n《九家易》曰：谓乾舍于离，同而为日。天日同明，以照于下。君子则之，上下同心，故曰“同人”。\n柔得位得中，而应乎乾，曰同人。\n蜀才曰：此本夬卦。九二升上，上六降二，则“柔得位得中，而应乎乾”。下奉上之象，义同于人，故曰“同人”。\n同人曰：同人于野，亨，利涉大川，乾行也。\n虞翻曰：旁通师卦。巽为同，乾为野。师震为人。二得中应乾。故曰“同人于野，亨”。此孔子所以明嫌表微。师震为夫，巽为妇，所谓二人同心。故不称君臣、父子、兄弟、朋友，而故言人耳。乾四上失位，变而体坎，故曰“利涉大川，乾行也”。\n侯果曰：九二升上，上为郊野，是“同人于野”而得通者，由乾爻上行耳。故特曰“乾行也”。\n文明以健，中正而应，君子正也。\n何妥曰：离为文明，乾为刚健。健非尚武，乃以文明。应不以邪，乃以中正。故曰“利君子贞”也。\n唯君子为能通天下之志。\n虞翻曰：唯，独也。四变成坎。坎为通、为志。故“能通天下之志”。谓五以类族辩物，圣人作而万物睹。\n崔觐曰：君子谓九五。能舍已同人，以通天下之志。若九三、九四，以其人臣，则不当矣。故爻辞不言同人也。\n《象》曰：天与火，同人。\n荀爽曰：乾舍于离，相与同居，故曰“同人”也。\n君子以类族辩物。\n虞翻曰：君子谓乾。师坤为类，乾为族。辩，别也。乾，阳物。坤，阴物。体姤，天地相遇，品物咸章，以乾照坤。故“以类族辩物”。谓方以类聚，物以群分。孔子曰：君子和而不同，故于同人象见，以“类族辩物”也。\n初九：同人于门，无咎。\n虞翻曰：乾为门，谓同于四，四变应初，故“无咎”也。\n《象》曰：出门同人，又谁咎也。\n崔觐曰：刚而无应，比二以柔，近同于人，出门之象，“又谁咎矣”。\n案：初九，震爻。帝出乎震。震为大涂，又为入门出门之象也。\n六二：同人于宗，吝。\n荀爽曰：宗者，众也。三据二阴，二与四同功，五相应，初相近，上下众阳，皆欲与二为同，故曰“同人于宗”也。阴道贞静，从一而终，今宗同之，故“吝”也。\n《象》曰：同人于宗，吝道也。\n侯果曰：宗，谓五也。二为同人之主，和同者之所仰也。有应在五，唯同于五，过五则否，不能大同于人，则为主之德吝狭矣。所同虽吝，亦妻臣之道也。\n九三：伏戎于莽，升其高陵，三岁不兴。\n虞翻曰：巽为伏，震为草莽，离为戎。谓四变时三在坎中，隐伏自藏，故“伏戎于莽”也。巽为高，师震为陵，以巽股升其高陵。爻在三。乾为岁。兴，起也。动不失位，故“三岁不兴”也。\n《象》曰：伏戎于莽，敌刚也。三岁不兴，安行也。\n崔觐曰：与二相比，欲同人焉。盗憎其主，而忌于五，所以隐兵于野，将以袭之，故曰“伏戎于莽”。五既居上，故曰“升其高陵”。一爻为一年，自三至五，频遇刚敌，故“三岁不兴，安可行也”。\n案：三互离巽，巽为草木，离为戈兵，伏戎于莽之象也。\n九四：乘其庸，弗克攻，吉。\n虞翻曰：巽为庸，四在巽上，故“乘其庸”。变而承五。体讼，乾刚在上。故“弗克攻”，则“吉”也。\n《象》曰：乘其庸，义弗克也。其吉，则困而反则也。\n王弼曰：处上攻下，力能乘庸者也。履非其位，与三争二。二自应五，三非犯已，攻三求二，尤为效之。违义伤礼，众所不与。势虽乘墉，义终弗克，而得吉者，以困而反正则也。\n九五：同人先号咷而后笑，大师克相遇。\n虞翻曰：应在二。巽为号咷，乾为先，故“先号咷”。师震在下，故“后笑”。震为后笑也。乾为大，同人反师，故“大师”。二至五，体姤遇也，故“相遇”。\n《象》曰：同人之先，以中直也。大师相遇，言相克也。\n侯果曰：乾德中直，不私于物，欲天下大同，方始同二矣。三四失义，而近据之，未获同心，故“先号咷”也。时须同好，寇阻其途，以言相克，然后始相遇，故笑也。\n《九家易》曰：乾为言。\n上九：同人于郊，无悔。\n虞翻曰：乾为郊。失位无应，与乾上九同义，当有悔。同心之家。故“无悔”。\n《象》曰：同人于郊
