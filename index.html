之初，虽大过而不过，故占者无咎。\n《象》曰：“藉用白茅”，柔在下也。\n阴柔居巽之下。\n九二：枯杨生稊，老夫得其女妻，无不利。\n巽为“杨”，杨之象也。木生于泽下者杨独多，故取此象。杨乃木之弱者。四阳之刚皆同为木，但二五近本末之弱，故以“杨”言。曰“枯”者，取大过乎时之义，故二、五皆言枯也。至三、四则成乾之坚刚，故言栋。“稊”，木稚也。二得阴在下，故言“生稊”。“稊”者，下之根生也。五得阴在上，故言生华。“生华”者，上之枝生也。根生则生生不息，枝生则无生意矣。下卦巽错震，长男也，老夫之象，故称“老夫”。“老夫”者，再娶之夫也。应爻兑，兑乃少女也，女妻之象，故称“女妻”。“女妻”者，未嫁而幼者也。九五兑错艮，少男也，“士夫”之象。“士夫”乃未娶者。应爻巽为长女，“老妇”之象也，故称“老妇”。“老妇”者，已嫁而老者也。周公爻辞其精至此。旧注但以二、五皆比于阴为言，则九二近初而称老，九五近上反称少，说不通矣。\n九二阳刚得中，当大过之时，而应于少女，故取诸物有“枯杨生稊”，取诸身有“老夫得其女妻”之象，可以成生育之功矣。故占者“无不利”。\n《象》曰：“老夫”“女妻”，过以相与也。\n此庆幸之辞。言阳方大过之始，得少阴以之相与，则刚柔相济，过而不过，可以成生育之功矣。故占者“无不利”。\n九三：栋桡，凶。\n变坎为栋，又木坚多心，栋之象也。因坎三、四皆以栋言，因巽二、五皆以杨言。文王“栋桡”，本末皆弱。周公“栋桡”，因初之弱。\n九三居内卦，下阴虚弱，下虚弱则上不正，故有“栋桡”之象，占者之凶可知矣。\n《象》曰：“栋桡”之“凶”，不可以有辅也。\n同体之初，虚弱无辅助也。\n九四：栋隆吉，有它吝。\n变坎亦有栋象。“隆”者，隆然而高起也。“它”者，初也。三、四皆栋。四居外卦，阴虚在上，非如三之阴虚在下也。上虚下实，则有所承载，故有“栋隆”之象。占者固吉矣。然下应乎初，若以柔济之，则过于柔矣，其栋决不能隆，吝之道也。故又戒占者以此。\n《象》曰：“栋隆”之“吉”，不桡乎下也。\n因外卦虚在上实在下，所以不桡，故曰“不桡乎下”也。“不可以有辅”者，下虚故也。“不桡乎下”者，下实故也。\n九五：枯杨生华，老妇得其士夫，无咎无誉。\n兑综巽，又杨之象也。“生华”者，杨开花则散漫，终无益于枯也。老妇、士夫详见九二爻下。\n九五以阳刚应乎过极之长女，乃时之大过，而不能生育者也，故有“枯杨生华，老妇得其士夫”之象。占者得此，揆之于理，虽无罪名，而老妇反得士夫，亦非配合之美矣，安得又有誉哉！故其象占如此。\n《象》曰：“枯杨生华”，何可久也？“老妇”“士夫”，亦可丑也。\n“何可久”言终散漫，“亦可丑”言非配合。不惟不能成生育之功，而配合非宜，亦可丑也。\n上六：过涉灭顶，凶，无咎。\n“顶”者，首也。变乾为首，“顶”之象也。当过之时，遇兑泽之水，“过涉”之象也。泽水在首，灭没其顶之象也。以二阴爻论之，初“藉用白茅”，大过于慎者也。以其居卦之初，故不凶而无咎。上“过涉灭顶”，大过于济者也。以其居卦之终，故有凶而无咎。\n上六处大过已极之时，勇于必济，有冒险过涉之象。然才弱不能以济，故又有“灭顶”之象。“过涉灭顶”，必杀身矣，故占者必凶。然不避艰险，慷慨赴死，杀身成仁之事也，故其义“无咎”。\n《象》曰：“过涉”之凶，不可咎也。\n“无咎”者，上六本无咎也。“不可咎”者，人不得而咎之也。以人事论，过涉之凶，虽不量其浅深以取祸，然有死难之节，而无苟免之羞，论其心不论其功，论是非不论利害，人恶得而咎之？","29":"坎\n“习”，重习也；“坎”，坎陷也。其卦一阳陷于二阴之中，此坎陷之义也。坎为水者，四阴土坎也，二阳坎中之水也。天一生水，所以象水也。上坎下坎，故曰“重险”。《序卦》：“物不可以终过，故受之以坎。”所以次大过。\n习坎，有孚，维心亨，行有尚。\n“维”者，系也。“尚”者，有功可嘉尚也。身在坎中，所可自主者，独此心耳。人之处险，占得此者，能诚信以维系于其心，安于义命而不侥幸苟免，则此心有主，利害祸福不能摇动，是以脱然无累，而心亨矣。由是洞察时势，惟取必于理而行之，故可出险有功，所以“行有尚”。九二、九五，中实有孚之象。陷于坎中而刚中之德自若，“维心亨”之象。\n《彖》曰：习坎，重险也。水流而不盈，行险而不失其信。“维心亨”，乃以刚中也。“行有尚”，往有功也。天险，不可升也。地险，山川丘陵也。王公设险以守其国。坎之时用大矣哉！\n以卦象、卦德、卦体释卦名、卦辞而极言之。上险下险，故曰“习坎”。“水流不盈”者，足此通彼，未尝泛滥而盈满也。行险即水流，以其专赴于壑，故曰“行险”。行此险陷，未尝失其不盈之信，是天下之有孚者，莫过于水矣，故教占者“有孚”。“刚中”者，二、五阳刚在内，则以理为主，光明正大，而无一毫行险侥幸之私，所以“亨”也。故蒙卦、比卦皆坎，皆曰“以刚中”。“心亨”则洞见乎事机之变，自可以拯溺亨屯，出险而有功也。盖有主乎内者，理不足以胜私，则推行于外者，诚必不能动物，故刚中则心亨，心亨则往有功而出险矣，此内外功效之自然也。“天险”者，无形之险也。“地险”者，有形之险也。“设”，置也。“设险”者，置险也，无形而欲其有形也。大而京师都会，则披山带河，据其形胜以为险也；小而一郡一邑，则筑城凿池，据其高深以为险也。此则在人之险，因无形而成有形，欲其与天地同其险者也。坎，月之象；错离，日之象；中爻震，雷之象；错巽，风之象。日月风雷，故曰“天险”。不然，天苍然而已，何处有险？因卦中有天象，所以言天险也。四坤土，地之象也；中爻艮土，山丘陵之象也；本卦坎，“川”之象也；九五居尊，王公之象也；中爻艮止，“守”之象也；坤土中空，“国”之象也。故益卦三阳三阴而曰“为依迁国”。“时用”者，时有用也。险之为用，上极于天，下极于地，中极于人，故以“大矣哉”赞之，与睽、蹇卦同。\n《象》曰：水洊至，习坎。君子以常德行，习教事。\n行，下孟反。\n“洊”，再至也。下坎，内水之方至也；上坎，外水之洊至也。水洊习则恒久而不已，是天下之有恒者莫如水也。君子体之，“常德行”者，以此进德也。“习教事”者，以此教民也。德行常则德可久，教事习则教不倦矣。\n初六：习坎，入于坎窞，凶。\n窞，徒览切。淡上声，音胆。\n“窞”者，坎中小坎傍入者也。水性本下，而又居卦之下；坎体本陷，而又入于窞，则陷中之陷矣。\n初六阴柔居重险之下，其陷益深，故有在“习坎”而又“入坎窞”之象。占者如是，则终于沦没，而无出险之期，凶可知矣。\n《象》曰：“习坎”入坎，失道凶也。\n刚中维心亨，出险之道也。今阴居重险之下，则与刚中维心亨相反，失出险之道矣，所以凶。\n九二：坎有险，求小得。\n曰有险则止于有险而已，非初与三“入坎窞”之甚矣。中爻震错巽，巽为“近市利”，求得之象也。故随卦中爻巽，亦曰“随有求得”。变坤，阳大阴小，“求小得”之象也。\n九二处于险中，欲出险而未能，故为坎有险之象。然刚虽得中，虽亦“有孚维心”，但在险中，仅可求小得而已，若出险之大事，则未能矣，故其象占如此。\n《象》曰：“求小得”，未出中也。\n未出险中。\n六三：来之坎坎，险且枕。入于坎窞，勿用。\n“之”者，往也。“来之”者，来往也。内外皆坎，“来往”之象也。下坎终而上坎继，“坎坎”之象也。故乾九三曰“乾乾”。中爻震，木横于内，而艮止不动，“枕”之象也。“险且枕”者，言面临乎险而头枕乎险也。初与三，皆入“坎窞”，而二止言有险者，二中正，初与三不中正也。“勿用”者，言终无出险之功，无所用也。\n六三阴柔，又不中正，而履重险之间，故其来也亦坎，往也亦坎。盖往则上坎在前，是前遇乎险矣；来则下坎在后，是后又枕乎险矣。前后皆险，将入于坎之窞，而不能复出，故有此象。占者得此，勿用可知矣。\n《象》曰：“来之坎坎”，终无功也。\n处险者以出险为功，故曰“终无功”，与往有功相反。\n六四：樽酒，簋贰，用缶，纳约自牖，终无咎。\n四变中爻离、巽。巽木，离中虚，樽之象也。坎水，酒之象也。中爻震竹，簋乃竹器，簋之象也。缶，瓦器。比卦坤土中虚，初变震有离象，故曰“缶”。离卦鼓缶，此变离，故曰“缶”。《汉书》：“击缶而歌乌乌。”“贰”者，副也。言一樽之酒，贰簋之食，乐用瓦缶，皆菲薄至约之物也。“纳约自牖”者，自进于牖下，陈列此至约之物而纳进之也。在墙曰“牖”，在屋曰“囱”。牖乃受明之处。变离，牖之象也。此与遇主于巷同意，皆其坎陷艰难之时，故不由正道也。盖“樽酒，簋贰，用缶”，见无繁文之设；“纳约”曰“自”，见无傧介之仪。世故多艰，非但君择臣，臣亦择君。所以进麦饭者不以为简，而雪夜幸其家，以嫂呼臣妻者，不以为渎也。修边幅之公孙述，宜乎为井底蛙矣。\n六四柔顺得正，当国家险难之时，近九五刚中之君，刚柔相济，其势易合，故有简约相见之象。占者如此，庶能共谋出险之计，始虽险陷，终得无咎矣。\n《象》曰：“樽酒簋贰”，刚柔际也。\n“刚”，五；“柔”，四。际者，相接际也。五思出险而下求，四思出险而上交，此其情易合而礼薄，亦可以自通也。\n九五：坎不盈，祗既平，无咎。\n祗，作坻。\n“祗”，水中小渚也，《诗》“宛在水中祗”是也。“坎不盈”者，坎水犹不盈满，尚有坎也。“平”者，水盈而平也。“祗既平”，则将盈而出险矣。“坎不盈”者，见在之辞。“祗既平”者，逆料之辞，言一时虽未平，将来必平也。“无咎”者，言由险而太平也。\n九五犹在险中，以地位言，故有“坎不盈”之象。然阳刚中正，其上止有一阴，计其时亦将出险矣，故又有“祗既平”之象。若未平，未免有咎，既平则无咎矣，故占者“无咎”也。\n《象》曰：“坎不盈”，中未大也。\n“中”者，中德也。“未大”者，时也。中德虽具，而值时之艰，未大其显施而出险也。\n上六：系用徽，寘于丛棘，三岁不得，凶。\n，音墨。\n“系”，缚也。徽、皆索名，三股曰“徽”，二股曰“”。此爻变巽，其为绳，又为长，“徽”之象也。“寘”者，置也，囚禁之意。坎为丛棘，“丛棘”之象也。今囚罪人之处，以棘刺围墙是也。言缚之以“徽”，而又囚之于“丛棘”之中也。三岁不得者，言时之久，而不得脱离者。坎错离，三之象也。\n上六以阴柔居险之极，所陷益深，终无出险之期，故有此象。占者如此，死亡之祸不能免矣，故凶。\n《象》曰：上六失道，凶“三岁”也。\n“道”者，济险之道，即有孚维心，以刚中也。今阴柔失此道，所以有“三岁不得”之凶。","30":"离上而坎下也\n“离”者，丽也，明也。一阴附丽于上下之阳，丽之象也。“离”者，明之义也。离为火，火无常形，附物而明，所谓以薪传火也。《序卦》：“坎者陷也，陷必有所丽，故受之以离。”火中虚而暗，以其阴也；水中实而明，以其阳也。有明必有暗，有昼必有夜，理之常也，所以次坎。\n离：利贞，亨。畜牝牛，吉。\n六二居下离之中则正，六五居上离之中则不正，故利于正而后亨。“牛”，顺物，“牝牛”则顺之至也。“畜牝牛”者，养顺德也。养顺德于中者，正所以消其炎上之燥性也，故“吉”。\n《彖》曰：离，丽也。日月丽乎天，百谷草木丽乎土，重明以丽乎正，乃化成天下。柔丽乎中正，故“亨”，是以“畜牝牛，吉”也。\n释卦名义并卦辞。五为天位，故上离有“日月丽天”之象，此以气丽气者也。二为地位，故下离有“百谷草木丽土”之象，此以形丽形者也。离附物，故有气有形。重明者，上离明，下离明也。上下君臣皆丽乎正，则可以化成天下而成文明之俗矣。柔丽乎中正者，分言之，六五丽乎中，六二丽乎中正也；总言之，柔皆丽乎中正也。惟其中正，所以利贞而后亨。惟柔中正而后亨，所以当“畜牝牛”，养其柔顺中正之德而后吉也。\n《象》曰：明两作，离。大人以继明照于四方。\n“作”者，起也。“两作”者，一明而两作也。言今日明，明日又明也。“继明”，如云圣继圣也。以人事论，乃日新又新，缉熙不已也。“照于四方”者，光被四表也。大人以德言则圣人，以位言则王者。其所谓明者，内而一心，外而应事接物皆明也，是以达事理辨民情，天下之邪正得失皆得而见之，不必以察为明而明照于四方矣。“重明”者，上下明也。“继明”者，前后明也。《彖》言二、五“君臣”，故以“重明”言之。《象》言“明两作”皆君也，故以“继明”言之。\n初九：履错然，敬之，无咎。\n“履”者，行也，进也。错者，杂也，交错也。《诗传》云：“东西为交，邪行为错。”本爻阳刚，阳性上进；本卦离火，火性炎上，皆有行之之象，故曰“履”。又变艮，综震足，亦履之象也。艮为径路，交错之象也。“然”者，助语辞。“错然”者，刚则躁，明则察，二者交错于胸中，未免东驰西走。惟敬以直内，则安静而不躁妄，主一而不过察。则敬者，医错之药也，故“无咎”。“无咎”者，刚非躁、明非察也。\n初九以刚居下而处明体，刚明交错，故有“履错然”之象。惟敬则无此咎矣。故教占者以此。\n《象》曰：“履错”之敬，以辟咎也。\n辟，音避。\n“避”者，回也。敬则履错之咎皆回避矣。\n六二：黄离，元吉。\n“黄”，中色。坤为黄，离中爻乃坤土，黄之象也。“离”者，附丽也。“黄离”者，言丽乎中也，即柔丽乎中正也。以人事论，乃顺以存心，而不邪侧，顺以处事，而不偏倚是也。“吉”者，无所处而不当也。八卦正位，离在二，故“元吉”。\n六二柔丽乎中而得其正，故有“黄离”之象。占者得此，大吉之道也，故“元吉”。\n《象》曰：“黄离，元吉”，得中道也。\n得中道以成中德，所以凡事无过不及而元吉。\n九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。\n变震为鼓，鼓之象也。离为大腹，又中虚，缶之象也。中爻兑口，歌与嗟之象也。“缶”乃常用之物，“鼓缶”者，乐其常也。人寿八十曰“耋”。喜则歌，忧则嗟。嗟者歌之反。\n重离之间，前明将尽，后明当继之时也，故有“日昃”之象。然盛衰倚伏，天运之常。人生至此，乐天知命，“鼓缶而歌”，以安其日用之常分可也。此则达者之事也。若不能安常以自乐，徒戚戚于“大耋之嗟”，则非为无益，适自速其死矣，何凶如之！故又戒占者不当如此。\n《象》曰：“日昃之离”，何可久也？\n日既倾昃，明岂能久？\n九四：突如其来如，焚如，死如，弃如。\n“突”者，灶突也。离中虚，灶突之象也。“突如其来如”者，下体之火，如灶突而炎上也。火性炎上，三之旧火既上于四，而不能回于其三，四之新火又发，五得中居尊，四之火又不敢犯乎其五，上下两无所容，则火止于四而已。故必至于“焚如死如”，成灰“弃如”而后已也。如者，助语辞。坎性下，三在下卦之上，故曰“来”，此来而下者也。火性上，四在上卦之下，故曰“来”，此来而上者也。来而下，必至坎窞而后已，来而上，必至死弃而后已。\n四不中正，当两火相接之时，不能容于其中，故有此象。占者之凶可知矣。\n《象》曰：“突如其来如”，无所容也。\n三爻上而不能反，三不能容也。五中尊而不敢犯，五不能容也。\n六五：出涕沱若，戚嗟若，吉。\n“涕”，沱貌。离错坎，涕若之象也，又加忧戚之象也。中爻兑口，嗟之象也。“出涕沱若”者，忧惧之征于色也。“戚嗟若”者，忧惧之发于声也。二五皆以柔丽乎刚，二之辞安，五之辞危者，二中正，五不正故也。\n六五以柔居尊而守中，有文明之德，然附丽于强刚之间，必不恃其文明与其中德，能忧惧如此，然后能吉。戒占者当如此。\n《象》曰：六五之吉，离王公也。\n离，音丽。\n王指五，公指上九。“离王公”者，言附丽于王之公也。王与公相丽，阴阳相资，故“吉”。不言四者，四无所容，而上九能正邦也。\n上九：王用出征有嘉，折首，获匪其丑，无咎。\n“王”指五。离为日，王之象也。“用”者，用上九也。五附丽于上九，用之之象也。“有嘉”者，嘉上九也，即王三锡命也。“折首获匪其丑”，即可嘉之事也。离为戈兵，变为震动，戈兵震动，“出征”之象也。王用上九专征，可谓宠之至矣。为上九者，若不分其首从而俱戮之，是火炎昆冈，安得可嘉？又安得无咎？“折首”者，折取其魁首，即歼厥渠魁也。“获匪其丑”者，执获不及其小丑，即“胁从罔治”也。乾为首，首象阳，丑象阴。明夷外卦错乾，故曰“大首”。本爻乾阳，且离为“上稿”，“折其首”之象也。本卦阳多阴少，阴乃二五君臣，无群小之丑，“获匪其丑”之象也。“无咎”者，勇足以折首而仁及于小丑也。“王用出征有嘉”一句，“折首”一句，“获匪其丑”一句。\n上九以阳刚之才，故有“王用出征有嘉”之象。又当至明之极，首从毕照，故又有出征唯折其首，不及于丑之象，乃“无咎”之道也。故其象占如此。\n《象》曰：“王用出征”，以正邦也。\n“征”之为言，正也。寇贼乱邦，故“正”之。六五明于用人，上九明于人之罪恶。若非上九之明，则玉石俱焚矣。若非六五之明，上九有故纵反者之咎矣，故正邦也。言五之用九，非穷兵黩武，但取正邦，多杀何为？\n周易下经","31":"咸速也\n“咸”者，感也。不曰感者，咸有皆义，男女皆相感也。艮为“少男”，兑为“少女”，男女相感之深，莫如少者。盖艮止则感之至，兑悦则应之至，此咸之义也。《序卦》“有天地”至“然后礼义有所错”，“天地”，万物之本；“男女”，人伦之始。《上经》首乾坤者，天地定位也。《下经》首咸恒者，山泽通气也。位欲其对待而分，《系辞》“天地定位”，一条是也，故天地分为二卦；气欲其流行而合，《系辞》“刚柔相摩”一条是也，故山泽合为一卦。\n咸：亨，利贞。取女吉。\n取，七具反。\n彖辞明。盖八卦正位，艮在三，兑在六，艮属阳，三则以阳居阳，兑属阴，六则以阴居阴，三为艮之主，六为兑之主，男女皆得其正，所以“亨贞吉”。\n《彖》曰：咸，感也。柔上而刚下，二气感应以相与，止而说，男下女，是以“亨，利贞，取女吉”也。天地感而万物化生，圣人感人心而天下和平。观其所感，而天地万物之情可见矣。\n释卦名义，又以卦综、卦德、卦象释卦辞而极言之。感者，感而应也，无应不为感矣。本卦二体，初阴四阳，二阴五阳，三阳六阴，皆阳感而阴应，阴感而阳应，故曰“感”也。取其交相感之义也。凡天下之事，无心以感之者，寂也，有心以感之者，私也，非所感也。惟感之至公，无所容心于其间，则无所不感矣。故卦去其心，而《彖》加其心。“柔上而刚下”者，本卦综恒，二卦同体，文王综为一卦，故《杂卦》曰：“咸，速也。恒，久也。”“柔上”者，恒下卦之巽，上而为咸之兑也。“刚下”者，恒上卦之震，下而为咸之艮也。“二气”者，山泽之气也。因二气刚柔，一上一下，刚感而柔应之，柔感而刚应之，即“山泽通气”也，故恒卦亦曰“上下相与”。此感之所以亨也。“止而说”者，人心之说易失其正，惟止而说，则无徇情纵欲之私，此所以“利贞”也。“男下女”者，以艮之少男下于兑之少女也。凡婚姻之道，无女先男者，必女守贞静，男先下之，则为得男女之正，此所以“取女吉”也。化者气化，生者形生。“万物化生”者，天地以气感万物，而万物无不通也。和者无乖戾，平者无反侧，圣人以德感天下，而天下无不通也。“观其所感”者，由感通之道引而伸之也。“寂然不动”者性，感而遂通者情。天地万物之情可见者，见天地万物之情不过此感通也。\n《象》曰：山上有泽，咸。君子以虚受人。\n泽性润下，土性受润，泽之润有以感乎山，山之虚有以受乎泽，“咸”之象也。“虚”者，未有私以实之也。“受”者，受人之善也。人之一心寂然不动，感而遂通者，虚故也。中无私主则无感不通，闻一善言，见一善行，沛然若决江河矣。苟有私意以实之，则先入者为主，而感通之机窒，虽有至者，将拒而不受矣。故山以虚，则能受泽，心以虚，则能受人。\n初六：咸其拇。\n拇，茂后反。\n“拇”，足大指也。艮综震，足之象也，故以“拇”言之。以理论，初在下亦拇之象。“咸其拇”，犹言咸以其拇也。拇岂能感人，特以人身形体上下之位，象所感之浅深耳。六爻皆然。\n初六阴柔，又居在下，当感人之时，志虽在外，然九四说之，初六止之，特有感人之心而无感人之事，故有“感其拇”之象，所以占无吉凶。\n《象》曰：“咸其拇”，志在外也。\n“外”者，外卦也。初与四为正应，所感虽浅，然观其拇之动，则知其心志已在外卦之九四矣。\n六二：咸其腓，凶，居吉。\n“腓”，足肚也。拇乃枝体之末，离拇升腓，渐进于上，则较之咸其拇者，其感不甚浅矣。“凶”者，以上应九五而凶也。感皆生于动，但九五君位，岂可妄动以感之？故凶。居者非寂然不动也，但不妄动耳。盖此爻变巽为进退，且性入，上体兑悦，情悦性入，必不待其求而感。若居则不感矣，不感则不变，尚为艮体之止，故设此居吉之戒。\n六二阴柔，当感人之时，咸之渐进，故有“咸其腓”之象。然上应九五，不待其求而感之，故占者不免于凶。若安其居以待上之求，则得进退之道而吉矣。故又教占者以此。\n《象》曰：虽“凶，居吉”，顺不害也。\n“顺”者，中正柔顺之德也。“不害”者，不害其感也。言“居”者，非戒之以不得相感也。盖柔顺之中德，本静而不动，能居而守是德，则不至有私感之害也。\n九三：咸其股，执其随，往吝。\n“股”者髀也，居足之上，股之下，不能自由随身而动者也。中爻为巽，股之象也。“执”者，固执也，专主也。执其随者，股乃硬执之物，固执而唯主于随也。以阳而从阴，乃以君子而悦小人之象，故不无羞吝。\n九三以阳刚之才而居下之上，是宜自得其正道，以感于物矣。然所居之位，应于上六，阳好上而悦阴，上居悦体之极，三往而从之，故有咸股执随之象。占者以是而往，羞吝不必言矣。\n《象》曰：“咸其股”，亦不处也。志在随人，所执下也。\n“处”者，居也，即六二居吉之居。因艮止，故言居言处。处则不随，随则不处。曰“亦”者，承二爻而言。言六二阴柔以不处而凶，处而吉，阴柔随人，不足怪矣。今九三刚明，宜乎卓然自立，则所执主者，乃高明自重之事，有何可羡？今乃亦不处而志在随人，则所执者卑下之甚，不其可羞乎？“亦不处”，惜之之辞。“所执下”，鄙之之辞。\n九四：贞吉，悔亡。憧憧往来，朋从尔思。\n“贞”者，正而固也。此心不思乎正应之阴柔，则廓然大公，物来顺应，正而固矣。“吉”者，诚无不动也。“悔亡”者，内省不疚也。“憧憧”，往来貌。“往来”者，初感乎四，二感乎五，三感乎六者，往也。六感乎三，五感乎二，四感乎初者，来也。四变上下成坎，中爻成离，“来之坎坎”，“突如来如”者，往来之象也。“朋”者，中爻三阳牵连也，故曰“朋”。泰三阳牵连亦曰“朋”。损六五，三阴也。益六二，三阴也。复六四，三阴也。故皆以“朋”称之也。“思”者，四应乎初之阴，初乃四之所思也。五应乎二之阴，二乃五之所思也。三应乎六之阴，六乃三之所思也。“尔”者，呼其心而名之也。“朋从尔思”者，言四与三、五共从乎心之所思也。四居股之上脢之下，乃心也。心之官则思，思之象也。心统乎百体，则三与五皆四之所属矣，故可以兼三五而称朋也。\n九四乃心，为咸之主，以阳居阴而失正，又应乎初之阴柔，不免悔矣。故戒占者，此心能正而固，则吉而悔亡，所不感矣；若此心“憧憧往来”，惟相从乎尔心之所思，则溺于阴柔，不能正大光明，而感应之机窒矣，又岂能吉而悔亡？故戒占者以此。\n《象》曰：“贞吉，悔亡”，未感害也。“憧憧往来”，未光大也。\n不正而感，则有害，贞则未为感之害也。往来于心者皆阴私，又岂能正大光明？\n九五：咸其脢，无悔。\n脢，音梅。《礼记》作“脄”。\n“脢”，背脊肉，不动者也。脢虽在背，然居口之下心之上，盖由拇而腓、而股、而心、而脢、而口，六爻以渐而上也。初与四应，故拇与心，皆在人身之前。二与五应，故“腓”与“脢”皆在人身之后。三与上应，故“股”与“辅颊”皆在两旁，而“舌”则居中焉。虽由拇以渐而上，然对待之精至此。诸爻动而无静，非所感者也；此爻静而不动，不能感者也。\n九五以阳居悦体之中，比于上六。上六悦体之极，阴阳相悦，则九五之心志唯在此末而已，所以不能感物。不能感物则亦犹脢之不动也，故有“咸其脢”之象。悔生于动，既不能动而感，则亦无悔矣。故占者“无悔”。\n《象》曰：“咸其脢”，志末也。\n“末”者，上六也。大过上体亦兑卦，彖辞“本末弱”，末指上六可见矣。九五应二而比六，《小象》独言“志末”，何也？二乃艮体，止而不动，六乃悦体，又悦之极，则九五之心志惟在此末，而不在二矣，所以言“志末”。亦如谦卦九三比二，六二“鸣谦”则“中心得”，上六正应，“鸣谦”则“志未得”是也。人君感人心而天下和平者，以其廓然大公、物来顺应也。今志在末，岂能感人？所以仅得无悔。\n上六：咸其辅颊舌。\n“辅”者，口辅也，近牙之皮肤，与牙相依，所以辅相颊舌之物，故曰“辅”。“颊”，面旁也。辅在内，颊在外，舌动则辅应而颊从之，三者相须用事，皆所用以言者，故周公兼举之。兑为口舌，“辅颊舌”之象也。咸卦有人身象，上阴爻为口，中三阳为腹背，下有腿脚象，故周公爻自“拇”而“舌”。\n上六以阴居悦之终，处咸之极，感人以言而无其实，故其象如此。盖小人女子之态、苏秦张仪之流也。\n《象》曰：“咸其辅颊舌”，滕口说也。\n“滕”，张口骋辞貌，见《说文》。“口说”岂能感人？","32":"恒久也\n“恒”，久也。男在女上，男动乎外，女顺乎内，人理之常，故曰“恒”。又见彖辞，皆恒之义也。《序卦》：“夫妇之道不可以不久也，故受之以恒。”言夫妇偕老，终身不变者也。盖咸少男在少女之下，以男下女，乃男女交感之义。恒，长男在长女之上，男尊女卑，乃夫妇居室之常。论交感之情，则少为亲切，论尊卑之序，则长当谨严，所以次咸。\n恒：亨，无咎，利贞。利有攸往。\n恒之道，可以亨通，恒而能亨，乃“无咎”也。恒而不可以亨，非可恒之道也，为“有咎”矣。如君子恒于善，故“无咎”，小人恒于恶，焉得无咎？然“恒亨”而后无咎，何也？盖恒必利于正，若不正，岂能恒？如孝置之而塞乎天地，溥之而横乎四海，如此正，方得恒，故“利贞”。恒必“利有攸往”，达之家邦，万古不穷。如孝施之后世而无朝夕，方谓之恒，如不可攸往，不谓之恒矣。“利贞”，不易之恒也，恒之利者也。“利有攸往”，不已之恒也，亦恒之利者也。故恒必两利。\n《彖》曰：恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒。“恒，亨，无咎，利贞”，久于其道也。天地之道，恒久而不已也。“利有攸往”，终则有始也。日月得天而能久照，四时变化而能久成，圣人久于其道而天下化成。观其所恒，而天地万物之情可见矣。\n释卦字义，又以卦综、卦象、卦德释卦名、卦辞而极言之。“恒”者，长久也。若以恒字论，左旁从立心，右旁从一日，言立心如一日，久而不变也。“刚上而柔下”者，本卦综咸。刚上者，咸下卦之艮上而为恒之震也。“柔下”者，咸上卦之兑下而为恒之巽也。“恒，亨，无咎，利贞”者，以久于其道也。盖道者，天下古今共由之路，天地之正道也。惟久于其道，故“亨”，故“无咎”，故“利贞”。若久非其道，亦不能恒矣。且恒久莫过于天地，天地之道，恒久而不已者也。惟其恒久不已，所以攸往不穷。盖凡人事之攸往而不能恒久者，以其终而不能又始也。终而不能始，则自终而止，有止息间断，非恒久不已者矣，安能攸往？惟天地之道，昼之终矣，而又有夜之始，夜之终矣，而又有昼之始，寒之终矣，而又有暑之始，暑之终矣，而又有寒之始。终则有始，循环无端，此天地所以恒久也。此恒所以必“利有攸往”，而后谓之恒也。“得天”者，附丽于天也。“变化”者，寒暑迭更，阴阳互换也。“久成”者，成其岁功也。“久于其道”者，仁渐义摩也。“化成”者，化之而成其美俗也。此极言恒久之道。言观其所恒，可见万古此天地，万古此恒也，万古此万物，万古此恒也。若当春时为夏，当秋时为冬，当生物时不生，当成物时不成，此之谓变怪，安得谓之恒？\n《象》曰：雷风，恒。君子以立不易方。\n“立”者，止于此而不迁也。“方”者，大中至正之理，理之不可易者也。如为人君止于仁，为人臣止于敬是也。“不易方”者，非胶于一定也，理在于此则止而不迁，如冬寒衣裘、夏暑衣葛是也。巽性入，入而在内；震性动，出而在外，二物各居其位，不易方之象也，故曰“不易方”。\n初六：浚恒，贞凶，无攸利。\n“浚”，深也。“浚井”之“浚”，“浚”字生于“巽”性入之“入”字来。初六为长女之主，九四为长男之主，乃夫妇也。巽性入，始与夫交之时，即深求以夫妇之常道。四动而决躁，安能始交之时，即能从其所求？“贞”者，初与四为正应，所求非不正也。“凶”者，骤而求之深，彼此不相契合也。“无攸利”者，有所往则夫妇反目矣。盖初阴居阳位，四阳居阴位，夫妇皆不正，皆有气质之性，所以此爻不善。下三爻皆以“妻”言。初爻“凶”者，妻求夫之深而凶也。三“贞吝”者，妻改节而见黜也。上三爻皆以“夫”言。四“无禽”者，夫失其刚而无中馈之具也。五“凶”者，夫顺从其妻而凶也。\n初与四为正应，妇责备夫以夫妇之常道，亦人情之所有者。然必夫妇居室之久，情事孚契，而后可以深求其常道也。但巽性务入，方交四之始即深以夫妇之常道求之，则彼此之情未免乖戾，故有“浚恒”之象。占者如此，则虽“贞”亦“凶”，而“无攸利”也。\n贾谊初见汉文，辄欲改制度。\n《象》曰：“浚恒”之凶，始求深也。\n贾谊少年，痛哭流涕，望汉文改制度，卒傅长沙，浚恒之深也。\n“求”者，中馈之酒浆、器皿、衣服、首饰之类也。\n九二：悔亡。\n以阳居阴，本有悔矣。以其久中，故其“悔亡”。“亡”者，失之于初，而改之于终也。\n《象》曰：九二“悔亡”，能久中也。\n可久之道，中焉止矣。人能恒久于中，岂止悔亡？孔子之言，盖就周公之爻辞而美之也。\n九三：不恒其德，或承之羞。贞吝。\n阳德居正，故得称德。“不恒其德”者，改节也。居巽之极为进退，为“不果”，改节之象也。以变坎为狐疑，此心不定，亦改节之象也。长女为长男之妇，不恒其德而改节，则失其妇之职矣。既失其职，则夫不能容，而妇被黜矣。“或”者，外人也。“承”者，进也。“羞”者，致滋味也。变坎有饮食之象，“羞”之象也。因妇见黜，外人与夫进其羞也。“贞”者，九三位正也。若依旧注“羞”作羞耻，则下“吝”字重言羞矣。\n九三位虽得正，然过刚不中，当雷风交接之际，雷动而风从，不能自守，故有“不恒其德，或承之羞”之象，虽正亦可羞矣。故戒占者如此。\n《象》曰：“不恒其德”，无所容也。\n“无所容”者，夫不能容其妇而见黜也，所以使外人进其羞也。\n九四：田无禽。\n应爻为地道，又震为“大涂”，故曰“田”。与师卦“田有禽”之田同。本卦《大象》与师卦《大象》皆与小过同，故皆曰“禽”。应爻巽为鹳，亦禽之象也。应爻深入，与井下卦同巽，故皆曰“无禽”也。师卦所应刚实，故“有禽”，本卦所应阴虚，故“无禽”。\n九四以阳居阴，久非其位，且应爻深入，故有“田无禽”之象。既“无禽”，则不能与妻备中馈之具，夫非其夫矣。故其象占如此。\n《象》曰：久非其位，安得禽也？\n久非其位，则非所久而久矣，故不得禽。\n六五：恒其德，贞。妇人吉，夫子凶。\n丈夫用刚用柔，各适其宜，以柔顺为常，是因人成事矣，所以凶。此爻变兑，兑为少女，又为妾，妇人之象也。妇人以顺为正，故“吉”。\n六五恒其中德，正矣，故有“恒其德贞”之象。但刚而中可恒也，柔而中，妇人之常，非夫子之所当常也，故占者有吉有凶又如此。\n《象》曰：“妇人”贞吉，从一而终也。“夫子”制义，从妇凶也。\n“从一”者，从夫也。妇人无专制之义，惟在从夫，顺从乃其宜也。“制”者，裁制也。“从妇”者，从妇人顺从之道也。夫子刚果独断，以义制事，若如妇人之顺从，委靡甚矣，岂其所宜？故“凶”。\n上六：振恒，凶。\n振，去声。\n“振”者，奋也，举也，整也。“振恒”者，振动其恒也。如宋时祖宗法度以远，安石乃纷更旧制，正所谓“振恒”也。“凶”者，不惟不能成事，而反偾事也。在下入乃巽之性，“浚恒”也。在上动，乃震之性，“振恒”也。方恒之始，不可浚而乃浚，既恒之终，不可振而乃振，故两爻皆凶。\n上六阴柔，本不能固守其恒者也，且居恒之极，处震之终，恒极则反常，震终则过动，故有“振恒”之象。占者之凶可知矣。\n《象》曰：“振恒”在上，大无功也。\n“大无功”者，不惟“无功”，而“大无功”也。曰“大”者，上而无益于国家，下而不利于生民，安石、靖康之祸是也。","33":"遁则退也\n“遁”者，退避也，六月之卦。不言退而曰“遁”者，退止有退后之义，无避祸之义，所以不言退也。为卦天下有山，山虽高，其性本止。天之阳性上进，远避而去，故有遁去之义。且二阴生于下，阴渐长，小人渐盛，君子退而避之，故为遁也。《序卦》：“恒者，久也。物不可以久居其所。”久则变，变则去，此理之常，所以次恒。\n遁：亨，小利贞。\n“亨”为君子言也。君子能遁，则身虽遁而道亨。“小”者，阴柔之小人也，指下二阴也。利贞者，小者利于正，而不害君子也。若害君子，小人亦不利也。\n《彖》曰：遁“亨”，遁而亨也。刚当位而应，与时行也。“小利贞”，浸而长也。遁之时义大矣哉！\n以九五一爻释“亨”，以下二阴爻释“利贞”而赞之。遁而亨者，惟遁乃亨，见其不可不遁也。刚指五。“当位”者，当中正之位。“而应”者，下与六二相应也。“时行”言顺时而行。身虽在位，而心则遁，此所以谓之时行也。九五有中正之德，六二能承顺之，似亦可以不必于遁，然二阴浸而长，时不可以不遁，知时之当遁，与时偕行，此其所以亨也。“浸”者，渐也。浸而长，其势必至于害君子，故戒以利贞。“时义大”者，阴虽浸长，尚未盛大，且九五与二相应，其阳渐消之意，皆人之所未见而忽略者，是以苟且留连，而不能决去也。当此之时，使不审时度势，则不知遁。若眷恋禄位，又不能遁，惟有明哲保身之智，又有介石见机之勇，方能鸿冥凤举，所以叹其时义之大。汉元、成之时，弘恭、石显得志于内，而萧望之、刘向、朱云皆得巨祸；桓、灵之际，曹节、王甫得志于内，而李膺、陈蕃、窦武皆被诛戮者，均不知遁之时义者也。《易》中“大矣哉”有二：有赞美其所系之大者，豫、革之类是也；有称叹其所处之难者，大过、遁之类是也。\n《象》曰：天下有山，遁。君子以远小人，不恶而严。\n远，去声。\n“恶”者，恶声厉色，疾之已甚也。“严”者，以礼律身，无可议之隙，而凛然不可犯也。“不恶”者，待彼之礼。“严”者，守己之节。“天下有山”，天虽无意于绝山，而山自不能以及乎天，遁之象也。故“君子以远小人”。“不恶而严”，则君子无心于远小人，而小人自远，与天之无心于远山，而山自绝于天者同矣。“远小人”，艮止象。“不恶而严”，乾刚象。\n初六：遁尾，厉，勿用有攸往。\n阴初在下，乃遁之尾，然一阴初萌，已危虑矣。“勿用有攸往”，《易》为君子谋，非为阴谋也。教初不往，似不通。\n“遁”者，居当遁之时也。“尾”者，初也，因在下，故曰“尾”。“厉”者，天下贤人君子，皆以遁去，时何时也，岂不危厉！“往”者，往而遁去也。本卦遁乃阳刚，与阴不相干涉，故不可往。且初在下无位，又阴柔所居不正，无德无位无闻，不过凡民耳，与遁去之贤人君子不同，遁之何益？\n初六居下，当遁之时，亦危厉矣。但时虽危厉，而当遁者非初之人，故教占者勿用遁去，但晦处以俟时可也。阴柔小人如何晦处俟时？\n《象》曰：“遁尾”之厉，不往何灾也？\n“厉”，即灾也。君子不往，何厉之有？不遁，有何灾咎？所以“勿用有攸往”。\n六二：执之用黄牛之革，莫之胜说。\n胜，音升。说，音脱。\n“执”者，执缚也。艮性止，执之象也。“黄”，中色，指二。应爻错坤，牛之象也。“胜”者，任也。“脱”者，解脱也。能胜其脱，欲脱即脱矣。莫之胜脱者，不能脱也。言执缚之以黄牛之皮，与九五相交之志，坚固不可脱也。本卦遁者乃阳，初与二阴爻皆未遁，故此爻不言“遁”字。\n二阴浸长，近于上体之四，阴已凌迫于阳矣。然二与五为正应，二以中正顺应乎五，五以中正亲合乎二，正所谓“刚当位而应”，不凌迫乎阳可知矣，故有“执之用黄牛之革，莫之胜说”之象。占者当是时，亦当如是也。\n《象》曰：执用黄牛，固志也。\n“坚固”者，欲固执五之遁志也。盖“小利贞”，小人亦如君子之遁，非小人之利也。惟固执之极而能遁，所以不恶也。所以遁之时义大也，若不合则去，亦人之得者。\n坚固其二五中正，相合之志也。\n九三：系遁，有疾厉。畜臣妾，吉。\n“系”者，心维系而眷恋也。中爻为巽，巽为绳，系之象也。“系遁”者，怀禄徇私，隐忍而不去也。“疾”者，利欲为缠魔困苦之疾也。“厉”者，祸伏于此而危厉也。“臣”者，仆也。“妾”者，女子也，指下二阴也，乃三所系恋之类也。盖臣妾也，宫室也，利禄也，凡不出于天理之公，而出于人欲之私者，皆阴之类也，皆人之所系恋者也。本卦止言臣妾者，因二阴居下位故也。“畜”者，止也，与剥卦顺而止之同。止之使制于阳而不凌上也。艮，畜止象。又为阍寺，臣之象。又错兑，妾之象。\n九三当阴长凌阳之界，与初二二爻同体，下比于阴，故有当遁而系恋之象。既有所系，则不能遁矣，盖疾而厉之道也。然艮性能止，惟刚正自守，畜止同体在下二阴，驭之以臣妾之正道，使制于阳而不凌上，斯吉矣。故又教占者必如此。\n《象》曰：“系遁”之厉，有疾惫也。“畜臣妾，吉”，不可大事也。\n“疾惫”者，疲惫于私欲，困而危矣。“不可大事”者，出处去就乃大夫之大事，知其所事，方知其遁。若畜止臣妾，不过以在我艮止之性，禁令之尔，乃小事也。九三系遁，能此小事亦即吉矣，岂能决断其出处去就之大事哉！\n九四：好遁，君子吉，小人否。\n好，呼报反。否，方有反。\n三比二，故曰“系”。四应初，故曰“好”。“好”者，爱也。“系”者，缚也。爱者必眷恋而缚，缚者因喜悦而爱，其实一也。“好遁”者，又好而又遁也。“好”者，爵位利禄爱慕之事也。“遁”者，审时度势，见几之事也。“好”者，四也。“遁”者，九也。阳居阴位，阳可为“君子”，阴可为“小人”，故可“好”可“遁”也，所以圣人设小人之戒。“否”者，不也。\n九四以刚居柔，下应初六，故有好而不遁之象。然乾体刚健，又有遁而不好之象。占者顾其人何如耳。若刚果之君子，则有以胜其人欲之私，止知其遁，不知其好，得以遂其洁身之美，故吉矣；若小人则徇欲忘反，止知其好。不知其遁，遁岂所能哉！故在小人则否也。\n《象》曰：“君子”“好遁”，“小人否”也。\n君子刚果，故“好”而知“遁”，必于其“遁”。小人阴柔，故“好”而不知其“遁”，唯知其“好”矣。\n九五：嘉遁，贞吉。\n“嘉遁”者，嘉美乎六二也。当二阴浸长之时，二以艮体执之以黄牛之革，不凌犯乎阳，其志可谓坚固矣。为君者不嘉美以正其志，安能治遁？故“贞吉”。若人君，无逃遁之理。玄宗幸蜀，安得为嘉？\n九五阳刚中正，有治遁之才者也。当天下贤人君子，遁去之时，下应六二之中正，见六二之志固，乃褒嘉之，表正其志，以成其不害贤人君子之美，正而且吉之道也。故其象占如此。\n《象》曰：“嘉遁，贞吉”，以正志也。\n二之固志者，坚固其事上之志，臣道中正之心也。五之正志者，表正其臣下之志，君道中正之心也。二五《小象》皆同言“志”字，所以知五褒嘉乎二。\n上九：肥遁，无不利。\n“肥”者，疾惫之反。“遁”字从豚，故初六言“尾”，上九言“肥”，皆象豚也。以阳刚之贤，而居霄汉之上，晬面盎背，莫非道德之丰腴，手舞足蹈，一皆仁义之膏泽，心广体胖，何肥如之！“无不利”者，天子不得臣，诸侯不得友。尧虽则天，不屈饮犊之高；武既应人，终全孤竹之节。理乱不闻．宠辱不惊，何利如之！\n诸爻皆疑二阴之浸长，心既有所疑而戚，戚则身亦随之而疾瘠矣，安能“肥”乎？惟上九以阳刚而居卦外，去柔最远，无所系应，独无所疑。盖此心超然于物外者也，故有“肥遁”之象。占者无不利，可知矣。\n《象》曰：“肥遁，无不利”，无所疑也。\n“无所疑”者，不疑二阴之浸长而消阳也。“无所疑”，所以逍遥物外，不至于愁苦而瘠。\n郭林宗似之。","34":"大壮则止\n“大壮”者，大者壮也。“大”谓阳也。四阳盛长，故为“大壮”。二月之卦也。为卦震上乾下，乾刚而震动，大壮之义也。又雷之威震于天上，声势壮大，亦大壮之义也。《序卦》：“遁者，退也。物不可以终遁，故受之以大壮。”遁者，阳衰而遁也。壮者，阳盛而壮也。衰则必盛，消长循环之理，所以次遁。\n大壮：利贞。\n大壮不言“吉亨”，而言“利贞”者，圣人忧盛危明也，儆戒无虞。\n阳壮，则占者“吉亨”，不必言矣。然君子之所谓壮者，非徒以其势之盛，乃其理之正也，故利于正。阴之进不正，则小人得以凌君子，故遁言“小者利于贞”。阳之进不正，则君子不能胜小人，故大壮言大者利于贞。大壮综遁，二卦本是一卦，故卦下之辞如此。\n《彖》曰：“大壮”，大者壮也。刚以动，故壮。“大壮，利贞”，大者正也。正大而天地之情可见矣。\n以卦体、卦德释卦名，又释“利贞”之义而极言之。阳长过中，大者壮也。盖正月泰，阳虽长而未盛，三月夬，阳已盛而将衰，皆不可以言壮，惟四阳则壮矣。且乾刚震动，刚则能胜其人欲之私，动则能奋其必为之志，何事不可行哉！此其所以壮也。卦体则势壮，卦德则理壮，所以名壮。大者正也，言大者自无不正也。凡阳明则正，阴浊则邪，自然之理，故利于贞。若不贞，则非大矣。“正大”者，正则无不大也。天地之情者，覆载生成，所发之情也。一通一复，皆一诚之贯彻，岂不正？既正，岂不大？故曰“正大”。盖“大”者壮，以气言，乃壮之本体也。“大”者正，以理言，所以运壮之道也。“正大而天地之情可见”，又推极上天下地，莫非此正大之理，非特人为然也。一阳来复，见天地之心，四阳见其情。仁者天地之心，情则其所发也。\n《象》曰：雷在天上，大壮。君子以非礼弗履。\n“非礼”者，人欲之私也。“履”者，践履也。“非礼弗履”，则有以克胜其人欲之私矣。此惟刚健以动者可能，矫哉其强，何壮如之！“雷在天上，大壮”者，以声势而见其壮也。“君子非礼弗履大壮”者，以克胜其私而见其壮也。\n初九：壮于趾，征凶，有孚。\n震为足，又初在下，“趾”之象也。“征凶”者，往则必裁抑摈斥也。“孚”者，自信其阳刚之正德也。初以阳居阳，乾之刚未盛也，故“有孚”。至三则乾刚极矣。\n初九阳刚处下，当壮之时，壮于进者也，故有壮趾之象。以是而往，凶之道也。然阳刚居正，本有其德，故教占者，惟自信其德，以甘穷困，不可有所往，往则凶矣。\n《象》曰：“壮于趾”，其孚穷也。\n既无应援，又卑下无位，故曰“穷”。当壮进之时，有其德而不能进，进则必凶，乃处穷之时矣，故惟自信其德以自守可也。是“其孚”者，不得已也，因“穷”也，故曰“其孚穷”。贤人君子，不偶于时，栖止山林者，多是如此。\n九二：贞吉。\n爻辞无中字，九阳正也，二阳居阴位，柔正也。壮不过壮，以柔济刚也。《象》之“利贞”者，此贞也，戒过刚也。《小象》补出“中”字，中则刚柔相得矣。\n中则无太过，不恃其强而猛于必进，所以此爻“贞吉”。\n九二以阳刚当大壮之时，居中而不过于壮，盖正而吉者也。故其占如此。\n《象》曰：九二“贞吉”，以中也。\n“以中”者，居中位也。与解卦“得中道”、未济“中以行正”同。中立而不倚，强哉矫，九二有焉。\n九三：小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。\n羸，力为切。\n“罔”者，无也，言不用也。君子以义理为勇，以“非礼弗履”为大壮，故“不用壮”也。“羝羊”，壮羊也。“羸”者，瘦也，病也。羝羊恃其强壮乃触其藩，其角出于藩之外，易去而难反，不能用其力，是角之壮者，反为藩所困制而弱病矣，故曰“羸其角”也。本卦大象兑，中爻为兑，皆羊之象，故诸爻皆以羊言之。震为“竹”、为“苇”，“藩”之象也。“触藩”者，“用壮”之象也。阳居阳位，故曰“贞”。“羸角”者，又“贞厉”之象也。\n九三过刚不中，又当乾体之终，交震动之际，乃纯用血气之强，过于壮者也。然“用壮”为小人之事，君子以义理为主，岂其所用哉？故圣人戒占者曰：惟小人则用壮，君子则不用也。苟用其壮，虽正亦厉，亦如羊之触藩羸角也，壮其可恃哉？戒之之严，故占中之象又如此。\n《象》曰：“小人用壮”，君子罔也。\n言“用壮”者小人之事，君子则无此也。\n九四：贞吉，悔亡。藩决不羸，壮于大舆之。\n“贞吉，悔亡”者，惟正则吉而悔亡也。“决”，破也。“藩决不羸”，承上文而言也。三前有四之阻隔，犹有藩焉。四前二阴，则藩决而可前进矣。震为“大涂”，兑为“附决”，藩决之象也。“”与辐同，车轮之中干也。车之败常在折，壮则车强矣。四变坤，“大舆”之象也。“壮于大舆之”，言尚往而可进也。此二句又“贞吉，悔亡”之象也。\n九四当大壮之时，以阳居阴，不极其刚，前无困阻而可以尚往矣。故其占中之象如此。\n《象》曰：“藩决不羸”，尚往也。\n“尚往”者，前无困阻而可以上进也。\n六五：丧羊于易，无悔。\n易，音亦。\n“易”即埸，田畔地也。震为“大涂”，埸之象也。\n本卦四阳在下，故名“大壮”。至六五无阳，则丧失其所谓大壮矣，故有“丧羊于易”之象。既失其壮，则不能前进，仅得无悔而已，故其象占如此。\n《象》曰：“丧羊于易”，位不当也。\n“位不当”者，以柔居五位也。\n上六：羝羊触藩，不能退，不能遂，无攸利，艰则吉。\n震错巽为进退。退遂之象也。“艰”者，处之艰难而不忽慢也。“吉”者，“无攸利”者终得攸利也。六五已“丧羊”矣，而上六又“羝羊触藩”者，盖六五以一爻言也，上六则合一卦而言也。三则刚之极，上则动之极，所以爻象皆同。\n上六壮终动极，所以“触藩”而不能退。然其质本柔，又不能遂其进也，故有“触藩不能退遂”之象。占者之“无攸利”可知矣。然犹幸其不刚，而不妄进也。若占者能“艰”以处之，则得以遂其进而吉矣。\n《象》曰：“不能退，不能遂”，不详也。“艰则吉”，咎不长也。\n“详”者，慎密也。“不详”者，当壮终动极之时，不能度势而行，审几而进也。既详，则能艰矣。“咎”者，“不能退，不能遂”之咎也。惟艰则能详，而“咎不长”矣。心思之艰难，所以能详；识见之详明，所以能艰。","35":"晋昼也\n“晋”者，进也，以日出地上，前进而明也。不言进而言晋者，进止有前进之义，无明之义，晋则有进而光明之义，所以不言进也。《序卦》：“物不可以终壮，故受之以晋。”盖物既盛壮则必前晋，所以次大壮。\n晋：康侯用锡马蕃庶，昼日三接。\n“康侯”，安国之侯也。“锡”者，赐与也。“蕃庶”，见其恩之者隆。“三接”，见其礼之者频。坤错乾，“马”之象。中爻艮综震，震为蕃，“蕃”之象。“庶”者，众也，坤为众，庶之象。“蕃庶”者，言所锡之马众多也。“昼日”，离之象。离居三，三之象。艮为“手”，相接之象。“日”者，君也。坤者，臣也。坤为“邑国”，日在地上，照临其邑国之侯，有宠而“锡马三接”之象。《易》止有是象，无是事，如“栋桡”、“金车”、“玉铉”之类皆是也。诸儒不知象，乃以《周官·校人》“大行人”实之，失象旨矣。\n《彖》曰：晋，进也。明出地上，顺而丽乎大明，柔进而上行，是以“康侯用锡马蕃庶，昼日三接”也。\n释卦名，又以卦象、卦德、卦综释卦辞。“明出地上”者，离日出于地之上也。“顺而丽乎大明”者，坤顺而附丽乎大明也。“柔进而上行”者，晋综明夷，因二卦同体，文王综为一卦，故《杂卦》曰：“晋，昼也。明夷诛也。”言明夷下卦之离，进而为晋上卦之离也。若以人事论，“明出地上”，乃世道维新，治教休明之时也。“顺”以臣言，“大明”以君言。“顺”者，小心承顺也。“丽”者，犹言攀龙鳞附凤翼也。柔进而上行则成虚中矣，是虚中下贤之君，而居于五之位也。上句以时言，中句以臣之德言，下句以君言。言为“康侯”者，必际是时、备是德、遇是君，方得是宠也。\n《象》曰：“明出地上”，晋。君子以自昭明德。\n地乃阴土，譬之人欲之私。“自”者，我所本有也。日本明，入于地则暗矣，犹人之德本明，但溺于人欲之私则暗矣，故自昭其明德，亦犹日之出地也。“自昭”者，格物致知，以去其蔽明之私，诚意正心修身，以践其自昭之实也。“明德”者，即行道而有得于我者也。天下无道外之德，即五伦体之于身也。此德塞乎天地，横乎四海，如昊日当空，人人得而见之，故曰“明”。至健莫如天，故君子以之“自强”。至明莫如日，故君子以之“自昭”。所以二象皆以“自”字言之。\n初六：晋如摧如，贞吉，罔孚，裕无咎。\n摧，音崔。\n“晋如”者，升进也。“崔”者，崔嵬之崔，高也。中爻艮山在坤土之上，“崔”之象也。四近君，又阳爻，故有“崔如”之象。若以为“摧如”，则与《小象》“独行正”不相合矣。依郑为“南山崔崔”之“崔”是也。“贞”者，尽其在我，不畔援苟且，汲汲以求进也。“吉”者，终得遂其进也。“罔孚”者，二三不信之也。中爻坎为狐疑，不信之象也。当升进之时，众人通欲进，初卑下，故二三不见信。观《小象》曰“独行正”，六三曰“众允”，可知矣。“裕”者，不以进退为欣戚，从容以处之，而我之自修者犹夫初也。“无咎”者，不失其身也。“贞”，即下文“罔孚，裕，无咎”。\n初六以阴居下，当升进之时，而应近君之四，故有“晋如崔如”之象，占者守正则吉矣。设或不我见信，不可急于求信，惟宽裕以处之，则可以“无咎”矣。若求信之心切，则不免枉道失身，安得无咎？此所以利贞则吉也。\n《象》曰：“晋如摧如”，独行正也。“裕无咎”，未受命也。\n“独行”者，独进也。中爻艮综震足，行之象也。“正”者，应与之正道也。言升进之时，四阳在上，近乎其君，赫赫崔嵬，初又卑下，众人不进而初独进之，似不可进矣。然四与初为正应，进之亦正道也，未害其为进也。“未受命”者，离日在上，未受君王之命也。未受命，则无官守，所以得绰绰有余裕。应四未应五，故曰“未受命”。六二曰“受兹介福于王母”，二受字相同。中爻艮为手，有授受之象。故文王卦辞曰“接”，初二爻皆言“受”，皆有手象。\n六二：晋如愁如，贞吉。受兹介福，于其王母。\n“愁”当专指四、二，与五同德，乃受福之人，原不必愁也。\n中爻坎为加忧，为心病，愁之象也。其所以愁者，四乃大臣中“鼫鼠”之小人也，近君而据下三爻升进之路，二欲升进无应援，五阴柔，二愁五之不断，四邪僻，二愁四之陷害，此其所以愁也。“贞”者，中正之德也。初六之贞，未有贞而勉之也；六二之“贞”，因其本有而教以守之也。“吉”者，中正之德，久而必彰，上之人自当求之，下文所言“受介福于王母”是也。“介”者，大也。“受介福”者，应六五大明之君，因其同德而任用之，加之以宠禄也。“王母”者，六五也。离为日，“王”之象也。离为中女，“母”之象也。\n六二中正，上无应援，故有欲进而愁之象。占者如是而能守正，则吉而受福矣。\n于其“王母”，则不于四可知。\n《象》曰：“受兹介福”，以中正也。\n“以中正”者，以六二有此中正之德也。八卦正位，坤在二，所以“受介福”，详见《杂说》。\n六三：众允，悔亡。\n坤为“众”，“众”之象也。“允”者，信也。初“罔孚”，未允也。二“愁如”，犹恐未允也，三则“允”矣。“悔亡”者，“亡”其不中正之“悔”也。\n六三不中正，当欲进之时，宜众所不信而有悔矣。然所居之地近乎离明，又顺体之极，有顺上向明之志，则所谓“不中正”者，皆因亲近其大明而中正矣，是以众皆信之。同下二阴上进，故有“众允”之象，而占者则“悔亡”也。\n《象》曰：“众允”之志，上行也。\n“上”者，大明也。“上行”者，上顺丽于大明也。上从大明之君，众志之所同也。\n九四：晋如鼫鼠，贞厉。\n鼫，音石，市亦切。\n“鼫鼠”，“鼫”字与“硕”字同一类，二字从石，皆音“石”。《诗·硕鼠》刺贪。“硕”，大也，阳大阴小，此爻阳，故为“大鼠”，即《诗》之“硕鼠”无疑矣。中爻艮，变爻亦艮，鼠之象也。鼠昼伏藏，夜则走动，盖不敢见日而畏人者也。离为日，晋者昼也，鼠岂能见之哉！但当进之时，见众人俱进，彼亦同进，不复畏其昼矣。“贞”者，当进之时，九四“晋如”，非不正也。\n九四不中不正，当晋之时，窃近君之位，居三阴之上，上而畏六五大明之知，下而畏三阴群小之忌，故有“鼫鼠”日下，惟恐人见之象。占者如是，虽正亦危矣。\n《象》曰：“鼫鼠，贞厉”，位不当也。\n“位不当”者，不中不正也。\n六五：悔亡，失得勿恤。往吉，无不利。\n“恤”者，忧也。中爻坎，为“加忧”，“恤”之象也。五变，则中爻不成坎，故不忧，而“勿恤”矣。火无定体，倏然而活，倏然而没，失得其常。凡《易》中遇离，或错离，或中爻离，皆言“失得”二字。如比卦九五错离曰“失前禽”。随卦六三变离曰“失小子”，随有求得。噬嗑九四曰“得金矢”，六五曰“得黄金”。坎卦错离六二曰“求小得”。明夷九三曰“得其大首”。解卦九二错离曰“得黄矢”。鼎卦初六曰“得妾”。震卦六二变中爻为离曰“七日得”。渐卦中爻离六四曰“得其桷”。丰卦六二曰“得疑疾”。旅九四曰“得资斧”。巽上九变坎错离曰“丧其资斧”。“得失”、“得丧”，皆一意也。既济六二曰“七日得”，未济上九曰“失”，是则或失或得，乃离之本有也，非戒辞也。本卦以象论，日出地上，乃朝日也，非日中之昃。以德论，居大明之中而下顺从之。以卦变论，为飞龙在天之君。六爻独此爻善，所以《小象》曰“往有庆也”。“悔亡”者，中以行正也。“失得勿恤”者，虚中则廓然大公，不以失得累其心也。故“吉，无不利”。\n六五柔中，为自昭明德之主，天下臣民，莫不顺而丽之，是以事皆悔亡，而心则不累于得失，持此以往，盖“吉”而“无不利”者也。占者有是德，斯应是占矣。\n《象》曰：“失得勿恤”，往有庆也。\n“往有庆”，即“吉无不利”。\n上九：晋其角，维用伐邑。厉吉无咎，贞吝。\n“晋其角”，与“姤其角”同。晋极明终，日已晚矣。角在首之上，“晋其角”，言欲进而前无其地矣，甚言其前无所进也。“维”者，维系也，系恋其三之阴私也。阳系恋乎阴私，皆不光明之事，所以孔子《小象》但阳比于阴者，皆曰“未光”。离为戈兵，坤为众，此爻变震，众人戈兵震动，“伐邑”之象也。故离卦上九变震，亦曰“王用出征”。邑即内卦坤之阴土也。详见谦卦。“伐邑”即同人“伏戎于莽”之意。凡《易经》爻辞，无此事而有此象，如此类者甚多。“厉吉无咎”者，言其理也。言邑若理可以伐，虽“危厉”亦“吉而无咎”也。“吉无咎”即下文之“贞”也。“贞吝”者，言虽当伐亦可羞也。\n上九明已极矣，又当晋之终，前无所进，此心维系恋乎三爻所应之阴私而已，故有“晋其角，维用伐邑”之象。夫系恋其私以伐邑，其道本不光明，然理若可伐而伐之，事虽“危厉”亦“吉”而“无咎”。但前无所进，既不能成康侯光明之业，反系恋其私以伐邑，虽邑所当伐，其事故贞，亦可羞矣，安得“吉而无咎”哉！故戒占者以此。\n《象》曰：“维用伐邑”，道未光也。\n此爻变震，下乃顺体，阴阳相应，性顺情动，岂有光明之事？","36":"明夷诛也\n“夷”者，伤也。为卦坤上离下，日入地中，明见其伤，与晋相综，故曰“明夷”。《序卦》：“晋者，进也。”进而不已，必有所伤，理之常也，所以次晋。\n明夷：利艰贞。\n“艰贞”者，艰难委曲以守其贞也。盖暗主在上，去之则忘国，又有宗国同姓不可去者，比之则失身，又当守正。然明白直遂，守正又不免取祸，所以占者“利艰贞”，以守正而自晦其明也。\n《彖》曰：明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。“利艰贞”，晦其明也。内难而能正其志，箕子以之。\n难，乃旦反。\n以卦象释卦名，又以文王释卦德，以箕子释卦辞。内文明者，离也；外柔顺者，坤也。此本卦之德也。“蒙”者，遭也。“以蒙大难”者，言以此德而遭此明伤之时也。“文王以之”者，言文王遭纣之囚，用此卦之德，所以内不失己，外得免祸也。“晦其明”者，晦其明而不露也。“大难”，关天下之难。“内难”，一家之难。“正其志”者，不失其正也。不失其正又不显其正，是谓“晦其明而利艰贞”之义也。箕子为纣近亲，外而佯狂，内而明哲，是即“晦其明”也，故曰“箕子以之”。大抵箕子之难虽与文王同其艰贞，然文王为西伯，散宜生之徒以珍物美女献于纣，而西伯即出羑里矣。若箕子佯狂，则必要君知其真狂，左右国人亦知其真狂，再不识其佯狂，至牧野之师诛君吊民，方释箕子之囚，箕子逃之朝鲜，武王以朝鲜封之，因以《洪范》授于武王，人方知其不狂，则箕子“艰贞”难于文王多矣。故以“艰贞”系箕子之下。要之天命兴周，故文王之明夷处之易；天命废殷，故箕子之明夷处之难。虽人为，实天意也。文王箕子，一而已矣。\n《象》曰：明入地中，明夷。君子以莅众，用晦而明。\n坤为众，故言“莅众”。“用晦而明”者，不用明为明，用晦为明也。言我本聪明睿知，乃不显其明，若似不明者。以晦为明，此之谓用晦而明也。若以晋、明夷相综并论之，地在下，日在上，明在外也。君子以之，则绝去其人欲之私，以“自昭明德”。亦如日之极其高明，常升于万物之上，此修己之道当如是也。地在上，日在下，明在内也。君子以之，则存其宽厚浑含之德，去其刻薄残忍之私，以之“莅众”，如小过必赦，使人不求备之类皆是也。古之帝王，冕旒以蔽明，黈纩以蔽聪，亦此意。此则居上之宽，治人者当如是也。故明夷之《大象》曰“莅众，用晦而明”。修己治人，二卦之象尽之矣。\n初九：明夷于飞，垂其翼。君子于行，三日不食。有攸往，主人有言。\n“明夷于飞”者，伤其飞之翼也。“垂其翼”者，其翼见伤而垂亸也。离为雉，鸟之象也。此爻变艮，独一阳在中，卦之中为鸟身，初与六上下为翼，故小过初六曰“飞”，上六亦曰“飞”，皆以翼言也。此爻居初，故曰“垂翼”也。垂其翼而犹能飞，则伤亦未太重矣。“三日不食”者，离居三，三之象也。离为日，“三日”之象也。离中虚，又为大腹。空腹，“不食”之象也。“于行”者，方见机而欲行也。“不食”者，自悲其见伤而不食也。“有攸往”者，于行而长往也。中爻震足，行而长往之象也。“主人”者，所适之主人对君子之言也。“有言”者，主人不相合，言语讥伤其君子也。外卦错乾，乾为言，有言之象也。象为“飞”，占为“行”，为往；象为“垂翼”，占为“不食”、有言。象、占，俱分明。\n初九阳明在下，当伤之时，故有“飞而垂翼”之象。占者不惟方行而有不食之厄，及长往而犹有言语之讥。此其时之所遭，不可得而避者，安其义命可也。\n《象》曰：“君子于行”，义不食也。\n“义”之所在，见几而作，“不食”可也。\n六二：明夷，夷于左股。用拯马壮，吉。\n六二中正为离明之主，文明君子伤于暗，君死于暗亦无谓，岂其拯溺犹待规行乎？\n“夷于左股”，言伤之犹未在上体也。以去暗君，虽不如初之远，然亦不得言近，故以足之上股象之。中爻为震，震错巽，股之象也。此爻变，中爻为兑，兑综巽，亦股之象也。明夷象人身。故初二为股，三、四为腹，五上为首。股居下体，盖以人身上下为前后也。凡《易》中言“左”者皆后字，详见师卦并本卦六四。“拯”者，救也。此爻变乾为健，为良马。马，健壮之象也。言用健壮之马以救之则吉矣。文王囚于羑里，“夷于左股”也。散宜生之徒献珍物美女，“用拯马壮”也。脱羑里之囚，得专征伐，吉也。\n六二去暗主稍远，故有伤下体左股之象。然二有中正之德，能速以救之，则吉矣。故其象占如此。\n《象》曰：六二之“吉”，顺以则也。\n六二，臣也，臣受伤于君，岂宜鬻狱赂免？六二之吉者，内文明而外柔顺。其顺于外者，有中正之则也，不可止见其顺，不见其则也。\n“顺”者，外柔顺也。“则”者，法则也。言外虽柔顺，而内实文明有法则也，所以“用拯马壮”也。因六二中正，故言“顺以则”。\n九三：明夷于南狩，得其大首，不可疾贞。\n“南狩”者，去南方狩也。离为火，居南方，南之象也。离为戈兵，中爻震动，戈兵震动，出征远讨之象也。“大首”者，元恶也。坤错乾，乾为首，首之象也。居天位，“大首”之象也。“不可疾”者，不可亟也。九三虽刚明，臣也。上六虽昏暗，君也。必迟迟以俟之，出于万一不得已，如天命未绝，人心尚在，则一日之间犹为君臣也。“征”者，伐暴救民，其事正也，故“不可疾”，惟在于贞。若亟亟以富天下为心，是疾而不贞矣。\n九三以阳刚居明体之上，而居于至暗之下，正与上六暗主为应，故有向明除害，得其大首之象。然不可亟也，故有“不可疾”，惟主于贞之戒。占者有成汤文武之德，斯应是占矣。\n《象》曰：“南狩”之志，乃大得也。\n“志”，与“有伊尹之志则可”之“志”同。得天下有道，得其民也。得其民者，得其心也。故除残去暴，必大得民心。不然，以暴易暴，安能行南狩之志？\n六四：入于左腹，获明夷之心，于出门庭。\n此爻指微子言。盖初爻指伯夷，二爻指文王，三爻指武王，五爻指箕子，上六指纣，则此爻乃指微子无疑矣。“左腹”者，微子乃纣同姓，左右腹心之臣也。坤为腹，腹之象也。此爻变中爻为巽，巽为入，入之象也。因六四与上六同体，故以“腹心”言之。然必曰“左腹”者，右为前，左为后，今人言“左迁”，师卦六四“左次”是也。六四虽与上六同体，然六五近上六在前，六四又隔六五在后，是六五当入其右，而六四当入其左矣，故以“左”言之。坤为黑，腹中乃黑暗幽隐之地也。“心”者，心意也。“明夷”者，纣也。明夷之心者，纣之心意也。“出门庭”者，遁去也。中爻震综艮，艮为门，门之象也。震足动，“出门庭”之象也。言微子终日在腹里左边黑暗幽隐之中，已得明夷之心意，知其暴虐无道，必亡天下，不可辅矣，于是出门庭而归周。《书》云“吾家耋逊于荒”，又曰“吾不顾行遁”，正此爻之意也。\n六四阴柔得正，与上六同体，已于幽暗之中，得其暴虐之心意，故有“入腹获心”之象，于是出门庭而遁去矣。占者得此，亦当远去也。\n《象》曰：“入于左腹”，获心意也。\n凡人腹中心事，难以知之。今“入于左腹”，已得其心意，知其不可辅矣，微子所以去也。\n六五：箕子之明夷，利贞。\n六五居至暗之地，近至暗之君，然有柔中之德，晦其明而正其志，所以佯狂受辱也。居明夷如箕子，乃贞之至矣，故占者利于贞。诸爻以五为君位，故周公以“箕子”明之，上六以“登天”明之。九三与上六为正应，曰“得其大首”，皆欲人知上六之为君也。然周公爻辞必以上六为君者，何也？盖九三明之极，惟武王可以当之。上六暗之极，惟纣可以当之。若六五有柔中之德，又非纣之所能当也。\n《象》曰：“箕子”之贞，明不可息也。\n“不可息”者，耿耿不昧，常存而不息也。“明不可息”者，言明可晦不可息，以其在内不露，所以为贞也。\n上六：不明晦，初登于天，后入于地。\n“不明晦”者，日落不明而晦也。“初登于天”者，日在地上也。“后入于地”者，日在地下也。本卦原是日在地下，伤其明者，为“明夷”。上六为明夷之主，至此则明夷成矣，故复以明夷之本象言之。\n上六以阴居坤土之极，昏暗之至者。惟其昏暗之至，不明而晦，是以初则尊为天子，居可伤人之势，专以伤人之明为事，终则自伤，而坠厥命，欲为匹夫而不可得矣，故有日落不明而晦，初虽登天而后入地之象。其象如此，而占者可知矣。\n《象》曰：“初登于天”，照四国也。“后入于地”，失则也。\n“照四国”以位言，言日居天上，能照四国，亦如人君高位得伤人之势也。“失则”以德言，言为人君止于仁，视民如伤者也，岂可以伤人为事哉？君以伤人为事，失其君之则矣。是以始而登天以伤人，而终于自伤也。文王之“顺以则”者，外柔顺而内实文明。凡事有法则所以兴。纣之“失则”者，居坤顺之极，而内实昏暗。凡事失法则所以亡。故二六皆言则字。","37":"家人内也\n“家人”者，一家之人也。八卦正位，巽在四，离在二，此卦巽以长女而位四，离以中女而位二，二四皆得八卦正位。又九五、六二内外各得其正，皆家人之义也。《序卦》：“夷者，伤也。伤于外者，必反于家，故受之以家人。”所以次明夷。\n家人：利女贞。\n言占者利于先正其内也。以占者之身而言也，非女之自贞也。盖女贞乃家人之本，治家者之先务。正虽在女，而所以正之者则在丈夫，故曰“利女贞”。\n《彖》曰：家人，女正位乎内，男正位乎外。男女正，天地之大义也。家人有严君焉，父母之谓也。父父、子子，兄兄、弟弟，夫夫、妇妇，而家道正。正家而天下定矣。\n释卦名、卦辞而推言之。“男女”二字，一家之人尽之矣。父母亦男女也，曰“男女”即卦名也。“女正位乎内，男正位乎外”，正即卦辞之“贞”也。《本义》上父初子之说非也。吴幼清以五为巽女之夫，三为离女之夫，亦非也。惟依彖辞“女正”、“男正”二句，则卦名、卦辞皆在其中矣。言女正位乎内，男正位乎外，男女正乃天地间大道。理原是如此，所以“利女贞”。“严”乃尊严，非严厉之严也。尊无二上之意，言一家父母为尊，必父母尊严，内外整肃，如臣民之听命于君，然后父尊子卑，兄友弟恭，夫制妇顺，各尽其道，而后家道正，正家而天下定矣。定天下系于一家，岂可不“利女贞”？此推原所以当“女贞”之故。\n《象》曰：风自火出，家人。君子以言有物而行有恒。\n“风自火出”者，火炽则炎上而风生也，自内而及外之意。知“风自火出”之象，则知风化之本，自家而出，而家之本又自身出也。“有物”者，言之不虚也，言孝则实能孝，言弟则实能弟也。“有恒”者，行之不变也。孝则终身孝，弟则终身弟也。言有物则言顾行，行有恒则行顾言，如此则身修家齐，风化自此出矣。\n初九：闲有家，悔亡。\n“闲”者，防也，阑也。其字从门，从木。木设于门，所以防闲也。又变艮，艮为门，又为止，亦门阑止防之意也。“闲有家”者，闲一家之众，使其父父子子、兄兄弟弟、夫夫妇妇也。\n初九以离明阳刚，处有家之始，离明则有豫防先见之明，阳刚则有整肃威如之吉，故有“闲其家”之象。以是而处家，则有以潜消其一家之渎乱而悔亡矣。故其象占如此。\n《象》曰：“闲有家”，志未变也。\n九五为男，刚健得正；六二为女，柔顺得正。在初之时，正志未变，故易防闲也。\n六二：无攸遂，在中馈，贞吉。\n“攸”者，所也。“遂”者，专成也。“无攸遂”者，言凡阃外之事皆听命于夫，无所专成也。“馈”者，饷也，以所治之饮食而与人饮食也。馈食内事，故曰“中馈”。中爻坎，饮食之象也。又六二无所专成，惟“中馈”之事而已，自“中馈”之外，一无所专成也。\n六二柔顺中正，女之“正位乎内”者也，故有此象。占者如是贞，则吉矣。\n《象》曰：六二之“吉”，顺以巽也。\n“顺以巽”者，顺从而卑巽乎九五之正应也。《易·小象》言顺以巽者三：蒙六五中爻为“顺”，变爻为巽；渐六四变乾错坤为“顺”，未变为巽；本卦亦变乾错坤为“顺”，应爻为巽。三“顺以巽”皆同。\n九三：家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。\n嗃，呼落反。\n“家人”者，主乎一家之人也。惟此爻独称家人者，三当一卦之中，又介乎二阴之间，有夫道焉。盖一家之主，方敢“嗃嗃”也。“嗃嗃”，严大之声。“嘻嘻”，叹声。“妇”者，儿妇也；“子”者，儿子也。\n九三阳刚不中，为家人之主，故有“嗃嗃”之象。占者如是，不免近于伤恩，一时至于悔厉。然家道严肃，伦序整齐，故渐趋于吉。夫曰“嗃嗃”者，以齐家之严而言也。若专以“嗃嗃”为主，而无恻怛联属之情，使妇子不能堪，而至有嘻叹悲怨之声，则一家乖离，反失处家之节，不惟悔厉，而终至于吝矣。因九三过刚，故又戒占者以此。\n《象》曰：“家人嗃嗃”，未失也。“妇子嘻嘻”，失家节也。\n“节”者，不过之意，不过于威，不过于爱也。处家之道，当威爱并行。“家人嗃嗃”者，威也，未失处家之节也。若主于威而无爱，使妇子不能容，则反失处家之节矣。\n六四：富家，大吉。\n巽为“近市利三倍”，富之象也。又变乾，为金为玉，亦富之象也。承乘应皆阳，则上下内外皆富矣。《记》曰：“父子笃，兄弟睦，夫妇和，家之肥也。”“肥”字即“富”字。因本卦六爻皆中正而吉，所以说此“富”字，亦因本爻有此象也。若家庭之间不孝不弟，无仁无义，纵金玉满堂，将何为哉！然则周公之所谓富者，必有所指归。观孔子《小象》之顺在位，可知矣。\n六以柔顺之体而居四得正，下三爻乃一家之人，皆所管摄者也。初能闲家，二位乎内而主中馈，三位乎外而治家之严，家岂不富？而四又以巽顺保其所有，惟享其富而已，岂不大吉！是以有“富家”之象，而占者“大吉”也。\n《象》曰：“富家，大吉”，顺在位也。\n以柔顺居八卦之正位，故“富”。“顺在位”，见前《八卦正位图》。\n九五：王假有家，勿恤，吉。\n假，音格。\n“假”，至也。自古圣王，未有不以修身正家为本者，所谓“刑于寡妻，至于兄弟，以御于家邦”是也。“有家”，即初之“有家”也。然初之“有家”，家道之始；五之“有家”，家道之成。大意谓初“闲有家”，二“主中馈”，三“治家严”，四“巽顺以保其家”，故皆“吉”。然不免有忧恤而后吉也。若王者至于有家，不恤而知其吉矣。盖中爻坎，忧恤之象，此爻出于坎之外，故“勿恤”。\n九五刚健中正，临于有家之上，盖身修家齐，家正而天下治者也，不忧而吉，可知矣。故其占如此。\n《象》曰：“王假有家”，交相爱也。\n“交相爱”者，彼此交爱其德也。五爱二之柔顺中正足以助乎五，二爱五之刚健中正足以刑乎二，非如常人情欲之爱而已。以周家论之，以文王为君，以太姒为妃，以王季为父，以大任为母，以武王为子，以邑姜为妇，以周公为武王之弟，正所谓父父子子兄兄弟弟夫夫妇妇也。彼此皆有德，故交爱其德，非止二五之爱而已。孔子曰：“无忧者，其惟文王乎！”惟其“交相爱”，所以无忧恤。\n上九：有孚威如，终吉。\n一家之中，礼胜则离，寡恩者也；乐胜则流，寡威者也。“有孚”则至诚恻怛，联属一家之心而不至乖离。“威如”则整齐严肃，振作一家之事而不至渎乱。“终吉”者，长久得吉也。\n上九以刚居上，当家人之终，故言正家长久之道，不过此二者而已。若论其整肃威严，则终吉矣。\n《象》曰：“威如”之吉，反诸身也。\n“反身”，修身也。如言有物，行有恒，正伦理，笃恩义，正衣冠，尊瞻视，凡反身整齐之类皆是也。如是则不恶而严，一家之人有不威之畏矣。","38":"睽外也\n“睽”字从目，目少睛也。目主见，故周公爻辞，初曰“见恶人”，三曰“见舆曳”，上曰“见豕负涂”，皆“见”字之意。若从耳，亦曰“睽”，盖耳聋之甚也。“睽”，乖异也。为卦上离下兑，火炎上，泽润下，二体相违，睽之义也。又中少二女同居，志不同，亦睽之义也。《序卦》：“家道穷必乖，故受之以睽。”“家道穷”者，教家之道理穷绝也。无教家之道理，则乖异矣，所以次家人。睽综家人。家人离之阴在二，巽之阴在四，皆得其正；睽则兑之阴居三，离之阴居五，皆居阳位，不得其正。不正则家道穷，故曰“家道穷必乖，故受之以睽”。\n睽：小事吉。\n彖辞明。\n《彖》曰：睽，火动而上，泽动而下，二女同居，其志不同行。说而丽乎明，柔进而上行，得中而应乎刚，是以“小事吉”。天地睽而其事同也，男女睽而其志通也，万物睽而其事类也。睽之时用大矣哉！\n以卦象、卦德、卦综、卦体释卦名、卦辞，极言其理而赞之。火燥炎上，泽湿就下，物性本然之睽。中女配坎，少女配艮，人情必然之睽。故名“睽”。兑，说。离，明。说丽乎明也。“柔进而上行”者，睽综家人，二卦同体，文王综为一卦，故《杂卦》曰：“睽外也，家人内也。”言家人下卦之离，进而为睽之上卦，六得乎五之中，而下应乎九二之刚也。三者皆柔之所为。柔本不能济事，又当睽乖之时，何由得“小事吉”？然说丽明则有德，进乎五则有位，应乎刚则有辅，因有此三者，是以“小事吉”也。“事同”者，知始作成，化育之事同也。“志通”者，夫唱妇随，交感之情通也。“事类”者，声应气求，感应之机类也。天地不睽不能成造化，男女不睽不能成人道，万物不睽不能成物类，此其时用所以大也。与坎、蹇同。\n《象》曰：上火下泽，睽。君子以同而异。\n“同”者理，“异”者事。天下无不同之理，而有不同之事，异其事而同其理，所以同而异。如禹、稷、颜回同道，而出处异。微子、比干、箕子同仁，而去就死生异是也。彖辞言异而同，象辞言同而异，此所以为圣人之言也。\n初九：悔亡。丧马勿逐，自复。见恶人，无咎。\n丧，息浪反。\n“丧”者，丧去也。中爻坎为亟心之马，马亟心倏然丧去，“丧马”之象也。“勿逐自复”者，不追逐而自还也。兑为悦体，凡《易》中言兑者皆“勿逐自复”。如震之六二变兑，亦“勿逐七日得”；既济六二变兑，亦“勿逐七日得”是也。坎为盗，“恶人”之象也。中爻应爻离持戈兵，亦“恶人”之象也。故大有初爻曰“无交害”，三爻曰“小人害”也。曰“小人”，则指离矣。见“恶人”者，恶人来而我即见之，不以恶人而拒绝也。离为目，见之象也。\n初九当睽乖之时，上无应与相援，若有悔矣。然阳刚得正，故占者“悔亡”。但时正当睽，不可强求人之必合，故必去者不追，惟听其自还，来者不拒，虽恶人亦见之，此善于处睽者也。能如是，则“悔亡”而“无咎”矣。故又教占者，占中之象如此。\n《象》曰：“见恶人”，以辟咎也。\n辟，音避。\n当睽之时，行动即有咎病，故恶人亦不拒绝而见之者，所以“避咎”也。“咎”即睽乖之咎。\n九二：遇主于巷，无咎。\n“遇”者，相逢也，详见噬嗑六三“遇毒”。“巷”有二：街巷也，里巷也。兑错艮，艮为径路，里巷之象也。应爻离中虚，街巷之象也。离为日，主之象也。当睽之时，君臣相求，必欲拘堂陛之常分，则贤者无自而进矣。“遇主于巷”者，言不在廊庙之上，而在于巷道之中，如邓禹诸臣之遇光武是也。\n九二以刚中而居悦体，上应六五。六五正当人心睽乖之时，柔弱已甚，欲思贤明之人以辅之，二以悦体两情相合，正所谓“得中而应乎刚”也，故有“遇主于巷”之象。占者得此，睽而得合矣，故“无咎”。\n《象》曰：“遇主于巷”，未失道也。\n本卦离为戈兵，中爻离亦为戈兵，兑为毁折，中爻又为坎陷，言君臣相遇于巷，岂不失道哉？然当天下睽乖之时，外而前有戈兵，后有戈兵，中原坎陷，内而主又柔弱，国势毁折，分崩离析，正危迫之秋，非但君择臣，臣亦择君之时也。得一豪杰之士，即足以济睽矣，况又正应乎？圣人见得有此象，所以周公许其“无咎”，孔子许其“未失道”也。所以《易经》要玩象。\n六三：见舆曳，其牛掣。其人天且劓。无初有终。\n掣，音彻。劓，鱼器反。\n上卦离为目，“见”之象也。“见”者，六三与上九并见之也。又为牛，“牛”之象也。中爻坎，“舆”之象也，“曳”之象也。“曳”者，拖也，引也。“掣”者，挽也。兑错艮为手，挽之象也。“其人天”者，指六三与上九也。六三阴也，居人位，故曰“人”。上九阳也，居天位，故曰“天”。周公爻辞之玄至此。错艮又为鼻，鼻之象也。刑割去鼻曰“劓”。鼻之上有戈兵，“劓”之象也。艮又为“阍寺”。刑人不曰“阍寺”而曰“劓”者，戈兵之刑，在卦之上体也，若阍寺则在下体矣。然非真割鼻也。鼻者，通气出入之物，六三上九本乃正应，见其曳掣，怒气之发如割鼻然，故取此象。“且”者，未定之辞，言非真割鼻也。大意言车前必有牛，六三在车中，后二曳其车，前四掣其牛，所以上九见之而发怒也。此正所谓无初也。此皆本爻自有之象，《易》惟有此象，无此事，如“入于左腹”之类是也。后儒不悟象，所以将此等险辞通鹘突放过去了。\n六三不中不正，上应上九，欲与之合。然当睽乖之时，承乘皆不正之阳，亦欲与之相合，曳掣不能行，上下正应，见其曳掣，不胜其怒，故有此象。然阴阳正应，初虽睽乖，而终得合也，故其象占如此。\n《象》曰：“见舆曳”，位不当也。“无初有终”，遇刚也。\n阴居阳位，故“不当”。遇刚者，遇上九也。\n九四：睽孤。遇元夫，交孚，厉无咎。\n“元”者，大也。“夫”者，人也。阳为大人，阴为小人，指初为“大人”也。“交孚”者，同德相信也。“厉”者，兢兢然危心以处之，惟恐“交孚”之不至也。\n九四以阳刚当睽之时，左右之邻皆阴柔之小人，孤立而无助者也，故有“睽孤”之象。然性本离明，知初九为大人，君子与之同德相信，故又有“遇元夫，交孚”之象。然必危心以处之，方可“无咎”。故又教占者如此。\n《象》曰：“交孚”“无咎”，志行也。\n“志行”者，二阳同德而相与济睽之志行也。盖“睽”者乖之极，“孤”者睽之极，二德交孚则睽者可合，孤者有朋，志可行而难可济，不特“无咎”而已也。\n六五：悔亡，厥宗噬肤，往何咎？\n“宗”字，详见同人六二。“噬肤”，详见噬嗑六二。言相合甚易，如噬肤之柔脆也。九二“遇主于巷”，曰“主”者，尊之也。六五“厥宗噬肤”，曰“宗”者，亲之也。臣尊其君，君亲其臣，岂不足以济天下之睽？\n六五当睽之时，以柔居尊，宜有悔矣。然质本文明，柔进上行，有柔中之德，下应刚中之贤，而虚己下贤之心甚笃，故悔可亡。有“厥宗噬肤”之象。惟其合之甚易，所以悔亡也。占者以是而往，睽可济矣，故“无咎”也。\n《象》曰：“厥宗噬肤”，往有庆也。\n往则可以济睽，故“有庆”。\n上九：睽孤。见豕负涂，载鬼一车。先张之弧，后说之弧。匪寇婚媾，往遇雨则吉。\n说，吐活反。\n九四之“孤”，以人而孤也，因左右皆阴爻也。上九之“孤”，自孤也，因猜疑而孤也。“见”者，上九自见之而疑也。“负”者，背也。“涂”者，泥也。离错坎，坎为豕，又为水，“豕负涂”之象也。坎为隐伏，“载鬼”之象也。又为“弓”，又为“狐疑”，张弓说弓，心狐疑不定之象也。变震为归妹，男悦女，女悦男，“婚媾”之象也。“寇”指九二、九四。又坎为雨，“雨”之象也。“遇雨”者，遇六三也。“雨”则三之象也。三居泽之上，乃“雨”也。\n上九以阳刚处明终睽极之地，猜疑难合，故为“睽孤”。与六三本为正应，始见六三“舆曳牛掣”，乃疑其为豕，又疑其非豕而乃鬼，方欲张弓射之，又疑其非鬼，乃脱弓而近于前，乃六三也。使非二四之“寇”难，则早与六三成其“婚媾”矣。始虽“睽孤”，终而“群疑亡”，又复相合，故有此象。“往遇雨”，又“婚媾”之象也。占者凡事必如是，则“吉”。\n《象》曰：“遇雨”之吉，群疑亡也。\n惟群疑亡，所以“遇雨吉”。","39":"蹇难也\n“蹇”，难也。为卦艮下坎上。坎险艮止，险在前，见险而止，不能前进，蹇之义也。《序卦》：“睽者乖也，乖必有难，故受之以蹇。”所以次睽。\n蹇：利西南，不利东北。利见大人，贞吉。\n蹇难在东北，文王圆图，艮、坎皆在东北也，若西南则无难矣，所以“利西南”。“大人”者，九五也。旧注“坤方体顺而易，艮方体止而险”，又云“西南平易，东北险阻”，皆始于王弼。弼曰“西南为地，东北为山”，后儒从之，遂生此说，而不知文王卦辞，乃与解卦相综也。\n《彖》曰：蹇，难也，险在前也。见险而能止，知矣哉！蹇“利西南”，往得中也。“不利东北”，其道穷也。“利见大人”，往有功也。当位“贞吉”，以正邦也。蹇之时用大矣哉！\n睽、蹇皆曰“时用”，解止曰“时”，可见“用”字有别义。此略过了。\n难，乃旦反。知，音智。\n以卦德、卦综、卦体释卦名、卦辞而赞之。“难”者，行不进之义也。坎之德为险，居卦之前，不可前进，此所以名为蹇也。然艮止在后，止之而不冒其险，明哲保身者也。不其智哉！“往得中”者，蹇综解，二卦同体，文王综为一卦，故《杂卦》曰：“解，缓也；蹇，难也。”言解下卦之坎，往而为蹇上卦之坎，所以九五得其中也。讼卦“刚来而得中”者，坎自需上卦来，故曰“来”。此卦解自下卦往，故曰“往”。“其道穷”者，解上卦之震下而为蹇下卦之艮也。蹇难在东北，今下于东北，又艮止不行，所以其道穷。文王圆图，东北居圆图之下，西南居圆图之上，故往而上者，则入西南之境矣，故“往得中”。来而下者，则入东北之境矣，故“其道穷”。“往有功”之“往”，即“往得中”之“往”，故“利见”九五之“大人”，则“往有功”。“当位”者，阳刚皆当其位也。八卦正位，坎在五，艮在三，今二卦阳刚皆得正位，有贞之义，故“贞吉”。渐卦巽、艮男女皆得正位，故彖辞同。若以人事论，“往得中”者，是所往得其地，据形胜而得所安也，若非其地，其道穷矣。“往有功”者，所依得其人也。盖阳刚中正以居尊位，则其德足以联属天下之心，其势足以汲引天下之士，故“往有功”。“正邦”者，所处得其正，正则行一不义、杀一不辜而不为，所以能明信义于天下，而邦其底定矣。有此二者，方可济蹇，故叹其时用之大，与坎、睽同。\n《象》曰：山上有水，蹇。君子以反身修德。\n山上有水，为山所阻，不得流行，蹇之象也。君子以行有不得者，乃此身之蹇也。若怨天尤人，安能济其蹇？惟“反身修德”，则诚能动物，家邦必达矣。此善于济此身之蹇者也。\n初六：往蹇来誉。\n四皓。\n“往来”者，进退二字也。本卦蹇字从足，艮综震，震为足，故诸爻皆以“往来”言之。“誉”者，有智矣哉之誉也。“往”以坎言，上进则为往，入于坎矣；“来”以艮言，不进则为来，艮而止矣。\n六非济蹇之才，初非济蹇之位，故有进而往，则冒其蹇，退而来，则来其誉之象。占者遇此，亦当有待也。\n《象》曰：“往蹇来誉”，宜待也。\n“待”者，待其时之可进也。\n六二：王臣蹇蹇，匪躬之故。\n萧何。\n“王”者，五也。“臣”者，二也。外卦之坎，王之“蹇”也。中爻之坎，臣之“蹇”也。因二五在两坎之中，故以两“蹇”字言之。六二艮体有“不获其身”之象，故言“匪躬”。“匪躬”者，不有其身也。言王臣皆在坎陷之中，蹇而又蹇，不能济其蹇。六二不有其身者，因此“蹇蹇”之故也。张巡、许远，此爻近之。\n六二当国家蹇难之时，主忧臣辱，故有“王臣蹇蹇”之象。然六二柔顺中正，盖事君能致其身者也，故又有“匪躬”之象。占者得此，成败利钝非所论矣。\n《象》曰：“王臣蹇蹇”，终无尤也。\n力虽不济，心已捐生，有何所尤？初六以“不往”为“有誉”，六二以“匪躬”为“无尤”，有位无位之间耳。\n九三：往蹇来反。\n韩信。\n“来反”者，来反而比于二也。此爻变坤，为水地比来反者，亲比于人之象也。六二忠贞之臣，但其才柔不能济蹇，蹇而又蹇，思刚明之人以协助之，乃其本心，所以喜其反也。\n九三阳刚得正，当蹇之时，与上六为正应，但为五所隔，故来反而比于同体之二。三则资其二之巽顺，二则资其三之刚明，可以成济蹇之功矣。故有往则蹇而来反之象。占者得此，亦宜反也。\n《象》曰：“往蹇来反”，内喜之也。\n“内”者，内卦之二也。二之阴乐于从阳，故“喜”之。\n六四：往蹇来连。\n张耳。\n“连”者，相连也。许远当禄山之乱，乃对张巡曰：“君才十倍于远。”由是帷帐之谋一断于巡。此六四之“来连”者也。六二“喜”之者，内之兄弟喜其己之有助也。六四“连”之者，外之朋友喜其人之有才也。\n六四近君，当济蹇矣。但六四以阴柔之才，无拨乱兴衰之略，于是来连于九三，合力以济，故其象如此。占者凡事亲贤而后可。\n《象》曰：“往蹇来连”，当位实也。\n阳实阴虚，实指九三，与“独远实”之实同。“当位实”者，言九三得八卦之正位，实当其位也。阳刚得其正位，则才足以有为，可以济蹇矣。\n九五：大蹇朋来。\n汉高。\n阳大阴小，大者阳也，即九五也，言九五之君蹇也。“朋”指三，即九五同德之阳。三与五，“同功异位”者也。上六来硕，应乎三者也。六四“来连”，比乎三者也。三有刚实之才，惟三可以济蹇，然三与五非比非应，不能从乎其五，惟二与五应，乃君臣同其患难者，余四爻则不当其责者也。“朋来”合乎二，以济蹇，则诸爻皆共济其蹇矣。自下而上曰“往”，自上而下曰“来”，今曰“朋来”，则知六四三皆来合乎二也。“朋来”之来，即“来反”之来。此爻变坤，坤为众，“朋”之象也。自本爻言之，所谓“当位贞吉以正邦也”。自上下诸爻言之，所谓“利见大人往有功也”。所以“大蹇朋来”。\n九五居尊，有阳刚中正之德，当蹇难之时，下应六二。六二固“匪躬”矣，而为三者又“来反”乎二而济蹇，三之“朋”既“来”，则凡应乎朋而“来硕”，比乎朋而“来连”者，皆翕然并至，以共济其蹇矣，故有“大蹇朋来”之象。占者有是德，方应是占也。\n《象》曰：“大蹇朋来”，以中节也。\n“中”者，中德也，即刚健中正之德也。“节”者，节制也。言为五者，有刚健之中德，足以联属之；有九五之尊位，足以节制之，所以“大蹇朋来”也。\n上六：往蹇来硕，吉，利见大人。\n彭越。\n“硕”者，大也。阳大阴小，故言“大”。不言“大”而言“硕”者，九五已有“大”字矣。“来硕”者，来就三也。“吉”者，诸爻皆未能济蹇，此独能济也。“见大人”者，见九五也。\n上六才柔，未能济蹇，且居卦极，往无所之，益以蹇耳。九三乃阳刚当位，众志之所乐从者，反而就之，则可以共济其蹇矣，何吉如之！若此者，非因人成事也。以九五大人之君，方在蹇中，上与三利见之，共济其蹇，则“往有功”矣，此其所以吉也。故占者“来硕”则“吉”，而“见大人”则“利”也。若旧注来就九五，则见大人为重复矣。且《小象》曰“志在内也”，若就九五，则志在外卦，不在内卦矣。\n上六与九三正应，而三则阳刚得位，众之所归，故得三即得众矣。然以利在见五者，五君也，三臣也。\n《象》曰：“往蹇来硕”，志在内也。“利见大人”，以从贵也。\n内指九三，对外卦而言则曰“内”。贵指九五，对下贱而言则曰“贵”。志内所以尚贤，从贵所以严分。\n非独严分，亦以尊贵，可以号召也。","40":"解缓也\n“解”者，难之散也。居险能动则出于险之外矣，解之象也。又雷雨交作，阴阳和畅，百物解散，亦解之象也。《序卦》：“蹇者，难也。物不可以终难，故受之以解。”所以次蹇。\n解：利西南，无所往，其来复，吉。有攸往，夙吉。\n解，佳买反。\n“夙”，早也。此教占者之辞。言解“利西南”，当往西南，若不往，“来复”于东北之地，亦吉。但往西南则早得吉。不然，“来复”于东北之地，虽吉，不若西南之早矣。解与蹇相综，解即解蹇难，故文王有此辞。“无所往”者，蹇下卦乃艮止，止则不往，所以无所往也。前儒不知文王《序卦》，所以注蹇解二卦，不成其说。\n《彖》曰：解，险以动，动而免乎险，解。“解，利西南”，往得众也。“其来复，吉”，乃得中也。“有攸往，夙吉”，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲拆。解之时大矣哉！\n以卦德、卦综释卦名、卦辞，又极言而赞之。险之为物，见天则讼，见泽则困，见山则蹇，在外卦则屯。惟坎险在内，震动在外，是动而出乎险之外，得以免于险难，所以名“解”也。自下而上曰“往”，自上而下曰“来”。“往得众”者，解综蹇，蹇下卦之艮，往而为解上卦之震也。震二爻皆坤土，坤为众，故得众也。“得中”者，蹇上卦之坎来而为解下卦之坎也。九二“得中”，与讼卦“刚来而得中”同，故蹇坎往上曰“得中”，解坎来下曰“得中”也。“往有功”即上文“得众”也，“得众”故“有功”。来复东北止“得中”而已，往西南则“得众”有功，所以早吉也。“天地解”者，雨出于天，雷出于地也。穷冬之时，阴阳固结不通，所以雷不随雨。及至阴阳交泰，则气解而雷雨交作，由是形随气解，而“百果草木皆甲坼”矣。“甲”者，萌甲；“拆”者，拆开。解之时既至，天地不能闭之而使不解，则天地之所以成化功者，此解也。皆此解之时也，所以为“大”。\n《象》曰：雷雨作，解。君子以赦过宥罪。\n“赦过宥罪”，君子之用刑原当如此。非因大难方解之后，当如此也。无心失理之谓过，恕其不及，而“赦”之不问。有心为恶之谓罪，矜其无知而“宥”之从轻。“雷雨交作”，天地以之解万物之屯；“赦过宥罪”，君子以之解万民之难。此正《杂卦》“解缓”之意。\n初六：无咎。\n“难”既解矣，六以柔在下，而上有刚明者为正应，以济其不及，“无咎”之道也。故其占如此。\n《象》曰：刚柔之际，义“无咎”也。\n“刚柔际”者，刚柔相交际也。方解之初，宜安静以休息。六之柔、四之刚交相为用，则不过刚不过柔，而所事皆得宜矣，故于义“无咎”。\n九二：田获三狐，得黄矢，贞吉。\n坎为狐，“狐”之象也。坎为弓，“矢”之象也。中爻离，离居三，“三”之象也。又为戈兵，戈兵震动，“田”之象也。变坤，坤为黄，“黄”之象也。“狐”媚物，小人之象。黄中色，矢直物，中直者，君子之象，即六五爻所言君子小人。\n九二阳刚得中，上应六五，为之信任于国家大难方解之后，盖有举直错枉之权，退小人而进君子者也，故能去邪媚得中直，有“田获三狐，得黄矢”之象。正而且吉之道也。故其占如此。\n《象》曰：九二“贞吉”，得中道也。\n居中而“得中道”也。\n六三：负且乘，致寇至。贞吝。\n坎为舆，三居上，“乘”之象也。又为盗，“寇”之象也。“负”者，小人之事。“舆”者，君子之器。此二句虽孔子据理之言，然亦本卦象之所有者。盖三负四乘二，四不中不正，乃小人也；二得中，乃君子也。“贞”者，位乃君所与，故正也。负且乘，固无以正得之之理。如汉文帝宠邓通，擢为太中大夫，此“负且乘”也。天子所擢，岂不为正？后景帝时下吏，是寇之至也。此之谓贞而吝。\n六三阴柔，不中不正，而乃居下之上，是小人窃高位而终必失之者也，故有负乘致寇之象。占者得此，虽正亦可羞也。\n《象》曰：“负且乘”，亦可丑也。自我致寇，又谁咎也？\n“谁咎”者，言我之咎也，非人之咎也。同人“又谁咎也”，言人谁有咎我者也。节“又谁咎也”，言无所归咎于人也。与节小异。\n九四：解而拇，朋至斯孚。\n“而”者，汝也。震为足，拇居足下，三居震之下，“拇”之象也。二与四同功，皆有阳刚之德，故曰“朋”。“解而拇”，占中之象也。若旧注以初为拇，则刚柔之际，义无咎，不当解者也。惟负乘之小人，则当解之矣。\n二与四为同德之朋，当国家解难之时，四居近君之位，当大臣之任，而二为五之正应，则四与二皆同朝君子之朋也。但四比于三，间于负乘之小人，则君子之朋，安得而至？惟解去其小人，则君子之朋自至而孚信矣。故戒占者必如此。\n《象》曰：“解而拇”，未当位也。\n以阳居阴，故“未当位”。惟未当位，故有解拇之戒。\n六五：君子维有解，吉。有孚于小人。\n“维”者，系也。文王坎卦“有孚维心”，此卦上坎下坎，故亦用此“维”字“孚”字。“君子”者，四与二也。“吉”者，君子用事，小人远退，何吉如之！“孚”者，信也。言信于小人，而小人自退也。\n本卦四阴，六五以阴居尊，而三阴从之，乃宦官宫妾外戚之类也。然六五近比于四，又与九二为正应，皆阳刚之君子也。六五若虚中下贤，此心能维系之，则凡同类之阴，皆其所解矣，所以吉也，何也？盖君子用事，自能孚信于小人，而小人自退矣，此其所以有解而吉也。故教占者必如此。\n《象》曰：君子“有解”，小人退也。\n君子维而有解，则小人不必逐之而自退矣。\n上六：公用射隼于高墉之上，获之，无不利。\n隼，思尹切。\n上高而无位，“公”也。“隼”，鹞属，鸷鸟之害物者也。震为鹄，变爻为雉，鸟之象也。坎为弓居下卦，自下射上之象也。震错巽，高之象也。“墉”者，墙也。“高墉”者，王宫之墙也。变离，外闱中空，近于六五之君，“高墉”之象也，故泰卦上六亦曰“城”。九二地位，故曰“田”，狐则地之走者也。上六天位，故曰“高”，隼则天之飞者也。“获之”者，获其隼也。隼栖于山林，人皆得而射之，惟栖于王宫高墉之上，则如城狐社鼠，有所凭依，人不敢射矣。盖六五之“小人”乃宦官宫妾，上六之“隼”则外戚之小人，王莽之类是也。\n上六柔顺得正，而居尊位，当动极解终之时，盖能去有所凭依之小人者也。故有“公用射隼于高墉”而“获之”象。占者得此，则小人悖逆之大患解之已尽矣，故“无不利”。\n《象》曰：“公用射隼”，以解悖也。\n以下叛上谓之悖，王莽是也。《系辞》别是孔子发未尽之意，与此不同。","41":"损\n“损”者，减损也。其卦损下刚卦，益上柔卦，此损之义也。又泽深山高，损其深以增其高，此损之象也。《序卦》：“解者，缓也，缓必有所失，故受之以损。”所以次解。\n损：有孚，元吉。无咎，可贞。利有攸往。曷之用，二簋可用享。\n“有孚”者，言损不可声音笑貌为之，必当至诚也。凡曰“损”，本拂人情之事，或过或不及，或不当其时，皆非合正理，而有孚也。非有孚则不吉，有咎。非可贞之道，不能攸往矣。惟“有孚”则“元吉”也，“无咎”也，“可贞”也，“利有攸往”也，有是四善矣。“曷之用”者，言何以用损也，若问辞也。“二簋”至薄，亦可享于鬼神，若答辞也。享鬼神，当丰不当损，曰“可用享”，言当损时，至薄亦无害也。\n《彖》曰：损，损下益上，其道上行。损而“有孚，元吉。无咎，可贞。利有攸往。曷之用，二簋可用享”，二簋应有时，损刚益柔有时，损益盈虚，与时偕行。\n以卦综释卦名、卦辞。本卦综益卦，二卦同体，文王综为一卦，故《杂卦》曰：“损益，盛衰之始也。”益卦柔卦居上，刚卦居下。损下益上者，益下卦之震，上行居损卦之上，而为艮也，故“其道上行”，如言“柔进而上行”也。“时”者，理之当然，势之不得不然者也。言文王之所谓“二簋可用享”者，非常道也，以其时当于损，所以“二簋”也。本卦损下卦之刚，益上卦之柔，亦非常道也，以时当损下益上，所以损刚益柔也。盖天下之理，不过“损益盈虚”而已。物之盈者，盈而不已，其势必至于消，消则损矣。物之虚者，虚而不已，其势必至于息，息则益矣。是以时当盈而损也，不能逆时而使之益。时当虚而益也，不能逆时而使之损。此皆物理之常，亦因时而有损益耳。文王之“二簋可用享”者，亦时而已，不然致孝鬼神当盈，岂可损乎？\n《象》曰：山下有泽，损。君子以惩忿窒欲。\n泽深山高，损下以增高，损之象也。“惩”者，戒也。“窒”者，塞也。“忿”多生于怒，心刚恶也。突兀而出，其高如山，况多忿如少男乎？故当戒。欲多生于喜，心柔恶也。浸淫而流，其深如水，况多欲如少女乎？故当塞。忿不惩必迁怒，欲不窒必贰过。君子修身，所当损者，莫切于此。\n初九：己事遄往，无咎，酌损之。\n“己”者，我也。本卦损刚益柔，损下益上，乃我之事也，“遄”者，速也。“酌”即“损刚益柔有时”时字之意。\n本卦初刚四柔，当损初以益四，故有“己事遄往”之象。占者得此固无咎矣。然“损刚益柔有时”，不可以骤损，必斟酌而后损也，故许其“无咎”，而又戒之以此。\n《象》曰：“己事遄往”，尚合志也。\n尚与上通，指四也。阴阳正应，故“合志”。四之志欲损其疾，而初“遄往”合其志也。\n九二：利贞，征凶。弗损，益之。\n“贞”者，即九二之刚中也。中则正矣。“利”者，安中德以自守，未有不利者也。“征”者，不守其刚中之德，而有所往也。“凶”者，六五君位，本卦性悦，此爻变震，以悦而动，必容悦以媚上，则流于不中不正矣，所以凶也。“弗损”者，弗损其刚中之德，即贞也。“益”者，即利也。五虽柔而居刚，非不足，二虽刚而居柔，非有余，所以损刚不能益柔也。初以刚居刚，且欲酌损，况二居柔乎？何以弗损而能益？二乃五之正应，为臣者能为正人君子，岂不有益于君？所以损则不益，弗损则能益也。\n九二刚中，当损刚之时，志在自守“弗损”，贞之道也，故占者利于此贞。若失此贞而有所往，则凶矣。盖不变其所守，正以益上，故贞则利，而征则凶也。\n《象》曰：九二“利贞”，中以为志也。\n德以中为美，志定则守斯定矣。二中以为志，所以“弗损，益之”。\n六三：三人行，则损一人。一人行，则得其友。\n本卦综益。二卦原是阴阳相配之卦，因损下益上正在此爻，所以发此爻辞也。益卦下震，三为人位，人之象也。震为足，“行”之象也。又为大涂，行人之象也。中爻坤为众，“友”之象也。“三人行”者，益下卦三爻，居于损之上三爻也，即彖辞“其道上行”也。“损一人”者，损六三也。“一人行”即六三也，六三行上而居四也。三行上而居四，即损下之三而益上之四也。益卦下三爻乃一阳二阴，今损一阴以居四，则阴阳两相配矣。居四以初为正应，则“得其友”也。两相得则专，三则杂乱。三损其一者，损有余也，两也。一人得友者，益不足也，两也。天地间阴阳刚柔，不过此两而已。故孔子《系辞》复以“天地男女”发之。\n本卦综益，损下益上，此爻正损益上下交接之爻，故有此象。占者得此，凡事当致一，不可参以三而杂乱也。\n《象》曰：“一人行”，“三”则疑也。\n疑乱杂，故损一阴于上，不论六爻，具分上下也。\n“一人行”，得友而成两，则阴阳配合而专一，若三则杂乱而疑矣，所以损其一也。\n六四：损其疾，使遄有喜，无咎。\n四变中爻为坎，坎为“心病”，“疾”之象也。“遄”，即初“遄往”之“遄”。初与四阴阳相合，当损下之时，初即以为己之事而“遄往”矣。使其初果得“遄往”，则有喜矣，所以加一使字。兑悦在下，喜之象也。\n六四阴柔得正，与初九为正应，赖其阳刚益己，而损其疾，故有“损其疾”之象。使初能遄往，则四得损其疾，而有喜矣，“无咎”之道也。故其象占如此。\n《象》曰：“损其疾”，亦可喜也。\n赖初损疾，亦可喜矣，而况初之“遄往”哉！\n六五：或益之十朋之龟，弗克违，元吉。\n两龟为一“朋”。“十朋之龟”，大宝也。大象离，龟之象也。“十”者，土之成数，中爻坤，“十”之象也。坤土两两相比，“朋”之象也。本卦错咸，故咸九四亦曰“朋从”；综益，益之六二，即损之六五，特颠倒耳，故亦曰“十朋”。两象相同，或者不期而至，不知所从来也。“弗克违”者，虽欲违之而不可得也。\n六五当损之时，柔顺虚中以应九二，盖有下贤之实心，受天下之益者也，故有此象。占者得此，“元吉”可知。然必有是德，方有是应也。\n《象》曰：六五“元吉”，自上佑也。\n与大有“天佑”、旅“上逮”同，盖皆五之虚中也。\n上九：弗损益之，无咎，贞吉，利有攸往，得臣无家。\n居损之时，若用刚以损下，非为上之道矣，安得无咎，安得正而吉，又安能行之而得人心也？今不损下而自益，是即益其下也。九二“弗损益之”益其上，上九“弗损益之”益其下，所以大得志如此。“得臣”者，阳为君，阴为臣，三为正应，“得臣”之象也。“无家”者，此爻变坤，有国无家之象也。故师卦上六坤变艮则曰“承家”，此爻艮变坤则曰“无家”，可见矣。若以理论，乃国尔忘家，无自私家之心也。若用刚以损下，是自私而有家矣。\n上九居损之终，则必变之以不损；居艮之极，则必止之以不损。当损下益上之时，而能弗损以益下，所以“无咎”也，正而吉也，“利有攸往”也，“得臣无家”也。占者有是德，方应是占矣。\n《象》曰：“弗损益之”，大得志也。\n“无咎，贞吉，利有攸往，得臣无家”，岂不“大得志”？","42":"益损益盛衰之始也\n益与损相综。益之震上而为艮，则损下以益上，所以名损；损之艮下而为震，则损上以益下，所以名益。《序卦》：“损而不已必益，故受之以益。”所以次损。\n益正位在四，初应四，三五比四。\n益：利有攸往，利涉大川。\n“利有攸往”者，凡事无不利也。“利涉大川”者，言不惟利所往，可以处常，亦可以济变。\n《彖》曰：益，损上益下，民说无疆。自上下下，其道大光。“利有攸往”，中正有庆。“利涉大川”，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。\n上下二字，上遐嫁反，下如字。\n以卦综释卦名，以卦体、卦象、卦德释卦辞而赞之。“损”，损上卦之艮；“益”，益下卦而为震也。“民说无疆”，就损益所及之泽而言也，益在民也。“其道大光”，就损益所行之事而言也，益在君也。人君居九重之上，而能膏泽及于闾阎之民，则“其道”与乾坤同其广大，与日月同其光明，何“大光”如之！卦本损上，然能损上以益下，则并上亦益矣。民益君益，所以名“益”。九五以中正位乎上，而六二以中正应之，是圣主得贤臣，而庆泽自流于天下矣，所以“利有攸往”也。木道乃行者，亦如中孚之舟虚，乃风中之木，故“木道乃行”。中孚、涣皆风木，且本卦象离错坎，亦有水象。“动而巽”者，动则有奋发之勇而不柔弱，巽则有顺入之渐而不卤莽，所以德崇业广，日进无疆。此以卦德言也。震乃刚卦为天，“天施”者，初之阳也。巽乃柔卦为地，“地生”者，四之阴也。天以一阳施于下，则天道下济，而资其始；地以一阴升于上，则地道上行，而资其生，所以“品物咸亨”，而“其益无方”。此以卦体言也。“时”者，理之当其可也。言凡益之道，非理之本无，而勉强增益之也，乃理之当其可，而后增益也。如曰“日进无疆”者，以人事当然之理而益也。曰“其益无方”者，以造化自然之理而益也。理之所在，当益而益，是以自我益之，改过迁善，不嫌其多；自人益之，十朋之龟，愈见其吉矣。\n《象》曰：风雷，益。君子以见善则迁，有过则改。\n风雷之势，交相助益，益之道也。“善”者，天理也，吾性之本有也。“过”者，人欲也，吾性之本无也。理欲相为乘除，去得一分人欲，则存得一分天理。人有善而速从，则过益寡；己有过而速改，则善益增，即风雷之交相助益矣。\n初九：利用为大作，元吉，无咎。\n“大作”者，厚事也，如迁国大事之类是也，故曰“益以兴利”。阳大阴小，此爻阳，故以“大”言之。“元吉”以功言，非诸爻以效言也。\n初刚在下为动之主，当益之时，受上之益者也。六四近君，与初为正应，而为六四所信任，以其有刚明之才，故占者“利用为大作”。然位卑任重则有所不堪者，必其所作之事，周悉万全，为经久之良图，至于元善，方可无咎。苟轻用败事，必负六四之信任矣。故戒占者以此。\n《象》曰：“元吉，无咎”，下不厚事也。\n“下”者，下位也。“厚事”者，大作也。初位卑，本不可以任厚事，岂能“无咎”？故必大善而后“无咎”也。\n六二：或益之十朋之龟，弗克违，永贞吉。王用享于帝，吉。\n损之六五，即益之六二，以其相综，特倒转耳，故其象同。损受下之益，此则受上之益。“十朋之龟”者，宠锡优渥之象也。“永贞吉”者，必长永贞固，守其虚中之德，而后可以常保其优渥之宠锡也。“王用享于帝”者，言永贞虚中之心，必如人君之对越在天，小心翼翼也。此一句又“永贞”之象，乃占中之象也。帝出震齐巽，本卦下震上巽，帝之象也。\n六二当益之时，虚中处下，盖精白一心以事君，本无求益之心，而自得君之宠益者也。故有“或益十朋之龟，弗克违”之象。然爻位皆阴，又戒以永贞，必事君如事天，而后可以受此益也。故又有“王用享于帝”之象。占者必如是，方吉也。\n《象》曰：“或益之”，自外来也。\n言不知所从来也，与上九“自外来”同。二则“吉”来，上则“凶”来。\n六三：益之用凶事，无咎，有孚中行，告公，用圭。\n“凶”者，险阻盘错也。如使大将出师，及使至海外之国，岂不是凶？三之爻位本凶。《说文》云：凶象地穿交陷其中。中爻坤地，震极未有不陷者，“凶”之象也。“无咎”者，凶事乃上之所益，三不得与焉，所以“无咎”也。“有孚”者，诚信也。“中行”者，中道可行之事也。“凶事”乃太过之事，故以“中”言之。“告公”者，告于四也，故六四曰“中行告公从”。“圭”乃通信之物，祭祀朝聘用之，所以达诚信也。六爻中虚，“有孚”之象也。巽综兑，兑为口，告之象也。故夬外卦兑，亦曰“告自邑”；泰卦中爻兑，亦曰“自邑告命”。震为玉，圭之象也。“用圭”乃“有孚”之象，又占中之象也。“有孚”以下，乃圣人教占者开凶事之路也。\n六三阴柔，不中不正，又居益下之极，然当益下之时，故有受上之益，而用行“凶事”之象。占者得此，可以“无咎”。若以阴柔不堪此凶事，必当有孚诚信，以中道可行之事告于公，如“用圭”通诚信焉，庶乎凶事或可免也，故又有“中行告公用圭”之象。教占者必如此。\n《象》曰：益“用凶事”，固有之也。\n“固有之”者，本有之也。言三之爻位多凶，则凶事乃三之本有也。孔子“三多凶”之句，本原于周公之爻辞，六十四卦惟谦卦三爻有“吉”字，余皆无，故“三多凶”。\n六四：中行告公从，利用为依迁国。\n为字去声。\n“中行告公”者，即三爻以中道可行之事，而告于四也。“从”者，巽性顺从之象也。“为”字，去声。凡迁国安民，必为其依而后迁。“依”者，依其形胜也。依形胜，即所以依民也。如汉高祖之徙长安，以其地阻，三面可守，独以一面东制诸侯，依其险而迁者也。国有所依，则不费其兵，不费其财，而民有所依矣。宋太祖亦欲徙长安，因晋王固谏，乃叹曰：“不出百年，天下民力殚矣。”以四面受敌无所依也。故周公不曰“利用迁国”，而曰“为依迁国”。中爻坤，“国”之象也。损益相综，损卦艮之一阳下而迁为益之初，兑三之阴上而迁为益之四，“迁”之象也。九五坐于上，而三阴两列，中空如天府，前后一阳为之藩屏，有所凭依，一统之象也，故“利用为依迁国”。盖迁国安民，乃益下中行之大事，则非凶事矣，故三“告”而四“从”也。\n四阴得正，有益下之志，而又有益下之权者也。三乃受四之益者。若以中道可行之事告于四，而四从之，上下协谋，则“利用为依迁国”，而凡事之可迁移者，亦无不利也。故其象如此，占可知矣。\n《象》曰：“告公从”，以益志也。\n八卦正位，巽在四，四以益下为志，故“告公从”。\n九五：有孚惠心，勿问，元吉，有孚惠我德。\n“惠”者，即益下之惠也。“心”者，益下之心也。“德”者，益下之政也。二、三皆受上之益者也，则益之权在四矣。三比四，有孚于四，以中行告四，四从之。五比四，有孚于四，四不必告五，五亦不必问四矣。下于上曰“告”，上于下曰“问”。盖正位在四，知其必能惠下也，所以“勿问”也。故《小象》曰“勿问之矣”。巽为命，综兑为口，中爻坤错乾为言，皆“告问”之象也。故三爻、四爻、五爻曰“告”曰“问”。五爻变成艮矣，艮止，“勿问”之象也。“我”者，五自谓也。“元吉”即有孚惠德也。言四之惠者，皆五之德也。\n九五阳德中正，为益下之主，当益之时，以益下之惠心，有孚于四，不必问而知其“元吉”矣，何也？盖五孚于四，五之心知四必能惠我之德也，故有“勿问”之象，而占者“元吉”。\n《象》曰：“有孚惠心”，勿问之矣。“惠我德”，大得志也。\n四之《小象》曰“告公从”，五曰“勿问之矣”，见“告”、“问”二字为重，上下相联属也。四曰“以益志也”，五曰“大得志也”，见四以益下为志，而此则大得益下之志也。看六爻，要留心《小象》。\n上九：莫益之，或击之。立心勿恒，凶。\n“莫益”者，莫能益也。此爻与恒卦九三同，亦“不恒其德”者也，所以下句言“勿恒”。盖巽为“进退不果”，“勿恒”之象也，所以“莫益”也。又变坎为盗，中爻艮为手，大象离为戈兵，坎错离亦为戈兵，盗贼手持戈兵，“击”之象也。此与蒙卦上九“击”字相同，通是有此象。前儒不识象，止以理度之，就说求益不已，放于利而行多怨，不夺不餍，往往似此，失《易》之旨。殊不知益卦不比损卦，损刚益柔有时，非恒常之道也。若益而不已，则“日进无疆，其益无方”，所以立心当恒。若不恒，不能益而不已，则“凶”矣。\n上九以阳刚居益之极，极则变而不益矣，故有“莫益或击”之象。所以然者，以其立心不恒也。若益民之心恒久不变，则“民说无疆”矣，安有“击之”之凶哉！惟其立心不恒，所以占者“凶”。\n《象》曰：“莫益之”，偏辞也。“或击之”，自外来也。\n“辞”者，爻辞也。“偏”对正言，言非爻辞之正意也。正意在下句。“言”且莫言“莫能益”也，此非到底之辞，犹有“击之”之者，此是正辞也。自外来与六二同，但分吉凶耳。","43":"夬决也刚决柔也\n“夬”者，决也，阳决阴也，三月之卦也。其卦乾下兑上，以二体论，水在天上，势必及下，决之象也。以爻论，五阳长盛，一阴将消，亦决之象也。《序卦》：“益而不已必决，故受之以夬。”所以次益。\n夬：扬于王庭，孚号有厉。告自邑，不利即戎，利有攸往。\n“扬于王庭，孚号有厉”，皆指上六小人。“扬”者，得志放肆之意。“于王庭”，在君侧也。五为君王之象也。兑错艮为门阙，庭之象也。故节卦中爻艮亦曰“庭”。六与三为正应，故曰“孚”。兑为口舌，号之象也，故上六阴消曰“无号”。六号呼其三，与之孚契，三在众君子之中，不敢与之相交，则三亦危矣，故“有厉”也。此见小人难决也。盖容悦小人，在君之侧，君听信不疑，孚者且危厉，则不孚者可知矣。此所以难决也。“告自邑”者，告同类之阳也，如言告于本家之人也。乾错坤，“邑”之象也。坤为众，又众人之象也。乾为言，告之象也。不“即戎”，不尚武勇也。言虽告于众人，亦不合力以尚武勇也。方“利有攸往”而小人可决矣，此正所谓决而和也。非旧注正名其罪相与合力也。若如此，乃是即戎矣。\n《彖》曰：夬，决也，刚决柔也。健而说，决而和。“扬于王庭”，柔乘五刚也。“孚号有厉”，其危乃光也。“告自邑，不利即戎”，所尚乃穷也。“利有攸往”，刚长乃终也。\n说，音悦。长，丁丈反。\n释卦名、卦辞。惟健则不怯以容其恶，惟说则不猛以激其变。“健而说”者，德也。“决而和”者，事也。一阴加于五阳之上，则君亦在下矣。又与君同体，又容悦，岂不肆于王庭？三虽危，能舍正应而从君子，所以危而有光。君侧之小人，岂可尚武勇？尚武勇世道乱矣。故尚则必穷，刚长阴自消矣。\n“光”正于“危”见得，故曰“乃光”。若不危，则不光矣，勿以危自阻也。\n《象》曰：泽上于天，夬。君子以施禄及下，居德则忌。\n此象诸家泥滞程、朱“溃决”二字，所以皆说不通。殊不知孔子此二句乃生于“泽”字，非生于“夬”字也。盖夬乃三月之卦，正天子布德行惠之时，乃惠泽之“泽”，非水泽之“泽”也。“天”者，君也。“禄”者，泽之物也。“德”者，泽之善也。“居”者，施之反也。纣鹿台之财，“居德”也。周有大赉，“施禄”也。下句乃足上句之意，言泽在于君，当施其泽，不可居其泽也。居泽，乃人君之所深忌者。\n赵汝愚不迁韩侂胄官秩，此居德则忌也。国家有大故，必用殊恩，故夬忌居德。王允不赦西凉军士亦然。\n初九：壮于前趾，往，不胜为咎。\n震为足，本卦大象震，又变巽错震，又居下，故以足趾言之。“壮”者，大壮也。四阳为壮，五阳为夬。“前”者，初居下，而欲急进于四阳大壮之位，近九五以决上六，故不曰“趾”，而曰“前趾”也。“往”者，往决上六也。既曰“前”，又曰“往”，则初九急进，而决之之情见矣。凡所谓咎者，皆以其悖于理，而为咎病也。若君子之决小人，非悖于理也，但不量力，不能胜小人，反为小人所伤，则为咎也，故曰“不胜为咎”。\n初九当夬之时，是以君子欲决小人者也。但在下位卑，又无应与，恃刚而往，故有此象，其不胜小人可必矣。故占者以“不胜”为“咎”。\n范滂似之。\n《象》曰：“不胜”而往，咎也。\n言往之前，已知其“不胜”小人矣。不虑胜而决，所以“咎”也。\n九二：惕号，莫夜有戎，勿恤。\n莫，音暮。\n曰“勿恤”，教之以果决也，即其危乃光也。\n“惕”、“恤”皆忧惧也。刚居柔地，内而忧惧之象也。又变离错坎为加忧，亦忧惧之象也。号，呼众人也。乾为言，外而呼号之象也。二为地位，离日在地下，“莫夜”之象也。又离为戈兵，坎为盗，又为夜，又本卦大象震，莫夜、盗贼、戈兵、震动，“莫夜有戎”之象也。本卦五阳一连重刚，“有戎”象，所以卦爻、爻辞皆言戎，非真“有戎”也。决小人之时，喻言小人不测之祸也。狄仁杰拳拳以复卢陵王为忧者，“惕”也。密结五王者，“号”也。卒能反周为唐，是亦“有戎勿恤”矣。\n九二当夬之时，以刚居柔，又得中道，故能忧惕号呼，以自戒备，思虑周而党与众，是以莫夜有戎，变出于不测，亦可以无患矣。故教占者以此。\n《象》曰：“有戎”“勿恤”，得中道也。\n“得中道”者，居二之中也。得中则不恃其刚，而能惕号，不忘备戒，所以“有戎勿恤”。\n九三：壮于，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。\n“”音“逵”，面颧也。乾为首，之象也。“夬夬”者，以心言也，言去小人之心决而又决也。“独行”者，阳性上行，五阳独此爻与上六为正应，“独行”之象也。上六阴爻，又兑为雨泽，雨之象也。“濡”者，湿濡也。言九三合上六之小人，而若为污也。“愠”者，见恨于同类之君子，而嗔其与小人合也。前儒不知此爻乃圣人为占者设戒，又不知“夬夬”乃君子之心，故以爻辞为差错。王允之于董卓，温峤之于王敦，此爻近之。\n九三当夬之时，以刚居刚，又与上六为正应，圣人恐其不能决而和也，故为占者设其戒曰：决去小人，若壮见于面目，则事未成而几先露，反噬之凶不免矣。惟其决小人之心夬而又夬，而面目则不夬夬，而与之相合，如“独行遇雨”，有所湿濡，虽迹有可疑，不免为君子所愠，然从容以观其变，委曲以成其谋，终必能决小人也。占者能如是，可以免凶而无咎矣。\n《象》曰：“君子夬夬”，终无咎也。\n君子只要有夬夬之心，虽面目与之相合，是决而和也，故终无咎。但论其终，不咎其始也，始不必咎，此圣人之权也。\n心夬夬而面目相合，是决而和矣，所以“终无咎”。\n九四：臀无肤，其行次且。牵羊悔亡，闻言不信。\n臀，徒敦反。次，七私反。且，七余反。\n人身出腹中之物，皆在于臀。臀字从殿，殿者后也。凡《易》中言“臀”者，皆坎也。坎为“沟渎”，“臀”之象也。故姤九三变坎曰“臀”，困下卦坎初六曰“臀”。此爻变坎亦曰“臀”。乾一兑二为“肤”，详见噬嗑。此爻变坎则不成一二矣，故“无肤”也。兑为毁折，亦“无肤”之象也。“次且”即“趑趄”二字，行不进也。惟其“臀无肤”，所以行不进也。兑为羊，羊之象也。“牵羊”者，牵连三阳而同进也。兑综巽为绳，牵连之象也。观大壮六五，乾阳在下曰“丧羊”，则此牵羊可知其牵三阳矣。乾为言，下三阳之言也，乃前“告自邑”之言也。变坎为耳痛，“闻言不信”之象也，所以困卦亦有“有言不信”之句。盖变坎则情险，性健乃傲物也，故“闻言不信”。\n九四以阳居阴，不中不正，有臀无肤，行不进，而不决小人之象。然当决之时，不容不决也，故教占者能牵连下三阳以同进。用人成事，则可以亡其不进之悔。但不中不正之人，不乐闻君子之言，度其虽言之亦不信也。占者如是，其有悔也必矣。\n《象》曰：“其行次且”，位不当也。“闻言不信”，聪不明也。\n“位不当”者，不中正也。“聪”者，听也，听之不能明其理也。此原不信之由。“位不当”以位言，“听不明”以变坎言。\n九五：苋陆夬夬，中行无咎。\n“苋”者，苋菜也。诸菜秋冬皆可种，独苋三月种之。夬三月之卦，故取象于“苋”，亦如瓜五月生，故姤取瓜象。“陆”者，地也，地之高平曰“陆”。苋乃柔物，上六之象也。“陆”地所以生苋者。六乃阴土，陆之象也。“苋陆夬夬”者，即俗言斩草除根之意。言欲决去其苋，并其所种之地亦决之。上“夬”者，夬苋也；下“夬”者，夬陆也。亦如“王臣蹇蹇”，上“蹇”，王之蹇也；下“蹇”，臣之蹇也。决而又决，则根本枝叶皆以决去，无复潜滋暗长矣。“中行”者，五本居中得正，为近上六，阴阳相比，则心事不光明，能“夬夬”则复其中行之旧矣。九三“夬夬”以心言，以应爻而言也；九五以事言，以亲比而言也。盖三居下位，五则擅夬决生杀之权，故与三不同。\n九五当夬之时，为夬之主，本居中得正，可以决小人者也，但与六相近，不免溺于其私，外虽欲决，而一时溺爱之心复萌，则决之不勇矣。故必如决苋，并其地而决之，则可以去其邪心，不为中德之累而无咎矣。故其象占如此。\n《象》曰：“中行无咎”，中未光也。\n“中未光”者，恐中德近阴未光明也，故当夬而又夬。\n上六：无号，终有凶。\n上六当权之时，号呼其正应之三，今三正应，夬夬则正应不可号矣。当权之时，“扬于王庭”，亦可以号呼而哀求于五。今五相亲比，亦“夬夬”，则五不可号矣，故曰“无号”。“终有凶”，即《小象》“终不可长”。占者之凶可知矣。\n《象》曰：“无号”之凶，终不可长也。\n言一阴在上，不可长久，终为五阳所决去也。","44":"姤遇也柔遇刚也\n“姤”，遇也，五月之卦也。一阴生于下，阴与阳遇，以其本非所望而卒然值之，如不期而遇者，故为“姤”也。《序卦》：“夬，决也。决必有所遇，故受之以姤。”所以次夬。\n姤：女壮，勿用取女。\n取，七虑反。\n一阴而遇五阳，有“女壮”之象，故戒占者“勿用取女”。以其女德不贞，决不能长久从一而终也。幽王之得褒姒，高宗之立武昭仪，养鹙弃鹤，皆出于一时一念之差，而岂知后有莫大之祸哉！故一阴生于五阳之下，阴至微矣，而圣人即曰“女壮勿用取”者，防其渐也。\n《彖》曰：姤，遇也，柔遇刚也。“勿用取女”，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！\n释卦名、卦辞而极赞之。娶妻非一朝一夕之事，故曰“夫妇之道不可以不久也”。“不可与长”者，言女壮则女德不贞，不能从一而长久也。上五阳，“天”也；下一阴，“地”也。“品物咸亨”者，万物相见乎离，亨嘉之会也。“天地相遇”，止可言资始、资生。而曰“咸章”者，品物在五月皆章美也。“刚”指九二。“刚遇中正”者，九二之阳德，遇乎九五之中正也。遇乎中正，则明良会而庶事康，其道可“大行”于天下矣。姤本不善，圣人义理无穷，故又以其中之善者言之。言一阴而遇五阳，“勿用取女”，固不善矣，然天之遇地，君之遇臣，又有极善者存乎其中焉。以一遇之间而有善有不善，可见世之或治或乱，事之或成或败，人之或穷或通，凡天下国家之事，皆不可以智力求之，惟其遇而已矣。时当相遇，莫之为而为，莫之致而至，遇之时义不其大矣哉！\n《象》曰：天下有风，姤。后以施命诰四方。\n风行天下，物无不遇，姤之象也。“施命”者，施命令于天下也。兴利除害，皆其命令之事也。“诰”者，告也，晓谕警戒之意。君门深于九重，堂陛远于万里，岂能与民相遇？惟“施命诰四方”，则与民相遇，亦犹天之风与物相遇也。乾为君，“后”之象；又为言，“诰”之象；又错坤，“方”之象。巽乃命之象。\n初六：系于金柅，贞吉。有攸往，见凶。羸豕孚蹢躅。\n柅，女履反。蹢，音的。躅，直录反。\n柅者，收丝之具也。“金”者，籰上之孔用金也，今人多以铜钱为之。巽为木，“柅”之象也。又为绳，“系”之象也。变乾，“金”之象也。“贞吉”者，言“系于金柅”，前无所往，则得其正而吉也。若无所系，有所攸往，往而相遇，相比之二，正应之四，则立见其凶也。“羸豕”者，小豕也。“孚”者，诚也。“蹢躅”者，跳踯缠绵也。言小豕相遇乎豕，即孚契缠绵，跳踯不宁，此立见其凶，可丑之象也。凡阴爻居下卦者，不可皆以为小人害君子。如姤，有相遇之义。观，有观示之义。此卦因以为小人害君子，所以将九五极好之爻通说坏了。\n初六一阴始生，当遇之时，阴不当往遇乎阳，故教占者有“系于金柅”之象。能如此，则正而吉矣。若有所往，立见其凶，故又有羸豕蹢躅之象。其戒深矣。\n《象》曰：“系于金柅”，柔道牵也。\n“牵”者，牵连也。阴柔牵乎阳者也，所以戒其往。\n九二：包有鱼，无咎，不利宾。\n“包”者，包裹也，详见蒙卦九二。鱼阴物，文美，初之象也。剥变巽曰“贯鱼”，井曰“射鲋”，姤曰“包鱼”，皆以巽为少女，取象于阴物之美也。言二包裹缠绵乎初，犹“包鱼”也。“无咎”者，本卦主于相遇，故“无咎”也。“不利宾”者，理不当奉及于宾也。盖五月包裹之鱼必馁而臭矣，所以不利于宾也。巽为臭，鱼臭不及宾之象也。五阳缠绵一阴，故于四爻五爻皆取包裹之象。“无咎”以卦名取义，“不及宾”以鱼取义。若以正意论，初与四为正应，二既先包乎初，则二为主，而四为宾矣，所以“不利宾”，而四“包无鱼”。但《易》以象为主，故只就鱼上说。\n九二与初，本非正应，彼此皆欲相遇，乃不正之遇也，故有五月包鱼之象。占者得此，仅得无咎，然不正之遇，已不可达及于宾矣，故“不利宾”。\n《象》曰：“包有鱼”，义不及宾也。\n一阴无二阳之理，况五阳乎？二即包之，其不济宾宜也。\n五月包鱼，岂可及宾？以义揆之，不可及宾也。\n九三：臀无肤，其行次且，厉，无大咎。\n初为二所包，回视后背，已无物矣。\n夬之九四与姤相综，倒转即姤之九三，所以爻辞同。\n九三当遇之时，过刚不中，隔二未牵连乎初，相遇之难，故有此象。然不相遇，则亦无咎矣。故占者虽危厉，而“无大咎”也。\n《象》曰：“其行次且”，行未牵也。\n行虽未牵，而且次之心尚存，未免有咎。特无大咎耳。本卦主于相遇，三其行未得与初牵连，所以“次且”。\n九四：包无鱼，起凶。\n初六不中不正，卦辞以“女壮勿取”戒之矣。若屯卦六二与初相比，不从乎初，“十年乃字”，盖六二柔顺中正故也。今不中正，所以舍正应而从二。既从乎二，则民心已离矣。九四才虽刚而位则柔，据正应之理，起而与二相争，亦犹三国之争荆州，干戈无宁日也，岂不凶？故不曰“凶”，而曰“起凶”，如言起衅也。\n九四不中不正，当遇之时，与初为正应。初为二所包，故有“包无鱼”之象。九四不平与二争之，岂不起其凶哉？故其象占如此。\n《象》曰：“无鱼”之凶，远民也。\n阴为民，民之象也，故观卦下阴爻曰“观民”。“远民”者，二近民而四远民也。\n九五：以杞包瓜，含章，有陨自天。\n“杞”，枸杞也。杞与瓜皆五月所有之物。乾为果，“瓜”之象也。因前爻有包鱼之包，故此爻亦以“包”言之。“含章”者，含藏其章美也。此爻变离，有文明章美之意，又居中，有包含之意，故曰“含章”。含即杞之包，章即瓜之美。“以杞包瓜”，即“含章”之象也。“陨”者，从高而下也。“有陨自天”者，言人君之命令自天而降下也。巽为命，乾为天，故命令自天而降。孔子“后以施命诰四方”一句，本自周公“有陨自天”来，故《小象》曰“志不违命”。且此爻变成鼎，又“正位凝命”之君。三个“命”字可证。\n九五当遇之时，有中正之德，深居九重，本不与民相遇，故有“以杞包瓜含藏章美”之象。然虽含藏中正之章美，不求与民相遇，及“施命诰四方”，如自天而降，亦犹天下之风无物不相遇也。其相遇之大为何如哉！占者有是德，方应是占也。有是占者，有是德也。\n五变为离，正中天之火也。\n《象》曰：九五“含章”，中正也。“有陨自天”，志不舍命也。\n舍，音捨。\n有中正之德，所以含其中正之章美不发露也。“志”者，心志也。“舍”，违也。“命”者，命令也。虽不发露章美，然心志不违，“施命诰四方”，所以“有陨自天”。\n上九：姤其角，吝，无咎。\n与“晋其角”同。当遇之时，高亢过刚，不遇于初，故有“姤其角”之象。吝之道也。然不近阴私，“亦无咎”矣。故其占如此。\n《象》曰：“姤其角”，上穷吝也。\n居上卦之极，故“穷”。惟穷，所以吝。","45":"萃聚而升不来也\n“萃”者，聚也。水润泽其地，万物群聚而生，萃之象也。又上悦而下顺，九五刚中，而二以柔中应之，萃之由也。《序卦》：“姤者，遇也。物相遇而后聚，故受之以萃。”所以次姤。\n萃：亨。王假有庙，利见大人，亨，利贞。用大牲，吉，利有攸往。\n卦大象坎，坎为宫，中爻巽、艮，巽木在艮阙之上，皆“庙”之象也。坎为隐伏，鬼神之象也。九五中正，“大人”之象也。上“亨”字，占得此卦者亨也。下“亨”字，“见大人”之亨也。大象坎为豕，外卦兑为羊，内卦坤为牛，“大牲”之象也。言当此萃时，可以格鬼神，可以见大人，必亨，但利于正耳。凡物当丰厚不宜俭啬，凡事宜攸往不宜退止。此教占者处萃之时当如此。\n《彖》曰：萃，聚也。顺以说，刚中而应，故聚也。“王假有庙”，致孝享也。“利见大人，亨”，聚以正也。“用大牲，吉，利有攸往”，顺天命也。观其所聚，而天地万物之情可见矣。\n以卦德、卦体释卦名，又释卦辞而极赞之。内顺乎外，外悦乎内，五以刚中而下交，二以柔中而上应，内外君臣皆相聚会，所以名“萃”。尽志以致其孝，尽物以致其享。“聚以正”者，如萧何张良诸臣一时聚会，以从高祖，聚也；除暴秦，正也；能成一统之功，亨也。“天命”者，天理之自然也。以人事言，即当其可之时也。言时当丰而丰、时当往而往者，乃所以顺其天理之自然也。“情”者，所以发出之情也。阳倡阴和，乾始坤生，天地此聚也；形交气感，声应气求，万物亦此聚也。“天地万物之情”，聚而已矣。\n《象》曰：泽上于地，萃。君子以除戎器，戒不虞。\n“泽”字义多，有水泽，有雨泽，有恩泽，有润泽。泽在天上，有恩泽之意，所以“施禄及下，居德则忌”，此则有水泽润泽之意，所以生万物而萃也。“除”者，去旧取新之意，谓整理其敝坏也。“戒”者，备也。“虞”者，度也。言变出不测而不可虞度也。众萃必有争夺之事，故“君子除戎器”者，非耀武也，所以戒不虞也。圣人之心，义理无穷。姤卦文王卦辞本不善，圣人则发出“姤之时义大”一段；本卦文王卦辞极善，圣人又发出此一段。盖本卦错大畜，有离震二象，戈兵震动，故言“戎器不虞”。又大象坎错离，中爻艮综震，亦有此象。\n初六：有孚不终，乃乱乃萃。若号，一握为笑，勿恤，往无咎。\n“孚”者，与四正应，相孚信也。“有孚不终”者，阴柔之人不能固守，所以孚不长久也。欲萃之急，不择正应，而与同类群小相萃也。“号”者，呼也。“握”者，持也。言呼九四近前而以手握持之也。“若”者，如也，言当如此象也。言有孚之心，能若孚于前，而以手握之不释，则“有孚”之心至矣。虽为众人所笑，勿恤此笑，方得“无咎”也。中爻巽为进退，“有孚不终”之象也。坤为迷乱之象也。坤为众，“萃”之象也。兑为口舌，“号”之象也。坤错乾，乾居一，“一”之象也。中爻艮手，“握持”之象也。兑为悦，“笑”之象也。大象坎为加忧，“恤”之象也。今此爻变不成坎，不忧矣，“勿恤”之象也。\n初六阴柔，与九四为正应，当萃之时，比于同类之阴，有“有孚不终，乃乱乃萃”之象。故教占者有孚坚固，如将九四呼于前而以手握之，以阴握阳虽不免为人所笑，然必“勿恤”此笑，方得往而与九四为聚也，故“无咎”。\n《象》曰：“乃乱乃萃”，其志乱也。\n知此三阴为乱，萃所以必有孚于王庭而后可。\n质本阴柔，急于欲萃，方寸已乱矣，所以不暇择其正应而萃也。\n六二：引吉，无咎。孚乃利用禴。\n“引”，开弓也，与“君子引而不发”之引同。本卦大象坎，又此爻变坎，坎为弓，引之象也。凡人开弓射物必专心于物，当物之中，不偏于左，不偏于右，方得中箭，盖中德不变之象也。二虽中正，居群小之中，少偏私则非中矣，故言“引”，则“吉无咎”也。中爻艮手，故初曰“一握”。握者，手持之也。二曰“引”，引者，手开之也。皆手之象也。“吉”者，得萃于九五也。“无咎”者，二与九五皆同德，又正应也。“孚”者，孚于五也。“利用禴”者，言薄祭亦可以交神，又与五相聚，“吉”而“无咎”之象也。坎为隐伏，有人鬼之象。此爻变坎成困，故困之二爻，亦“利享祀”，未济坎亦言“禴”，涣亦言“有庙”也。此爻变中爻成离。“禴”，夏祭，故与既济皆言“禴”。\n六二中正，上应九五之中正，盖同德相应者也。二中德不变，故有引之之象。占者得此，不惟吉，而且“无咎”矣。然能引，则能孚信于五，而与五相聚矣，故有“利用禴”之象。其占中之象又如此。\n《象》曰：“引吉，无咎”，中未变也。\n二本有中德，惟能如引诚信而中，则中德未变矣，所以吉而无咎。\n六三：萃如，嗟如，无攸利。往无咎，小吝。\n此爻变艮成咸，咸三爻亦往吝。但咸以君子而随小人，可羞之事，此则以小人而聚小人，所以仅小吝也。大象坎为加忧，兑为口，嗟叹之象也。\n六三阴柔，不中不正，当萃之时，欲萃者其本志也，故有“萃如”之象。但上无应与，不得相聚，故有“嗟如，无攸利”之象。然三之于上，虽彼此阴爻无相偶之情，能往而从之，我性顺而彼性悦，必能相聚，可以无咎。但不能萃刚明之人，而萃阴柔群小，亦有“小吝”矣。故其占如此。\n《象》曰：“往无咎”，上巽也。\n“巽”者，三之中爻本巽也，兑综巽，亦巽也。上往以巽而从之，我顺而彼悦，可以相聚者也，故“无咎”。\n九四：大吉，无咎。\n“大吉无咎”，与随卦九四“随有获”同，就时位上说，不就理上说，正所谓不以其道得之富贵者也。近悦体之君，临归顺之民，岂不大吉，人谁咎病？六爻初“乱萃”，二“引萃”，三“嗟如”，五“有悔”，六“涕洟”，惟四不中不正，而自然相聚，聚之不劳心力，故“大吉”。时位自然，非四勉强求之，故“无咎”。\n九四不中不正，居“多惧”之地，本不吉，有咎者也。然近九五之君，有相聚之权，率三阴顺而聚于五，上悦下顺，则不劳心力，而自能相聚矣。若不论其九四之德，惟以其萃论之，盖“大吉无咎”者也。故有此象。占者得此，亦当如是也。\n《象》曰：“大吉，无咎”，位不当也。\n“位不当”者，不中不正也。既不中正，则“大吉”者亦不吉，“无咎”者亦有咎矣。周公就时位能萃之象上说，孔子就理上说。\n九五：萃有位，无咎，匪孚，元永贞，悔亡。\n“匪”者，不也。“匪孚”者，不信于人也。九四比群阴在下以分其萃，“大吉无咎”，所以“匪孚”也。“元”者，元善也，即阳刚中正之德也。“永贞”者，长永贞固也。“悔”者，五与上六相近，同居悦体，阴阳比昵，恐其虽萃天下之位，而其德未甚光明，所以悔也。\n九五当天下之尊，为萃之主，臣民皆萃，可以“无咎”矣。然四分其萃，未免“匪孚”；上溺阴私，未免“有悔”。故必反己自修，俾元善中正之德长永贞固，斯悔亡而人孚矣。戒占者必如此。\n汉高戚夫人，唐太宗巢刺王妃。\n《象》曰：“萃有位”，志未光也。\n此爻与夬“中未光”相同。盖阴阳相悦，此“未光”也；又变震，为情动性顺，此“未光”也；变震成豫，又“和乐”矣，此“未光”也。阳与阴相聚会之时，又悦、又动、又顺、又和乐，安能保其志之光明哉？故曰“志未光”。若依本爻，阳刚中正，有何疚病？\n上六：赍咨涕洟，无咎。\n“赍”者，持也，遗也，有所持而遗之之义。中爻艮为手，持遗之象也。“咨”者，咨嗟也。自鼻出曰“涕”，自目出曰“洟”。兑为口，咨之象也；又为泽，“涕洟”之象也。\n上六处萃之终，求萃而不可得，惟持遗咨嗟，涕洟哀求于五而已，故有此象。然忧思之过，危者必平，所以“无咎”。六爻皆“无咎”者，水润泽其地，万物群聚而生，乃天地为物不贰，生物不测之理也，所以六爻皆“无咎”。\n长信宫怨。\n《象》曰：“赍咨涕洟”，未安上也。\n未安于上，所以哀求其五。","46":"升\n“升”者，进而上也。为卦巽下坤上，木生地中，长而益高，升之象也。又综萃，萃下卦之坤上升而为升之上卦，亦升之象也。《序卦》：“萃者，聚也。聚而上者谓之升，故受之以升。”所以次萃。\n升：元亨。用见大人，勿恤。南征吉。\n言占得此卦者，大亨。“用见大人”，不可忧惧，从南方行则吉，所以“元亨”也。不曰“利见”而曰“用见”者，九二虽大人，乃臣位，六五之君欲用九二，则见之也。六四“王用亨于岐山”即此“用”字也。“勿恤”者，本卦大象坎，有忧恤之象，故教之以“勿恤”。“南征吉”者，文王圆图，巽东南之卦，过离而至坤，是巽升于坤，故“南征吉”。若东行则至震，非升矣。\n《彖》曰：柔以时升。巽而顺，刚中而应，是以大亨。“用见大人，勿恤”，有庆也。“南征吉”，志行也。\n以卦综释卦名，以卦德、卦体释卦辞。柔者，坤土也。本卦综萃，二卦同体，文王综为一卦，故《杂卦》曰：“萃聚而升不来也。”柔以时升者，萃下卦之坤，升而为升之上卦也。柔本不能升，故以时升，所以名升。内巽外顺，则心不躁妄，行不悖理。又我有刚中之德，而六五以顺应之，岂不能升？所以“元亨”。“有庆”者，庆幸其道之得行。“勿恤”者，此也。“志行”者，心期其道之必行，吉者此也。“有庆志行”者，即元亨也。\n《象》曰：地中生木，升。君子以顺德，积小以高大。\n本卦以坤土生木而得名，故曰“君子以顺德”。坤顺之德，即“敬以直内，义以方外”也。“积”者，日积月累，如地中生木，不觉其高大也。巽为高，高之象也。\n初六：允升，大吉。\n“允”者，信也。本卦原是坤土上升，初与四皆坤土，故“允升”。\n初六柔顺居初，当升之时，与四相信而合志。占者如是，必能升矣，故“大吉”。\n《象》曰：“允升，大吉”，上合志也。\n与四合志，故“允升”。大畜九三与上九皆阳爻，然本卦皆欲畜极而通，故《小象》曰“上合志也”。此卦初居内卦之初，四居外卦之下，因柔以时升，皆欲升者也，故《小象》亦曰“上合志也”。\n九二：孚乃利用禴，无咎。\n九二以阳刚居中，六五以柔顺应之，盖孚信之至者矣，故有利用薄祭亦可交神之象。占者如是，亦得遂其升，而有喜矣，故“无咎”。升综萃，萃六二引者阴柔也，此刚中，故止言“孚乃利用禴”。\n《象》曰：九二之“孚”，有喜也。\n“有喜”者，喜其得升也。盖诚信之至，则君必信任之专，得以升矣。周公许之曰“无咎”，孔子曰“君臣相孚，岂止无咎，且有喜也”。中爻兑，喜悦之象也。\n九三：升虚邑。\n阳实阴虚，上体坤，有“国邑”之象，详见谦卦。以二升四，以实升虚，故曰“升虚邑”。或曰：四邑为丘，四丘为虚，非空虚也，乃丘虚也。亦通。\n九三以阳刚之才，当升之时，而进临于坤，故有“升虚邑”之象。占者得此，其升而无疑也可知矣。\n《象》曰：“升虚邑”，无所疑也。\n本卦六五之君阴柔，九二之臣阳刚，似君弱臣强，正人之所疑也。况当升之时，自臣位渐升于君位，使四乃阳刚，则逼其五矣，安得而不疑？今升虚邑，阴土与五同体，故“无所疑”。\n六四：王用亨于岐山，吉，无咎。\n亨，如字。\n坤错乾，乾为君，“王”之象也。“王”指六五也。物两为岐，故曰岐山。坤土两拆，岐之象也。随卦兑为西，故曰“西山”；此两拆，故曰“岐山”。中爻震综艮，山之象也，则三、四、五皆山矣。皆因有此象，故以“岐”、“西”二字别之。前儒不知象，乃曰“岐山在西”，失象之旨矣。此言“岐山”，指四也。“亨”者，通也，与“公用亨于天子”、“王用亨于西山”亨字同。“王用亨于岐山”者，即“用见大人”也。言六五欲用乎九二，乃通于四而求之也。四爻皆言升，独二与五为正应，故曰“用禴”。四与五相比，故曰“用亨”，盖君位不可升也，二用禴而五用亨，上下相用，正所谓刚中而应也，何吉如之！故吉而无咎。\n六四以柔居柔，与五同体，盖顺事乎五之至者也，故六五欲用乎九二，乃通乎四以求之，故有“王用亨于岐山”之象，吉而无咎之道也。故其象占如此。\n《象》曰：“王用亨于岐山”，顺事也。\n四本顺体，又以柔居柔得正，顺事乎五，故五欲用乎九二，乃通乎四以求之也。四若非正，则成容悦之小人，安能通乎其二？\n六五：贞吉，升阶。\n“王用亨于岐山”，上孚乎下，贤君之事也；九二即觐君而升阶，下孚于上，良臣之事也。故先言贞吉之占，而后言升阶之象。“阶”者，阶梯也，如梯之等差也。\n六五以柔成尊，下任刚中之贤，乃通于四以求之，贞而且吉者也。九二当升之时，因六五用六四之求，即觐君而升阶矣。上下相孚，故其象占如此。\n《象》曰：“贞吉，升阶”，大得志也。\n“大得志”，即彖辞“有庆志行也”。\n上六：冥升，利于不息之贞。\n“冥”与“冥豫”之冥同，昏于升而不知止者也。坤为迷，“冥”之象也。“不息之贞”，天理也。惟天理可以常升而不已，若富贵利达，涉于人欲之私，而非天理者，则有消长矣。冥豫动体，故教之以豫。今冥升顺体，故教之以贞。\n上六居升之极，乃昏于升而不知止者也，有“冥升”之象。故圣人教占者曰：升而不已，惟利不息之贞，他非所利也。为占者开迁善之门如此。\n《象》曰：“冥升”在上，消不富也。\n“消”者，消其所升之业也。“富”者，富有也。凡升者乃天理不息之贞，则成富有之业矣。若升其人欲之私，往而不返，溺而不止，则盈者必虚，泰者必否，见其日消而不见其长，消而不富矣，故曰“消不富”也。本卦下体巽，巽为富，此爻外卦，故曰“不富”。亦如无妄二爻，未入巽之位，曰“未富”。","47":"困\n“困”者，穷困也。为卦水居泽中，枯涸无水，困之义也。又六爻皆为阴所掩，小人之掩君子，穷困之象也。《序卦》：“升而不已必困，故受之以困。”所以次升。\n困：亨，贞，大人吉，无咎。有言不信。\n此卦辞乃圣人教人处困之道也。言当困之时，占者处此必能自亨其道，则得其正矣。他卦“亨贞”，言不贞则不亨，是亨由于贞也。此卦“亨贞”，言处困能亨，则得其贞，是贞由于亨也。然岂小人所能哉！必平素有学有守之大人，操持已定，而所遇不足以戕之，方得“吉而无咎”也。若不能实践躬行，自亨其道，惟欲以言求免其困，人必不信而益困矣。言处坎之险，不可尚兑之口也。二五刚中，大人之象。兑为口，有言之象。坎为耳痛，耳不能听，有言不信之象。\n东坡处困，尚多辨舌，文足欺人，岂是君子！\n《彖》曰：困，刚掩也。险以说，困而不失其所“亨”，其惟君子乎？“贞，大人吉”，以刚中也。“有言不信”，尚口乃穷也。\n说，音悦。\n以卦体释卦名，又以卦德、卦体释卦辞。坎刚为兑柔所掩，九二为二阴所掩，四、五为上六所掩，此困之所由名也。兑之掩坎，上六之掩四、五者，小人在上位也。如绛灌之掩贾谊，公孙弘之掩董仲舒是也。二阴之掩九二者，前后左右皆小人也，如曹节、侯览辈之掩党锢诸贤，王安石、惠卿之掩元佑诸贤是也。“险以说”，卦德也。困而不失其所亨者，人事也。处险而能说，则是在困穷艰险之中，而能乐天知命矣。“所”者，指此心也，此道也。言身虽困，此心不愧不怍，心则亨也；时虽困，此道不加不损，道则亨也。不于其身于其心，不于其时于其道，如羑里演《易》，陈蔡弦歌，颜子在陋巷不改其乐是也。“君子”，即大人也。“贞大人吉”者，“贞”字在文王卦辞，连“亨”字读。彖辞连“大人”者，孔子恐人认“贞”字为戒辞也。“刚中”者，二五也。刚中则知明守固，居易俟命，所以“贞大人吉”也。“贞大人”者，贞正大人也。“尚口乃穷”者，言不得志之人，虽言亦不信也。盖以口为尚，则必不能求其心之无愧，居易以俟命矣，是不能亨而贞者也。故圣人设教戒，以尚口则自取困穷矣。“尚口”，如三上相书，凡受人之谤，不反己自修，而与人辩谤之类。\n《象》曰：泽无水，困。君子以致命遂志。\n泽所以潴水。泽无水，是水下漏而上枯矣，“困”之象也。“致”者，造诣也。命存乎天，志存乎我。“致命遂志”者，不有其命，逆命于天，惟遂我之志，成就一个是也。患难之来，论是非不论利害，论轻重不论死生。杀身成仁，舍生取义，幸而此身存，则名固在；不幸而此身死，则名亦不朽，岂不身困而志亨乎？身存者，张良之椎、苏武之节是也；身死者，比干、文天祥、陆秀夫、张世杰是也。\n初六：臀困于株木，入于幽谷，三岁不觌。\n凡言“困”者，皆柔掩刚，小人困君子也。“臀”，坎象，详见夬卦。人之体，行则趾在下，坐则臀在下，故初言“臀”。“株”者，根株也，乃木根也。《诗》“朝食于株”，诸葛亮表“成都有桑八百株”，王荆公诗“日月无根株”，皆言根也。中爻巽木在坎之上，初又居坎之下，木根之象也。坎为隐伏，“幽谷”之象也。水在上，幽谷在下，则谷之中皆木根矣。言“入于幽谷”之中，而臀坐于木根之上也，此倒言也。因有“臀”字，文势必将“困于株木”之句居于臀下，故倒言也。若曰“臀入于幽谷”，则不通矣。“觌”，见也。坎错离，离卦又居三，“三岁不觌”之象也。“不觌”者，不觌二与四也。\n初六以阴柔之才居坎陷之下，当困之时，远而与四为应，近而与二为比，亦欲掩刚而困君子矣。然才柔居下，故有坐木根入幽谷终不得见二、四之象。欲困君子，而反自困，即象而占可知矣。\n《象》曰：“入于幽谷”，幽不明也。\n此言不觌之故。幽对明言。二与四合成离，有明象。初居离明之下，则在离明之外而幽矣。所以二与四得见乎幽谷。而入幽不明者，不得见乎二、四也。\n九二：困于酒食，朱绂方来，利用亨祀。征凶，无咎。\n绂，音弗。\n“困于酒食”者，言酒食之艰难穷困也。如孔子之“疏食饮水”，颜子之“箪食瓢饮”，《儒行》之“并日而食”是也。酒食且困，大于酒食者可知矣。《程传》是。凡《易》言“酒”者，皆坎也，言“食”者，皆兑也。故需中爻兑言酒食，未济与坎皆言酒也。“朱绂”者，组绶用朱也。“方来”者，其德升闻而为君举用之也。“利用亨祀”者，亨者通也，诚应之意，乃象也，亦如“利用禴”之意。言当通之以祭祀之至诚也。坎隐伏，有人鬼象，故言“祀”。“征凶”者，当困之时，往必凶也。“凶”字即《大象》“致命”之意，正所谓困而亨也，所以“无咎”。中爻离，朱之象。又巽绳，绂之象。坎乃北方之卦，朱乃南方之物，离在二之前，故曰“方来”。此即孔明之事：“困酒食”者，卧南阳也；“朱绂方来”者，刘备三顾也；“利用亨祀”者，应刘备之聘也；“征凶”者，死而后已也；“无咎”者，君臣之义，无咎也。\n九二以刚中之德当困之时，甘贫以守中德，而为人君之所举用，故有“困于酒食朱绂方来”之象。故教占者至诚以应之，虽凶而无咎也。\n《象》曰：“困于酒食”，中有庆也。\n言有此刚中之德，则自亨其道矣，所以有此“朱绂方来”之福庆。\n六三：困于石，据于蒺藜，入于其宫，不见其妻，凶。\n兑错艮，艮为石，石之为物坚而不纳，其质无情，石在前，“困于石”之象也。“据”者，依也。坎为蒺藜。蒺藜乃有刺之物，不可依据。蒺藜在后，“据于蒺藜”之象也。坎为宫，宫之象也。中爻巽为入，“入其宫”之象也。此爻一变，中爻成乾，不成离目，“不见”之象也。坎为中男，兑为少女，则兑乃坎之妻也。兑之中宫、坎之中宫皆阳爻，非阴爻，“入其宫不见其妻”之象也。此爻一个“入”字、“见”字不轻下，周公之爻辞，极其精矣。旧注不知象，所以以石指四，蒺藜指二，宫指三，妻指六也。\n六三阴柔不中不正，当困之时，亦欲掩二之刚而困君子矣。但居坎陷之极，所承所乘者皆阳刚，孤阴在于其中，前困者无情，后据者有刺，则一己之室家且不能保，将丧亡矣，况能困君子乎？故有此象。所以占者凶。\n《象》曰：“据于蒺藜”，乘刚也。“入于其宫，不见其妻”，不祥也。\n“乘刚”者，乘二之刚也。“不祥”者，死期将至也。此爻变为大过，有棺椁象，所以死期将至。人岂有不见其妻之理？乃不祥之兆也。殷仲文从桓玄，照镜不见其面，数日祸至，此亦不祥之兆也。\n九四：来徐徐，困于金车，吝，有终。\n“金车”指九二。坎，车象，乾金当中，“金车”之象也。自下而上曰“往”，自上而下曰“来”。“来徐徐”者，四来于初也。初觌乎四，四来乎初，阴阳正应故也。\n九四与初为正应，不中不正，志在于初，故有“徐徐”而“来”于初之象。然为九二所隔，故又有“困于金车”之象。夫以阴困阳之时，不能自亨其道，犹志在于初，固为可羞。然阳有所与，终不能为阴所困也，故其占如此。\n《象》曰：“来徐徐”，志在下也。虽不当位，有与也。\n“志在下”者，志在初也。“有与”者，四阳初阴，有应与也。且四近君，故阴不能困。井卦二五皆阳爻，故曰“无与”。\n九五：劓刖，困于赤绂，乃徐有说，利用祭祀。\n说，音悦。\n兑错艮，鼻象。变震，足象。截鼻曰“劓”，去足曰“刖”。上体兑为毁折，错艮为阍寺刑人；下体中爻离为戈兵，又坎错离亦为戈兵。上下体俱有刑伤，劓刖之象也。若以六爻卦画论之，九五为困之主，三阳居中，上下俱阴坼，亦劓刖之象也。“赤绂”者，臣之绂也。中爻离巽与九二同。“绂”乃柔物，故亦以此象之。三柔困，赤绂之象也。“赤绂”者，四与二也。四乃五之近臣，三比之，二乃五之远臣，三掩之，故曰“困于赤绂”。“劓刖”者，君受其困也。“赤绂”者，臣受其困也。兑为悦，悦之象也。“乃徐有说”者，言迟久必有说，不终于困也。“利用祭祀”者，乃徐有悦之象也。盖祭尽其诚，则受其福矣。教九五中正之德，不可以声音笑貌为之也。\n九五当柔掩刚之时，上下俱刑伤，故有“劓刖”之象。三柔比四而掩二，故不惟“劓刖”，又有困及于赤绂之象，则君臣皆受其困矣。然九五中正而悦体，既有能为之才，又有善为之术，岂终于其困哉？必“徐有悦”而不终于困也。盖能守此中正之德，如祭祀之诚信，斯有悦而受其福矣。故教占者占中之象又如此。\n《象》曰：“劓刖”，志未得也。“乃徐有说”，以中直也。“利用祭祀”，受福也。\n为阴所掩，故志未得。“以中直”与同人九五同。直即正也。“受福”者，中正之德，如祭祀之诚信，则受福而不受其困矣。\n上六：困于葛藟，于臲，曰动悔，有悔，征吉。\n艮为山，为径路，为果蓏。《周礼》：“蔓生曰蓏，葛藟之类。”高山蹊径，臲不安，兑错艮有此象。又正应坎为陷，为丛棘，为蒺藜，亦皆“葛藟”之类之象。盖“葛藟”者，缠束之物。“臲”者，危动之状。“曰”者，自讼之辞也。兑为口，变乾为言，“曰”之象也。“曰动悔”者，自讼其动则有悔，亦将为之何哉？动悔之悔，事之悔也，上六之悔也。有悔之悔，心之悔悟也，圣人教占者之悔也。征者去而不困其君子也。与蒙卦“几不如舍”舍字同。\n上六阴柔，亦欲掩刚，而困君子矣。然处困之极，反不能困。故欲动而掩乎刚，则缠束而不能行；欲静而不掩乎刚，则又居人君之上。危惧而不自安，是以自讼。其动则有悔，故有此象。然处此之时，顾在人之悔悟何如耳。诚能发其悔悟之心，去其险邪之疾，知刚之不可掩，弃而去之可也。故占者惟征则吉。\n《象》曰：“困于葛藟”，未当也。“动悔，有悔”，吉行也。\n欲掩刚，故“未当”。有悔不掩刚，故从“吉”而“行”。","48":"井通而困相遇\n“井”者，地中之象也。为卦坎上巽下。巽者入也，水入于下而取于上，井之义也。坎为水，汲水者以木承水而上，亦井之义也。《序卦》：“困于上者必反于下，故受之以井。”所以次困。\n井卦有爻高似一爻之义。\n井：改邑不改井，无丧无得，往来井井。汔至，亦未井，羸其瓶，凶。\n，音聿。\n井综困，二卦同体，文王综为一卦，故《杂卦》曰：“井通而困相遇也。”“改邑不改井”者，巽为市邑。在困卦为兑，在井为巽，则改为邑矣。若井则“无丧无得”。在井卦，坎往于上；在困卦，坎来于下。刚居于中，往来不改，故曰“往来井井”。《易经》玄妙处，正在于此。“汔”，涸也。巽下有阴，坼涸之象也。“”者，井索也。巽为绳，之象也。“羸”者，弱也，与大壮“羸其角”同。汲水之人弱不胜其瓶，将瓶坠落于井也。中爻离，瓶之象也。在离曰“缶”，在井曰“瓶”、曰“瓮”，皆取中空之意。\n言井乃泉脉不可改变。其德本无得丧，而往来用之者不穷，济人利物之功大矣。若或井中原涸无水，以至或有水，而人不汲，又或不惟不得水，或汲之而羸其瓶，则无以成济人利物之功，故占者凶。\n《彖》曰：巽乎水而上水，井。井养而不穷也。“改邑不改井”，乃以刚中也。“汔至，亦未井”，未有功也。“羸其瓶”，是以凶也。\n以卦德、卦综释卦名、卦辞。凡井中汲水，井上用一辘轳，以井索加于其上，用桶下汲，方能取上，是以桶入乎其水方能上也，故曰“巽乎木而上水”。“巽”字，有“木”字“入”字二意。《文选》“殚极之绠断干”，绠即辘轳之索也。“养而不穷”者，民非水火不生活也。“改邑不改井”者，以刚居中，在困卦居二之中，在井卦居五之中，往来皆井，不可改变也。“未有功”者，井以得水为功，井中水涸，以至汲水之索未入于井，皆无功也。若“羸其瓶”，是不惟不得其水，并汲水之具亦丧亡矣，岂不凶！青苗之法，安石之意将以济人利物，而不知不宜于民，反以致祸，正“羸其瓶”之凶也。\n《象》曰：木上有水，井。君子以劳民劝相。\n“木上有水”者，水承木而上也。“劳”者，即劳之也。“劝”者，即来之也。“相”者，即匡直辅翼也。“劳民劝相”者，言劳之不已，从而劝之，劝之不已，又从而相之也。人有五性之德，即地脉井泉流行不息者也。逸居而无教，则近于禽兽，不能成“井养不穷”之功矣。君子劳民劝相，则民德可新，父子有亲，君臣有义，夫妇有别，长幼有序，朋友有信，“往来”用之，“井井”不穷矣。是“劳民劝相”者，君子之井也。\n初六：井泥不食，旧井无禽。\n阴浊在下，“泥”之象也。凡言食者，皆兑口也。今巽口在下，“不食”之象也。又巽为臭，不可食之象也。坎有小过象，凡《易》言“禽”者，皆坎也。故师六五曰“田有禽”，以本卦坎又变坎也；比卦九五“失前禽”，以坎变坤也。恒大象坎，此卦坎居上卦，但二卦下卦皆巽，巽深入，禽高飞之物，安得深入于井中？故恒、井二卦皆曰“无禽”。井以得水齐井之口易汲为善，故初则“不食”，二则“漏”，三则求“王明”，四则“修井”，惟五六则水齐井口，易于汲取，故五六独善。\n初六阴浊在下，乃井之深而不可浚渫者也。则泥而不食，成旧废之井，无井旁汲水之余沥，而禽亦莫之顾而饮矣。故有此象。占者不利于用可知矣。\n《象》曰：“井泥不食”，下也。“旧井无禽”，时舍也。\n舍，音捨。\n阴浊在下，为时所弃捨。无仁民爱物之功，阴亦有养德，而下无养功。\n九二：井谷射鲋，瓮敝漏。\n“射”，注射也，水及小鱼也。\n上阳爻，下阴爻两开，谷之象也。又变艮，山下有井，必因谷所生，亦“谷”之象也。坎为弓在上，“射”之象也。巽为鱼，“鲋”之象也。鲋，小鱼。《庄子》：“周视辙中有鲋鱼焉，曰：‘我东海之波臣也。’”又《尔雅》：“鳜，小鱼也。”注云：“似鲋子而黑，俗呼为鱼婢，江东呼为妾鱼。”曰臣、曰婢、曰妾，皆小之意。前儒以为“虾蟆”，又以为“蜗牛”，皆非也。巽综兑为毁折，“敝”之象也。下阴爻有坼“漏”之象也。坎水在上，巽主入，水入于下，亦漏之象也。\n九二阳刚居中，才德足以济利，但上无应与，不能汲引，而乃牵溺于初，与卑贱之人相与，则不能成井养不穷之功矣。故以井言，有旁水下注，仅射其鲋之象；以汲水言，有破瓮漏水之象。占者不能成功可知矣。\n《象》曰：“井谷射鲋”，无与也。\n无与者，无应与也，所以比初“射鲋”。此爻无比初之意。\n九三：井渫不食，为我心恻，可用汲，王明，并受其福。\n“渫”者，治井而清洁也。中爻三变，成震不成兑，口不食之象也。“为我心恻”者，“我”者，三自谓也，言可汲而不汲，人为我恻之也。坎为加忧，恻之象也。“王明”者，指五也。中爻三与五成离，“王明”之象也。“可用汲王明”者，可求用汲于王明也。“汲”字虽汲水，其实汲引之汲。“并”者，三之井可食，福也，食三之井者亦福也。九二比于初之阴爻，不能成功，故教九三求九五之阳明。\n九三以阳居阳，与上六为正应。上六阴柔不能汲引，则不为时用而成济人处物之功矣，故有“井渫不食”，人恻之象。所以然者，以正应阴柔，又无位故也。“可用汲”者，其惟舍正应而求五之“王明”，言若得阳明之君以汲引之，则能成井养之功，而并受其福矣。故教占者必如此。\n并受者，九三得王明而养人之福，九五得贤人代其养人，而并受养人之福。\n《象》曰：“井渫不食”，行恻也。求“王明”，受福也。\n“行恻”者，行道之人亦恻也。三变中爻成震足，行之象也。“求王明”者，五非正应，故以“求”字言之。孔子以周公爻辞忽然说起“王明”，恐人不知指五，所以加一“求”字也。不求正应而求王明，此《易》之所以时也。比卦六四舍正应而比五，皆此意。管仲舍子纠而事桓公，韩信舍项羽而事高祖，马援舍隗嚣而事光武，皆舍正应而求王明者也。\n六四：井甃，无咎。\n“甃”者，砌其井也。阴列两旁，“甃”之象也。初为“泥”，三之“渫”，渫其泥也；二“射鲋”，四之“甃”，甃其谷也。既渫且甃，井日新矣。寒泉之来，井养岂有穷乎？\n六四阴柔得正，近九五之君，盖修治其井以潴畜九五之寒泉者也，故有“井甃”之象。占者能修治臣下之职，则可以因君而成井养之功，斯无咎矣。\n《象》曰：“井甃，无咎”，修井也。\n修井畜泉，能尽职矣，安得有咎？\n九五：井洌，寒泉，食。\n“洌”，甘洁也。五变坤为甘，以阳居阳为洁。“寒泉”，泉之美者也。坎居北方，一阳生于水中，得水之正体，故甘洁而寒美也。“食”者，人食之也，即井养而不穷也。中爻兑口之上，食之象也。井以寒洌为贵，泉以得食为功。以人事论：“洌”者，天德之纯也；“食”者，王道之溥也。黄帝、尧、舜、禹、稷、周、孔立养立教，万世利赖，“井洌寒泉食”之者也。\n九五以阳刚之德居中正之位，则井养之德已具，而井养之功已行矣，故有此象。占者有是德方应是占也。\n《象》曰：“寒泉”之食，中正也。\n“寒泉之食”，王道也。“中正”者，天德也。\n上六：井收，勿幕，有孚，元吉。\n“收”者，成也。物成于秋，故曰秋收。“井收”者，井已成矣，即《小象》“大成”之成也。周公曰“收”，孔子曰“成”，一意也。“幕”者，盖井之具也。坎口在上，“勿幕”之象也，言不盖其井也。“有孚”者，信也。齐口之水，无丧无得，用之不竭，如人之诚信也。“元吉”者，“勿幕有孚”，则泽及于人矣。\n上六居井之极，井已成矣。九五寒泉为人所食，上六乃不掩其口，其水又孚信不竭，则泽及于人，成井养不穷之功矣，故有“勿幕有孚”之象，占者之“元吉”可知矣。\n《象》曰：“元吉”在上，大成也。\n“大成”者，井养之功大成也。盖有寒泉之可食，使掩其口，人不得而食之；或不孚信，有时而竭，则泽不及人，安得为大成？今“勿幕有孚”则泽及人，而井养之功成矣。“元吉”以泽之所及言，“大成”以功之所就言。养一家者，匹夫之事，养天下者，帝王之务。夫德以位而益溥，功以高而益著。初且无禽，二已射鲋，可见养之功有权也，安得不求王明乎？","49":"革去故也\n“革”者，变革也。泽在上，火在下，火燃则水涸，水决则火灭。又中少二女不相得，故其卦为变革也。《序卦》：“井道不可不革，故受之以革。”所以次井。\n革：己日乃孚，元亨，利贞，悔亡。\n己，音纪，十干之名。\n“己”者，信也。五性仁、义、礼、智、信，惟信属土，故以“己”言之。不言戊而言己者，离兑皆阴卦，故以阴土言。且文王圆图，离兑中间乃坤土，故言己也。凡离火烧兑金断裂者，惟土可接续，故《月令》于金火之间，置一中央土，十干丙丁戊己而后庚辛，言离火烧金，必有土方可孚契之意。“日”者，离为日也。“己日乃孚”者，信我后革也。言当人心信我之时相孚契矣，然后可革也，不轻于革之意。“元亨利贞悔亡”者，言除敝去害，扫而更之，大亨之道也。然必利于正。亨以正，则革之当其可而悔亡矣。盖不信而革，必生其悔，惟亨而正，则人心信我矣，所以“己日乃孚”而后革也。\n《彖》曰：革，水火相息，二女同居，其志不相得，曰革。“己日乃孚”，革而信之。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成。汤武革命，顺乎天而应乎人。革之时大矣哉！\n以卦象释卦名，以卦德释卦辞而极赞之。火燃则水干，水决则火灭，有相灭息之势。少女志在艮，中女志在坎，有“不相得”之情。水火以灭息为革，二女以不能同居，各出嫁为革，故曰“革”。“革而信之”者，言革而人相信也。东征西怨，南征北怨，革而信之之事也。离之德明，兑之德悦，明则识事理而所革不苟，悦则顺时势而所革不骤。“大亨”者，除敝兴利，一事之大亨也；伐暴救民，举世之大亨也。“以正”者，揆之天理而顺，即之人心而安也。又亨又正，则革之攸当，所以悔亡。正所谓革而信之也。阳极则阴生而革乎阳，阴极则阳生而革乎阴，故阴往阳来而为春夏，阳往阴来而为秋冬，四时成矣。“命”者，易姓受命也。王者之兴，受命于天，故曰“革命”。天命当诛，顺天也；人心共忿，应人也。天道改变，世道迁移，此革之大者。然要之同一时也。时不可革，天地圣人不能先时；时所当革，天地圣人不能后时。革之时不其大哉！故曰礼时为大，顺次之，体次之，宜次之，称次之。尧授舜，舜授禹，汤放桀，武王伐纣，时也。\n《象》曰：泽中有火，革。君子以治历明时。\n水中有火，水若盛则息火，火或盛则息水，此相革之象也。历者，经历也、次也、数也、行也、过也，盖日月五纬之躔次也，又作“厤”。“时”者，四时也。“治厤”以明其时。“昼夜”者，一日之革也。“晦朔”者，一月之革也。“分至”者，一年之革也。“元会运世”者，万古之革也。\n初九：巩用黄牛之革。\n离为牛，牛之象也。中爻乾错坤，黄之象也。巩者，固也，以皮束物也。束之以黄牛之革，则固之至矣。此爻变即遁之艮止矣。艮止故不革，所以爻辞同。本卦以离火革兑金，下三爻主革者也，故二三言革；上三爻受革者也，故四言改，五六言变。\n初九当革之时，以阳刚之才，可以革矣，然居初位卑，无可革之权，上无应与，无共革之人，其不可有为也必矣。但阳性上行，火性上炎，恐其不能固守其不革之志，故圣人教占者曰：革道匪轻，不可妄动，必固之以黄牛之革而后可。所以其象如此。\n《象》曰：“巩用黄牛”，不可以有为也。\n无位无应之故。桓玄篡位。\n六二：己日乃革之，征吉，无咎。\n离为日，日之象也。阴土，己之象也。此爻变夬，情悦性健，故易于革。\n六二以文明之才而柔顺中正，又上应九五之君，故人皆尊而信之，正所谓“己日乃孚，革而信之”者也，故有此象。占者以此象而往，则人皆乐于耳目之新，有更化善治之吉，而无轻变妄动之咎矣。故占者吉而无咎。\n《象》曰：“己日”“革之”，行有嘉也。\n应九五故“有嘉”，即“征吉”二字也。\n九三：征凶，贞厉。革言三就，有孚。\n“革言”者，革之议论也。正应兑为口，言之象也。中爻乾为言，亦言之象也。“就”者，成也。“三就”者，商度其革之利害可否，至再至三，而革之议论定也。离居三，三就之象也。故同人曰“三岁不兴”，未济曰“三年有赏于大国”，既济曰“三年克之”，明夷曰“三日不食”，皆以离居其三也。若坎之“三岁不得”，困之“三岁不觌”，解之“田获三品”，皆离之错也。渐之“三岁不孕”，巽之“田获三品”，皆以中爻合离也。丰之“三岁不觌”，以上六变而为离也。周公爻辞，其精至此。\n九三以刚居刚，又居离之极，盖革之躁动，而不能详审者也。占者以是而往，凶可知矣。故虽事在所当革，亦有危厉。然当革之时不容不革，故必详审其利害可否，至于“三就”，则人信而相孚，可以革矣。故教占者必如此。\n《象》曰：“革言三就”，又何之矣！\n言议革之言至于“三就”，则利害详悉可否分明，又复何之？\n九四：悔亡，有孚改命，吉。\n“改命”者，到此已革矣。离交于兑，改夏之命令于秋矣，所以不言革而言改命。如汤改夏之命而为商，武改商之命而为周是也。九四之位，则改命之大臣，如伊尹、太公是也。“有孚”者，上而孚于五，下而孚于民也。\n九四卦已过中，已改其命矣。改命所系匪轻，恐有所悔，然时当改命，不容不改者也，有何悔焉？是以“悔亡”。惟于未改之先，所改之志孚于上下则自获其吉矣。故教占者如此。\n《象》曰：“改命”之吉，信志也。\n“志”者，九四之志也。“信志”者，信九四所改之志也。上而信于君，下而信于民，必如是信我，方可改命也。信乃诚信，即爻辞“孚”字。\n九五：大人虎变，未占有孚。\n阳刚之才，中正之德，居尊位而为革之主，得称大人。兑错艮，艮为虎，虎之象也。兑为正西，乃仲秋，鸟兽毛毨，变之象也。乾之五则曰“龙”，革之五则曰“虎”。若以理论，揖逊者见其德，故称“龙”；征诛者见其威，故称“虎”。三四之“有孚”者，乃水火相交之际，教占者之有孚也；五之有孚，即汤武未革命之先，四海傒后之思，未占而知其有孚矣。\n九五以阳刚中正之才德，当兑金肃杀之秋，而为顺天应人之举。九四为改命之佐，已改其命矣，是以为大人者登九五之位，而宇宙为之一新，故有“大人虎变”之象。此则不待占决，而自孚信者也。占者有是德，方应是占矣。\n《象》曰：“大人虎变”，其文炳也。\n“文炳”以人事论，改正朔，易服色，殊徽号，变牺牲，制礼作乐，“炳”乎其有文章是也。\n上六：君子豹变，小人革面，征凶，居贞吉。\n扬子曰：“狸变则豹，豹变则虎。”故上六即以豹言之。革命之时，如鼓刀之叟，佐周受命，此“豹变”者也。又如萧何诸臣，或为吏胥，或贩缯屠狗，后皆开国承家，列爵分土，亦“豹变”者也。即班孟坚所谓“云起龙骧化为侯王”是矣。盖九五既“虎变”而为天子，则上六即“豹变”而为公侯，若下句“小人”则百姓矣。“革面”者，言旧日而从于君者亦革也。如民之从桀纣者，不过面从而心实不从也；故汤师征而傒后，牧野会而倒戈，则面从之伪皆革，而心真实以向汤武矣。盖以力服人者，面从者也。以德服人者，中心悦而诚服也，心从者也。“征凶”者，圣人作而万物睹，别有所往，则为梗化之民而凶矣。“居”者，征之反也。“君子豹变”者，变其旧日之冠裳也。“小人革面”者，革其旧日之诈伪也。\n上六当世道革成之后，而天命维新矣，公侯则开国承家，百姓则心悦诚服，有“君子豹变，小人革面”之象。故戒占者不守其改革之命，而别有所往，则凶，能守其改革之命，则正而吉也。\n《象》曰：“君子豹变”，其文蔚也。“小人革面”，顺以从君也。\n“其文蔚”者，冠裳一变，人物一新也。“顺以从君”者，兑为悦，悦则顺，即中心悦而诚服也。蔚本益母草，其花对节相开，亦如公侯相对而并列，故以蔚言之。豹次于虎，兽不同也。炳从虎，蔚从草，文之大小显著不同也。","50":"鼎取新也\n“鼎”者，烹饪之器。其卦巽下离上。下阴为足，二、三、四阳为腹，五阴为耳，上阳为铉，鼎之象也。又以巽木入离火而致烹饪，鼎之用也。《序卦》：“革物者莫若鼎，故受之以鼎。”所以次革。\n鼎：元吉，亨。\n彖辞明。观孔子彖辞“是以元亨”，则“吉”字当从《本义》作衍文。\n《彖》曰：鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。\n亨，含庚反。\n以卦体释卦名，又以卦德、卦综、卦体释卦辞。“象”者，六爻有鼎之象也。“巽”者，木也，以木入于火也。“亨”，煮也。“饪”，熟食也。亨饪有调和之义，故《论语》曰“失饪不食”。“象”者鼎之体，“亨饪”者鼎之用，所以名鼎。“圣人”者，君也。“圣贤”者，臣也。古人有圣德者皆可称圣，如《汤诰》称伊尹为“元圣”是也。“亨饪”之事，不过祭祀、宾客而已。祭祀之大者，无出于上帝；宾客之重者，无过于圣贤。享上帝贵质，故止曰“亨”；享圣贤贵丰，故曰“大亨”。所以享帝用特牲，而享圣贤有饔牲，牢礼也。“巽而耳目聪明”者，内而此心巽顺，外而耳目聪明也。离为目，五为鼎耳，故曰“耳目”，皆有离明之德，故曰“聪明”。“柔进而上行”者，鼎综革，二卦同体，文王综为一卦，故《杂卦》曰：“革，去故也；鼎，取新也。”言革下卦之离进而为鼎之上卦也。进而上行，居五之中，应乎二之刚也。若以人事论，内巽外聪有其德，进而上行有其位，应乎刚有其辅，是以“元亨”。\n《象》曰：木上有火，鼎。君子以正位凝命。\n正对偏倚言，凝对散漫言。“正位”者，端庄安正之谓，即斋明盛服，非礼不动也。“凝”者，成也，坚也。“命”者，天之命也。“凝命”者，天命凝成坚固，国家安于磐石，所谓协乎上下以承天休也。“鼎”譬之位，“命”譬之实。鼎之器正，然后可凝其所受之实。君之位正，然后可凝其所受之命。鼎综革，故革亦言“命”。孔子因大禹铸九鼎象物，成王定鼎于郏鄏，卜世三十，卜年七百，所以说到“正位凝命”上去。周烈王二十三年九鼎震，此不能正位凝命之兆也。其后秦遂灭周，取九鼎，则鼎所系匪轻矣，故以鼎为宗庙之宝器。及天宝五年，宰臣李适之常列鼎俎具膳羞，方夜鼎跃相斗不解，鼎耳及足皆折，岂以明皇不能正位凝命，而有幸蜀之祸与？\n初六：鼎颠趾，利出否。得妾以其子，无咎。\n巽错震，震为足，“趾”之象也。巽为长女，位卑居下，妾之象也。震为长子，子之象也。鼎为宝器，主器者莫若长子，则子之意亦由鼎而来也。“颠趾”者，颠倒其趾也。凡洗鼎而出水，必颠倒其鼎，以鼎足反加于上，故曰“颠趾”。“否”者，鼎中之污秽也。“利出否”者，顺利其出否也，故孔子曰“鼎取新也”。“得”者，获也。“得妾”者，买妾而获之也。“以”者，因也，因其子而买妾也。言洗鼎之时，趾乃在下之物，不当加于其上，今颠于上，若悖上下之序矣。然“颠趾”者非得已也，以其顺利于出否也。亦犹妻得妾，非得已也，以其欲生子而不得不买妾也。“得妾以其子”，又“颠趾”、“出否”之象也。\n初六居下，尚未烹饪，正洗鼎之时，颠趾以出否，故有“得妾以其子”之象。占者得此，凡事迹虽若悖其上下尊卑之序，于义则无咎也。\n《象》曰：“鼎颠趾”，未悖也。“利出否”，以从贵也。\n“未悖”者，未悖于理也。言以“颠趾”于鼎之上，虽若颠倒其上下之序，然洗鼎当如此，未为悖理也。贵对贱言。鼎中之否则贱物也。以从贵言，欲将珍羞贵重之物，相从以实于鼎中，不得不出其否贱以濯洁也。正位君子当先洗心。\n九二：鼎有实，我仇有疾，不我能即，吉。\n“鼎有实”者，既洗鼎矣，乃实物于其中也。阳实阴虚，故言实。“仇”者，匹也，对也，指初也。“疾”者，阴柔之疾也。“即”者，就也。言初虽有疾，九二则刚中自守，不能使我与之即就也。此九二之能事，非戒辞也。\n九二以刚居中，能守其刚中之实德，虽比于初，而不轻于所与，有鼎有美实，我仇有疾，不我能即，而浼我实德之象。占者如此，则刚中之德不亏，其吉可知矣。\n《象》曰：“鼎有实”，慎所之也。“我仇有疾”，终无尤也。\n“慎所之”者，慎所往也。此一句亦言九二之能事，非戒辞也。言九二有阳刚之实德，自能慎于所往，择善而交，不失身于阴党也。“终无尤”者，言我仇虽有疾，然慎于所往，不我能即，而不失身于彼，有何过尤哉！\n九三：鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。\n三变坎，中爻离坎为耳，“耳”之象也。“革”者，变也。坎为耳痛，“耳革”之象也。三未变，错震足为行，三变则成坎陷，不能行矣，“行塞”之象也。“其行塞”者，不能行也。离为雉，“雉”之象也。坎为膏，“膏”之象也。中爻兑，三变则不成兑口，“不食”之象也。三变则内坎水，外亦坎水，“方雨”之象也。鼎之所赖以举行者，“耳”也。三居木之极，上应火之极，木火既极，则鼎中腾沸，并耳亦炽热，革变而不可举移矣，故“其行塞”也。“雨”者，水也。“亏”者，损也。“悔”者，鼎不可举移，而“雉膏”之美味不得其食，不免至于悔也。“方雨亏悔”者，言耳革不食，惟救之以水耳。“方雨”，则能亏损其腾沸炽热之势，而“悔”者不至于悔矣。“终吉”者，鼎可移，美味可食也。\n九三以阳刚居鼎腹之中，本有美实之德，但应与木火之极，烹饪太过，故有“耳革行塞，雉膏不食”之象。然阳刚得正，故又有“方雨亏悔”之象。占者如是，始虽若不利，终则吉也。\n《象》曰：“鼎耳革”，失其义也。\n“义”者，宜也。鼎烹饪之木火，不可过，不可不及，方得烹饪之宜。今木火太过，则失烹饪之宜矣。所以“耳革”也。\n九四：鼎折足，覆公，其形渥，凶。\n四变中爻为震，“足”之象也。中爻兑为毁折，“折”之象也。鼎实近鼎耳，实已满矣，今震动，“覆”之象也。“”者，羹糁也。八珍之膳，鼎之实也。鼎以享帝养贤，非自私也，故曰公。“渥”者，沾濡也。言覆其鼎，而鼎上皆沾濡其羹糁也。以人事论，项羽之入咸阳，安禄山之陷长安，宗庙烧焚，宝器披离，不复见昔日彼都人士之盛，“其形渥”之象也。不可依晁氏“其刑剧凶”者，败国杀身也。若不以象论，以二体论，离巽二卦成鼎，下体巽有足而无耳，故曰“耳革”；上体离有耳而无足，故曰“折足”。\n九四居大臣之位，任天下之重者也。但我本不中不正，而又下应初六之阴柔，则委任亦非其人，不能胜大臣之任矣，卒至倾覆国家，故有此象。占者得此，败国杀身，凶可知矣。\n《象》曰：“覆公”，信如何也？\n二不我即，且慎所之，故善。\n信者，信任也。言以委托信任于人，今将覆之，则所信任之人为如何也？\n房琯之刘秩，宗元之叔文，安石之惠卿。\n六五：鼎黄耳，金铉，利贞。\n五为鼎耳。黄，中色。五居中，“黄耳”之象也。此爻变乾金，“金铉”之象也。以此爻未变而言则曰“黄”，以此爻既变而言则曰“金”。在鼎之上，受铉以举鼎者，“耳”也；在鼎之外，贯耳以举鼎者，“铉”也。盖铉为鼎之系，系于其耳，二物不相离，故并言之。\n六五有虚中之德，上比上九，下应九二，皆具刚明，故有“黄耳金铉”之象。鼎既“黄耳金铉”，则中之为实者，必美味矣。而占者则利于贞固也。因阴柔，故戒以此。\n《象》曰：“鼎黄耳”，中以为实也。\n黄，中色。言中乃其实德也，故云“黄耳”。\n上九：鼎玉铉，大吉，无不利。\n上九居鼎之极，铉在鼎上，铉之象也。此爻变震，震为玉，“玉铉”之象也。玉岂可为铉？有此象也，亦如“金车”之意。鼎之为器，承鼎在足，实鼎在腹，行鼎在耳，举鼎在铉，鼎至于铉，厥功成矣。功成可以养人，亦犹井之元吉大成也，故“大吉无不利”。\n上九以阳居阴，刚而能柔，故有温润玉铉之象。占者得此，凡事大吉，而又行无不利也。占者有玉铉之德，斯应是占矣。\n《象》曰：“玉铉”在上，刚柔节也。\n“刚柔节”者，言以阳居阴，刚而能节之以柔，亦如玉之温润矣，所以为“玉铉”也。","51":"震起也\n“震”者，动也。一阳始生于二阴之下，震而动也。其象为雷，其属为长子。《序卦》：“主器者莫若长子，故受之以震。”所以次鼎。\n震：亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。\n虩，音隙。哑，音厄。匕，音妣。\n“虩虩”，恐惧也。“虩”本壁虎之名，以其常周环于壁间，不自安宁而惊顾，此用“虩”字之意。震艮二卦同体，文王综为一卦，所以《杂卦》曰：“震，起也；艮，止也。”因综艮，艮为虎，故取虎象，非无因而言虎也。“哑哑”，笑声。震大象兑，又中爻错兑，皆有喜悦言语之象，故曰“笑言”。“匕”，匙也，以棘为之，长二尺。未祭祀之先，烹牢于镬，实诸鼎而加幕焉。将荐，乃举幕，以匕出之，升于俎上。“鬯”，以秬黍酒和郁金，以灌地降神者也。人君于祭之礼，亲匕牲荐鬯而已，其余不亲为也。“震来虩虩”者，震也；“笑言哑哑”者，震而亨也。此一句言常理也。“震惊百里不丧匕鬯”，处大变而不失其常，此专以雷与长子言之，所以实上一句意也。一阳在坤土之中，君主百里之象。中爻艮手执之，不丧之象。中爻坎，酒之象。\n言震自有亨道，何也？盖《易》之为理，“危者使平，易者使倾”，人能于平时安不忘危，此心常如祸患之来，虩虩然恐惧，而无慢易之心，则日用之间，举动自有法则，而一笑一言皆“哑哑”而自如矣。虽或有非常之变，出于倏忽之顷，犹雷之“震惊百里”，然此心有主，意气安闲，雷之威震虽大而远，而主祭者自“不丧匕鬯”也。此可见震自有亨道也。“不丧匕鬯”，乃象也，非真有是事也。言能“恐惧”则“致福”，而不失其所主之重矣。\n《彖》曰：震，亨。“震来虩虩”，恐致福也。“笑言哑哑”，后有则也。“震惊百里”，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。\n《易举正》“出可以守”句，上有“不丧匕鬯”四字，程子亦云，今从之。“恐”者，恐惧也。“致福”者，生全出于忧患，自足以致福也。“后”者，恐惧之后也，非震惊之后也。“则”者，法则也。不违礼不越分，即此身日用之常度也。人能恐惧，则操心危而虑患深，自不违礼越分，失日用之常度矣。即俗言惧法朝朝乐也，所以安乐自如，“笑言哑哑”也。“惊”者，卒然遇之而动乎外；“惧”者，惕然畏之而变其中。惊者不止于惧，惧者不止于惊。远者外卦，迩者内卦，内外皆震，“远迩惊惧”之象也。“出”者，长子已继世而出也。“可以”者，许之之辞也。言祸患之来，出于仓卒之间，如雷之震，远迩惊惧，当此之时乃能处之从容，应之暇豫，“不丧匕鬯”，则是不惧由于能惧，虽甚有可惊惧者，亦不能动吾之念也，岂不可以负荷天下之重器乎？故以守宗庙，能为宗庙之祭主；以守社稷，能为社稷之祭主矣。\n《象》曰：洊雷，震。君子以恐惧修省。\n“洊”者，再也。上震下震，故曰“洊”。“修”，理其身使事事合天理；“省”，察其过使事事遏人欲。惟此心恐惧，所以“修省”也。“恐惧”者作于其心，“修省”者见于行事。\n初九：震来虩虩，后笑言哑哑，吉。\n其笑言哑哑者，非一概笑言也。有震言虩虩存于先，而笑言哑哑在其后也。\n将卦辞加一“后”字，辞益明白矣。初九、九四，阳也，乃震之所以为震者，“震动”之震也。二、三、五、上，阴也，乃为阳所震者，“震惧”之震也。初乃成卦之主，处震之初，故其占如此。\n《象》曰：“震来虩虩”，恐致福也。“笑言哑哑”，后有则也。\n解见前。恐以致福，而后又则，理必不可易，则言必不可易，分观其象，而玩其辞，则知爻辞之量。哑哑与后者，仍是恐致福后有则之理，亦仍是恐致福后有则之言，无容更易一辞矣。\n六二：震来厉，亿丧贝，跻于九陵，勿逐，七日得。\n“震来厉”者，乘初九之刚，当震动之时，故震之来者猛厉也。“亿”者，大也。“亿丧贝”，大丧其贝也。十万曰亿，岂不为“大”？六五《小象》曰“大无丧”可知矣。“贝”者，海中之介虫也。二变则中爻离为蟹为蚌，“贝”之象也。震为足，“跻”之象也。中爻艮，为山，陵之象也。陵乘九刚，“九陵”之象也。又艮居七，“七”之象也。离为日，“日”之象也。若以理数论，阴阳各极于六，七则变而反其初矣。故《易》中皆言“七日得”。“跻”者，升也。言震来猛厉，大丧此货贝，六二乃不顾其贝，飘然而去，避于九陵，无心以逐之，不期七日自获其贝也。其始也堕甑弗顾，其终也去珠复还，太王之避狄，亦此意也。\n六二当震动之时，乘初九之刚，故有此“丧贝”之象。然居中得正，此“无妄之灾”耳，故又有“得贝”之象。占者得此，凡事若以柔顺中正自守，始虽不免丧失，终则不求而自获也。\n《象》曰：“震来厉”，乘刚也。\n当震动之时，乘九之刚，所以猛厉不可御。\n六三：震苏苏，震行无眚。\n“苏”即甦，死而复生也。《书》曰“后来其苏”是也，言后来我复生也。阴为阳所震动，三去初虽远，而比四则近，故下初之震动将尽，而上四之震动复生，上苏下苏，故曰“苏苏”。中爻坎，坎多眚。三变阴为阳，阳得其正矣，位当矣，且不成坎体，故“无眚”。“行”者，改徙之意，即阴变阳也。震性奋发有为，故教之以迁善改过也。\n六三不中不正，居二震之间，下震将尽而上震继之，故有“苏苏”之象。所以然者，以震本能行，而不行耳。若能奋发有为，恐惧修省，去其不中不正，以就其中正，则自“笑言哑哑”而“无眚”矣。故教占者如此。\n《象》曰：“震苏苏”，位不当也。\n不中不正，故“不当”。\n九四：震遂泥。\n“遂”者，无反之意。“泥”者，沉溺于险陷而不能奋发也。上下坤土，得坎水，“泥”之象也。坎有泥象，故需卦、井卦皆言“泥”，睽卦错坎则曰“负涂”。晋元帝国于五湖而大业未复，宋高宗不能恢复旧基，皆其“泥”者也。\n九四以刚居柔，不中不正，陷于二阴之间，处震惧则莫能守，欲震动则莫能奋，是既无能为之才，而又溺于宴安之私者也。故“遂泥”焉而不复反，即象而占可知矣。\n《象》曰：“震遂泥”，未光也。\n“未光”者，陷于二阴之间，所为者皆邪僻之私，无复有正大光明之事矣，所以“遂泥”也。与夬卦、萃卦“未光”皆同。\n六五：震往来厉，亿无丧，有事。\n初始震为“往”，四洊震为“来”。五乃君位，为震之主，故“往来”皆厉也。“亿无丧”者，大无丧也。天命未去，人心未离，国势未至瓦解也。“有事”者，犹可补偏救弊以有为也。六五处震，亦犹二之乘刚，所以爻辞同“亿”字“丧”字。\n六五以柔弱之才居人君之位，当国家震动之时，故有“往来危厉”之象。然以其德中，才虽不足以济变，而中德犹可以自守，故“大无丧”，而犹能有事也。占者不失其中，则虽危无丧矣。\n《象》曰：“震往来厉”，危行也。其事在中，大无丧也。\n“危行”者，往行危，来行危，一往一来皆危也。其事在中者，言所行虽危厉，而犹能以有事者，以其有中德也。有是中德而能有事，故“大无丧”。\n上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。\n矍，俱缚反。\n此爻变离，离为目，“视”之象也。又离火遇震动，言之象也。故明夷之“主人有言”，中孚之“泣歌”，皆离火震动也。凡震遇坎水者皆言“婚媾”。屯，震坎也；贲中爻，震坎也；睽上九变，震中爻坎也。此卦中爻坎也。“索”者，求取也。言如有所求取，不自安宁也。“矍”者，瞻视彷徨也。六三“苏苏”，上六“索索”、“矍矍”，三内震之极，上外震之极，故皆重一字也。震不于其躬，于其邻者，谋之之辞也。言祸患之来，尚未及于其身，方及其邻之时，即早见预待，天未阴雨而绸缪牖户也。孔斌曰：“燕雀处堂，子母相哺。灶突炎上，栋宇相焚。”言魏不知邻祸之将及也。此“邻”之义也。“婚媾”言亲近也，犹言夫妻也。亲近者不免于有言，则疏远者可知矣。\n上六以阴柔居震极，中心危惧不能自安，故有“索索”、“矍矍”之象。以是而往，方寸乱矣，岂能济变？故占者征则凶也。然所以致此者，以其不能图之于早耳。苟能于震未及其身之时“恐惧修省”，则可以免“索索”、“矍矍”之咎。然以阴柔处震极，亦不免“婚媾”之“有言”，终不能“笑言哑哑”，安于无事之天矣。防之早者且有言，况不能防者乎？“婚媾有言”，又占中之象也。\n筑薛之恐震也，居邠侵之疾也，一未然一已然。\n《象》曰：“震索索”，中未得也。虽凶无咎，畏邻戒也。\n“中”者，中心也。“未得”者，方寸乱而不能“笑言哑哑”也。“畏邻戒”者，畏祸已及于邻，而先自备戒也。“畏邻戒”，方得无咎，若不能备戒，岂得无咎哉！","52":"艮止也\n“艮”者，止也。一阳止于二阴之上，阳自下升，极上而止，此止之义也。又其象为山，下坤土，乃山之质。一阳覆冒于其上，重浊者在下，轻清者在上，亦止之象也。《序卦》：“震者，动也。物不可以终动，止之，故受之以艮。艮者，止也。”所以次震。\n艮其背，不获其身，行其庭，不见其人，无咎。\n此卦辞以卦综言，如井卦“改邑不改井”，蹇卦“利西南”之类。本卦综震，四为人之身，故周公爻辞以四为身。三画之卦二为人位，故曰“人”。庭则前庭，五也。艮为门阙，故门之内中间为“庭”。震行也，向上而行，面向上，其背在下，故以阳之画初与四为“背”。艮止也，向下而立，面向下，其背在上，故以阳之画三与上为“背”。上二句以下卦言，下二句以上卦言。言止其背则身在背后，不见其四之身，“行其庭”则背在人前，不见其二之人，所以一止之间既不见其己，又不见其人也。辞本玄妙，令人难晓，孔子知文王以卦综成卦辞，所以彖辞说一“行”字，说一“动”字，重一“时”字。\n《彖》曰：艮，止也。时止则止，时行则行。动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以“不获其身，行其庭，不见其人，无咎”也。\n以卦德、卦综、卦体释卦名、卦辞。言所谓艮者，以其止也。然天下之理无穷，而夫人之事万变，如惟其止而已，岂足以尽其事理哉！亦观其时何如耳。盖理当其可之谓时，时当乎艮之止则止，时当乎震之行则行，行止之动静皆不失其时，则无适而非天理之公，其道如日月之光明矣，岂止无咎而已哉！然艮之所以名止者，亦非固执而不变迁也，乃“止其所”也。惟止其所当然之理，所以时止则止也。卦辞又曰“不获其身，不见其人”者，盖人相与乎我，则我即得见其人，我相与乎人，则人即能获其我。今初之于四，二之于五，三之于上，阴自为阴，阳自为阳，不相与应，是以人不获乎我之身，而我亦不见其人，仅得“无咎”而已。若“时止”、“时行”，岂止“无咎”哉！八纯卦皆不相应与，独于艮言者，艮性止，止则固执不迁，所以不光明，而仅得“无咎”。文王卦辞专以象言，孔子彖辞专以理言。\n《象》曰：兼山，艮。君子以思不出其位。\n“兼山”者，内一山外一山，两重山也。天下之理，即位而存，父有父之位，子有子之位，君臣夫妇亦然。富贵有富贵之位，贫贱有贫贱之位，患难夷狄亦然。有本然之位，即有当然之理，“思不出其位”者，正所以止乎其理也。出其位则越其理矣。\n初六：艮其趾，无咎，利永贞。\n艮综震，震为足，趾之象也。初在下，亦趾之象也。咸卦亦以人身，以渐而上。\n初六阴柔，无可为之才，能止者也。又居初，卑下不得不止者也。以是而止，故有“艮趾”之象。占者如是，则不轻举冒进，可以无咎而正矣。然又恐其正者不能永也，故又教占者以此。\n《象》曰：“艮其趾”，未失正也。\n理之所当止者曰“正”，即爻辞之“贞”也。爻辞曰“利永贞”，象辞曰“未失正”，见初之止，理所当止也。\n六二：艮其腓，不拯其随，其心不快。\n“腓”者，足肚也，亦初震足之象。“拯”者，救也。“随”者，从也。二比三，从三者也。“不拯其随”者，不求拯于所随之三也。凡阴柔资于阳刚者皆曰“拯”，涣卦初六“用拯马壮”是也。二中正，八卦正位艮在三，两爻俱善，但当艮止之时，二艮止不求教于三，三艮止不退听于二，所以二心不快。中爻坎为加忧，为心病，“不快”之象也。\n六二居中得正，比于其三，止于其腓矣。以阴柔之质，求三阳刚以助之可也，但艮性止，不求拯于随，则其中正之德无所施用矣，所以此心常不快也。故其占中之象如此。\n《象》曰：“不拯其随”，未退听也。\n二下而三上，故曰“退”。周公不快，主坎之心病而言。孔子未听，主坎之耳痛而言。\n九三：艮其限，列其夤，厉薰心。\n“限”者，界限也。上身与下身相界限，即腰也。“夤”者，连也，腰之连属不绝者也。腰之在身，正屈伸之际，当动不当止。若“艮其限”，则上自上，下自下，不相连属矣。“列”者，列绝而上下不相连属，判然其两段也。“薰”与“熏”同，火烟上也。“薰心”者，心不安也。中爻坎为心病，所以六二“不快”。九三“薰心”，坎错离，火烟之象也。\n止之为道，惟其理之所在而已。九三位在腓之上，当限之处，正变动屈伸之际，不当艮者也。不当艮而艮，则不得屈伸，而上下判隔，列绝其相连矣。故危厉而心常不安。占者之象如此。\n《象》曰：“艮其限”，危“薰心”也。\n不当止而止，则执一不能变通。外既龃龉，心必不安，所以“危厉”而“薰心”也。\n六四：艮其身，无咎。\n“艮其身”者，安静韬晦，乡邻有斗而闭户，“括囊无咎”之类是也。\n六四以阴居阴，纯乎阴者也，故有“艮其身”之象。既“艮其身”，则无所作为矣。占者如是，故“无咎”。\n《象》曰：“艮其身”，止诸躬也。\n躬即身也。不能治人，不能成物，惟止诸躬而已。故爻曰“艮其身”，《象》曰“止诸躬”。\n六五：艮其辅，言有序，悔亡。\n“序”者，伦序也。“辅”见咸卦注。艮错兑，兑为口舌，“辅”之象也，言之象也。“艮其辅”者，言不妄发也。“言有序”者，发必当理也。“悔”者，易则诞，烦则支，肆则忤，悖则违，皆悔也。咸卦多象人面，艮卦多象人背者，以文王卦辞“艮其背”故也。\n六五当辅，出言之处，以阴居阳，未免有失言之悔。然以其得中，故又有“艮其辅，言有序”之象，而其占则“悔亡”也。\n《象》曰：“艮其辅”，以中正也。\n“正”当作止，与“止诸躬”止字同。以中而止，所以“悔亡”。\n上九：敦艮，吉。\n“敦”与笃行之“笃”字同意。时止则止，贞固不变也。山有敦厚之象，故“敦临”、“敦复”皆以土取象。\n上九以阳刚居艮极，自始至终，一止于贞而不变，敦厚于止者也，故有此象。占者如是，则其道光明，何吉如之！\n《象》曰：“敦艮”之吉，以厚终也。\n“厚终”者，敦笃于终而不变也。贲、大畜、蛊、颐、损、蒙六卦，上九皆“吉”者，皆有“厚终”之意。","53":"渐女归待男行也\n“渐”者，渐进也。为卦艮下巽上，有不遽进之义，渐之义也。木在山上，以渐而高，渐之象也。《序卦》：“艮者，止也。物不可以终止，故受之以渐。”所以次艮。\n渐：女归吉，利贞。\n妇人谓嫁曰“归”。天下之事惟“女归”为有渐。纳采、问名、纳吉、纳征、请期、亲迎，六礼备而后成婚，是以渐者莫如“女归”也。本卦不遽进，有“女归”之象，因主于进，故又戒以“利贞”。\n《彖》曰：渐之进也，“女归吉”也。进得位，往有功也。进以正，可以正邦也。其位刚得中也。止而巽，动不穷也。\n释卦名，又以卦综、卦德释卦辞。“之”字作“渐”字。“女归吉”者，言必如女归而后渐方善也。能如女归则进必以礼，不苟于相从，得以遂其进之之志而吉矣。“进得位”者，本卦综归妹，二卦同体，文王综为一卦，故《杂卦》曰：“渐，女归待男行也，归妹，女之终也。”言归妹下卦之兑，进而为渐上卦之巽，得九五之位也。然不惟得位，又正之中也。“正邦”者，成刑于之化也，即“往有功”也，此以卦综言也。“进不穷”者，盖进之之心愈急，则进之之机益阻。今卦德内而艮止，则未进之先，廉静无求，外而巽顺，则将进之间相时而动，此所以进不穷也。有此卦综、卦德，“吉”而“利贞”者以此。\n《象》曰：山上有木，渐。君子以居贤德善俗。\n习俗移人，贤者不免，故性相近而习相远也。君子法渐进之象，择居处于贤德善俗之地，则耳濡目染，以渐而自成其有道之士矣，即《孟子》“引而置之庄岳之间”之意。\n初六：鸿渐于干，小子厉，有言，无咎。\n“鸿”，雁之大者。鸿本水鸟。中爻离坎，离为飞鸟，居水之上，鸿之象也。且其为物，木落南翔，冰泮北归，其至有时，其群有序，不失其时与序，于渐之义为切。昏礼用鸿，取不再偶，于“女归”之义为切。所以六爻皆取“鸿”象也。“小子”者，艮为少男，小子之象也。内卦错兑，外卦综兑，兑为口舌，“有言”之象也。“干”，水旁也，江干也。中爻坎，水流于山，故有“干”象。“厉”者，危厉也，以在我而言也。“言”者，谤言也，以在人而言也。“无咎”者，在渐之时，非躐等以强进，于义则无咎。\n初六阴柔，当渐之时，渐进于下，有“鸿渐于干”之象。然少年新进，上无应与，在我不免有小子之厉，在人不免有言语之伤，故其占如此，而其义则“无咎”也。\n《象》曰：“小子”之厉，义“无咎”也。\n“小子之厉”，似有咎矣，然处当进之时，以渐而进，亦理之所宜。以义揆之，终无咎也。\n六二：鸿渐于磐，饮食衎衎，吉。\n衎，苦旦反。\n“磐”，大石也。艮为石，磐之象也。自“干”而“磐”，则远于水而渐进矣。中爻为坎，饮食之象也。故困卦九二言“酒食”，需卦九五言“酒食”，未济上九言“酒食”，坎卦六四言“樽酒”。“衎”，和乐也。巽综兑悦，乐之象，言“鸿渐于磐”而饮食自适也。“吉”即《小象》“不素饱”之意。\n六二柔顺中正而进以其渐，又上有九五中正之应，故其象如此，而其占则吉也。\n《象》曰：“饮食衎衎”，不素饱也。\n“素饱”即“素餐”也。言为人之臣，食人之食，事人之事，义所当得，非徒饮食而已也。盖其德中正，其进渐次，又应九五中正之君，非“素饱”也，宜矣。\n九三：鸿渐于陆，夫征不复，妇孕不育，凶。利御寇。\n地之高平曰“陆”。此爻变坤，陆之象也。“夫”指三爻。艮为少男，又阳爻，故谓之“夫”。“妇”指四。巽为长女，又阴爻，故谓之“妇”。本卦女归，故以“夫妇”言之。“征”者，往也。“不复”者，不反也。本卦以渐进为义，三比六四，渐进于上，溺而不知其返也。“妇孕”者，此爻合坎，坎中满，孕之象也。“孕不育”者，孕而不敢使人知其育，如孕而不育也。盖四性主入，无应而奔于三。三阳性上行，又当进时，故有此丑也。若以变爻论，三变则阳死成坤，离绝夫位，故有“夫征不复”之象。既成坤，则并坎中之满通不见矣，故有“妇孕不育”之象。坎为盗，离为戈兵，故有寇象。变坤，故《小象》曰“顺相保”。\n九三过刚，当渐之时，故有自“磐”而进于“陆”之象。然上无应与，乃比于亲近之四，附丽其丑，而失其道矣，非渐之贞者也。故在占者则有“夫征不复，妇孕不育”之象，凶可知矣。惟御寇之道在于人和，今变坎成坤，则同心协力，顺以相保，故“利”也。若以之渐进，是枉道从人，夫岂可哉？\n《象》曰：“夫征不复”，离群丑也。“妇孕不育”，失其道也。“利”用“御寇”，顺相保也。\n离，力智切。\n“离”，附着也。扬子云《解嘲》云“丁傅董贤用事，诸附离之者起家至二千石”，《庄子》“附离不以胶漆”，皆此离也。“群丑”者，上下二阴也。“夫征不复”者，以附离群阴，溺而不反也。“失其道”者，淫奔夫妇之正道也。“顺相保”者，御寇之道在于行险而顺，今变坎成坤，则行险而顺矣，所以能相保御也。雁群不乱飞，则列阵相保。三爻变坤有雁阵象，故曰“顺相保”。\n六四：鸿渐于木，或得其桷，无咎。\n桷，吉岳切，音觉。\n巽为木，“木”之象也。下三爻一画横于上，“桷”之象也。“桷”者，椽也，所以乘瓦。巽为绳直，故有此象。又坎为宫，四居坎上，亦有桷象。凡木之枝柯，未必横而宽平如桷。鸿趾连而且长，不能握枝，故不栖木。若木之枝如桷，则横平，而栖之可以安矣。“或得”者，偶然之辞，未必可得者也。巽为不果，“或得”之象。“无咎”者，得渐进也。\n六四以柔弱之资，似不可以渐进矣。然巽顺得正，有“鸿渐于木或得其桷”之象，占者如是则“无咎”也。\n《象》曰：“或得其桷”，顺以巽也。\n变乾错坤为顺，未变为巽。巽正位在四，故曰“顺巽”。\n九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。\n高阜曰陵。此爻变艮为山，“陵”之象也。妇指二。中爻为离中虚，空腹，“不孕”之象也。离居三，“三岁”之象也。“三岁不孕”者，言妇不遇乎夫，而“三岁不孕”也。二、四为坎，坎中满，故曰“孕”。三五中虚，故曰“不孕”。爻辞取象，精之极矣。凡正应为君子，相比为小人。二比三，三比四，四比五，皆阴阳相比，故此爻以“三岁不孕，终莫之胜，吉”言之。“终莫之胜”者，相比之小人，终不得以间之，而五与二合也。\n九五阳刚当尊，正应乎二，可以渐进相合，得遂所愿矣。但为中爻相比所隔，然终不能夺其正也，故其象如此。占者必有所迟阻而后吉也。\n《象》曰：“终莫之胜，吉”，得所愿也。\n“愿”者，正应相合之愿也。\n上九：鸿渐于陆，其羽可用为仪，吉。\n陆为巅平洁处。\n“陆”即三爻之陆。中爻水在山上，故自干而陆；此爻变坎，又水在山上，故又有“鸿渐于陆”之象。巽性伏，又进退不果，故又退“渐于陆”也。盖三乃上之正应，虽非阴阳相合，然皆刚明君子，故知进而又知退焉。“仪”者，仪则也。知进知退，惟圣人能之。今上能退于三，即蛊之“志可则”，盖百世之师也，故“其羽可以为仪”。曰“羽”者，就其鸿而言之。曰“羽可仪”，犹言人之言行可法则也。升卦与渐卦同是上进之卦，观升卦上六曰“利不息之贞”，则此爻可知矣。胡安定公，以陆作逵者非。盖《易》到六爻极处即反，“亢龙有悔”之类是也。\n上九木在山上，渐长至高，可谓渐进之极矣。但巽性不果，进而复退于陆焉。此则知进知退，可以起顽立懦者也，故有“鸿渐于陆，其羽可用为仪”之象。占者有是德，即有是吉矣。\n作逵亦有是理。\n《象》曰：“其羽可用为仪，吉”，不可乱也。\n“不可乱”者，鸿飞于云汉之间，列阵有序，与凡鸟不同，所以可用为仪。若以人事论，不可乱者，富贵利达不足以乱其心也。若富贵利达乱其心，惟知其进不知其退，惟知其高不知其下，安得“可用为仪”？今知进又知退，知高又知下，所以可以为人之仪则。","54":"归妹女之终也\n妇人谓嫁曰“归”。女之长者曰“姊”，少者曰“妹”。因兑为少女，故曰“妹”。为卦兑下震上，以少女从长男，其情又以悦而动，皆非正也，故曰“归妹”。《序卦》：“渐者，进也。进必有所归，故受之以归妹。”渐有归义，所以次渐。\n归妹：征凶，无攸利。\n彖辞明。渐曰“女归”，自彼归我也，娶妇之象也。此曰“归妹”，自我归彼也，嫁女之象也。\n《彖》曰：归妹，天地之大义也。天地不交而万物不兴。归妹，人之终始也。说以动，所归妹也。“征凶”，位不当也。“无攸利”，柔乘刚也。\n释卦名，复以卦德释之，又以卦体释卦辞。言所谓“归妹”者，本“天地之大义”也。盖物无独生独成之理，故男有室，女有家，本天地之常经，是乃其大义也。何也？盖男女不交则万物不生，而人道灭息矣。是归妹者，虽女道之终，而生育之事于此造端，实人道之始，所以为“天地之大义”也。然归妹虽天地之正理，但“说而动”，则女先乎男，所归在妹，乃妹之自为，非正理而实私情矣，所以名“归妹”。“位不当”者，二四阴位而居阳，三五阳位而居阴，自二至五皆不当也。“柔乘刚”者，三乘二之刚、五乘四之刚也，有夫屈乎妇、妇制其夫之象。“位不当”则紊男女内外之正，“柔乘刚”则悖夫妇倡随之理，所以“征凶无攸利”。\n《象》曰：泽上有雷，归妹。君子以永终知敝。\n“永”对暂言，“终”对始言。“永终”者，久后之意。兑为毁折，有“敝”象；中爻坎为通，离为明，有“知”象，故知其敝。天下之事，凡以仁义道德相交洽者，则久久愈善，如刘孝标所谓风雨急而不辍其音，霜雪零而不渝其色，此“永终无敝”者也。故以势合者，势尽则情疏，以色合者，色衰则爱弛。垝垣复关之望，虽言笑于其初，而桑落黄陨之嗟，终痛悼于其后。君子立身一败，万事瓦裂，其敝至此。\n雷震泽上，水气随之而升，女子从人之象也。故君子观其合之不正，而动于一时情欲之私，即知其终之有敝，而必至失身败德，相为睽乖矣。此所以欲善其终，必慎其始。\n初九：归妹以娣，跛能履，征吉。\n娣，戴礼切，妇之妹相从者。\n《曲礼》：“世妇姪娣。”谓以妻之妹从妻来者为娣，盖从嫁以适人者也。兑为妾，“娣”之象。初在下，亦“娣”之象。兑为毁折，有“跛”之象。震为足，足居初，中爻离为目，目与足皆毁折，所以初爻言足之“跛”，而二爻言目之“渺”也。若以变坎论，坎为曳，亦“跛”之象也。“跛”者，行之不以正，侧行者也。嫡正行而娣侧行也，故以“跛”象之。\n初九居下，当归妹之时，而无正应，不过娣妾之贱而已，故为娣象。然阳刚在女子为贤正之德，但为娣之贱，则闺阃之事不得以专成。今兑悦居下，有顺从之义，故亦能维持调护，承助其正室，但不能专成，亦犹跛者侧行而不能正行也。占者以是而往，虽其势分之贱不能大成其内助之功，而为媵妾职分之当然则已尽之矣，吉之道也，故“征吉”。\n《象》曰：“归妹以娣”，以恒也。“跛能履，吉”，相承也。\n“恒”，常也，天地之常道也。有嫡有妾者，人道之常。初在下位无正应，分当宜于娣矣，是乃常道也，故曰“以恒”也。“恒”字义，又见九二《小象》。“相承”者，能承助乎正室也。以其有贤正之德，所以能相承，故曰“相承”也。以恒，以分言；相承，以德言。\n九二：眇能视，利幽人之贞。\n“眇”者，偏盲也，解见初九。兑综巽，巽为白眼，亦有眇象。中爻离目，视之象。“幽人之贞”者，幽人遭时不偶，抱道自守者也。幽人无贤君，正犹九二无贤妇。众爻言“归妹”，而此爻不言者，居兑之中，乃妹之身，是正嫡而非娣也。“幽人”一句详见前履卦，又占中之象也。\n九二阳刚得中，优于初之居下矣。又有正应，优于初之无应矣。但所应者阴柔不正，是乃贤女。而所配不良，不能大成内助之功，故有眇者能视，而不能远视之象。然所配不良，岂可因其不良，而改其刚中之德哉！故占者“利”如“幽人之贞”可也。\n《象》曰：“利幽人之贞”，未变常也。\n一与之齐，终身不改，此妇道之常也。今能守幽人之贞，则未变其常矣。故教占者如幽人之贞则利也。初爻、二爻《小象》，孔子皆以“恒常”二字释之，何也？盖兑为常，则“恒常”二字乃兑之情性，故释之以此。\n六三：归妹以须，反归以娣。\n须字新奇。\n“须”，贱妾之称。《天文志》：“须女四星，贱妾之称。”故古人以婢仆为余须。反者，颠倒之意。震为反生，故曰“反”。\n六三居下卦之上，本非贱者也。但不中不正，又为悦之主，善于容悦以事人，则成无德之须，贱而人莫之取矣。故为未得所适，“反归于娣媵”之象。初位卑，“归以娣”，宜矣。三居下卦之上，何自贱至此哉？德不称位而成须故也。不言“吉凶”者，容悦之人，前之吉凶未可知也。\n《象》曰：“归妹以须”，未当也。\n“未当”者，爻位不中不正也。\n九四：归妹愆期，迟归有时。\n“愆”，过也，言过期也。女子过期不嫁人，故曰“愆期”。因无正应，以阳应阳，则纯阳矣，故“愆期”。“有时”者，男女之婚姻自有其时也。盖天下无不嫁之女，愆期者数，有时者理。若以象论，中爻坎月离日，期之之象也。四一变则纯坤，而日月不见矣，故“愆期”。震春兑秋，坎冬离夏，四时之象。震东兑西，相隔甚远，所以“愆期”。四时循环则有时矣。\n九四以阳应阳而无正应，盖女之愆期而未归者也。然天下岂有不归之女？特待时而归，归之迟耳，故有“愆期迟归有时”之象。占者得此，凡事待时可也。\n《象》曰：“愆期”之志，有待而行也。\n“行”者，嫁也。天下之事自有其时，“愆期”之心，亦有待其时而后嫁耳。爻辞曰“有时”，象辞曰“有待”，皆待时之意。\n六五：帝乙归妹，其君之袂，不如其娣之袂良。月几望，吉。\n“帝乙”，如箕子明夷、高宗伐鬼方之类。“君”者，妹也。此爻变兑，兑为少女，故以妹言之。诸侯之妻曰“小君”，其女称“县君”。宋之臣，其妻皆称“县君”是也，故不曰“妹”而曰“君”焉。“袂”，衣袖也，所以为礼容者也。人之着衣，其礼容全在于袂，故以“袂”言之。“良”者，美好也。三爻为娣，乾为衣，三爻变乾，故其衣之袂良。五爻变兑成缺，故不如三之良。若以理论，三不中正，尚容饰，五柔中，不尚容饰，所以不若其娣之袂良也。“月几望”者，坎月离日，震东兑西，日月东西相望也。五阴二阳，言月与日对，而应乎二之阳也。“月几”者，言光未盈满、柔德居中而谦也。月几望而应乎阳，又下嫁，占中之象也。\n六五柔中居尊，盖有德而贵者也。下应九二，以帝有德之女下嫁于人，故有尚德而不尚饰、其服不盛之象。女德之盛无以加此。因下嫁，故又有月几望而应乎阳之象。占者有是德，则有是吉矣。\n《象》曰：“帝乙归妹”，“不如其娣之袂良”也，其位在中，以贵行也。\n“在中”者，德也。“以贵”者，帝女之贵也。“行”者，嫁也。有是中德，有是尊贵，以之下嫁，又何必尚其饰哉！此所以“君之袂不如娣之袂良”也。\n《小象》原一气，下言以贵行，何难于饰？而良犹不如，可见中德不在贵也。\n上六：女承筐，无实。士刲羊，无血。无攸利。\n刲，音葵。\n兑为“女”，震为“士”。“筐”乃竹所成，震为竹，又仰盂空虚，无实之象也。又变离，亦中虚，无实之象也。中爻坎为血卦，血之象也。兑为羊，羊之象也。震综艮，艮为手，“承”之象也。离为戈兵，“刲”之象也。羊在下，血在上，“无血”之象也。凡夫妇祭祀，承筐采蘩者，女之事也；刲羊而实鼎俎者，男之事也。今上与三皆阴爻，不成夫妇，则不能供祭祀矣。“无攸利”者，人伦以废，后嗣以绝，有何攸利？“刲”者，屠也。\n上六以阴柔居卦终而无应。居终则过时，无应则无配，盖归妹之不成者也。故有“承筐无实，刲羊无血”之象。占者得此，无攸利可知矣。\n《象》曰：上六“无实”，“承”虚“筐”也。\n上爻有底而中虚，故曰“承虚筐”。\n阳实阴虚，上六无阳，将何所承？徒虚筐也。","55":"丰多故亲寡旅也\n“丰”，盛大也。其卦离下震上，以明而动，盛大之由也。又雷电交作，有盛大之势，乃丰之象也，故曰丰。《序卦》：“得其所归者必大，故受之以丰。”所以次归妹。\n丰：亨，王假之，勿忧宜日中。\n“亨”者，丰自有亨通也，非丰后方亨也
