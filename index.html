。“假”，至也。必以王言者，盖王者车书一统而后可以至此也。此卦离日在下，日已昃矣，所以周公爻辞言“见斗”、“见沫”者，皆此意。“勿忧宜日中”一句读，言王者至此，“勿忧宜日中”，不宜如是之昃，昃则不能照天下也。孔子乃足之曰：“至日中不免于昃，徒忧而已。”文王已有此意，但未发出，孔子乃足之。离日象，又王象。错坎，忧象。\n《彖》曰：丰，大也。明以动，故丰。“王假之”，尚大也。“勿忧，宜日中”，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎？况于鬼神乎？\n以卦德释卦名，又以卦象释卦辞而足其意。非明则动无所之，冥行者也；非动则明无所用，空明者也。惟明动相资，则王道由此恢廓，故名“丰”。“尚大”者，所尚盛大也。非王者有心欲盛大也，其势自盛大也。抚盈盛之运，不期侈而自侈矣。“宜照天下”者，遍照天下也，日昃则不能遍照矣。日中固照天下，然日岂长中哉？盖日以中为盛，日中则必昃；月以盈为盛，月盈则必食。何也？天地造化之理，其盈虚消息，每因乎时，天地且不长盈而不虚，况于人与鬼神乎？可见国家无常丰之理，不可忧其宜日中不宜日昃也。鬼神是天地之变化运动者，如风、云、雷、雨，凡阳嘘阴吸之类皆是。\n《象》曰：雷电皆至，丰。君子以折狱致刑。\n始而问狱之时，法电之明以折其狱，是非曲直必得其情。终而定刑之时，法雷之威以定其刑，轻重大小必当其罪。\n初九：遇其配主，虽旬无咎，往有尚。\n“遇”字详见噬嗑六三。“配主”者，初为明之初，四为动之初，故在初曰“配主”，在四曰“夷主”也。因“宜日中”一句，故爻辞皆以日言。文王象丰，以一日象之，故曰“勿忧宜日中”。周公象丰，以十日象之，故曰“虽旬无咎”。十日为旬。言初之丰以一月论，已一旬也，言正丰之时也。\n当丰之初，明动相资，故有“遇其配主”之象。既遇其配，则足以济其丰矣，故虽至于一旬，亦无灾咎，可嘉之道也。故占者往则有尚。\n《象》曰：“虽旬无咎”，过旬灾也。\n“虽旬无咎”，周公许之之辞。“过旬灾也”，孔子戒之之辞。“过旬灾”者，言盛极必衰也。\n六二：丰其蔀，日中见斗，往得疑疾，有孚发若，吉。\n“蔀”，草名。中爻巽，草之象也，故大过下巽曰“白茅”，泰卦下变巽曰“拔茅”，皆以巽为阴柔之木也。“斗”，量名，应爻震，有量之象，南斗北斗皆如量，所以名“斗”。本卦离日在下，雷在上，震为蕃草，蕃盛之象也。言草在上蕃盛，日在下，不见其日而惟见其斗也。“疑”者，援其所不及，指其所不知，必致猜疑也。“疾”者，持方柄以内圆凿，反见疾恶也。“有孚”者，诚信也。离中虚，“有孚”之象也。“发”者，感发开导之也。“若”，助语辞。“吉”者，至诚足以动人，彼之昏暗可开，而丰亨可保也。“贞”字“诚”字乃六十四卦之枢纽。圣人于事难行处，不教人以贞，则教人以“有孚”。\n六二居丰之时，为离之主，至明者也。而上应六五柔暗，故有“丰其蔀”不见其日，惟见其斗之象。以是昏暗之主，往而从之，彼必见疑疾，有何益哉！惟在积诚信以感发之则吉。占者当如是也。\n《象》曰：“有孚发若”，信以发志也。\n“志”者，君之心志也。“信以发志”者，尽一己之诚信，以感发其君之心志也。能发其君之志，则己之心与君之心，相为流通矣。伊尹之于太甲，孔明之于后主，郭子仪之于肃宗、代宗，用此道也。\n九三：丰其沛，日中见沫，折其右肱，无咎。\n沫，音末。\n“沛”，泽也，沛然下雨之貌。“沫”者，水沫也，故曰涎沫、濡沫、跳沫、流沫，乃霡霂细雨，不成水之意。此爻未变，中爻兑为泽，沛之象也。既变，中爻成坎水矣，沫之象也。二爻巽木，故以草象之。三爻泽水，故以沫象之。周公爻辞精极至此。王弼不知象，以蔀为覆暧，后儒从之，即以为障蔽。王弼以沛为旆，后儒亦以为旆。殊不知雷在上，中爻有泽有风，方取此沛沫之象，何曾有旆之象哉！相传之谬有自来矣。“肱”者，手臂也。震综艮，中爻兑错艮，艮为手，肱之象也。又兑为毁折，折其肱之象也。曰右者，阳爻为右，阴爻为左，故师之左次，明夷之左股、左腹，皆阴爻也。此阳爻，故以右言之。右肱至便于用，而人不可少者。折右肱，则三无所用矣。“无咎”者德在我，其用与不用在人，以义揆之无咎也。\n九三处明之极而应上六之柔暗，则明有所蔽，故有“丰其沛”，不见日而“见沫”之象。夫明既有所蔽，则以有用之才，置之无用之地，故又有“折其右肱”之象。虽不见用，乃上六之咎也，于三何亦尤哉！故“无咎”。\n《象》曰：“丰其沛”，不可大事也。“折其右肱”，终不可用也。\n“不可大事”与遁卦九三同，皆言艮止也。盖建立大事以保丰亨之人，必明与动相资。今三爻变，中爻成艮止，虽动而不明矣。动而又止，安能大事哉！其不可济丰也，必矣。周公爻辞以本爻未变言，孔子象辞以本爻既变言。人之所赖以作事者，在“右肱”也。今三为时所废，是有用之才，而置无用之地，如人折右肱矣，所以“终不可用”。\n九四：丰其蔀，日中见斗。遇其夷主，吉。\n“夷”者，等夷也，指初也，与四同德者也。二之丰蔀见斗者，应乎其昏暗也。四之丰蔀见斗者，比乎其昏暗也。若以象论，二居中爻巽木之下，四居中爻巽木之上，巽阴木，蔀之类也，所以爻辞同。“吉”者，明动相资，共济其丰之事也。\n当丰之时，比乎昏暗，故亦有丰蔀见斗之象。然四与初同德相应，共济其丰，又有“遇其夷主”之象，吉之道也。故其象占如此。\n隋炀帝丰极而暗，高退与苏威、贺若弼私谋，此爻似矣。\n《象》曰：“丰其蔀”，位不当也。“日中见斗”，幽不明也。“遇其夷主”，“吉”行也。\n“幽不明”者，初二日中见斗，是明在下而幽在上，二之身犹明也。若四之身原是蔀位，则纯是幽而不明矣。“行”者动也，震性动，动而应乎初也。\n六五：来章，有庆誉，吉。\n凡卦自下而上者谓之“往”，自上而下者谓之“来”，此来字非各卦之来，乃召来之来也，谓屈己下贤以召来之也。“章”者，六二离本章明，而又居中得正，本卦明以动，故“丰”。非明则动无所之，非动则明无所用，二五居两卦之中，明动相资，又非丰蔀见斗之说矣。“庆”者，福庆集于己也。“誉”者，声誉闻于人也。此爻变兑，兑为口，有誉象。“吉”者，可以保丰亨之治也。\n六五为丰之主，六二为之正应。有章明之才者，若能求而致之，则明动相资，“有庆誉”而吉矣。占者能如是，斯应是占也。\n《象》曰：六五之“吉”，“有庆”也。\n有庆方有誉，未有无福庆而有誉者。举庆，则誉在其中矣。\n明良相得，朝廷之庆，主圣臣贤，海宇之庆也。六五之吉，以其有召贤之庆也。\n上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。\n阒，音乞。\n此爻与明夷“初登于天，后入于地”相同。以“屋”言者，凡丰亨富贵，未有不润其屋者。“丰其屋”者，“初登于天”也。“蔀其家”以下，“后入于地”也。“蔀其家”者，草生于屋，非复前日之炫耀而丰矣。“丰其蔀”本周公爻辞，今将“丰”、“蔀”二字分开，则知上“丰”字，乃丰之极，下“蔀”字，乃丰之反矣。故《小象》上句以为“天际翔也”。“窥”者，窥视也。离为目，窥之象也。“阒”者，寂静也。“阒”其无人者，庭户寂静而无人也。“三岁不觌”者，变离，离居三也，言窥其户寂静无人，至于三年之久，犹未见其人也。“凶”者，杀身亡家也。泰之后而“城复于隍”，丰之后而“阒寂其户”，处承平岂易哉！\n上六以柔暗之质，居明动丰亨之极，承平既久，奢侈日盛，故有“丰其屋”之象。然势极则反者，理数也，故离之明极必反其暗，草塞其家而有暗之象。震之动极必反其静，有“阒其无人，三年不觌”之象。占者得此，凶可知矣。\n《象》曰：“丰其屋”，天际翔也。“窥其户，阒其无人”，自藏也。\n阒，张目大视貌。\n言丰极之时，其势位炙手可热，如翱翔于天际云霄之上，人可仰而不可即。上六天位，故曰“天”。及尔败坏之后，昔之光彩气焰不期掩藏而自掩藏矣。权臣得罪披离之后，多有此气象。","56":"旅\n“旅”，羁旅也。为卦山内火外。内为主，外为客。山止而不动，犹舍馆也；火动而不止，犹行人也。故曰旅。《序卦》：“丰，大也。穷大者必失其居，故受之以旅。”所以次丰。\n旅：小亨，旅贞吉。\n“小亨”者，亨之小也。旅途亲寡，势涣情疏，纵有亨通之事，亦必微小，故其占为“小亨”。然其亨者以其正也，道无往而不在，理无微而可忽，旅途之间能守此正，则吉而亨矣。“小亨”者，占之亨也；“旅贞吉”者，圣人教占者处旅之道也。\n《彖》曰：旅，小亨。柔得中乎外而顺乎刚，止而丽乎明，是以“小亨，旅贞吉”也。旅之时义大矣哉！\n以卦综、卦德释卦辞，而叹其大。本卦综丰，二卦同体，文王综为一卦，故《杂卦》曰：“丰，多故。亲寡，旅也。”丰下卦之离，进而为旅之上卦，所以柔得中乎外卦，而又亲比上下之刚也。“明”者，己之明也，非丽人之明也。“止而丽乎明”与睽“悦而丽乎明”同，只是内止外明也。羁旅之间，柔得中不取辱，顺乎刚不招祸，止而不妄动，明而识时宜，此四者处旅之正道也。有此正道，是以占者“小亨”。若占者能守此旅之正道，则吉而亨矣。“大”本赞辞，“然”乃叹辞也。言旅本小事，必柔中顺刚，止而丽明，方得小亨。则难处者旅之时，难尽者旅之义，人不可以其小事而忽之也。与豫、随、姤同。\n《象》曰：山上有火，旅。君子以明慎用刑而不留狱。\n明其刑，以罪之轻重言。慎其刑，以罪之出入言。“不留”者，既决断于明刑之后，当罪者即罪之，当宥者即宥之，不留滞淹禁也。因综丰雷火，故亦言“用刑”。“明”者，火之象。“慎”者，止之象。“不留”者，旅之象。\n初六：旅琐琐，斯其所取灾。\n“琐”者，细屑猥鄙貌。羁旅之间，计财利得失之毫末也。“斯”者，此也。“取灾”者，自取其灾咎也。“斯其所以取灾”者，因此琐琐自取灾咎，非由外来也。旅最下，则“琐琐取灾”；旅最上，则“焚巢致凶”。必如象之柔中顺刚，止而丽明，方得尽善。\n初六阴柔在下，盖处旅而猥鄙细屑者也。占者如是，则召人之轻侮，而自取灾咎矣。故其象占如此。\n《象》曰：“旅琐琐”，志穷灾也。\n“志穷”者，心志穷促浅狭也。惟其“志穷”，所以“琐琐”取灾。\n六二：旅即次，怀其资，得童仆贞。\n“即”者，就也。“次”者，旅之舍也。艮为门，二居艮止之中，即次得安之象也。“资”者，财也，旅之用也。中爻巽，巽为“近市利三倍”，怀资之象也。故家人六四“富家大吉”。少曰童，长曰仆，旅之奔走服役者也。艮为少男，综震为长男，童仆之象也。阴爻中虚，有孚贞信之象也。\n六二当旅之时，有柔顺中正之德，故有即次怀资，童仆贞之象，盖旅之最吉者也。占者有是德，斯应是占矣。\n《象》曰：“得童仆贞”，终无尤也。\n羁旅之中得即次怀资，可谓吉矣。若使童仆狡猾，则所居终不能安，而资亦难保其不盗矣，此心安得不至怨尤？所以“童仆贞，终无尤”。\n九三：旅焚其次，丧其童仆，贞厉。\n三近离火，焚次之象也。三变为坤，则非艮之男矣，“丧童仆”之象也。“贞”者，童仆之贞信者丧之也。“贞”字连“童仆”读。盖九三过刚不中，与六二柔顺中正全相反，“焚次”与“即次”反，“丧童仆贞”与“得童仆贞”反，“得”字对“丧”字看，故知“贞”字连“童仆”。\n九三居下之上，过刚不中。居下之上则自高不能下人，过刚则众莫之与，不中则所处失当，故有“焚次丧童仆贞”之象，危厉之道也。故其象占如此。\n《象》曰：“旅焚其次”，亦以伤矣。以旅与下，其义丧也。\n“焚次”已伤困矣，况又“丧童仆贞”乎！但以义揆之，以旅之时而与下过刚如此，宜乎“丧童仆”也，何足为之惜哉！“下”字即“童仆”。\n合二、三爻观之，可见旅贵柔而贱刚。\n九四：旅于处，得其资斧，我心不快。\n“处”者，居也，息也。“旅处”与“即次”不同。“即次”者，就其旅舍，已得安者也；“旅处”者，行而方处，暂栖息者也。艮土性止，离火性动，故“次”与“处”不同。“资”者，助也，即六二怀资之资，财货金银之类。“斧”，则所以防身者也。得资足以自利，得斧足以自防，皆旅之不可无者。离为戈兵，斧之象也。中爻上兑金，下巽木，木贯乎金，亦斧之象也。旅于处则有栖身之地，非三之焚次矣。得资斧则有御备之具，非三之“丧童仆”矣。离错坎为加忧，“不快”之象。此爻变中爻成坎，亦“不快”之象。\n九四以阳居阴，处上之下，乃巽顺以从人者也，故有“旅于处得其资斧”之象。但下应阴柔，所托非人，故又有“我心不快”之象。占者亦如是也。\n《象》曰：“旅于处”，未得位也。“得其资斧”，心未快也。\n旅以得位而安，二之即次，艮土之止也。四之于处，离火之燥也。资斧虽得，然处位不宁，应与非人，心焉得快？亦得暂息耳，未得位也。\n六五：射雉一矢亡，终以誉命。\n离为雉，雉之象也。错坎，矢之象也。变乾，乾居一，一之象也。始而离则有雉、矢二象，及变乾则不见雉与矢矣，故有雉飞矢亡之象。“誉”者，兑也，兑悦体，又为口，以口悦人，誉之象也。凡《易》中言“誉”者皆兑。如蛊卦“用誉”，中爻兑也；蹇卦“来誉”，下体错兑也；丰卦“庆誉”，中爻兑也。“命”，命令也。“以”者，用也，言五用乎四与二也。本卦中爻乃兑与巽，兑为誉，巽为命，六五比四而顺刚，又应乎二之中正，四乃兑，二乃巽，所以终得声誉命令也。如玄宗幸蜀，及肃宗即位于外，德宗幸奉天，皆天子为旅也，可谓雉飞矢亡矣。后得郭子仪诸臣恢复故物，终得其誉，又得命令于天下，如建中之诏是也。\n六五当羁旅之时，以其阴柔，故有“射雉”雉飞矢亡之象也。然文明得中，能顺乎四而应乎二，故“终以誉命”也。占者凡事始凶终吉可知矣。\n《象》曰：“终以誉命”，上逮也。\n上者，五也。五居上体之中，故曰“上”，以四与二在下也。“逮”，及也。言顺四应二，赖及于四二，所以得“誉命”也。\n上九：鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。\n易，音亦。\n离，其于木也科上稿，巢之象也。离为鸟为火，中爻巽为木为风，鸟居风木之上而遇火，火燃风烈，“焚巢”之象也。“旅人”者，九三也，乃上九之正应也。三为人位，得称“旅人”。“先笑”者，上九未变，中爻兑悦，笑之象也，故与同行正应之旅人为之相笑。及“焚其巢”，上九一变，则悦体变为震动，成小过灾眚之凶矣，岂不“号咷”？故“先笑后号咷”也。离为牛，牛之象也。与大壮“丧羊于易”同。易即埸，田畔地也。震为大涂，有此象。\n上九当羁旅穷极之时，居卦之上则自高，当离之极则躁妄，与柔中顺刚、止而丽明者相反，故以之即次，则无栖身之地，有“鸟焚其巢，一时变笑为号咷”之象。以之怀资，则无守卫之人，有“丧牛于易”之象。欲止无地，欲行无资，何凶如之！故占者凶。\n《象》曰：以旅在上，其义“焚”也。“丧牛于易”，终莫之闻也。\n在上过于高亢，宜乎见恶于人而焚巢。既见恶于人，则人莫有指而闻之者，而牛不可获矣。错坎为耳痛，故“莫之闻”。\n重耳出亡，而从者皆卿材，唁公于野井，有子家羁，莫能用也。","57":"巽伏\n巽，入也，二阴伏于四阳之下，能巽顺乎阳，故名为巽。其象为风，风亦取入义，亦巽之义也。《序卦》：“旅而无所容，故受之以巽。”旅途亲寡，非巽顺何以取容？所以次旅。\n巽：小亨，利有攸往，利见大人。\n“小亨”者，以卦本属阴，又卑巽也。惟其如是，则才智不足以识远任重，仅可小亨。虽“小亨”，然“利有攸往”。盖巽以从人，人无不悦，所以“利有攸往”。然使失其所从，未必利往，纵使利往，失其正矣，故利见大德之人。此则因其从阳，而教之以所从之人也。\n《彖》曰：重巽以申命。刚巽乎中正而志行，柔皆顺乎刚，是以“小亨，利有攸往，利见大人”。\n释卦义，又以卦体释卦辞。“重巽”者，上下皆巽也。“申命”者，丁宁重复也。风之吹物无处不入，无物不鼓动，诏令之入人，亦如风之动物也。刚巽乎中正，指九五。“巽乎中正”者，居巽卦之中正也。“志行”者，能行其志也。盖刚居中正，则所行当其理，而无过中失正之弊也。凡出身加民，皆建中表正，而志以行矣。此“大人”之象也。柔指初与四，刚指二、三、五、六。惟柔能顺乎刚，是以“小亨，利有攸往”。惟刚巽乎中正，故“利见大人”。\n《象》曰：随风，巽。君子以申命行事。\n前风去而后风随之，故曰“随风”。“申命”者，随风之象也。“申命”者，所以晓谕于行事之先；“行事”者，所以践言于申命之后，其实一事也。\n初六：进退，利武人之贞。\n巽为进退，“进退”之象也。变乾纯刚，故曰“武人”。故履六三变乾亦曰“武人”，皆阴居阳位，变阳则称“武人”也。盖阴居阳位则不正，变乾则贞矣，故曰“利武人之贞”。曰“利武人之贞”，如云利阳刚之正也。\n初六阴柔居下爻，为巽之主，乃卑巽之过者也，是以持狐疑之心，凡事是非可否，莫之适从，故有“进退”之象，以刚果之不足也。苟能如武人之贞，则有以矫其柔懦之偏，不至于过巽矣。故教占者如此。\n《象》曰：“进退”，志疑也。“利武人之贞”，志治也。\n“进退”者，以阴柔居巽下，是非可否，莫之适从也。惟疑则方寸已乱，不能决进退矣。若柔而济之以刚，则心之所知者有定见，事之所行者有是非，可进则决于进，可退则决于退，不持疑于两可，治而不乱矣。\n治不疑也。\n九二：巽在床下，用史巫纷若，吉，无咎。\n一阴在下，二阳在上，床之象，故剥以“床”言。巽性伏，二无应于上，退而比初，心在于下，故曰“床下”。中爻为兑，又巽综兑，兑为巫，“史巫”之象也。又为口舌、为毁、为附，“纷若”之象也。史掌卜筮，曰“史巫”者，善于卜吉凶之巫也，故曰“史巫”，非两人也。“纷”者，缤纷杂乱貌。“若”，助语辞。初乃阴爻居于阳位，二乃阳爻居于阴位，均之过于卑巽者也。初教以武人之贞，教之以直前勇敢也；二教之以巫之纷若，教之以抖擞奋发也。初阴据阳位，故教以男子之“武”；二阳据阴位，故教以“女人”之纷。爻辞之精至此。\n二以阳处阴，而居下无应，乃比乎初，故有巽在床下之象。然居下体亦过于卑巽者，必不安宁。如史巫之纷若，鼓舞动作，则有以矫其柔懦之偏，不惟得其吉，而在我亦无过咎矣。教占者当如是也。\n《象》曰：“纷若”之吉，得中也。\n“得中”者，得中而不过于卑巽也。凡《小象》二五言中字，皆因中位，又兼人事。\n九三：频巽，吝。\n“频”者，数也。三居两巽之间，一巽既尽，一巽复来，“频巽”之象。曰“频巽”，则频失可知矣。“频巽”与“频复”不同。“频复”者，终于能复也；“频巽”者，终于不巽也。\n九三过刚不中，又居下体之上，本不能巽，但当巽之时，不容不巽矣。然屡巽屡失，吝之道也。故其象占如此。\n《象》曰：“频巽”之吝，志穷也。\n三本刚而位又刚，已不能巽矣。又乘刚，安能巽？曰“志穷”者，言心虽欲巽而不得巽也。\n六四：悔亡，田获三品。\n中爻离为戈兵，巽错震，戈兵震动，田之象也。离居三，三品之象也。“三品”者，初巽为鸡，二兑为羊，三离为雉也。\n六四当巽之时，阴柔无应，承乘皆刚，宜有悔矣。然以阴居阴，得巽之正，又居上体之下，盖居上而能下者也，故不惟悔亡，而且有“田获三品”之象。占者能如是，则所求必得而有功矣。\n《象》曰：“田获三品”，有功也。\n八卦正位，巽在四，所以“获三品”而“有功”。\n九五：贞吉，悔亡，无不利。无初有终。先庚三日，后庚三日，吉。\n“先庚”、“后庚”，详见蛊卦。五变则外卦为艮，成蛊矣。先庚丁，后庚癸，其说始于郑玄，不成其说。\n九五居尊，为巽之主，命令之所由出者也。以其刚健中正，故正而又吉。然巽顺之体，初时不免有悔，至此则悔亡而无不利矣。惟其“悔亡”而“无不利”，故“无初有终”也。然命令之出，所系匪轻，必原其所以始，虑其所以终，“先庚三日，后庚三日”，庶乎命令之出，如风之吹物，无处不入、无物不鼓动矣。占者必如是而吉也。\n伏羲圆图，艮巽夹坎于西方之中，故曰：先庚后庚。言巽先乎庚，而艮后乎庚也。先三，下三爻也，后三，上三爻也。\n《象》曰：九五之“吉”，位中正也。\n刚健，中正，未有不吉者。曰“悔亡”者，巽累之也。故孔子止言九五之吉。\n上九：巽在床下，丧其资斧，贞凶。\n本卦巽木综兑金，又中爻兑金，斧之象也。又中爻离为戈兵，亦斧之象也。阴乃巽之主，阴在下四爻，上亦欲比乎四，故与二之巽在床下同。九三、九五不言床下者，三过刚，五居中得正也。巽“近市利三倍”，本有其资，此爻变坎为盗，则“丧其资”矣。且中爻离兑斧象，皆在下爻，不相管摄，是“丧其斧”矣。“贞”者，巽本美德也。\n上九居巽之终，而阴居于下，当巽之时，故亦有“巽在床下”之象。但不中不正，穷之极矣，故又有“丧其资斧”之象。占者得此，虽正亦凶也。\n《象》曰：“巽在床下”，上穷也。“丧其资斧”，正乎“凶”也。\n“上穷”者，言上九之时势也，非释巽在床下也。巽在床下乃本卦之事，当巽之时，不容不巽者也。“正乎凶”即爻辞“贞凶”。\n乎，疑辞也，决辞言爻辞以为贞。果正乎乃凶也。","58":"兑见\n兑，悦也。一阴进于二阳之上，喜悦之见于外也，故为兑。《序卦》：“巽者，入也。入而后悦之，故受之以兑。”所以次巽。\n兑：亨，利贞。\n“亨”者，因卦之所有而与之也；“贞”者，因卦之不足而戒之也。说则亨矣，但阴阳相说，易流于不正，故戒以利贞。\n《彖》曰：兑，说也。刚中而柔外，说以“利贞”，是以顺乎天而应乎人。说以先民，民忘其劳。说以犯难，民忘其死。说之大，民劝矣哉！\n先，西荐反。难，乃旦反。\n释卦名，又以卦体释卦辞，而极言之。“兑，说也”，与“咸，感也”同。咸去其心，说去其言，故咸则无心之感，兑则无言之说也。刚中指二五，柔外指三上。阳刚居中，中心诚实之象。柔爻在外，接物和柔之象。外虽柔说，中实刚介，是之谓说而贞，故“利贞”。《易》“有天道焉”，顺天者，上兑也。“有人道焉”，应人者，下兑也。揆之天理而顺，故“顺天”；质之人心而安，故“应人”。天理人心正而已矣，若说之不以正，则不能顺应矣。\n说本有亨而又利贞者，盖卦体刚中，则所存者诚，固无不亨。柔外恐说之不正，故必正而后利也。说得其正，是以顺天应人。以之先民，民忘其劳；以之犯难，民忘其死。夫好逸恶死，人情之常，今忘劳忘死，非人情也，而忘之者，以说而不自知其劳且死也。曷为而说也？知圣人劳我以逸我，死我以生我也，是以说而自劝也。夫劝民与民自劝相去远矣，是以圣人大之，曰：“说之大，民劝矣哉！”此正之所以利也。\n《象》曰：丽泽，兑。君子以朋友讲习。\n“丽”者，附丽也。两泽相丽，交相浸润，互有滋益。水就湿，各以类而相从，朋友之道，不出乎此。“习”者，我自习之以践其事。朋友之间从容论说，以讲之于先，我又切实体验，以习之于后，则心与理相涵，而所知者益精，身与事相安，而所能者益固，欲罢不能，而真说在我矣。\n初九：和兑，吉。\n“和”与《中庸》“发而皆中节谓之和”“和”字同，谓其所悦者无乖戾之私，皆情性之正，道义之公也。“吉”者，无恶无射、家邦必达之意。盖悦能和，即顺天应人，岂不吉。\n初九以阳爻居说体而处最下，又无应与之系，说得其正者也。故其象占如此。\n《象》曰：“和兑”之吉，行未疑也。\n本卦说体不当阴阳相比，二比三、三比四、五比六，阴阳相比则不能无疑，故夬卦九五《小象》曰“中未光也”，萃卦曰“志未光也”。“未光”者，因可疑而未光也，故上六“引兑”亦曰“未光”。本卦独初爻无比，无比则无所疑矣，故曰“行未疑也”。“行”者，与人和说也。变坎为狐，疑之象也。\n九二：孚兑，吉，悔亡。\n本卦无应与，专以阴阳相比言。刚中为“孚”，居阴为悔。盖“来兑”在前，私系相近，因居阴不正，所以不免悔也。\n九二当兑之时，承比阴柔，说之当有悔矣。然刚中之德，孚信内充，虽见小人，自守不失正，所谓和而不同也。占者能如是以孚而说，则吉而悔亡矣。\n《象》曰：“孚兑”之吉，信志也。\n心之所存为志。“信志”即“诚心”二字。二刚实居中，诚信出于刚中之志，岂又说小人而自失？革九四，辞同义异。革则人信，孚则己信。\n六三：来兑，凶。\n自内至外为“往”，自外至内为“来”。“凶”者，非惟不足以得人之与，且有以取人之恶，所以凶也。何也？盖初刚正，二刚中，乃君子也。说之不以道，岂能说哉！求亲而反疏矣。如弘霸尝元忠之粪，彭孙濯李宪之足，丁谓拂莱公之须，皆为人所贱，至今犹有遗羞焉，岂不凶？\n三阴柔不中正，上无应与，近比于初，与二之阳乃来求而悦之，是自卑以求悦于人，不知有礼义者矣。故其占凶。\n《象》曰：“来兑”之凶，位不当也。\n阴柔不中正。\n九四：商兑未宁，介疾有喜。\n“商”者，商度也。中爻巽，巽为不果，商之象也。“宁”者，安宁也。两间谓之介，分限也，故人守节，亦谓之介。四与三上下异体，犹疆介然，故以介言之。比乎五者公也，理也，故不敢舍公而从私。比乎三者私也，情也，故不能割情而就理。此其所以“商度未宁”也。商者四，介者九。\n四承九五之中正，而下比六三之柔邪，故有“商度未宁”之象。然质本阳刚，若介然守正，疾恶柔邪，而相悦乎同体之五，如此则有喜矣。故戒占者如此。\n《象》曰：九四之“喜”，有庆也。\n君臣相悦，国家之大庆也，何待商哉！介疾可以。\n与君相悦，则得得其柔刚之正道，而有福庆矣。\n九五：孚于剥，有厉。\n剥谓阴能剥阳，指上六也。剥即剥卦，消阳之名。兑之九五正当剥之六五，故言“剥”。如明皇之李林甫，德宗之卢杞，皆以阴柔容悦，剥乎阳者也。“孚”者，凭国家之承平，恃一己之聪明，以小人不足畏而孚信之，则内而蛊惑其心志，外而壅蔽其政令，国事日为之紊乱矣，所以“有厉”。因悦体人易孚之，所以设此有厉之戒，不然九五中正，安得“有厉”？\n九五阳刚中正，当悦之时，而居尊位，密近上六。上六阴柔，为悦之主，处悦之极，乃妄悦以剥阳者也。故戒占者，若信上六则有危矣。\n《象》曰：“孚于剥”，位正当也。\n与履九五同。\n上六：引兑。\n“引”者，开弓也，心志专一之意，与萃“引吉”之“引”同。中爻离错坎，坎为弓，故用“引”字。萃六二变坎，故亦用“引”字。本卦二阴，三曰“来兑”，止来于下，其字犹缓，其为害浅，至上六则悦之极矣，故“引兑”。开弓发矢，其情甚急，其为害深，故九五“有厉”。\n上六阴柔，居悦之极，为悦之主，专于悦五之阳者也，故有“引兑”之象。不言“吉凶”者，五已有“危厉”之戒矣。\n《象》曰：上六“引兑”，未光也。\n“未光”者，私而不公也。盖悦至于极，则所悦者必暗昧之事，不光明矣。故萃卦上体乃悦，亦曰“未光”。","59":"涣离也\n“涣”者，离散也。其卦坎下巽上，风行水上，有披离解散之意，故为“涣”。《序卦》：“兑者，说也。说而后散之，故受之以涣。”所以次兑。\n涣：亨。王假有庙，利涉大川，利贞。\n坎错离，离为日，“王”之象也。中爻艮，艮为门阙，又坎为宫，庙之象也。又坎为隐伏，人鬼之象也。木在水上，“利涉大川”之象也。“王假有庙”者，王至于庙以聚之也。此二句，皆以象言，非真“假庙”“涉川”也。“假有庙”者，至诚以感之，聚天下之心之象也。“涉大川”者，冒险以图之，济天下之艰之象也。“利贞”者，戒之也。\n《彖》曰：涣，亨。刚来而不穷，柔得位乎外而上同。“王假有庙”，王乃在中也。“利涉大川”，乘木有功也。\n以卦综释卦辞。本卦综节，二卦同体，文王综为一卦，故《杂卦》曰：“涣，离也。节，止也。”“刚来不穷”者，言节上卦坎中之阳来居于涣之二也，言刚来亦在下之中，不至于穷极也。“柔得位乎外而上同”者，节下卦兑三之柔，上行而为巽之四，与五同德以辅佐乎五也。八卦正位，坎在五，巽在四，故曰“得位”，故曰“上同”。“王乃在中”者，中爻艮为门阙，门阙之内即庙矣。今九五居上卦之中，是在门阙之内矣，故曰“王乃在中”也。“乘木”者，上卦巽木乘下坎水也。“有功”者，即利涉也。因有此卦综之德，故能“王乃在中”，至诚以感之，以聚天下之心；“乘木有功”，冒险以图之，以济天下之难。此涣之所以亨也。\n《象》曰：风行水上，涣。先王以享于帝立庙。\n“享帝立庙”在国家盛时说，非土崩瓦解之时也。与“王假有庙”不同。孔子在涣字上生出此意来。言王者享帝，而与天神接，立庙而与祖考接，皆聚己之精神，以合天人之涣也。“风在天上”，天神之象；“水在地下”，人鬼之象。“享帝”则天人感通，“立庙”则幽明感通。\n初六：用拯马壮，吉。\n坎为亟心之马，马壮之象也。陈平交欢太尉而易吕为刘，仁杰潜援五龙而反周为唐，皆“拯”急难而得“马壮”者也。\n初六当涣之初，未至披离之甚，犹易于拯者也。但初六阴柔，才不足以济之，幸九二刚中，有能济之具者。初能顺之，托之以济难，是犹拯急难而得“马壮”也。故有此象。占者如是，则吉也。\n《象》曰：初六之“吉”，顺也。\n顺二也。\n九二：涣奔其机，悔亡。\n木无枝曰“机”。\n“奔”者，疾走也。中爻震足，坎本亟心，奔之象也。又当世道涣散，中爻震动不已，皆有出奔之象。“机”，木也。中爻震木，应爻巽木，“机”之象也，指五也。\n当涣之时，二居坎陷之中，本不可以济涣，而有悔也。然应九五中正之君，君臣同德，故出险以就五，有奔于其机之象。当天下涣散之时，汲汲出奔以就君，得遂其济涣之愿矣，有何悔焉？故占者“悔亡”。\n《象》曰：“涣奔其机”，得愿也。\n得遂其济涣之愿。\n二之奔五非出图出险，其愿惟在于济涣。子仪赴朔方，刘幽求赴隆基也。\n六三：涣其躬，无悔。\n六三居坎体之上，险将出矣，且诸爻独六三有应援，故“无悔”。“涣其躬”者，奋不顾身，求援于上也。\n六三阴柔，本不可以济涣，然与上九为正应，乃亲自求援于上九。虽以阴求阳，宜若有悔，然志在济时，故“无悔”也。教占者必如此。\n《象》曰：“涣其躬”，志在外也。\n“在外”者，志在外卦之上九也。\n以上九足为济涣之外援，所以不有其身。\n六四：涣其群，元吉。涣有丘，匪夷所思。\n“涣其群”者，涣其人也。当涣之时，土崩瓦解，人各植党，如六国之争衡，田横之海岛，隗嚣之天水，公孙述之于蜀，唐之藩镇尾大不掉，皆所谓群也。政无多门，势无两大，胫大于股则难步，指大于臂则难把，故当“涣其群”也。六四能涣小人之私群，成天下之公道，所以“元吉”。柔得位乎外而上同，岂不“元吉”？“涣丘”者，涣其土也。艮为土，丘之象也。颐上卦艮，故曰“丘颐”。此卦中爻艮，故亦以丘言之。“夷”者平常也，言非平常之人思虑所能及也。\n六四上承九五，当济涣之任者也。所居得正，而下无应与，则外无私交，故有“涣其群”之象。占者如是，则正大光明，无比党携贰之私，固大善而“元吉”矣。然所涣者特其人耳。若并其土而涣之，则其“元吉”犹不殊于涣群。但“涣其群”者，人皆可能；而“涣其丘”者，必才智出众之人方可能之，殆非平常思虑之所能及也。故又教占者如此。\n窦融献陇西地，钱俶献钱塘地，涣丘也。\n《象》曰：“涣其群，元吉”，光大也。\n凡树私党者，皆心之暗昧狭小者也。惟无一毫之私，则光明正大，自能“涣其群”矣，故曰“光大也”。\n九五：涣汗其大号，涣王居，无咎。\n上卦风以散之，下卦坎水，汗之象也。巽综兑，兑为口，号之象也。五为君，又阳爻，“大号”之象也。散人之疾而使之愈者汗也，解天下之难而使之安者号令也。“大号”，如武王《武成》诸篇，及唐德宗罪己之诏皆是也。“王居”者，帝都也，如赤眉入长安，徽钦如金，皆正涣之时矣。光武乃封更始为淮阳王，而定都洛阳。高宗乃即位于南京，皆所谓“涣王居”也。益卦中爻为坤，“利用为依迁国”，此爻一变亦中爻成坤，故“涣王居”。坎错离，离为日，王之象。五乃君位，亦有王之象。孔子恐人不知“王居”二字，故《小象》曰“正位也”。曰“正位”，义自显明。\n九五阳刚中正以居尊位，当涣之时，为臣民者“涣其躬”、“涣其群”，济涣之功成矣。乃诞告多方，迁居正位，故有“涣汗其大号”、“涣王居”之象。虽其始也，不免有土崩瓦解之虞，至此则恢复旧物，大一统宇矣。以义揆之，则无咎也。故其占为“无咎”。\n《象》曰：“王居”“无咎”，正位也。\n光武诸将于中山上尊号，不听，耿纯进曰：“天下士大夫捐亲戚，弃土壤，从大王于矢石之间者，其计固望攀龙鳞附凤翼以成其志耳。今大王留时逆众，不正号位，恐士大夫绝望计穷，有去归之思，无为久自若也。”此即“正位”之意。盖京师天下根本，当涣之时，王者必定其所居之地以正其位。位既正，则人心无携贰，昔之涣者，今统于一矣。故“涣王居”者，乃所以正位也。\n上九：涣其血，去逖出，无咎。\n去，去声。\n依《小象》“涣其血”作句。“血”者，伤害也。“涣其血”者，涣散其伤害也。“逖”者，远也。当涣之之时，干戈扰攘，生民涂炭，民之逃移而去乡土者多矣。“去逖出”者，言去远方者得出离其远方而还也。此爻变坎，下应坎，坎为血，血之象也。又为隐伏，远方窜伏之象也。\n上九以阳刚当涣之极，方其始而涣散之时，其伤害，其远遁，二者所不免也。今九五诞告多方，迁居正位，归于一统，非复前日之离散，则伤害者得涣散矣，远遁者得出离矣，故有“涣血去逖出”之象，而其占则“无咎”也。\n《象》曰：“涣其血”，远害也。\n涣其血，去逖出，则危者已安，否者已泰，其涣之害远矣，故曰“远害”也。","60":"节\n“节”者，有限而止也。为卦下兑上坎，泽上有水，其容有限，若增之则溢矣，故为节。《序卦》：“涣者，离也，物不可以终离，故受之以节。”所以次涣。\n节：亨。苦节不可贞。\n五行以甘为正味，稼穑作甘者，以中央土也。若火炎上则焦枯，所以作苦。不可贞者，不可固守以为常也。凡人用财修己皆有中道，仕止久速各有攸当，或远或近，或去或不去，归洁其身。如屈原、申屠狄之投河，陈仲子之三日不食，许行之并耕，泄柳之闭门，皆非经常而不可久者也。\n《彖》曰：节，亨。刚柔分而刚得中。“苦节不可贞”，其道穷也。说以行险，当位以节，中正以通。天地节而四时成。节以制度，不伤财，不害民。\n以卦综释卦辞，又以卦德、卦体释“亨”之义，而极言之。坎刚卦，兑柔卦。节涣相综，在涣则柔外而刚内，在节则刚外而柔内，则“刚柔分”也。“刚得中”者，二五也，二五皆刚居中也。言刚柔虽分内分外，而刚皆得中，此其所以亨也。惟其中所以亨，若苦节则不贞矣。不中则天理不顺，人情不堪，难于其行，所以穷也。盖穷者亨之反，亨则不穷，穷则不亨。当位指九五。八卦正位，坎在五，故以当位言之。“中正”者，五中正也。“通”者，推行不滞而通之天下也。坎为通，故以通言之。盖所谓节者，以其说而行险也。盖说则易流，遇险则止，说而不流，所以为节。且阳刚当九五之位，有行节之势，以是位而节之，九五具中正之全，有体节之德，以是德而通之，此所以为节之善，故占者亨。若以其极言之，阳极阴生，阴极阳生，柔节之以刚，刚节之以柔，皆有所制，而不过天地之节也。天地有节，则分至启闭，晦朔弦望，四时不差而岁功成矣。“制”者，法禁也，故天子之言曰“制书”。“度”者，则也，皆有所限制而不过。节以制度，是量入为出，如《周礼》九赋九式有常数常规是也。“不伤”者，财不至于匮乏。“不害”者，民不苦于诛求。桀过乎节，貊不及乎节。不伤不害，惟圣人能之。\n《象》曰：泽上有水，节。君子以制数度，议德行。\n行，下并反。\n古者之制器用，宫室衣服莫不有多寡之数、隆杀之度，使贱不逾贵，下不侵上，是之谓制数度，如繁缨一就三就之类是也。得于中为德，发于外为行。“议”之者，商度其无过不及而求归于中，如直温宽栗之类是也。坎为矫，“制”之象。兑为口舌，“议”之象。“制”者节民于中，“议”者节身于中。\n初九：不出户庭，无咎。\n中爻艮为门，门在外，户在内，故二爻取门象，此爻取户象。前有阳爻蔽塞，闭户不出之象也。又应四，险难在前，亦不当出，亦不出之象也。此象所该者广，在为学为“含章”，在处事为“括囊”，在言语为“简默”，在用财为“俭约”，在立身为“隐居”，在战阵为“坚壁”。《系辞》止以“言语”一事言之。“无咎”者，不失身不失时也。\n初九阳刚得正，居节之初，知前爻蔽塞，又所应险难，不可以行，故有“不出户庭”之象。此则知节之时者也，故占者“无咎”。\n《象》曰：“不出户庭”，知通塞也。\n道有行止，时有通塞。不出户庭者，知其时之塞而不通也。此“塞”字乃孔子取内卦之象。\n九二：不出门庭，凶。\n圣贤之道以中为贵，故邦有道，其言足以兴，邦无道，其默足以容。九二当禹稷之位，守颜子之节，初之无咎，二之凶可知矣。\n九二前无蔽塞，可以出门庭矣。但阳德不正，又无应与，故有“不出门庭”之象。此则惟知有节，而不知通其节，节之失时者也。\n《象》曰：“不出门庭，凶”，失时极也。\n“极”，至也，言失时之至，惜之也。初与二，小象皆一意，惟观时之通塞而已。初，时之塞矣，故“不出户庭无咎”；二，时之通矣，故“不出门庭凶”。所以可仕则仕，可止则止，孔子为圣之时，而禹、稷、颜回同道者，皆此意也。\n六三：不节若，则嗟若，无咎。\n兑为口舌，又坎为加忧，又兑悦之极，则生悲叹，皆嗟叹之象也。用财，恣情忘费则不节矣；修身，纵情肆欲则不节矣。嗟者，财以费而伤，德以纵而败，岂不自嗟？若，助语辞。自作之孽，何所归咎！\n六三当节之时，本不容不节者也，但阴柔不正，无能节之德。不节之后自取穷困，惟嗟叹而已，此则不能节者也。占者至此，将何咎哉！故无所归咎。\n《象》曰：“不节”之嗟，又谁咎也？\n此与解卦小异，详见解卦。\n六四：安节，亨。\n“安”者，顺也。上承君之节，顺而奉行之也。九五为节之主，当位以节，中正以通，乃节之极美者。四最近君，先受其节而节之节。以修身用财言者，举其大者而言耳。若臣安君之节，则非止二者。盖节者，中其节之义。在学为不陵节之节，在礼为节文之节，在财为撙节之节，在信为符节之节，在臣为名节之节，在君即为节制之节。故不止于修身用财。\n六四柔顺得正，上承九五，乃顺其君，而奉行其节者也。故其象为安，其占为亨。\n《象》曰：“安节”之亨，承上道也。\n承上道即遵王之道。\n九五：甘节，吉，往有尚。\n“甘”者，乐易而无艰苦之谓。坎变坤，坤为土，其数五，其味甘，甘之象也。凡味之甘者人皆嗜之。下卦乃悦体，又兑为口舌，甘节之象也。诸爻之节，节其在我者，九五之节，以节节人者也。临卦六三居悦体之极，则求悦乎人，故“无攸利”；节之九五居悦体之上，则人悦乎我，故“往有尚”。“吉”者，节之尽善尽美也。“往有尚”者，立法于今而可以垂范于后也。盖“甘节”者中正也，“往有尚”者通也。数度德行皆有制议而通之天下矣，正所谓“当位以节，中正以通”也。\n九五为节之主，节之甘美者也。故占者不惟“吉”，而且“往有尚”。\n《象》曰：“甘节”之吉，居位中也。\n中可以兼正，故止言中。\n上六：苦节，贞凶，悔亡。\n“苦节”虽本文王卦辞，然坎错离，上正居炎上之地，炎上作苦，亦有苦象。“贞凶”者，虽无越理犯分之失，而终非天理人情之安也。盖以事言，无甘节之吉，故“贞凶”。以理言，无不节之嗟，故“悔亡”。《易》以祸福配道义，而道义重于祸福，故大过上六“过涉灭顶无咎”，而此曰“悔亡”，见理之得失重于事之吉凶也。\n上六居节之极，盖节之苦者也，故有卦辞“苦节”之象。节既苦矣，故虽正不免于凶。\n《象》曰：“苦节，贞凶”，其道穷也。\n“道穷”见彖辞。","61":"中孚信也\n孚，信也。为卦二阴在内，四阳在外，而二五之阳皆得其中。以一卦六爻言之为中虚，以二体之二五言之为中实，皆孚之象也。又下说以应上，上巽以顺下，亦有孚义。《序卦》：“节而信之，故受之以中孚。”所以次节。\n中孚：豚鱼吉，利涉大川，利贞。\n豚鱼生于大泽之中，将生风则先出拜，乃信之自然，无所勉强者也。信如豚鱼，则吉矣。本卦上风下泽，豚鱼生于泽知风，故象之。鹤知秋，鸡知旦，二物皆信，故卦爻皆象之。“利贞”者，利于正也。若盗贼男女之私，岂不彼此有孚？然非理之正，故“利贞”。\n《彖》曰：中孚，柔在内而刚得中。说而巽，孚乃化邦也。“豚鱼吉”，信及豚鱼也。“利涉大川”，乘木舟虚也。中孚以“利贞”，乃应乎天也。\n以卦体、卦德、卦象释卦名、卦辞。二柔在内而中虚，二刚居中而中实。虚则内欲不萌，实则外诱不入，此中孚之本体也。而又下说上顺，上下交孚，所以“孚乃化邦”也。若徙木立信，乃出于矫强矣，安能化邦？《易举正》止有“信及也”三字，无“豚鱼”二字。“及”者，至也，言信至于豚鱼，则信出自然矣。如此信，此所以吉也。“乘木舟虚”者，本卦外实中虚，有“舟虚”之象。至诚以涉险，如乘巽木之空，以行乎兑泽之上，又岂有沉溺之患？所以“利涉大川”。“应乎天”者，信能正，则事事皆天理，所谓诚者天之道也。贞应乎天，所以利贞。\n《象》曰：泽上有风，中孚。君子以议狱缓死。\n圣人之于卦，以八卦为之体，其所变六十四卦中错之综之，上之下之，皆其卦也。如火雷噬嗑，文王之意，以有火之明，有雷之威，方可有狱。孔子《大象》言用狱者五，皆取雷火之意。丰取其雷火也，旅与贲、艮综震，亦雷火也。解则上雷而中爻为火也，下体错离亦火也，此卦则大象为火而中爻为雷也。盖孔子于《易》韦编三绝，胸中之义理无穷，所以无往而非其八卦。不然，风泽之与“议狱缓死”何相干涉！《易经》一错一综，大象中爻，观此五卦自能默悟。兑为口舌，议之象。巽为不果，缓之象。\n“议狱缓死”者，议狱罪当死矣，乃缓其死而欲求其生也。风入水受者，中孚之象也。“议狱缓死”，则至诚恻怛之意溢于用刑之间矣。\n初九：虞吉，有他，不燕。\n“虞”者，乐也，安也。“燕”者，喜也，安也。二字之义相近。“有他”者，其志不定而他求其所应也。本卦三四皆阴爻，六三则阴柔不正，六四则得八卦之正位者，因有此阴柔不正者隔于其中，故周公方设此有他之戒。若论本爻应爻，则不容戒也。\n初九阳刚得正，而上应六四，四盖柔顺得正者也。当中孚之初，其志未变，故有与六四相信而安乐之象，占者如是则吉。若不信于六四而别信于他，则是不能安乐其中孚矣，故戒占者如此。\n《象》曰：初九“虞吉”，志未变也。\n方初中孚之志未变。\n九二：鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。\n和，去声。\n大象离，雉象，变震，鹄象，皆飞鸟之象也。不言雉鹄而言鹤者，鹤信故也。鹤八月霜降则鸣，兑乃正秋，故以鹤言之。中孚错小过之遗音，又兑为口舌，鸣之象也。故谦、豫二卦《小象》，小过皆言“鸣”。“在阴”者，鹤行依洲屿，不集林木，九居阴爻，在阴之象也。巽为长女，兑为少女，子母之象也。“好爵”者，懿德也，阳德居中，故曰“好爵”。子与尔皆指五，因中孚感应极至而无以加，所以不论君臣皆呼子尔也。言懿德人之所好，故“好爵”虽我之所有，而彼亦系恋之也。“物之相爱”者，莫如子母之同心；“人之所慕”者，莫如好爵之可贵。“鹤鸣子和”者，天机之自动也；“好爵尔靡”者，天理之自孚也。“靡”与“縻”同。系，恋也。巽为绳，系之象也。\n九二以刚中居下，有中孚之实，而九五刚中居上，亦以中孚之实应之，故有此象。占者有是德，方有是感应也。\n《象》曰：“其子和之”，中心愿也。\n诚意所愿，非九二求于九五也。\n六三：得敌，或鼓或罢，或泣或歌。\n“得敌”者，得对敌也，指上九之应也。言六三不正，上九亦不正也。阴阳皆位不当，所以曰“得敌”。巽为进退，为不果，作止之象。又中爻震为鼓，鼓之象。艮为止，“罢之”之象。本卦大象离错坎，坎为加忧，“泣”之象。兑为口舌，为“巫歌”之象。\n六三阴柔不正，而上应九之不正，此为悦之极，彼为信之穷，皆相敌矣。是以或鼓或罢而作止不定，或泣或歌而哀乐无常。其象如此，占者不能孚信，可知矣。\n《象》曰：“或鼓或罢”，位不当也。\n阴居阳位。\n六四：月几望，马匹亡，无咎。\n“月几望”者，月与日对而从乎阳也。本卦下体兑，中爻震，震东兑西，日月相对，故“几望”。曰“几”者，将望而犹未望也。因四阴爻近五阳爻，故有此日月之象。马匹亡者，震为马，马之象也。此爻变，中爻成离牛，不成震马矣，“马匹亡”之象也。“匹”者，配也，指初九也。曰“亡”者，不与之交，而绝其类也。“无咎”者，心事光明也。\n六四当中孚之时，近君之位，柔顺得正，而中孚之实德，惟精白以事君，不系恋其党与者也，故有“月几望马匹亡”之象。占者能是，则无咎矣。\n《象》曰：“马匹亡”，绝类上也。\n绝其类，应而上从五也。\n九五：有孚挛如，无咎。\n“挛如”即“鹤鸣子和，我爵尔靡”也。“縻”字与“挛”字，皆有固结而不可解之意。“縻”者，系恋也。“挛”者，相连也。如合九二共成一体，包二阴以成中孚，故有此象。“无咎”者，上下交而德业成也。\n九五居尊位，为中孚之主，刚健中正，有中孚之实德，而下应九二，与之同德相信，故其象占如此。\n《象》曰：“有孚挛如”，位正当也。\n与履不同。履，周公爻辞乃“贞厉”，此则“无咎”。\n上九：翰音登于天，贞凶。\n《礼记》“鸡曰翰音”，而此亦曰“翰音”者，以巽为鸡也。因错小过“飞鸟遗”之音，故九二曰“鹤鸣”，而此曰“翰音”也。鸡信物，天将明则鸣，有“中孚”之意。巽为高，“登天”之象也。又居天位，亦“登天”之象也。“登”者，升也，言鸡鸣之声，登闻于天也。九二上孚于五，在阴而子和；上九不下孚于三，翰音反登天，其道盖相反矣。“贞”者，信本正理也。\n上九居中孚之极，极则中孚变矣。盖声闻过情，不能长久于中孚者也，故有此象。占者得此，贞亦凶矣。\n《象》曰：“翰音登于天”，何可长也！\n鸡不能鸣永长登于天，不过天将明一时而已。","62":"小过过也\n小谓阴也。为卦四阴二阳，阴多于阳，小者过也，故曰“小过”。《序卦》：“有其信者必行之，故受之以小过。”所以次中孚。\n小过：亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上，宜下，大吉。\n小过错中孚象离，离为雉，乃飞鸟也。既错变为小过，则象坎矣，见坎不见离，则鸟已飞过，微有遗音也。《易经》错综之妙至此。若以卦体论，二阳象为鸟身，上下四阴象鸟翼，中爻兑为口舌，遗音之象也。遗音人得而听之，则鸟低飞在下不在上，与上六“飞鸟离之”者不同矣。大过曰“栋桡”，栋，重物也，故曰“大过”。飞鸟轻物，而又曰“遗音”，故曰“小过”。不宜上宜下，又就小事言也，如坤之居后不居先是也。《上经》终之以坎、离，坎、离之上颐与大过，颐有离象，大过有坎象，方继之以坎、离。《下经》终之以既济、未济，既济、未济之上中孚与小过，中孚有离象，小过有坎象，方继之既济、未济。文王之序卦精矣。\n阴柔于人无所逆，于事无所拂，故“亨”，然利于正也。盖大过则以大者为贞，小过则以小者为贞，故“可小事，不可大事”。然卦体有飞鸟遗音，其过如是其小之象，故虽小事亦宜收敛，谦退居下，方得大吉。惟小事而又居下，斯得时宜而贞矣。“可小事不可大事”者，当小过之时；“宜下不宜上”者，行小过之事。\n《彖》曰：小过，小者过而“亨”也。过以“利贞”，与时行也。柔得中，是以小事吉也。刚失位而不中，是以“不可大事”也。有飞鸟之象焉，“飞鸟遗之音，不宜上，宜下，大吉”，上逆而下顺也。\n以卦体、卦象释卦名、卦辞。阳大阴小，本卦四阴二阳，是小者过也，此原立卦名之义。“过而亨”者，言当小过之时，不容不小过，不小过则不能顺时，岂得亨？惟小者过，所以亨也。“时”者，理之当可也。时当小过而小过，乃所谓正也。亦如当大过之时，不得不大过也，故过以利贞者，与时行也。以二五言，柔顺得中，则处一身之小事能与时行矣，所以“小事吉”。以三四言，凡天下之大事，必刚健中正之君子方可为之，今失位不中，则阳刚不得志矣，所以“不可大事”。卦体内实外虚，有飞鸟之象焉，故卦辞曰“飞鸟遗之音”。“不宜上”者，上卦乘阳，且四五失位，逆也。“宜下，大吉”者，下卦承阳，且二三得正，顺也。惟上逆而下顺，所以虽小事亦宜下也，无非与时行之意。\n《象》曰：山上有雷，小过。君子以行过乎恭，丧过乎哀，用过乎俭。\n行，下并反。\n山上有雷，其声渐远，故为小过。盖当小过之时，不容不过。行不过乎恭则傲，过甚则足恭；丧不过乎哀则易，过甚则性灭；用不过乎俭则奢，过甚则废礼。惟过恭、过哀、过俭，则与时行矣。\n初六：飞鸟以凶。\n因本卦有飞鸟之象，故就“飞鸟”言之。飞鸟在两翼，而初六上六又翼之锐者也，故初与上皆言“飞”言“凶”。“以”者，因也，因飞而致凶也。\n居小过之时，宜下不宜上。初六阴柔不正，而上从九四阳刚之动，故有“飞鸟”之象。盖惟知飞于上而不知其下者也，凶可知矣。故占者凶。\n《象》曰：“飞鸟以凶”，不可如何也。\n不可如何，莫能解救之意。\n六二：过其祖，遇其妣。不及其君，遇其臣，无咎。\n“遇”字详见噬嗑六三。阳为父，阴为母，“祖妣”之象。震、艮皆一君二民，“君臣”之象。三四阳爻，皆居二之上，有祖象，有君象。初在下，有妣象，有臣象。阴四故曰“过”，阳二故曰“不及”。本卦初之与四，上之与三，皆阴阳相应，阴多阳少，又阳失位，似阴有抗阳之意，故二阳爻皆言“弗过”。此爻不应乎阳，惟与初之阴相遇，故曰“遇妣”、“遇臣”也。观九四遇五曰“遇”，上六隔五曰“弗遇”可见矣。盖遇者非正应，而卒然相逢之辞。言以阴论，四阴二阳，若孙过其祖矣，然所遇者乃妣也，非过而抗乎祖也。以阳论，二阳四阴，若不及在君，过在臣矣，然所遇者乃臣也，非过而抗乎君也。若初之于四，上之于三，则祖孙君臣相为应与，对敌而抗矣，所以初与上皆凶。此爻因柔顺中正，所以过而不过。\n本卦阴过乎阳，阴阳不可相应。六爻以阳应阴者皆曰“弗过”，以阴应阳者则曰“过之”。六二柔顺中正，以阴遇阴，不抗乎阳，是当过而不过，“无咎”之道也。故其象占如此。\n《象》曰：“不及其君”，臣不可过也。\n臣不可过乎君，故阴多阳少，不可相应。\n九三：弗过，防之，从或戕之，凶。\n“弗过”者，阳不能过乎阴也。两字绝句。本卦阴过乎阳，故二阳皆称弗过。“防之”者，当备惧防乎其阴也。从者，从乎其阴也。何以众阴欲害九三？盖九三刚正，邪正不两立，况阴多乎阳。\n九三当小过之时，阳不能过阴，故言弗过。然阳刚居正，乃群阴之所欲害者，故当防之。若不防之而反从之，则彼必戕害乎我而凶矣。故戒占者如此。\n《象》曰：“从或戕之”，“凶”如何也！\n“如何”者，言其凶之甚也，而岂可不妨阴乎？\n九四：无咎，弗过，遇之，往厉必戒，勿用永贞。\n九四与九三不同。九三位当，九四位不当，故言“咎”。“弗过”者，弗过乎阴也。“遇之”者，反遇乎阴也。三从阴在下，其性止，故惟当防；四之阴在上，阳性上行，且其性动，与之相比，故“遇”也。“往”者，往从乎阴也。“永贞”者，贞实之心长相从也。\n九四以刚居柔，若有咎矣。然当小过之时，刚而又柔正，即所谓小过也，故“无咎”。若其阳弗过乎阴，亦如其六二，但四弗过乎阴而反遇乎阴，不当往从之。若往从乎彼，与之相随，则必危厉，所当深戒，况相从而与之长永贞固乎？故又戒占者如此。\n《象》曰：“弗过遇之”，位不当也。“往厉必戒”，终不可长也。\n“位不当”者，刚居柔位。“终不可长”者，终不可相随而长久也。所以有往厉勿用之戒。旧注因不知三爻四爻“弗过”二字绝句，所以失旨。\n六五：密云不雨，自我西郊。公弋取彼在穴。\n本卦大象坎，云之象也。中爻兑，雨之象也。又兑西巽东，自西向东之象也。以丝系矢而射曰弋，坎为弓，弋之象也。又巽为绳，亦弋之象也。坎为隐伏，又坎出自穴入于穴，皆穴之象也。鸟之巢穴多在高处，今至五则已高而在上矣，故不言飞而言穴。本卦以飞鸟遗音象卦体，今五变成兑，不成震，鸟不动，在于穴之象也。“公”者，阳失位在四，五居四之上，故得称“公”也。“取彼”者，取彼鸟也。鸟既在穴，则有遮避，弋岂能取之？云“自西而东”者，不能成其雨；“弋取彼在穴”者，不能取其鸟。皆不能小过者也。盖雨之事，大则雷雨，小则微雨；射之事，大则狩，小则弋。如有微雨，是雨之小过矣。能取在穴，是弋之小过矣。今不雨不能取，是不能小过也。小畜以小畜大，小过以小过大，畜与过皆阴之得志也，故周公小过之爻辞同文王小畜之卦辞。\n本卦宜下不宜上，至外卦则上矣。五以柔居尊而不正，不能成小过之事故也。\n《象》曰：“密云不雨”，已上也。\n本卦上逆下顺，宜下不宜上。今已高在上矣，故曰“已上”也。\n上六：弗遇，过之，飞鸟离之，凶，是谓灾眚。\n此爻正与四爻相反。四曰“弗过遇之”者，言阳不能过乎阴，而与五相比，是弗过乎阴，而适遇乎阴也。此曰“弗遇过之”者，言上六隔五，不能遇乎阳，而居于上位，反过乎阳也。因相反，所以曰“弗过遇之”，曰“弗遇过之”，颠倒其辞者以此也。“离之”者，高飞远举，不能闻其音，正与飞鸟遗之音相反。凡阴多于阳者，圣人皆曰“有灾眚”，故复卦上六亦言之。\n六以阴居动体之上，处小过之极，盖过之高而亢者也。阴过如此，非阴之福也。天灾人眚荐至，凶孰甚焉。故其象占如此。\n《象》曰：“弗遇过之”，已亢也。\n亢则更在上矣。","63":"既济定也\n“既济”者，事之已成也。为卦水火相交，各得其用，又六爻之位，各得其正，故为既济。《序卦》：“有过物者必济，故受之以既济。”所以次小过。\n既济：亨小，利贞。初吉，终乱。\n“亨小”者，言不如方济之时亨通之盛大也。譬如日之既昃，不如日中之盛，所以亨小而不能大也。“利贞”者，即泰之艰贞也。日中则昃，月盈则食，无平不陂，无往不复，一治一乱，乃理数之常。方济之时，人心儆戒，固无不吉矣；及既济之后，人心恃其既济，般乐怠敖，未有不乱者。此虽气数之使然，亦人事之必然也。故利于贞。\n《彖》曰：既济亨小者，亨也。“利贞”，刚柔正而位当也。初吉，柔得中也。“终止”则“乱”，其道穷也。\n释卦名“亨小”义，又以卦体释卦辞。言“既济亨小者”，非不亨也，正当亨通之时也。但济曰既，则亨小，不如方济之时亨通之盛大矣，故曰“既济亨小者，亨也”。非不亨也，特小耳。小字生于既字。初、三、五阳居阳位，二、四、六阴居阴位，刚柔正而位当也。刚柔正即是位当，有贞之义，故曰“利贞”。初指六二，二居内卦，方济之初，而能柔顺得中，则思患深而豫防密，所以吉也。“终止则乱”者，人之常情，处平常无事之时则止心生，止则心有所怠而不复进，乱之所由起也。处艰难多事之时则戒心生，戒则心有所畏而不敢肆，此治之所由兴也。文王曰“终乱”，孔子曰“终止则乱”，圣人赞《易》之旨深矣。“其道穷”者，以人事言之，怠胜敬则凶，此人道之理穷也，以天运言之，盛极则必衰，此天道之数穷也。以卦体言之，水在上终必润下，火在下终必炎上，此卦体之势穷也。今当既济之后，止心既生，岂不终乱，故曰“其道穷”。\n《象》曰：水在火上，既济。君子以思患而豫防之。\n“患”者，蹇难之事，象坎险。“防”者，见几之事，象离明。思以心言，豫以事言。“思患”者，虑乎其后，“豫防”者，图之于先。能如此，则未雨而彻桑土，未火而徙积薪。天下之事莫不皆然，非但既济当如此也。\n初九：曳其轮，濡其尾，无咎。\n坎为轮，为狐，为曳，轮狐曳之象也。初在狐之后，尾象；在水之下，濡象。若专以初论，轮在下，尾在后，皆初之象。“濡其尾”者，垂其尾于后而沾濡其水也。舆赖轮以行，曳其轮则不前；兽必揭其尾而后涉，濡其尾则不济。皆不轻举妄动之象也。“无咎”者，能保其既济也。\n初九当既济之时，尚在既济之初，可以谨戒而守成者。然初刚得其正，不轻于动，故有“曳轮濡尾”之象。以此守成，无咎之道，故其象占如此。\n《象》曰：“曳其轮”，义无咎也。\n以此守成，理当无咎。\n六二：妇丧其茀，勿逐，七日得。\n茀，音拂，草盛蔽道也，又妇人车旁设蔽，以御风尘者。《诗》：“翟茀以朝。”\n二乃阴爻，离为中女，妇之象也。又应爻中男，乃五之妇也。“茀”者，车后茀也，即今舟车篷之类，所以从艸。坎为舆，离中虚，“茀”之象也。坎为盗，离持戈兵，“丧茀”之象也。此与屯卦六二相同。屯乘刚，故邅如班如。此则乘承皆刚，故“丧其茀”矣。妇人丧其茀，则无遮蔽，不能行矣。变乾居一，前坎居六，离为日，七日之象也。“勿逐自得”者，六二中正，久则妄求去正应合，所以“勿逐自得”也。又详见睽卦初九。若以理数论，阴阳极于六，七则变矣。时变则自得，盖变则通之意。\n二以中正之德，而上应中正之君，本五之妇也。但乘承皆刚，与五不得相合，故有妇丧茀不能行之象。然上下中正，岂有不得相合之理，但俟其时耳。故又戒占者勿可追逐，宜令其自得也，又有此象。\n《象》曰：“七日得”，以中道也。\n中道者，居下卦之中，此六二之德也。济世之具在我，故不求自得。\n九三：高宗伐鬼方，三年克之。小人勿用。\n离为戈兵，变爻为震，戈兵震动，伐国之象也。鬼方者，北方国也，夏曰“獯鬻”，商曰“鬼方”，周曰“猃狁”，汉曰“匈奴”，魏曰“突厥”。三与上六为应，坎居北，故曰“鬼方”。坎为隐伏，鬼之象也。三变中爻为坤，方之象也。周公非空取“鬼方”二字也。离居三，三年之象也。三变阴，阳大阴小，小之象也。三居人位，“小人”之象也。即变中爻成艮止，勿用之象也。周公爻象一字不空，此所以为圣人之笔也。\n既济之时，天下无事矣。三以刚居刚，故有伐国之象。然险陷在前，难以骤克，故又有三年方克之象。夫以高宗之贤，其用兵之难如此，而况既济无事之世任用小人，舍内治而幸边功，未免穷兵厉民矣。故既言用兵之难，不可轻动，而又言任人不可不审也。教占者处既济之时当如此，戒之深矣。\n《象》曰：“三年克之”，惫也。\n惫，蒲败反。\n“惫”者，病也，时久师老，财匮力乏也。甚言兵不可轻用。\n六四：有，衣袽，终日戒。\n，音如。旧注曰“濡”也。袽，音茹。絮缊所以塞舟也。\n凡帛可以言。“袽”者，敝衣也。四变中爻为乾，衣之象也，错坤为帛，之象也。又成兑为毁折，敝衣之象也。成卦为既济，本爻又得位，犹人服饰之盛也。济道将革，不敢恃其服饰之盛，虽有不衣之，而乃衣其敝衣也。“终日”，尽日也。居离日之上，离日已尽之象也。“戒”者，戒惧不安也。四多惧，戒之象也。“衣袽”以在外言，终日戒以心言。\n六四当出离入坎之时，阴柔得正，知济道将革，坎陷临前，有所疑惧，故有有不衣，乃衣其袽，终日戒惧之象。占者必如是，方可保既济也。\n《象》曰：“终日戒”，有所疑也。\n“疑”者，疑祸患之将至也。\n九五：东邻杀牛，不如西邻之禴祭，实受其福。\n“邻”者，文王圆图离居正南，坎居正北，震居正东，兑居正西，则东西者乃水火之邻也，故有东西之象。观震卦上六变离，爻辞曰“不于其躬于其邻”，则震、兑又以南北为邻矣。“杀牛”不如“禴祭”者，言当既济之终，不当侈盛，当损约也。五变坤，牛之象。离为戈兵，坎为血，见戈兵而流血，杀之象。“禴”，夏祭，离为夏，禴之象。坎为隐伏，人鬼之象。又为有孚，诚心祭人鬼之象。“杀牛”盛祭，“禴”薄祭。“实受其福”者，阳实阴虚，阳大阴小，《小象》曰“吉大来也”，“大”字即“实”字，“吉”字即“福”字，大与实皆指五也。言如此损约，则五吉而受其福矣。泰入否，圣人曰“勿恤其孚，于食有福”，既济将终，圣人曰“不如禴祭，实受其福”，圣人之情见矣。六四不衣美衣，而衣恶衣，九五不尚盛祭而尚薄祭，皆善与处终乱者也。\n五居尊位，当既济之终，正终乱之时也，故圣人戒占者曰：济将终矣，与其侈盛，不如艰难菲薄，以亨既济之福，若侈盛则止而乱矣。故其占之之象如此。\n《象》曰：“东邻杀牛”，“不如西邻”之时也。“实受其福”，吉大来也。\n“之”当作知，因与音同，写时之误。“时”即“二簋应有时”之时。言“东邻杀牛”不如“西邻知时”也。盖济道终乱之时，此何时哉？能知其时，艰难菲薄以处之，则自有以享其既济之福矣。“吉大来”者，言吉来于大也。“来”字与益卦“自外来也”“来”字同。\n上六：濡其首，厉。\n初九卦之始，故言“濡尾”者，心有所畏惧而不敢遽涉也。上六卦之终，故言“濡首”者，志已盈满而惟知其涉也。大过上六，泽水之深矣，故“灭顶”；既济上六，坎水之深矣，故“濡首”。\n既济之极，正终乱之时也，故有狐涉水而濡首之象。既濡其首，已溺其身，占者如是，危可知矣。\n《象》曰：“濡其首，厉”，何可久也！\n言必死亡。","64":"未济男之穷也\n未济，事未成之时也。水火不交不相为用，其六爻皆失其位，故为“未济”。《序卦》：“物不可穷也，故受之以未济终焉。”所以次既济。\n未济：亨。小狐汔济，濡其尾，无攸利。\n“亨”者，言时至则济矣，特俟其时耳，故“亨”也。坎为狐。以居下卦，故曰“小狐”。坎为水，为隐伏，穴处而隐伏，往来于水间者狐也。又为心病，故多狐疑。既济、未济二卦皆以“狐”言者，此也。水涸曰“汔”，此指济渡水边水浅处言也。“濡其尾”者，言至中间深处，即“濡其尾”而不能涉矣。此未济之象也。“无攸利”，戒占者之辞。\n言未济终于必济，故“亨”。然岂轻于济而得亨哉！如小狐不量水中之浅深，见水边之浅涸，果于必济，及济于水中乃“濡其尾”，而不能济矣，如此求济，岂得济哉！占者“无攸利”，可知矣。故必识浅深之宜，持敬畏之心，方可济而亨也。\n《彖》曰：未济，亨，柔得中也。“小狐汔济”，未出中也。“濡其尾，无攸利”，不续终也。虽不当位，刚柔应也。\n释卦辞。柔得中指六五。阴居阳位得中，则既不柔弱无为，又不刚猛偾事。未济终于必济，所以亨。前卦既济之“初吉”者，已然之亨也，柔中之善于守成者也。此卦未济之亨者，未然之吉也，柔中之善于拨乱者也。“未出中”者，言止于水边涸处济之，而未能出其险陷之中也。济而得济谓之“终”，今“未出中”，则始虽济而终不能济，是不能继续而成其终矣。然岂终于不济哉？盖六爻虽失位，初为“未济”，然刚柔相应，终有协力出险之功，是未济终于必济，此其所以亨也。\n《象》曰：火在水上，未济。君子以慎辨物居方。\n火炎上，水润下，物不同也。火居南，水居北，方不同也。君子以之“慎辨物”，使物以群分，“慎居方”，使方以类聚，则分定不乱，阳居阳位，阴居阴位，未济而成既济矣。\n君子小人，皆当位，正未济求济。要用不当位，则小狐濡尾矣。\n初六：濡其尾，吝。\n兽之济水，必揭其尾，尾濡则不能济。“濡其尾”者，言不能济也。\n初六才柔，又无其位，当未济之时，乃不量其才力，而冒险以进，不能济矣，吝之道也。故其象占如此。\n《象》曰：“濡其尾”，亦不知极也。\n此小狐汔济也。\n“极”者，终也，即彖辞“濡其尾，无攸利，不续终”也。言不量其才力而进，以至“濡其尾”，亦不知其终之不济者也。\n九二：曳其轮，贞吉。\n坎为轮。“曳其轮”者，不遽然而进也。凡济渡必识其才力，量其浅深，不遽于进，方可得济，不然必“濡其尾”矣。“贞”者，得济之正道也。“吉”者，终得以济也。\n二以阳刚之才，当未济之时，居柔得中，能自止而不轻于进，故有“曳其轮”之象。占者如是，正而吉矣。\n《象》曰：九二“贞吉”，中以行正也。\n九居二本非其正，以中故得正也。\n六三：未济，征凶，利涉大川。\n“未济”者，言出坎险可以济矣，然犹未济也，故曰“未济”。“利涉大川”者，正卦为坎，变卦为巽，木在水上，乘木有功，故“利涉大川”。“征”者，行也。初“濡其尾”，行而未济也。二“曳其轮”，不行也。故至于三，则坎之极，水益深矣，故必赖木以渡之，方可济也。若不赖木而直行，则“濡其尾”而“凶”矣。\n阴柔不中正，当未济之时，病于才德之不足，故“征凶”。然未济有可济之道，险终有出险之理，幸而上有阳刚之应，若能涉险而往赖之，则济矣，故占者利于赖木以“涉大川”。“利涉大川”，又占中赖阳刚之象也。\n《象》曰：“未济，征凶”，位不当也。\n以柔居刚。\n九四：贞吉，悔亡。震用伐鬼方，三年有赏于大国。\n“震”者，惧也。“四多惧”，四变中爻为震，故以震言之。“伐鬼方三年”，详见既济。“大国”对“鬼方”而言，则伐之者为大国，鬼方为小国也。“有赏于大国”者，三年鬼方自顺服，故大国赏之。惟其有赏，故不言“克之”也。既济言克之者，鬼方在上，仰关而攻，克之甚难，且水乃克火之物，火又在下，所以三年方克。《小象》曰“惫者”，此也。此则鬼方在下，易于为力，故自屈服。曰有赏者，如上之赏下也。未济与既济相综，未济九四即既济九三，故爻辞同。亦如损、益相综，损之六五即益之六二；夬、姤相综，夬之九四即姤之九三，所以爻辞皆同也。综卦之妙至此。\n以九居四，不正而有悔也。能勉而贞，则吉而悔亡矣。然以不贞之资，非临事而惧，何以能济天下之事哉！故必忧惕敬惧而震，则其志可行，而有以赏其心志矣。故占者又有“震用伐鬼方，三年有赏于大国”之象。\n《象》曰：“贞吉，悔亡”，志行也。\n“志行”者，已出其险，济之之志行也。履之九四、否之九四、睽之九四皆言志行，以“四多惧”故也。\n六五：贞吉，无悔。君子之光，有孚，吉。\n贞非戒辞，乃六五之所自有。“无悔”与“悔亡”不同。“无悔”者，自无悔也；“悔亡”者，有悔而亡也。未济渐济，故虽六五之阴而亦有“晖光”。既济渐不济，故虽九五之阳而必欲如“西邻之禴祭”。凡天地间造化富贵功名，类皆如此。\n六五为文明之主，居中应刚，虚心以求九二之共济，贞吉无悔矣。故本之于身则光辉发越，征之于人则诚意相孚，吉不必言矣。占者有是德，方应是占也。文明即君子之光，中虚即有孚。\n《象》曰：“君子之光”，其晖吉也。\n日光曰晖，言如日光之盛。盖六五承应皆阳刚，君子相助为明，故“其晖吉”。\n上九：有孚于饮酒，无咎。濡其首，有孚失是。\n六爻皆有酒象。《易》中凡言“酒”者皆坎也。上三爻离错坎，亦酒也。“是”字即“无咎”二字。“濡其首”者，三也。坎水至三，坎水极深矣，故涉之者濡其首。既济之上六即未济之六三也，既济言“濡其首”，故上九与六三为正应，即以“濡其首”言之。\n六五为未济之主，资九二之刚中，三涉川，四伐国，至于六五光辉发越，已成克济之功矣。上九负刚明之才，又无其位，果何所事哉？惟有孚于五，饮酒宴乐而已。此则近君子之光，所“有孚”者是矣，“无咎”之道也。若以濡其首之三为我之正应，乃有孚于三，与之饮酒则坠落于坎陷之中，与三同“濡其首”，所“有孚饮酒”者不见矣，安得“无咎”哉！故曰“有孚失是”。教占者必如此。\n《象》曰：“饮酒”濡首，亦不知节也。\n“节”者，事之界也。濡首同于六三，亦不知三在坎险之界而自罹其咎矣。"};

var ZHANG = {"1":"乾下乾上。乾元亨，利贞。初九，潜龙勿用。九二，见龙在田，利见大人。九三，君子终日乾乾，夕惕若厉，无咎。注谓阳息至三，二变成离，离为日，坤为夕，得位，故曰君。三终体，故曰终日。乾成泰尽，否道将反，体复初，接乾生乾，故曰乾。乾体坎为惕，厉，危也。泰否九四，或跃在渊，无咎。九五，飞龙在天，利见大人。注谓四已变，则五体离，离为飞，五在天，故飞龙在天，利见大人也。物致用以利天下，故曰飞龙在天，天下之所利见也。上九，亢龙有悔，用九，见群龙，无首吉。彖曰：大哉乾元，万物资始，乃统天。云行雨施，品物流形。注已成既济，上坎为云，下坎为雨，故云行雨施。乾以云雨流坤之形，万物化成，故曰品物流形也。大明终始，六位时成，时乘六龙以御天。乾道变化，各正性命，保合大和，乃利贞。首出庶物，万国咸宁。安震而阴静，易以阴从阳，故于发其义。象曰：天行健，君子以自强不息。注君子谓三。乾健，故强。天一一夜过周一度，故强不息。老子曰：自胜者强。潜龙勿用，阳在下也。见龙在田，德施普也。终日乾乾，反复道也。注至三体复，故反复道。谓否泰反其类也。或跃在渊，进无咎也。飞龙在天，大人造也。亢龙有悔，盈不可久也。用九，天德不可为首也。文言曰：元者，善之长也；亨者，嘉之会也；利者，义之和也，贞者，事之干也。君子体仁足以长人，嘉会足以合礼，利物足以和义，贞固足以干事。君子行此四德者，故曰乾元亨利贞。初九曰：潜龙勿用。何谓也？子曰：龙德而隐者也。不易世，不成名，遁世无闷，不见是而无闷。乐则行之，忧则违之，确乎其不可拔，潜龙也。注阳出初震，为乐、为行，故乐则行之。坤死称忧，隐在坤中，遁世无闷，故忧则违之也。确，刚貌也。乾刚潜初，坤乱于上，君子勿用，隐在下位，确乎难拔，潜龙之志也。九二曰：见龙在田，利见大人。何谓也？子曰：龙德而正中者也。注中，下之中。二非阳位，故明言能正中也。庸言之信，庸行之谨，闲邪存其诚，善世而不伐，德博而化。易曰：见龙在田，利见大人，君德也。注阳始触阴，当升五为君，时舍于二，宜利天下，直方而大，德无不利。九三曰：君子终日乾乾，夕惕若厉，无咎。何谓也？子曰：君子进德修业。注乾为德，坤为业，以乾通坤，谓为进德修业。忠信，所以进德也。修辞立其诚，所以居业也。知至至之，可与言几也。知终终之，可与存义也。是故居上位而不骄。注天道三才，一乾而以至三，乾成，故为上。夕惕若厉，故不骄也。在下位而不忧。注下位谓初，隐于初，忧则违之，故不忧。曰：或跃在渊，无咎。何谓也？子曰：上下无常，非为邪也。进退无恒，非离群也。君子进德修业，欲及时也，故无咎。九五曰：飞龙在天，利见大人。何谓也？子曰：同声相应。注谓震、巽也。庖牺观变而放八卦，雷风相薄，故相应也。同气相求，注谓艮兑，山泽通气，故相求也。水流湿，火就燥。注离上而坎下，水火不相射。云从龙，风从虎。注乾为龙，云生天，故从龙也。坤为虎，风生地，故从虎也。以摩刚柔。也。初震二巽，贞地位，故同声相应。艮。圣人作而万物睹。注睹，见也。圣人则庖牺合德乾五，造作八卦，以通神明之德，以类万物之情。五动成离，日出照，物皆相见，故曰圣人作而万物睹也。本乎天者亲上，本乎地者亲下，则各从其类也。注方以类聚，物以群分。乾道变化，各正性命，触类而长，故各从其类。上九曰：亢龙有悔。何谓也？子曰：贵而无位，高而无民，贤人在下位而无辅，是以动而有悔也。潜龙勿用，下也。见龙在田，时舍也。注二非王位，时暂舍也。终日乾乾，行事也。或跃在渊，自试也。飞龙在天，上治也。下亢龙有悔，穷之灾也。乾元用九，天下治也。潜龙勿用，阳气潜藏；见龙在田，天下文明。终日乾乾，与时偕行。或跃在渊，乾道乃革。飞龙在天，乃位乎天德。亢龙有悔，与时偕极。乾元用九，乃见天则。乾元者，始而亨者也。注乾始开通，以阳通阴，故始通。利贞者，性情也。乾始而以美利利天下。注美利，谓云行雨施，品物流形，故利天下也。不言所利，大矣哉。注天何言哉？四时行焉，百物生焉，故利者大也。大哉乾乎！刚健中正，纯粹精也。六爻发挥，旁通，情也也。君子以成德为行，日可见之行也。注谓初乾称君子。阳出成为上德，新之谓上德，故日可见之行。潜之为言也，隐而未见，行而未成，是以君子弗用也。君子学以聚之，问以辩之。注谓二之问以辩之。兑象。君子以朋友讲习，宽以居之，仁以行之。注震为宽，仁为行，谓居宽行仁，德博而化也。易曰：见龙在。田，利见大人，君德也。注重言君德者，大人善世不伐，信有君德，后天而奉天时，故详言之。九三，重刚而不中。注以乾接乾，故重刚。位非二五，故不中也。上不在天，下不在田，故乾乾因其时而惕，虽危无咎矣。九四，重刚而不中，上不在天，下不在田，中不在人，故或之。或之者，疑之也，故无咎。注非其位，故疑之也。夫大人者，谓与天地合其德，与日月合其明，与四时合其序，与鬼神合其吉凶。注谓乾神合吉，坤鬼合凶。以乾之坤，故与鬼神合其吉凶。先天而天弗违。注乾为天，为先。大人在乾五，乾五之坤五，天象在先，故先天而天弗违。自后天而奉天时。注奉，承行。乾三之坤，初成震具，故后天而奉天时。行，顺也。天且弗违，况于人乎，况于鬼神乎？亢之为言也，知进而不知退，知存而不知亡，知得而不知丧，其唯圣人乎！知进退存亡而不失其正者，其唯圣人乎！䷁","2":"坤下坤上。坤元亨，利牝马之贞。注谓阴极阳生，乾流坤形，坤含光大，凝乾之元，终于坤亥，出乾初子，品物咸亨，故元亨也。坤为牝，震为马，初动得正，故利牝马之贞矣。君子有攸往，先迷，后得主，利西南得朋。初六，履霜坚冰至。六二，直方大，不习无不利。六三，含章可贞。注贞，正也。以阴包阳，故含章。三失位，发得正，故可贞也。或从王事，无成有终。注谓三巳发成泰。乾为王，坤为事，震为从，地道无成而有终，故无成有终。六四，括囊，无咎，无誉。注括，结也。谓泰反成否，为囊，承五在四，故无誉。六五，黄裳，元吉。上六，龙战于野，其血元黄，亥之间乾。交位也。乾象既盈，坤道至盛，阳功既讫，当反入坤。震牝乾，坤德乃备，故龙战也。说卦曰：战，用六，利永贞。彖曰：至哉坤元，万物资生。元乃顺承天。坤厚载物，德合无疆。含宏光大，品物咸亨。牝马地类，行地无疆。柔顺利贞，君子攸行。先迷失道，后顺得常。西南得朋，乃与类行。注谓阳得其类。月朔至望，从震至乾，与时偕行，故乃与类行。东北丧朋，乃终有庆。注阳丧灭坤，坤终复生，谓月三日，震象出庚，故乃终有庆。此指说易道阴阳消息之大要也。谓阳句月三日，变而成震，出庚成兑，见丁，君子以朋友讲习。文言曰：敬义立而德不孤。彖曰：乃与类行。二十九日，消乙入坤，灭藏于癸，乙东癸北，故东北丧朋。马君南得朋，孟春之月，阳气始著，阴始从阳，失其党类，故东北丧朋。失之甚矣。而荀君得朋。阳起于子，至寅，三阳丧坤一体，故东北丧朋。就如荀说，从午至申，经当言南西得朋，子至寅，当言北东丧朋。以乾变坤而言丧朋，经以乾卦为丧耶？此何异于马也。安贞之吉，应地无疆。注：坤道至静，故安。复初得正，故贞吉。震为应，阳正于初，以承坤阴，地道应，故应地无疆。象曰：地势坤，君子以厚德载物。注势，力也。君子，谓乾阳为德。动在坤下，君子之德车，故厚德载物。老子曰：胜人者有力也。履霜坚冰，阴始凝也。驯致其道，至坚冰也。六二之动，直以方也。不习无不利，地道光也。含章可贞，以时发也。或从王事，知光大也。括囊无咎，慎不害也。黄裳元吉，文在中也。龙战于野，其道穷也。用六永贞，以大终也。文言曰：坤至柔而动也刚，至静而德方，后得主而有常。注坤阴先迷，后顺得常。阳出初震为主，为常也。含万物而化光，坤道其顺乎！承天而时行。积善之家，必有余庆。注谓初乾为积善，以坤牝阳灭，出复震为余庆，谓东北丧朋，乃终有庆也。积不善之家，必有余殃。注坤积不善，以臣弑君，以乾通坤，极遘生巽，为余殃也。臣弑其君，子弑其父。注坤消至二成否。坤臣弑君，上下不交，天下无邦，故子弑父，臣弑君也。非一朝一夕之故，其所由来者渐矣。注刚爻为朝，柔爻为夕，乾为寒，坤为暑，相推而成岁焉，故非一朝一夕，所由来渐矣，由辩之不早辩也矣。易曰：履霜坚冰至，盖言顺也。直其正也，方其义也。注谓二方，谓辟阴开为方。坤其静也翕，其动也闱，故方其义也。君子敬以直内，义以方外，敬义立而德不孤。注阳息在二，故敬以直内。坤位在外，故义以方外。谓阳见兑丁，西南得朋，乃与类行，故德不孤。孔子曰：必有邻也。直方大，不习无不利，则不疑其所行也。阴虽有美，含之以从王事，弗敢成也。地道也，妻道也，臣道也，地道无成而代有终也。天地变化，草木蕃。注谓阳息坤成泰，天地反震，故天地变化，草木蕃矣。天地闭，贤人隐。注谓四，泰反成否，乾称贤人，隐藏坤中，以俭德避难，不荣以禄，故贤人隐矣。易曰：括囊，无咎无誉。盖言谨也。君子黄中通理，正位居体。注谓五，坤禄息体观，地色黄，坤为理，以乾通坤，故称通理。五正阳位，故曰正位。艮为居，故曰黄中通理，正位居体。美在其中，而畅于四支。注阳称。美在五中，四支谓股肱，发于事业，美之至也。阴凝于阳必战，为其兼于阳也，故称龙焉。犹未离其类也，故称血焉。夫元黄者，天地之杂也，天元而地黄。䷂。","3":"震下坎上。屯，元亨，利贞。注：坎二之初，贞矣。勿用有攸往，利建侯。注之外称往。初震得正，起之欲应，动而失位，故勿用有攸往。震为侯。初九：盘桓，利居贞，利建侯。注：震起艮止，动乎险中，故盘桓。得正得民，故利居贞。谓君子居其室，慎密而不出也。六二，屯如邅如，乘马班如。注：屯邅、盘桓，谓初也。震为马，作足，二乘初，故乘马。班，踬也。马不进，故班如矣。年乃字。注：匪，非也。寇谓五。坎为寇盗，应在坎，故匪寇。位变复体离为坤，离象不见，故女子贞不字。坤数十，女大腹，故十年反常。乃字，谓成既济定也。六三，即鹿无虞，惟入于林中。注：即，就也。虞，谓虞人掌禽兽者。艮为山，山足称鹿。鹿，林也。三变体坎，坎为丛木，山下，故称林中。坤为兕虎，震为麋鹿，又为惊走，艮为狐狼，故曰即鹿无虞，惟入林中矣。君子几不如舍，往吝。注君子，谓阳己正位，几，近，舍置。吝，疵也。三应于上之应，历险不可以往，动如失位，故不如舍之，往必吝穷矣。六四，乘马班如。注：乘，三也。谓三已变坎为马，故曰乘马。马在险中，故班如也。或说乘初，初为建侯，安得乘之也。求婚媾，往吉无不利。注之外称往。九五屯其膏。注：坎雨称膏。诗云：阴雨膏之。是其义也。小贞吉，大贞凶。上六，乘马班如。注：乘五也。坎为马，震为行，艮为止，马行而止，故班如也。泣血涟如。注：谓三变时，离为目。坎为血，震为出，血流出目，故泣血涟如。彖曰：屯，刚柔始交而难生。注乾刚坤柔，坎二交初，故始交。确乎难拔，故难生也。动乎险中，大亨贞。雷雨之动，满形。注震雷坎雨，坎水流坤，故满形。天造草昧，宜建侯而不宁。注造，造，生也。草草，创物也。坤冥为昧，故天造草昧。成既济定，故曰不宁，言宁也。象曰：云雷屯，君子以经论。虽盘桓，志行正也。行以贵下贱，大得民也。六二之难，乘刚也。十年乃字，反常也。即鹿无虞，以从禽也。君子舍之，往吝，穷也。求而往，明也。注体离，故明也。屯其膏，施，未光也。注阳陷阴中，故未光也。泣血涟如，何可长也。注柔乘于刚，故不可长也。䷃","4":"坎下艮上。蒙亨。注艮三之二，亨，谓二震。刚柔接蒙，亨以通行，时中也。匪我求童蒙，童蒙求我。注童蒙谓五。艮为童蒙，我谓二也。震为动，起，嫌求之五，故曰匪我求童蒙。五阴求阳，故童蒙求我。志应也。艮为求。二体师象，坎为经，谓礼有来学，无往教。初筮告，再三渎，渎则不告，应有筮义也。初筮，谓初问于也。初承二，顺于师，初发成兑，说也。谓四。三逆乘，非正也。四远实，故利贞。注二五失位，利变之正，故利贞。蒙以养正，圣功也。初六，发蒙，利用刑人。用说桎梏，以往吝。注发蒙之正，初为蒙始，而失其位，发蒙之正以成兑。兑为刑人，坤为用，故曰利用刑人矣。坎为穿木，震足艮手，互与坎连，故称桎梏。初发成兑，兑为说，坎象毁坏，故曰用说桎梏。之应历险，故以往吝。吝，小疵也。九二，包蒙吉，纳妇吉，子克家。注坤为包，应五据初。初与三、四同体，包养四阴，故包蒙吉。震刚为夫，伏舆为妇。二以刚接柔，故纳妇吉。二称家，故有子克家也。六三，勿用取女，见金夫，不有躬，无攸利。注谓三，诫上也。金夫谓二。初发成兑，故三称如。兑为见，阳称金，震为夫。三逆乘二阳，所行不顺，为二所淫，故曰勿用取女，见金夫矣。坤身称躬。三为二所乘，兑泽动下，不得之应，故不有躬。失位多凶，故无攸利也。六四，困蒙，吝。六五，童蒙吉。注艮为童蒙，处贵承上也。上九，击蒙，不利为寇，利御寇。注：体艮为手，故击。亦变。上动成坎，称寇，而逆乘阳，故不利为寇矣。御，止也。此寇谓二。坎为寇，巽为高，艮为山，登山备下，顺有师象，故利御寇也。彖曰：蒙，山下有险，险而止。蒙。蒙，亨，以亨行，时中也。蒙求我，志应也。初筮告，以刚中也。再三渎，渎则不告。渎蒙也。蒙以养正，圣功也。注体颐，故养五多功。圣谓二。二志应五，变得正而亡其蒙，故圣功也。象曰：山下出泉。蒙。注：艮为山，震为出，坎泉流出，故山下出泉。君子以果行育德。注君子谓二。艮为果，震为行。育，养也。二至上，有颐养象，故以果行育德也。利用刑人，以正法也。注坎为法，初发之正，故正法也。子克家，刚柔接也。勿用取女，行不顺也。注失位乘刚，故行不顺也。困蒙之吝，独远实也。童蒙之吉，顺以巽也。利用御寇，上下顺也。注自上御下，故顺也。䷄","5":"乾下坎上。需。有孚，光亨，贞吉。注：大壮四之五，孚谓五孚。离日为光。四之五，得位正中，故光亨。贞吉，谓壮于大𬛼之辐也。利涉大川。注谓二失位，变而涉坎，坎为大川。得位应五，故利涉大川。初九，需于郊，利用恒，无咎。九二：需于沙，小有言，终吉。注沙谓五。水中之阳称沙也。二变之阴称小。大壮震为言，兑为口，四之五，震象半见，故小有言。二变应之，故终吉。九三，需于泥，致戎至。六四。需于血，出自穴。九五，需于酒食，贞吉。上六，入于穴，有不速之客，三人来，敬之，终吉。彖曰：需，须也，险在前也。刚健而不陷，其义不困穷矣。需，有孚，光亨，贞吉。位乎天位，以正中也。利涉大川，往有功也。注五多功，故往有功也。象曰：云上于天。需。君子以饮食宴乐。注君子谓乾。坎水，兑口，水流入为饮。二失位，变体噬嗑为食，故以饮食。阳在内称宴。大壮震为乐，故宴乐也。需于郊，不犯难，行也。利用恒，无咎，未失常也。需于沙，衍在中也。注衍，流也。中谓五也。虽小有言，以吉终也。需于泥，灾在外也。我致戎，敬慎不败也。注离为戎，乾为敬。阴消至五，遁，臣将弑君，坤，故敬慎不败。需于血，顺以听也。酒食贞吉，以中正也。不速之客来，敬之终吉。虽不当位，未大失也。䷅","6":"坎下乾上。讼。有孚窒句，惕，中吉。注：遁，三之二也。孚谓二。窒，塞，止也。二失位，故不言贞。遁将成否，则子弑父，臣弑君，三来之，二得中，弑不得行，故中吉也。终凶。注二失位，终止不变，则入于渊，故终凶也。利见大人，不利涉大川。变应之，成未济。坎为大川，故不利涉大。初六，不永所事，小有言，终吉。注：永，长也。坤为事。初失位而为讼始。三食旧德，震象半见，故小有言。初变得正，故终吉也。九二，不克讼，归而逋。注谓与四讼。坎为隐伏，故逋。乾位刚在上，坎濡失正人，三百户。无眚。注眚，灾也。坎为眚，谓二变应五。乾为百，坤为户，三爻，故三百户。坎化为坤，故无眚。六三，食旧德，贞厉，终吉。注乾为旧德。食，谓初、四。二己变之正。三动得位，体噬嗑食。四变食乾，故食旧德。三变在坎，正危，贞厉得位，故终吉也。或从王事，无成。注：乾为王，二变否时，坤为事，故或从王事。或三道无成，而代有终。无成，坤三同义也。九四，不克讼，复即命渝，安贞吉。注：失位，故不克讼。渝，变也。不克讼，成巽位，故安。贞吉。谓二已变坤，安也。九五，讼元吉。上九，或锡之鞶带。注：锡，谓王之锡命。鞶带，大带，男子鞶革。初、四己易位，三二之正，巽为腰带，故鞶带。终朝三拖之。注位终乾上二变。时坤为终，离为日，乾为甲，日出甲上，故称朝。应在三，三变时，艮为手，故终朝三拖之。使变，应巳，则去其鞶带。体坎乘阳，故象曰不足敬也。彖曰：讼，上刚下险，险而健。讼。讼，有孚，窒惕中吉，刚来而得中也。终凶，讼不可成也。利见大人，尚中正也。不利涉大川，入于渊也。长。象曰：天与水违行。讼，君子以作事谋始。注君子，谓来变坤为作事，坎为谋。乾知大始，故以作事谋始。不永所事，讼不可长也。虽小有言，其辩明也。不克讼，归逋，窜也。自下讼上，患至掇也。食旧德，从上吉也。复即命，渝，安贞吉，不失也。讼元吉，以中正也。以讼受服，亦不足敬也。注服谓鞶带，终朝见拖。乾象毁坏，故不足敬䷆。","7":"坎下坤上。师贞，大人句吉，无咎，咎。初六，师出以律，否臧凶。九二，在师中吉，无咎，王三锡命。六三，师或舆尸，凶。注：坎为尸，坎为车，多眚。同人。离为戈兵，为折首。失位乘刚无应，尸在车上，故舆尸凶矣。六四，师左次，无咎。六五，田有禽，利执言，无咎。注田谓二，阳称禽。震为言。五失位，变之正，艮为执，故利执言无咎。长子帅师，注长子谓二，震为长子，在师中，故帅师也。弟子舆尸，贞凶。注弟子谓三。三体坎，体坎，震之弟，而乾之子，失位乘阳，逆，故贞凶。上六，大君有命。注同人，乾为大君，巽为有命。开国承家。注：承，受也。坤为国，二称家，谓变乾为坤。承家。小人勿用注阴称小人。坤虚无君，体迷复凶。坤成乾，灭以弑君，故小人勿用。彖曰：师，众也。贞，正也。能以众正，可以王矣。注坤为众，谓二失位，变之五为比，故能以众正，乃可以王矣。刚中而应，行险而顺，以此毒天下而民从之，吉又何咎矣。象曰：地中有水。师。君子以容民畜众。注君子谓二。容，宽也。坤为民，众，又畜养也。阳在二，宽以居之，故以容民畜众矣。师出以律，失律凶也。在师中吉，承天宠也。王三锡命，怀万邦也。师或舆尸，大无功也。左次无咎，未失常也。长子帅师，以中行也。弟子舆尸，使不当也。大君有命，以正功也。注谓五多功。五动正位，故正功也。小人勿用，必乱邦也。注坤反君道，故乱邦也。䷇","8":"坤下坎上，比吉。注：师二上之五得位，众阴顺从，比而辅之，故吉。与大有旁通。原筮，元永贞，无咎，不宁方来。注水性流动，故不宁。坤阴为方，上下应之，故方来也。后夫凶。注后谓上，夫谓五也。坎为后，艮为背。上位在背后，无应乘阳，故后夫凶也。初六，有孚，比之，无咎。注孚谓五。有它吉。注坤器为缶，坎水流，坤初动成屯。屯者盈也，故盈。缶终变得正，故终来。有它吉，在内称来也。六二，比之自内，贞吉。六三，比之匪人。注匪，非也。失位无应，三又多凶，体剥伤，象弑父弑君，故曰匪人。六四，外比之，贞吉。注：在外体，故称外。得位比贤，故贞吉也。九五，显比。注：五贵多功，得位正中。初、三以变体重明，故显比，谓显诸仁也。亦王用三殴，失前禽。注：坎五称王。三殴，谓殴下三阴，不及于初，故失前禽。谓初已变成震，震为鹿，为惊走，鹿之斯奔，则失前禽也。邑人不戒，吉。注坤为邑，师，震为人。师时坤虚，无君使师二，上居五中，故不戒告也。上六，比之无首，凶。注首，始也。阴道无成而代有终，无首凶。彖曰：比，吉也。比，辅也，下顺从也。原筮，元，永贞无咎，以刚中也。不宁方来，上下应也。后夫凶，其道穷也。象曰：地上有水。比。水。先王以建万国，亲诸侯。注先王谓五。初阳己。震为建、为诸侯。坤为万国，为腹，坎为心，腹心亲比，故以建万国，亲诸侯。诗曰：公侯腹心，是其义也。比之初六，有它吉也。比之自内，不自失也。阳显比之吉，位正中也。注谓离象明正，上中也。舍逆取顺，失前禽也。注背上六，故舍逆，据三阴故取顺；不及初，故失前禽。邑人不戒，上使中也。注谓二使师。二上居五中。比之无首，无所终也。注迷失道，故无所终也。周易虞氏义卷之一周易虞氏义卷之二张惠言学周易上经彖上传、象上传虞氏注三。三乾下与上","9":"小畜注需上变为巽，与豫雱通。豫四之坤，初为复。小通萃、房通蹇、睽、秀通。卦豫、需来云需畜、复。小阳潜畜亨。注二失位，五刚中正，二变应之，故志行乃亨也。密云不雨，注密，小也。兑为密。需，坎升天为云，坠地称雨。上变为阳，坎象半见，故密云不雨。上往也。自我西郊。注豫，坤为自我，兑为西，乾为郊，雨生于西，故自我西郊。初九，复自道，何其咎吉。注谓从豫四之初，成复卦，故复自道。出入无疾，朋来无咎。何其咎吉。九二，牵复吉。九三，车说輹。注豫，坤为车为輹，至三成乾，坤象不见，故车说輹。马君及俗儒皆以乾为车，非也。夫妻反目注豫，震为夫为反，巽为妻，离为目，今夫妻共在四。夬之夫妻反目，妻当在内，夫当在外，今妻乘夫而出在外。象曰：不能正室。三体离，需饮食之道，饮食有讼，故争而反目也。六四，有孚，注孚谓五。血去惕出，无咎。注豫，坎为血、为惕，惕，忧也。震为出，变成小畜，坎象不见，故血去惕出。得位承五，故无咎也。九五，有孚挛如，富以其邻。注孚，五，讲二也。挛，引也。巽为绳。豫，艮为手。二失位，五欲其变，挛如以及也。五贵称富，邻谓三。兑西震东称邻。二变承三，故富以其邻。象曰：不独富。二变为既济，与东西邻同义。上九，既雨既处，尚得载，妇贞厉。注既，巳也。应在三。坎水零为雨，巽为处，谓二变。三体坎雨，故既雨既处。坎云复天。坎为车，积载在坎上，故上得积载。巽为妇，坎成巽坏，故妇贞厉。月几望，君子征凶。注几，近也。坎月、离止，与归妹同，月几望也。彖曰：小畜。柔得位而上下应之曰小畜。健而与，刚，中而志行，乃亨。密云不雨，尚往也。我西郊，施未行也。注九二未变，故施未行矣。象曰：风行天上。小畜。注君子谓乾。懿，美也。豫，坤为文，乾为德，离为明。初至四体夬，为书契，乾离照坤，故懿文德也。复自道，其义吉也。牵复在中，亦不自失也。注变应五，故不自失。与比二同义也。夫妻反目，不能正室也。有孚惕出，上合志也。有孚挛如，不独富也。既雨既处，得积载也。注巽消承坎，故得积载。坎习为积也。君子征凶，有所疑也。注变坎为盗，故有所疑也。三三","10":"兑下乾上。履虎尾，不咥人亨。注谓变讼初为兑也。此咄以坤履乾，以柔履刚人。乾兑乘谦，震足蹈艮，故履虎。槪应而艮与尾上绝，故不咥人。刚当位，谓故通。俗儒皆以兑为虎，乾履兑，非也。初九，素履往，句无咎。注：应在巽为白，故素履在外称往。象曰：独行愿也。九二，履道坦坦，幽人贞吉。注二失位，变成震为道，为大涂，故履道坦坦。诫之正得位，震出兑悦，幽人喜笑。离目不正，兑为小，故眇而视。视上应也。跛，兑折震足，为刑人，见刑断足者，非为跛也也。既跛且眇，视步不能，为虎所啮，故咥人凶。象曰：位不当乾。剔曰：武人为于大君，志刚也。九四，履虎尾，诉诉，终吉。注体与下绝。四多惧，故诉诉。变体坎，得位，承五应初，故终吉。象曰：志行也。九五，夬履，贞厉。注谓三上巳变体夬。象沙，志也。为上所乘，故贞厉。象曰：位正当也。上九。桑视履考详，其旋，元吉。注应在三，三先视上，故上亦视三，故象曰大有庆也。彖曰：履，柔履刚也。注坤柔，乾刚，谦，坤籍乾，故柔履刚。说而应乎乾，是以履虎尾，不至人。注说，兑也。明兑不履乾，故言应也。亨。刚中正，履帝位而不疚，光明也。注刚中正，谓五。谦。震为帝，五帝位。坎为疾病，乾为大明，五履帝位，坎象不见，故履帝位而不疚，光明也。象曰：上天下泽，履，君子以辩上下，定民志。学君子，谓乾。辩，别也。乾天为上，兑泽为下。谦坤为民，坎为志。谦时坤在乾上，变而为履，故辩上下，定民志也。素履之往，独行愿也。幽人贞吉，中不自乱也。注虽幽讼狱中，终辩得正，故不自乱。眇而视，不足以有明也。跛而履，不足以与行也。咥人之凶，位不当也。武人为于大君，志刚也。诉诉终吉，志行也。夬履贞厉，位正当也。元吉在上，大有庆也。圭三，","11":"乾下坤上。泰。小往大来，吉亨。注阳息坤反，否也。垍坤阴诎外为小往，乾阳信内称大来。天地交，万物通，故吉亨。初九，拔茅茹，以其汇，征吉。注否泰反其类。否。巽为茅茹，茅根手。汇，类也，故拔茅茹以汇。得位应四，征吉荆茹。九二，包荒，用冯河，不遐遗，朋亡，得尚于也。失位如为河，震为足，故用冯河。乾为远，故不遐遗。兑为朋，坤虚无君，欲使二上，故朋亡。二与五易位，故得上于中行。震为行，故光大也。九三，无平不陂，无往不复。注陂，倾，谓否上也。平谓三。天地分，故平天成地平。谓危者使平，易者使倾。往谓消外，复谓息内。从三至上，体复终乾，乾反复道，故无平不陂，无往不复。艰贞无咎，勿恤。其孚于食，有福。注：艰险，贞正。恤，忧。孚，信也。二之五，得正，在坎中，故艰贞。坎为忧，故勿恤。阳在五孚险，坎为孚，故有孚。体噬嗌，食也。二上之五，据四，则三乘二，故于食有福也。六四，翩翩其邻。注一五变时四体离飞，故翩翩。坤虚无阳，故不富。兑西震东，故称其邻。不戒以孚。注谓坤。邑人不戒，故使二升五，信来孚邑，故不戒以孚。二上体坎中正，象曰中心愿也。与比邑人不戒同义也。六五，帝乙归妹，以祉元吉。注：震为帝，坤为乙。帝乙，祉，福也。谓五变体离大，初腹，则妹嫁而孕，得位正中，故以祉元吉也。六，城复于隍。注：否，艮为城，故称城。坤为积土，隍，城下沟。无水称隍，有水称池。今泰反否，乾坏为土，艮城不见而体复象，故城复于隍也。乘阳行不顺，故勿用师。邑谓震为言，兑为口。否，巽为命，今逆陵阳，故自邑告命。改命逆不顺，阴道先迷，失实远应，故贞吝。吝。彖曰：泰，小往大来，吉亨。则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。象曰：天地交泰，后以财成天地之道，辅相天地之宜，以左右民。注：后，君也。阴升乾位，坤女主，故称后。坤富称财，守位以人，聚人以财，故曰成天地之道。相赞，左右助之。震为左，兑为右，坤为民，谓以阴辅阳。诗曰：宜民宜人，受禄于天。拔茅贞吉，志在外也。注外谓四也。包荒，得尚于中行，以光大也。无平不陂，天地际也。翩翩不富，皆失实也。不戒以孚，中心愿也。以祉元吉，中以行愿也。城复于隍，其命乱也。三三","12":"坤下乾上。否之匪人，不利君子贞，大往小来。注：阴消，乾又反，泰也。谓三比坤灭乾，以臣弑其君，子弑其父三，故曰匪人。阴来灭阳，君子道消，故不利君子贞鴢。阴信阳诎，故大往小来。则是天地不交而万物不通，与比三同义也。床以肤，弑父弑君，故曰比之。初六，拔茅，贞吉，亨。六二，包承，小人吉。大人否亨。注否，不也。六三，包羞。九四有命无咎，畴离祉。九五休否，大人吉。其亡其亡，系于包桑。上九：倾否，先否后喜。注否终必倾，盈，不可久说，故后喜。彖曰：否之匪人，不利君子贞。大往小来，则是天地不交而万物不通也。上下不交，而天下无邦也，而外君子。小人道长，君子道消也。象曰：天地不交否。君子以俭德辟难，不可营以禄。注君子谓乾坤为营，乾为禄。难，谓坤为弑君，故以俭德辟难，远遁入山禄。拔茅贞吉，志在君也。大人否亨，不乱群也。注物三称群，谓坤三阴乱弑君，大人不从，故不乱群也。包羞，位不当也。有命无咎，志行也。大人之吉，位正当也。否终则倾，何可长也。注以阴剥阳，故不可久也三。","13":"同人于野，亨。注：夯通。师卦。巽为同，乾为野。师震为人。二得中应乾，故日同人于野，亨。利涉大川，利君子贞。初九：同人于门，无咎。注：乾为门，谓同于四。四变应初，故无咎也。六二，同人于宗，吝。九三，伏戎于莽，升其高陵，三岁不兴。注：吴为伏，震为草莽，离为戎，谓四。坎之巽为高。师，震为陵，以巽股升其高陵。爻在三，乾为岁。兴，起也。动不失位，故三岁不兴也。九四，乘其庸，弗克攻，吉。注巽为庸，四在巽上，故乘其庸。变而承五，体讼。故弗克攻则吉也。九五，同人，先号啕而后笑，大师克相遇。注：应在二，兴为号啕。乾为先，故先号啕。师震在下，故后笑。震为后笑也。二至五体遘，遇也，故相遇。上九，同人于郊，无悔。注：乾为郊，失位无应，与乾上九同，义当有悔。同心之家，故无悔。彖曰：同人，柔得位得中而应乎乾，曰同人。同人曰：同人于野，亨，利涉大川。句乾行也。注此孔子所以明嫌表幑师。震为夫，巽为妇，所谓二人同心，体师兄弟、朋友，而故言人耳。乾四、上失位，变而体坎，故曰利涉大川。乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。注唯，独也。唑变成坎，坎为通，为志，故能通天下之志。谓五。以类族辩物，圣人作而万物睹。象曰：天与火。同人秋，君子以类族辩物。注君子谓乾。师。坤为类，乾为族，辩，别也。乾阳物，坤阴物。体遘，天地相遇，品物咸章。辩物，谓方以类聚，物以群分。孔子曰：君子和而不同。故于同人家见以类族辩物也。出门同人，又谁咎也。同人于宗，吝道也。伏戎于莽，敌刚也。三岁不兴，安行也。乘其庸，义弗克也。其吉则困而反则也。大师相遇，言相克也。国三，","14":"乾下离上，离就密也。初九，无交害，匪咎，艰则无咎。注害谓四。四离火为恶人，故无交害。初动，震为交，比坤为害。艰难，谓阳动比初成屯。屯，难也。变得位，艰则无咎。九二，大𬛼以载，有攸往，无咎。注：比坤为大𬛼，乾来积上即，故大𬛼以载。往谓之五。二失位变得正应五，故有攸往无咎矣。九三，公用亨于天子，小人弗克。注天子谓五，三公位也。二变。得位体鼎象，故公用亨于天子。折鼎足，覆公𫗧，故小人不克也。四。九四，匪其𡯁，无咎。注匪，非也。其位𡯁𡯁或为彭。作房，声字之误。六五，厥孚交如，威如吉。注：孚，信也。发而孚二，故交如。乾称威，发得位，故威如吉。上九，自天右之，吉无不利。注谓乾也。右，助也。大有通。比坤为自，乾为天，兑为右，故自天右之。比坤为顺，乾为信，天之所助者顺，人之所助者信，履信思顺，又以尚贤，故自天右之，吉无不利。彖曰：大有。柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。注谓五至三，离为夏，坎为冬，故曰时行。以乾亨坤，是以元亨。象曰：火在天上，大有。君子举也。乾为扬善，坤为遏恶，为顺。以乾灭坤体夬，扬于王庭，故遏恶扬善。乾为天休，二变时，巽为命，故顺天休命。大有。初九：无交，害也。注害谓四。大𬛼以载，积中不败也。公用亨于天子，小人害也。注小人，谓四也。匪其𡯁，无咎，明辩折也。注折之离，故明辩折也。在坤为鼠，在震噬胏，得金矢，在吴折鼎足，在离焚死，在艮旅于处，言无所容。在兑睽孤孚厉，三百八十四爻，独无所容也。厥孚交如，信以发志也。威如之吉，易而无备也。大有上吉，自天右也也。圭王","15":"艮下坤上，义不之而之北。卦明乾来初明履。谦亨。注乾上九来之坤，与履迳通。天道下济，故亨。彭城蔡景君说。剥上来之三，君子有终。注君子谓三。艮终万物，故君子有终。初六，谦谦，君子用涉大川吉。九三，劳，君子有终吉。六四无不利。㧑谦。谦虽之亦比五利正，四亦宜然，利用侵伐，无不利。上六，鸣谦，利用行师，征邑国。注：应在震，故曰鸣谦。体师象，震为行籼五之正，已得从征形，故利用行师征邑国。彖曰：谦亨。天道下济而光明。乾。地道卑而上行。天道亏盈而益谦。云上，因假履见义耳。剥、复之间，卦无实象，故多假。贵处贱位，故益谦。地道变盈而流谦。注谦二假谦，上，坎动而小谓三神，故鬼神害盈而福谦也。人道恶盈而好谦。注：乾为好、为人，坤为恶也，故人道恶盈。从上之三，故好谦矣。谦，尊而光，卑而不可逾。注天道象，故山谦，子之终地。君子以浮多益寡，称物平施。注君子谓三。捊取也。艮为多，坤为寡，故以桴多益寡，称物平施。谦谦君子，卑以自牧也。鸣谦贞吉，中心得也。注中正谓二，坎为心也。劳谦，君子，万民服也。无不利。㧑谦，不违则也。利用侵伐，征不服也。鸣谦，志未得也。可王息","16":"豫。利建侯行师。注复初之四，与小畜劵通。坤为邦国，震为诸侯。初至五体比象，四利复初，三至上体师象，故行师。初六，鸣豫，凶。注：应震善鸣，失位，故鸣豫凶也。六二，介于石。注介，纤也。与四为艮，艮为石，故介于石。不终日，贞句吉。注与小畜通。应在五，终变成离，得位欲呼急复初，故不终日贞吉。六三，盱豫，悔迟，有悔。九四，由豫，大有得，勿疑，朋盍哉。注由，自从也。据有五阴，坤以𥄳顺，故大有得。得，群阴也。坎为疑，故勿疑。小畜兑为朋。盍，合也。坤为盍。戠，聚会也。坎为聚，坤为众，众阴并应，故朋盍戠哉。旧读作攒，作宗也。六五，贞疾，恒不死。注恒，常也。坎为疾，在坤，坤为死也。与坤体绝，故贞疾，恒不死也。上六，冥豫，成有。渝，无咎。注：应在三，坤为冥。渝，变也。三失位，无应多凶，变乃得正，体艮成，故成有渝，无咎。彖曰：豫，刚应而志行，顺以动。豫。豫，顺以动，故天地如之，而况建侯行师乎？注小畜乾为天，坤为地。如之者，谓天地亦动，以成四时，而况建侯行师，言其皆应而豫也。天地以顺动，故日月不过，而四时不忒。注豫，变通。小畜。坤为地，动初至三成乾，故天地以顺动也。过，谓失度。忒，差迭也。谓变初至需，曰坎为月，皆得其正，故月不过动。初时震为春，至四兑为秋，至五坎为冬，离为夏，四时为正，故四时不忒。通变之谓事。盖此之类。圣人以顺动，则刑罚清而民服。注清，犹明也。动初至四，兑为刑，至坎为罚，坎、兑体正，故刑罚清。坤为民，乾为清。豫之时义大矣哉。注顺动天地，使日月四时皆不过差，刑罚清而民服，故义大也。象曰：雷出地奋，豫，先王以作乐崇德，殷荐之上帝，以配祖考。加。初六，鸣豫，志穷凶也。注体剥，蔑贞也。不终日贞吉，以中正也。盱豫有悔，位不当也。由豫大有得，志大行也。六五贞疾，乘刚也。恒不死，中未亡也。冥豫在上，何可长也。三三","17":"震下兑上，利贞，无咎。初九，官有渝，贞吉，出门交，有功交。六二，系小子，失丈夫。注应在巽，巽为绳，故称系。小子谓五，兑为少，故曰小子。丈夫谓四，体大过，老夫，故称丈夫。承四隔三，故失丈夫。办也。夫死大过，故每有欲嫁之义也。六三，系丈夫，失小子。随，有求得，利居贞。注随家阴隧阳。三之上无应，上系于四，失初小子，求之正，得位远应，利上承四，故利居贞矣。九四。随，有获，贞凶。有孚在道，以明何咎。注谓获三也。失位相据，在大过死象，故贞凶。象日其义凶矣。孚谓五。初震为道，三巳之正，四变应初，得位在离，故有孚在道，以明何咎。象曰：明功也。九五，孚于嘉吉。注：坎为孚，阳称嘉。手为拘，巽为绳，两系称维，故拘系之，乃从维之。在随之上而无所随，故维之。象日上穷，是其义也。王用亨于西山。注否乾为王，谓五也。有观象，故亨。兑为西，艮为山，故用亨于西山也。彖曰：随，刚来而下柔，动而说随。注否，乾上来之坤初，故刚来而下柔。陜动震说兑也。大亨，贞无咎，而天下随时。注乾为天，坤为下，震春兑秋，三四之正，坎冬离夏，四时位正，时行则行，故天下随时矣。随时之义，大矣哉！扬倡惟阴种，锄行女随，故大。象曰：泽中有雷，随。君子以向晦入宴息。官有渝，从正吉也。出门交有功，不失也。系小子，弗兼与也。注巳系于五，不兼与四也。系丈夫，志舍下也。随有获，其义凶也。有孚在道，明功也。注死在大过，故凶也。功，谓五也。三四之正，离为明，故明功也。孚于嘉吉，位中正也。注凡五言中正，中正，皆阳得其正，以五则不穷。三三","18":"巽下艮上。蛊，元亨。注：泰初之上，与随创通，刚上柔下，乾坤交，故元亨也。先甲三日，后甲三日。注谓初，乾为甲，至二成离，离为日，谓乾三爻在前，故先甲三日。贲时也。变二至四体离，至五成乾，乾三爻在后，故后甲三日。无妄时也。初九，干父之蛊，有子考句无咎，厉，终吉。注：干正。蛊，事也。泰乾为父，坤为事，故干父之蛊。初上易位，艮为子，父死大过称考，故有子考。变而得正，故无咎厉，终吉也。九二，干母之蛊，不可贞。注应在五。泰坤为母，故干母之蛊。失位，故不可贞。旧杯迦，变而得正，故贞而得中道也。九三，干父之蛊，小有悔，无大咎。六四，裕父之蛊，往见吝。注：裕，不能争也。孔子日：父有争子，则身不陷于不义。四阴体大过，本未弱，故裕父之蛊。兑为见，变而失正，故往见吝。象曰往未得，是其义也。六五，干父之蛊，用誉。注誉谓二也，故用誉。上九，不事王侯。注：泰乾为王，坤为事。应在于三，震为侯，坤象不见，故不事王侯。高尚其事。注：谓五巳变，巽为高，艮阳升在坤上，故高尚其事。彖曰：蛊，刚上而柔下，与而止蛊。注：泰初之上，故刚上，坤上之初，故柔下。上艮下与，故巽而止蛊也。蛊，元亨而天下治也。利涉大川，往有事也。先甲三日，后甲三曰。终则有始，天行也。注易出震消息历乾坤象。乾为始，坤为终，故终则有始纠。乾为天，震为行，故天行也。象曰：山下有风。蛊，君子以振民育德。注君子，谓泰乾也。坤为民，初上抚坤，故振民。乾称德，体大畜须养，故以育德也。干父之蛊，意承考也。干母之蛊，得中道也。干父之蛊，终无咎也。裕父之蛊，往未得也。注往失位，折鼎足，故未得。干父用誉，承以德也。注变二使承五，故承以德。二，乾爻，故称德矣。不事王侯，志可则也。圭三，","19":"兑下坤上。临，元亨利贞。注：阳息至二，与遁谤通，刚浸而长，乾来交坤，动则成乾。临消于遁，六月卦也。于周为八月。遁弑君父，故至于八月有凶。荀公以兑为八月，兑于周为十月，言八月，失之甚矣。初九，咸临，贞吉。注：咸，感也。得正应四，故贞吉也。九二，咸临，吉无不利。注得中多誉，兼有四阴体，复初元吉，故无不利。六三，甘临，无攸利，既忧之，无咎。注：兑为口，坤为土，土爰稼穑，作甘。兑衔坤，故口甘。临。失位乘阳，故无攸利。言三失位无应，故忧之。动而成泰，故咎不可长也。六四，至临，无咎。注至，下也。谓下至初应，当位有实，宜吉扬位。上六，敦临，吉，无咎。彖曰：临，刚浸而长。注刚，谓二也。兑为水，泽自下浸上，故浸而长也。说而顺，刚中而应。注说，兑也。顺坤刚。中，谓二也。四阴皆应之，故曰而应。大亨以正，天之道也。注大亨以正，谓三动成乾，天也。𪥙剂至于八月有凶，消不久也。象曰：泽上有地。临。君子以教思无穷，容保民无疆。注君子，谓二也。震讲习，学以聚之，问以辩之。坤为思，刚浸长，故以教思无穷。容，宽也。二宽以居之，仁以行之，坤为容、为民，故保民无疆矣。咸临，贞吉，志行正也。咸临，吉无不利，未顺命也。甘临，位不当也。既忧之，咎不长也。至临无咎，位当也。大君之宜，行中之谓也。敦临之吉，志在内也。三圭","20":"坤下巽上。观。盥而不荐，有孚颙若。注观，反，临也。以五阳观示坤民，故称观。盥，沃盥。荐，羞牲也。孚，信谓五。颙颙，君德，有威容貌。若，顺也。坎为水，之三，坤为器，艮手临坤，坎水沃之，盥之象也。故观盥而不荐。孔子曰：禘自既灌，吾不欲观之矣。巽为进退，容止可观，进退可度，则下观其德，而顺其化。上之三五在坎中，故有孚颙若，下观而化。诗曰：颙颙卬卬，如圭如璋，君德之义也。初六：童观，小人无咎，君子吝。注：艮为童，阴小人，阳君子。初位贱，以小人乘君子，故无咎。阳伏阴下，故君子吝矣。六二，𬮭观，利女贞。注：临兑为女，窃观称𬮭，兑女反成与巽，四五得正，故利女贞。阖户小人而应五，故𬮭观女贞，利不淫视也。六三，观我生句进退洼坤为我，临震为生，生，谓坤生民也。巽为进退，故观我生。进退。临震进之五，得正居中，故象曰未失道。六四，观国之光，利用宾于王。注：坤为国。临阳至二，天下如明，反上成观，进显天位，故观国之光。王谓五阳。阳尊宾坤，坤为用，为臣。四在王庭，宾事于五，故利用宾于王矣。诗曰：莫敢不来宾，莫敢不来王。是其义也。九五，观我生句，君子无咎。注：我，身也。谓我生，生谓生民。震生象反坤为死丧，嫌非生民，故不言民。在临二，失位之五，得道处中，故君子无咎矣。上九，观其生句，君子无咎。注：应在三，三体临震，故观其生𪯉。君子谓三之三得正，故无咎矣。彖曰：大观在上。注谓阳息。临二，直方大。临者，大也。在观上，故称大观。反顺而与中正，以观天下。注：顺，坤也。中正谓五。五以天神道观示天下，咸服其化，宾于王庭。观盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒。注忒，差也。神道，临震，兑为春秋。三、上易位，坎冬夏月象正，故四时不忒。圣人神道设教，而天下服矣注圣人谓乾，退藏于密，而齐于熙，以神明其德教，故圣人设教。坤民顺从而天下服矣。象曰：风行地上，观，先王以省方。观初六，道也。𬮭观女贞，亦可丑也。观我生进退，未失道也。观国之光，尚宾也。观我生，观民也。注坤为民，谓三也。坤体成，故观民也。观其生，志未平也。注坎为志、为平，上来之三矣。周易虞氏义卷之二，身之四周易虞氏义卷之三张惠言学。周易上经彖上传、象上传虞氏注。䷔","21":"震下离上。噬嗑，亨，利用狱。注否五之坤初，坤初之五，刚柔交，故亨也。坎为狱，艮为手，离为明。四以不正而系于狱，上当之三，蔽四成丰，折狱致刑，故利用狱。坤为用也。初九，屦校灭趾，无咎。注屦贯。趾，足也。震为足，坎为校，震没坎下，初位得正，故无咎。六二，噬肤灭鼻，无咎。注：噬，食也。艮为肤，为鼻，鼻没水坎中，隐藏不见乘刚。六三，噬昔肉，遇毒，小吝，无咎。注：三在肤里，故称肉。离日熯之为昔，坎为毒，故噬昔肉遇毒。毒，谓矢毒也，咎也。九四，噬乾胏，得金矢，利艰贞吉。六五，噬乾肉，得黄金，贞厉，无咎。注：阴称肉，位当离，日中烈，故乾肉也。乾金黄，故得黄金。正。变而得正，故无咎。土九，何校灭耳凶。彖曰：颐中有物，曰噬嗑。注物谓四，则所噬乾脯也。颐中无物，则口不噬，故先举颐中有物曰噬嗑也。噬嗑而亨，刚柔分。动而明，雷电合而章，柔得中而上行，虽不当位，利用狱也。象曰：雷电噬嗌，先王以明罚敕法。屦校灭趾，不行也。注否坤小人，以阴消阳，其亡其亡，故五变灭初。否坤杀，不行也。噬肤灭鼻，乘刚也。遇毒，位不当也。利艰贞吉，未光也。贞厉无咎，得当也。何校灭耳，聪不明也。䷕","22":"离下艮上。贲，亨。注泰上之乾二，乾二之坤上，柔来文刚，阴阳交，故亨也。小利有攸往。注小谓五。五失正，动得位，体离，以刚文柔，故小利有攸往。初九，贲其趾，舍车而徒。注应在震，震为足，故贲其趾也。应在艮，艮为舍，坎为车。徒，步行也。位在下，故舍车而徒。六二，贲其须。九三，贲如，濡如，永贞吉。六四，贲如，皤如，白马翰如，匪寇句婚媾。六五，贲于丘园，东帛戋戋，吝，终吉。注：艮为山，五半山，故称丘。木果曰园，故贲于丘园也。六五失正，动之成巽，巽为帛、为绳，艮手持，故东帛。以艮断巽，故戋戋。失位无应，故吝。变而得正，故终吉矣。束帛戋戋，委积之貌。上九，白贲无咎。注：在巽上，故曰白贲。乘五阴，变而得位，故无咎矣。彖曰：贲，亨。柔来而文刚，故亨。分刚上而文柔，故小利有攸往，天文也。注谓五利。变之正，成巽体离。艮为星，离日坎月，巽为高。五天位，离为文明，日月星辰高丽于上，故称天之文也。文明以止，人文也。注人谓三。乾为人。文明，离止艮也。震动离明，五变据四，二五分，则止文三，故以三为人文也。观乎天文，以察时变。注日月星辰为天文也。泰震春兑秋，贲坎冬离夏，巽为进退，月星辰进退盈缩，谓朓侧、朏也。历象在天成变，故以察时变矣。观乎人文，以化成天下。注泰乾为人。五上动，体既济。贲，离象。象曰：山下有火，贲，君子以明庶政，无敢折狱。注君子，谓乾。坎为狱。三在狱得正，故无敢折狱。噬嗑。四不正，故利用狱也。舍车而徒，义弗乘也。贲其须，与上兴也。永贞之吉，终莫之陵也。六四当位，疑也。为山，五半山，故称丘。木果曰园。六五失正，动之成巽，巽为帛、为绳，艮手持，故东帛。以艮断巽，故戋戋。失位无应，故吝。变而得正，故终吉矣。束帛戋戋，委积之貌。上九，白贲无咎。注：在巽上，故曰白贲。乘五阴，变而得位，故无咎矣。彖曰：贲，亨。柔来而文刚，故亨。故小利有攸往，天文也。注谓五利。变之正成巽体离。艮为星，离日坎月，巽为高。五天位，离为文明，月星辰高丽于上，故称天之文也。文明以止，人文也。注人谓三。据四二五分，则止文三，故以三为人文也。观乎天文，以察时变。注日月星辰为天文也。泰震春兑秋，贲坎冬离夏。巽为进退，日月星辰进退盈缩，谓朓侧、朏也。历象在天成变，故以察时变矣。观乎人文，以化成天下。注泰乾为人。五上动体既济，贲，离象。象曰：山下有火。贲。君子以明庶政，无敢折狱。注君子，谓乾。坎为狱。三在狱得正，故无敢折狱。噬嗑。四不正，故利用狱也。舍车而徒，义弗乘也。贲其须，与上兴也。永贞之吉，终莫之陵也。六四，当位，疑也。三匪寇婚媾，终无尤也。六五之吉，有喜也。注五变之阳，故有喜。凡言喜庆皆阳爻。白贲无咎，上得志也。注上之正得位，体成既济，故曰得志。坎为志也。䷖","23":"坤下艮上。剥，不利有攸往。注阴消乾也，与夬旁通君，故不利有攸往也。初六，剥床以足，蔑贞凶。注此卦坤变乾也。动初成巽，巽木为床，复震在下为足，故剥床以足。蔑，无贞，正也。失位无应，故蔑贞凶。震在阴下，象曰：以灭下也。六二，剥床以辨，蔑贞凶。注指閒称辨。剥剥二成艮，艮为指，二在指閒，故剥床以辨。无应在剥，故蔑贞凶也。六三，剥，无咎。六四，剥床以肤，凶。注辨上称肤。艮为肤，以阴变阳，至四乾毁，故剥床以肤。臣弑君，子弑父，故凶矣。六五，贯鱼以宫人宠，无不利。注剥消观五。巽为鱼，为绳，艮手持绳贯巽，故贯鱼也。艮为宫室，人，谓乾五。阴代阳，五贯乾为宠人，阴得丽之，故以宫人宠。动得正成观，故无不利也。上九，硕果不食。君子德车，小人剥庐。注：艮为硕果，谓三已复位，有颐象，颐中无物，故不食也。为车，灭艮，坤阴迷乱，故小人剥庐也。彖曰：剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。注坤顺艮止，谓五消观成剥，故观象也。乾为君子，乾息为盈，坤消为虚，盈虚，天行也。易亏巽出，震息兑，盈乾虚坤，故于是见之耳。象曰：山附于地，剥，上以厚下，安宅。剥床以足，以灭下也。剥床以辨，未有与也。剥之无咎，失上下也。剥床以肤，切近灾也。以宫人宠，终无尤也。君子德车，民所载也。小人剥庐，终不可用也。䷗","24":"震下坤上，复，亨。注：阳息坤，与遘旁通，出震成乾，入巽成坤，坎为疾，十二消息，不见坎象，故出入无疾。兑为朋，在内称来。五阴从初，初阳正来复。注谓乾成坤，反出于震而来复。阳为道，故复其道。刚为昼日，消乾六爻为六日，刚来反初，故七日来复，天行也。利有攸往。注阳临成乾，小人道消，君子道长，故利有攸往矣。初九，不远复，无祗悔，元吉。六二，休复吉。六三，频复，厉，无咎。注频，蹙也。三失位，故频复厉。动而之正，故无咎也。六四，中行独复。注中谓初曰中行独复，以从道也。俗说以四位在五阴之中，而独应复，非也。不在二五，何得称中行耳。六五，敦复，无悔。上六，迷复，凶，有灾眚。注：坤冥为迷，高而无应，故凶。五变正时，坎为灾眚，故有灾眚也。用行师，终有大败，以其国君凶。注三复位时，而体师象，故用行师。阴逆不顺，坤为死丧，坎流血，故终有大败。遘乾为君，灭藏于坤，坤为异邦，故国君凶矣。至于十年，不克征。注坤为至，为十年。阴逆坎临，故不克征。谓五变设险，故帅师败，丧君而无征也。彖曰：复，亨。刚反，动而以顺行，是以出入无疾，朋来无咎。注刚从艮入，坤从反震，故曰反动。坤顺震行，故而以顺行。阳不从上来反初，故不言刚自外来，是以明不远之复，入坤出震义也。反复其道，七日来复，天行也。利有攸往，刚长也。复，其见天地之心乎注坤为复，谓三复位时。离为见，坎为心，阳息临成泰，乾天坤地，故见天地之心也。象曰：雷在地中。复，先王以至日闭关，商旅不行，后不省方。注先王，谓乾初。至日，冬至之日。坤阖为闭关，巽为商旅，为近利，市三倍。遘巽伏初，故商旅不行。遘象曰：后以施命诰四方。今隐复下，故后不省方。复为阳始，遘则阴始，天地之始，阴阳之首，已言先王，又更言后，后，君也。六十四卦，唯此重耳。不远之复，以修身也。休复之吉，以下仁也。频复之厉，义无咎也。中行独复，以从道也。敦复无悔，中以自考也。迷复之凶，反君道也。注遘乾为君，坤阴灭之，以国君凶，故曰反君道也。䷘","25":"震下乾上。无妄，元亨，利贞。注：遁上之初，此所谓四阳二阴，非大壮则遁来也。刚来交初，体乾，故元亨。三、四失位，故利贞也。其匪正有眚，不利有攸往。注非正，谓上也。四己之正，上动成坎，故有眚。变而逆乘，天命不右，故不利有攸往矣。初九，无妄，往吉。注谓应四也。位故命变之正。四变得位，承五应初，故往吉在。外称往也。六二，不耕获，不菑畬，则利有攸往。注有益耕象，无坤田，故不耨。震为禾稼，艮为手，禾在手中，故称获。在初一岁曰菑，在二二岁曰畬。初爻非坤，故不菑而畬也。得位应五，利。四变之益，则坤体成，有耒耨之利，故利有攸往。往应五也。六三，无妄之灾，或系之牛。行人之得，邑人之灾。注：上动体坎，坎故称灾。正坤为牛，艮为鼻，为止，与，为桑，为绳，系牛鼻而止桑下，故或系之牛也。乾为行人、人，乾四据三，故行人之得。三系于四，故邑人之灾。或说，以四变，则牛应初，震，坤为死丧，故曰行人得牛，邑人灾也。九四，可贞，无咎。注：动得正，故可贞。承五应初，故无咎也。九五，无妄之疾，勿药有喜。注：四己之正，上动体坎，坎为疾，故曰无妄之疾也。药，坎为多眚，药不可试，故勿药有喜。康子馈药，某未达，故不尝。此之谓也。上九，无妄，行有眚，无攸利。注动而成坎，故行有眚。乘刚逆命，故无攸利。天命不右行矣哉。彖曰：无妄，刚自外来，而为主于内。动而健，刚中而应，大亨以正，天之命也。注动，震也。健，大亨，谓乾。刚中，谓五而应二。乾为天，巽为命，故曰大亨以正，天之命也。其匪正有眚，不利有攸往。无妄之往，何之矣？天命不右行矣哉。注谓四已变，上动体屯，坎为泣血涟如，故何之矣。天，五也。巽为命。右，助也。四巳变成坤，天道助顺，上动，逆乘巽命，故天命不右行矣哉，言不可行也。马君云天命不右行，非矣。象曰：天下雷行，物与无妄。注与，谓举。妄，亡也。谓雷以动之，震为反生，万物出震，无妄者也，故曰物与无。妄。序卦曰：复则不妄矣，故受之以无妄。而京氏及俗儒以为大旱之卦，万物皆死，无所复望，失之远矣。有无妄，然后可畜，不死明矣。若物皆死，将何畜聚？以此疑也。先王以茂对时育万物。注先王谓乾。乾盈为茂，艮为对。时体颐养象。万物出震，故以茂对时育万物。言物皆死，违此甚矣。无妄之往，得志也。注四变应初，夫妻体正，故往得志矣。不耕获，未富也。注四动坤虚，故未富也。行人得牛，邑人灾也。可贞无咎，固有之也。注动阴承阳，故固有之也。无妄之药，不可试也。无妄之行，穷之灾也。䷙","26":"乾下艮上。大畜，利贞。注：大壮初之上，其德刚上也。之与萃旁通。二五失位，故利贞。此萃五之复二成临。临者大也，至上有颐养之象，故名大畜也。不家食吉，利涉大川。注二称家，谓二五易位，成家人。家人体噬嗑食，故利涉大川，应乎天也。初九，有厉，利己。九二，车说腹。注萃坤为车、为腹，坤消乾成，故车说腹。腹或作輹也。九三，良马逐。注乾为良马，震为惊走，故称逐也。闲舆卫。注谓二巳变。三在坎中，故利艰贞吉。车舆，乾人在上，震为惊卫，讲武闲兵，故曰日闲舆卫也。利有攸往。注谓上应也。五已变正，上动成坎，坎为志，故利有攸往，与上合志也。六四，童牛之告，元吉。注艮为童，五已之正，萃坤为牛。告，谓以木楅其角。大畜畜物之家，恶其触害。艮为手，为小木，故曰童牛之告。得位承五，故元吉而喜。喜谓五也。六五，豮豕之牙，吉。注：二变时坎为豕。三至上体颐象。五变之刚，巽为白。震为出刚，白从颐中出，牙之象也。动而得位，豮豕之牙，吉。上九，何天之衢亨。注何，当也。衢，四交道。乾为天，震艮为道，以震交艮，故何天之衢亨。上变坎为亨也。彖曰：大畜。刚健笃实，𪸩光日新。注刚健谓乾，笃实谓艮。𪸩光，日新也。其德刚上而尚贤，能健止，大正也。注健，乾止艮也。二五易位，故大正。旧读言能止健，误也。不家食吉，养贤也。注二五易位，成家人。今体颐养象，故不家食吉，养贤也。利涉大川，应乎天也。象曰：天在山中。大畜。君子以多志前言往行，以畜其德。注君子谓乾。乾为言，震为行，坎为志，乾知大始，震在乾前，故志。前言往行，有颐养象，故以畜其德矣。有厉，利己，不犯灾也。注谓二变正，四体坎，故称灾也。车说腹中，无尤也。利有攸往，上合志也。六四，元吉，有喜也。六五之吉，有庆也。注五变得正，故有庆也。何天之衢，道大行也。注谓上据二阴。乾为天道，震为行，故道大行矣。䷚","27":"震下艮上。济颐，贞吉。注：晋四之初，与大过旁通，养正则吉。谓三之正，五上易位，故颐贞吉，反复不衰，与乾坤、坎离、大过、小过、中孚同义，故不从临、观四阴二阳之例。或以临二之上，兑为口，故有口实也。观颐。注离为目，故观颐，观其所养也。实。注或以大过兑为口实，颐中物，谓其自养。初九，舍尔灵龟，观我朵颐，凶。注：晋离为龟，四之初，故舍尔灵龟。坤为我，震为动，失离入坤，远应多惧，故凶矣。六二，颠颐，拂经，于丘颐，征凶。六三，拂颐，贞凶，十年勿用，无攸利。注三失位体剥，不正相应，弑父弑君，故贞凶。坤为十年。动无所应，故十年勿用，无攸利也。六四，颠颐吉，虎视眈眈，其欲逐逐，无咎。注：晋四之初，谓三已变，故颠颐。与屯四乘坎马同义。坤为虎，离为目。眈眈，下视貌。逐逐，心烦貌。坤为吝啬，坎水为欲，故其欲逐逐。得位应初，故无咎。谓上巳反，故上施光也。六五，拂经，居贞吉，不可涉大川。注：失位故拂经。无应顺上，故居贞吉。艮为居也，坎不可涉大川矣。上九，由颐，厉，吉。注：由，自从也。体剥居上，众阴顺承，故由颐。失位故厉。以坤艮自辅，故吉也。利涉大川。注失位故厉。之五得正成坎，坎为大川，故利涉大川。彖曰：颐，贞吉，养正则吉也。观颐，观其所养也。求口实，观其自养也。天地养万物，圣人养贤，以及万民。注乾为圣人，艮为贤人。颐下养上上，故以及万民。颐之时大矣哉。象曰：山下有雷，颐，君子以慎言语，节饮食也。观我朵颐，亦不足贵也。六二，征凶，行失类也。十年勿用，道大悖也。注弑父弑君，故大悖也。颠颐之吉，上施光也。居贞之吉，顺以从上也。由颐厉吉，大有庆也。注变阳得位，故大有庆也。䷛","28":"巽下兑上。大过，栋桡。注：大壮五之初，或兑三之初，栋桡，谓三。巽为长木，称栋。初上阴柔，本末弱，故栋桡也。利有攸往，亨。注谓二也。失位无应，利变应五，之外称往，故利有攸往，乃亨也。初六，藉用白茅，无咎。注：位在下称藉。巽柔，白为茅，故藉用白茅。失位，咎也。承二过四，应五士夫，故无咎矣。九二，枯杨生稊，老夫得其女妻，无不利。注稊，稚也。杨叶未舒称稊。巽为杨，乾为老，老杨故枯。兑为雨泽，枯杨得泽，复生稊。二体乾老，故称老夫。女妻，谓上兑。兑为少女，故曰女妻。大过之家，过以相与，老夫得其女妻，故无不利。九三，栋桡，凶。九四，栋隆吉，有它吝。注：隆，上也。应在于初，已与五，意在于上。九五：枯杨生华，老妇得其士夫，无咎无誉。注阳在五也。夬三月时，周之五月，枯杨得泽，故生华矣。老妇谓初，巽为妇，乾为老。士夫。五过二使应上，二过五使取初，五得位，故无咎。阴在二多誉，今退伏初，故无誉。体遘淫女，故过以相与，使应少夫。象曰：亦可丑也。旧说以初为女妻，上为老妇，误矣。马君亦然。荀公以初阴失正，当变数六为女妻；二阳失正，数九为老夫；以五阳得正位，不变，数七为士夫，上阴得正，数八为老妇。此何异俗说也。悲夫学之难，而以初本为小，反以上末为老，后之达者详其义焉。上六，过涉灭顶，凶，无咎。注：大壮，震为足，兑为水泽，震足没水，故过涉也。顶，首也。乾为顶，顶没兑水中，故灭顶，凶也。得位故无咎，与灭耳同义也。彖曰：大过，大者过也。注阳称大，谓二也。二失位，故大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往，乃亨。注刚过而中，谓二说兑也，故利有攸往。大壮，震五之初，故亨义。大过之时，大矣哉！注：国之大事，在祀与戎。藉用白茅，女妻有子，继世承祀，故大矣哉。象曰：泽灭木。大过，君子以独立不惧，遁世无闷。注君子，谓乾初。体复一爻，潜龙之德，故称独立不惧，忧则违之。乾初同义，故遁世无闷也。藉用白茅，柔在下也。老夫女妻，过以相与也。注谓二过初与五，五过上与二爻，得过其应。故过以相与也。栋桡之凶，不可以有辅也。注本末弱故桡，辅之益桡，故不可以有辅。阳以阴为辅也。栋隆之吉，不桡乎下也。注乾为动，直也，故不桡下也。枯杨生华，何可久也。老妇士夫，亦可丑也。注乾为久，枯而生华，故不可久也。妇体遘淫，故可丑也。过涉之凶，不可咎也。䷜","29":"坎下坎上，习坎有孚。注乾二五之坤，与离旁通于爻，观上之二，习，常也。孚，信谓二五。水行往来，朝宗于海，不失其时，如月行天为孚也。维心亨，行有尚。注坎为心，乾二五旁行流坤，震为行，动，得正应五，故行有尚，往有功也。初六，习坎，入于坎窞，凶。注：习，积也。位下，故习。坎为入。坎中小穴称窞。失正，故曰失道凶矣。九二，坎有险，求小得。注阳陷阴中，故有险，据阴有实，故求小得也。六三，来之坎，坎句险，句且枕，入于坎窞，勿用。注坎在内称来，在坎终坎，故来之坎坎。枕，止也。艮为止。三失位，乘二则险，承五隔四，故险且枕，入于坎窞。体师三舆，故勿用。六四，尊酒簋贰，用缶。注震主祭器，坎为酒。簋，黍稷器，有颐口象。震献在中，故为簋。坎为木，震为足，坎酒在上，尊酒之象。贰，副也。坤为缶，礼有副尊。牖。终无咎。注坎为内也。四阴小，故约。艮为牖。坤为户，艮小光照，户牖之象。贰用缶，故内约自牖。得位承五，故无咎。九五，坎不盈，禔既平，无咎。注盈，溢也。艮为止，谓水流而不盈。坎为平。禔，安也。艮止坤安，故禔既平。徽𬙊置于丛棘，三岁不得凶。注徽𬙊，黑索也。观巽为绳，艮为手，上变入坎，故系用徽𬙊。置，置也。坎多心，故丛棘。狱外种九棘，故称丛棘。二变则五体剥，得出狱。艮止坎狱，乾为岁，五从乾来，三非其应，故曰三岁不得凶矣。彖曰：习坎，重险也。注两象也。天险地险，故曰重险也。水流而不盈，行险而不失其信。注信谓二也。震为行，水性有常，消息与月相应，故不失其信矣。维心亨，乃以刚中也。行有尚，往有功也。注功谓五。二动应五，故往有功也。天险，不可升也。注谓五在天位。五从乾来，体屯难，故天险不可升也。地险，山川丘陵也。注坤为地，乾二之坤，故曰地险。艮为山，坎为川，半山称丘，丘下称陵，故曰地险，山川丘陵也。王公设险，以守其邦。注王公，大人，谓乾五。坤为邦，乾二之坤成坎险。震为守，有屯难象，故王公设险以守其邦。离言王用出征以正邦是也。险之时用大矣哉。象曰：水瀳至。习坎。君子以常德行，习教事。注君子谓乾。五在乾称大人，在坎为君子。坎为习，为常。乾为德，震为行，巽为教令，坤为事，故以常德行，习教事也。习坎，入坎，失道凶也。求小得，未出中也。来之坎坎，终无功也。尊酒簋，刚柔际也。注乾刚坤柔，伽为交，故曰刚柔际也。坎不盈中，未光大也。注体屯五中，故未光大也。上六失道，凶，三岁也。䷝","30":"离下离上。离。利贞，亨，畜牝牛吉。注坤二五之乾，与坎旁通于爻。遁初之五，柔丽中正，故利贞亨。畜，养也。坤为牝牛，乾二五之坤成坎体，颐养象，故畜牝牛吉。初九，履错然，敬之，无咎。六二，黄离，元吉。九三，日昃之离，不鼓缶而歌，则大耋之嗟凶。九四，𠫓如，其来如，焚如，死如，弃如。六五，出涕沱若，戚嗟若，吉。注坎为心，震为声。故戚嗟若。动而得正，尊丽阳，故吉也。上九，王用出征，有嘉折首，获匪其丑，无咎。注王谓乾。乾二五之坤成坎体师象。震为出，故王用出征。首谓坤二五来折乾。折首。丑，类也。乾征得坤阴类，乾阳物，故获非其丑，无咎矣。彖曰：离，丽也。坤成坎为月。百谷草木丽乎地。注震为百榖地，乾二五之坤成坎，震体屯。屯者，盈也。盈天地之间者，唯万物。万物出震，故百谷草木丽乎地。重明以丽乎正，乃化成天下。注两象，故重明。正谓五阳。阳变之坤，来化乾，化成天下也。柔丽乎中正，故亨。注柔谓五阴，中正谓五伏阳，出在坤中，畜牝牛，故中正而亨也。是以畜牝牛吉也。象曰：明两作离。注两，谓日与月也。乾五之坤成坎，坤二之乾成离。离坎日月之象，故明两作离。作，成也。日月在天，动成万物，故称作矣。或以日与火为明两作也。大人以继明，照于四方。注阳气称大人，则乾五大人也。乾二五之光，继日之明。坤为方，二五之坤，震东兑西方。履错之敬，以辟咎也。黄离元吉，得中道也。日昃之离，何可久也。𠫓如，其来如，无所容也。六五之吉，离王公也。王用出征，以正邦也。注乾五出征，坤，故正邦也。子五月朔点易上经余识江宁郡署西偏读易画梅之室。周易虞氏义卷之三周易虞氏义卷之四张惠言学周易下经彖下传、象下传虞氏注䷞","31":"艮下兑上。咸亨，利贞，取女吉。注咸，感也。坤三之上成女，乾上之三成男。乾坤气交以相与，止而说，男下女，故通。利贞，取女吉。初六，咸其母。注：母，足大指也。艮为指，坤为母，故咸其母。失位，远应之四得正，故志在外，谓四也。六二，咸其腓，凶，居吉。九三，咸其股，执其随，往吝。注：巽为股，谓二也。巽为随，艮为手，故称执。三应于上，初四己变，历险，故往吝。九四，贞吉，悔亡。憧憧往来，朋从尔思。注：失位，悔也。应初，动得正，故贞吉而悔亡矣。憧憧，怀思虑也。之内为来，之外为往。欲感上隔五，感初隔三，故憧憧往来矣。兑为朋，少女也。艮初变之四，坎心为思，故曰朋从尔思也。九五，咸其晦，无悔。注：晦，夹脊肉也。谓四己变，坎为脊，故咸其晦。得正故无悔。上六，咸其䩉颊舌。注：耳目之间称䩉。颊，四变为目，坎为耳，兑为舌，故曰咸其䩉颊舌。彖曰：咸，感也。柔上而刚下，二气感应以相与，止而说，男下女，是以亨，利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平。注乾为圣人，感人心而天下和平。此保合太和，品物流形也。观其所感，而天地万物之情可见矣。注谓四之初，以离日见天，坎月见地，县象著明，万物见离，故天地万物之情可见也。象曰：山上有泽，咸，君子以虚受人。注君子，谓否。乾。乾为人，坤为虚，谓坤虚。三受上，故以虚受人。地下为谦，在泽下为虚。咸其母，志在外也。虽凶居吉，顺不害也。咸其股，亦不处也。志在随人所执。下也。注巽为处女也。男己下女，以艮阳入兑阴，故不处也。凡士与女未用，皆称处矣也。今未感坤初，体遁弑父，故曰未感害也。憧憧往来，未光大也。注未动之离，故未光大也。咸其晦，志末也。咸其䩉颊舌，媵口说也。注媵，送也。不得之三，山泽通气，故媵说也。䷟","32":"巽下震上。恒，亨，无咎，利贞，利有攸往。注恒，久也。与益旁通。乾初之坤，四应，故通。无咎，利贞矣。二五皆得其正，终则有始，故利有攸往也。初六，浚恒，贞凶，无攸利。注浚，深也。初下称浚，故曰浚恒。九二，悔亡。注失位，悔也。动而得正，处中多誉，故悔亡也。九三，不恒其德，或承之羞，贞吝。九四，田无禽。注田，为二也。地上称田，无禽为五也。九四失位，利二上之五，已变承之，故曰田无禽，其位安得禽也。六五，恒其德句，贞，妇人吉，句夫子凶。注动正成乾，故恒其德。妇人谓初，巽为妇，终变成益。震四复初，妇得归阳，从一而终，故贞。妇人吉也。震乾之子，而为巽夫，故曰夫子。终变成益，震四从巽，死于坤中，故夫子凶也。之上六，震恒，凶。注在震上，故震恒。五动乘阳，故凶。彖曰：恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应。恒。恒，亨，无咎，利贞，久于其道也。天地之道，恒久而不已也。注泰乾坤为天地，谓终则复始，有亲则可久也。利有攸往，终则有始也。月得天而能久照。注动初成乾为天，至二离为日，至三坎为月，故月得天而能久照也。四时变化，而能久成。注春夏为变，秋冬为化。变至二离夏至，三兑秋至，四震春至，五坎冬至，故四时。变化而能久成，谓乾坤成物也。圣人久于其道，而天下化成。注圣人谓乾。乾为道，初二巳正，四五复位，成既济，定。乾道变化，各正性命，有两离象，重明丽正，故化成天下。观其所恒，而天地万物之情可见矣。注以离照乾，坎月照坤，万物出震，故天地万物之情可见矣。与咸同义也。象曰：雷风恒，君子以立不易方。注君子，谓乾、三也。乾为易，为立，坤为方。乾初之坤四三正不动，故立不易方也。浚恒之凶，始求深也。注乾初为渊，故深矣。失位变之正，乾为始，故曰始求深也。九二悔亡，能久中也。不恒其德，无所容也。久非其位，安得禽也。妇人贞吉，从一而终也。注一谓初，终变成益，以巽应初震，故从一而终也。夫子制义，从妇凶也。注震没，从巽入坤，故从妇凶矣。震恒在上，大无功也。注终在益上，五远应，故无功也。䷠","33":"艮下乾上。遁亨。注阴消遘二也。艮为山，巽为入，乾为远，远山入藏，故遁。以阴消阳，子弑其父。通则当位而应，与时行也。小利贞。注小阴谓二，得位浸长，以柔变刚，故小利贞。初六，遁尾厉，勿用有攸往。注艮为尾也。初失位，动而得正，故遁尾厉。之应成坎为灾，在艮宜静，若不往于四，则无灾矣。六二，执之用黄牛之革，莫之胜说。注艮为手，称执。否坤为黄牛，则坎水濡皮，离乾之，故执之用黄牛之革。莫，无也。胜，能，说，解也。乾为坚刚，莫之胜说也。九三，系遁，有疾厉，畜臣妾吉。注厉，危也。巽为四，变时九三体坎，坎为疾，故有疾厉。坤为臣，兑为妾，上来之三，据坤应兑，故畜臣妾吉也。九四，好遁，君子吉，小人否。注否，乾为好，为君子，阴称小人。动之初，故君子吉。阴在四多惧，故小人否。得位承五，故无凶咎矣。九五，嘉遁，贞吉。注：乾为嘉。刚当位应二，故贞吉。谓三己变，上来之三成坎。上九，肥遁无不利。注：乾盈为肥，二不及上，故肥遁无不利。象曰：无所疑也。彖曰：遁亨，遁而亨也。刚当位而应，与时行也。注刚谓五而应二，遁之时义大矣哉。象曰：天下有山，遁，君子以远小人，不恶而严。注君子谓乾，乾为远、为严。小人谓阴，坤为恶、为小人，故以远小人，不恶而严也。遁尾之厉，不往何灾也。执用黄牛，固志也。系遁之厉，有疾，惫也。畜臣妾吉，不可大事也。注三动入坤，坤为事，故不可大事也。君子好遁，小人否也。嘉遁贞吉，以正志也。肥遁无不利，无所疑也。䷡","34":"乾下震上。大壮，利贞。注：阳息泰也。壮，伤也。大谓四。失位，为阴所乘。兑为毁折，伤，与五易位，乃得正，故利贞也。初九，壮于趾，征凶，有孚。注趾谓四。征，行也。震足为趾，为正。初得位，四不征之五，故凶。坎为孚，谓得应四，故有孚。九二，贞吉。注变得位，故贞吉。九三，小人用壮，君子用罔，贞厉。注应在震也。三阳，君子，小人谓上，上逆，故用壮。三谓二，已变离，离为罔。三乘二，故君子用罔。体乾夕惕，故贞厉也。羝羊触藩，累其角。九四，贞吉，悔亡。藩决不累，壮于大𬛼之腹。注失位，悔也。之正得中，故贞吉而悔亡矣。体夬象，故藩决。震四上处五，则藩毁坏，故藩决不累。坤为大，𬛼为腹。四之五折坤，故壮于大𬛼之腹而。象曰：尚往者，谓上之五。六五，丧羊于易，无悔。注四动成泰，坤为丧也。乾为易，四上之五，兑还属乾，故丧羊于易。动各得正，而处中和，故无悔矣。上六，羝羊触藩，不能退，不能遂，无攸利，艰则吉。注应在三，故羝羊触藩。遂，进也。谓四。已之五，体坎上，能变之巽，巽为进退，故不能退，不能遂。退则失位，上则乘刚，故无攸利。坎为艰，得位应三，利上，故艰则吉。彖曰：大壮，大者壮也。刚以动，故壮。大壮利贞，大者正也。注谓四进之五，乃得正，故大者正也。正大而天地之情可见矣注正大，谓四之五，成需。以离见天，坎月见地，故天地之情可见也矣。象曰：雷在天上，大壮，君子以非礼弗履。壮于趾，其孚穷也。注应在乾终，故其孚穷也。九二，贞吉，以中也。注动体离，故以中也。小人用壮，君子罔也。藩决不累，尚往也。丧羊于易，位不当也。不能退，不能遂，不详也。艰则吉，咎不长也。注乾善为详，不得三应，故不详也。巽为长，动失位为咎，不变之巽，故咎不长也。䷢","35":"坤下离上。晋，康侯，用锡马蕃庶，昼日三接。注观四之五。晋，进也。坤为康，康，安也。初动体屯，震为侯，故曰康侯。震为马，坤为用，故用锡马。艮为多，坤为众，故繁庶。在上故昼日。三阴在下，故三接矣。初六，晋如，摧如，贞吉，罔孚，裕无咎。注晋，进，摧，忧愁也。应在四，故晋如。失位故摧如。动得位，故贞吉。应离为罔。曰，坎称孚，坤弱为裕。欲四之五成巽，初受其命，故无咎也。六二，晋如，愁如，贞吉，受兹介福，于其王母。注震为应，在坎上，故愁如。得位处中，故贞吉也。乾为介福，艮为手，坤为虚。介，大也。谓五己正中，乾为王，坤为母，故受兹介福，于其王母。六三，众允悔亡。注：坤为众。允，信也。士性信，故众允。三失正，与上易位，则悔亡，故象曰上行也。此则成小过，小过故有飞鸟之象焉。杵之利见硕鼠，出入坎穴，盖取诸此也。九四，晋如硕鼠，贞厉。六五，悔亡，矢得勿恤，往吉，无不利。注：矢，古誓字。誓，信也。勿无。恤，忧也。五变得正，坎象不见，故誓得勿恤，往有庆也。上九，晋其角，惟用伐邑，厉吉，无咎，贞吝。注：五已变之乾为首，位在首上，称角，故晋其角也。坤为邑，动成震，而体师象。坎为心，故维用伐邑。得位乘五，故厉吉无咎，而贞吝矣。彖曰：晋，进也。明出地上，顺而丽乎大明，柔进而上行，是以康侯用锡马蕃庶，昼日三接也。象曰：明出地上，晋，君子以自照明德。注君子谓观乾。乾为德，坤为自，离为明。乾五动，以离日自照，故以自照明德也。晋如摧如，独行，正也。裕无咎，未受命也。注初动，震为行，初一称独也。五未之巽，故未受命也。受兹介福，以中正也。众允之志，上行也。注坎为志，曰上行也。硕鼠贞厉，位不当也。矢得勿恤，往有庆也。注动之乾，乾为庆也。惟用伐邑，道未光也。䷣","36":"离下坤上。明夷。注：夷，伤也。临二之三而反晋也也。五失位，变出成坎，为艰，故利艰贞矣。初九，明夷于飞，垂其翼。君子于行，三日不食。有攸往，主人有言。六二，明夷于左股，用拯马壮，吉。九三，明夷于南狩，得其大首，不可疾贞。六四，入于左腹，获明夷之心，于出门庭。六五，箕子之明夷，利贞。上六，不明晦，初登于天，后入于地。注：应在三，离灭坤下，故不明晦。晋时在上丽乾，故登于天，照四国。今反在下，故后入于地，失其则。彖曰：明入地中。明夷。内文明而外柔顺，以蒙大难，文王以之。注以，用也。三喻文王。大难，谓坤。坤为弑父，迷乱荒淫，若纣杀比干。三幽坎中，象文王之拘羑里。震为诸侯，喻从文王者，纣惧出之，故以蒙大难，得身全矣。利艰贞，晦其明也。内难而能正其志，箕子以之。注箕子，纣诸父，故称内难。五乾天位，今化为坤，箕子之象。坤为晦，箕子正之。出五成坎体离，重明丽正，坎为志，故正其志。箕子以之，而纣奴之矣。象曰：明入地中。明夷，君子以莅众，用晦而明。注而，如也。君子，谓三，体师象。以坎莅坤，坤为众，为晦，离为明，故用晦如明也。君子于行，义不食也。六二之吉，顺以则也。南狩之志，乃大得也。入于左腹，获心意也。箕子之贞，明不可息也。初登于天，照四国也。后入于地，失则也。䷤","37":"离下巽上。家人，利女贞。注：遁，初之四也。女，贞也。初九，闲有家，悔亡。六二，无攸遂，在中馈，贞吉。九三，家人嗃嗃，悔厉，吉，妇子嘻嘻，终吝。六四，富家大吉。注：三变体艮，艮为笃实，坤为大业。得位应初，顺五乘三，比据三阳，故曰富家大吉。顺在位也。谓顺于五矣。九五，王假有家，勿恤吉。上九，有孚威如，终吉。注：谓三已变，与上易位成坎，坎为孚，故有孚。乾为威如，自上之坤，故威如。彖曰：家人，女正位乎内，男正位乎外。男女正，天地之大义也。注遁，乾为天，三动坤为地。男得天正于五，女得地正于二。家人有严君焉，父母之谓也。父父子子，兄兄弟弟，夫夫妇妇。注遁，乾为父，艮为子，三、五位正，故父父子子，故兄兄弟弟。三动时，震为夫，巽四为妇，初、四位正，故夫夫妇妇也。而家道正，正家而天下定矣。象曰：风自火出。家人，君子以言有物而行有恒，闲有家，志未变也。六二之吉，顺以巽也。家人嗃嗃，未失也。妇子嘻嘻，失家节也。富家大吉，顺在位也。王假有家，交相爱也。注乾为爱也。二称家，三动成震，五得交二，初得交四，故交相爱。震为交也。威如之吉，反身之谓也。注谓三动，坤为身。上之三成既济定，故反身之谓。此家道正，正家而天下定矣。䷥","38":"兑下离上睽。小事吉。注大壮上之三在系，盖取无妄二之五也，故吉。初九，悔亡。丧马，勿逐，自复，见恶人，无咎。注无应，悔也。四动得位，故悔亡。应在于坎，坎为马，四而衍失位之正，入坤，坤为丧，坎象不见，故丧马。震为逐，艮为止，故勿逐。坤为自，二至五体复象，故曰复。四动震马来，故勿逐。自复也。离为见。恶人，谓四动入坤。初四复正，故见恶人以避咎矣。九二，遇主于巷，无咎。注二动体震而得正，故无咎，而未失道也。六三，见舆曳。注离为见，坎为车，为曳，故见舆曳。其牛制。注四动，坤为牛，为类下，其牛制也。其人天且劓，无初有终。注其人，谓四恶人也。黥额为天，割鼻为劓。无妄乾为天，震二之乾，五以阴墨其天。乾五之震，二毁艮割其鼻也。兑为刑人，故其人天且劓。失位动，得正成乾，故无初有终。象曰遇刚，是其义也。九四，睽孤，遇元夫，交孚，厉，无咎。注孤，顾也。在两阴閒睽五顾三，故曰睽孤。震为元夫，谓二己变，动而应震，故遇元夫也。震为交，坎为孚，动而得正，故交孚，厉无咎矣。六五，悔亡，厥宗噬肤，往何咎。注往得位，悔亡也。动而之乾，宗，噬四。变时艮为肤，故曰厥宗噬肤也。变得正成乾，乾为庆，故往无咎而有庆矣。上九，睽孤，见豕负涂，载鬼一车。注睽三顾五，故曰睽孤也。离为见，坎为豕，为雨，即变时，坤为土，土得雨为泥涂。四动，艮为背，豕背有泥，故见豕负涂矣。坤为鬼，坎为车，变在坎上，故载鬼一车也。先张之弧，后说之壶。注谓五先应在三之象也，故先张之弧。四动，震为后，说，犹置也。兑为口，离为大腹，坤为器，大腹有口，坎酒在中，壶之象也。之应，历险以与兑，故后说之壶矣。往遇雨则吉。注匪非坎为寇，之三历坎，故匪寇。阴阳相应，故婚媾。三在坎下，故遇雨。坎象不见，各得其正，故则吉也。彖曰：睽。火动而上，泽动而下。注离火炎上，泽，水润下也。二女同居，其志不同行。注二女，离兑也。坎为志，离上兑下。无妄。震为行，巽为同，艮为居。二五易位，震巽象坏，故二女同居，其志不同行也。说而丽乎明，柔进而上行，得中而应乎刚。注说，兑，丽，离也。明谓乾明以丽于晋。柔谓五。无妄。巽为进，从二之五，故上行。刚谓应乾。五伏阳，非应二也。与鼎五同义也。是以小事吉。天地睽而其事同也。注五动，乾为天，坤为事也。五动体同人，故事同矣。男女睽而其志通也。注坎为志为通，故其志通也。万物睽而其事类也。注四动，万物出乎震，区以别矣，故万物睽。坤为事为类，故其事类也。睽之时用大矣哉。象曰：上火下泽睽。君子以同而异，见恶人以避咎也。遇主于巷，未失道也。注动得正，故未失道。见舆曳，位不当也。无初有终，遇刚也。注动正成乾，故遇刚。交孚无咎，志行也。注坎动成震，故志行也。厥宗噬肤，往有庆也。遇雨之吉，群疑亡也。注物三称群，坎为疑，三变坎败，故群疑亡矣。䷦","39":"艮下坎上。蹇，利西南。注观上反三也。坤西南卦，五在坤中，坎为月，月生西南，故利西南，往得中，谓西南得朋也。不利东北。注谓三也。艮东北之卦，月消于艮，丧乙灭癸，故不利东北。其道穷也，则东北丧朋矣。利见大人。注离为见，大人谓五。二得位应五，故利见大人，往有功也。贞吉。注谓五当位正邦，故贞吉也。初六，往蹇来誉。注誉谓二，二多誉也。失位应阴，往历坎险，故往蹇。变而得位，以阳承二，故来而誉矣。六二：王臣蹇蹇，匪躬之故。注：观乾为玉，为躬，坎为蹇也。之应涉坤，二五俱坎，故王臣蹇蹇。观上之三，折坤之体，臣道得正，故匪躬之故。象曰终无尤也。九三，往蹇来反。注应正历险，故往蹇。反身据二，故来反也。六四，往蹇来连。注连，辇。蹇，难也。在两坎閒进，则无应位正邦，故大蹇也。上六，往蹇来硕，吉，利见大人。注：阴在险上，变失位，故往蹇。硕谓三。艮为硕，退来之三，故来硕。得位有应，故吉也。离为见，大人，谓五，故利见大人矣。彖曰：蹇，难也，险在前也。见险而能止，知矣哉。注离见坎险，艮为止，观乾为知，故知矣哉。蹇，利西南，往得中也。不利东北，其道穷也。利见大人，往有功也。注大人谓五。二往应五，五多功，故往有功也。当位贞吉，以正邦也。蹇之时用大矣哉！注谓坎月生西南而终东北，震象出庚，兑象见丁，乾象盈甲，巽象退辛，艮象消丙，坤象穷乙，丧灭于癸，终则复始，以生万物，故用大矣。象曰：山上有水。蹇，君子以反身修德。注君子，谓观。乾坤为身。观上反三，故反身。阳在三，进德修业，故以反身修德。孔子曰：德之不修，是吾忧也。往蹇来誉，宜待时也。注艮为时，谓变之正，以待四也。王臣蹇蹇，终无尤也。往蹇来反，内喜之也。注内，谓二阴也。往蹇来连，当位实也。大蹇朋来，以中节也。往蹇来硕，志在内也。利见大人，以从贵也。䷧","40":"坎下震上，解。利西南。注：临初之四，坤西南卦。初之四得坤众，故利西南，往得众也。无所往，其来复吉。注谓四本从初之四，失位于外而无所应，故无所往，宜来反初，复得正位，故其来复吉也。二往之五，呼来之初，早也。离为为甲，出甲上，故早也。九二失正，早往之五则吉，故有攸往。夙吉，往有功也。初六无咎。注：与四易位，体震得正，故无咎也。九二，田获三狐，得黄矢，贞吉。注：二称田，变之正，艮为狐，坎为弓，离为黄矢，矢贯狐体。田获三狐，得黄矢。矢之正得中，故贞吉。六三，负且乘。注：负，倍也。二变时，艮为背。五三时，坤为车，三在坤上，故负且乘。小人而乘君子之器，故象曰亦可丑也。致寇至，贞吝。注五之二成坎，坎为寇盗。上位慢五，下暴于二，慢藏悔盗，故致寇至，贞吝。我致戎，又谁咎也。九四，解而母，朋至斯孚。注二动时，艮为指，四变之坤为母，故解而母。坎为孚。解，吉，有孚于小人。注：君子谓二之五，得正成坎，坎为心，故君子惟有解吉。君子升位，则小人退在二，故有孚于小人。坎为孚也。上六，公用射隼于高庸之上，获之，无不利。注上应在三也。离为隼。三失位，动出成乾，贯隼入大过，死象，故公用射隼于高庸之上，获之，无不利也。彖曰：解，险以动，动而免乎险。解。注险坎动震，解二月，雷以动之，雨以润之，物咸孚甲，万物生震。震出险上，故免乎险也。解。利西南，往，得众也。无所往，其来复吉，乃得中也。有攸往，夙吉，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲宅。解之时大矣哉！象曰：雷雨作解，君子以赦过宥罪。注君子谓三伏阳，坎为罪，入则大过象坏，故以赦过。二、四失位，皆在坎狱中。三出体乾，两坎不见，震喜兑说，罪人皆出，故以宥罪。谓三入则赦过，出则宥罪。公用射隼以解悖，是其义也。刚柔之际，义无咎也。注体屯初震，刚柔始交，故无咎也。九二，贞吉，得中道也。注动得正，故得中道。负且乘，亦可丑也。自我致戎，又谁咎也。注临坤为丑也。我以离兵伐三，故转寇为戎。艮手招盗，故谁咎也。解而母，未当位也。君子有解，小人退也。注二阳上之五，五阴小人退之二也。公用射隼，以解悖也。注坎为悖。三出成乾，而坎象坏，故解悖也。册曾初之校点此卷于江宁郡署西偏读易周易虞氏义卷之四，画梅之室。时眼荃有事于婴孩，不暇写梅美余识。周易虞氏义卷之五张惠言学周易下经彖下传、象下传虞氏注","41":"兑下艮上。损，有孚，元吉，无咎，可贞，利有攸往。注：泰初之上，损下益上，以据二阴，故有孚。元吉，无咎，可贞，利有攸往矣。往曷之？用？二簋可用享祭之象。簋，黍稷器。圆曰簋，方日簠。周官瓬人为簋，则簋以制益礼道，为簋取益时。震象，谓二升五，二簋以于上右而簋之象，明当在上益三之后，得也。无二享，酌取也。初二坤速往，酌合损志之于象正。祀旧作巳也。九案二象利贞，征终，弗既损益之。注注：失三位，当复之之坎，刚正惠以，故利贞。征，行也。震为征，失正毁折，故不征。之五则凶。二之五成益，小损大益，故弗损益之矣。六三，三人行，则损一人。注：泰乾三爻为三人，震为行，故三人行。损初之上，故则损一人。一人行，则得其友。注一人谓泰初之上为友，故则得其友，言致一也。六四，损其疾，使遄有喜，无咎。注：四，谓二也。之五，三上复，坎为疾也。损其疾，使遄有喜。二上体观，得正承五，故无咎矣。六五，或益之十朋之龟，弗克违，元吉。注谓二五己变成益，故或益之。坤数十，兑为朋。三上失位，三动，离为龟。十，谓神灵。摄宝文，筮山泽水火之龟，元吉矣。上九，弗损益之，无咎，贞吉。注：损上益三也。上违失正，之三得位，故弗损益之，无咎。贞吉。动成既济，故大得志。利有攸往。得臣无家。注谓三往之上，故利有攸往。二五己动成益，坤为臣，三变据坤，成家人，故曰得臣。动而应三，成既济，则家人坏，故曰无家。彖曰：损，损下益上，其道上行。损而有孚，元吉无咎，可。贞，利有攸往。曷之用？二簋可用享。二簋，应有时。注时谓春、秋也。损二之五，震二月，益正月，春也。损七月，兑八月，秋也。谓春秋祭祀，以时思之。艮为时，震为应，故应有时也。损刚益柔有时。注谓冬、夏也。二五已易成，益坤为柔，谓损益上之三，成既济。坎冬离夏，故损刚益柔有时。损益盈虚，与时偕行。注乾为盈，坤为虚，损刚益柔，故损益盈虚。谓泰初之上，损二之五，益上之三，变通趋时，故与时偕行。益而成既济人道矣。象曰：山下有泽，损，君子以徵忿窒欲。注君子，泰乾。乾阳刚武为忿，坤阴吝啬为欲。损乾之初，成兑说，故徵忿。初上据坤，艮为山，故窒欲也。祀事遄往，上合志也。注终成既济，谓二上合志于五也。九二利贞，中以为志也。注动体离中，故为志也。一人行，三则疑也。注坎为疑。上益三成坎，故三则疑。损其疾，亦可喜也。注二上之五，体大观象，故可喜也。六五元吉，自上右也。弗损益之，大得志也。注谓二五已变，上下益三，成既济。定离坎体正，故大得志。","42":"震下巽上，义盛之始也。同益。利有攸往。注否上之初也。损上益下，其道大光。二秘往坎应五，故利有攸往，中正有庆也。利涉大川。注谓三失正，动成坎，体涣，坎为大川，故利涉大川。涣，舟楫象木道乃行也。初九，利用为大作，元吉无咎。注大作，谓耕播耒耨之利，盖取诸此也。坤为用，乾为大，震为作，故利用为大作体。复初得正，朋来无咎。震三月卦。六二：或益之，十朋之龟，弗克违，永贞吉。注谓故或益之。益作二得正，远应，利三之正，己得承之。坤数十。损兑为朋，兑损体朋。兑之坤为永。上之三得正，故永贞吉。王用享于帝吉。注震称帝，王谓五。否。乾为王，体观象艮为宗庙。三变折坤，牛之卦也。天气施，万物皆益，法天施政教。六三，益之用咎。注坤为事，三多凶。上来益三得正，故益用凶事，无咎。有孚中行，告公用圭。注公谓三，伏阳也。三动体坎，故有孚。震为中，行，为告。三之之圭，桓圭也。六四，中行告公从。注中行，谓震位在中。震为行、为从，故曰中行。公谓三。三上失位，四利。利用为依迁邦。注坤为邦，迁，从也。三动坤从，故利用为依，迁邦也。九五，有孚惠心，勿问，元吉。注谓三、上也。震为问。三、上易位，三象曰勿问之矣。有孚，惠我德。注：坤为我，乾为德。三之上体坎为孚，故惠我德。象曰：大得志。上九，莫益之。注莫，无也。自非上无益初者，唯上当无乾手，故初体。或击之。立心勿恒，凶。注上体巽。彖曰：益。损上益下，民说无疆。注上之初，坤为无疆，震为喜笑。以贵下贱，大得民，故说无疆矣。自上下下，其道大光。注乾为大明，以乾照坤，故其道大光。或以上之三，离为大光矣。利有攸往，中正有庆。注中正谓五，而二应之，乾为庆也。利，涉也。成涣。涣，舟楫象。巽木得水，故木道乃行也。益。动而与，日进无疆。注震三动为离，离为日，巽为进，坤为疆，日与巽俱进，故进无疆也。天施地生，其益无方。注乾下之坤，震为出生。万物出震，故天施地生。阳在坤初为无方。进无疆，故其益无方也。凡益之道，与时偕行。注上来益三，四时象正。艮为时，震为行，与损同义，故与时偕行也。君子以见善则迁，有过则改。注君子，谓乾也。上之三，离为见，乾为善，坤为过，坤三进之乾、四，故见善则迁。复象。复以自知，故有过则改也。元吉无咎，下不厚事也。或益之，自外来也。注乾上称外，来，益三也。益用凶事，固有之矣。注三、上失正，当变，是固有之。告公从，以益志也。注坎为志，三之上，有两坎象，故以益志也。有孚惠心，勿问之矣。惠我德，大得志也。莫益之，徧辞也。注徧，周币也。三体刚，或击之，自外来也。注外谓上。上来之三，故曰自外来也。","43":"乾下兑上。定夬。扬于王庭。注：阳决阴，乾为扬、为王。剥艮为庭，故扬于王庭矣。孚号有厉。注：阳在二五称孚，孚谓五也。二失位，动体巽，巽为号，离为光，不变则危，告自邑，不利。坤逆在上，民众消灭。二变时，离为戎，故不利即戎。所尚乃穷也。利有攸往。注阳息阴消，君子道长，故利有攸往，刚长乃终。初九，壮于前趾，往不胜为咎。注夬变大壮，大壮震为趾，位在前，故壮于前刚。以应刚，不能克之，往如失位，故往不胜为咎。九二，惕号莫夜，有戎，勿恤。注惕，惧也。二失位，故惕。变成巽，故号。剥坤为莫夜。二动成离，离为戎，变而得正，故有戎。四变成坎，坎为忧，坎又得正，故勿恤。谓成既济定也。九三，壮于𬱓，有凶，君子夬夬，独行遇雨，若濡，有愠，无咎。九四，臀无肤，其行次且。注二、四已变，坎为臀。剥艮为肤，毁灭不见，故臀无肤。大壮震为行，坎为破，为曳，故其行次且。牵羊悔亡，闻言不信。注兑为羊，二变巽为绳。剥艮手持绳，故牵。羊谓四之正，得位承五，故悔亡。震为言，坎为耳，震坎象，不正，故闻言不信也。九五，苋陆夬夬，中行无咎。注：苋，说也。苋读夫子苋尔而笑之苋陆，和睦也。震为笑言。五得正位，兑为说，故苋陆夬夬。大壮。震为行。五在上中，动而得正，故中行无咎。旧读言苋陆，字之误也。马君、荀氏皆从俗言苋陆，非也。上六，无号，终有凶。注：应在于三，三动时体巽，巽为号令。四巳变坎之应历险，巽象不见，故无号。位极乘阳，故终有凶矣。彖曰：夬，决也，刚决柔也。注乾决坤也。健而说，决而和。注健，乾，说兑也。以乾阳获阴之和，故𣳏而和也。扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。注乾体大成，以决小人，终乾之刚，故乃以终也。象曰：泽上于天，夬。君子以施禄及下，居德则忌。注君子谓乾，乾为施禄，下谓剥坤。坤为众臣，以乾应坤，故施禄及下。乾为德，艮为居，故居德则忌。阳极阴生，谓阳忌阴，不胜而往，咎也。注往失位应阳，故咎矣。有戎勿恤，得中道也。注动得正应五，故得中道。君子夬夬，终无咎也。其行次且，位不当也。闻言不信，聪不明也。注坎耳离目，折入于兑，故聪不明矣。中行无咎，中未光也。注在坎阴中，故未光也。无号之凶，终不可长也。注阴道消灭，故不可长也。","44":"巽下乾上，阴生言注所谓以乾通坤极遘生，巽为余殃也。遘，遇也。阳称阴，以遇刚为与。复遘女壮。注消卦也。与复旁通。阴伤阳，柔消刚，故女壮也。勿用取女。注阴息剥阳，以柔变刚，故勿用取女不。可与长也。当初六，系于金柅，贞吉。注柅谓二也。巽为绳，故系柅。乾为金，与木入，金柅之象也。初、四失正，易位乃吉，故贞吉矣。有攸往，见凶，羸豕孚矣。决三，夬之四，卦在夬动而体坎，与为舞，为进退，操而舞，故羸豕孚蹢躅。以喻遘女，望于五阳，如豕蹄躅也。九二，包有鱼，无咎，不利宾。注巽为白茅，在中称包。诗云：白茅包之。鱼，谓初阴。巽为鱼。二虽失位，阴阳相承，故包有鱼无咎。宾谓四。乾尊称宾。二据四应，故不利宾。或以包为庖厨也。九三，臀无肤，其行次且，厉，无大咎。注：夬时动之坎为臀，艮为肤。二折艮体，故臀无肤。复震为行，其象不正，故其行次且。三得正位，虽则危厉。九五，以杞苞瓜，含柳木也。杞为苞，乾圜称瓜，故以杞苞瓜矣。含章，谓五也。五欲使初、四易位，以阴含阳，已得乘之，故曰含章。初之四体兑口，故称含也。有陨自天。注陨，落也。乾为天，谓四陨之初，初上承五，故有陨自天矣。上九，遘其角，吝，无咎。注：乾为首，位在首上，故称角。动而得正，故无咎。彖曰：遘，遇也。柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。遘之时义大矣哉！象曰：天下有风。遘。后以施命，诰四方。注后，继体之君。遘阴在下，故称后。乾为施，巽为命、为诰。复震二月东方，遘五月南友，巽八月西方，复十一月北于，皆总在初，故以诰四方也。孔子行夏之时，经用周家之月，夫子传彖象以下，皆用夏家月，是故复为十一月，遘为五月矣。系于金柅，柔道牵也。注阴道柔，巽为绳，牵于二也。包有鱼，义不及宾也。其行次且，行未牵也。注在夬失位，故牵羊。在遘得正，故未牵也。无鱼之凶，远民也。九五，含章，中正也。有陨自天，志不遘。其角。上穷，吝也。","45":"坤下兑上。萃。王假有庙。注观，上之四也。观乾为王，假，至也。艮为庙。体观享祀。上之四，故假有庙，致孝享矣。利见大人，亨，利贞。注大人谓五。三、四失位，利之正，变成离，离为见，故利见大人。亨。利贞，聚以正也。用大牲吉，利有攸往。注坤为牛，故曰大牲。四之三，折坤得正，故用大牲吉。三往之四，故利有攸往，顺天命也。初六，有孚句不终，乃乱乃萃。注：孚谓五也。初、四易位，五坎中，故有孚。失正当变，坤为终，故不终。萃，聚也。坤为乱，为聚，故乃乱乃萃。失位不变，则相聚为乱，故象曰其志乱也。若号一握为笑，勿恤，往无咎。注巽为号，艮为手，初称一，故一握。初动成震，震为笑，四动成坎，坎为恤，故若号一握为笑，勿恤。初之四得正，故往无咎矣。六二，引吉无咎。注：应巽为绳，艮为手，故引吉。得正应五，故无咎。利引四之初，使避巳。孚乃利用禬。注孚谓五。禬，夏祭也。体观象，故利用禬。四之三，故用大牲祭蒸尝，是其义。六三，萃如，嗟如，无攸利，往无咎，小吝。注坤为萃，故萃如。巽为号，故嗟如。失正，故无攸利。动得位句，故往无咎。小吝。往之四，九四大吉无咎。九五，萃有位，无咎。匪孚，元永贞，悔亡。注得位居中，故有位无咎也。部变之正，则五体皆正，故元永贞。与比彖同义。四动之初，故悔亡。上六，赍资涕洟，无咎。注赍，持资赙也。货财丧称赙，涕鼻称洟。坤为财，巽为进，故赍资也。三之四，体离坎艮。为鼻涕，泪流鼻目，故涕洟。得位应三，故无咎。上体大过，死象，故有赍资涕洟之哀咎。彖曰：萃，聚也。顺以说，刚中而应，故聚也。王假有庙，致孝享也。注享，享，祀也。五至初，有观象，谓享坤牛，故致孝享矣。利见大人亨，聚以正也。注坤为聚，坤三之四，故聚以正也。利贞，用大牲吉，利有攸往，顺天命也。注坤为顺，巽为命，三往之四，故顺天命也。观其所聚，而天地万物之情可见矣注三、四易位成离坎，坎月离，日以见天，月以见地，故天地之情可见矣。与大壮、咸、恒同义也。象曰：泽上于地，萃，君子以除戎器，戒不虞。注君子，谓五。除修戎兵也。诗曰：修尔车马、弓矢戎兵。阳在三四为修，坤为器。三、四之正，离为戎兵，甲胄飞矢。坎为弓弧，巽为绳，艮为石，谓敹甲胄，锻厉矛矢，故除戎器也。坎为寇，坤为乱，故戒不虞也。乃乱乃萃，其志乱也。注坎为志，初之四，其志乱也。引吉无咎，中未变也。注二得正，故不变也。往无咎，上巽也。注动之四，故上巽。大吉无咎，位不当也。注以阳居阴，故位不当。动而得正，承五应初，故大吉而无咎矣。萃有位，志未光也。注阳在坎中，故志未光。与屯五同义。赍资涕洟，未安上也。注乘刚远应，故未安上也。","46":"巽下坤上。升，元亨。注临，初之三，又有临象，故元亨也。用见大人，勿恤。注谓二当之五为大人。离为见，坎为恤。二之五得正，故用见大人，勿恤，有庆也。南征吉。注离南方卦，二之五成离，故南征吉，志行也。初六，允升，大吉。九二，孚乃利用禬，无咎。注：礿，夏祭也。孚，谓二之九三。升虚邑。六四，王用亨于岐山，吉。无咎。六五，贞吉，升阶。注：二之五，故贞吉。巽为高，坤为土，震升高，故升阶也。上六，冥升，利于不息之贞。彖曰：柔以时升。注柔谓五，坤也。升谓二。坤邑无君，二当升。五虚震兑为春秋，二升坎离为冬夏，四时象正，故柔以时升也。巽而顺，刚中而应，是以大亨。用见大人，勿恤，有庆也。南征吉，志行也。注二之五，坎为志，震为行。象曰：地中生木。升。君子以慎德，积小以成高大。注君子谓三。小谓阳息复时，复，小为德之本，至二成临。临者，大也。临初之三，巽为高，二之五，艮为慎，坤为积，故慎德。积小，成高大。允升大吉，上合志也。九二之孚，有喜也。注：升五得位，故有喜。升虚邑，无所疑也。注坎为疑，上得中，故无所疑也。王用亨于岐山，顺事也。贞吉升阶，大得志也。冥升在上，消不富也。","47":"坎下兑上，困亨。注否。二之上，乾坤交，故通也。贞大人吉，无咎。注贞大人吉，谓五也。在困无应，宜静则无咎，故贞大人吉，无咎。有言不信。注震为言，折入兑，故有言不信乃穷。初六，臀困于株木，入于幽谷，半三岁不觌。九二，困于酒食，朱绂方来，利用享祀，征凶，无咎。六三，困于石，据于蒺藜。注：二变正时，三在艮山下，故困于石。蒺藜，木名。坎为蒺藜，故据蒺藜者也。入于其宫，不见其妻，凶。注巽为入，二动，艮为宫，兑为妻，谓上无应也。三在离象毁坏，隐在坤中，死其将至也。九四，来荼荼，困于金𬛼，吝有终。注来，欲之初。荼荼，舒迟也。见险，故来荼荼。否。乾为金，险，故困于金𬛼。易位得正，故吝有终矣。九五，劓刖，困于赤绂。注：割鼻曰劓，断足曰刖。四。动时，震为足，艮为鼻，离为兵，兑为刑，故劓刖也。赤绂谓二。否。乾为朱，故赤。有说。注兑为说，坤为徐，二动应已，故乃徐有说也。利用祭祀。上六，困于葛藟，于臲卼。注：巽为草莽，称葛。曰。动悔有悔，征吉。注乘阳故也。而失正，故有悔。三己变正，已得应之，故征吉也。彖曰：困，刚弇也。险以说，困而不失其所，亨，其唯君子乎？贞大人吉，以刚中也。有言不信，尚口乃穷也。注兑为口，上变灭乃穷。象曰：泽无水，困，君子以致命遂志。注君子谓三，伏阳也。中，故致命遂志也。入于幽谷，幽不明也。困于酒食，中有庆也。据于蒺藜，乘刚也。入于其宫，不见其妻，不详也。来荼荼，志在下也。虽不当位，有与也。劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。于葛藟，未当也。注谓三未变，当位应上故也。动悔有悔，吉行也。注行谓三变，乃得当位之应，故吉行者也。既在初二正，功成在切，故上大成而元。","48":"井。改邑不改井。注泰初之五也。无丧无得，往来井井。注无助丧阴，泰初失之，旧五体得，有坎为通，故往来井井。往谓之五，来谓之初也。汔至，亦未几至初改。未繘井，未有功也。羸，钩罗也。艮为手，巽为繘，离为瓶，手繘折其中，故羸其瓶。体兑毁缺，瓶缺漏，故凶矣。初六，井泥不食，旧井无禽。注：食，用也。初下称泥。巽为木果，无噬嗑食象，泥，故不食也。乾为旧，位在阴下，故旧井无禽。时舍也。九二，井谷射鲋，瓮敝漏。注巽为谷、为鲋。鲋，小鲜也。离为瓮，瓮瓶毁缺，羸其瓶凶，故瓮敝漏也。九三，井渫不食，为我心恻。可用汲，王明，并受其福。六四，井甃无咎。注：以瓦甓垒井称甃。坤为土，初之五成离，离火烧土为瓦，治象，故曰井甃无咎，修井也。九五，井冽，寒泉食。注：泉自下出称井。周七月，夏之五月，阴气在下，二巳变坎，十一月为寒泉。初二巳变，体噬嗌食，故冽寒泉食矣。上六，井收勿幕，有孚，元吉。注：幕，盖也。收，谓以辘轳收繘也。坎为车。彖曰：巽乎水而上水，井，井，养而不穷也。注兑饮水，坎为通，往来井井，故养不穷也。改邑不改井，乃未繘不，未有功也。注谓二也。井羸其瓶，是以凶也。象曰：木上有水。井，君子以劳民劝相。注君子，谓泰乾也。坤为民，初上成坎为劝，故劳民劝相。相，助也。谓以阳助坤矣。井泥不食，下也。旧井无禽，时舍也。注谓时舍于初，非其位也。与乾二同义。井谷射鲋，无与也。井渫不食，行恻也。之求王明，受福也。井甃无咎，修井也。注修，治也。寒泉之食，中正也。元吉在上，大成也。注谓初变，成既济定，故大成也。","49":"离下兑上革。己日乃孚，元亨利贞，悔亡。注遁上之初，之他二，蒙欤。蒙旁通，谓四也。正动得位，故悔亡。离为日，孚谓坎。四动体离，五在坎中，故巳日乃孚，以成既济。乾道变化，各正性命，保合太和，乃利贞，故元亨利贞，悔亡矣。与乾彖同义也。初九，巩用黄牛之革。六二，巳日乃革之，征吉，无咎。九三，征凶，贞厉。革言三就，有孚。九四，悔亡，有孚，改命吉。注革而当，其悔乃亡。孚谓五也。巽为命，四动五坎改巽，故改命吉。四乾为君，进退无恒，在离焚弃，体大过死。传以比桀、纣，汤、武革命，顺天应人，故改命吉也。九五，大人虎。变，未，占有孚。注乾为大人，谓五也。蒙坤为虎变。传论汤武，以坤卧为君，视也。离为占，四未之正，五未在坎，故未占有孚也。上六，君子豹变。注蒙艮为君子，为豹，君子豹变也。小人革面，征凶，居贞吉。注阴称，小人也。谓四革为离，以顺承五，故小人革面。乘阳失正，故征凶。得位故居贞吉。蒙艮为居也。彖日：革，水火相息。注息，长也。之以风雨。风巽雨，兑也。四革之正，坎见，故独于此称水也。二女同居，其志不相得曰革。注二女，离兑体，同人象。蒙艮为居志，离火志上，兑水志下，故其志不相得。坎为志也。已日乃孚，革而信之，文明以说，大亨以正。革而当，其悔乃亡。注文明，谓离，说兑也。大亨谓乾。四动成既济定，故大亨以正。革而当位，故悔乃亡也。天地革而四时成。注谓五位成。乾为天。蒙坤为地。震春兑秋，四之正，坎冬离夏，则四时具。坤革而成乾，而四时成也。汤武革命，顺乎天而应乎人。注汤武谓乾，乾为圣人。天谓五，人谓三。四动顺五，应三地，故顺天应人。巽为命也。革之时大矣哉！象曰：泽中有火，革，君子以治历明时。注君子，遁乾也。历象，谓日月星辰也。离为明，坎为月，离为日。蒙艮为星。四动成坎，离，月得正，天地革而四时成，故君子以治历明时也。巩用黄牛，不可以有为也。注得位无应，动而必凶，故不可以有为也。已日革之，行有嘉也。注嘉谓五。乾为嘉。四动承五，故行有嘉矣。革言三就，又何之矣。注四动成既济定，故又何之矣。改命之吉，信志也。注四动成坎，故信志。也。大人虎变，其文炳也。注乾为大明，四动成离，故其文炳也。君子豹变，其文蔚也。注蔚，蔇也。兑小，故其文蔚也。小人革面，顺以从君也。注乾君，谓五也。四变顺五，故顺以从君也。","50":"巽下离上，与屯旁通。天地交，柔进上行，得中应乾五刚，故元吉亨也。初六，鼎颠趾，利出否。得妾以其子，无咎。注趾，足也。应在四。大壮震为足，折入大过，在下，故否。利出之四，故曰利出。兑为妾，四变得正成震，震为长子，继世守宗庙而为祭主，故得妾以其子无咎矣。九二，鼎有实，我仇有疾，不我能即吉。注二为实，故鼎有实也。坤为我，谓四也。二据四妇。三变时，四体坎，坎为疾，故我仇有疾。四之二历险，二动得正，故不我能即吉。九三，鼎耳革，其行塞，雉膏不食。注动成两坎，坎为耳，而革在乾，故鼎耳革。初四变时，震其行塞，为行。鼎以耳行，伏坎，震折而入乾，故坎为膏。初四巳变，三动体颐，颐中无物，离象不见，故雉膏不食。方雨，亏悔，终吉。注谓四已变，三动成坤，坤为方，坎为雨，八圣之具也。谓四变时，震为足，足折入兑，故鼎折足。兑为刑，渥，大刑也。鼎足折，则公𫗧覆，言不胜任，象入大过，死凶，故鼎足折，覆公𫗧，其刑渥凶。铉利贞。注离为黄，三变坎为耳，故鼎黄耳。铉，谓三，贯鼎两耳。乾为金，故金铉。动而得正，故利贞。上九，鼎玉铉，大吉，无不利。注铉谓三。乾为玉铉，体大有。上九自天右之承上，故大吉无不利。谓三亏悔，应上成未济。虽不当位，六位相应，故刚柔节。彖曰：巽耳聪明，为此九三发也。彖曰：鼎象也。注六十四卦，皆观系辞。言象何也？象事知器，故独言象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。注圣人，谓乾。初四易位，体大畜。震为帝，在乾天上，故曰上帝。体颐象，三动噬嗑食，故以享上帝也。大亨，谓天地养万物，圣人养贤以及万民，贤之能者称圣人矣。可巽而耳目聪明注谓三也。三在巽上，动成坎离，有两坎两离象，乃称聪明。月相推而明生焉，故巽而耳目聪明。眇而视不足以有明，闻言不信，聪不明，皆有一离一坎象故也。柔进而上行，得中而应乎刚。注柔谓五，得上中，应乾五刚。巽为进，震为行，非谓应二刚，与睽五同义也。是以元亨。象曰：木上有火。鼎，君子以正位凝命。注君子，谓三也。鼎五爻失正，独三得位，故以正位凝成也。体遘，谓阴始凝初。鼎颠趾，未悖也。利出否，以从贵也。注出初之四，承乾五，故以从贵也。鼎有实，慎所之也。注二变之正，艮为慎。我仇有疾，终无尢也。注不我能即吉，故终无尢也。鼎耳革，失其义也。注鼎以耳行，耳革行塞，故失其义也。覆公𫗧，信如何。在上刚柔也。","51":"震下震上，震亨。震来虩虩。注临二之四，天地交，故通。虩𬤀，谓四也。来应初，初命四变，而来应巳。四失位多惧，故虩虩哑哑。笑且言，谓初也。得正有则，故笑言哑哑，后有则也。震惊百里，不丧匕鬯。注谓阳从临二阴为百二十，举其大数，故当震百里也。坎为棘，匕，上震为鬯，坤为丧。二上之坤，成震体坎，得其匕鬯，故不丧匕鬯也。初九，震来虩虩，后笑言哑哑吉。注虩𬤀，谓四也。初位在下，故后笑言哑哑。得位，故吉也。六二，震来厉，亿丧贝，跻于九陵，勿逐，七日得。注厉，危也。乘刚故厉。亿，惜辞也。坤为丧，三动，离为蠃蚌，故称贝。在艮山下，故称陵。震为足，足乘初九，故跻于九陵。震为逐，谓四，己体复象，故丧贝勿逐。三动时，离为日，震数七，故七日得者也。六三，震苏苏，震行无眚。注：死而复生称苏。三死坤中，动出得正，震为生，故苏苏。坎为眚，三出得正，坎象不见，故无眚。春秋传曰：晋获秦谍，六日而苏也。九四，震遂泥。注：坤土得雨为泥，位在坎中，故遂泥也。六五，震往来厉。注往谓乘阳，来谓应阴。失位乘刚，故往来厉也。亿无丧，有事。注：坤为丧也。事谓祭祀之事。出而体随王，享于西山，则可以守宗庙社稷为祭主，故无丧有事也。上六，震索索，视矍瞿。注上谓四也。欲之三，隔坎，故震索索。三己动，应在离，故矍矍者也。征凶。震不于其躬，于其邻，无咎，婚媾有言。注上得位，震为征，故征凶。四变时，坤为躬，邻谓五也。四上之五，震东兑西，故称邻。之五得正，故不于其躬，于其邻无咎。谓三己变，上应三。震为言，故婚媾有言。彖曰：震亨。震来虩虩，恐致福也。注惧变，承五应初，故恐致福也。笑言哑哑，后有则也。注则，法也。坎为则也。震惊百里，惊远而惧迩也。注远谓四，近谓初。震为百，二谓四出，惊远，初应惧近也。出可以守宗庙社稷，以为祭主也。注为五出之正，震为守，艮为宗庙社稷，长子主祭器，故以为祭主也。象曰：瀳雷震，君子以恐惧修省。注君子谓临二。二出之坤，四体以修身，坤，故以恐惧修省。老子曰：修之身，德乃真也。震来虩虩，恐致福也。注阳称福。笑言哑哑，后有则也。注得正，故有则也。震来厉，乘刚也。震苏苏，位不当也。震遂泥，未光也。注在坎阴中，与屯五同义，故未光也。震往来厉，危行也。注乘刚山顶，故危行也。其事在中，大无丧也。注动出得正，故无丧。震索索，中未得也。注四未之五，故中未得也。虽凶无咎，畏邻戒也。注谓五正位，己乘之逆，畏邻戒也。","52":"艮下艮上。艮其背，不获其身。行其庭，不见其人，无咎。注观五之三也。其背，坤象不见，故不获其身。震为行人，艮为庭，坎为隐伏，故行其庭，不见其人。三得正，故无咎。初六，艮其趾，无咎，利永贞。注震为趾，故艮其趾矣。失位变得正，故无咎，永贞也。六二，艮其腓，不拯其随，其心不快。注：巽长为股，艮小为腓。拯，取也。随，谓下二阴止。震为动，故不拯其随。坎为心，故其心不忮。九三，艮其限，裂其夤，厉阍心。注：限，要带处也。坎为要，五来之三，故艮其限。夤，脊肉。艮为背，坎为脊，艮为手，震起艮止，故裂其夤。坎为心。厉，危也。艮为阍，阍，守门人。坎盗动门，故厉。阍心，古阍作熏字，熏灼人也。荀氏以熏为勋，读作动，皆非也。六四，艮其身，无咎。注：身，腹也。观坤为身，故艮其身。得位承五，故无咎。或谓妊身也。五动，则四体离妇，离为大腹，孕之象也，故艮其身。得正承五，而受阳施，大任有身，生此文王也。六五，艮其辅，言有孚，悔亡。注辅，面颊骨，上颊车者也。三至上体颐象。艮为止，在坎车上，故艮其辅，谓辅车相依也。上九，敦艮吉。注无应静止，下据二阴，故敦艮吉也。彖曰：艮，止也。注位穷于上，故止也。时止则止，时行则行。注时止谓上，阳穷止，故止。时行，谓三体处震为行也。动静不失其时，其道光明。注动谓三，静谓上。艮止则止，震行则行，故不失时。五动成离，故其道光明。艮其止，止其所也。注谓两象各止其所。上下敌应，不相与也。注艮其背，背也。两象相背，故不相与也。是以不获其身，行其庭，不见其人，无咎也。象曰：兼山艮，君子以思不出其位。注君子，谓三也。三，君子位。震为出，坎为隐伏，为思，故以思不出其位也。艮其趾，未失正也。注动而得正，故未失正也。不拯其随，未违听也。注坎为耳，故未违听也。艮其限，危阍心也。注坎为心，坎盗动门，故危。阍心也。艮其身，止诸躬也。注艮为四，五动乘四则妊身，故止诸躬也。艮其辅，以中正也。注五动之中，故以正中也。敦艮之吉，以厚终也。注坤为厚，阳上据坤，故以厚终也。周易虞氏义卷之五，端阳校点周易虞氏义卷之六张惠言学周易下经彖下传、象下传虞氏注","53":"艮下巽上。渐女归吉，利贞。注：否三之四，女谓四。归，嫁也。坤三之四，承五，进得位，往有功，反成归妹兑女归吉。初、上失位，故利贞，可以正邦也。初六，鸿渐于干，小子厉，句，有言无咎句。注：鸿，大雁也。离五鸿，渐，进也。小水从山流下称干。艮为山，为小径，坎水流下山，故鸿渐于干也。艮为小子，初失位，故厉。变得正。三动受上成震，震为言，故小子厉，有言无咎也。六二，鸿渐于磐，饮食衎衎吉。注：艮为山石，坎为聚，聚石称磐。初巳之正体噬嗑食。坎水阳物并在颐中，故饮食衎衎。得正应五，故吉。九三，鸿渐于陆。注：高平称陆，谓初巳变，坎水为平。三动之坤，故鸿渐于陆。夫征不复。注谓初己之正，三动成震，震为征、为夫，而体复象。坎阳死坤中，坎象不见，故夫征不复也。妇孕不育凶。注孕，妊娠也。育，生也。巽为妇，离为孕。三动成坤，离毁失位，故妇孕不育凶。利用御寇。注御，当也。坤为用，巽为高，艮为山，离为戈兵、甲胄，坎为寇，顺相保，保大也。六四，鸿渐于木，或得其桷，无咎。注巽为木。桷，椽也，方者谓之桷。巽为交，为长木，艮为小木，坎为脊，离为丽，小木丽长木，与绳束之象，脊之形，椽桷象也。承五，又顾得三，故或得其桷也矣。九五，鸿渐于陵，妇三岁不孕。国陵丘妇，谓四也。三动受上时，而四体半艮山，故称陵。巽为妇。终莫之胜吉。注莫无胜，陵也。得正居中，故莫之胜吉。上终变之三，成既济定。坎为心，故象曰得所愿也。上九，鸿。渐于陆，注陆，谓三也。三坎为平，变而成坤，故称陆也。其羽可用为仪，吉。注谓三变，受上之三得正，离为鸟，故其羽可用为仪吉。三动失位，坤为乱，乾四止坤，象曰不可乱。彖曰进以正邦，为此爻发也。三巳得位，又变受上，权也。孔子曰：可与适道，未可与权，宜无怪焉。彖曰：渐之进也，女归吉也。注三进四得位，阴阳体正，故吉也。进得位，往有功也。注功谓五。四进承五，故往有功。巽为进也。进以正，可以正邦也。其位，刚得中也。注谓初已变为家人。四进己正而切不正。三动成坤为邦。上来反三，故进以正，可以正邦。其位刚得中，与家人道正同义。三在外体之中，故称得中。乾交言曰：中不在人，谓三也。此可谓上变既济定者也。止而巽，动不穷也。注止，艮也。三变震为动，上之三，据坤动震成坎，坎为通，故动不穷。往来不穷，谓之通。象曰：山上有木。渐。君子以居，贤德善俗。注君子谓否乾。乾为贤德，坤阴小人柔弱为俗。乾四之坤，为艮为居，以阳善阴，故以居贤德善俗也。小子之厉，义无咎也。注动而得正，故义无咎也。饮食衎衎，不素饱也。注素，空也。承三应五，故不素饱。夫征不复，离群丑也。注坤三爻为丑，物三称群也。妇孕不育，失其道也。注三动离毁，阳陨坤中，故失其道也。利用御寇，顺相保也。注三动坤顺，坎象不见，故以顺相保也。或得其桷，顺以巽也。注坤为顺，以与顺五。终莫之胜吉，得所愿也。注上之三，既济定，故得所愿也。其羽可用为仪，吉，不可乱也。注坤为乱，上来正坤，六爻得位，成既济定，故不可乱也。","54":"兑下震上，归妹。注归，嫁也。泰三之四，坎月离日，俱归妹象。阴阳之义，配日月，则天地交而万物通，故以嫁娶也。征凶。注谓四也。震为征，三之四，不当位，故征凶也。无攸利。注谓三也。四之三，失正无应，以柔乘刚，故无攸利也。初九，归妹以娣，跛而履，征吉。注震为兄，故嫁妹，谓三也。履，礼也。初九应变成坎，坎为曳，故跛而履。应在震为征，初为娣，变为阴，故征吉也。九二，眇而视，利幽人之贞。注视，应五也。震上兑下，离目不正，故眇而视。幽人谓二。初动，二在坎中，故称幽人。变得正，震喜兑说，故利幽人之贞，与履二同义也。六三：归妹以须，反归以娣。注须，需也。初至五体需象，故归妹以须。娣谓初也。震为反，反马，归也。三失位，四反得正，兑进在四见初，进之初在兑后。妹愆期，迟归有时。注愆，过也。谓二变。三动之正，体大过象。坎月离日为期。三变，日月不见，故愆期。坎为曳，震为行，行曳，故迟也。归谓反三。震春兑秋，坎冬离夏，四时体正，故归有时也。六五，帝乙归妹。其君之袂，不如其娣之袂良。注三四巳正，震为帝，坤为乙，故曰帝乙。泰乾为良，为君，乾在下为小，君，则妹也。袂，口句之饰也。兑为口，乾为衣，故称谓。三失位无应，娣谓二，得中应五。三动成乾为良，故其君之不如其娣之良，故象曰以贵行也矣。在月几望，吉。注几，其也。坎月，离二之五，四复三得正，故吉也。与小畜、中孚月几望同义也。上六，女承筐，无实。注女谓应三，兑也。自下受上称承。震为筐，以阴应阴，三四复。位坤为虚，故无实。象曰：承虚筐也。士刲羊无血，无攸利。注刲，敕也。震为士，兑为羊，离为刀，故士刲羊。三四复位成泰，坎象不见，故无血。三柔承刚，故无攸利也。彖曰：归妹，天地之大义也。注乾天坤地。三之四，天地交，以离日坎月，战阴阳，阴阳之义配日月，则万物兴，故天地之大义。乾主壬，坤主癸，日月会北，震为元黄，天地之杂。震东兑西，离南坎北。六十四卦，此象最备，四时正卦，故天地之大义也。天地不交，而万物不兴。注乾三之坤四，震为兴。天地以离坎交阴阳，故天地不交，则万物不兴矣。归妹，人之终始也。注人始生乾而终于坤，故人之终始。杂卦曰：归妹，女之终。谓阴终坤癸，则乾始震庚也。小说以动，所归妹也。注说，兑动，震也。谓震嫁兑，所归必妹也。征凶，位不当也。无攸利，柔乘刚也。象曰：泽上有雷。归妹。君子以永终知敝。注君子，谓乾也。坤为永终，为敝，乾为知。三之四为永终，四之三，兑为毁折，故以永终知敝。归妹以娣，以恒也。跛而履，吉，相承也。注阳得正，故以恒。恒动，初承二，故吉相承也。利幽人之贞，未变常也。注常，恒也。乘初未之五，故未变常矣。归妹以须，位未当也。注三未变之阳，故位未当。愆期之志，有待而行也。注待男行矣。帝乙归妹，不如其娣之良也。注三四复正，乾为良。其位在中，以贵行也。注三四复二之五，成既济。五贵，故以贵行也。上六，无实，承虚筐也。注泰坤为虚，故承虚筐也。","55":"离下震上，丰亨。注此卦三阴三阳之例，当从泰二之四，而丰三从噬嗑。上来之三，折四于坎狱中而成丰，故君子以折狱致刑。阴阳交，故通。噬嗑。所谓利用狱者，此卦之谓也。王假之注乾为王，假，至也。谓四宜上至五，下动之正成乾，故王假之，尚大也。勿忧，宜曰中。注五动之正，则四变成离，离日中，当五句在坎中，坎为忧，故勿忧，宜日中。体两离象，照天下也。日中则昃，月盈则食。天地盈虚，与时消息。初九，遇其妃主。注：妃嫔，谓四也。四失位，在震为主，五动体遘遇，故遇其配主也。虽旬无咎，往有尚。注谓四失位，变成坤，应初，坤数十，呼上之五成离。离为日。六二：丰其蔀，日中见斗，往得疑疾。注：日蔽云中称蔀。蔀小，谓四也。二秋四之五，故丰其蔀。噬嗑离为见，象，在上为日中。艮为斗，斗，七星也。噬嗑艮为星，为止，坎为北中，巽为高舞，星止于中而舞者，北斗之象也。离上之三，隐坎云下，故日中见斗。正成坎，坎为疑疾，故往得疑疾也。有孚发若，吉。注坎为孚，四发之五，成坎孚也。九三，丰其沛，日中见沬。注：日在云下称沛。沛，不明也。沫，小星也。噬嗑离为日，艮为沬，故日中见沬。上之三，日入坎云下，故见沬也。折其右肱，无咎。注兑为折，为右。噬嗑艮为肱。上来之三，折艮入兑，故折其右肱。之三得正，故无咎也。九四，丰其蔀，注：蔀，蔽也。噬嗑离之坎云中，故丰其蔀。象曰：位不当也。日中见斗注：噬嗑日在上为中，上之三为与，巽为入，日入坎云下，幽伏不明，故日中见斗。象曰幽不明，是其义也。遇其夷主，吉。注震为主，四行之正，成明夷。则三体震为夷主，故遇其夷主吉也。六五来章。有庆誉吉。注在内称来。章，显也。庆谓五，阳出称庆也。誉谓二。二多誉。五发得正，则来应二，故来章有庆誉吉也。上六，丰其屋，蔀其家。注丰大蔀小也。三至上体大壮，屋象，故丰其屋。谓四五已变，上动成家人，大屋见则家人坏，故蔀其家。与泰二同义，故象曰天降祥。明以大壮为屋象故也。𬮭其户，阒其无人，三岁不觌凶。注谓从外𬮭三应。阒，空也。原动时，坤为阖，户阖，故𬮭其户。坤为空虚，三隐伏坎中，故阒其无人。象曰：自藏也。四五易位，噬嗑，离目为𬮭。𬮭人者，言皆不见。坎为三岁。坤冥在上，离象不见，故三岁不觌凶。彖曰：丰，大也。明以动，故丰。王假之，尚大也。勿忧，宜日中，宜照天下也。注五动成乾，乾为天，四动成两离，重明丽正，故宜照天下，谓化成天下也。中则昃，月盈则食。注月之行生震见兑，盈于乾甲。五动成乾，故月盈。四变体噬嗑食，故则食。此丰其屋，蔀其家也。天地盈虚，与时消息，而况于人乎？况于鬼神乎？注五息成乾为盈，四消入坤为虚，故天地盈虚也。丰之既济，四时象具人谋冬鬼谋，百姓与能，与时消息。象曰：雷电皆至。丰。君子以折狱致刑。注君子谓三。噬嗑。四失正，系在坎狱中，故上之三折四入大过，死象，故以折狱致刑。兑折为刑。贲。三得正，故无敢折狱也。虽旬无咎，过旬，灾也。注体大过，故过旬灾。四上之五，坎为灾也。有孚发若，信以发志也。注呼发之五，坎为志也。丰其沛，不可大事也。注利四之阴，故不可大事。折其右肱，终不可用也。注四死，大过当也。曰：中见斗，幽不明也。注离上变，入坎云下，故幽不明。坎幽也。遇其夷主，吉行也。注动体明夷，震为行，故曰吉行。六五之吉，有庆也。注动而成乾，乾为庆。丰其屋，天际祥也。𬮭其户，阒其无人，自藏也。注谓三隐伏坎中，故自藏者也。","56":"艮下离上。旅。小亨。旅，贞吉。注贲初之四，否三之五，非乾坤往来也，与噬嗑之丰同义。小，谓柔能恶，进退无恒，无所容处，故再言旅，恶而愍之。初六，旅琐琐，斯其所取灾。注：琐琐，最蔽之貌也。失位远应之正，介坎正，坎为灾眚，艮手为取。谓三动应坎。六二，旅即次，怀其资，得僮仆贞。注：艮为僮仆，故得僮仆贞而终无尢也。九三，旅焚其次，丧其僮仆，贞厉。注：离为火，艮为僮仆。三动艮坏，故焚其次。动而失正，故贞厉矣。九四，旅于处，得其资斧，我心不快。注：吴为处，四焚弃恶人，失位远应，故旅于处，言无所从也。三动四，坎为心，其位未至，故我心不忮也。注三变坎为弓，离为矢，故射雉。五变乾体矢动，雉飞，雉象不见，故一矢亡矣。终以誉命。注誉谓二。巽为命。五终变成乾，则二来应已，故终以誉命。上九，鸟焚其巢，旅人先笑，后号啕。注：离为鸟、为火，巽为木、为高。四失位，变震为筐，巢之象也。今巢象不见，故鸟焚其巢。震为笑，震在前，故先笑。应在巽，巽为号啕，巽象在后，故后号啕。丧牛于易，凶。注谓三动时，坤为牛，五动成乾，乾为易。上失三，五动应二，故丧牛于易。失位无应，故凶也。五动成遁，六二执之用黄牛之革，则旅家所丧牛也。彖曰：旅，小亨。柔得中乎外，而顺乎刚，止而丽乎明。是以小亨。旅贞吉也。旅之时义大矣哉。注以离丽天，县象著明，莫大月，故义大也。象曰：山上有火，旅。君子以明慎用刑，而不留狱。注君子谓三刑。坎为狱。贲初之四，狱象不见，故以明慎用刑而不留狱，与丰折狱同义者也。旅琐琐，志穷，灾也。注谓三动应坎，坎为志，坤称穷，故曰志穷灾也。得僮仆贞，终无尤也。旅焚其次，亦以伤矣。注三动体剥，故伤也。以旅与下，其义丧也。注三变成坤，坤为下，为丧，故其义丧也。旅于处，未得位也。得其资斧，心未快也。终以誉命，上逮也。注逮，及也，谓二上及也。以旅在上，其义焚也。注离火焚巢，故其义焚也。丧牛之凶，终莫之闻也。注坎耳入兑，故终莫之闻。","57":"巽下巽上，巽，小亨，利有攸往，利见大人。注遁二之四，柔得位而顺五刚，故小亨也。大人谓五。离目为见。二失位利正，往应五，故利有攸往，利见大人矣。初。初六，进退，利武人之贞。注巽为进退，乾为武人。初失位，利之正为乾，故利武人之贞矣。九二，巽在床下，用史巫，纷若，吉，无咎。九三，频巽，吝。注频，頞也。谓二已变，三体坎，艮言。坎为忧，艮为鼻，故频巽。无应在险，故吝也。六四，悔亡，田获三品。注田谓二也。地中称田，失位无应，悔也。欲二之初，已得应之，故悔亡。二动得正，处中应五，五多功，故象曰有功也。二动，艮为手，故称获。谓艮为狼，坎为豕，艮二之初，离为雉，故获三品矣。九五，贞吉，悔亡，无不利，无初有终。注得位处中，故贞吉悔亡，无不利也。震巽相薄，雷风无形，当变之震矣。巽究为躁卦，故无初有终也。先庚三日，后庚三日吉。注震庚也，谓变初，故先庚三日，谓益时也。动四至五成离，终上成震，震爻在后，故后庚三日也。巽初失正，终变成震，得位，故无初有终吉。震究为蕃鲜，白谓巽白。巽究为躁卦，躁卦谓震也。与蛊先甲三日，后甲三日同义。五动成蛊，乾成于甲，震成于庚，阴阳天地之始终，故经举甲庚于蛊。彖。巽五也。上九，巽在床下。注床下，谓初也。穷上反下成震，故巽在床下。象曰：上穷也。明当变穷上而复初者也。丧其齐斧，贞凶。注变至三，时为齐，离为斧，故丧其齐斧。三变失位，故贞凶。彖曰：重巽以申命。刚巽乎中正而志行。注刚中正，谓五也。二失位，动成坎，坎为志，终变成震，震为行也。柔皆顺乎刚，是以小亨。利有攸往，利见大人。象曰：随风巽，君子以申命行事。注君子，谓遁乾也。巽为命，重象，故申命。变至三，坤为事，震为行，故行事也。进退，志疑也。利武人之贞，志治也。注动而成乾，乾为大明，故志治。乾元用九无下治，是其义也。纷若之吉，得中也。频巽之吝，志穷也。田获三品，有功也。九五之吉，位正中也。注居中得正，故吉也。巽在床下，上穷也。注阳穷上反下，故曰上穷也。丧其齐斧，正乎凶也。注上应于三，三动失正，故曰正乎凶也。","58":"兑下兑上，兑亨，利贞。注大壮，五之三也。刚中而柔外。二失正，动应五，承三，贞也。初九，和兑吉。注得位，四变应已，故和兑吉矣。九二，孚兑吉，悔亡。注孚谓五也。四巳变之，故孚兑吉，悔亡矣。还。六三来兑凶。注从大壮来，失位，故来兑凶矣。九四，商兑未宁，介疾有喜。注：巽为近，利市三倍，故称商。兑变之坎，水性流，震为行，谓二已变，体比象，故未宁，与比不宁方来同义也。坎为疾，故介疾。得位承五，故有喜。九五，孚于剥，有厉。注孚，谓五也。二、四变，体剥象，故孚于剥。在坎未光，有厉也。上六引兑。注无应乘阳，动而之巽为绳，艮为手，应在三，三未之正，故引兑也。彖曰：兑，说也。注兑故说也。刚中而柔外，说以利贞。注刚中，谓二五。柔外谓三、上也。二、三四利之正，故说以利贞也。是以顺乎天而应乎人。注大壮，乾为天，谓五也。人，谓三矣。二变顺五承三，故顺乎天，应乎人。坤为顺也。说以先民，民忘其劳。注谓二、四巳变成屯。坎为劳，震喜、兑说。坤为民，坎为心，民心喜说，有顺比象，故忘其劳也。说以犯难，民忘其死。注体屯，故难也。三至上体大过，死变成屯，民说无疆，故民忘其死。坎心为忘，或以坤为死也。说之大，民劝矣哉。注体比顺象，故劳而不怨。震为喜笑，故人劝也。象曰：丽泽兑，君子以朋友讲习。注君子，大壮乾也。之兑。二阳同类为朋，伏艮为友，坎为习，震为讲对，故朋友讲习也。和兑之吉，行未疑也。注：四变应初，震为行，坎为疑，故行未疑。孚兑之吉，信志也。注二变应五，谓四已变，坎为志，故信志也。来兑之凶，位不当也。九四之喜，有庆也。注阳为庆，谓五也。孚于剥，位正当也。上六引兑，未光也。注二、四已变，而体屯。上、三未为离，故未光也。","59":"坎下巽上。涣亨。注否四之二成坎，与天地交，故亨也。王假有庙。注乾为王，假，至也。否体观，艮为宗庙，乾四之坤二，故王假有庙，王乃在中也。利涉大川，利贞。注坎为大川，涣舟楫象，故涉大川，乘木有功。二失正，变应五，故利贞也。初六，用拯马壮，吉。注坎为马。初失正，动体大壮得位，故拯马壮吉，悔亡之矣。九二，涣奔其机，悔亡。注：震为奔，坎为棘，为矫𫐓，震为足，𫐓，棘有足，艮肱据之，凭机之象也。涣宗庙中，故设机。二失位，变得正，故涣奔其机，悔亡也。六三，涣其躬，无悔。六四，涣其群，元吉。注谓二已变成坤，坤三爻称群，得位顺五，故元吉也。涣有丘，匪夷所思。注位半艮山，故称丘。匪，非也。夷谓震。三变坎为思，故匪夷所思也。九五，涣汗其大号，涣王居，无咎。上九，涣其血去，逖出，无咎。注应在三。坎为血、为逖。逖，忧也。二变为观，坎象不见，故其血去逖出无咎。彖曰：涣亨。刚来而不穷。柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。注巽为木，坎为水，故乘木有功也。象曰：风行水上，涣。先王以享于帝立庙。注：否，乾为先王，享，祭也。震为帝、为祭，艮为庙。四之二，杀坤大牲，故以享帝立庙。谓成既济，有噬嗑食象故也。初六之吉，顺也。注承二，故顺也。涣奔其机，得愿也。注动而得位，故得愿也。涣其躬，志在外也。涣其群，元吉，光大也。注谓三，己变成离，故四光大也。王居无咎，正位也。注五为王，艮为居，正位居五，四阴顺命，故王居无咎，正位也。涣其血，远害也。注乾为远，坤为害，体遁上，故远害也。","60":"兑下坎上，故节亨。注泰三之五，天地交也。五当位，以节以通。故节，亨也。苦节，不可贞。注谓上也。应在三。三变成离，火炎上作苦，位在火上，故苦节。虽得位乘阳，故不可贞。初九，不出户庭，无咎。注：泰，坤为户，艮为庭，震为出。初得位应四，故不出户庭无咎矣。九二，不出门庭凶。注：变而之坤，艮为门庭。二失位不变，出门应五则凶，故言不出门庭凶矣。六三，不节若，则嗟若，无咎。注：三，节家君子也。失位故节若。嗟，哀号声。震为音声，为出。三动得正，而体离、坎变，涕流出目，故则嗟若。得位乘二，故无咎也。六四，安节，亨。注：二巳变，艮止坤安。得正承五，有应于初，故安节亨。九五，甘节吉，往有尚。注：得正居中，坎为美，故甘节吉。往谓二。二失正，变往应五，故往有尚也。上六，苦节，贞凶，悔亡。注：二、三变在两离，火炎上作苦，故苦节。乘阳故贞凶，得位故悔亡。彖曰：节，亨。刚柔分而刚得中。苦节不可贞，其道穷也。注位极于上，乘阳故穷也。说以行险。注兑说坎险，震为行，故说以行险也。当位以节，中正以通。注中正谓五，坎为通也。天地节而四时成。注：泰乾天坤地，震春、兑秋、坎冬。三动离为夏，故天地节而四时成也。节以制度，不伤财，不害民。注良手称制，坤数十为度，坤又为害，为民、为财。二动体剥，剥为伤。三出复位，成既济，定坤，剥不见，故节以制度，不伤财，不害民。象曰：泽上有水，节，君子以制数度，议德行。注君子，泰乾也。艮止为制，制数度，议德行。乾三之五为制数度，坤玉之乾，为议德行也。不出户庭，知通塞也。注坎为通，二变坤土壅，初为塞。道不出门庭凶，失时极也。注极，中也。未变之正，失时极矣。不节之嗟，又谁咎也。安节之亨，承上道也。甘节之吉，居位中也。注艮为居，五为中，故居位中也。苦节贞凶，其道穷也。","61":"兑下巽上，中孚。注：讼，四之初也。坎孚象，在中，谓二也，故称中孚。此当从四阳二阴之例。遁阴未及三，而大壮阳已至四，故从讼来。二在讼时，体离为鹤，在坎阴中，有鸣鹤在阴之义也。遁鱼吉，利涉大川。注坎为大川，谓二己化邦。三利象，故利涉大川。乘木舟虚也。利贞。注谓二利之，正而应五也。中孚以利贞，乃应于天也。初九，虞吉，有它不燕。九二：鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。注靡，共也。震为鸣。讼离为鹤，坎为阴夜，鹤知夜半，故鸣鹤在阴。二动成坤，体益五。艮为子，震巽同声者相应，故其子和之。坤为身，故称我。吾，谓五也。离为爵，爵位也。坤为邦国。五在艮阍寺庭阙之象，故称好爵。五利口，变之正应，以故吾与尔靡之矣。六三，得敌，或鼓或罢，或泣或歌，匹亡，无咎。注讼坎为月，离为日，兑西震东，月在兑坎。匹，乾两马。初、四易位。震为奔，走体遁山中，乾坎不见，故马匹亡。初、四易位，故无咎矣。九五，有孚，挛如，无咎。注孚，信也。谓二在坎为孚，与绳艮手，故挛。二使化为邦，得正应已，故无咎也。上九，翰音登于天，贞凶。注巽为鸡，应在震，震为音。翰，高也。巽为高，乾为天，故翰音登于天。失位，故贞凶。礼荐牲，鸡称翰音也。彖曰：中孚。柔在内而刚得中。说而巽，孚，说乃化邦也。注二化应五，成坤，坤为邦，故化邦也。遁鱼吉，信及遁鱼也。利涉大川，乘木，舟虚也。中孚，以利贞，乃应乎天也。注讼，乾为天，二动应乾，故乃应乎天也。象曰：泽上有风。中孚，君子以议狱缓死。注君子，谓乾也。讼，坎为狱，震为议、为缓，坤为死。乾四之初，则二出坎狱，兑说震喜，坎狱不见，故议狱缓死也。初九虞吉，志未变也。其子和之，中心愿也。注坎为心，动得正应五，故中心愿也。或鼓或罢，位不当也。马匹亡，绝类上也。注讼初之四，体与上绝，故绝类上也。有孚挛如，位正当也。翰音登于天，何可长也。","62":"艮下震上。小过，亨，利贞。注晋上之二，当从四阴二阳临观之例。临阳未至三，而观四已消也，又有飞鸟之象，故知从晋来。杵自之利，盖取诸此。柔得中而应乾刚，故亨。五失正，故利贞。过以利贞，与时行也。可小事。注小谓五。晋坤为事，柔得中，故可小事也。不可大事。注大事四。宜上宜下，大吉。注离为飞鸟，震为音，艮为止。晋上之三，离去震在，鸟飞而音止，故飞鸟遗之音。上阴𣒧阳，故不宜上；下阴顺阳，故宜下大吉。俗说或以卦象二阳在内，四阴在外，有似飞鸟之象，妄矣。初六，飞鸟以凶。注应四，离为飞鸟死，故飞鸟以凶。六二，过其祖，遇其妣。注祖谓祖母初也。母死称妣，谓三。坤为丧，为母，折入大过，死，故称祖也。妣。二过初，故过其祖。五变三体遘遇，故遇妣也。不及其君，遇其臣，无咎。注五动为君，晋坤为臣。二之五，隔三，艮为止，故不及其君。止如通。承三得正，体遘遇象，故遇其臣无咎也。防之句，从或戕之，凶，失位从或而欲折之初。戕，杀也。离。为戈兵。三从离上入坤折四，死大过中，故从或戕之，凶也。九四，无咎，弗过遇之，往厉必戒，勿用永贞。六五，密云不雨，自我西郊。注：密，小也。晋坎在天为云，坠地成雨。上来之三，折坎入兑，小为密。坤为自我，兑为西。五动乾为郊，故密云不雨，自我西郊也。公弋取彼在穴。注公，谓三也。弋，矰缴射也。坎为弓弹，离为鸟矢，弋，无矢也。巽绳连鸟弋人，鸟之象。艮为手，二为穴，手入穴中，故公弋取彼在穴也。上六，弗遇过之，飞鸟离之，凶，是谓灾眚。注谓四。巳变之坤，离为飞鸟，公弋得之，鸟下入艮手而死，故飞鸟离之凶。晋坎为灾眚，故是谓灾眚矣。彖曰：小过，小者，过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。注谓五也。阴称小，故小事吉也。刚失位而不中，是以不可大事也。注谓四也。阳称大，故不可大事也。有飞鸟之象焉。飞鸟遗之音，不宜上宜下，大吉，上逆而下顺也。象曰：山上有雷。小过，君子以行过乎恭。注君子，谓三也。上贵三贱。晋上之三，震为行，故行过乎恭。谓三致恭以存其位，与谦三同义。丧过乎哀。注晋坤为丧，离为目，艮为鼻，坎为涕洟，震为出，涕洟出鼻目。体大过，遭死丧，过乎哀也。用过乎俭。注坤为财用，为吝啬。艮为止，兑为小，小用止，密云不雨，故用过乎俭也。飞鸟以凶，不可如何也。注四死大过，故不可如何也。不及其君臣，不可过也。注体大过下，止舍巽下，故不可过义。从或戕之，凶如何也。注三来戕四，故凶如何也。弗过遇之，位不当也。往厉必戒，终不可长也。注体否上倾，故终不可长矣。密云不雨，巳上也。注谓三坎水，已之上六，故巳上也。弗遇过之，已亢也。注飞下称亢，上之三，巳亢也。","63":"离下坎上。既济。亨小
