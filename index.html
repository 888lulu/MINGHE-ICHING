之始也。“以美利利天下”者，元能始物，能使庶物生成，无物不嘉美，亦无物不利赖也。“不言所利”者，自成其形，自成其性，泯机缄于不露，莫知其所以然也。“大哉”，赞乾元也。\n孔子于《文言》，既分“元亨利贞”为四德矣，此义合而为一也。言乾之“元”者，始而即“亨”者也。“利贞”者，则元之性情耳。然何以知其“元始”即“亨”，“利贞”即“元”之性情也？惟自其“乾元”之所能者，则可见矣。盖百物生于春，非“亨利贞”之所能也。惟“元”为生物之始，“以美利利天下”者，则乾元之能也。夫“以美利利天下”，其所能之德业亦盛大矣。使造化可以言焉，则曰“此某之美利也”，庶乎可以各归功于四德矣。今“不言所利”，人不得而测之。既不可得而测，则是四德浑然一理，不可分而言也。“元”本为四德之长，故谓“亨”，乃“元”之“始亨”可也。谓“利贞”，乃“元”之“性情”可也。所以谓“乾元始而亨”、“利贞性情”者以此。乾元之道不其大哉！四德本一理，孔子赞《易》，或分而言之以尽其用，或合而言之以著其体，其实一理而已，所以可分可合也。\n大哉乾乎，刚健中正，纯粹精也！六爻发挥，旁通情也。“时乘六龙”，以御天也。“云行雨施”，天下平也。\n“刚”以体言；“健”以性言；“中”者，无过不及也；“正”者，不偏也。此四者，乾之德也。“纯”者，纯阳而不杂以阴也，“粹”者，不杂而良美也，“精”者，不杂之极至也，总言乾德“刚健中正”之至极。所谓“纯粹精者”，非出于“刚健中正”之外也。但乾德之妙，非一言所能尽，故于“刚健中正”之外，复以“纯粹精”赞之。“情”者，事物至赜至动之情也。“发挥”者，每一画有一爻辞以发挥之也。“旁通”者，曲尽也。如初之“潜”，以至上之“亢”。凡事有万殊，物有万类，时有万变，皆该括曲尽其情而无遗也。前“品物流形”，乃乾之“云行雨施”。此言“云行雨施”，乃圣人“乘六龙”而御天之功，德泽流行敷布，所以天下平也。\n言乾道刚健中正，纯粹以精，乾道固大矣。惟圣人“立六爻”以通乎乾之情，“乘六龙”以行乎乾之道，“云行雨施”以沛乎乾之泽，以至“天下太平”，则乾道之大不在乾，而在圣人矣。此第五节，复申首章之意。\n叶韵读也字，如《楚辞》之些。\n君子以成德为行，日可见之行也。潜之为言也，隐而未见，行而未成，是以君子弗用也。\n“德”者行之本，“行”者德之用，故曰“君子以成德为行”。“成德”者，已成之德也；“日可见”者，犹言指日可待之意。此二句泛论其理也。“潜”者，周公爻辞也。“未见”者，“天地闭，贤人隐”，厄于潜之机会而未见也。“未成”者，因其厄而事业未成就也，如伊尹耕于有莘之野是也。\n君子以已成之德，举而措之于行，则其事业之所就，指日可见矣。初九其德已成，则“日可见之行”也，而占者乃曰“勿用”，何也？盖圣人出世，必有德有时。人之所能者德，所不能者时，今初九虽德已成，然时当乎“潜”也。“潜”之为言也，隐而未见也。惟其“隐而未见”，故“行而未成”，时位厄之也。是以占者之君子，亦当如之而勿用也。\n君子学以聚之，问以辨之，宽以居之，仁以行之。《易》曰“见龙在田，利见大人”，君德也。\n“之”者，正中之理也。龙德正中，虽以爻言，然圣人之德不过此至正大中而已。盖乾道刚健中正，民受天地之中以生，惟中庸不可能。苟非学聚问辨，有此致知功夫，宽居仁行，有此力行功夫，安能体此龙德之正中乎？“聚”者，多闻多见，以求会聚，此正中之理也；“辨”者，讲学也。亲师取友，辨其理之精粗本末、得失是非，择其正中之善者而从之，即“讲学以耨之”也。“宽”者，优游厌饫，勿忘勿助，俾所聚所辨，此理之畜于我者，融会贯通，渣滓浑化，无强探力索、凌节欲速之患也。盖“宽”字以久远言，有从容不迫之意，非专指包含也。“居”者，守也，据也。仁以行之者，无适而莫非天理正中之公，而无一毫意必固我之私也。盖“辨”者辨其所聚，“居”者居其所辨，“行”者行其所居，故必“宽以居之”，而后方可“仁以行之”。若学聚问辨之余，涵养未久，粗心浮气，而骤欲见之于实践，则居之不安、资之不深，安能左右逢原，而大公以顺应哉！此为学一定之序也。有是四者，宜乎正中之德，博而化矣。曰“君德”者，即前九二之“君德”也。\n九三，重刚而不中，上不在天，下不在田。故乾乾因其时而惕，虽危无咎矣。\n三居下卦之上，四居上卦之下，交接处以刚接刚，故曰“重刚”。非阳爻居阳位也，以九四居阴位者，亦曰“重刚”。位非二五，故曰“不中”，即下文“上不在天，下不在田”也。九三以时言，九四以位言，故曰“乾乾因其时”。\n九三“重刚不中，上不在天，下不在田”，宜“有咎”矣。而乃“无咎”，何哉？盖既“重刚”又“不中”，刚之极矣。以时论之，盖危惧之时也。故九三因其时而兢惕不已，则德日进、业日修，所以虽处危地，亦无咎矣。\n九四，重刚而不中，上不在天，下不在田，中不在人，故或之。或之者，疑之也，故无咎。\n在人谓三也。四三虽皆人位，然四则居人之上，而近君矣，非三之不近君，故曰“不在人”。“重刚不中”之“中”，二五之“中”也。“中不在人”之“中”，六爻中间之“中”也。\n九四“重刚不中，上不在天，下不在田，中不在人”，宜“有咎”矣。而乃“无咎”，何哉？盖九四之位，不在天，不在田，虽与九三同，而人位则不如九三之居下卦也，所居之位独近九五，盖“或之”之位也，故“或之”。“或之者，疑之也”，惟其疑，必审时而进矣，所以无咎也。\n夫大人者，与天地合其德，与日月合其明，与四时合其序，与鬼神合其吉凶。先天而天弗违，后天而奉天时。天且弗违，而况于人乎？况于鬼神乎？\n夫，音扶。\n“合德”以下，总言大人所具之德，皆天理之公，而无一毫人欲之私。若少有一毫人欲之私，即不合矣。“天地”者，造化之主。“日月”者，造化之精。“四时”者，造化之功。“鬼神”者，造化之灵。覆载无私之谓“德”，照临无私之谓“明”，生息无私之谓“序”，祸福无私之谓“吉凶”。“合序”者，如赏以春夏、刑以秋冬之类也。“合吉凶”者，福善祸淫也。先天不违，如无制作之类，虽天之所未为，而吾意之所为，默与道契，天亦不能违乎我，是天合大人也。“奉天时”者，奉天理也。“后天奉天时”，谓如“天叙有典，而我惇之；天秩有礼，而我庸之”之类。虽天之所已为，我知理之如是，奉而行之，而我亦不能违乎天，是“大人”合天也。盖以理为主，天即我，我即天，故无后先彼此之可言矣。天且不违于“大人”，而况于人，乃得天地之理以生，鬼神不过天地之功用，虽欲违乎“大人”，自不能违乎天矣。乾之九五，以刚健中正之德与此“大人”相合，所以宜“利见”之，以其同德相应也。\n“亢”之为言也，知进而不知退，知存而不知亡，知得而不知丧。其唯圣人乎？知进退存亡，而不失其正者，其唯圣人乎？\n“进退”者身，“存亡”者位，“得丧”者物。消长之理，知之既明，不失其正，处之又当，故惟圣人能之。再言“其惟圣人”，始若设问，而卒自应之，见非圣人不能也。初九“隐而未见”二句，释一“潜”字。而言“君子”者再，盖必“君子”而后能安于“潜”也。上九“亢之为言”三句，释一“亢”字，而言“圣人”者再，盖惟圣人而后能不至于“亢”也。\n此第六节，复申前数节未尽之意。","2":"坤柔\n坤：元亨，利牝马之贞。君子有攸往，先迷后得主，利。西南得朋，东北丧朋，安贞吉。\n丧，去声。\n偶者，阴之数也。坤者，顺也，阴之性也。六画皆偶，则纯阴而顺之至矣，故不言“地”而言“坤”。马象乾，牝马取其为乾之配。牝马属阴，柔顺而从阳者也。马能行顺而健者也，非顺外有健也。坤“利牝马之贞”，与乾不同者，何也？盖乾以刚固为贞，坤以柔顺为贞，言如牝马之顺而不息则正矣。牝马地类，安得同乾之贞？此占辞也。与乾卦“元亨利贞”同，但坤则贞“利牝马”耳。程子泥于四德，所以将“利”字作句。“迷”者，如迷失其道路也。坤为地，故曰“迷”。言占者“君子”，先乾而行则失其主而迷错，后乾而行则得其主而利矣。盖造化之理，阴从阳以生物，待唱而和者也。君为臣主，夫为妻主，后乾即得所主矣，利孰大焉，其理本如此。观《文言》后得主而有常，此句可见矣。“西南”“东北”，以文王圆图卦位而言。阳气始于东北，而盛于东南。阴气始于西南，而盛于西北。“西南”乃坤之本乡，兑、离、巽三女同坤居之，故为“得朋”。震、坎、艮三男同乾居“东北”，则非女之朋矣，故“丧朋”。阴从其阳谓之正，惟丧其三女之朋，从乎其阳，则有生育之功，是能安于正也。安于其正，故“吉”也。\n《彖》曰：至哉坤元！万物资生，乃顺承天。\n“至”者，极也。天包乎地，故以“大”赞其天，而地止以“至”赞之。盖言地之至则与天同，而大则不及乎天也。“元”者，四德之元。非乾有元，而坤复又有一元也。乾以施之，坤则受之，交接之间，一气而已。始者气之始，生者形之始，万物之形皆生于地。然非地之自能为也，天所施之气至则生矣，故曰“乃顺承天”。“乾健”，故一而施；“坤顺”，故两而承。此释卦辞之“元”。\n坤厚载物，德合无疆，含弘光大，品物咸亨。\n“坤厚载物”以德言，非以形言。“德”者，载物厚德、“含弘光大”是也。“无疆”者，乾也。“含”者，包容也。“弘”则是其所含者，无物不有，以蕴畜而言也。其静也翕，故曰“含弘”。“光”者，昭明也。“大”，则是其所光者，无远不届，以宣著而言也。其动也辟，故曰“光大”。言“光大”而必曰“含弘”者，不翕聚则不能发散也。“咸亨”者，齐乎巽相见乎离之时也。此释卦辞之“亨”。\n牝马地类，行地无疆，柔顺利贞。\n地属阴，牝阴物，故曰“地类”。又“行地”之物也。“行地无疆”则顺而不息矣。此则“柔顺”所利之贞也，故“利牝马之贞”。此释卦辞“牝马之贞”。\n君子攸行，先迷失道，后顺得常。“西南得朋”，乃与类行；“东北丧朋”，乃终有庆。安贞之吉，应地无疆。\n“君子攸行”即文王卦辞“君子有攸往”，言占者君子有所往也。“失道”者，失其坤顺之道也。坤道主成，成在后，若先乾而动，则迷而失道。“得常”者，得其坤顺之常，后乾而动，则顺而得常。\n夫惟坤贞利在“柔顺”，是以君子有所往也。先则迷，后则得。西南虽得朋，不过与巽、离、兑三女同类而行耳，未足以为庆也。若丧乎三女之朋，能从乎阳，则有生物之功矣，终必有庆也。何也？盖柔顺从阳者，乃坤道之安于其正也。能安于其正，则阳施阴受，生物无疆，应平地之无疆矣，所以“乃终有庆”也。此释卦辞“君子有攸往”至“安贞吉”。\n《象》曰：地势坤，君子以厚德载物。\n西北高，东南低，顺流而下，地之势本坤顺者也，故曰“地势坤”。且天地间持重载物，其势力无有厚于地者，故下文曰“厚”。天以气运，故曰“天行”；地以形载，故曰“地势”。“厚德载物”者，以深厚之德容载庶物也。若以厚德载物，体之身心，岂有他道哉？惟体吾长人之仁也，使一人得其愿，推而人人各得其愿，和吾利物之义也。使一事得其宜，推而事事各得其宜，则我之德厚而物无不载矣。\n初六：履霜，坚冰至。\n“六”，详见乾卦初九。“霜”，一阴之象。“冰”，六阴之象。方“履霜”而知“坚冰至”者，见占者防微杜渐，图之不可不早也。“《易》为君子谋”，乾言“勿用”，即复卦“闭关”之义，欲君子之难进也。坤言“坚冰”，即姤卦“女壮”之戒，防小人之易长也。\n《象》曰：“履霜”“坚冰”，阴始凝也。驯致其道，至坚冰也。\n《易举正》，“履霜”之下无“坚冰”二字。“阴始凝”而为“霜”，渐盛必至于“坚冰”，小人虽微，长则渐至于盛。“驯”者，扰也。顺，习也。“道”者，“小人道长”之道也，即上六“其道穷也”之道。驯习因循，渐致其阴道之盛，理势之必然也。\n六二：直方大，不习无不利。\n“直”字，即“坤至柔而动也刚”之刚也。“方”字即“至静而德方”之方也。“大”字即“含弘光大”之大也。孔子彖辞、《文言》、《小象》皆本于此，前后之言皆可相证。以本爻论，六二得坤道之正则无私曲，故“直”；居坤之中则无偏党，故“方”。“直”者，在内所存之柔顺中正也。“方”者，在外所处之柔顺中正也。惟柔顺中正，在内则为直，在外则为方。内而直，外而方，此其所以大也。不揉而直，不矩而方，不恢而大，此其所以“不习”也。若以人事论，“直”者内，而天理为之主宰，无邪曲也。“方”者外，而天理为之裁制，无偏倚也。“大”者，无一念之不直、无一事之不方也。“不习无不利”者，直者自直，方者自方，大者自大，不思不勉而中道也。“利”者，“利有攸往”之“利”，言不待学习而自然“直方大”也。盖八卦正位，乾在五，坤在二，皆圣人也，故乾刚健中正则“飞龙在天”，坤柔顺中正则“不习无不利”。占者有是德，方应是占矣。\n《象》曰：六二之动，直以方也。“不习无不利”，地道光也。\n“以”字即“而”字。言“直”、“方”之德惟动可见，故曰“坤至柔而动也刚”。此则承天而动，生物之机也。若以人事论，心之动“直”而无私，事之动“方”而当理是也。“地道光”者，六二之柔顺中正，即地道也。地道柔顺中正，光之所发者，自然而然，不俟勉强，故曰“不习无不利”。“光”即“含弘光大”之光。\n六三：含章可贞，或从王事，无成有终。\n“坤为吝啬”，含之象也。刚柔相杂曰“文”，文之成者曰“章”。阳位而以阴居之。又坤为文，章之象也。三居下卦之终，“终”之象也。“或”者，不敢自决之辞。“从”者，不敢造始之意。\n三居下卦之上，有位者也。其道当含晦其章美，有美则归之于君，乃可常久而得正。或从王之事，不敢当其成功，惟奉职以终其事而已。爻有此象，故戒占者如此。\n《象》曰：“含章可贞”，以时发也。“或从王事”，知光大也。\n知，平声。\n“以时发”者，言非终于韬晦，含藏不出而有所为也。“或从王事”带下一句说，孔子《小象》多是如此。“知光大”者，正指其无成有终也。盖“含弘光大，无成而代有终”者。地道也，地道与臣道相同。“六三或从王事，无成有终”者，盖知地道之光大当如是也。\n六四：括囊，无咎无誉。\n“坤为囊”。阴虚能受，囊之象也。“括”者，结囊口也。四变而奇，居下卦之上，结囊上口之象也。四近乎君，居多惧之地，不可妄咎妄誉，戒其作威福也。盖誉则有逼上之嫌，咎则有败事之累，惟晦藏其智，如结囊口，则不害矣。\n六四柔顺得正，盖慎密不出者也，故有“括囊”之象，“无咎”之道也。然既不出，则亦无由称赞其美矣，故其占如此。\n《象》曰：“括囊无咎”，慎不害也。\n“括囊”者，慎也。“无咎”者，不害也。\n六五：黄裳，元吉。\n“坤为黄”、“为裳”，“黄裳”之象也。“黄”，中色，言其中也。“裳”，下饰，言其顺也。“黄”字从五字来，“裳”字从六字来。\n六五以阴居尊，中顺之德充诸内而见诸外，故有是象，而其占则元吉也。刚自有刚德，柔自有柔德，本义是。\n《象》曰：“黄裳元吉”，文在中也。\n坤为文。文也居五之中，在中也。“文在中”，言居坤之中也，所以“黄裳元吉”。\n上六：龙战于野，其血玄黄。\n六阳为龙，坤之错也，故阴阳皆可以言龙。且变艮综震，亦“龙”之象也。变艮为剥，阴阳相剥，“战”之象也。战于卦外，“野”之象也。“血”者，龙之血也。“坚冰至”者，所以防“龙战”之祸于其始。龙战野者，所以著“坚冰”之至于其终。\n上六阴盛之极，其道穷矣。穷则其势必争，至与阳战，两败俱伤，故有此象，凶可知矣。\n《象》曰：“龙战于野”，其道穷也。\n极则必穷，理势之必然也。\n用六：利永贞。\n“用六”与“用九”同。此则以上六“龙战于野”言之，阴极则变阳矣。但阴柔恐不能固守，既变之后，惟长“永贞固”，不为阴私所用，则亦如乾之“无不利”矣。\n《象》曰：用六永贞，以大终也。\n此美其善变也。阳大阴小，大者阳明之公，君子之道也；小者阴浊之私，小人之道也。今始阴浊而终阳明，始小人而终君子，何大如之？故曰“以大终”也。\n《文言》曰：坤至柔而动也刚，至静而德方。后得主而有常。含万物而化光。“坤”道其顺乎，承天而时行。\n“动”者，生物所动之机。“德”者，生物所得之质。乾刚坤柔，定体也。坤固至柔矣，然乾之施一至坤，即能翕受而敷施之，其生物之机不可止遏，此又柔中之刚矣。乾动坤静，定体也。坤固至静矣，及其承乾之施，陶镕万类，各有定形，不可移易，此又静中之方矣。柔无为矣，而刚则能动；静无形矣，而方则有体。柔静者，顺也体也；刚方者，健也用也。“后得主而有常”者，后乎乾则得乾为主，乃坤道之常也。“含万物而化光”者，静翕之时，含万物生意于其中，及其动辟，则化生万物而有光显也。“坤道其顺乎”，此句乃赞之也。坤之于乾，犹臣妾之与夫君，亦惟听命而已。一施一受不敢先时而起，亦不敢后时而不应，此所以赞其顺也。此以上申《彖传》之意。\n积善之家，必有余庆。积不善之家，必有余殃。臣弑其君，子弑其父，非一朝一夕之故，其所由来者渐矣，繇辩之不早辩也。《易》曰：“履霜，坚冰至”，盖言顺也。\n天下之事，未有不由积而成。家之所积者善，则福庆及于子孙；所积者不善，则灾殃流于后世。其大至于弑逆之祸，皆积累而至，非“朝夕”所能成也。“由来者渐”，言臣子也。“辩之不早”，责君父也。“辩”，察也。在下者不可不察之于己，在上者不可不察之于人。察之早，勿使之渐，则祸不作矣。“顺”字即驯字。“驯致其道”也，言顺习因循以至于“坚冰”也。前言“驯致其道”，此言“盖言顺也”，皆一意也。《程传》是。\n直其正也，方其义也。君子敬以直内，义以方外，敬义立而德不孤。“直方大，不习无不利”，则不疑其所行也。\n“直”者，何也？言此心无邪曲之私，从绳墨而正之之谓也。“方”者何也？言此事无差谬之失，得裁制而宜之之谓也。此六二“直方”之所由名也。下则言求“直方”之功。人心惟有私，所以不直。如知其敬乃吾性之礼存诸心者，以此敬为之操持，必使此心廓然大公，而无一毫人欲之私，则不期直而自直矣。人事惟有私，所以不方。如知其义乃吾性之义见诸事者，以此义为之裁制，必使此事物来顺应而无一毫人欲之私，则不期方而自方矣。德之偏者谓之“孤”，不孤则大矣。盖敬之至者外必方，义之至者内必直，不方不直，不足谓之敬义，是德之孤也。今既有敬以涵义之体，又有义以达敬之用，则内外夹持，表里互养，日用之间，莫非天理之流行，德自充满盛大而不孤矣，何大如之！内而念念皆天理，则内不疑。外而事事皆天理，则外不疑。内外坦然而无疑，则“畅于四支”，不言而喻；“发于事业”，无所处而不当，何利如之！此所以“不习无不利”也。乾言进修，坤言敬义，学圣人者，由于进修，欲进修者，先于敬义，乾坤二卦备矣。\n阴虽有美含之，或从王事，弗敢成也。地道也，妻道也，臣道也。地道无成，而代有终也。\n“阴虽有美含之”，可以时发而从王事矣。“或从王事”，不敢有其成者，非其才有所不足，不能成也，乃其分之不敢成也。何也？法象莫大于天地，三纲莫重于夫妻、君臣。天统乎地，夫统乎妻，君统乎臣，故“地道也，妻道也，臣道也”，皆不敢先自主也。皆如地之无成，惟代天之终耳。盖天能始物，不能终物，地继其后而终之，则地之所以有终者，终天之所未终也。地不敢专其成，而有其终，故曰“无成而代有终”也。六三为臣，故当如此。\n天地变化，草木蕃，天地闭，贤人隐。《易》曰“括囊，无咎无誉”，盖言谨也。\n“天地变化”二句，乃引下文之辞。言天地变化，世道开泰，则草木之无知者且蕃茂，况于人乎？则贤人之必出，而不隐可知矣。若“天地闭”，则贤人必敛德以避难，此其所以隐也。坤本阴卦，四六重阴又不中，则阴之极矣，正天地闭塞、有阴而无阳、不能变化之时也，故当谨守不出者以此。\n君子黄中通理。正位居体。美在其中，而畅于四支，发于事业，美之至也。\n“黄”者，中德也。“中”者，内也。“黄中”者，中德之在内也。“通”者，豁然脉络之贯通，无一毫私欲之滞塞也。“理”者，井然文章之条理，无一毫私欲之混淆也。本爻既变，坎为通，“通”之象也。本爻未变，坤为文，“理”之象也。故六五《小象》曰“文在中”。德之在内者，通而且理，爻之言黄者以此。正位居尊位也。“体”者，乾坤之定体也。乾阳乃上体，坤阴乃下体。言虽在尊位而居下体，故不曰“衣”而曰”裳”。爻之所以言“裳”者以此。以人事论，有居尊位而能谦下之意。此二句尽“黄裳”之义矣。又叹而赞之，以见“元吉”之故。言“黄中”，“美在其中”，岂徒美哉？美既在中，则“畅于四支”，为日新之德，四体不言而喻者，此美也。“发于事业”，为富有之业，天下国家无所处而不当者，此美也。不其美之至乎！爻之所以不止言“吉”而言“元吉”者，以此。\n阴疑于阳必战。为其嫌于无阳也，故称“龙”焉。犹未离其类也，故称“血”焉。夫玄黄者，天地之杂也。天玄而地黄。\n为，于伪反。离，力智反。夫，音扶。\n“疑”者，似也，似其与己均敌，无大小之差也。阴本不可与阳战，今阴盛，似敢与阳敌，故以战言。阴盛已无阳矣，本不可以称龙，而不知阳不可一日无也。故周公以“龙”言之，以存阳也。虽称为“龙”，犹阴之类也，故称“血”，以别其为阴。“血”，阴物也。曰“其色玄黄”，则天地之色杂矣。而不知“天玄”、“地黄”者，两间之定分也。今曰“其色玄黄”，疑于无分别矣，夫岂可哉！言阴阳皆伤也。以上皆申言周公爻辞。","3":"屯见而不失其居\n“屯”者，难也。万物始生，郁结未通，似有险难之意，故其字象“屮”穿地（屮，音彻），始出未申也。《序卦》：“有天地然后万物生焉，盈天地之间者唯万物。屯者，盈也。物之始生也，故次乾坤之后。”\n屯：元亨，利贞。勿用有攸往，利建侯。\n初九以贵下贱，大得民也，此利见之侯也。\n乾坤始交而遇险陷，故名为“屯”。所以气始交未畅曰“屯”，物勾萌未舒曰“屯”，世多难未泰曰”屯”。震动在下，坎陷在上，险中能动，是有拨乱兴衰之才者，故占者“元亨”。然犹在险中，则宜守正而未可遽进，故“勿用有攸往”。“勿用”者，以震性多动，故戒之也。然大难方殷，无君则乱，故当立君以统治。初九阳在阴下，而为成卦之主，是能以贤下人，得民而可君者也。占者必从人心之所属望，立之为主，斯利矣，故“利建侯”。“建侯”者，立君也。险难在前，中爻艮止，勿用攸往之象。震，一君二民，建侯之象。\n《彖》曰：屯，刚柔始交而难生。动乎险中，大亨贞。雷雨之动满盈。天造草昧，宜建侯而不宁。\n难，去声。\n以二体释卦名，又以卦德、卦象释卦辞。“刚柔”者，乾坤也。“始交”者，震也。一索得震，故为“乾坤始交”。“难生”者，坎也。言万物始生即遇坎难，故名为“屯”。“动乎险中”者，言震动之才足以奋发有为，时当大难，能动则其险可出，故”大亨”。然犹在险中，时犹未易为，必从容以谋其出险方可，故“利贞”。“雷”，震象。“雨”，坎象。“天造”者，如天所造作也。“草”者，如草不齐。“震为蕃”，草之象也。“昧”者，如天未明。“坎为月”，天尚未明，昧之象也。“坎”水内景，不明于外，亦昧之象也。雷雨交作，杂乱晦冥，充塞盈满于两间，天下大乱之象也。当此之时，以天下则未定，以名分则未明，正宜立君以统治。君既立矣，未可遽谓安宁之时也，必为君者忧勤兢畏，不遑宁处，方可拨乱反正，以成靖难之功。此则圣人济屯之深戒也，审而后动也。屯之“元亨利贞”，非如乾之四德，故曰“大亨贞”。\n更始初立而骄奢，非不宁矣。\n《象》曰：云雷屯，君子以经纶。\n《彖》言雷雨，《象》言云雷。《彖》言其动，《象》著其体也。上坎为云，故曰“云雷屯”。下坎为雨，故曰“雷雨”解。“经纶”者，皆治丝之事。草昧之时，天下正如乱丝，经以引之，纶以理之，俾大纲皆正，万目毕举，正君子拨乱有为之时也，故曰“君子以经纶”。\n初九：磐桓，利居贞，利建侯。\n“磐”，大石也，“鸿渐于磐”之磐也。中爻艮石之象也。“桓”，大柱也。震，阳木，桓之象也。八卦正位，震在初，乃爻之极善者。国家屯难，得此刚正之才，乃倚之以为柱石者也。故曰“磐桓”，唐之郭子仪是也。“震为大涂”，柱石在于大涂之上，震本欲动，而艮止不动，有柱石欲动不动之象，所以“居贞”，而又“利建侯”，非“难进之貌”也。故《小象》曰“虽磐桓，志行正”也，曰心志在于行，则欲动不动可知矣。\n九当屯难之初，有此刚正大才，生于其时，故有“磐桓”之象。然险陷在前，本爻居其正，故占者利于居正以守己。若为民所归，势不可辞，则又宜“建侯”以从民望，救时之屯可也。“居贞”者利在我，“建侯”者利在民，故占者两有所利。\n《象》曰：虽“磐桓”，志行正也。以贵下贱，大得民也。\n当屯难之时，大才虽磐桓不动，然拳拳有济屯之志。行一不义、杀一不辜而得天下，不为。既有救人之心，而又有守己之节，所以占者“利居贞”而守己也。若居而不贞则无德，行而不正则无功，周公言“居贞”，孔子言“行正”，然后济屯之功德备矣。阳贵阴贱，以贵下贱者，一阳在二阴之下也。当屯难之时，得一大才，众所归附，更能自处卑下，“大得民”矣。此占者所以又“利建侯”而救民也。\n六二：屯如邅如，乘马班如，匪寇婚媾。女子贞不字，十年乃字。\n邅，张连反。\n“屯”、“邅”皆不能前进之意。“班”，回环不进之意。震于马为足，为作足，“班如”之象也。应爻为坎，坎为盗寇之象也，指“初”也。妇嫁曰“婚”，再嫁曰“媾”。“婚媾”指五也。变兑为少女，“女子”之象也。“字”者，许嫁也。此“女子”则指六二也。“贞”者，正也。“不字”者，不字于初也。“乃字”者，乃字于五也。中爻艮止，不字之象也。中爻坤土，数成于十，十之象也。若以人事论，光武当屯难之时，窦融割据，志在光武，为隗嚣所隔，“乘马班如”也，久之终归于汉，“十年乃字”也。\n六二柔顺中正，当屯难之时，上与五应，但乘初之刚，故为所难，有屯邅班如之象，不得进与五合。使非初之寇难，即与五成其婚媾，不至十年之久矣。惟因初之难，六二守其中正，不肯与之苟合，所以“不字”，至于“十年”之久。难久必通，乃反其常而“字”，正应矣，故又有此象也。占者当如是则可。\n《象》曰：六二之难，乘刚也。“十年乃字”，反常也。\n六二居屯之时，而又乘刚，是其患难也。“乘”者，居其上也。故曰“六二之难”。“反常”者，二五阴阳相应，理之常也。为刚所乘，则乖其常矣。难久必通，故“十年乃字”而反其常。\n六三：即鹿无虞，惟入于林中，君子几，不如舍，往吝。\n舍，音捨。几，音机。\n“即”者，就也。“鹿”当作麓为是，旧注亦有作麓者。盖此卦中爻艮为山，山足曰“麓”。三居中爻，艮之足，麓之象也。“虞”者，虞人也。三、四为人位，虞人之象也。“无虞”者，无正应之象也。震错巽，巽为入，入之象也。上艮为木，下震为竹，“林中”之象也。言就山足逐兽，无虞人指示，乃陷入于林中也。坎错离明，见几之象也。“舍”者，舍而不逐也，亦艮止之象也。\n六三阴柔，不中不正，又无应与，当屯难之时，故有“即麓无虞”、“入于林中”之象。君子见几，不如舍去。若往逐而不舍，必致羞吝。其象如此，戒占者当如是也。\n《象》曰：“即鹿无虞”，以从禽也。君子舍之，“往吝”穷也。\n孔子恐后学不知“即鹿无虞”之句，故解之曰“乃从事于禽”也。舍则不往，往则必吝。“吝穷”者，羞吝穷困也。\n六四：乘马班如，求婚媾，往吉，无不利。\n“坎为马”，又有马象。“求”者，四求之也。“往”者，初往之也。自内而之外曰“往”。本爻变，中爻成巽，则为长女，震为长男，“婚媾”之象也。非真婚媾也，求贤以济难有此象也。旧说阴无求阳之理，可谓不知象旨者矣。\n六四阴柔，居近君之地，当屯难之时，欲进而复止，故有“乘马班如”之象。初能得民，可以有为，四乃阴阳正应，未有蒙大难而不求其初者，故又有求婚媾之象。初于此时，若欣然即往，资其刚正之才，以济其屯，其吉可知矣。而四近其君者，亦无不利也，故其占又如此。\n《象》曰：求而往，明也。\n“求”者，资济屯之才，有知人之明者也。“往”者，展济屯之才，有自知之明者也。坎错离，有明之象，故曰“明”。\n九五：屯其膏，小贞吉，大贞凶。\n“膏”者，膏泽也。以坎体有膏泽沾润之象，故曰“膏”。本卦名屯，故曰“屯膏”。阳大阴小，六居二，九居五，皆得其正，故皆称“贞”。“小贞”者，臣也，指二也。“大贞”者，君也，指五也。故六二言“女子贞”，而此亦言贞，六爻惟二五言贞。\n九五以阳刚中正居尊，亦有德有位者。但当屯之时，陷于险中，为阴所掩，虽有六二正应，而阴柔不足以济事。且初九得民于下，民皆归之，无臣无民，所以有屯其膏不得施为之象。故占者所居之位，如六二为臣，小贞则吉；如九五为君，大贞则凶也。\n《象》曰：“屯其膏”，施未光也。\n阳德所施本光大，但陷险中，为阴所掩，故“未光”。\n上六：乘马班如，泣血涟如。\n六爻皆言“马”者，震坎皆为马也。皆言“班如”者，当屯难之时也。坎“为加忧，为血卦，为水”，“泣血涟如”之象也。才柔不足以济屯，去初最远，又无应与，故有此象。\n《象》曰：“泣血涟如”，何可长也？\n既无其才，又无其助，丧亡可必矣，岂能长久？","4":"蒙杂而著\n“蒙”，昧也。其卦以坎遇艮，山下有险，艮止在外，坎水在内，水乃必行之物，遇山而止。内既险陷不安，外又行之不去，莫知所往，昏蒙之象也。《序卦》：“屯者，物之始生也。物生必蒙，故受之以蒙。”所以次屯。\n蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。\n告，古毒反。\n“蒙亨”者，言蒙者亨也，不终于蒙也。“匪我求童蒙”二句，正理也。“再”指四。阳一阴二，二再则四矣。“三”指三。“渎”者，烦渎也。“初筮”者，初筮下卦，得刚中也。此卦坎之刚中在上卦，故曰“再筮”。“告”者，二告乎五也。“不告”者，二不告乎三四也。凡阳则明，阴则暗，所以九二发六五之蒙。“利贞”者，教之以正也。\n《彖》曰：蒙，山下有险。险而止，蒙。“蒙亨”，以亨行时中也。“匪我求童蒙，童蒙求我”，志应也。“初筮告”，以刚中也。“再三渎，渎则不告”，渎蒙也。蒙以养正，圣功也。\n以卦象、卦德释卦名，又以卦体释卦辞。“险而止”，退则困于其险，进则阻于其山，两无所适，所以名“蒙”也。“以”者，用也。“以亨”者，以我之亨通也。“时中”者，当其可之谓。愤悱启发，即“志应”也。言我先知先觉，先以亨通矣，而后以我之亨，行“时中”之教，此蒙者所以亨也。“匪我求童蒙，童蒙求我”，乃教人之正道也，何也？礼闻来学，不闻往教。“童蒙求我”，则彼之心志应乎我，而相孚契矣，此其所以可教也。“初筮”则告者，以刚中也。我有刚中之德，而五又以中应之，则心志应乎我，而相孚契矣，所以当告之也。“初筮”二字只作下卦二字，指教者而言，观此卦“再筮”可见矣。盖三则应乎其上，四则隔乎其三，与刚中发蒙之二，不相应与。又乘阳不敬，则心志不应乎我，而不相孚契矣。既不相孚契，而强告之，是徒烦渎乎蒙矣，亦何益哉！教之利于正者，幼而学之，学为圣人而已。圣人之所以为圣者，正而已矣。入圣之域虽在后日，作圣之功就在今日。当蒙时养之以正，虽未即至于圣，圣域由此而渐入矣。此其所以“利贞”也。\n《象》曰：山下出泉，蒙。君子以果行育德。\n行，去声。\n“泉”乃必行之物，始出而未通达，犹物始生而未明，蒙之象也。“果行”者，体坎之刚中，以果决其行。见善必迁，闻义必徙，不畏难而苟安也。“育德”者，体艮之静止，以养育其德，不欲速，宽以居之，优游以俟其成也。要之、“果”之、“育”之者，不过蒙养之正而已。\n初六：发蒙，利用刑人，用说桎梏，以往吝。\n说，吐活反，音脱。\n“蒙”者，下民之蒙也，非又指童蒙也。“发蒙”者，启发其初之蒙也。“刑人”者，以人刑之也，刑罚立而后教化行。治蒙之初，故“利用刑人”以正其法。“桎梏”者，刑之具也。“坎为桎梏”，桎梏之象也。在足曰“桎”，在手曰“梏”。中爻震为足，外卦艮为手，用桎梏之象也。本卦坎错离、艮综震，有噬嗑“折狱用刑”之象，故丰、旅、贲三卦，有此象，皆言“狱”。“说”者，脱也。“用说桎梏”，即不用刑人也。变兑为毁折，脱之象也。“往”者，往发其蒙也。“吝”者，利之反。变兑则和悦矣，和悦安能发蒙？故“吝”。\n初在下，近比九二刚中之贤，故有启发其蒙之象。然发蒙之初，“利用刑人”以正其法，庶“小惩而大诫”，蒙斯可发矣。若舍脱其刑人，惟和悦以往教之，蒙岂能发哉？吝之道也。故其象占如此，细玩《小象》自见。\n《象》曰：“利用刑人”，以正法也。\n教之法不可不正，故用刑惩戒之，使其有严惮也。\n九二：包蒙吉。纳妇吉，子克家。\n“包”者，裹也。妇人怀妊，包裹其子，即胞字也。凡《易》中言“包”者，皆外包乎内也。泰曰“包荒”，否曰“包承”“包羞”，姤曰“包鱼”，皆外包乎内。“包蒙”者，包容其初之蒙也，则有含宏之量，敷教在宽矣。初曰“刑”者，不中不正也。上曰“击”者，上过刚也。此爻刚中，统治群阴，极善之爻，故于初曰“包”，于三四五曰“纳”，于五曰“克家”。“纳妇吉”者，新纳之妇有谐和之吉也。中爻坤顺在上，一阳在下，纳受坤顺之阴，“纳妇”之象也。“子克家”者，能任父之事也。坎为中男，有刚中之贤能干五母之蛊，“子克家”之象也。“纳妇吉”字，与上“吉”字不同，上“吉”字，占者之吉也，下“吉”字，夫妇谐和之吉也。坤顺，故吉。\n九二以阳刚为内卦之主，统治群阴，当发蒙之任者，其德刚而得中，故有“包蒙”之象。占者得此固吉矣，然所谓“吉”者，非止于包容其初之蒙也。凡三四五之为蒙者，二皆能以刚中之德化之，如新纳之妇有谐和之吉，承考之子有克家之贤，其吉其贤，皆自然而然，不待勉强谆谆训诲于其间，如此而谓之“吉”也。故其占中之象又如此。\n《象》曰：“子克家”，刚柔接也。\n二刚五柔。二有主蒙之功，五之信任专，所以二得广布其敷教之才，亦如贤子不待训诲，自然而克家也，所以占者有“子克家”之象。周公爻辞，以刚中言，孔子象辞并应与言。\n六三：勿用取女，见金夫，不有躬，无攸利。\n取，七具反。\n变巽，女之象也。九二阳刚，乾爻也。乾为金，金夫之象，故称“金夫”。“金夫”者，以金赂己者也。六三正应在上，然性本阴柔，坎体顺流趋下，应爻艮体常止，不相应于上。九二为群蒙之主，得时之盛，三近而相比，在纳妇之中者，故舍其正应而从之，此“见金夫不有躬”之象也。且中爻顺体震动，三居顺动之中，比于其阳，亦“不有躬”之象也。若以蒙论，乃自暴自弃，昏迷于人欲，终不可教者，因三变长女，故即以女象之。曰“勿用取”、“无攸利”，皆其象也。\n六三阴柔，不中不正，又居艮止坎陷之中，盖蒙昧无知之极者也，故有此象。占者遇此，如有“发蒙”之责者，弃而不教可也。\n《象》曰：“勿用取女”，行不顺也。\n妇人以顺从其夫为正，舍正应之夫而从金夫，安得为顺？\n六四：困蒙，吝。\n“困蒙”者，困于蒙昧而不能开明也。六四上下既远隔于阳，不得贤明之人以近之，又无正应贤明者以为之辅助，则蒙无自而发，而困于蒙矣，故有“困蒙”之象。占者如是，终于下愚，故可羞。\n《象》曰：“困蒙”之吝，独远实也。\n阳实阴虚，实谓阳也。六四上下皆阴，蒙之甚者也。欲从九二则隔三，欲从上九则隔五，远隔于实者也，故曰“独远实”。“独”者，言本卦之阴，皆近乎阳，而四独远也。\n六五：童蒙，吉。\n“童蒙”者，纯一未散，专心资于人者也。艮为少男，故曰“童”。“匪我求童蒙”，言童之蒙昧也。此则就其纯一未散、专听于人而言。盖中爻为坤顺，五变为巽，有此顺巽之德，所以专心资刚明之贤也。\n六五以顺巽居尊，远应乎二，近比乎上，盖专心资刚明之贤者，故有“童蒙”之象。占者如是，则吉也。\n《象》曰：“童蒙”之吉，顺以巽也。\n中爻为顺，变爻为巽。仰承亲比上九者，顺也。俯应听从九二者，巽也。亲比听从乎阳，正远实之反，所以吉。\n上九：击蒙，不利为寇，利御寇。\n“击蒙”者，击杀之也。应爻坎为盗，错离为戈兵，艮为手，手持戈兵，击杀之象也。三与上九为正应，故击杀之也。“寇”者，即坎之寇盗也。二“寇”字相同。“不利为寇”者，教三爻在下蒙昧之人也，“利御寇”者，教上九在上治蒙之人也。六三在本爻为淫乱，在上九为寇乱，蒙昧之极可知矣。\n上九与三之寇盗相为正应，过刚不中，治蒙太猛，故有“击蒙”之象。圣人教占者，以占得此爻者，若乃在下蒙昧之人，则“不利为寇”。为寇，则有击杀之凶矣。占得此爻者，若乃在上治蒙之人，惟利御止其寇而已，不可即击杀之。圣人哀矜愚蒙之人，故两有所戒也。\n《象》曰：利用“御寇”，上下顺也。\n上九刚止于“御寇”，上之顺也。六三柔随其所止，下之顺也。艮有止象，变坤有顺象，渐自“利御寇”。《小象》亦曰“顺”，相保可见矣。","5":"需不进也\n“需”者，须也，有所待也，理势不得不需者。以卦象论，水在天上，未遽下于地，必待阴阳之交，薰蒸而后成，需之象也。以卦德论，乾性主于必进，乃处坎陷之下，未肯遽进，需之义也。《序卦》：“蒙者，物之稚也。物稚，不可不养也。需者，饮食之道也。”养物以饮食，所以次蒙。\n需：有孚，光亨，贞吉，利涉大川。\n需虽有所待，乃我所当待也，非不当待而待也。“孚”者，信之在中者也。坎体诚信充实于中，“孚”之象也。“光”者，此心光明，不为私欲所蔽也。中爻离，光明之象也。“亨”者，此心亨泰，不为私欲所窒也。坎为通，亨通之象也。“贞”者，事之正也。八卦正位，坎在五，阳刚中正，为需之主，正之象也，皆指五也。坎水在前，乾健临之，乾知险，“涉大川”之象也。又中爻兑综巽。坎水在前，巽木临之，亦“涉大川”之象。详见颐卦上九。“孚贞”者，尽所需之道。光亨吉利者，得所需之效。需若无实，必无“光亨”之时；需若不正，岂有吉利之理？\n言事若有所待，而心能孚信，则光明而事通矣。而事又出于其正，不行险以侥幸，则吉矣，故“利涉大川”。\n《彖》曰：需，须也。险在前也，刚健而不陷，其义不困穷矣。“需，有孚，光亨，贞吉”，位乎天位，以正中也。“利涉大川”，往有功也。\n以卦德释卦名，以卦综释卦辞。“需”者，须也，理势之所在，正欲其有所待也，故有需之义。险在前，不易于进，正当需之时也。以乾之刚，毅然有守，不冒险以前进，故不陷于险。既不陷于险，则终能出其险，其义不至于困穷矣，所以名“需”。需讼二卦同体，文王综为一卦，故《杂卦》曰：“需不进也，讼不亲也。”“位天位以正中”者，讼下卦之坎，往居需之上卦，九五又正又中也。五为天位，因自讼之地位往居之，故曰“位乎天位”。如在讼下卦，止可言中，不可言正矣。正则外无偏倚，中则心无夹杂，所以“有孚，光亨，贞吉”。往有功与渐、蹇、解三卦彖辞“往有功”同。言讼下卦，往而居需之上卦，九五正中，所以有“利涉大川”之功也。\n《象》曰：云上于天，需。君子以饮食宴乐。\n乐，音洛。\n云气蒸而上升，必得阴阳和洽然后成雨，故为需待之义。君子事之当需者，亦不容更有所为，惟内有孚、外守正，饮食以养其气体而已，宴乐以娱其心志而已，此外别无所作为也。曰“饮食宴乐”者，乃居易俟命、涵养待时之象也，非真必饮食宴乐也。\n初九：需于郊，利用恒，无咎。\n“郊”者，旷远之地，未近于险之象也。“乾为郊”，郊之象也，故同人、小畜皆言“郊”。“需于郊”者，不冒险以前进也。“恒”者，常也。安常守静以待时，不变所守之操也。“利用恒，无咎”者，戒之也。言若无恒，犹有咎也。\n初九阳刚得正，未近于险，乃不冒险以前进者，故有需郊之象。然需于始者，或不能需于终，故必义命自安，恒于郊而不变，乃其所利也。戒占者能如此，则无咎矣。\n《象》曰：“需于郊”，不犯难行也。“利用恒，无咎”，未失常也。\n难，乃旦反。\n“不犯难行”者，超然远去，不冒犯险难以前进也。“未失常”者，不失需之常道也。需之常道，不过以义命自安，不冒险以前进而已。\n九二：需于沙，小有言，终吉。\n“坎为水”，水近则有沙，沙则近于险矣。渐近于险，虽未至于患害，已“小有言”矣。小言者，众人见讥之言也。避世之士，知前有坎陷之险，责之以洁身。用世之士，知九二刚中之才，责之以拯溺也。中爻为兑口舌，小言之象也。“终吉”者，变爻离明，明哲保身，终不陷于险也。\n二以阳刚之才，而居柔守中，盖不冒险而进者，故云有“需于沙”之象。占者如是，虽不免“小有言”，终得其吉也。\n《象》曰：“需于沙”，衍在中也。虽“小有言”，以吉终也。\n水行朝宗曰“衍”，即水字也，言水在中央也。沙在水边，则近于险矣。虽近于险而“小有言”，然以刚中处需，故不陷于险，而“以吉终”也。\n九三：需于泥，致寇至。\n泥逼于水，将陷于险矣，寇之地也。坎为盗在前，寇之象也。\n九三居健体之上，才位俱刚，进不顾前，迩于坎盗，故有需“泥寇至”之象。健体敬慎惕若，故占者不言凶。\n《象》曰：“需于泥”，灾在外也。自我“致寇”，敬慎不败也。\n“外”谓外卦。“灾在外”者，言灾已切身，而在目前也。“灾在外”而我近之，是致寇自我也。“敬慎不败”者，三得其正，乾乾惕若，敬而且慎，所以不败于寇也。故占者不言“凶”。\n六四：需于血，出自穴。\n“坎为血”，血之象也。又“为隐伏”，穴之象也。偶居左右，上下皆阳，亦穴之象也。“血”即坎字，非见伤也。“出自穴”者，观上六“入于穴”入字，此言“出”字，即“出入”二字自明矣。言虽需于血，然犹出自穴外，未入于穴之深也。需卦近于坎，“致寇至”及“入于坎”，三爻皆吉者，何也？盖六四顺于初之阳，上六阳来救援，皆应与有力，九五中正，所以皆吉也。凡看周公爻辞，要玩孔子《小象》。若以血为杀伤之地，失《小象》顺听之旨矣。\n四交于坎，已入于险，故有“需于血”之象。然四与初为正应，能顺听乎初，初乃乾刚至健而知险，惟知其险是出自穴外，不冒险以进，虽险而不险矣。故其象占如此。\n《象》曰：“需于血”，顺以听也。\n坎为耳，听之象也。“听”者，听乎初也。六四柔得其正，顺也。顺听乎初，故入险不险。\n九五：需于酒食，贞吉。\n坎水酒象，中爻兑食象，详见困卦。“酒食”，宴乐之具。“需于酒食”者，安于日用饮食之常，以待之而已。“贞吉”者，正而自吉也，非戒也。\n九五阳刚中正，居于尊位，盖优游和平，不多事以自扰，无为而治者也。故有“需于酒食”之象，其“贞吉”可知矣。占者有是贞，亦有是吉也。\n《象》曰：“酒食，贞吉”，以中正也。\n即《彖》位乎天位以“正中”也。八卦正位坎在五。\n上六：入于穴，有不速之客三人来，敬之终吉。\n阴居险陷之极，“入于穴”之象也。变巽为入，亦入之象也。下应九三，阳合乎阴，阳主上进，不召请而自来之象也。我为主，应为客，三阳同体，客“三人”之象也。入穴穷困，望人救援之心甚切，喜其来而“敬之”之象也。“终吉”者，以阳至健知险，可以拯溺也。\n上六居险之极，下应九三，故其象如此。占者之吉可知矣。\n《象》曰：“不速之客”来，“敬之终吉”，虽不当位，未大失也。\n当，去声。\n“位”者，爻位也。“三”乃人位，应乎上六，故曰“人来”。初与二皆地位，上六所应者乃人位，非地位，今初与二皆来，故“不当位”也。以一阴而三阳之来，上六敬之，似为失身矣，而不知入于其穴，其时何时也。来救援于我者，犹择其位之当否，而敬有分别，是不知权变者矣。故初与二虽“不当位”，上六敬之，亦未为“大失”也。曰“未大失”者，言虽失而未大也。若不知权变，自经于沟渎，其失愈大矣。《易》中之时正在于此。","6":"讼不亲也\n“讼”者，争辨也。其卦坎下乾上。以二象论，天运乎上，水流乎下，其行相违，所以成讼。以卦德论，上以刚陵乎下，下以险伺乎上。以一人言，内险而外健；以二人言，己险而彼健。险与健相持，皆欲求胜。此必讼之道也。《序卦》：“饮食者，人之大欲存焉。”既有所需，必有所争，讼所由起也。所以次需。\n讼：有孚，窒惕，中吉，终凶。利见大人，不利涉大川。\n“有孚”者，心诚实而不诈伪也。“窒”者，窒塞而能含忍也。“惕”者，戒惧而畏刑罚也。“中”者，中和而不狠愎也。人有此四者，必不与人争讼，所以吉。若可已不已，必求其胜，而终其讼，则凶。“利见大人”者，见九五以决其讼也。“不利涉大川”者，不论事之浅深，冒险入渊，以兴讼也。九二中实，有孚之象。一阳沉溺于二阴之间，窒之象。“坎为加忧”，惕之象。阳刚来居二，中之象。上九过刚，终之象。九五中正以居尊位，“大人”之象。中爻巽木，下坎水，本可以涉大川，但三刚在上，阳实阴虚，遇巽风，危矣。舟危，岂不入渊？故彖辞曰“入渊”，不利涉之象也。\n《彖》曰：讼，上刚下险，险而健，讼。“讼，有孚窒惕中吉”，刚来而得中也。“终凶”，讼不可成也。“利见大人”，尚中正也。“不利涉大川”，入于渊也。\n以卦德、卦综、卦体、卦象释卦名。卦辞“险”、“健”详见前卦。下若健而不险，必不生讼，险而不健，必不能讼，所以名“讼”。“刚来得中”者，需、讼相综，需上卦之坎，来居讼之下卦，九二“得中”也。前儒不知《序卦》、《杂卦》，所以依虞翻以为卦变，刚来居柔地得中，故能“有孚”、能“窒”、能“惕”、能“中”。“终”者，极而至于成也。讼已非美事，若讼之不已至于其极，其凶可知矣。“尚”者，好尚之尚，主也。言九五所主，在“中正”也。惟“中正”，所以能辨人是非。“入渊”者，舟重遇风，其舟危矣，故入渊。与冒险兴讼必陷其身者，一而已矣。\n《象》曰：天与水违行，讼。君子以作事谋始。\n天上蟠，水下润，天西转，水东注，故其行相违。谋之于始，则讼端绝矣。“作事谋始”，工夫不在讼之时，而在于未讼之时也。故曰：曹刘共饭，地分于匕筯之间；苏史灭宗，忿起于谈笑之顷。\n初六：不永所事，小有言，终吉。\n“不永所事”者，不能永终其讼之事也。“小有言”者，但小有言语之辨白而已。变兑为口舌，言之象也。应爻乾为言，亦言之象也。因居初，故曰“小”。“终吉”者，得辨明也。\n初六才柔位下，不能永终其讼之事。虽在我不免小有言语之辨，然温柔和平，自能释人之忿怨，所以得以辨明。故其象如此，而占者终得吉也。\n《象》曰：“不永所事”，讼不可长也。虽“小有言”，其辩明也。\n讼不可长，以理言也。言虽是初六阴柔之故，然其理亦如此。“长”“永”二字相同。虽不免小有言语之辩，然终因此言辩明。\n九二：不克讼，归而逋。其邑人三百户，无眚。\n“克”，胜也。自下讼上，不克而还，故曰“归”。“逋”，逃避也。“坎为隐伏”，逋之象也。邑人详见谦卦。中爻为离，坎错离，离居三，三百之象也。二变下卦为坤，坤则阖户之象也。“三百”，言其邑之小也。言以下讼上，归而逋窜是矣。然使所逋窜之邑为大邑，则犹有据邑之意，迹尚可疑；必如此小邑藏避，不敢与五为敌，方可免眚。需、讼相综，讼之九二即需之九五。曰“刚来而得中”，曰“归而逋”，皆因自上而下，故曰“来”曰“归”，其字皆有所本。如此玄妙，岂粗心者所能解。“坎为眚”，变坤则“无眚”矣。\n九二阳刚，为险之主，本欲讼者也，然以刚居柔之中，既知其理之不当讼，而上应九五之尊，又知其势不可讼，故自处卑小以免灾患，故其象如此。占者如是，则“无眚”矣。\n羑里之囚文王，岂有一毫不是之处，只是不辩不争，而曰天王圣明，所以为内文明，而外柔顺。\n《象》曰：“不克讼，归逋”窜也。自下讼上，患至掇也。\n掇，都活反。\n“归逋窜”者，不与之讼也。“掇”者，拾取也。自下讼上，义乖势屈，祸患犹拾而自取，此言“不克讼”之故。\n六三：食旧德，贞厉，终吉。或从王事，无成。\n“德”，乃恶德。往日之事也，故以“旧”字言之。凡人与人争讼，必旧日有怀恨不平之事。有此怀恨其人之恶德，藏畜于胸中，必欲报复，所以讼也。“食”者，吞声不言之意。中爻巽综兑口，“食”之象也。“王事”者，王家敌国忿争之事。如宋之与金是也。变巽不果，“或”之象也。中爻离日，“王”之象也。应爻乾君，亦王之象也。“无成”者，不能成功也。下民之争讼主于怯，王家之争讼主于才。以此“食旧德”之柔，处下民之刚强私敌则可，若以此处王家之刚强敌国，是即宋之于金，柔弱极矣。南朝无人，稽首称臣，安得有成？\n六三上有刚强之应敌，阴柔自卑，故有食人“旧德”不与争辩之象。然应与刚猛，常受侵凌，虽正亦不免危厉矣。但六三含忍不报，从其上九，与之相好，所以终不为己害而吉也。如此之人，柔顺有余，而刚果不足，安能成王事哉！故占者乃下民之应敌则吉，或王事之应敌，则无成而凶。\n《象》曰：“食旧德”，从上吉也。\n“从上”者，从上九也。上九刚猛，六三食其旧日刚猛侵凌之恶德，相从乎彼，与之相好，则吉矣。\n九四：不克讼，复即命，渝，安贞，吉。\n“即”，就也。“命”者，天命之正理也。不曰“理”而曰“命”者，有此象也。中爻巽，四变亦为巽，命之象也。“渝”，变也。四变中爻为震，变动之象也，故随卦初爻曰“渝”。“安贞”者，安处于正也。“复即于命”者，外而去其忿争之事也。变而“安贞”者，内而变其忿争之心也。心变，则事正矣。“吉”者，虽不能作事于谋始之先，亦能改图于有讼之后也。九二、九四皆“不克讼”，既不克矣，何以讼哉！盖二之讼者，险之使然也。其“不克”者，势也。知势之不可敌，故归而逋逃。曰“归”者，识时势也。四之讼者，刚之使然也，其不克者理也。知理之不可违，故复即于命。曰“复”者，明理义也。九四之复，即九二之归，皆以刚居柔，故能如此。人能明理义，识时势，处天下之事无难矣。学者宜细玩之。\n九四刚而不中，故有讼之象。以其居柔，故又有“复即命渝安贞”之象。占者如是，则吉也。\n《象》曰：“复即命，渝，安贞”，不失也。\n始而欲讼，不免有失；今既复“渝”，则改图而不失矣。\n九五：讼，元吉。\n九五为讼之主，阳刚中正以居尊位，听讼而得其平者也。凡讼，占者遇之则“利见大人”，讼得其理而“元吉”矣。\n《象》曰：“讼，元吉”，以中正也。\n中则听不偏，正则断合理，所以“利见大人”而元吉。\n上九：或锡之鞶带，终朝三褫之。\n鞶，音盘。褫，池尔切，音耻。\n“或”者，未必然之辞。“鞶带”，大带，命服之饰，又绅也。男鞶革，女鞶丝。乾为衣，又为圜，带之象也。乾君在上，变为兑口，中爻为巽，命令锡服之象也，故九四曰“复即命”。中爻离日，朝日之象也。离日居下卦，终之象也。又居三，三之象也。“褫”，夺也。“坎为盗”，褫夺之象也。命服以锡有德，岂有赏讼之理？乃设词以极言讼不可终之意。\n上九有刚猛之才，处讼之终，穷极于讼者也。故圣人言人肆其刚强，穷极于讼，取祸丧身，乃其理也。设若能胜，至于受命服之赏，是亦仇争所得，岂能长保？故终一朝而三见褫夺也。即象而占之，凶可知矣。\n《象》曰：以讼受服，亦不足敬也。\n纵受亦不足敬，况褫夺随至，其不可终讼也明矣。","7":"师忧\n“师”者，众也。其卦坎下坤上。以卦象论，地中有水，为众聚之象。以卦德论，内险而外顺，险道以顺行，师之义也。以爻论，一阳居下卦之中，上下五阴从之，将统兵之象也。二以刚居下，五柔居上而任之，人君命将出师之象也。《序卦》：“讼必有众起。”师兴由争，故次于讼。\n师：贞，丈人吉，无咎。\n以三画卦论，二为人位，故称“丈人”。\n“贞”者，正也。“丈人”者，老成持重、练达时务者也。凡人君用师之道，在得正与择将而已。不得其正，则师出无名。不择其将，则将不知兵。故用兵之道，利于得正，又任老成之人，则以事言，有战胜攻取之吉，以理言，无穷兵厉民之咎矣。戒占者当如是也。\n《彖》曰：师，众也。贞，正也。能以众正，可以王矣。刚中而应，行险而顺，以此毒天下而民从之，吉又何咎矣！\n王，去声。\n以卦体、卦德释卦辞。“众”者，即《周官》自五人为伍，积而至于二千五百人为师也。“正”者，即“王者之兵，行一不义，杀一不辜，而得天下，不为”，如此之正也。“以”者，谓能左右之也。一阳在中，而五阴皆所左右也。左右之使众人皆正，则足以宣布人君之威德，即王者仁义之师矣，故可以王。“以众正”言为将者，“可以王”言命将者。能正即可以王，故师贵贞也。刚中而应者，为将不刚则怯，过刚则猛。九二刚中，乃将才之善者。有此将才，五应之。又信任之专，则可以展布其才矣。“行险”者，兵危事也，谓坎也。“顺”者，顺人心也，谓坤也。“兵”足以戡乱而顺人心，则为将有其德矣。有是才德，所以名“丈人”也。“毒”者，犹既济“惫”字，时久师老之意。噬嗑中爻为坎，故亦曰“遇毒”，乃陈久之事。文案繁杂，难于听断，故以“腊毒”象之，非毒害也。言出师固未免毒于天下，然毒之者，实所以安之，乃民所深愿而悦从者也。民悦而从，所以言而无咎。“毒天下”句与“民从之”句意正相应。若毒天下而民不从，岂不凶而有咎？\n《象》曰：地中有水，师。君子以容民畜众。\n水不外于地，兵不外于民。地中有水，水聚地中，为聚众之象，故为“师”。“容”者，容保其民，养之教之也。“畜”者，积畜也。古者寓兵于农，故容保其民者，正所以畜聚其兵也。常时民即兵，变时兵即民。兵不外乎民，即水不外乎地也。\n初六：师出以律，否臧凶。\n初与九二相近，亦偏裨之雄者，故戒以失律，专以将言。“律”者，法也。号令严明，部伍整肃，坐作进退，攻杀击刺皆有法则是也。“否”者，塞也，兵败也。“臧”者，善也，兵成功也。若不以律，不论成败，成亦凶，败亦凶，二者皆凶，故曰“否臧凶”。观《小象》“失律凶”之句，可见矣。\n初六才柔，当出师之始，师道当守其法则，故戒占者“师出以律”，失律则不论“否”、“臧”皆凶矣。臧，善也，以律者臧也。否，不也，失律者否臧也。\n《象》曰：“师出以律”，失律凶也。\n《小象》正释否臧之为失律也，失律未有能成功者。《左传》云，执事顺成为臧，逆为否。“失律”，“否”固凶，“臧”亦凶。\n九二：在师中，吉，无咎。王三锡命。\n“师中”者，在师而得其中也。此爻正彖辞之“刚中而应”，六五《小象》之“以中行”，皆此中也。“在师中”者，“刚中”也。“锡命”者，正应也。盖为将之道，不刚则怯，过刚则猛，惟“刚中”则“吉”。而“无咎”者，恩威并著，出师远讨，足以靖内安外也。“锡命”者，乃宠任其将，非褒其成功也。曰“锡命”，则六五信任之专可知矣。本卦错同人，乾在上，“王”之象，离在下，“三”之象，中爻巽，“锡命”之象。全以错卦取象，亦如睽卦上九之“见豕负涂”也。\n九二为众阴所归，有刚中之德，上应六五而为之宠任，故其象如此，而占可知矣。\n《象》曰：“在师中吉”，承天宠也。“王三锡命”，怀万邦也。\n意在万邦，故宠任将，非为将一人也。“天”谓王也。“在师中吉”者，以其承天之宠，委任之专也。“王三锡命”者，以其存心于天下，惟恐民之不安，故任将伐暴安民也。下二句皆推原二五之辞。\n将握重兵，主易猜疑，王翦请美田宅是也。\n六三：师或舆尸，凶。\n“或”者，未必之辞。变巽，进退不果，“或”之象也。“舆”者，多也，众人之意，即今“舆论”之舆。以坤、坎二卦皆有“舆”象，故言“舆”也。“尸”者，主也。言为将者不主，而众人主之也。观六五“弟子舆尸”可见矣。《程传》是。\n六三阴柔，不中不正，位居大将九二之上，才柔志刚，故有出师大将不主而三或主之之象，不能成功也必矣。故其占凶。\n《象》曰：“师或舆尸”，大无功也。\n陆逊按剑戒诸老将，穰苴诛庄贾，孙膑诛宫嫔皆然。\n曰“大”者，甚言其不可舆尸也。\n六四：师左次，无咎。\n师三宿为“次”，右为前，左为后。盖乾先坤后，乾右坤左，故明夷六四阴也，曰“左腹”。丰卦九三阳也，曰“右肱”。“左次”，谓退舍也。\n六四居阴得正，故有出师，度不能胜，完师以退之象。然知难而退，兵家之常，故其占“无咎”。\n《象》曰：“左次，无咎”，未失常也。\n士会劝荀林父不渡河是也。曹操曰，孙权不欺我，遂还。\n知难而退，师之常也。圣人恐人以退为怯，故言。当退而退，亦师之常，故曰“未失常”。\n六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。\n“田”乃地之有水者，应爻为地道，居于初之上，田之象也，故乾二爻曰在“田”。禽者，上下皆阴，与小过同，禽之象也。“坎为豕”，错离为雉，皆“禽”象也。禽害禾稼，寇盗之象也。“坎为盗”，亦有此象。“执”者，兴师以执获也。“坤为众”，中爻震综艮，“为手”，众手俱动，执获之象也。“言”者，声罪以致讨也。坤错乾为言，言之象也。“无咎”者，师出有名也。“长子”，九二也。中爻震，“长子”之象也。“长子”即“丈人”，自众尊之曰“丈人”，自爻象之曰“长子”。“弟子”，六三也。坎为中男，震之弟也，“弟子”之象也。\n六五用师之主，柔顺得中，不为兵端者也。敌加于己，不得已而应之，故为“田有禽”之象。应敌兴兵，利于执言，占者固无咎矣。然任将又不可不专。若专于委任，使老成帅师以任事可也。苟参之以新进之小人，俾为“弟子”者参谋“舆尸”于其间，使“长子”之才有所牵制而不得自主，则虽曰“有禽”，乃应敌之兵，其事固贞，然所任不得其人，虽贞亦凶矣。因六五阴柔，故许以“无咎”，而又戒之以此。\n《象》曰：“长子帅师”，以中行也。“弟子舆尸”，使不当也。\n当，去声。\n言所以用“长子”帅师者，以其有刚中之德，使之帅师以行，使之当矣。若“弟子”，则使之不当也。“以中行”，推原其二之辞，“使不当”，归咎于五之辞。\n《庞籍》篇，狄青为大将，征侬智高曰：“愿勿置监军，必能成功。”\n上六：大君有命，开国承家，小人勿用。\n坤错乾，“大君”之象也。“乾为言”，“有命”之象也。“命”者，命之以开国承家也。“坤为地”、“为方”，国之象也，故曰“开国”。变艮“为门阙”，家之象也，故曰“承家”。损卦艮变坤，故曰“无家”。师卦坤变艮，故曰“承家”。周公爻象其精至此。“开”者，封也。“承”者，受也。功之大者开国，功之小者承家也。“小人”，开承中之小人也。阳大阴小，阴土重叠，小人之象也。“勿用”者，不因其功劳，而遂任用以政事也。变艮为止，“勿用”之象也。\n上六师终功成，正论功行赏之时矣，故有“大君有命，开国承家”之象。然师旅之兴，效劳之人其才不一，不必皆正人君子。惟计其一时得功之大小，此正王者封建之公心也。至于封建之后，则惟贤是用。而前日诸将功臣中之小人，惟享其封建之爵土，再不得干预乎庶政矣。故又戒之以“小人勿用”也。“弟子舆尸”，戒之于师始，“小人勿用”，戒之于师终，圣人之情见矣。\n《象》曰：“大君有命”，以正功也。“小人勿用”，必乱邦也。\n“正功”者，正功之大小也。“乱邦”者，小人挟功倚势，暴虐其民，必乱其邦。“王三锡命”，命于行师之始，惟在于怀邦。“怀邦”者，怀其邦。“大君有命”，命于行师之终，惟恐其乱邦。圣人行师，惟救其民而已，岂得已哉！\n命则止论功，用则必得人。","8":"比乐\n“比”，亲辅也。其卦坤下坎上。以卦象论，水在地上，最相亲切，比之象也。以爻论，五居尊位，众阴比而从之，有一人辅万邦、四海仰一人之象，故为比也。《序卦》：“众必有所比，故受之以比。”所以次师。\n比：吉。原筮，元永贞，无咎。不宁方来，后夫凶。\n比，毗意反。\n“原”者，再也。蒙之刚中在下卦，故曰“初筮”，比之刚中在上卦，故曰“原筮”。下卦名“初筮”，上卦名“原筮”，孔子于二卦彖辞皆曰“以刚中”。言蒙刚中在下，故能发人之蒙；比刚中在上，故有君德，而人来亲辅也，非旧注所谓“再筮”以自审也。“元”者，元善也，即仁也。“永”，恒也。“贞”，正也。言元善长永贞固也。“无咎”者，有此“元永贞”之三德也。“不宁”者，不遑也。四方归附方新，来者不遑也，犹言四方归附之不暇也。“坤为方”，故曰方。“后夫凶”者，如万国朝禹而防风后至，天下归汉而田横不来也。下画为前，上画为后，凡卦画，阳在前者为夫，如睽卦“遇元夫”是也。此“夫”指九五也。阳刚当五，乃位天德，“元”之象也。四阴在下，相率而来，“不宁方来”之象也。一阴高亢于上，负固不服，“后夫”之象也。\n言筮得此卦，为人所亲辅，占者固吉矣。然何以吉哉？盖因上卦阳刚得中，而有“元永贞”三者之德，则在我已无咎，而四方之归附于我者且不遑，后来者自蹈迷复之凶矣。此所以吉也。\n《彖》曰：比，吉也。比，辅也，下顺从也。“原筮，元永贞，无咎”，以刚中也。“不宁方来”，上下应也。“后夫凶”，其道穷也。\n释卦名义，又以卦体释卦辞。“比”，吉也。乃渐卦“女归吉也”之例，皆止添一“也”字。“比辅”者，言阳居尊位，群下顺从以亲辅之也。盖辅者比之义，顺从者又辅之义，顺者情不容己，从者分不可逃。“以”者，因也，因有此“刚中”之德也。“刚中”则私欲无所留，所以为善者此也。“刚中”则健而不息，所以为永者此也。“刚中”则正固而不偏，所以为贞者此也。盖八卦正位，坎在五，所以有此三德而无咎。九五居上，群阴应于下，上下相应，所以“不宁方来”。“道穷”者理势穷蹙，无所归附也。\n《象》曰：地上有水，比。先王以建万国，亲诸侯。\n物相亲比而无间者，莫如水在地上。先王观比之象，建公、侯、伯、子、男之国，上而巡狩，下而述职，朝聘往来以亲诸侯，诸侯承流宣化以亲其民，则视天下犹一家、万民犹一身，而天下比于一矣。《彖》则人来比我，《象》与诸爻则我去比人。师之畜众，井田法也。比之“亲侯”，封建法也。\n初六：有孚比之，无咎。有孚盈缶，终来有他吉。\n缶，音否。\n“有孚”者，诚信也。“比”之者，比于人也。诚信比人，则无咎矣。“缶”，瓦器也，以土为之，而中虚。坤土，阴虚之象也。“盈”者，充满也。“缶”，坤土之器。坎，下流之物。初变成屯，屯者盈也，水流盈缶之象也。若以人事论，乃自一念而念念皆诚，自一事而事事皆诚，即“盈缶”也。“有孚”即孟子所谓“信人”。“盈缶”则“充实”之谓美矣。来者，自外而来也。他对我言，终对始言。\n初六乃比之始，相比之道，以诚信为本，故“无咎”。若由今积累，自始至终，皆其诚信充实于中，若缶之盈满，孚之至于极矣，则不但“无咎”，更有他吉也。\n《象》曰：比之初六，有他吉也。\n言比不但“无咎”，而即“有他吉”，见比贵诚实也。\n六二：比之自内，贞吉。\n二在内卦，故曰“内”。“自内”者，由己涵养有素，因之得君，如伊尹乐尧舜之道，而应成汤之聘也。八卦正位，坤在二，故曰“贞”。\n六二柔顺中正，上应九五，皆以中正之道相比，盖贞而吉者也。占者有是德，则应是占矣。\n《象》曰：“比之自内”，不自失也。\n中正，故“不自失”。\n六三：比之匪人。\n唐河朔藩镇，互相朋党比匪也。\n三不中不正，已不能择人而比之矣，又承乘应皆阴，故为“比之匪人”。若以刚中处之，则虽匪人，安能为我比哉！\n《象》曰：“比之匪人”，不亦伤乎？\n“伤”，哀伤也，即孟子哀哉之意。不言其凶，而曰伤乎者，盖恻然而痛悯也。\n六四：外比之，贞吉。\n九五外卦，故曰“外”，谓从五也。“之”字指五。本卦独九五为贤，六二以正应而比之，修乎己而贞吉也。六四以相近而“比之”，从乎人而“贞吉”也。于此见《易》之时。\n六四柔顺得正，舍正应之阴柔，而外比九五刚明中正之贤，得所比之正者矣，吉之道也，故占者“贞吉”。\n《象》曰：“外比”于贤，以从上也。\n五，阳刚中正，故言“贤”，居尊位，故言“上”。言六四“外比”，岂徒以其贤哉？君臣大分，亦以安“从上”之分也。\n九五：显比。王用三驱，失前禽。邑人不诫，吉。\n“显”者，显然，光明正大无私也。言比我者无私，而我亦非违道以求比乎我也。下三句，“显比”之象也。“三驱”者，设三面之网，即天子不合围也。坎错离为日，王之象也，又居三，三之象也。坎马驾坤车，“驱”之象也。综师用兵，驱逐禽兽之象也。前后坤土两开，开一面之象也。故同人初九前坤土两开，曰同人于门。一阳在众阴之中，与小过同，“禽”之象也。故师卦亦曰“禽”。“前禽”指初。下卦在前，初在应爻之外，“失前禽”之象也。坤为邑，又为众，又三四为人位，居应爻二之上、五之下，“邑人”之象也。“不诫”者，禽之去者听其自去，邑人不相警诫以求必得也。“不诫”者，在下之无私，“不合围”者，在上之无私，所以为“显”。\n九五刚健中正以居尊位，群阴求比于己，显其比而无私，其不比者，亦听其自去。来者不拒，去者不追，故有此象。占者比人无私，则吉矣。\n《象》曰：“显比”之吉，位正中也。舍逆取顺，“失前禽”也。“邑人不诫”，上使中也。\n“显比”岂宜有失？唯但取顺而舍逆，故有失也。猎者以鹿龟为上杀，用首者为下杀，舍逆不杀，迎降也。\n“位正中”即刚健中正，居尊位也。用命不入网而去者为逆，不我比者也。不用其命入网而来者为顺，比我者也。人中正则不贪得。“邑人不诫”者，以王者有中德，故下化之亦中，亦不贪得，犹上有以使之也，所以“失前禽，邑人不诫”。\n上六：比之无首，凶。\n“乾为首”。九五乾刚之君，乃“首”也。九五已与四阴相为“显比”，至上六则不能与君比，是“比之无首”，其道穷矣，故蹈“后夫之凶”。\n师比相综，本是一卦体，在师则专论刚柔，在比则专论阴阳。\n《象》曰：“比之无首”，无所终也。\n“无所终”即“后夫凶”。","9":"小畜寡也\n“小”者，阴也。“畜”者，止也。乾下巽上，以阴畜阳。又一阴居四，上下五阳皆其所畜，以小畜大，故为“小畜”。又畜之未极，阳犹尚往，亦“小畜”也。《序卦》：“比必有畜，故受之以小畜。”所以次比。\n小畜：亨。密云不雨，自我西郊。\n畜，音初。大畜同。\n中爻离错坎，云之象。中爻兑，西之象。下卦乾，郊之象。详见需卦。凡云自西而来东者，水生木，泄其气，故“无雨”。\n“小畜亨”，然其所以亨者，以畜未极，而施未行也，故有“密云不雨，自我西郊”之象。故占者亨。\n《彖》曰：小畜，柔得位而上下应之，曰“小畜”。健而巽，刚中而志行，乃亨。“密云不雨”，尚往也；“自我西郊”，施未行也。\n施，始豉反。\n以卦综、卦德释卦名、卦辞。“得位”者，八卦正位，巽在内也。本卦与履相综，故孔子《杂卦》曰：“小畜寡也，履不处也。”履之三爻，阴居阳位，不得其位，往而为小畜之四，则“得位”矣，故曰“柔得位而上下应之”。“上下”者，五阳也。以“柔得位而上下应之”，则五阳皆四所畜矣。以小畜大，故曰“小畜”。内健则此心果决，而能胜其私。外巽则见事详审，而不至躁妄。又二五刚居中位，则阳有可为之势，可以伸其必为之志矣。阳性上行，故曰“志行”。“乃亨”者，言阳为阴所畜，宜不亨矣。以健而巽，刚居中而志行，则阳犹可亨也。“往”者，阳往。“施”者，阴施。言畜之未极，阳气犹上往，而阴不能止也。唯阳上往，所以阴泽不能施行而成雨。\n《象》曰：风行天上，小畜。君子以懿文德。\n“懿”，美也。巽顺，懿美之象。下乾，阳德之象。中爻离，文之象。以道而见诸躬行曰“道德”，见诸威仪文辞曰“文德”。风行天上，有气而无质，能畜而不能久，曰“小畜”。君子大则道德，小则文德，故体之以美其文。德之小曰“文”，而必曰“德”者，见文乃德之辉也。\n当小人畜君子之时，君子但染文翰，弄柔毛，自晦其才德，以示无用，故不被小人所忌也。\n初九：复自道，何其咎，吉。\n自下升上曰复，归还之意。阳本在上之物，志欲上进而为阴所畜止，故曰“复”。“自”者，由也。“道”者，以正道也。言进于上，乃阳之正道也。“何其咎”，见其本无咎也。复卦“不远复”、“休复”者，乃六阴已极之时，喜阳之复生于下。此卦之“复自道”、“牵复”者，乃一阴得位之时，喜阳之复升于上。\n初九乾体居下得正，为四所畜，故有“复自道”之象。占者如是，则无咎而吉矣。\n《象》曰：“复自道”，其义吉也。\n“自道”，所以当复，不论利害、祸福，止论理也。不谋于姊，几不得于义，辛宪知义矣。\n在下而畜于上之阴者，“势”也。不为阴所畜而复于上者，“理”也。阳不为阴畜，乃理之自吉者，故曰“其义吉”。\n九二：牵复，吉。\n九二渐近于阴，若不能“复”矣。然九二刚中，则不过刚，而能守己相时，故亦“复”。与初二爻并复，有牵连而复之象。占者如是，则吉矣。三阳同体，故曰“牵”。故夬卦亦曰“牵”。《程传》谓二五牵复，《本义》谓初，观《小象》亦字，则《本义》是。\n《象》曰：“牵复”在中，亦不自失也。\n在“中”者，言阳刚居中也。“亦”者，承初爻之辞。言初九之复自道者，以其刚正，不为阴所畜，固“不自失”也。九二刚中“牵复”，亦“不自失”也。言与初九同也。\n九三：舆说辐，夫妻反目。\n说，音脱。\n“舆”脱去其辐则不能行。乾错坤，舆之象也。变兑为毁折，脱辐之象也。脱辐非恶意，彼此相脱不肯行也。“乾为夫”，长女为妻。“反目”者，反转其目不相对视也。中爻离“为目”，巽“多白眼”，反目之象也。三四初时阴阳相比而悦，及变兑“为口舌”，巽性“进退不果”，又妻乘其夫，妻居其外，夫反在内，则三反见制于四，不能正室而反目矣。且阳性终不可畜，所以小畜止能畜得九三一爻，诸爻皆不能畜，然亦三之自取也。九三比阴，阴阳相悦，必苟合矣。为四畜止不行，故有“舆脱辐”之象。然三过刚不中，锐于前进，四性入坚于畜止，不许前进，三反见制于四，不能正室矣，故又有“反目”之象。其象如此，而占者之凶可知矣。\n《象》曰：“夫妻反目”，不能正室也。\n“室”者，闺门也。“正”者，男正位乎外，女正位乎内也。三四苟合，岂能“正室”？所以“反目”。故归妹《大象》曰：“君子以永终知敝。”\n六四：有孚，血去惕出，无咎。\n去，上声。\n五阳皆实，一阴中虚，“孚”信虚中之象也。中爻离错坎，“坎为血”，血之象也。“血去”者，去其体之见伤也。又为“加忧”，惕之象也。“惕出”者，出其心之见惧也。曰“去”曰“出”者，以变爻言也。盖本爻未变错坎，有“血惕”之象，既变则成纯乾矣，岂有“血惕”？所以“血去惕出”也。本卦以小畜大，四为畜之主，近乎其五，盖畜君者也。畜止其君之欲，岂不伤害忧惧？盖畜有二义：畜之不善者，小人而羁縻君子是也；畜之善者，此爻是也。\n六四近五，当畜其五者也。五居尊位，以阴畜之，未免伤害忧惧。四柔顺得正，乃能有孚诚信，以上合乎五之志，故有“血去惕出”之象。占者能如是诚信，斯“无咎”矣。\n《象》曰：“有孚”“惕出”，上合志也。\n上合志者，以其有孚诚信也。\n九五：有孚挛如，富以其邻。\n本卦《大象》“中虚”，而九五“中正”，故“有孚”诚信。“挛”者挛缀也，“缀”者缉也，“缉”者续也，皆相连之意，即九二之牵也。谓其皆阳之类，所以牵连相从也。“巽为绳”，挛之象也。又为“近市利三倍”，富之象也。故家人亦曰“富家大吉”。五居尊位，如富者有财，可与邻共之也。“以”者，左右之也。“以其邻”者，援挽同德，与之相济也。君子为小人所困，正人为邪党所厄，则在下者必攀挽于上，期于同进，在上者必援引于下，与之协力，故二“牵”而五“挛”。本卦虽以阴畜阳，初二皆“牵复吉”，不为阴所畜。《彖》曰“刚中而志行，乃亨”，“刚中志行”正在此爻，故“亨”。若旧注以三爻同力畜乾，则助小人以畜君子，阳岂得亨？非圣人作《易》之意矣。一阴五阳，君子多于小人，所以初二五皆不能畜。\n九五居尊，势有可为。以九二同德为辅佐，当小人畜止之时，刚中志行，故有“有孚挛如，富以其邻”，小人不得畜止之象。占者“有孚”，亦如是也。\n《象》曰：“有孚挛如”，不独富也。\n言“有孚”则人皆牵挛而从之矣，不必有其富也。今五居尊位，既富矣，而又有孚，故曰“不独富”。\n上九：既雨既处，尚德载。妇贞厉，月几望，君子征凶。\n上九变“坎为雨”，雨之象也。“处”者止也。巽性既进而退，巽风吹散其雨，“既雨既止”之象也。雨既止，可尚往矣。“尚德载”者，下三阳为德，坎为舆，成需，即需上六“不速之客三人来”也。“载”者，积三阳而载之也，故曰“积德载”，此言阳尚往也。水火乃相错之卦。火天大有曰“大车以载”，《象》曰“积中不败”，则坎车积三阳载之，上往也明矣。巽妇畜乾之夫，以顺为正。巽本顺而正者也，今变坎，失巽顺而为险陷，危厉之道也，故始贞而今厉矣。“坎为月”，中爻“离为日”，日月之象也。巽错震，中爻兑，震东兑西，日月相望之象也，言阴盛也。《易》中言“月几望”者三，皆对阳而言。中孚言从乎阳，归妹言应乎阳，此则抗乎阳也。三阳有乾德，故曰“君子”。巽性进退不果，本疑惑之人，今变坎陷，终必疑君子之进，畜止而陷之，故“征凶”。\n畜已终矣，阴终不能畜阳，故有雨止阳往之象。畜者虽贞，亦厉之道也。然阴既盛抗阳，则君子亦不可往矣。两有所戒也，故其象占如此。阳终不为阴所畜，故《杂卦》曰：“小蓄，寡也。”观“寡”字可知矣。\n汉桓、灵之世，岂无君子？上九“即雨即处，尚德载。妇贞厉，月几望，君子征凶”。上九出九五之上，六四安得而畜之？是雨止之时，可与三阳同德共载而往矣。但六四之阴，虽不蓄阳而贞，然犹危厉，其所以危厉者，以其居君之侧，如月与日相望，借日以为光。“君子征凶”，宋之章惇，终借哲宗以肆报复，君子岂可曰庆而轻进乎？戒君子之轻进也。《象》曰：“既雨既处，德积载也，君子征凶，有所疑也。”阳多阴少，阳盛阴衰，所以雨止。然终疑一阴在君侧，征必凶也，宋之绍圣是也。\n畜阳者，必恃近君之位，可以困厄君子，故赖九五刚中之君，乃可无患。然终是近君之阴，不可不防。疑小人难保，正以君心难保也。而况司马君实，恃元佑之女主乎？\n上九阳也，而处乎上，乃退休老臣之象。卦辞曰“不雨”，爻辞曰“既雨”，则“既雨”二字，岂可径作“雨止”，当是经雨而休息者，故曰“君子征凶”。\n《象》曰：“既雨既处”，德积载也。“君子征凶”，有所疑也。\n阳德积而尚往，故“贞厉”；阴终疑阳之进而畜之，故“征凶”。","10":"履不处也\n“履”者，礼也，以礼人所践履也。其卦兑下乾上。天尊于上，泽卑于下，履之象也。内和悦而外刚健，礼严而和之象也。《序卦》：“物畜然后有礼，故受之以履。”因次小畜。\n履虎尾者，履帝位之象也。心之忧危，若蹈虎尾，凛于春冰是也。初与二非上也，故在其所履而无害。三则上矣，稍刚即暴矣。五中正而厉者，刚也。上九不中不正而元吉者，以理自治也。\n履虎尾，不咥人，亨。\n咥，重结反，音绖。\n“履”者，足践履也。中爻巽错震，“震为足”，有履之象，乃自上而履下也。“咥”者，啮也。下卦兑错艮，“艮为虎”，虎之象也，乃“兑为虎”，非“乾为虎”也。先儒不知象，所以以乾为虎。周公因文王取此象，故革卦上体兑亦取虎象。曰“尾”者，因下卦错虎，所履在下，故言“尾”也。故遁卦下体艮，亦曰“尾”。兑口乃悦体，中爻又巽顺，虎口和悦，巽顺不猛，故“不咥人”。\n《彖》曰：履，柔履刚也。说而应乎乾，是以“履虎尾，不咥人，亨”。刚中正，履帝位而不疚，光明也。\n说，音悦。\n以卦德释卦名、卦辞，而又言卦体之善。“柔履刚”者，以三之柔履二之刚也，此就下体自上履下而言也，释卦名也。悦而应乎乾者，此就二体自下应上而言也。曰“应”者，明其非履也。三与五同功，故曰“应”。此释卦辞之所以亨也。帝指五。九五刚健中正，德与位称，故“不疚”。不疚则功业显于四方，巍然焕然，故“光明”。中爻离，“光明”之象。此又卦体所履之善，非圣人不足以当之，故文王言“履虎尾”，孔子言“履帝位”。\n《象》曰：上天下泽，履。君子以辨上下，定民志。\n君子观履之象，辨上下之分。上下之分既辨，则民志自定，上自安其上之分，下自安其下之分矣。\n初九：素履，往无咎。\n“素”者，白也，空也，无私欲污浊之意。“素履”即《中庸》“素位而行”。舜饭糗茹草若将终身，颜子陋巷不改其乐是也。“往”者，进也。阳主于进，故曰“往”。\n初九阳刚在下，本无阴私，当履之初，又无外物所诱，盖素位而行者也，故有“素履”之象。以是而往，必能守其所愿之志而不变，履之善者也，故占者“无咎”。\n《象》曰：“素履”之往，独行愿也。\n独有人所不行，而己“独行”之意。愿即《中庸》“不愿乎外”之愿。言初九素位而行，独行己之所愿，而不愿乎其外也。\n九二：履道坦坦，幽人贞吉。\n“履道坦坦”，依乎中庸，不索隐行怪也。幽独之人多是贤者，所以能履道坦平，不过乎高而惊世骇俗，则“贞吉”矣。变震为足，履之象也；又为“大涂”，道坦坦之象也。“幽”对明言。中爻离明在上，则下爻为幽矣。三画卦，二为人位，幽人之象也。故归妹中爻离，九二亦以幽人言之。履以坦行，礼之用和为贵，所以本卦阳爻处阴位，如上九则“元吉”者，以严而有和也。二与四同。二“坦坦”而四“愬愬”者，二得中而四不得中也。二与五皆得中位，二贞吉而五贞厉者，二以刚居柔，五以刚居刚也。\n九二刚中居柔，上无应与，故有“履道坦坦”之象。幽人如此，正而且吉之道也。故占者贞吉。\n《象》曰：“幽人贞吉”，中不自乱也。\n有此中德，心志不自杂乱，所以依中庸而贞吉。世之富贵外物，又岂得而动之？\n六三：眇能视，跛能履。履虎尾，咥人，凶。武人为于大君。\n中爻巽错震足，下离为目，皆为兑之“毁折”，“眇”、“跛”之象也。六画卦，三为人位，正居兑口，人在虎口之中，虎咥人之象也。三变则六画皆乾矣。以悦体而有文明，乃变为刚猛武勇，武之象也。三人位，“武人”之象也。曰“武”者，对前未变离之文而言也。阳大阴小，阴变为阳，大之象也，故坤卦用六，以大终变为乾君，大君之象也。“咥人”，不咥人之反；为“大君”，履帝位之反。\n六三不中不正，柔而志刚，本无才德而自用自专，不能明而强以为明，不能行而强以为行，以此履虎，必见伤害，故有是象。占者之凶可知矣。亦犹履帝位者，必德称其位而不疚，“武人”乃强暴之夫，岂可为“大君”哉！徒自杀其躯而已。“武人为大君”，又占中之象也。\n《象》曰：“眇能视”，不足以有明也。“跛能履”，不足以与行也。“咥人”之凶，位不当也。“武人为于大君”，志刚也。\n“不足有明与行”，以阴柔之才言。“位不当”者，以柔居刚也。爻以位为志。六三，阴柔才弱而志刚，亦如师卦之六三，所以武人而欲为大君。\n九四：履虎尾，愬愬终吉。\n四应初，故“履虎尾”。“愬愬”，畏惧貌。四多惧，“愬愬”之象也。三以柔暗之才，而其志刚猛，所以触祸。四以刚明之才，而其志恐惧，所以免祸。天下之理原是如此，不独象，故然也。\n九四亦以不中不正，履其虎尾，然以刚居柔，故能“愬愬”戒惧，其初虽不得即吉，而终则吉也。\n《象》曰：“愬愬终吉”，志行也。\n初曰独行，远君也。四曰“志行”，近君也。“志行”者，柔顺以事刚决之君，而得行其志也。始虽危，而终则不危，所谓“终吉”者此也。盖危者始平，《易》之道原是如此，故三之志徒刚，而四之志则行。\n九五：夬履，贞厉。\n“夬”者，决也，慨然以天下之事为可为，主张太过之意。盖夬与履皆乾兑上下相易之卦，曰“夬履”者，在履而当夬位也。然彖辞与爻辞不同，何也？盖彖辞以履之成卦言，六爻皆未动也，见其刚中正，故善之。爻辞则专主九五一爻而言，以变爻而言也。变离则又明燥而愈夬矣，故不同。在下位者，不患其不忧，患其不能乐，故喜其“履坦”。在上位者，不患其不乐，患其不能忧，故戒其“夬履”。二之坦，则正而吉者，喜之也。五之夬，则正而危者，戒之也。\n九五“以刚中”而“履帝位”，则有可夬之资，而挟可夬之势矣。又下应巽体，为臣下者皆容悦承顺，故有“夬履”之象。虽有所恃，必有所害。虽使得正，亦危道也。故其占为“贞厉”，其戒深矣。\n《象》曰：“夬履，贞厉”，位正当也。\n有中正之德而又当尊位，伤于所恃。又下卦悦体，因悦方成其夬，所以兑之九五亦言“位正当”。\n上九：视履。考祥。其旋。元吉。\n“视履”作一句，与“素履”、“夬履”同例。“视”者，回视而详审也。中爻离目，视之象也。“祥”者，善也。三凶五厉，皆非善也。考其履之善，必皆天理之节文、人事之仪则，下文其旋是也。“旋”者，周旋、折旋也。凡礼，以义合，而截然不可犯者谓之方，犹人之步履折旋也。以天合而怡然不可解者，谓之圆，犹人之步履周旋也。礼虽有三千三百之多，不过周旋、折旋而已。考其善于周旋、折旋之间，则中规、中矩矣。岂不“元吉”？\n上九当履之终，前无所履，可以回视其履矣，故有“视履”之象。能视其履，则可以考其善矣。考其善而中规、中矩，履之至善者也。占者如是，不惟吉，而且大吉也。\n《象》曰：“元吉”在上，大有庆也。\n大即“元”，“庆”即“吉”，非“元吉”之外，别有“大庆”。","11":"泰\n“泰”者，通也。天地阴阳相交而和，万物生成，故为“泰”。小人在外，君子在内，泰之象也。《序卦》：“履而泰，然后安，故受之以泰。”所以次履。此正月之卦。\n泰：小往大来，吉，亨。\n小谓“阴”，大谓“阳”，“往”、“来”以内外之卦言之。由内而之外曰“往”，由外而之内曰“来”。否泰二卦同体，文王相综为一卦，故《杂卦》曰：“否泰，反其类也。”“小往大来”者，言否内卦之阴，往而居泰卦之外，外卦之阳，来而居泰卦之内也。\n《彖》曰：“泰，小往大来，吉，亨”，则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人。君子道长，小人道消也。\n“则是”二字直管至“消也”。天地以气交，气交而物通者，天地之泰也。上下以心交，心交而志同者，上下之泰也。阴阳以气言，健顺以德言，此二句造化之“小往大来”也。君子小人以类言，此三句人事之“小往大来”也。“内外”释“往来”之义，“阴阳健顺”、“君子小人”释“大小”之义。\n《象》曰：天地交，泰。后以财成天地之道，辅相天地之宜，以左右民。\n“后”，元后也。道就其体之自然而言，宜就其用之当然而言。“财成”者，因其全体而裁制使不过。如气化流行，圣人则为之分春夏秋冬之节；地势广邈，圣人则为之分东西南北之限。此裁成“天地之宜”也。“辅相”者，随其所宜，而赞助其不及。如春生秋杀，此时运之自然；高黍下稻，亦地势之所宜。圣人则使之春耕秋敛，高黍下稻，此“辅相天地之宜”也。“左右”者，扶植之意。扶植以遂其生，俾其亦如天地之通泰也。阳左阴右，有此象，故曰“左右”。\n初九：拔茅茹，以其汇，征吉。\n变巽为阴木，草茅之象也。“茹”者，根也。初在下，根之象也。“汇”者，类也。“拔茅茹以其汇”者，言拔一茅，则其根茹牵连同类而起也。“征”者，仕进之意。\n当泰之时，三阳同体，有“拔茅茹以其汇”之象，占者同德牵连而往，则吉矣。\n《象》曰：“拔茅”“征吉”，志在外也。\n志在外卦之君，故“征吉”。\n九二：包荒，用冯河，不遐遗。朋亡，得尚于中行。\n冯，音凭。\n“包”字详见蒙卦。“包荒”者，包乎“初”也，“初”为草茅荒秽之象也。因本卦“小往大来”，阳来乎下，故“包初”。“冯河”者，二变则中爻成坎水矣，河之象也。河水在前，乾健“利涉大川”，“冯”之象也。用“冯河”者，用冯河之勇往也。二居柔位，故教之以勇。二变与五隔河，若“冯河”而往，则能就乎五矣。二与初为迩，隔三四与五为遐。“不遐遗”者，不遗乎五也。“朋”者，初也。三阳同体，牵连而进，二居其中，“朋”之象也。故咸卦中爻成乾，四居乾之中，亦曰“朋从”。“朋亡”者，亡乎初而事五也。“尚”者，尚往而事五也。“中行”，指六五。六五《小象》曰“中以行愿”是也。卦以上下交为泰，故以“尚中行”为辞。曰“得尚”者，庆幸之辞也。若惟知包乎荒，则必不能“冯河”而就五矣，必“遐遗”乎五矣，必不能“亡朋矣”。“用冯河”以下，圣人教占者之辞。阳来居内，不向乎外，有惟知包乎内卦之初，遐遗乎外卦君上之象，故圣人于初教之以征，于二教之以尚。旧注不识象，所以失此爻之旨。\n当泰之时，阳来于下，不知有上，故九二有包初之象。然二五君臣同德，天下太平，贤人君子，正当观国用宾之时，故圣人教占者用“冯河”之勇，以奋其必为之志，不可因迩而忘远。若能忘其所迩之朋，“得尚”往于“中行”之君，以共济其泰，则“上下交而其志同”，可以收光大之事业，而泰道成矣。故其象占如此。\n《象》曰：“包荒”，“得尚于中行”，以光大也。\n曰“包荒”，兼下三句而言也。孔子《小象》多是如此。舍相比溺爱之朋，而尚往以事中德之君，岂不能光明正大！乾阳，大之象也。变离，光之象也。\n九三：无平不陂，无往不复。艰贞无咎，勿恤其孚，于食有福。\n陂，碑为反。\n“陂”，倾邪也。“无平不陂”，以上卦地形险夷之理言。“无往不复”，以下卦天气往来之理言。“艰”者，劳心焦思、不敢慢易之意。“贞”者，谨守法度、不敢邪僻般乐之意。“恤”者，忧也。“孚”者，信也。“勿恤其孚”者，不忧此理之可信也。食者，吞于口而不见也。“福”者，福禄也。“有福”者，我自有之福也。“食有福”者，天禄永终之意。乾之三爻，“乾乾惕若厉，艰贞无咎”之象也。变兑为口，食之象也。\n三当泰将极而否将来之时，圣人戒占者曰：居今泰之世者，承平既久，可谓平矣，无谓平而不陂也。阴往阳来，可谓往矣，无谓往而不复也。今三阳既盛，正将陂将复之时矣，故必艰贞而守正，庶可保泰而无咎。若或不忧此理之可信，不能艰贞以保之，是自食尽其所有之福禄矣，可畏之甚也。故戒占者以此。\n《象》曰：“无往不复”，天地际也。\n“际”者，交际也。外卦地，内卦天，天地否泰之交会，正在九三、六四之际也。\n六四：翩翩，不富以其邻，不戒以孚。\n此爻正是阴阳交泰。“翩翩”，飞貌，言三阴群飞而来也。小畜曰“富”者，乃阳爻也。此曰“不富”者，乃阴爻也。泰、否相综，中爻巽，巽为“利市三倍”，富之象也。又为“命令”，戒之象也。言不待倚之以富，而其邻从之者甚于从富，不待戒之以令，而其类信之者速于命令也。“从”者，从乎阳也。信者，信乎阳也。言阴交泰乎阳也，阳欲交泰乎阴，故初曰“征”，二曰“尚”。阴欲交泰乎阳，故四曰“不富以邻，不戒以孚”，言乃中心愿乎阳也。五曰“帝乙归妹”，言行愿乎阳也。此四爻正阴阳交泰，所以说两个“愿”字。彖辞“上下交而其志同”，正在于此。若三与上虽正应，然阴阳之极，不成交泰矣。故三阳之极则曰“无往不复”，所以防“城复于隍”于其始；六阴之极则曰“城复于隍”，所以表“无往不复”于其终，二“复”字相应。\n六四柔顺得正，当泰之时，阴向乎内，已交泰乎阳矣，故有三阴“翩翩”、“不富”、“不戒”之象。不言“吉凶”者，阴方向内，其势虽微，然小人已来于内矣，固不可以言吉。然上有“以祉元吉”之君，“上下交而其志同”，未见世道之否，又不可以言凶也。\n《象》曰：“翩翩，不富”，皆失实也。“不戒以孚”，中心愿也。\n“皆失实”者，阴虚阳实，阴往于外已久，三阴皆失其阳矣。今来与阳交泰，乃中心之至愿也，故“不戒”而自孚。\n六五：帝乙归妹，以祉元吉。\n中爻三五为雷，二四为泽，有“归妹”之象，故曰“归妹”。因本卦阴阳交泰，阴居尊位而阳反在下，故象以此也。“帝乙”，即高宗、箕子之例。“祉”者，福也。“以祉”者，以此得祉也，即泰道成也。\n泰已成矣，阴阳交会，五以柔中而下应二之刚中，“上下交而其志同”，故有王姬下嫁之象，盖享太平之福祉而元吉者。占者如是，亦祉而元吉矣。\n《象》曰：“以祉元吉”，中以行愿也。\n“中”者，中德也。阴阳交泰，乃其所愿，故二曰“尚”，五曰“归”，一往一来之意也。二曰“中行”，五曰“中行愿”，上下皆中正，所谓“上下交而其志同”也。四与阳心相孚契，故曰“中心愿”。五下嫁于阳，则见诸行事矣，故曰“行愿”。惟得行其愿，则泰道成矣，所以“元吉”。\n上六：城复于隍。勿用师，自邑告命，贞吝。\n“坤”为土，变艮亦土，但有离象，中虚外围，城之象也。既变为艮，则“为径路”、“为门阙”、“为果蓏”。城上有径路如门阙，又生草木，则城倾圮不成其城矣，“复于隍”之象也。程子言“掘隍土积累以成城”，如治道积累以成泰，及泰之终将反于否，如城土倾圮“复于隍”是也。此“复”字正应“无往不复”复字。“师”者，兴兵动众，以平服之也。“坤”为众，中爻为震，变爻象离，“为戈兵”，众动戈兵，师之象也。与复上六同。中爻兑口，“告”之象也。兑综巽，命之象也。“自”者，自近以及远也。“邑”字，详见谦卦。\n上六当泰之终，承平既久，泰极而否，故有“城复于隍”之象。然当人心离散之时，若复用师以平服之，则劳民伤财，民益散乱，故戒占者不可用师远讨，惟可自一邑亲近之民播告之，渐及于远，以论其利害可也。此收拾人心之举，虽亦正固，然不能保邦于未危之先，而罪己下诏于既危之后，亦可羞矣，故其占者如此。\n《象》曰：“城复于隍”，其命乱也。\n“命”即“可以寄百里”之命。“命”字谓政令也。盖泰极而否，虽天运之自然，亦人事之致然。惟其命乱，所以复否。圣人于泰终而归咎于人事，其戒深矣。","12":"否泰反其类也\n“否”者，闭塞不通也。卦象、卦德皆与“泰”反。《序卦》：“物不可以终通，故受之以否。”所以次泰。此七月之卦。\n否之匪人，不利。君子贞，大往小来。\n“否之匪人”与“履虎尾”、“同人于野”、“艮其背”同例，卦辞惟此四卦与卦名相连。“否之匪人”者，言“否之”者非人也，乃天也，即“大往小来”也。“不利”者，即彖辞“万物不通”、“天下无邦”、“道长”、“道消”也。“君子贞”者，即“俭德避难，不可荣以禄”也。不言“小人”者，《易》为“君子谋”也。“大往小来”者，否泰相综，泰内卦之阳往而居否之外，外卦之阴来而居否之内也。文王当殷之末世，亲见世道之否，所以发“匪人”之句。后来孔子居春秋之否，乃曰：“道之将行也与，命也；道之将废也与，命也。”孟子居战国之否，乃曰：“莫之为而为者，天也。莫之致而至者，命也。”皆宗文王“否之匪人”之句。“否之匪人”者，天数也。“君子贞”者，人事也。所以孔、孟进以礼，退以义，惟守君子之贞。程、朱以为非人道也，似无道字意。诚斋以为用非其人，似无用字意。不如只就“大往小来”说。\n言“否之”者，“非人”也，乃天也。否由于天，所以占者不利。丁否运之君子，欲济其否，岂容智力于间哉！惟当守其正而已。\n《彖》曰：“否之匪人，不利，君子贞，大往小来”，则是天地不交，而万物不通也，上下不交而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子。小人道长，君子道消也。\n释“大往小来”四字与泰卦同。上自为上，下自为下，则虽有国，实与无邦国同矣。故“天下无邦”。\n《象》曰：天地不交，否。君子以俭德辟难，不可荣以禄。\n辟，音避。难，去声。\n“俭”者，俭约其德，敛其道德之光也。坤“为吝啬”，俭之象也。“辟难”者，避小人之祸也。三阳出居在外，避难之象也。“不可荣以禄”者，人不可得而荣之以禄也，非戒辞也。言若不“俭德”，则人因德而荣禄，小人忌之，祸即至矣。今既“俭德”，人不知我，则“不荣以禄”。故“不荣以禄”者，正所以“避难”也。\n初六：拔茅茹，以其汇。贞吉，亨。\n变震为蕃，“茅茹”之象也。否综泰，故初爻辞同。“贞”者，上有九五刚健中正之君，三阴能牵连，而志在于君，则贞矣。盖否之时能从乎阳，是小人而能从君子，岂不贞？\n初在下，去阳甚远，三阴同体，故有“拔茅茹以其汇”之象。当否之时，能正而志在于“休否”之君，吉而且亨之道也。故教占者以此。\n《象》曰：“拔茅”“贞吉”，志在君也。\n“贞”者，以其志在于君也，故“吉”。泰初九曰“志在外”，此变外为君者，泰六五之“君”，不如否之“刚健中正”得称“君”也。\n六二：包承，小人吉，大人否亨。\n“包承”者，包乎初也。二乃初之承。曰“包承”者，犹言将承包之也。大来乎下，故曰“包荒”；小来乎下，故曰“包承”。既包乎承，则小人与小人为群矣。小人与小人为群，大人与大人为群，不相干涉，不相伤害矣。“否”者，不荣以禄也。\n当否之时，小来乎下，故六二有“包承”之象。既包乎承，则小人为群，不上害乎大人矣，故占者在小人则有不害正之吉，在大人则身否而道亨也。\n《象》曰：“大人否亨”，不乱群也。\n阴来乎下，阳往乎上，两不相交，故“不乱群”。\n六三：包羞。\n“包”者，包乎二也。三见二包乎其初，三即包乎二。殊不知二隔乎阳，故包同类。若三则亲比乎阳矣，从阳可也。乃不从阳，非正道矣，可羞者也，故曰“包羞”。\n六三不中不正，亲比乎阳。当小来于下之时，止知包乎其下矣，而不知上有阳刚之大人在也。乃舍四之大人，而包二之小人，羞孰甚焉，故有是象。占者之羞可知矣。\n《象》曰：“包羞”，位不当也。\n位不当者，柔而志刚，不能顺从乎君子，故可“羞”。\n九四：有命无咎，畴离祉。\n变巽为命，命之象也。“有命”者，受九五之命也。四近君，居多惧之地，易于获咎，今变巽顺，则能从乎五矣，故“有命无咎”。“畴”者，同类之三阳也。“离”者，丽也。“离祉”者，附丽其福祉也。\n九四当否过中之时，刚居乎柔，能从“休否”之君，同济乎否，则因“大君之命”，而济否之志行矣。故不惟在我无咎，获一身之庆，而同类亦并受其福也。故其象占如此。\n《象》曰：“有命无咎”，志行也。\n济否之“志行”。\n九五：休否，大人吉。其亡其亡，系于苞桑。\n“休否”者，休息其否也。“其亡其亡”者，念念不忘其亡，惟恐其亡也。人依木息曰“休”。中爻巽木，五居木之上，“休”之象也。巽为阴木，二居巽之下，阴木柔，“桑”之象也。巽为绳，“系”之象也。丛生曰“苞”。丛者聚也，柔条细弱，群聚而成丛者也。此爻变离，合坎为丛棘，“苞”之象也。桑，非樟、楠、松、柏之大矣，又况丛聚而生，则至小而至柔者也。以国家之大，不系于“磐石”之坚固，而系于“苞桑”之柔小，危之甚也，即危如累卵之意。\n九五阳刚中正，能休时之否，“大人”之事也，故大人遇之则吉。然下应乎否，惟“休否”而已，未“倾否”也。故必勿恃其否之可休，勿安其休之为吉。兢业戒惧，念念惟恐其亡，若国家系于“苞桑”之柔小，常畏其亡而不自安之象，如此则否休而渐倾矣。故教占者必儆戒如此，“系于苞桑”，又“其亡其亡”之象也。\n《象》曰：“大人”之吉，位正当也。\n有中正之德而又居尊位，与夬、履同者。亦恐有所恃，故爻辞有“其亡其亡”之句。\n上九：倾否，先否后喜。\n上文言休息其否，则其否犹未尽也。“倾”者，倒也，与鼎之“颠趾折足”同，言颠倒也。本在下，而今反在上也。否泰乃上下相综之卦，泰阴上阳下，泰终则复隍，阳反在上而否矣。否阳上阴下，否终则倾倒，阴反在上而泰矣，此“倾”字之意也。“复隍”“复”字应“无往不复”“复”字。“倾否”“倾”字应“无平不陂”“陂”字。“陂”者，倾邪也。周公爻辞，其精极矣。变兑成悦，喜之象也。\n上九以阳刚之才，居否之终，倾时之否，乃其优为者，故其占为“先否后喜”。\n《象》曰：否终则倾，何可长也？\n言无久否之理。","13":"同人亲也\n“同人”者，与人同也。天在上，火性炎上，上与天同，“同人”之象也。二五皆居正位，以中正相同，“同人”之义也。又一阴而五阳欲同之，亦“同人”也。《序卦》：“物不可以终否，故受之以同人。”所以次否。\n同人于野，亨，利涉大川，利君子贞。\n彖辞明。\n《彖》曰：同人，柔得位得中而应乎乾，曰“同人”。同人曰：“同人于野，亨，利涉大川”，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。\n以卦综释卦名，以卦德、卦体释卦辞。同人、大有二卦同体，文王综为一卦，故《杂卦》曰：“大有众也，同人亲也。”“柔得位得中”者，八卦正位，离在二，今大有上卦之离，来居同人之下卦，则不惟得八卦之正位，又得其中，而应乾九五之中正者也。下与上相同，故名“同人”。卦辞“同人于野”者，六二应乎乾，乾在外卦，乃野外也，故曰“于野”。“乾行”指“利涉大川”一句。盖乾刚健中正，且居九五之位，有德有位，故可以济险难，“同人于野”。虽六二得位得中所能同，至于济险难，则非六二阴柔所能也，故曰“乾行”，犹言乾之能事也。本卦错师，有震木坎水象，所以“利涉大川”。曰“乾行”者，不言象而言理也。内文明，则能察于理。外刚健，则能勇于义。中正，则内无人欲之私。应乾，则外合天德之公。“文明以健”，以德言。“中正而应”，以爻言。此四者，皆君子之正道也。惟君子能通天下之志者，君子即正也。“同人于野”者，六二也。“利涉大川”者，乾也。“君子贞”则总六二、九五言之。\n六二应乎九五之乾，固名“同人”矣。然同人卦辞乃曰“同人于野，亨，利涉大川”，何也？盖六二应乾固亨矣。至于“利涉大川”，非六二也，乃乾也。曰“利君子贞”者，何也？盖内外卦皆君子之正，所以利君子正，天下之理，正而已矣。人同此心，心同此理，亿兆之众志虽不同，惟此正理方可通之，方可大同人心。若私邪不正，安能有于野之亨，而利涉哉？此所以“利君子贞”也。\n《象》曰：天与火，同人。君子以类族辨物。\n“类族”者，于其族而类之。“辨物”者，于其物而辨之。如是则同轨、同伦，道德可一，风俗可同，亦如天与火不同而同也。凡《大象》皆有功夫，故曰“君子以”。“以”者，用也。若以“类族”为人，士为士族，农为农族，以“辨物”为物，蜾为蜾物，羽为羽物，则“君子以”三字无安顿而托空矣。\n初九：同人于门，无咎。\n变艮“为门”，门之象也。“于门”者，谓于门外也。门外虽非野之可比，然亦在外，则所同者广而无私昵矣。\n初九以刚正居下，当同人之初，而上无系应，故有“同人于门”之象。占者如是，则无咎也。\n《象》曰：出门同人，又谁咎也？\n“谁”对二、三、四、五而言也。宗之吝也，戎之伏也，墉之乘，师之遇也，皆咎也。初同于门，即欲咎之，又谁得而咎之。\n所同者广，而无偏党之私，又谁有咎我者？\n六二：同人于宗，吝。\n凡离变乾而应乎阳者，皆谓之“宗”。盖乾乃六十四卦阳爻之祖，有祖则有宗，故所应者为宗。若原是乾卦，则本然之祖，见阳不言宗。惟新变之乾，则新成祖矣，所以见阳言宗也，故睽卦六五亦曰“宗”。统论一卦，则二五中正相应，所以“亨”；若论二之一爻，则是阴欲同乎阳矣，所以可“羞”。如履卦彖辞“履帝位而不疚”，至本爻则“贞厉”，皆此意。\n同人贵无私。六二中正，所应之五亦中正，然卦取同人，阴欲同乎阳，臣妾顺从之道也，溺于私而非公矣，岂不羞？故其象占如此。\n《象》曰：“同人于宗”，吝道也。\n阴欲同乎阳，所私在一人，可羞之道也。\n九三：伏戎于莽，升其高陵，三岁不兴。\n离错坎，为“隐伏”，伏之象也。中爻巽，为“入”，亦伏之象也。离为“戈兵”，戎之象也。“莽”，草也，中爻巽，为“阴木”，草之象也。中爻巽，为“股”，三变为震足，股足齐动，升之象也。巽为“高”，高之象也。三变中爻艮，“陵”之象也。离居三，“三”之象也。“兴”，发也。“伏戎于莽”者，俟其五之兵也。“升其高陵”者，窥其二之动也。对五而言，三在五之下，故曰“伏”。对二而言，三在二之上，故曰“升”。\n九三刚而不中，上无应与，欲同于二，而二乃五之正应，恐九五之见攻，故伏兵于草，升高盻望，将以敌五而攘二。然以理言，二非正应，理不直。以势言，五居尊位，势不敌。故至“三年”之久，而终不发。其象如此，以其未发，故占者不言“凶”。\n《象》曰：“伏戎于莽”，敌刚也。“三岁不兴”，安行也？\n所敌者既刚且正，故伏藏。“三岁不兴”者，以理与势俱屈，故不能行。盖“行”者即兴动而行也，“安”者，安于理势而不兴也。故曰“安行”。“安行”即四“困则”之意。\n九四：乘其墉，弗克攻，吉。\n“墉”，墙也。离中虚外围，“墉”之象也。解卦上六变离，亦曰“墉”。泰卦上六变艮，大象离曰城，皆以中空外围也。此则九三为六二之“墉”。九四在上，故曰“乘”。三四皆争夺，非同人矣，故不言“同人”。三恶五之亲二，故有犯上之心。四恶二之比三，故有陵下之志。\n四不中正，当同人之时无应与，亦欲同于六三。三为二之“墉”，故有乘墉攻二之象。然以刚居柔，故又有自反而“弗克攻”之象。能如是，则能改过矣，故占者“吉”。\n《象》曰：“乘其墉”，义弗克也。其吉，则困而反则也。\n“义”者，理也。“则”者，理之法则也。义理不可移易，故谓之“则”。“困”者，困穷也，即“困而知之”之困也。四刚强，本欲攻二，然其志柔，又思二乃五之正应，义不可攻。欲攻不可攻，二者交战，往来于此心，故曰“困”。若知其不可攻，则此心不困矣。言“乘其墉”矣，岂其力之不足哉？特以义不可同，故“弗克攻”耳。其“吉”者，则因困于心，而反于义理之法则也。因困则改过矣，故“吉”。“义弗克”，正理也。“困而反则”，九四功夫也。\n九五：同人先号咷，而后笑。大师克相遇。\n号，平声。\n火无定体，曰“鼓缶而歌”，而“嗟”，“出涕沱若”。中孚象离，曰“或泣或歌”。九五又变离，故有此象。“先号咷后笑”者，本卦六爻未变，离错坎为加忧，九五隔于三四，故忧而号咷。及九五变，则中爻为兑悦，故“后笑”。旅“先笑后号咷”者，本卦未变，中爻兑悦，故“先笑”；及上九变，则悦体震动成小过，“灾眚”之凶矣，故“后号咷”。必用“大师”者，三伏莽、四乘墉，非“大师”岂能克？此爻变离，中爻错震，戈兵震动，师之象也。九五阳刚之君，阳大阴小，大师之象也。且本卦错师，亦有师象。\n九五、六二以刚柔中正相应，本同心者也。但为三、四强暴所隔，虽同矣，不得遽与之同。故有未同时不胜号咷，既同后不胜喜笑之象。故圣人教占者曰：君臣大分也。以臣隔君，大逆也。当此之时，为君者宜兴大师克乎强暴后，方遇乎正应而后可。若号咷，则失其君之威矣。故教占者，占中之象又如此。\n《象》曰：同人之先，以中直也。“大师”相遇，言相克也。\n“先”者，“先号咷”也。“以”者，因也。“中直”与困卦九五中直同，即“中正”也。言九五所以“先号咷”者，以中正相应，必欲同之也。“相克”者，九五克三、四也。\n刘穆之为葛长民所制，刘裕必杀葛长民也。\n上九：同人于郊，无悔。\n乾“为郊”，郊之象也，详见需卦。国外曰“郊”，郊外曰“野”，皆旷远之地。但“同人于野”，以卦之全体而言，言大同则能亨也，故“于野”取旷远大同之象，此爻则取旷远无所与同之象，各有所取也。\n上九居同人之终，又无应与，则无人可同矣，故有“同人于郊”之象。既无所同，则亦无所悔，故其占如此。\n《象》曰：“同人于郊”，志未得也。\n无人可同，则不能通天下之志矣。“志未得”，正与通天下之志相反。","14":"大有众也\n“大有”者，所有之大也。火在天上，万物毕照，所照皆其所有，大有之象也。一柔居尊，众阳并从，诸爻皆六五之所有，大有之义也。《序卦》：“与人同者，物必归焉，故受之以大有。”所以次同人。\n大有：元亨。\n彖辞明。\n《彖》曰：大有，柔得尊位大中，而上下应之，曰“大有”。其德刚健而文明，应乎天而时行，是以“元亨”。\n以卦综释卦名，以卦德、卦体释卦辞。大有综同人。“柔得尊位而大中”者，同人下卦之离往于大有之上卦，得五之尊位，居大有之中，而上下五阳皆从之也。上下从之，则五阳皆其所有矣。阳大阴小，所有者皆阳，故曰“大有”。内刚健则克胜其私，自诚而明也。外文明则灼见其理，自明而诚也。上下应之者，众阳应乎六五也。应天时行者，六五应乎九二也。“时”者，当其可之谓。“天”即理也。天之道不外时而已。“应天时行”，如天命有德、天讨有罪，皆应天而时用之是也。乾“为天”，因“应乾”，故发此句。“时行”即应天之实，非“时行”之外别有应天也。“刚健文明”者德之体，“应天时行”者德之用，有是德之体用，则能享其大有矣，是以“元亨”。\n《象》曰：火在天上，大有。君子以遏恶扬善，顺天休命。\n火在天上，无所不照，则善恶毕照矣。“遏恶”者，五刑五用是也。“扬善”者，五服五章是也。休，美也。天命之性有善无恶，故“遏恶扬善”者，正所以顺天之美命也。\n当大有时，宜旌别淑慝也。\n初九：无交害，匪咎，艰则无咎。\n“害”者，害我之大有也。离为“戈兵”，应爻戈兵在前，恶人伤害之象也。故睽卦离在前亦曰“见恶人”。夬乃同体之卦，二爻变离，亦曰“莫夜有戎”。初居下位，以凡民而大有，家肥屋润，人岂无害之理？离火克乾金，其受害也必矣。“无交害”者，去离尚远，未交离之境也。九三交离境，故曰“小人害”也。九三“害”字从此“害”字来。“匪咎”者，人来害我，非我之咎也。“艰”者，艰难以保其大有，如夬之“惕号”也。\n初九居卑，当大有之初，应爻离火，必有害我之乾金者。然阳刚得正，去离尚远，故有“无交害，匪咎”之象。然或以“匪咎”而以易心处之，则必受其害矣。惟“艰”则可保其大有而“无咎”也。故又教占者以此。\n《象》曰：大有初九，无交害也。\n时大有而当其初，所以去离远而“无交害”。\n九二：大车以载，有攸往，无咎。\n乾错坤，为“大舆”，“大车”之象也。阳上行之物，车行之象也。“以”者，用也，用之以载也。变离错坎，坎中满，“以载”之象也。大车以载之重，九二能任重之象也。二变中爻成巽，巽为股，巽错震为足，股足震动，“有攸往”之象也。\n九二当大有之时，中德蓄积，充实富有，乃应六五之交孚，故有“大车以载”之象。有所往而如是，则可以负荷其任，佐六五虚中之君，共济大有之盛，而“无咎”矣。故其占如此。\n《象》曰：“大车以载”，积中不败也。\n乾三连，阳多之卦皆曰“积”，积聚之意。小畜、夬皆五阳一阴，同体之卦，故小畜曰“积德载”，此曰“以载”。而又曰“积中”者，言积阳德而居中也，则小畜之“积德载”愈明矣。夬九二《小象》曰“得中道”也，小畜九二《小象》曰“牵复在中”，皆此中之意。“败”字在车上来，乾金遇离火，必受克而败坏。故初曰“无交害”，三曰“小人害”，则“败”字虽从车上来，亦“害”字之意。曰“中德”，所以不败坏也。曰“积中不败”，则离火不烧金。六五“厥孚交如”，与九二共济大有之太平矣。\n九三：公用亨于天子，小人弗克。\n亨，《程传》如字，《本义》读享。\n三居下卦之上，故曰“公”。五虽阴爻，然居天位，三非正应，故称“天子”。“亨”者，阳刚居正，不以大有自私，亨之象也。卦本元亨，故曰“亨”。“用亨于天子”者，欲出而有为，以亨六五大有之治也。九二中德，止曰“大车以载”，不言“亨于天子”，而九三反欲“亨于天子”，何也？盖九三才刚志刚，所以用亨天子也。同人大有相综之卦，同人三四皆欲同乎二，所以大有二、三皆欲共济五之大有也。小人指四也。“弗克”者，不能也。三欲亨于天子，四持戈兵阻而害之，因此小人所以弗克亨于天子也。盖大有之四，即同人之三，四持戈兵即三之“伏戎”也。且三变为睽，“舆曳”、“牛掣”，即小人之阻不得用亨也。旧注作“享”者非。“用亨天子”，犹言出而使天子亨，大有之“亨”也。\n九三当大有之时，亦欲济亨通之会，亨于天子，而共保大有之治者也。但当离乾交会之间，金受火制，小人在前，不能遽达，故有“弗克亨于天子”之象。占者得此，不当如九二之“有攸往”也，可知矣。\n《象》曰：“公用亨于天子”，小人害也。\n因“小人害”，所以“弗克亨于天子”。周公之“无交害”者，初之远于四也；孔子之“小人害”者，三之近于四也。\n九四：匪其彭，无咎。\n彭，音旁。\n“彭”，鼓声，又盛也，言声势之盛也。四变中爻为震，震为“鼓”，彭之象也。变艮，止其盛之象也。\n九四居大有之时，时过中矣，乃大有之极盛者也。近君岂可极盛？然以刚居柔，故有不极其声势之盛之象，“无咎”之道也。故其占如此。\n伊之罔居成功，周公吐握是也，梁冀则不明矣。\n《象》曰：“匪其彭，无咎”，明辨晳也。\n晳，音析。\n“晳”，明貌，晳然其明辨也。“离”，明之象也。“明辨”者，辨其所居之地，乃别嫌多惧之地；辨其所遇之时，乃盛极将衰之时也。\n六五：厥孚交如，威如，吉。\n“威如”者，恭己无为，特有人君之威而已。因六五其体文明，其德中顺，又有阳刚群贤辅之，即舜之无为而治矣，所以有此象。\n六五当大有之世，文明中顺以居尊位，虚己诚信以任九二之贤。不惟九二有孚于五，而上下之阳亦皆以诚信归之。是其孚信之交，无一毫之伪者也。是以为六五者，赖群贤以辅治，惟威如而已。此则不言而信，不怒而民威于钺，盖享大有太平之福者也。何吉如之！故其象占如此。\n《象》曰：“厥孚交如”，信以发志也。“威如”之吉，易而无备也。\n诚能动物，一人之信，足以发上下相信之志也。“易而无备”者，如“厥孚交如”矣。惟平易而不防备，则任贤勿贰，去邪勿疑，方可享无为之治矣。“威如”即“恭己”，“易而无备”即“无为”。若依旧注作戒辞，则《小象》止当曰“威如则吉”，不应曰“威如之吉”也。\n“易而无备”，明非尊严也。事尊严，将不为隋炀乎？\n上九：自天佑之，吉无不利。\n上九以刚明之德，当大有之盛。既有崇高之富贵，而下有六五柔顺之君，刚明之群贤辅之，上九盖无所作为，惟享自天佑助之福，吉而“无不利”者也。占者有是德，居是位，斯应是占矣。\n《象》曰：大有上吉，自天佑也。\n言皆天之佑助，人不可得而为也。上居天位，故曰“天”。此爻止有“天佑”之意，若《系辞》，又别发未尽之意也。如“公用射隼”，止有“解悖”之意，若成器而动，又未尽之意也。言各不同，皆发未尽之意。旧注泥于《系辞》者非。","15":"谦轻\n“谦”者，有而不居之义。山之高，乃屈而居地之下，谦之象也。止于其内而收敛不伐，顺乎其外而卑以下人，谦之义也。《序卦》：“有大者不可以盈，故受之以谦。”故次大有。\n谦：亨，君子有终。\n“君子”，三也。详见乾卦。三爻艮终万物，故曰有终。彖辞明。\n《彖》曰：谦，亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。\n上，时掌反。\n“济”者，施也。天位乎上，而气则施于下也。“光明”者，生成万物，化育昭著而不可掩也。“卑”者，地位乎下也。“上行”者，地气上行，而交乎天也。天尊而下济，谦也，而光明则亨矣。地卑谦也，而上行则亨矣。此言谦之必亨也。“亏盈”、“益谦”以气言。“变盈”、“流谦”以形言。“变”者，倾坏。“流”者，流注卑下之地而增高也。“害盈”、“福谦”以理言。“恶盈”、“好谦”以情言。此四句统言天地、鬼神、人三才皆好其谦，见谦之所以亨也。“逾”者，过也，言不可及也。尊者有功有德，谦而不居，愈见其不可及，亦如天之光明也。卑者有功有德，谦而不居，愈见其不可及，亦如地之上行也。夫以尊卑之谦，皆自屈于其始，而光不可逾，皆自伸于其终，此“君子”之所以“有终”也。\n《象》曰：地中有山，谦。君子以裒多益寡，称物平施。\n裒，步尤切。\n上下五阴，“地”之象也。一阳居中，“地中有山”之象也。五阴之多，人欲也。一阳之寡，天理也。君子观此象，裒其人欲之多，益其天理之寡，则廓然大公。物来顺应，物物皆天理，自可以“称物平施”，无所处而不当矣。“裒”者，减也。\n初六：谦谦君子，用涉大川，吉。\n凡《易》中有此象，而无此事、无此理者，于此爻“涉大川”见之，盖“金车”、“玉铉”之类也。周公立爻辞，止因中爻震木在坎水之上，故有此句。而今就文依理，只得说能谦，险亦可济也。\n“六”柔，谦德也。“初”，卑位也。以谦德而居卑位，谦而又谦也。君子有此谦德，以之济险亦吉矣。故占者“用涉大川，吉”。\n《象》曰：“谦谦君子”，卑以自牧也。\n“牧”，养也。“谦谦”而成“其君子”，何哉？盖九三“劳谦君子”，万民所归服者也。二并上与三俱“鸣”其“谦”，四则裂其“谦”，五因“谦”而“利侵伐”，初居谦之下，位已卑矣，何所作为哉？惟自养其谦德而已。\n六二：鸣谦，贞吉。\n本卦与小过同有“飞鸟遗音”之象，故曰“鸣”。豫卦亦有小过之象，亦曰“鸣”，又中爻震为“善鸣”。“鸣”者，阳唱而阴和也。荀《九家》以“阴阳相应，故鸣”，得之矣。故中孚错小过。九二曰“鸣鹤在阴”，又曰“翰音登于天”，皆有鸣之意。“鹤鸣”《小象》曰“中心愿”也，此曰“中心得”也，言二与三中心相得，所以相唱和而鸣也。若旧注以谦有闻，则非“鸣谦”，乃“谦鸣”矣。若《传》以德充积于中，见于声音，则上六“鸣谦”其志未得，与“鸣豫”之凶，皆说不去矣。\n六二柔顺中正，相比于三，三盖“劳谦君子”也。三谦而二和之，与之相从，故有“鸣谦”之象，正而且吉者也。故其占如此。\n《象》曰：“鸣谦，贞吉”，中心得也。\n言六二与三“中心相得”，非勉强唱和也。\n九三：劳谦君子，有终吉。\n“劳”者，勤也，即“劳之来之”之“劳”。中爻坎为“劳卦”，虽《系辞》去声读，然同此“劳”字也。又中爻水，水有井象。君子以“劳民劝相”，此“劳”字之象也。艮“终万物”，三居艮之终，故以文王卦辞“君子有终”归之。八卦正位，艮在三，所以此爻极善。“有终”即万民服。旧注因《系辞》有功而不德句，遂以为功劳，殊不知劳乎民后方有功，此爻止有劳而不伐意，故“万民服”。\n九三当谦之时，以一阳而居五阴之中，阳刚得正，盖能劳乎民而谦者也。然虽不伐其劳，而终不能掩其劳，万民归服，岂不“有终”？故占者吉。\n《象》曰：“劳谦君子”，万民服也。\n阴为民，五阴故曰“万民”。众阴归之，故曰“服”。\n六四：无不利，谦。\n“”者，裂也，两开之意。六四当上下之际，开裂之象也。“谦”者，以为谦也。凡一阳五阴之卦，其阳不论位之当否，皆尊其阳而卑其阴。如复之“元吉”，师之“锡命”，豫之“大有得”，比之“显比”，剥之“得舆”，皆尊其阳不论其位也。六四才位皆阴，九三劳谦之贤，正万民归服之时，故开裂退避而去，非旧注“更当发挥其谦”也。\n六四当谦之时，柔而得正，能谦者也，故“无不利”矣。但“劳谦”之贤在下，不敢当阳之承，乃避三而去之，故有以为谦之象。占者能此，可谓不违阴阳之则者矣。\n《象》曰：“无不利，谦”，不违则也。\n则者，阳尊阴卑之法则也。而去之，不违尊卑之则矣。\n六五：不富以其邻，利用侵伐，无不利。\n阳称“富”，小畜五阳，故《小象》曰“不独富”也。阴皆“不富”，故泰六四亦曰“不富”。“富”与“邻”皆指三。“以”者，用也。中爻震为长子，三非正应，故称“邻”。言不用富厚之力，但用“长子帅师”，而自“利用侵伐”也。坤为“众”，中爻震，此爻变离为“戈兵”，众动戈兵，侵伐之象。此象亦同初六“用涉大川”，但此则以变爻言也。上六“利用行师”，亦此象。\n五以柔居尊，在上而能谦者也。上能谦，则从之者众矣，故有“不富以邻”而自“利用侵伐”之象。然“用侵伐”者，因其不服而已，若他事亦无不利也。占者有此谦德，斯应是占矣。\n《象》曰：“利用侵伐”，征不服也。\n侵伐非黩武，以其不服，不得已而征之也。\n上六：鸣谦，利用行师，征邑国。\n凡《易》中言“邑国”者，皆“坤上”也。升卦坤在外，故曰“升虚邑”。晋卦坤在内，故曰“维用伐邑”。泰之上六曰“自邑告命”。师上六曰“开国承家”。复之上六曰“以其国君凶”。讼九二变坤曰“邑人三百户”。益之中爻坤曰“为依迁国”。夬下体错坤曰“告自邑”。涣九五变坤曰“涣王居”。此曰“征邑国”，皆因“坤土”也。\n上六当谦之终，与三为正应，见三之劳谦，亦相从而和之，故亦有“鸣谦”之象。然六二中正，既与三中心相得，结亲比之好，则三之心志不在上六，而“不相得”矣，故止可为将行师“征邑国”而已，岂能与“劳谦君子”之贤相为唱和其谦哉！\n《象》曰：“鸣谦”，志未得也。可用“行师”，“征邑国”也。\n“志未得”者，上六与九三心志不相得也。六二与上六皆“鸣谦”，然六二“中心得”，上六“志未得”，所以六二“贞吉”，而上六止“利用行师”也。","16":"豫怠\n“豫”者，和乐也。阳始潜闭于地中，及其动而出地，奋发其声，通畅和豫，豫之象也。内顺外动，豫之由也。《序卦》：“有大而能谦，必豫，故受之以豫。”所以次谦。\n豫：利建侯行师。\n震“长子”，主器，震惊百里，“建侯”之象。中爻坎陷，一阳统众阴，“行师”之象也。屯有震无坤，则言“建侯”。谦有坤无震，则言“行师”。此震坤合，故兼言也。\n《彖》曰：豫，刚应而志行，顺以动豫。豫顺以动，故天地如之，而况“建侯行师”乎？天地以顺动，故日月不过，而四时不忒。圣人以顺动，则刑罚清而民服。豫之时义大矣哉！\n以卦体、卦德释卦名、卦辞而极言之。“刚”，九四也。“刚应”者，一阳而众阴从之也。“志行”者，阳之志得行也。“刚应志行”，豫也。内顺外动，所以成其豫也，故名“豫”。凡事合乎天理则顺，背乎天理则逆。“顺以动”，则一念一事皆天理矣。“天地如之”者，言天地亦不过如我之顺动也。天地且不之违，而况于人之“建侯行师”乎！此其所以利也。“天地以顺动”者，顺其自然之气。“圣人以顺动”者，顺其当然之理。“不过”者，不差过也。“不忒”者，不愆忒也。刑罚不合乎理，惟乘一人喜怒之私，故民不服。若顺动则合乎天理之公，纵有刑罚，亦天刑也，故“民服”。“时义”者，豫中事理之时宜也，即顺动也。此极言而赞之也。六十四卦，时而已矣。事若浅而有深意，曰“时义大矣哉”，欲人思之也。非美事有时或用之，曰“时用大矣哉”，欲人则之也。大事大变，曰“时大矣哉”，欲人谨之也。\n《象》曰：雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。\n“奋”者，奋发而成声也。“作”，乃制礼作乐之作。“作乐”以“崇德”，故闻乐知德。“殷”，盛也。“作乐”乃朝廷邦国之常典，各有所主，其乐不同。惟万物本乎天，故有郊。人本乎祖，故有庙，是其用乐之最大者，故曰“殷荐”。故冬至祀上帝于圜丘，而配之以祖，必以是乐荐之。季秋祀上帝于明堂，而配之以考，必以是乐荐之也。中爻坎为乐律，“乐”之象。五阴而崇一阳德，“崇德”之象。帝出于震，“上帝”之象。中爻艮为门阙，坎为“隐伏”，宗庙祖宗之象。\n初六：鸣豫，凶。\n“鸣”详见“鸣谦”。谦、豫二卦同体，文王综为一卦，故《杂卦》曰：“谦轻而豫怠也。”谦之上六即豫之初六，故二爻皆言“鸣”。震性动又决躁，所以“浚恒凶”、“飞鸟凶”。\n初六与九四为正应，九四“由豫”，初据其应与之常，欲相从乎四而和之，故有“鸣豫”之象。然初位卑，四近君，乃权臣也，正其志大行之时。上下既悬绝，且初又不中正，应与之情乖矣，岂能与四彼此唱和？其豫不能唱和，初之志穷矣，凶之道也。故占者凶。\n《象》曰：初六“鸣豫”，志穷凶也。\n惟“志穷”，所以“凶”。中孚“鹤鸣子和”曰“中心愿也”，六二“鸣谦”曰“中心得也”，此心志相孚者也。上六“鸣谦”曰“志未得也”，初六“鸣豫”曰“志穷凶也”，此心志不相孚者也。相孚者皆曰“心”，不相孚者皆曰“志”，此所以为圣人之言。\n六二：介于石，不终日，贞吉。\n凡物分为两间者曰“介”。二变刚，分坤为两间，介之象也。“介于石”者，言操守之坚如石不可移易。中爻艮，石之象也。“不终日”者，不溺于豫，见几而作，不待其日之晚也。二变中爻离，且居下卦之上，“不终日”之象也。八卦正位，坤在二，故“贞吉”。\n豫易以溺人，诸爻皆溺于豫，独六二中正自守，安静坚确，故有此象。正而且吉之道也。故其占如此。\n《象》曰：“不终日，贞吉”，以中正也。\n惟中正，故“不终日，贞吉”。\n六三：盱豫悔，迟有悔。\n“盱”者，张目也。中爻错离，目之象也。盱目以为豫者，九四当权，三与亲比，幸其权势之足凭，而自纵其所欲也。“盱”与“介”相反，“迟”与“不终日”相反，二中正，三不中正故也。\n四为豫之主，六三阴柔，不中不正而近于四，上视于四而溺于豫，宜有悔者也，故有此象。而其占为事当速悔，若悔之迟，则过而不改，是谓过矣。此圣人为占者开迁善之门，而勉之以速改也。\n《象》曰：“盱豫”“有悔”，位不当也。\n六三不中不正，故“位不当”。\n九四：由豫，大有得。勿疑，朋盍簪。\n“由豫”者，言人心之和豫，由四而致也。本卦一阳为动之主，动而众阴悦从，故曰“由豫”。“大有得”者，言得大行其志，以致天下之豫也。四多疑惧，故曰“疑”。又中爻坎亦为“狐疑”。“勿疑”者，中爻艮止，止而不疑之象也。因九四才刚明，故教之以“勿疑”也。“盍”者，合也。“簪”者，首笄也，妇人冠上之饰，所以总聚其发者也。下坤，妇人之象也。一阳横于三阴之首，“簪”之象也。“勿疑，朋盍簪”者，勿疑朋合于我者，皆簪冠之妇人也。\n九四一阳居五阴之中，人所由以为豫，故有“由豫”之象。占者遇此，故为“大有得”。然人既乐从，正当得志之时，必展其大行之志，俾人人皆享其和平豫大之福。“勿疑”“由豫”于我者，无同德之阳明，而所以朋合于上下内外者，皆阴柔之群小可也。故又教占者必不可疑如此。\n《象》曰：“由豫，大有得”，志大行也。\n刚应而无他爻以分其权，故曰“志大行”。\n六五：贞疾，恒不死。\n中爻为坎，坎为心病，疾之象也。曰“贞疾”者，言非假疾，疾之在外而可以药石者也。九四“由豫”，人心通归于四，危之极矣。下卦坤“为腹”，九四居卦之中为心，即咸卦“憧憧往来”之爻也。此正腹中心疾，故谓之“贞疾”。“恒”者，常也，言“贞疾”而常不死也。周室衰微，此爻近之。\n六五当豫之时，柔不能立，而又乘九四之刚，权之所主，众之所归，皆在于四，衰弱极矣。故有“贞疾”之象。然以其得中，故又有“恒不死”之象。即象而占可知矣。\n《象》曰：六五“贞疾”，乘刚也。“恒不死”，中未亡也。\n虽乘四为刚所逼，然柔而得中，犹存虚位不死。\n上六：冥豫，成有渝，无咎。\n“冥”者，幽也，暗也。上六以阴柔居豫极，为昏冥于豫之象。“成”者，五阴同豫，至上六已成矣。然以动体变刚成离，则前之“冥冥”者，今反昭昭矣，故又为其事虽成，然乐极哀生，不免有悔心之萌，而能改变之象。占者如是，则能补过矣，故“无咎”。\n《象》曰：“冥豫”在上，何可长也？\n豫已极矣，宜当速改，何可长溺于豫而不返也？","17":"随无故也\n随者，从也。少女随长男，随之象也。曰随综蛊，以艮下而为震，以巽上而为兑，随之义也。此动彼悦，亦随之义也。《序卦》：“豫必有随，故受之以随。”所以次豫。\n随：元亨，利贞，无咎。\n“随元亨”，然动而悦，易至于诡随，故必利于贞，方得“无咎”。若所随不贞，则虽大亨亦有咎矣。不可依穆姜作“四德”。\n《彖》曰：随，刚来而下柔，动而说，随。大亨贞无咎，而天下随时。随时之义大矣哉！\n以卦综、卦德释卦名，又释卦辞而赞之。“刚来而下柔”者，随、蛊二卦同体，文王综为一卦，故《杂卦》曰：“随无故也，蛊则饬也。”言蛊下卦原是柔，今艮刚来居于下而为震，是刚来而下于柔也。“动而悦”者，下动而上悦也。“时”者，正而当其可也。言“大亨贞”而“无咎”者，以其时也。“时”者，随其理之所在。理在于上之随下则随其下，理在于下之随上则随其上，泰则随其时之泰，否则随其时之否。惟其时则通变宜民，邦家无怨，近悦远来，故“天下随时”。故即赞之曰：“随时之义大矣哉！”此与艮卦“时”字同，不可依王肃本“时”字作“之”字。观尾句不曰“随之时义”，而曰“随时之义”，文意自见。\n《象》曰：泽中有雷，随。君子以嚮晦入宴息。\n嚮与“向”同。“晦”者，日没而昏也。“宴息”者，宴安休息，即日入而息也。“雷”二月出地，八月入地。造化之理，有昼必有夜，有明必有晦，故人生天地，有出必有入，有作必有息。其在人心，有感必有寂，有动必有静，此造化之自然，亦人事之当然也。故“雷在地上”则作乐荐帝，“雷在地中”则闭关不省方，“雷在泽下”则向晦宴息，无非所以法天也。震，东方卦也，日出旸谷。兑，西方卦也，日入昧谷。八月正兑之时，雷藏于泽，此“向晦”之象也。泽亦是地，不可执泥“泽”字。中爻巽为入，艮为止，入而止，息之象也。\n初九：官有渝，贞吉。出门交有功。\n随卦初随二，二随三，三随四，四随五，五随六，不论应与。“官”者，主也。震长子主器，官象也。“渝”者，变而随乎二也。初为震主，性变动，“渝”之象也。故讼卦四变，中爻为震，亦曰“渝”。中爻艮，门之象也。二与四同功，二多誉，功之象也，故九四《小象》亦曰“功”。\n初九阳刚得正，当随之时，变而随乎其二。二居中得正，不失其所随矣，从正而吉者也。故占者“贞吉”。然其所以“贞吉”者，何哉？盖方出门，随人之始，即交有功之人，何“贞吉”如之！故又言所以“贞吉”之故。\n《象》曰：“官有渝”，从正吉也。“出门交有功”，不失也。\n二中正，所以“从正吉”。“交有功”，则不失其所随矣。旧注不知八卦正位，震在初，乃极美之爻，所以通作戒辞看。\n六二：系小子，失丈夫。\n中爻巽为绳，系之象也。阴爻称“小子”，阳爻称“丈夫”，阳大阴小之意。“小子”者，三也；“丈夫”者，初也。\n六二中正，当随之时，义当随乎其三。然三不正，初得正，故有“系小子失丈夫”之象。不言“凶咎”者，二中正，所随之时不能兼与也。\n《象》曰：“系小子”，弗兼与也。\n既随乎三，不能兼乎其初。\n六三：系丈夫，失小子。随有求，得，利居贞。\n“丈夫”者，九四也。小子者，六二也。“得”者，四近君为大臣，求乎其贵可以得其贵也。中爻巽“近市利三倍”，求乎其富可以得其富也。\n六三当随之时，义当随乎其四。然四不中正，六二中正，故有“系丈夫失小子”之象。若有所求，必有所得，但利乎其正耳。三不中正，故又戒占者以此。\n《象》曰：“系丈夫”，志舍下也。\n舍，音捨。\n时当从四，故心志舍乎下之二也。\n九四：随有获，贞凶。有孚在道，以明何咎。\n“有获”者，得天下之心随于己也。四近君为大臣，大臣之道，当使恩威一出于上，众心皆随于君。若人心随己，危疑之道也，故“凶”。“孚”以心言，内有孚信之心也。道以事言，凡事合乎道理也。“明”者，识保身之几也。“有”字、“在”字、“以”字，虽字义稍异，然皆有功夫。若以象论，变坎，“有孚”之象也。震为大涂，“道”之象也。变坎错离，“明”之象也。又中爻艮有光辉，亦“明”之象也。\n四当随之时，义当随乎其五。然四为大臣，虽“随有获”而势凌于五，故有“有获贞凶”之象，所以占者凶。然当居此地之时，何以处此哉？惟诚以结之，而道以事之，明哲以保其身，则上安而下随，即“无咎”而不凶矣。故又教占者以此。\n《象》曰：“随有获”，其义凶也。“有孚在道”，明功也。\n“义凶”者，有凶之理也。“有孚在道明功”者，言“有孚在道”皆明哲之功也。盖明哲则知心不可欺而内竭其诚，知事不可苟而外合于道，所以“无咎”也。周公爻辞三者并言，孔子象辞推原而归功于明。何以验人臣明哲为先？昔汉之萧何、韩信皆高帝功臣，信既求封齐，复求王楚，可谓“有获”矣，然无明哲，不知“有获贞凶”之义，卒及大祸。何则不然。帝在军中遣使劳何，何悉遣子弟从军，帝大悦。及击陈豨，遣使拜何相国，封五千户，何让不受，悉以家财佐军用，帝又悦，卒为汉第一功臣，身荣名显。若何者可谓知明功臣者矣。孔子明功之言不其验哉！\n九五：孚于嘉，吉。\n八卦正位，兑在六，乃爻之嘉美者。且上六归山，乃“嘉遁”矣，故曰“孚于嘉”。\n九五阳刚中正，当随之时，义当随乎其六，故有“孚嘉”之象，盖随之美者也。占者得此，吉可知矣。\n《象》曰：“孚于嘉，吉”，位正中也。\n惟中正，故“孚于嘉”。\n上六：拘系之，乃从维之。王用亨于西山。\n“系”即六二、六三之系。“维”亦系也。“系”之又“维”之，言系而又系也，《诗》“絷之维之，于焉嘉客”是也。言五孚于六，如此“系维”，其相随之心固结而不可解也。如七十子之随孔子，五百人之随田横，此爻足以当之。变乾，“王”之象也，指五也。兑居西，“西”之象也。兑错艮，“山”之象也。六不能随于世人，见九五维系之极，则必归之山矣。随、蛊相综，故蛊卦上九“不事王侯”，亦有归山之象。“亨”者，通也。“王用亨于西山”者，用通于西山以求之也。“亨西山”与谦卦“用涉大川”同，皆因有此象，正所谓无此事此理而有此象也。\n上六居随之终，无所随从，见九五相随之极，则遁而归山矣，故有此象，盖随之至者也。占者得此，吉可知矣。\n《象》曰：“拘系之”，上穷也。\n“上”者，六也。“穷”者，居卦之终，无所随也，非凶也。","18":"蛊则饬也\n“蛊”者，物久败坏而蛊生也。以卦德论，在上者止息而不动作，在下者巽顺而无违忤，彼此委靡因循，此其所以蛊也。《序卦》：“以喜随人者，必有事，故受之以蛊。”所以次随。\n蛊：元亨，利涉大川。先甲三日，后甲三日。\n“利涉大川”者，中爻震木在兑泽之上也。“先甲”、“后甲”者，本卦艮上巽下，文王圆图艮、巽夹震木于东之中，故曰“先甲”、“后甲”，言巽先于甲、艮后于甲也。巽卦言“先庚”、“后庚”者，伏羲圆图艮、巽夹坎水于西之中，故曰“先庚”、“后庚”，言巽先于庚、艮后于庚也。分“甲”于蛊者，本卦未变，上体中爻震木、下体巽木也。分“庚”于巽者，本卦未变，上体综兑金，下体综兑金也。十干独言“甲”、“庚”者，乾坤乃六十四卦之祖，甲居于寅，坤在上乾在下为泰；庚居于申，乾在上坤在下为否。“大往小来”，“小往大来”，天地之道不过如此。“物不可以终通”，“物不可以终否”，《易》之为道亦不过如此。所以独言“甲”、“庚”也。曰“先三”、“后三”者，六爻也。“先三”者，下三爻也，巽也；“后三”者，上三爻也，艮也。不曰“爻”而曰“日”者，本卦综随，日出震东，日没兑西，原有此象，故少不言一日二日，多不言九日十日，而独言“先三”、“后三”者，则知其为下三爻上三爻也明矣。以“先甲”用辛，取自新，“后甲”用丁，取丁宁，此说始乎郑玄，谬矣。\n当蛊之时，乱极必治，占者固元亨矣，然岂静以俟其治哉？必历涉艰难险阻，以拨乱反正。知其先之三爻乃巽之柔懦，所以成其蛊也，则因其柔懦，而矫之以刚果；知其后之三爻乃艮之止息，所以成其蛊也，则因其止息，而矫之以奋发，斯可以“元亨”，而天下治矣。\n《彖》曰：蛊，刚上而柔下，巽而止，蛊。蛊，“元亨”而天下治也。“利涉大川”，往有事也。“先甲三日，后甲三日”，终则有始，天行也。\n以卦综、卦德释卦名、卦辞。刚上而柔下者，蛊综随，随初震之刚上而为艮，上六兑之柔下而为巽也。刚上则太尊而情不下达，柔下则太卑而情难上通。巽则谄，止则惰，皆致蛊之由，所以名“蛊”。既“蛊”矣，而又“元亨”，何也？盖造化之与人事，穷则变矣。治必因乱，乱则将治。故蛊而乱之终，乃治之始也，如五胡之后生唐太宗、五季之末生宋太祖是也。治蛊者当斯时，则天下治矣，故占者“元亨”。“往有事”犹言往有“为”。方天下坏乱，当勇往以济难，若复巽懦止息，则终于蛊矣，岂能“元亨”？终始即先后。“成言乎艮”者，终也。“齐乎巽”者，始也。“终则有始”者，如昼之终矣，而又有夜之始，夜之终矣，而又有昼之始，故乱不终乱，乱之终乃其治之始。治乱相仍，乃天运之自然也。故治蛊者必原其始，必推其终，知其蛊之为始为先者乃巽也，则矫之以刚果；知其蛊之为终为后乃艮也，则矫之以奋发，则蛊治而元亨矣。恒卦上体震综艮，下体巽，故亦曰“终则有始”。\n《象》曰：山下有风，蛊。君子以振民育德。\n“山下有风”，则物坏而有事更新矣。“振民”者，鼓舞作兴，以振起之，使之日趋于善，非巽之柔弱也，此新民之事也。“育德”者，操存省察以涵育之，非艮之止息也，此明德之事也。当蛊之时，风俗颓败，由于民德之不新。民德不新，由于己德之不明。故救时之急在于“振民”，“振民”又在于“育德”，盖相因之辞也。\n初六：干父之蛊，有子，考无咎，厉终吉。\n艮止于上，犹父道之无为而尊于上也。巽顺于下，犹子道之服劳而顺于下也。故蛊多言“干父”之事。“干”者，木之茎干也。中爻震木，下体巽木，干之象也。木有干，方能附其繁茂之枝叶，人有才能，方能振作其既坠之家声，故曰“干蛊”。“有子”者，即《礼记》之“幸哉有子”也。\n初六当蛊之时，才柔志刚，故有能“干父蛊”之象。占者如是，则能克盖前愆，喜其今日之维新，忘其前日之废坠，因子而考，亦可以无咎矣。但谓之蛊，未免危厉，知其危厉，不以易心处之，则终得吉矣。因六柔，故又戒之以此。\n《象》曰：“干父之蛊”，意承考也。\n“意承考”者，心之志意，在于承当父事，克盖前愆，所以考无咎。\n九二：干母之蛊，不可贞。\n艮性止，止而又柔。止则惰，柔则暗。又当家事败坏之时，子欲干其蛊，若以我阳刚中直之性直遂干之，则不惟不堪，亦且难入，即伤恩矣，其害不小。惟当屈己下意，巽顺将承，使之身正事治，则亦已矣，故曰“不可贞”，“事父母几谏”是也。若以君臣论，周公之事成王，成王有过则挞伯禽，皆此意也。《易》之“时”，正在于此。\n九二当蛊之时，上应六五。六五阴柔，故有“干母蛊”之象。然九二刚中，以刚承柔，恐其过于直遂也，故戒占者不可贞，委曲巽顺以干之可也。\n《象》曰：“干母之蛊”，得中道也。\n得中道而不太过，即“不可贞”也。\n九三：干父之蛊，小有悔，无大咎。\n悔以心言。“悔”者，因九三过刚，则干蛊之事，更张措置之间，未免先后缓急失其次序，所以“悔”也。“咎”以理言。然巽体得正，能制其刚，则其干蛊必非私意妄行矣，所以“无大咎”。\n九三以阳刚之才，能“干父之蛊”者，故有干蛊之象。然过刚自用，其心不免“小有悔”，但为父干蛊，其咎亦不大矣，故其占如此。\n《象》曰：“干父之蛊”，终无咎也。\n有阳刚之才方能干蛊，故周公仅许之，而孔子深许之也。\n六四：裕父之蛊，往见吝。\n“裕”，宽裕也。强以立事为干，怠而委事为裕，正干之反也。“往”者，以此而往治其蛊也。“见吝”者，立见其羞吝也。治蛊如拯溺救焚，犹恐缓不及事，岂可裕？\n六四以阴居阴，又当艮止，柔而且怠，不能有为，故有“裕蛊”之象。如是则蛊将日深，故往则见吝。戒占者不可如是也。\n《象》曰：“裕父之蛊”，往未得也。\n“未得”者，未得治其蛊也。九三之刚失之过，故“悔”；悔者渐趋于吉，故“终无咎”。六四之柔失之不及，故“吝”；吝者渐趋于凶，故“往未得”。宁为“悔”，不可为“吝”。\n六五：干父之蛊，用誉。\n卓吾云：上九不事事，而六五犹誉以悦之，使其欢然顺从，蛊斯可干。\n“用”者，用人也。“用誉”者，因用人而得誉也。“二多誉”，誉之象也。周公曰“用誉”、孔子“二多誉”之言盖本于此。九二以五为母，六五又取子道，可见《易》不可典要。宋仁宗仁柔之主，得韩范富欧，卒为宋令主，此爻近之。\n六五以柔居尊，下应九二，二以刚中之才而居巽体，则所以承顺乎五者，莫非刚健大中之德矣。以此治蛊，可得闻誉，然非自能誉也，用人而得其誉也。故其象占如此。\n《象》曰：“干父”“用誉”，承以德也。\n“承”者，承顺也。因巽体又居下，故曰“承”，言九二承顺以刚中之德也。\n上九：不事王侯，高尚其事。\n上“事”字，“事王侯”以治蛊也。下“事”字，以“高尚”为“事”也。耕于有莘之野，而乐尧舜之道是也。上与五二爻，以家事言，则上为父、五为母、众爻为子，观诸爻以干父母言，可知矣。以国事言，则五为君、下四爻为用事之臣、上一爻为不事之臣，观上一爻以王侯言可知矣。盖当蛊之世，任其事而干蛊者，则操巽命之权，而行其所当行；不任其事而高尚者，则体艮止之义，而止其所当止。如邓禹诸臣皆相光武，以干汉室之蛊，独子陵钓于富春是也。艮止，“不事”之象。变坤错乾，“王侯”之象。巽为高，“高尚”之象。\n初至五，皆干蛊。上有“用誉”之君，下有“刚中”之臣，家国天下之事已毕矣。上九居蛊之终，无系应于下，在事之外，以刚明之才，无应援而处无事之地，盖贤人君子不偶于时而高洁自守者也，故有此象。占者有是德，斯应是占矣。\n《象》曰：“不事王侯”，志可则也。\n高尚之志足以起顽立懦，故可则。\n李卓吾“上九”论其意义，尽于不可贞内，看来“用誉”亦是顺承也好。","19":"临观之义或与或求\n“临”者，进而临逼于阴也。二阳浸长以逼于阴，故为“临”。十二月之卦也。天下之物密近相临者，莫如地与水，故“地上有水”则为比，“泽上有水”则为临。《序卦》：“有事而后可大。临者，大也。蛊者，事也。”韩康伯云：“可大之业，由事而生。二阳方长而盛大。”所以次蛊。\n临：元亨，利贞。至于八月有凶。\n临综观，二卦同体，文王综为一卦，故《杂卦》曰：“临观之义，或与或求。”言至建酉，则二阳又在上，阴又逼迫阳矣。“至于八月”，非临数至观八个月也，言至建酉之月为观，见阴之消不久也。专以综卦言。\n《彖》曰：临，刚浸而长，说而顺，刚中而应。大亨以正，天之道也。“至于八月有凶”，消不久也。\n以卦体、卦德释卦名、卦辞。“浸”者，渐也。言自复一阳生至临，则阳渐长矣。此释卦名。“说而顺”者，内说而外顺也。说则阳之进也不逼，顺则阴之从也不逆。“刚中而应”者，九二刚中，应乎六五之柔中也。言虽刚浸长逼迫乎阴，然非倚刚之强暴而逼迫也，乃彼此和顺相应也，此言临有此善也。刚浸长而悦顺者，大亨也。刚中而应柔中者，以正也。“天之道”者，天道之自然也。言天道阳长阴消，原是如此。“大亨以正”也，一诚通复，岂不“大亨以正”？故文王卦辞曰“元亨利贞”者，此也。然阴之消岂长消哉？至酉曰“观”，阴复长而凶矣。\n《象》曰：泽上有地，临。君子以教思无穷，容保民无疆。\n“教”者，劳来匡直之谓也。“思”者，教之至诚恻怛出于心思也。“无穷”者，教之心思不至厌而穷尽也。“容”者，民皆在统驭之中也。“保”者，民皆得其所也。“无疆”者，无疆域之限也。“无穷”与兑泽同其渊深，“无疆”与坤土同其博大，二者皆“临民”之事，故君子观临民之象以之。\n初九：咸临，贞吉。\n“咸”，皆也，同也。以大临小者，初九、九二，临乎四阴也；以上临下者，上三爻临乎其下也。彼临乎此，此临乎彼，皆同乎临，故曰“咸临”。卦惟二阳，故此二爻皆称“咸临”。九刚而得正，故占者“贞吉”。\n以上临下，似未是，如云非阳能临，乃二阳“咸临”似妥。\n《象》曰：“咸临，贞吉”，志行正也。\n初“正”，应四亦“正”，故曰“正”。中爻震足，故初“行”，五亦“行”。\n九二：咸临，吉无不利。\n“咸临”与初同而占不同者，九二有刚中之德，而又有上进之势，所以“吉无不利”。\n《象》曰：“咸临，吉无不利”，未顺命也。\n“未顺命”者，未顺五之命也。五，君位，故曰“命”。且兑综巽，亦有“命”字之象。本卦彖辞“悦而顺”，孔子恐人疑此爻之“吉无不利”者，乃悦而顺五之命也。故于《小象》曰，二之吉利者，乃有刚中之德，阳势上进，所以吉利也，未顺五之命也。\n“未顺命”者，四阴方盛，为顺阳之命也，所以必二阳“咸临”。周公之吉利坚二阳上进之心也。孔子“未顺命”者，坚二阳合德之心也。围成弗克，三家岂皆顺命乎？孔子尚不能以一阳服群阴，而况其他？\n六三：甘临，无攸利。既忧之，无咎。\n“甘临”者，以甘悦人，而无实德也。坤土其味甘。兑为口，甘之象也。故节卦九五“变临”，亦曰“甘节”。“无攸利”者，不诚不能动物也。变乾，乾三爻“惕若”，忧之象也。\n三居下之上，临人者也。阴柔悦体，又不中正，故有以甘悦临人之象，此占者所以“无攸利”也。能忧而改之，斯“无咎”矣。\n《象》曰：“甘临”，位不当也。“既忧之”，咎不长也。\n“位不当”者，阴柔不中正也。“咎不长”者，改过也。\n六四：至临，无咎。\n六四当坤兑之交，地泽相比，盖临亲切之至者，所以占者“无咎”。\n以阴临阳，宜有咎，然阴阳相应之至者，故无咎。\n《象》曰：“至临，无咎”，位当也。\n以阴居阴，故“位当”。\n“位当”者，居坤顺之位，下临乎初阳而相应也。其得“无咎”者，以其位，非以其阴也。“位当”，阴亦当矣。\n六五：知临，大君之宜，吉。\n知，音智。\n变坎，坎为“通”，智之象也。“知临”者，明四目，达四聪，不自用而任人也。应乾阳，故曰“大君”。“知临”之“知”，原生于九二，故即曰“大君”。“知”者，觉也，智也。六五非九二不能至此。“宜”者，得人君之统体也。\n六五柔中居尊，下任九二刚中之贤，兼众智以临天下，盖得“大君之宜”者，吉可知矣。占者有是德，亦如是占也。\n《象》曰：“大君之宜”，行中之谓也。\n与初行正同。六五中，九二亦中，故曰“行中”。“行中”即用中。中爻震足，行之象也。\n上六：敦临，吉，无咎。\n“敦”，厚也。爻本坤土，又变艮土，敦厚之象。初与二虽非正应，然志在二阳，尊而应卑，高而从下，盖敦厚之至者。\n上六居临之终，坤土敦厚，有“敦临”之象，吉而无咎之道也。故其象占如此。\n《象》曰：“敦临”之吉，志在内也。\n志在内卦二阳，曰“志”者，非正应也。","20":"观\n“观”者，有象以示人，而为人所观仰也。风行地上，遍触万类，周观之象也。二阳尊上，为下四阴所观仰，观之义也。《序卦》：“临者大也，物大然后可观，故受之以观。”所以次临。\n观：盥而不荐，有孚颙若。\n观，官唤反。盥，音管。\n“盥”者，将祭而洁手也。“荐”者，奉酒食以荐也。“有孚”者，信也。“颙”者，大头也，仰也。《尔雅》：“颙颙君之德也。”大头在上之意，仰观君德之意，言祭祀者方洁手而未荐，人皆信而仰之矣。观者必当如是也。自上示下曰“观”，去声；自下观上曰“观”，平声。\n《彖》曰：大观在上，顺而巽，中正以观天下。“观，盥而不荐，有孚颙若”，下观而化也。观天之神道，而四时不忒。圣人以神道设教，而天下服矣。\n观皆去声，惟下观而化平声。\n以卦体、卦德释卦名，又释卦辞，而极言之。“顺”者，心于理无所乖。“巽”者，事于理无所拂。中正即九五。阳大阴小，故曰“大观”在上。“中正”则所观之道也。言人君欲为观于天下，必所居者九五“大观”之位，所具者慎顺巽之德，而后以我所居之中，观天下之不中，所居之正，观天下之不正，斯可以为观矣，所以名“观”。“下观而化”，故人信而仰之，所以有孚颙若者此也。“盥而不荐”者，神感也。“有孚颙若”者，神应也。此观之所以神也。故以天道圣人之神道，极言而赞之。“神”者，妙不可测，莫知其然之谓。“天之神道”非有声色，而四时代谢无少差忒；“圣人神道设教”亦非有声色，而民自服从，观之神一而已矣。\n《象》曰：风行地上，观。先王以省方观民设教。\n上观，去声。下观，平声。\n“省方”者，巡狩省视四方也。“观民”者，观民俗也，即《陈诗》“以观民风”，“纳价”“以观好恶”也。“设教”者，因俗以设教也。如齐之末业，教以农桑，卫之淫风，教以有别是也。风行地上，周及庶物，有历览周遍之象，故以“省方”体之。“坤为方”，“方”之象；“巽以申命”，“设教”之象。\n初六：童观，小人无咎，君子吝。\n观，平声。\n“童”者，童稚也。“观”者，观乎五也。中爻艮为少男，“童”之象也。初居阳，亦童之象，故二居阴，“取女”之象。“小人”者，下民也。本卦阴取下民，阳取君子。“无咎”者，“百姓日用而不知”，所以“无咎”也。“君子吝”一句乃足上句之意，故《小象》不言“君子”。\n初六当大观在上之时，阴柔在下，去五最远，不能观五中正之德辉，犹童子之识见不能及远，故有“童观”之象。然其占在小人，则无咎。若君子岂无咎哉！亦可羞吝矣。\n《象》曰：“初六，童观”，小人道也。\n不能“观国之光”，小人之道自是如此。\n六二：观，利女贞。\n观，平声。\n“”与“窥”同，门内窥视也。不出户庭，仅窥一隙之狭者也。曰“利女贞”，则丈夫非所利矣。中爻艮，门之象也。变坎为“隐伏”，坎错离为“目”，目在门内隐伏处，窥视之象也。二本与五相应，但二之前即门，所以“窥观”。\n六二阴柔，当观之时，居内而观外，“不出户庭”而欲观中正之道，不可得矣，故有“窥观”之象。惟女子，则得其正也。故其占如此。\n《象》曰：“观”“女贞”，亦可丑也。\n妇女无外事，则“窥观”乃女子之正道。丈夫志在四方，宇宙内事乃吾分内事。以丈夫而为女子之观，亦可丑矣。\n六三：观我生进退。\n观，平声。\n子路对丈人之辞：“明君在上，可出而仕矣”。\n下爻皆观乎五。三隔四，四已“观国之光”，三惟观我生而已。“我生”者，我阴阳相生之正应也，即上九也。为“进退”为“不果”者，巽也。巽有“进退”之象，故曰“观我生进退”。\n六三当观之时，隔四不能“观国”，故有“观我生进退”之人之象。不言占之凶咎者，阴阳正应，未为失道，所当观者也。\n《象》曰：“观我生进退”，未失道也。\n“道”者，阴阳相应之正道也。\n六四：观国之光，利用宾于王。\n观，平声。\n“光”者，九五阳明在上，被四表，光四方者也。下坤土，国之象。中爻艮，辉光之象。四承五，宾主之象。九五，王之象。“观国光”者，亲炙其休光也。“宾”者，已仕者朝觐于君，君则宾礼之，未仕则仕进于君，君则宾兴之也。观卦利近不利远，六二中正，又乃正应，乃曰“窥观”，则不利于远可知矣。\n六四柔顺得正，最近于五，有“观光”之象，故占者“利用宾于王”。\n《象》曰：“观国之光”，尚宾也。\n“尚”谓心志之所尚，言其志意愿宾于王朝。\n九五：观我生，君子无咎。\n观，去声。\n九五、上九“生”字，亦如六三“生”字，皆我相生之阴阳也。“观我生”作句，观孔子《小象》可见矣。“观我生”者，观示乎我所生之四阴也，即“中正以观天下”也。“君子无咎”对初爻“小人无咎”言。下四阴爻皆“小人”，上二阳爻皆“君子”。小人当仰观乎上，故“无咎”；君子当观示乎下，故“无咎”。\n九五为观之主，阳刚中正以居尊位，下之四阴皆其所观示者也，故有“观我生”之象。“大观在上”，君子无咎之道也。故其象占如此。\n《象》曰：“观我生”，观民也。\n二观字，皆去声。\n“民”即下四阴。阴为民，民之象也。故姤九四曰“远民”，以初六阴爻也。内卦三阴远于五，草莽之“民”也。六四之阴近于五，仕进之“民”也。九五虽与六二正应，然初三四与九五皆阴阳相生，故曰“观我生，观民也”，即“中正以观天下之民”也。\n“生”曰我生，则关于我者切矣。孔子释以“民”字，不曰“生”，而曰“民”，非独同焉，皆生己也。人君俯临万民，不有以观之，不惟负我，并负民也。\n上九：观其生，君子无咎。\n观，去声。\n上九虽在观示之上，然本卦九五有天下国家之责，所以九五观示乎诸爻，诸爻仰观乎九五。曰“我生”者，即大有六五“五阳皆其所有”之意。言下四阴惟我可以观示，他爻不可得而观示之也。若上九不在其位，不任其事，则无观示之责。止因在上位，阴阳相生，义当观其生，是空有观生之位而已，故不曰“观我生”，而曰“观其生”者，避五也。是“我”字甚重，而“其”字甚轻也。“君子无咎”者，九五与上九皆阳刚在上，故并“君子”之“无咎”也。\n上九以阳刚居观之极，故有“观其生”之象，亦君子之无咎者，故其象占如此。\n《象》曰：“观其生”，志未平也。\n“志”者，上九之心志也。“平”者，均平也，与九五平分，相同一般之意。言周公爻辞，九五“观我生”，而上九则以“其”字易“我”字者，何哉？以上九之心志，不敢与九五同观其民也，故曰“志未平”也。盖观示乎民乃人君之事。若上九亦观示乎民，则人臣之权与人君之权相为均平而无二矣，岂其理哉！故上九阳刚虽与五同，不过有观生之位而已，不敢以四阴为我之民，与九五平观示之也。","21":"噬嗑食也\n“噬”，啮也；“嗑”，合也。颐中有物间之，啮而后合也。上下两阳而中虚，颐之象也。四一阳间于其中，“颐中有物”之象也。“颐中有物”必啮而后合，噬嗑之象也。《序卦》：“嗑者合也，可观而后有所合。”所以次观。\n噬嗑：亨。利用狱。\n“噬嗑亨”，卦自有亨义也。天下之事，所以不得亨者，以其有间也。噬而嗑，则物不得而间之，自亨通矣。此概举天下之事而言也。“利用狱”者，噬嗑中之一事也。\n《彖》曰：颐中有物，曰“噬嗑”。“噬嗑”而“亨”，刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，“利用狱”也。\n以卦体、卦德、二象、卦综释卦名、卦辞。“颐中有物”，则其物作梗。以人事论，如寇盗奸宄，治化之梗；蛮夷猾夏，疆场之梗；以至君臣父子、亲戚朋友离贰谗谤，间于其中者，皆颐中之梗也。《易》卦命名立象，各有所取。鼎也，井也，大过之栋也，小过之飞鸟也，“远取诸物”者也；艮之背也，颐之头也，噬嗑颐中之物也，“近取诸身”者也。刚柔分者，震刚离柔，分居内外，内刚者齿也，外柔者辅也。“动而明”者，震动、离明也。“雷电合”者，卦二象也。盖动不如雷，则不能断，明不如电，则不能察，唯雷电合，则雷震电耀威明相济，所谓动而明者，愈昭彰矣。此已前言“噬嗑亨”。“柔得中而上行”者，本卦综贲，二卦同体，文王综为一卦，故《杂卦》曰：“噬嗑食也，贲无色也。”言以贲下卦离之柔，“得中上行”，而居于噬嗑之上卦也。盖不柔则失之暴，柔不中则失之纵，柔得中，则宽猛得宜，有哀矜之念，而又不流于姑息，此其所以“利用狱”也。若依旧注，自益卦来，则非“柔得中而上行”，乃上行而柔得中矣。“不当位”者，以阴居阳也。\n“颐中有物，名噬嗑”矣，而曰“亨”者，何也？盖凡噬物，噬则颐分，嗑则颐合。今未噬之先内刚外柔，将噬之际动而明，正噬之时合而章，先分后合，又何物得以间之？此所以噬嗑而亨也。然以噬嗑之亨，何事不利，而独“利用狱”者，盖六五以柔在上，本不当位，不足以致诸事之利，独以“柔得中”，所以“利用狱”也。\n《象》曰：雷电，噬嗑，先王以明罚敕法。\n“罚”者，一时所用之法。“法”者，平日所定之罚。“明”者，辨也，辨其轻重，效电之明。“敕”者，正也，正其国法，效雷之威，明辨敕正，以振“敕”法度，使人知所畏避也。\n初九：屦校灭趾，无咎。\n校，音教。\n“校”，足械也。“屦”者，以械加于足，如纳屦于足也。中爻坎，坎为“桎梏”，校之象也。故上九亦言“校”。“趾”者，足趾也，震为足，趾之象也。“灭”者，没也，遮没其趾也。变坤，不见其震之足，“灭其趾”之象也。“无咎”者，因其刑而惩创以为善也。“屦校”不惩，必至“荷校”；“灭趾”不惩，必至“灭耳”。不因其刑而惩创，必至上九之恶积罪大矣，安得无咎？初九、上九受刑之人，中四爻则用刑者。\n九居初无位，下民之象也。以阳刚而不柔顺，未有不犯刑者，故有“屦校灭趾”之象。“趾”乃人之所用以行者，惩之于初，使不得行其恶，小人之福也。故占者“无咎”。\n《象》曰：“屦校灭趾”，不行也。\n震性动。“灭其趾”，则不得动而行以为恶矣。\n六二：噬肤灭鼻，无咎。\n“肤”者，肉外皮也。凡卦中次序相近者言肤。剥卦言“肤”者，艮七坤八也。睽卦言“肤”者，兑二离三也。此卦言“肤”者，离三震四也。六爻二言“肤”者，皮也。三言“肉”者，皮中之肉也。四言“胏”者，肉中连骨也，以阳刚也。五阴柔，又言肉矣。爻位以次渐深，噬肉以次渐难。祭有肤鼎，盖柔脆而无骨、噬而易嗑者也。中四爻有上下齿噬啮之象，故四爻皆言“噬”。此爻变兑，兑为口，“噬”之象也。二乃治狱之人，居其中，初在下，外为肤，“噬其肤”之象也，故《杂卦》曰“噬嗑食也”，正言此四爻之噬也。中爻艮，艮为“鼻”，“鼻”之象也。二变则中爻为离，不见其艮之鼻，灭其鼻之象也。“灭”字与“灭趾”、“灭耳”同例，即《朱子语录》所谓“噬肤而没其鼻于器中”是也，言噬易嗑而深噬之也。\n六二柔顺中正，听断以理，故其治狱有“噬肤灭鼻”之易之象，“无咎”之道也。故其占如此。\n《象》曰：“噬肤灭鼻”，乘刚也。\n“刚”者，初之刚也。人刚则性直，狱内委曲皆不隐藏，已易于听断矣。六二又以中正乘其刚，以听断必得其情，故有“噬肤灭鼻”之易。\n六三：噬腊肉，遇毒，小吝，无咎。\n腊，音昔。\n“腊肉”者，即六五之乾肉也。离火在前，三变又成离，上火下火，乾其肉之象也。九四、六五，离有乾象，故二爻皆言乾，而此言腊也。“遇”者，逢也。凡《易》中言遇者，皆雷与火也。睽九二变震曰“遇主于巷”，“遇元夫”者亦变震也。丰“遇配主”、“遇夷主”，小过《大象》坎错离，“遇其妣”、“遇其臣”，此雷火，故言“遇毒”。“毒”者，腊肉之陈久太肥者也。《说文》云“毒者厚也”，“味厚者为毒久”。“噬腊遇毒”者，言噬乾肉，而遇陈久太肥厚味之肉也。中爻坎，所以曰“毒”。故师卦有此“毒”字。\n六三阴柔，不中不正，治狱而遇多年陈久烦琐之事，一时难于断理，故有噬腊遇毒之象，亦小有吝矣。然时当噬嗑，于义亦无咎，故其占又如此。\n《象》曰：“遇毒”，位不当也。\n以阴居阳。\n阴居阳位，故见为“遇毒”。若阳居阳位，则遇事立断，何毒之有？盖此爻若变，则为离，是动而明也，故惜其位不当。\n九四：噬乾胏，得金矢。利艰贞，吉。\n乾，音干。胏，音滓。\n“胏”，乾肉之有骨者。离为乾，乾之象也。六五亦同此象。三肉居卦之中，乃狱情之难服者，故皆以坚物象之。“金”者，刚也。此爻正颐中之物，阳爻居二阴之间，金之象也。变坤错乾，亦金之象也。“矢”者，直也，中爻坎，矢之象也。盖九四正居坎之中，坎得乾之中爻，为中男，故此爻有金象，有“矢”象。若六五变为乾，止有金象，无矢象矣，故止曰“得黄金”。且九四刚而不正，故戒之以“刚直”。六五柔中，故戒之以“刚中”。二爻皆曰“得”者，教人必如此也。“艰”者，凛凛然惟恐一毫之少忽，以心言也。“贞”者，兢兢然惟恐一毫之不正，以事言也。狱情难明，故必如金之刚、矢之直，而又艰难正固，则吉矣。因九四不中正，故教占者占中之象又如此。\n《象》曰：“利艰贞，吉”，未光也。\n“未光”即屯九五、夬九五之类。\n六五：噬乾肉，得黄金。贞厉，无咎。\n“噬乾肉”，难于肤而易于乾胏者也，乃所治之狱，匪难匪易之象。“黄”者，中也。金者，刚也，变乾，金之象也。乾错坤，黄之象也。离得坤之中爻为中女，则离之中，乃坤土也，故曰“黄金”。“贞”者，纯乎天理之公而无私也。“厉”者，存乎危惧之心，而无忽也。“无咎”者，刑罚当而民不冤也。\n六五居尊，用刑于人，人无不服，故有“噬乾肉易嗑”之象。然恐其柔顺而不断也，故必如“黄”之中、“金”之刚，而又“贞厉”，乃得无咎。因六五柔中，故戒占者，占中之象，又如此。\n《象》曰：“贞厉，无咎”，得当也。\n当，去声。\n言必如此治狱，方得当也。\n上九：何校灭耳，凶。\n何，音荷。\n“何”者，负也，谓在颈也。中爻坎为“桎梏”。初则曰“屦”，上则曰“负”，以人身分上下而言也。“灭”者，遮灭其耳也。坎为“耳痛”，“灭耳”之象也。又离为戈兵，中爻艮为手，手持戈兵，加于耳之上，亦“灭耳”之象也。\n上九居卦之上，当狱之终，盖恶极罪大、怙终不悛者也，故有“何校灭耳”之象。占者如此，凶可知矣。\n《象》曰：“何校灭耳”，聪不明也。\n“聪”者，闻也，听也。上九未变，离明在上，坎耳在下，故听之明。今上九既变，则不成离明矣，所以听之不明也。困卦坎“有言不信”，夬四变坎“闻言不信”，今既听之不明，则不信人言矣。坎既心险，又不信好言，所以犯大罪。","22":"贲无色也\n“贲”，饰也。为卦山下有火。“山”者，百物草木之所聚，下有火，则照见其上，品汇皆被光彩，贲之象也。《序卦》：“嗑者，合也，物不可以苟合也，故受之以贲。”所以次噬嗑。\n贲：亨。小利有攸往。\n贲，彼伪反。\n“小利攸往”亦为亨，但亨之不大耳。\n《彖》曰：贲，“亨”。柔来而文刚，故“亨”。分刚上而文柔，故“小利有攸往”，天文也。文明以止，人文也。观乎天文，以察时变。观乎人文，以化成天下。\n以卦综、卦德释卦辞，而极言之。本卦综噬嗑。“柔来文刚”者，噬嗑上卦之柔来文贲之刚也。柔指离之阴卦，刚则艮之阳卦也。“柔来文刚”以成离明，内而离明则足以照物。动罔不臧，所以“亨”。“分”者，又分下卦也。“分刚上而文柔”者，分噬嗑下卦之刚，上而为艮，以文柔也。刚指震之阳卦，柔则离之阴卦也。刚上而文柔，以成艮止。外而艮止，则内而能知之，外而不能行之，仅可“小利有攸往”而已，不能建大功业也。故以其卦综观之，“柔来文刚，刚上文柔”，是即天之文也，何也？盖在天成象，日月五星之运行，不过此一刚一柔、一往一来而已。今本卦刚柔交错，是“贲”之文，即“天”之文也。以其卦德观之，是即“人”之文也，何也？盖人之所谓文者，不过文之明也，而灿然有礼以相接，文之止也，而截然有分以相守。今本卦内而离明，外而艮止，是“贲”之文，即“人”之文也。“观天文以察时变，观人文以化成天下”，贲之文不其大哉！“变”者，四时寒暑代谢之变也。“化”者，变而为新。“成”者，久而成俗。\n《象》曰：山下有火，贲。君子以明庶政，无敢折狱。\n“明”，离象。“无敢”，艮象。“庶”者，众也。繁庶小事，如钱谷出纳之类。“折狱”则一轻重出入之间，民命之死生所系，乃大事也。曰“无敢”者，非不折狱也，不敢轻折狱也，再三详审，而后发之意，此即“小利有攸往”之理。因内明外止，其取象如此。贲与噬嗑相综，噬嗑“利用狱”者，明因雷而动也；贲“不敢折狱”者，明因艮而止也。\n初九：贲其趾，舍车而徒。\n舍，音捨。\n“贲其趾”者，道义以文饰其足趾也。“舍”者，弃也。“徒”者，徒行也。“舍车而徒”，即贲其趾也。言“舍车”之荣而徒行，是不以徒行为辱，而自以道义为荣也。中爻震与坎。震，“趾”之象也；坎，“车之象也。变艮，止而又止，舍之象也。初比二而应四，比二则从乎坎车矣，应四则从乎震趾矣。然升乎车者，必在上方可乘。《易》中言“乘”者，皆在上也，言“承”者，皆在下也。初在下无“乘”之理，故有“舍”坎“车”而从震“趾”之象。观《小象》“乘”字可见。\n初九刚德明顺，盖内重外轻，自贲于下而隐者也，故有舍非义之车，而安于徒步之象。占者得此，当以此自处也。\n《象》曰：“舍车而徒”，义弗乘也。\n初在下，无可乘之理。\n六二：贲其须。\n在颐曰“须”，在口曰“髭”，在颊曰“髯”。须不能以自动，随颐而动，则须虽美，乃附于颐以为文者也。本卦综噬嗑，原有颐象，今变阳则中爻为兑口矣，口旁之文莫如须，故以“须”象之。\n六二以阴柔居中正，三以阳刚得正，皆无应与，故二附三而动，犹须附颐而动也，故有“贲其须”之象。占者附其君子，斯无愧于贲矣。\n《象》曰：“贲其须”，与上兴也。\n“与”者，相从也。“兴”者，兴起也。二阴柔从三阳兴起者也。\n九三：贲如濡如，永贞吉。\n如，助语辞。“濡”，沾濡也。离文自饰，“贲如”之象也。中爻坎水自润，“濡如”之象也。“永贞”者，长永其贞也。九三本贞，教之以永其贞也，“吉”者，阴终不能陵也。\n九三以一阳居二阴之间，当贲之时，阴来比己，为之左右先后，盖得其贲而润泽者也，故有“贲如濡如”之象。然不可溺于所安也，占者能守“永贞”之戒，斯吉矣。\n《象》曰：“永贞”之吉，终莫之陵也。\n“凌”者，侮也。能永其贞，则不陷溺于阴柔之中，有所严惮，终莫之凌侮矣。\n六四：贲如皤如，白马翰如。匪寇，婚媾。\n皤，白波反。\n“皤”，白也。四变中爻为巽，白之象也。“贲如皤如”者，言未成其贲而成其皤也，非贲如而又皤如也。中爻震为“足”，为“的颡”。，白足，颡，白颠，白马之象也。旧注不知象，故言人白则马亦白，无是理矣。“翰如”者，马如翰之飞也。中爻坎，坎为亟心之马，“翰如”之象也。寇指三，婚媾指初。\n六四与初为正应，盖相为贲者也。乃为九三所隔而不得遂，故未成其贲，而成其皤。然四往求于初之心，如飞翰之疾，不以三之隔而遂己也。使非三之寇，则与初成婚媾，而相为贲矣。是以始虽相隔，而终则相亲也。即象而占可知矣。与屯六二同。\n《象》曰：六四，当位，疑也。“匪寇，婚媾”，终无尤也。\n以阴居阴，故“当位”。“疑”者，疑惧其三之亲比也。六四守正，三不能求，故终无过尤。\n六五：贲于丘园，束帛戋戋。吝，终吉。\n戋，音笺。\n艮为“山”，丘之象也。故颐卦指上九为“丘”，涣卦中爻艮，故六四“涣其丘”。艮为“果蓏”，又居中爻震木之上。果蓏林木，园之象也。此丘园指上九。上九贲白，贫贱肆志，乃山林高蹈之贤。蛊乃同体之卦，上九“不事王侯”。随卦上六错艮，亦曰“西山”，则上九乃山林之贤无疑矣。两疋为“束”。阴爻两坼，“束”之象也。坤为帛，此坤土“帛”之象也。“戋”与残同，伤也。艮错兑为“毁折”，戋之象也。束帛伤戋，即今人之礼缎也。本卦上体下体皆外阳中虚，有礼缎之象。上戋下戋，故曰“戋戋”。阴吝啬，故曰“吝”。\n六五文明以止之主，当贲之时，下无应与，乃上比上九高蹈之贤，故有光贲丘园、束帛以聘之象。然贲道将终，文反于质，故又有“戋戋”之象。以此为礼，有似于吝，然礼薄意勤，礼贤下士，乃人君可喜之事。占者得此，吉可知矣。\n《象》曰：六五之吉，有喜也。\n艮错兑为悦，故曰“有喜”。得上九高贤而文之，岂不喜？\n上九：白贲，无咎。\n“贲”，文也。“白”，质也，故曰“白受釆”。上九居贲之极，物极则反，有色复于无色，所以有“白贲”之象。文胜而反于质，“无咎”之道也。故其象占如此。\n《象》曰：“白贲，无咎”，上得志也。\n文胜而反于质，退居山林之地，六五之君以束帛聘之，岂不得志？此以人事言者也。若以卦综论之，此爻原是噬嗑初爻，刚上文柔，以下居上，所以得志。","23":"剥烂也\n“剥”者，落也，九月之卦也。五阴在下，一阳在上，阴盛阳孤，势将剥落而尽，剥之义也。至高之山，附著于地，有倾颓之势，剥之象也。《序卦》：“贲者，饰也，致饰然后亨，则尽矣，故受之以剥。”所以次贲。\n剥：不利有攸往。\n“不利有攸往”，言不可有所往，当俭德避难，所以为君子谋也。\n《彖》曰：剥，剥也，柔变刚也。“不利有攸往”，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。\n长，丁丈反。\n以卦体、卦德释卦名、卦辞。“剥”者，阳剥也。所以剥之者，阴也。五之阴，上进而欲变乎上之一阳也。以卦体言之，“小人长”也，阴邪之声势方张也。以卦象言之，内顺外止，有顺时而止之象，人当观此象也。观小人之时，时不可往，观一卦之象，象自不往，所以“不利有攸往”。“消息”者，“盈虚”之方始；“盈虚”者，“消息”之已成。“消息盈虚”四字，皆以阳言。复者阳之息，姤者阳之消，乾者阳之盈，坤者阳之虚，此正阳消而将虚之时也。“天行”者，天道自然之运也。天运之使然，君子亦惟以是为尚，与天时行而已，既不可往，又岂往哉！“君子”二句，又推原“不利有攸往”之故。\n《象》曰：山附于地，剥。上以厚下安宅。\n“上”谓居民之上，一阳在上之象也。“厚下”者，厚民之生，省刑罚、薄税敛之类也。“宅”者，上所居之位，非宅舍也。因艮体一阳覆帱于上，有宅舍之象，故以“宅”言之。所以上九亦以庐言者，以有庐之象也。“厚下安宅”者，言厚下而不剥下者，正所以自安其宅也，民惟邦本，本固邦宁之意。卦以下剥上取义，乃小人剥君子，成剥之义；象以上厚下取义，乃人君厚生民，则治剥之道也。\n初六：剥床以足，蔑贞凶。\n剥床以足者，剥落其床之足也。变震，足之象也。剥自下起，故以足言之。一阳在上，五阴列下，有宅象、庐象、床象。“蔑”者，灭也。“蔑贞”者，灭其正道也，指上九也。方剥足而即言“蔑贞”，如“履霜”而知“坚冰至”也。\n初六阴剥在下，有“剥床以足”之象。“剥床以足”，犹未见其凶，然其“剥足”之势，不至“蔑贞”而不已，故戒占者如此。此圣人为君子危，而欲其自防于始也。\n《象》曰：“剥床以足”，以灭下也。\n以灭下，则渐而上矣。见其端甚微，知其必有“蔑贞”之祸。\n六二：剥床以辨，蔑贞凶。\n“辨”者，床之干也。不曰“干”而曰“辨”者，谓床之下、足之上，分辨处也。“蔑贞”同初。\n《象》曰：“剥床以辨”，未有与也。\n“与”者，阳也。凡爻中，阳以应阴、阴以应阳方谓之应，相比亦然。二本阴爻，有阳爻之应，或有阳爻之比，则有与矣。今比乎二者初也，初，阴也。应乎二者五也，五亦阴也。前后左右，皆无应与之阳，则上九乃孤阳矣，岂不“蔑贞”？故初知其“蔑贞”，而二亦知其必有此“凶”也。\n六三：剥之，无咎。\n三虽与上九为正应，不可言“剥”，然在剥卦之中，犹不能离乎剥之名。“之”，语助辞。众阴方剥阳，而三独与之为应，是小人中之君子也。去其党而从正，虽得罪于私党，而见取于公论，其义“无咎”矣。占者如此，故“无咎”。剥以近阳者为善，应阳者次之。近阳者六五是也，故“无不利”。应阳者此爻是也，故“无咎”。\n吕氏家贱，恶莫大焉。\n《象》曰：“剥之，无咎”，失上下也。\n“上下”谓四阴。三居四阴之中，不与之同党，而独与一阳为应与，是所失者上下之阴，而所得者上九之阳也。惟其失四小人，所以得一君子。\n六四：剥床以肤，凶。\n初“足”，二“辨”，三“床”之上，四乃上体，居“床”之上，乃床上人之肤也。剥床而及其肌肤，祸切身矣，故不言“蔑贞”，而直曰“凶”。\n《象》曰：“剥床以肤”，切近灾也。\n言祸已及身，而不可免也。\n六五：贯鱼以宫人宠，无不利。\n此正彖辞所谓顺而止之也。鱼贯者，鱼之贯串而相次以序，五阴列两旁之象也。本卦大象巽，此爻变巽，巽有鱼象，详见中孚。巽为绳，贯之象也。“以”者，后妃以之也。五，君位，为众阴之长，故可以以之。“鱼”，阴物，“宫人”众妾，乃阴之美，而受制于阳者。艮错兑为“少女”，“宫人”之象也。“以宫人宠”者，统领宫人，以次上行，进御而获其宠也。一阳在上，五率其众阴，本卦原有此象。且内顺外止，本卦原有此德。阴顺则能从乎阳，艮止则必不剥阳矣。“无不利”者，阴听命于阳，乃小人听命于君子也，故“无不利”。非《程传》别设义之说。\n六四以剥其肤而凶，至六五阴长阳消之极矣。然本卦顺而且止，故阴不剥阳，有“贯鱼，以宫人宠”，反听命于阳之象。此小人之福，而君子之幸也。故占者“无不利”。\n《象》曰：“以宫人宠”，终无尤也。\n五以阴剥阳，今率其类以听命于阳，有何过尤？\n上九：硕果不食。君子得舆，小人剥庐。\n“硕果”者，硕大之果。阳大阴小，硕之象也。艮为果，果之象也。“不食”者，在枝间未食也。诸阳皆消，一阳在上，硕果在枝上之象也。此爻未变，艮错兑为口，犹有可食之象。此爻一变则为坤，而无口矣，不食之象也。果硕大不食，必剥落朽烂矣，故孔子曰“剥者烂也”。果剥落朽烂于外，其中之核又复生仁，犹阳无可尽之理，穷上反下，又复生于下也。“舆”者，物赖之以载，犹地之能载物也。变坤，坤为大舆，舆之象也。一阳复生于地之下，则万物皆赖之以生，此“得舆”之象也。“庐”者，人赖之以覆，犹天之能覆物也。五阴为庐，一阳盖上，为庐之椽瓦。今一阳既剥于上，则国破家亡，人无所覆庇以安其身，此剥庐之象也。上一画变，此穷上也，故曰“剥”。剥则阴矣，故曰“小人”。下一画新生，此反下也，故曰“得”。得则阳矣，故曰君子。盖阳剥于上，则必生于下，生之既终，则必剥于上。未剥之先，阳一画在上，故其象似“庐”；既剥之后，阳生于下，则上一画又在下矣，故其象似“舆”。\n诸阳消剥已尽，独上九一爻，故有“硕果不食”之象。今上九一爻既变，则纯阴矣，然阳无可尽之理，既剥于上，必生于下，故生于下者，有“君子得舆”而为民所载之象，剥于上者，有“小人剥庐”终无所用之象。占者得此，君子小人当自审矣。\n《象》曰：“君子得舆”，民所载也。“小人剥庐”，终不可用也。\n“民所载”者，民赖之以承载也，庐所赖以安身者也。今既剥矣，终何用哉？必不能安其身矣。国破家亡，小人无独存之理。“载”字从“舆”字上来，“不可用”从“剥”字上来。","24":"复反也\n“复”者，来复也。自五月一阴生后，阳一向在外，至十月变坤，今冬至复来，反还于内，所以名“复”也。《序卦》：“物不可以终尽，剥穷上反下，故受之以复。”所以次剥。\n复：亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。\n先言“出”而后言“入”者，《程子》言“语顺”是也。“出”者，刚长也。“入”者，刚反也。“疾”者，遽迫也。言出而刚长之时，自一阳至五阳，以渐而长，是出之时未尝遽迫也。入而刚反之时，五月一阴生，九月之剥犹有一阳，至十月阳变，十一月阳反，以渐而反，是入之时未尝遽迫也。“朋”者，阴牵连于前，朋之象也。故豫卦、损卦、益卦、泰卦、咸卦皆因中爻三阳三阴牵连，皆得称“朋”也。自外而之内曰“来”，言阴自六爻之二爻，虽成朋党而来，然当阳复之时，阳气上行以渐而长，亦无咎病也。“复”之得亨者以此。“道”犹言路，言刚反而复之道路也。“七日来复”者，自姤而遁、否、观、剥、坤、复，凡七也，即七日得之意。盖阳极于六，阴极于六，极则反矣，故“七日来复”也。“无疾咎”者，复之亨也。“七日来复”，复之期也。“利有攸往”，复之占也。大抵姤、复之理，五月一阴生为姤，一阴生于内，则阳气浮而在外矣。至于十月坤，阴气虽盛，而阳气未尝息也，但在外耳。譬之妻虽为主，而夫未尝亡。故十一月一阳生，曰“刚反”。反者，言反而归之于内也。十一月一阳生而复，一阳生于内，则阴气浮而在外矣。至于四月，乾阳气虽盛，而阴气未尝息也，但在外耳。譬之夫虽为主，而妻未尝亡，故五月一阴复生。天地虽分阴阳，止是一气，不过一内一外而已。一内一外即一升一沉、一盛一衰、一代一谢也。消息盈虚，循环无端，所以言“剥”言“复”。\n《彖》曰：“复，亨”，刚反，动而以顺行，是以“出入无疾，朋来无咎”。“反复其道，七日来复”，天行也。“利有攸往”，刚长也。复，其见天地之心乎！\n以卦德、卦体释卦辞而赞之。刚反对刚长。“反”者，言剥之刚“穷上反下”而为复也。“长”者，言复之刚自下进上，历临泰而至于乾也。以其既去而来反也，故“亨”，以其既反而长也，故“利有攸往”。刚反，言方复之初，刚长，言已复之后。行亦动也。言下体虽震动，然上体乃坤顺，以顺而动，所以“出入往来，无疾无咎”。“天行”者，阴阳消息，天运之自然也，故“反复其道，七日来复”。阳刚用事，君子道长，所以“利有攸往”。“见天地之心”者，天地无心，生之不息者乃其心也。剥落之时，天地之心几于灭息矣。今一阳来复，可见天地生物之心，无一息之间断也。\n《象》曰：雷在地中，复。先王以至日闭关，商旅不行，后不省方。\n一阳初复，万物将发生之时，当上下安静以养微阳。“商旅不行”者，下之安静也。“后不省方”者，上之安静也。人身亦然，《月令》“斋戒掩身”是也。以卦体论，阴爻“贯鱼”，“商旅”之象。阳爻横亘于下，“闭关”之象。阳君不居五而居初，潜居深宫，“不省方”之象。以卦象论，震为“大涂”，中开大路，“旅”之象。坤为“众”，商旅之象。震综艮，艮止，不行之象。阖户为坤，“闭关”之象。坤为“方”，方之象。\n初九：不远复，无祗悔，元吉。\n“不远”者，失之不远也。“祗”者，适所以之辞。“适”者，往也，至也。人有过失，必至征色发声而后悔悟，此则困心衡虑者也。惟自此心而失之，又自此心而知之；自此心而知之，又自此心而改之。此则不远即复，不至于悔者也。\n初九，一阳初生于下，复之主也。居于事初，其失不远，故有不远能复于善，无至于悔之象，大善而吉之道也。故其占如此。\n《象》曰：“不远”之复，以修身也。\n为学之道无他，惟知不善则速改以从善而已。复则人欲去而天理远，修身之要．何以加此！\n六二：休复，吉。\n“休”者，休而有容也。人之有善，若己有之者也。以其才位皆柔，又变悦体，所以能下其初之贤而复。\n六二柔顺中正，近于初九，见初九之复，而能下之，故有“休复”之象，吉之道也。故其占如此。\n《象》曰：“休复”之吉，以下仁也。\n复初爻本“硕果不食”，穷上反下，其核又生仁，所以取此“仁”字。复礼为仁，初阳复即复于仁也，故曰“以下仁”。\n六三：频复，厉无咎。\n“频”者，数也。三居两卦之间，一复既尽，一复又来，有“频”之象，与“频巽”同。“频复”者，频失而频复也。“厉”者，人心之危也。“无咎”者，能改过也。“不远之复”者，颜子也。“频复”则日月—至，诸子也。\n六三以阴居阳，不中不正，又处动极，复之不固，故有频失频复之象。然当复之时，既失而能知其复，较之迷复者远矣。故当频失之时，虽不免危厉，而至于复，则“无咎”也。故其占如此。\n《象》曰：“频复”之厉，义无咎也。\n此言“频复”而又频失，虽不免于厉，然能改过，是能补过矣。揆之于义，故“无咎”。\n六四：中行独复。\n“中行”者，在中行也。五阴而四居其中，中之象也。凡卦三、四皆可言中。益卦三、四皆言中行是也。此爻变震，应爻亦震，震为足，行之象也。“独复”者，不从其类而从阳也，故孔子以“从道”象之。\n六四柔而得正，在群阴之中，而独能下应于阳刚，故有“中行独复”之象。曰“独复”，则与休者等矣，盖二比而四应也。\n《象》曰：“中行独复”，以从道也。\n初之《象》曰“以修身也”，二曰“仁”，四曰“道”。修身以道，修道以仁，仁与道皆修身之事。二比而近，故曰“仁”；四应而远，故曰“道”。《小象》之精极矣。\n六五：敦复，无悔。\n“敦”者，厚也。有一毫人欲之杂，非复；有一毫人欲之间，非复。“敦复”者，信道之笃，执德之坚，不以久暂而或变者也。“不远复”者，善心之萌。“敦复”者，善行之固。“无悔”者，反身而诚也。“敦临”、“敦复”皆因坤土。\n六五以中德居尊位，当复之时，故有敦厚其复之象。如是，则心与理一，无可悔之事矣。故占者无悔。\n《象》曰：“敦复，无悔”，中以自考也。\n“考”者，成也。言有中德，自我而成其“敦复”也，不由于人之意。初乃复之主，二以下仁而成“休复”，四以从道而成“独复”，皆有资于初以成其复，惟五以中德而自成，不资于初，故曰“自”。“无祗悔”者，入德之事。“无悔”者，成德之事，故曰“考”。\n上六：迷复，凶，有灾眚。用行师，终有大败，以其国君凶，至于十年不克征。\n坤为“迷”，迷之象也。“迷复”者，迷其复而不知复也。坤本先迷，今居其极，则迷之甚矣。“以”者，与也，并及之意。因师败而并及其君，有倾危之忧也。坤为“众”，师之象也。变艮，大象离，离为“戈兵”，众人以戈兵而震动，“行师”之象也。“国”者，坤之象也。详见谦卦。“十”者，土数成于十也。“不克征”者，不能雪其耻也。“灾眚”者，凶也。“用师”以下，则“灾眚”之甚，又凶之大者也。复卦何以言行师？以其敌阳也。剥、复相综，阳初复，阴极盛，正“龙战于野”之时。曰“终有大败”者，阳上进，知其终之时必至于夬之“无号”也。\n上六阴柔居复之终，故有“迷复”之象。占者得此，凶可知矣。是以天灾人眚杂然并至，天下之事无一可为者。若“行师”则丧师辱君，至于“十年”之久，犹不能雪其耻，其凶如此。\n《象》曰：“迷复”之凶，反君道也。\n“反君道”者，反其五之君道也。六五有中德，“敦复无悔”，六居坤土之极，又无中顺之德，所以“反君道”而“凶”。","25":"无妄灾也\n“无妄”者，至诚无虚妄也。《史记》作“无所期望”。盖惟本无妄，所以凡事尽其在我，而于吉凶祸福皆委之自然，未尝有所期望，所以“无妄”也。以天道言，实理之自然也。以圣人言，实心之自然。故有正不正之分。盖震者动也，动以天为无妄，动以人则妄矣。《序卦》：“复则不妄，故受之以无妄。”所以次复。\n无妄：元亨利贞。其匪正有眚，不利有攸往。\n惟其无妄，所以不期望。若处心未免于妄而匪正，则无道以致福，而妄欲徼福，非所谓“无妄之福”；有过以召灾，而妄欲免灾，非所谓“无妄之灾”。此皆未免容心于祸福之间，非所谓无妄也，岂不“有眚”？若真实无妄之人，则纯乎正理，祸福一付之天，而无苟得幸免之心也。\n《彖》曰：无妄，刚自外来而为主于内，动而健，刚中而应，大亨以正，天之命也。“其匪正有眚，不利有攸往”，无妄之往，何之矣？天命不佑，行矣哉！\n注以“刚自外来”为匪正，以动健中应为正。大是缠扰，于白文不顺。若以自外来为主，都是正，反是即为匪正，岂不明白？\n本卦综大畜，二卦同体，文王综为一卦，故《杂卦》曰：“大畜，时也。无妄，灾也。”刚自外来者，大畜上卦之艮，来居无妄之下卦而为震也。刚自外来，作主于内，又性震动，又自外来，则动以人，不动以天，非至诚无虚妄矣。所以有人之眚，而“不利有攸往”也。内动而外健，故“大亨”。刚中而应，故“正”。“天命”者，至诚乃天命之实理，反身而诚者也。若自外来，岂得为“天命”？\n以卦综、卦德、卦体释卦辞。言文王卦辞“元亨利贞”之外，而又言“其匪正有眚，不利有攸往”者，以“刚自外来而为主于内”也。若本卦动而健，以刚中而应柔中，则大亨以正矣。大亨以正，实天之命也。天命实理，无一毫人欲之私，此文王卦辞所以言“元亨”也。若以外来者为主，则有人欲之私，非反身而诚，天命之实理，即“匪正”矣。欲往也，将何之哉？是以“天命不佑，有眚而不利”也。此所以文王卦辞言“元亨”而又“利贞”也。若旧注以“刚自外来”为自讼来，则非“自外来”，乃“自内来”矣。\n《象》曰：天下雷行，物与无妄。先王以茂对时育万物。\n“茂”者，盛也。物物皆对时而育之，所育者极其盛大，非止一物也，即如雷地豫之殷也。“对时”者，因雷发生万物对其所育之时也，如孟春牺牲毋用牝之类是也。“天下雷行”，震动发生，一物各具一太极，是物物而与之“无妄”者，天道之自然也。“茂对时育物”，撙节爱养，辅相裁成，使物物各遂其无妄之性者，圣人之当然也。\n初九：无妄，往吉。\n爻与彖辞不同者，爻以一爻之定体而言，《彖》以全体相综大畜而言。\n九以阳刚之德，居无妄之初，有所动，所谓动以天也。且应爻亦刚，无系恋之私，是一感一应，纯乎其诚矣。何吉如之！故占者往则吉。\n《象》曰：无妄之往，得志也。\n诚能动物，何往而不遂其心志？\n六二：不耕获，不菑畲，则利有攸往。\n“耕”者，春耕也。“获”者，秋敛也。“菑”者，田之一岁垦而方成者。“畲”者，田之三岁垦而已熟者。农家始而耕，终而获；始而菑，终而畲。“不耕获”者，不方耕而即望其获也。“不菑畲”者，不方菑而即望成其畲也。“耕”也，“菑”也，即明其道也。“获”也，“畲”也，即功也。曰“不耕获，不菑畲”，即明其道不计其功也。观《小象》“未富”可见矣。若《程传》不首造其事，《本义》无所为于前，无所冀于后，将道理通讲空了，乃禅学也。吾儒圣人之学，进德修业，尽其理之当然，穷通得丧，听其天之自然，修身俟命，此正所谓无妄也。岂一点道理不进，空空寂寂，谓之无妄哉！初为地位，二为田，故九二曰“见龙在田”。震居东，二三皆阴土，水临土上，春耕之象也。震为“禾稼”，中爻艮为“手”，禾在手，“获”之象也。中爻巽，下卦震，上入下动，“菑畲”之象也。故耒耨取诸益。\n六二柔顺中正，当无妄之时，无私意期望之心，故有“不耕获，不菑畲”之象。言虽为于前，无所望于后。占者必如此，则“利有攸往”矣。\n《象》曰：“不耕获”，未富也。\n言未有富之心也。此“富”字虽曰未有此心，然亦本于象，盖巽为市利，小畜上体乃巽，《小象》曰“不独富也”。此卦中爻巽，曰“未富”者，未入巽之位也。\n六三：无妄之灾，或系之牛，行人之得，邑人之灾。\n本卦大象离，此爻又变离。离为“牛”，牛之象也。中爻巽为“绳”，又艮为“鼻”，绳系牛鼻之象也。震为“足”，行之象也。三为人位，人在震之大涂，“行人”之象也；三居坤土，得称邑，又居人位，“邑人”之象也。此爻居震动之极，牛失之象也。又变离错坎，坎为盗，亦牛失之象也。“或”者，“假如”二字。假牛以明无妄之灾，乃六三也，即“邑人”也。\n六三阴柔不正，故有此象。言或系牛于此，乃邑人之牛也。牛有所系，本不期望其失。偶脱所系，而为“行人”所得。“邑人”有失牛之象，亦适然不幸，其非自己有以致之，故为“无妄之灾”。即象而占可知矣。\n《象》曰：“行人”得牛，“邑人”灾也。\n行人得牛而去，邑人不期望其失牛而失牛，故为“无妄之灾”。\n得牛，无妄之福也。邑人灾，无妄之祸也。爻辞单言“无妄之灾”，《小象》言“邑人”之灾，言行人得牛来，彼得此失，祸福本相因也。“也”字可味。\n九四：可贞，无咎。\n“可”者，当也。九阳刚健体，其才亦可以有为者。但下无应与，无所系恋而无妄者也。占者得此，但可守此无妄之正道，即“无咎”矣。若妄动，又不免有咎也。\n《象》曰：“可贞，无咎”，固有之也。\n“固有”者，本有也。无应与，则无系恋而无妄，则无妄乃九四之本有也。\n九五：无妄之疾，勿药有喜。\n五变则中爻成坎，坎为“心病”，疾之象也。中爻巽木艮石，“药”之象也。中爻巽综兑，悦喜之象也。意外之变，虽圣人亦不能无。但圣人廓然大公，物来顺应，来则照，而去不留，无意必固我之私，是以意外之来，犹无妄之疾。\n九五阳刚中正以居尊位，而下应亦中正，无妄之至也。如是而犹有疾，乃“无妄之疾”，不当得而得者，故勿药自愈。其象占如此。\n《象》曰：“无妄”之药，不可试也。\n“试”者，少尝之也。“无妄之疾勿药”者，以“无妄之药”不可尝也。若尝而攻治，则反为妄，而生疾矣。故不可轻试其药，止可听其自愈。\n九五刚中，中刚则外物不得而伤之。禹征有苗，犹为多事。\n上九：无妄，行有眚，无攸利。\n下应震足，行之象也。九非有妄，但时位穷极，不可行耳。故其象占如此。\n《象》曰：“无妄”之行，穷之灾也。\n无妄未有不可行者，以时位耳。与“亢龙”同，故二《小象》亦同。穷指上言。","26":"大畜时也\n“大”者，阳也。其卦乾下艮上，以阳畜阳，所畜之力大，非如巽以阴畜阳，所畜之力小，故曰“大畜”。又有蕴畜、畜止之义。《序卦》：“有无妄然后可畜，故受之以大畜。”所以次无妄。\n大畜：利贞。不家食，吉。利涉大川。\n中爻兑口在外，四近于五之君，当食禄于朝，不家食之象也。何以言食？本卦大象离，故彖辞曰“辉光日新”者，因大象离也。离错坎，又象颐，有饮食自养之象。因错坎水，中爻震木，所以有“涉大川”之象。又本卦错萃，萃大象坎。若以卦体论，四、五中空，有舟象。乾健，应四、五上进，有舟行而前之象。应乎天者，以卦德论其理也。彖辞、爻辞皆各取义不同。“贞”者，正也。利于正道，如多识前言往行，以畜其德是也。“吉”者，吾道之大行也。言所蕴畜者皆正，则畜极而通，当食禄于朝，大有作为，以济天下之险也。\n《象》曰：大畜，刚健笃实辉光，日新其德。刚上而尚贤，能止健，大正也。“不家食，吉”，养贤也。“利涉大川”，应乎天也。\n以卦德、卦综、卦体释卦名、卦辞。“刚健”者，内而存主也。“笃实”者，外而践履也。“刚健”无一毫人欲之阴私，“笃实”无一毫人欲之虚假，则暗然日章，光辉宣著，其德自日新又新，所以积小而大，以成其畜也。名“大畜”者，以此。“刚健”，乾象。“笃实”，艮象。二体相合，离象。故又言“辉光日新”。“刚上”者，大畜综无妄，无妄下卦之震，上而为大畜之艮也。上而为艮，则阳刚之贤在上矣，是尚其贤也。“止健”者，止居上而健居下，禁民之强暴也。此二者皆大正之事，所以“利贞”。若以止健为止阳刚君子，则又非大正矣。“养贤”者，食禄以养贤也。“应天”者，下应乎乾也。“天”者，时而已矣。既负蕴畜之才，又有乾健之力，所以当乘时而出，以济天下之险难也。惟刚上则贤人在上，故能“尚贤”，故能成艮而“止健”，故能兑口在外卦而“食禄于外”，故能六五得中而应乎乾。此四者，皆卦综刚上之功也。\n《象》曰：天在山中，大畜。君子以多识前言往行，以畜其德。\n“天”者，一气而已。气贯乎地中，天依乎地，地附乎天，云雷皆自地出，故凡地下空处深处皆是天，故曰“天在山中”。“多识”即大畜之意，乃知之功夫也。古圣贤之嘉言善行，皆理之所在，皆古人之德也。君子多识之，考迹以观其用，察言以求其心，则万理会通于我，而我之德大矣。此君子体大畜之功也。中爻震足，行之象。兑口，言之象。\n初九：有厉，利已。\n已，夷止反。\n乾三阳为艮所畜，故内外之卦各具其义。内卦受畜，以自止为义。以阴阳论，若君子之受畜于小人也。外卦能畜，以止人为义。以上下论，若在位之禁止强暴也。《易》主于变易，所以取义不同。“已”者，止也。“厉”者，不相援而反相挤排，危厉之道也。\n初九阳刚乾体，志于必进。然当大畜之时，为六四所畜止，而不得自伸，故往则有危，惟止则不取祸矣。故教占者必利于止也。\n《象》曰：“有厉，利已”，不犯灾也。\n“灾”即厉也。止而不行，则不犯灾矣。\n九二：舆说。\n说，音脱。，音服。\n乾错坤为舆，舆之象也。中爻兑为毁折，“脱”之象也。“舆”赖””以行，脱则止而不行矣。\n九二亦为六五所畜，以有中德，能自止而不进，故有“舆说”之象也。占者凡事不冒进，斯无尤矣。\n《象》曰：“舆说”，中无尤也。\n惟有中德，故无妄进之尤。\n九三：良马逐，利艰贞。曰闲舆卫，利有攸往。\n此爻取蕴畜之义。乾为“良马”之象。中爻震，为“作足”之马。乾马在后追逐震马之象也。两马因震动而追逐，遇艮止不得驰上，“利艰贞”之象也。中爻兑口，乾为言，“曰”之象也。乾错坤，“舆”之象也。阴爻两列在前，“卫”之象也。《考工记》车有六等：戈也、人也、殳也、戟也、矛也、轸也，皆卫名。“良马逐”者，用功如良马追逐之速也，即九三“终日乾乾夕惕若”之意。“艰”者，艰难其思虑，恐其失于太易也。“贞”者，贞固其作为，恐其失于助长也。“闲”者，习也。习其车舆，与其防卫也。闲习有优游自得之意。“曰”者，自叹其当“闲舆卫”也。言当此大畜之时，为人所畜止摧抑，果何所事哉？亦惟自“闲舆卫”，以求往乎天衢耳。“舆”者任重之物，“卫”者应变之物。以人事论，君子不当家食，以一身而任天下之重者，“舆”也；当涉大川，以一身而应天下之变者，“卫”也。必多识前言往行之理，畜其刚健笃实之德，以德为车，以乐为御，忠信以为甲胄，仁义以为干橹，涵养于未用之时，以待时而动，此“闲舆卫”之意也。“闲舆卫”又“利艰贞”之象也。旧注以不相畜而俱进，殊不知卦名大畜，下体非自止，则蕴畜也，无进之意。盖观“童牛之牿”，则知当“有厉利已”矣。观“豮豕之牙”，则知当“舆说”矣。观“何天之衢”，则知用功当“良马逐”矣。所以《小象》言“上合志”，所以当取蕴畜之义。惟蕴畜，方能畜极而通“何天之衢”。\n九三以阳居健极，当大畜之时，正多识前言往行、用功不已之时也，故有良马追逐之象。然犹恐其过刚锐进，惟当艰贞，从容以待时，故又有“曰闲舆卫”之象。如是自然畜极而通，“利有攸往”矣。故教戒占者必当如此。\n《象》曰：“利有攸往”，上合志也。\n“上合志”者，谓上九之志与之相合也。三与上九情虽不相孚，然皆居二体之上，其志皆欲畜极而通，应与之志相合，所以“利有攸往”。\n六四：童牛之牿，元吉。\n“童”者，未角之称。“牿”者，施横木于牛角以防其触。此爻变离，离为牛，牛之象也。艮本少，又应初，“童牛”之象也。变离错坎，“牿”之象也。艮手，中爻震木，手持木而施之角，亦“牿”之象也。\n六四艮体居上，当畜乾之时，与初相应，畜初者也。初以阳刚居卦之下，其势甚微，于此止之，为力甚易，故有“牿童牛”之象。占者如此，则止恶于未形，用力少而成功多，大善而吉之道也，故“元吉”。\n《象》曰：六四“元吉”，有喜也。\n上不劳于禁制，下不伤于刑诛，故“可喜”。四正当兑口之悦，“喜”之象也。\n六五：豮豕之牙，吉。\n豮，音焚。\n本卦大象离，离错坎，豕之象也。五变，中爻又成离矣。“豮”者，犗也，腾也，乃走豕也。与“童牛之牿”一句同例。“童”字与“豮”字同，“牿”字与“牙”字同。中爻震足性动，“豮”之象也。“牙”者，《埤雅》云“以杙系豕也”，乃杙牙，非齿牙也。杜诗“凫雏入桨牙”，坡诗“置酒看君中戟牙”，荆公“磋牙死树鸣老乌”，《阿房赋》“檐牙高啄”，又将军之旗曰“牙”，立于帐前谓之“牙帐”，所以蜀人呼棹牙、凳牙、床牙，则“牙”字古今通用，非齿牙也。《诗》：“椓之丁丁。”丁丁，杙声也。以木入土，所以有声也。今船家系缆桩谓之橜，亦曰“杙牙”者，桩上杈牙也。盖以丝系矢曰弋，故从弋。所以绳系木曰杙。变巽为绳，系之象也。巽木，杙之象也。言以绳系走豕于杙牙也。旧注因宫刑或曰犗刑，遂以为去其势，但天下无啮人之豕，所以此“豮”字止有腾字意，无犗字意。牛、马、豕皆人之所畜者，故大畜并言之。\n六五以柔中居尊位，当蓄乾之时，畜乎其二者也，故有“豮豕之牙”之象。占者如此，则强暴梗化者，自屈服矣，故吉。\n《象》曰：六五之“吉”，有庆也。\n“庆”即喜。但五君位，所畜者大，故曰“庆”，即一人有庆也。\n上九：何天之衢，亨。\n此畜极而通之义。“何”，胡可切，音荷，儋也，负也。儋即担字，杨子儋石是也。《诗》“何蓑何笠”，皆音荷。《灵光赋》“荷天衢以元亨”，《庄子》“背负青天”，皆此意。郑康成亦言“肩荷”是也。上阳一画象担，二阴垂亸于两边，有担挑之象，言一担挑起天衢也，即陈白沙所谓“明月清风作两头，一挑挑到鲁尼丘”也。因卦体取此象，上为天位，天之象也。四达谓之衢。艮综震为“大涂”，衢之象也。以人事论，天衢乃朝廷政事之大道也。观《小象》曰“道大行”，可知矣。\n畜之既久，其道大行，正“不家食”，担负庙廊之重任，“涉大川”，担当国家之险阻，此其时矣，故有“何天衢”之象。占者得此，亨可知矣。\n《象》曰：“何天之衢”，道大行也。\n“道大行”者，“不家食”，“涉大川”，无往而莫非亨也。“道”字即“衢”字。","27":"颐养正也\n“颐”，口旁也。口食物以自养，故取养义为卦。上下二阳内含四阴，外实内虚，上止下动，故名为“颐”。《序卦》：“物畜然后可养，故受之以颐。”所以次大畜。\n颐：贞吉。观颐，自求口实。\n本卦大象离目，观之象也。阳实阴虚，实者养人，虚者求人之养。“自求口实”者，自求养于阳之实也。震不求艮，艮不求震，惟自求同体之阳，故曰“自求”。爻辞见之。\n《彖》曰：颐，“贞吉”，养正则吉也。“观颐”，观其所养也。“自求口实”，观其自养也。天地养万物，圣人养贤以及万民。颐之时大矣哉！\n释卦辞极言养道而赞之。“观其所养”者，观其所以养人之道正不正也，指上下二阳也。“观其自养”者，观其求口实，以自养之正不正也，指中间四阴也。本卦颐原从口，无养德之意，惟颐养得正，则养德即在其中矣。不但养人、自养，以至天地圣人养万物、养万民，无非养之所在。故曰“颐之时大矣哉”。与大过、解、革同。\n《象》曰：山下有雷，颐。君子以慎言语，节饮食。\n“帝出乎震”，万物得养而生。“成言乎艮”，万物得养而成。君子“慎言语”以养其德，“节饮食”以养其体。言语饮食，动之象；慎也，节也，止之象。此处方说出养德。\n初九：舍尔灵龟，观我朵颐，凶。\n舍，音捨。\n大象离，龟之象也。应爻艮止，中空，“灵龟”止而不食，服气空腹之象也。“朵”者，垂朵也。震反生，朵之象也。垂下其颐以垂涎，乃欲食之貌也。“尔”者，四也。“我”者，初也。“灵龟”以静止为养，“朵颐”以震动为养，故尔四而我初。大象离目，又观之象也。\n初九阳刚，乃养人者也。但其位卑下，不能养人及民，又乃动体，当颐养之初，正上止下动之时，惟知有口体之欲，舍六四而不养，故有“舍尔灵龟，观我朵颐”之象。饮食人贱，凶之道也。故其占如此。\n《象》曰：“观我朵颐”，亦不足贵也。\n饮食之人，则人贱之，故“不足贵”。\n六二：颠颐，拂经于丘颐，征凶。\n“颠”者，顶也，指外卦也。“拂”者，除也，去也，违悖之意。诸爻皆求养于同体之阳，不从应与，故有“颠拂”之象。“颠颐”者，求养于上也。“拂经”者，违悖养于同体之常经也。山阜曰丘，土之高者，艮之象也。“于丘颐”者，求养于外，即颠颐也。“凶”者，求食于权门，必见拒而取羞也。\n六二阴柔不能自养，必待食于阳刚。然震性妄动，不求养于初，而求养于外，则违养道之常理，而行失其类矣。故教占者，当求养于初。若“于丘颐”，不惟不得其养，而往则凶也。故其象占如此。\n《象》曰：六二“征凶”，行失类也。\n不重“失类”“行”重凡行而求食者，止为口腹计，自然不慎失类矣。\n养道各从其类。二、三养于初，四、五养于上，今二颠颐，往失其类矣，故曰“失类”。曰“行”者，震足之象也。\n六三：拂颐，贞凶，十年勿用，无攸利。\n“拂颐”者，违拂所养之道，不求养于初，而求养于上之正应也。“贞”者，正也，上乃正应，亦非不正也。“十年”者，中爻坤土之成数也。口容止，所以下三爻养于动者皆凶，上三爻养于止者皆吉。\n六三阴柔不中正，本乃动体，至三则动极而妄动矣，故有“拂颐”之象。占者得此，虽正亦凶，至于“十年”之久，理极数穷，亦不可往，其凶至此。\n《象》曰：“十年勿用”，道大悖也。\n震为“大涂”，“道”之象也。“大悖”即“拂颐”。\n六四：颠颐，吉。虎视眈眈，其欲逐逐，无咎。\n眈，都含切。\n“颠”者，顶也，与六二同。“颠颐”者，求养于上也。“吉”者，得养道之常经也。艮为虎，虎之象也。天下之物，自养于内者莫如龟，求养于外者莫如虎。龟自养于内，内卦初舍之，故凶；虎求养于外，外卦上施之，故吉。爻辞之精至此。“眈”者，视近而志远也。变离目，视之象也。应爻初为地位，虎行垂首，下视于地，视近也，而心志乃求养于天位之上，志远也，故以“眈”字言之。视下卦，“眈”也；志上卦，“眈”也，故曰“眈眈”。阴者，“人欲”之象也。下卦二阴，欲也；上卦二阴，欲也。人欲重叠追逐而来，故曰“逐逐”。“眈”者，四求养于上也；“逐”者，上施养于四也。\n六四当颐养之时，求养于上，故有“颠颐”之象，吉之道也，故占者吉。然四求养于上，上施养于四，四得所养矣，故又有视眈欲逐之象。以求养而得逐逐之欲，似有过咎矣，然养得其正，故占者不惟吉，而又“无咎”也。\n《象》曰：“颠颐”之吉，上施光也。\n施，去声。\n“施”，及也，布散惠与之义。详见乾卦“云行雨施”，言上养及于四也。“光”者，艮笃实光辉，其道光明也。变离日，亦光之象也。\n六五：拂经，居贞吉，不可涉大川。\n“拂经”者，五与内卦为正应，亦如二之求养于上，违悖养于同体之常道也，故二五皆言拂经。“居”者，静以守之也。“贞”者，求养于同体之阳，乃任贤养民之正道也。“吉”者，恩不自出，而又能养人也。“不可涉大川”者，言不可自用以济人也。涉川，必乾刚。五柔，故“不可涉”。\n六五居尊，能自养人者也。但阴柔不正，无养人之才，又与内卦为正应，故亦有“拂经”之象。然养贤及民，君道之正，故教占者顺以从上，守此正道则吉。不可不量己之力而当济人之任也。\n五君也，上臣也。六柔而九刚，必待养于同体之阳，以君而待养于臣，故曰“拂经”，如唐德宗待韩滉之粟以养之也。\n《象》曰：“居贞”之吉，顺以从上也。\n中爻坤顺，故曰“顺”，言顺从上而养人也。\n上九：由颐，厉吉，利涉大川。\n“由”者，从也。九以阳刚居上位，是天下之养皆从上九以养之也。“厉”者，上而知君赖我以养也，则恐专权僭逼，而此心无一事之或忽。下而知民由我以养也，则常握发吐哺，而此心无一时之或宁，此上九之所谓厉也。故戒之以厉，而后许之以吉也。凡《易》言涉大川，取乾者，以卦德也，以乾天下至健，德行恒易以知险也，需、同人、大畜是也。取水、木者以卦体也，涣、蛊、未济、谦，或取中爻，或取卦变是也。取中虚者以卦象也，益、中孚、颐是也。五“不可涉大川”，上九“利涉大川”，方见五赖上九以养人。\n上九以阳刚之德居尊位，六五赖其贤以养人，故有“由颐”之象。然位高任重，必厉而后吉，即天下有险阻，亦可以济之而不失其养也。其占又如此。\n《象》曰：“由颐，厉吉”，大有庆也。\n得所养，下之庆，亦君上之庆，故“大”。","28":"大过颠也\n“大过”，“大”者，阳也，阳过于阴也。乾坤也，坎离也，山雷也，泽风也，此八卦也，乾与坤错，坎与离错，泽风与山雷相错，风泽与雷山相错，六十四卦唯此八卦相错，其余皆相综。泽本润木之物，今乃灭没其木，是“大过”矣。又四阳居中过盛，此所以名“大过”也。不然，四阳之卦亦多，何以不名“过”？因其居中，相聚而盛，所以得名也。《序卦》：“颐者，养也。不养则不可动，故受之以大过。”所以次颐。\n大过：栋桡。利有攸往，亨。\n桡，乃教反。\n梁上屋脊之木曰“栋”，所以乘椽瓦者也。木曲曰“桡”，本末弱而栋不正，有如木之曲也。椽垂亸以渐而下曰宇。此卦大象坎，坎为栋。坎主险陷，桡之象也。又为矫揉，亦桡曲之象也。若以理论，本弱则无所承，末弱则无所寄附，此卦上缺下短，亦有桡之象。既“栋桡”矣，而又“利有攸往”，何也？盖桡以成卦之象，言“利有攸往亨”，则以卦体、卦德之占言。\n《彖》曰：大过，大者过也。“栋桡”，本末弱也。刚过而中，巽而说行，“利有攸往”，乃“亨”。大过之时大矣哉！\n说，音悦。\n以卦体、卦德释卦名、卦辞而叹其大。阳大阴小，本卦大者过，故名“大过”。本谓初，末谓上，弱者阴柔也。古人作字，本末皆从木来，木下加一画阳，取根株向荣，故为“本”，木上加一画阳，取枝叶向荣，故为“末”。“刚过”者，四阳也。“而中”者，二、五也。三、四亦可言中，故复卦四曰“中行”，益卦三、四皆曰“中行”也。巽而悦行者，内巽而外行之以悦也。若以人事论，体质本是刚毅，足以奋发有为，而又用之以中，不过于刚。德性本是巽顺，足以深入乎义理，而又行之以和，不拂乎人情，所以“利有攸往乃亨”。大过之时者，言人于“大过之时”，行大过之事，适其时当其事也。如尧舜禅受，汤武放伐，虽过其事，而不过乎理是也。盖无其时不可过，有其时无其才亦不可过，故叹其大，与颐、解、革同。\n《象》曰：泽灭木，大过。君子以独立不惧，遁世无闷。\n上一句大过之象，下二句大过之行。非达则不惧，穷则无闷也。穷亦有“独立不惧”之时。“不惧”者，不求同俗，而求同理，天下非之而不顾也。“无闷”者，不求人知，而求天知，举世不见知而不悔也。此必有大过人学问，义理见得明，有大过人操守，脚根立得定，方干得此事。\n初六：藉用白茅。无咎。\n“藉”者，荐也，承荐其物也。因上承四刚，故曰“藉”。“茅”者，草也。巽阴木为茅，故泰卦变巽曰“茅”，否卦大象巽亦曰“茅”。巽为白，“白茅”之象也。“无咎”者，敬慎不败也。\n初六当大过之时，阴柔已能慎矣。又居巽体之下，则慎而又慎者也。亦如物不错诸地而有所藉，可谓慎矣。而又藉之以茅，茅又用夫白，白则至洁之物矣，是慎之大过者也。故有此象。然慎虽大过，以其居大过
