难，而后出之，故曰以蒙大难。坤为黑，坎为隐伏，明伏地下，故曰晦其明。坎在下，故曰内难。坎为志，为正，故曰内难而能正其志。震为子，为箕，故曰箕子。《易林》贲之屯云：章甫荐屦，箕子佯狂。以《屯》震为箕子也。箕子，纣诸父，故曰内难。纣囚箕子，箕子佯狂为奴，晦明不用，仅以身免，故曰箕子以之。以，用也。（《易》凡于人名、地名，无不从象生。除焦延寿外，无知此者。震箕象形，《易林》屡用。 ）\n象曰：明入地中，明夷；君子以莅众，用晦而明。\n坤为众，震为君子。莅众，谓三也。用晦而明，言君子处明夷之世，仍自昭明德也。\n初九，明夷于飞，垂其翼。君子于行，三日不食。有攸往，主人有言。\n此与《师》六五义同也，辞在五而象全在应。初应在四，四体震。震为飞、为翼，坤为下，故曰垂其翼。震为君子，为行；数三，离日，故曰三日。震为口、为食，坤闭，故三日不食。震为往，为主人，为言，故曰有攸往，主人有言。盖初虽应四，而为三所阻格，故飞则不能高，行则不得食，凡有所往，而为主人所恶，责让不安。《左传》僖十五年，晋筮遇《归妹》之《睽》曰：西邻责言。以《归妹》上震为责言也。震言外向，与我相背，故曰责言。兹曰有言，与责言义同也。《易林》同人之坎云：鼓其羽翼，飞上乔木。以《坎》中爻震为鼓，为飞，为羽翼。又《易林》蒙之艮云：攫饭把肉，以就口食。以《艮》中爻震为口、为食也。《易·颐》象曰：自求口实。以《颐》下震为口食也。乃震飞、震翼、震口之象皆失传，旧解皆以属之离。离在地下，且为初爻，胡能飞哉？若食象，益茫然不知所指。\n象曰：君子于行，义不食也。\n初潜龙勿用，况当明夷之世？方自晦之不暇，当然不得禄食也。\n六二，明夷于左股，用拯马壮吉。\n《释文》云：股，马、王肃作般。孙堂云：般，盘之省。汉碑盘字常作股，股常作般。然则马、王虽作般，义仍作股。以汉时般、股通用不分也。互震为左，巽为股，巽伏不见，故曰夷于左股。三震为马。拯，郑云承也。《子夏传》作抍，仍音承。用拯马壮吉者，言二承三，三阳，故壮吉也。旧解独惠栋谓马谓三；而谓三抍二故壮，则又非。承者顺，谓阴顺阳。《象》释曰顺，即释拯义也。\n象曰：六二之吉，顺以则也。\n则者法也，阴以阳为则。顺以则，谓阴顺阳，释拯马之义也。乃旧解皆不知其所谓，故愈说愈晦。岂知《象》以解经，顺即谓拯也。\n九三，明夷于南 （句 ） ， 狩 （句 ） ， 得其大首。不可疾 （句 ） ， 贞。\n三遇坤，坤为夜、为黑，震为南。《左传》成十六年，晋筮遇《复》曰：南国蹙。以坤为国，震为南也。三南遇坤，故曰明夷于南。震为狩、为大，坎为首、为获，故曰得其大首，言得其渠率也。《诗·大雅》：昊天疾威。《传》：疾，犹急也。不可疾，言虽得其大首，不可持之过急也。贞，谓宜安定也。疾与贞相对为义。旧读疾贞连文，《九家》谓不可疾正，最为害理。独项氏《玩辞》，以贞自为句，与经义合。又旧读以南狩连文，义亦不协。\n象曰：南狩之志，乃大得也。\n阳遇阴，故大有得。\n六四，入于左腹，获明夷之心，于出门庭。\n震为左。坤为腹，为门庭，为心。四坤体，故曰入于左腹。坤暗，故曰获明夷之心，于出门庭。震为出。言行至四入坤。悉明夷之故，正在于是也。四当位有应，故无吉凶。坤心之象，《益》九五云：有孚惠心。心谓二，二坤体也。又《益》九五《象》云：大得志。志亦谓坤。故《易林》需之否云：志如死灰。以坤为死，为志。人第知坎为心志，不知坤亦为心志，故《易》辞多误解。\n象曰：入于左腹，获心意也。\n坤为心意，故曰获心意。旧解多以三升五成坎为心意，穿凿无理，不可从。\n六五，箕子之明夷，利贞。\n震为箕子已见前。据《易林》，此箕子则孩子也。夬之中孚云：道路不通，孩子心愦。以《中孚》互震为孩子。又家人之巽云：孩子贪饵。以伏震为孩子。又损之大畜云：婴儿孩子，未有知识。以《大畜》上艮为婴儿，互震为孩子。凡《易林》取象，无不本之《易》。《易》他处无孩子象也。宋吴棫《韵补》云：古亥字音喜，亦音其。按亥字既读为其，则其字亦必读为亥。《淮南子·时则训》：爨萁燧火。高诱注：萁读为该备之该。即爨该燧火也。萁既读为该，于是亥、孩、刻、荄，与其、箕常通用。《书·微子》：我旧云刻子。《论衡》作我旧云孩子。孩子谓纣，言久知其愚蒙昏愦也。是应为孩子，而作刻子。《墨子·非攻篇》：纣播弃黎老，贼诛孩子。是孩子即箕子。古之所谓诛，不尽是杀。贼诛孩子，即幽囚箕子也。是应为箕子，而作孩子。故此处六五之箕子，汉赵宾又作荄兹。夫《墨子》以孩子作箕子，则《明夷》六五之箕子，《易林》作孩子，正与《墨子》合，与《论衡》同。孩子皆谓纣也。孩、箕、刻、荄，皆非讹字，以音同古通用。犹磐桓之磐，或作盘，作槃，作般，皆非讹字也。《易林》云：婴儿孩子，未有知识。释孩子之义也。六五天子位，孩子之明夷，谓纣昏蒙。惟其指纣，故《彖传》推及于文王、箕子。不然，《彖传》之箕子，胡以无一异读哉？故《易林》姤之明夷云：西戎为疾，幽君去室。《明夷》六五君位，坤黑，故曰幽君。坎为室，六五在坎外，故曰幽君去室。幽君即释孩子之义。又困之明夷：邃 作云，蒙覆大臣。坤为云，亦释昏蒙之义。又《京房易传·明夷》云：君暗臣明，不可止。君暗谓六五，臣明谓六二，亦以五为君，不以为纣臣。又《象传》曰：孩子之贞，明不可息也。贞，正也。言孩子居天子之正位，天子一日万几，故明不可息。若箕子，已晦其明矣，有何不可息？古今释者千百家，于此语未有能通者。盖文王与微子，不欲明斥纣，故以孩子为代名，犹《麦秀歌》之谓狡童也。观《墨子》以箕子为孩子，则此之箕子，亦为孩子。《易林》之读，独得其真。自孩、箕音同通用之义弗明，竟作纣臣矣！岂知孩子即谓纣，与《微子》之孩子同。彼夫赵宾作荄兹，刘向、荀爽作荄滋，蜀才作其子，王弼作其兹，惠栋作亥子，虽与《象传》义不合，然皆知作纣臣之必非。乃孔疏不从王注，而从马融，竟作纣臣解，疏已。五本君位，马融作纣臣解，亦知其不安，而以箕子演畴，有君德为解，益可证《易林》以孩子为纣之精。五承乘皆阴，下又无应，故曰利贞。谓宜艰贞自守不妄动也。\n象曰：箕子之贞，明不可息也。\n五为天子。天子一日万几，明息则政乱矣，故曰明不可息。\n上六，不明晦。初登于天，后入于地。\n《明夷》之初为晋，晋日在地上而为昼，故曰初登于天。乃《晋》覆成《明夷》，日在地下而为夜，故曰后入于地。入地故晦而不明。卦正如彼，覆则如此，此文王示《序卦》之义也。\n象曰：初登于天，照四国也。后入于地，失则也。\n坤为国，震卦数四，故曰四国。则，谓三。上为四五所格，不能应三，故曰失则。此则字与六二顺以则，《谦》六四不违则义同，皆谓阳。旧解皆不知失则之故何在，泛说之，非。","37":"家人卦第三十七\n家人，利女贞。\n《归藏》曰散家人。卦以一阳一阴散处于卦内，又上卦巽风，下卦火炎上，均有散意，故以为名乎？马融曰：家人以女为奥主，长女中女各得其正，故曰利女贞。然《彖传》曰：男正位乎外。似家人兼男女言，特女贞尤利耳。又考《太玄》拟家人为居，云：躆肤赫赫，为物城郭，万物咸宅。是以《家人》初上爻皆阳，故曰肤，曰城郭，而人宅其中，故曰家人也。义似较各家为优。二四得正，承阳有应，故利于女子之占也。\n彖曰：家人，女正位乎内，男正位乎外。男女正，天地之大义也。家人有严君焉，父母之谓也。父父，子子，兄兄，弟弟，夫夫，妇妇，而家道正。正家而天下定矣。\n女正位乎内谓二，男正位乎外谓五。二五者夫妇，即天地也，即父母也。父母皆得正位，故曰严君。严君者，尊也。卦下五爻皆得正，故曰父父，子子，兄兄，弟弟，夫夫，妇妇。初震爻，震为子，为兄，为夫。三艮爻互坎，坎、艮皆为弟。巽为妇。父子兄弟夫妇皆得正，则家正。家齐则国治，故曰天下定。\n象曰：风自火出，家人；君子以言有物，而行有恒。\n巽木生火，火动生风，故曰风自火出。物，孔疏云：事也。按《周礼·地官·司门》：几出入之不物者。注：衣服视瞻，不与众同；及所操物，不如品式者。然则不物即违常，即不法也。言有物者，即言不离乎经常也。\n初九，闲有家，悔亡。\n《释文》：马云，闲，阑也，防也。离中虚外坚，故离有闲义。即《太玄》所谓为物城郭也。能闲其家，故悔亡也。荀、郑训闲为闲习，似非。\n象曰：闲有家，志未变也。\n初应在四，四体坎，坎为志。志未变者，言初与四为正应，无敢或渝，所谓行有恒而家道正也。其以遯为说者，皆因不得解而穿凿也。\n六二，无攸遂，在中馈，贞吉。\n《礼·月令》：百事乃遂。注：遂，犹成也。《公羊传》桓八年：大夫无遂事。注：遂，专事也。坤道无成，六二应五承三，顺以巽可矣，不必专事也，故曰无攸遂。六二得中，故曰在中馈。馈，饷也。《周礼·天官》：膳夫掌王之馈。注：进食于尊曰馈。在中馈者，言坤道顺从，无敢专事，职供中馈，酒食是议也。贞吉者，卜问吉也。\n象曰：六二之吉，顺以巽也。\n顺以巽，言承三应五也。\n九三，家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。\n《释文》：嗃嗃，马云悦乐自得貌。荀作确确。按离外坚，荀读是也。嘻嘻，郑云：骄佚笑乐之意。然同在一爻，吉吝不同者，盖三居离上，离外坚，有坚确自守，安不忘危之意，故曰家人嗃嗃。嗃嗃则守正安常，故厉而吉也。而三前临巽风，巽为妇，为进退，为躁动，为声应，故曰妇子嘻嘻。嘻嘻则悦而淫矣，故曰终吝。嗃嗃之象下取离，嘻嘻之象上取巽。诚以同此一爻，或吉或吝，必有其故。而先儒无言者，探测如此。\n象曰：家人嗃嗃，未失也。妇子嘻嘻，失家节也。\n失、佚古通。未佚者，言不敢放逸也。若嘻嘻，则淫佚而不中节矣，故曰失家节。失，下读得失之失，上读佚，以与节韵。\n六四，富家，大吉。\n乾为富。四承重阳，当位有应；体坎，坎为室家，故曰富家大吉。凡上卦为巽，四当位，无不吉者。如《小畜》、《观》、《益》、《巽》、《涣》、《中孚》，六四皆吉。惟不当位者，虽临重阳，不尽吉也。此《易》例也。虞翻强命三变成艮，最为害理。三当位，胡为使失正哉？\n象曰：富家大吉，顺在位也。\n言富之故，以顺阳也。五得位，故曰顺在位。\n九五，王假有家，勿恤，吉。\n五天子，故曰王。假，《释文》：更白反，注至也。案《虞书》：格于上下。《传》：格，至也。是王弼、陆德明皆读假为格。与《萃》之王假有庙同。王假有庙，言王以至诚感格神明；王假有家，言王以至德感格家人。无有不正，故无所忧而吉也。\n象曰：王假有家，交相爱也。\n交相爱，谓二五交孚，即释格义。诸家皆释假为大，与交相爱之义相去甚远。故唯王注为得也。\n上九，有孚，威知，终吉。\n上九居家之上，为全家所翊戴，故曰有孚，曰威如。上居卦终，故曰终吉。\n象曰：威如之吉，反身之谓也。\n巽究成震，震为威。言震巽相反覆，故曰反身。虞翻命三变成阴，以说反身。三当位，胡能使变？乃惠栋不知其强说，谓《蹇》上六志在内为反身。夫蹇三、上，皆当位有应与。若《家人》则三上皆阳，《艮》传所谓敌应也，上胡能反三哉？","38":"睽卦第三十八\n睽，小事吉。\n《归藏》作瞿。《说文》：鹰隼视也。《礼·玉藻》：视容瞿瞿。注：惊视不审貌。夫惊而惧，视而不审，则视象必至乖违明矣。至《周易》曰睽，义与瞿略同。睽，乖也。《说文》：目不相听也。卦三至五两目相背，相背则视乖。听，从也。不相从，则一目视为彼，一目视为此，如三、上所言是也。盖卦之得名，全以卦象。《六书故》：睽，反目也。与《说文》义同。自反目之义失，旧解于三、上爻辞皆莫详其故矣。小谓阴。六五得中有应，故小事吉也。\n彖曰：睽，火动而上，泽动而下。二女同居，其志不同行。说而丽乎明，柔进而上行，得中而应乎刚，是以小事吉。天地睽而其事同也，男女睽而其志通也，万物睽而其事类也。睽之时用大矣哉！\n火性炎上而即居上，水润下而即居下，愈去愈远，故二女同居不同行。坎为志也。然所以睽者，以同为女也。若夫天地男女，其形虽睽隔，而其功用无不和合而同也，其心志无不相感而通也。即推而至于万物，若繁赜不可计数矣，然只有物即有阴阳，有牝牡，阴阳牝牡则必合而为类无疑也。故睽亦有时有用也。\n象曰：上火下泽，睽；君子以同而异。\n同者同为女，异者不同行。君子法之，不拘于一。\n初九，悔亡，丧马，勿逐自复。见恶人，无咎。\n震为马。兑二折震，震毁，故曰丧马。震为复。二必升五，升五则下成震，故曰自复。离为恶人，初前遇之，兑见，故曰见恶人。盖初居潜龙之位，勿用之时，居易俟命，无所动作，故悔亡而无咎也。\n象曰：见恶人，以辟咎也。\n言无咎之故，在辟之也。\n九二，遇主于巷，无咎。\n五为卦主。《丰》九四云遇其夷主，是也。二应之，离为巷，故曰遇主于巷。有应得中，故无咎。离巷象失传。《易林》无妄之小畜云： 鰕去海，游于枯里；街道迫狭，不得自在。《小畜》上巽为鱼，故曰 鰕。乾为海，巽在外，故曰去海。离为枯，为里，为街巷。《说文》：巷，里道。《诗·郑风》：巷无居人。《传》曰：巷，里涂。离上下阳，中虚，俨然里巷也。巷为里道，故《象》曰未失道。巷象失传，故旧解无不误，不足怪也。\n象曰：遇主于巷，未失道也。\n得应，故曰未失道。\n六三，见舆曳，其牛掣，其人天且劓。无初有终。\n兑为见，坎为舆，为曳。坎舆在前，而三居坎后，故曰见舆曳。互离为牛。掣，郑作 ，云牛角皆踊也。踊，起也。《说文》作觢，云角一仰一俯。《子夏传》作 ，云一角仰。案， 、觢同字，皆音挚，义皆同。又《易林》大畜之睽云：伤破妄行，触壁觝墙。亦以角踊为说，不以滞隔为训。只王弼作掣，音与诸家同，义与诸家异，非也。其牛 者，言牛角腾踊上出也。天，马融云：黥凿其额曰天。虞翻云：黥额为天，割鼻为劓。黥即古之墨刑。马云黥凿，殆误也。艮为额、为鼻，艮伏不见，故曰劓。兑上毁缺，故曰天。惟古刑无名天者。俞樾云：天为兀字。古文天作 ，以形近，故兀讹为天。《庄子》云：鲁有兀者。《释文》云：刖足曰兀。其人兀且劓，犹《困》九五曰劓刖也。按三震象半见，故曰刖足。俞氏之说或是也。又胡安定云：天当作而。古文相类，传写遂误。在汉法，有罪髡其鬓发曰而。又《周礼·梓人》：作其鳞之而。亦谓髡其鬓发。按之而，注训为颊 ，《释文》云秃也。《玉篇》亦训 为秃。贾疏亦无髡其鬓发之解。然 之为秃，字书皆同。则而者秃也，秃则天然无发，不必受刑。似胡说不如俞说优也。三不当位，故初不吉。有应承阳，故曰有终。\n象曰：见舆曳，位不当也。无初有终，遇刚也。\n位不当故无初，遇刚故有终。\n九四，睽孤，遇元夫，交孚，厉无咎。\n坎为孤，为夫。虞翻强令四变成震，以取夫象。岂知《左传》襄二十四年，筮遇《困》之《大过》，坎变巽，曰夫从风。以坎为夫也。坎者乾元之精，故曰元夫。《比》曰元永贞，是其义也。四上下皆阴，故曰交孚。坎险，故曰厉。交孚则志行，故厉无咎。\n象曰：交孚无咎，志行也。\n坎为志。志行，言阳得阴则孚也。此爻旧解，皆用虞氏爻变取夫象，信汉儒不信《左氏》，岂不异哉！\n六五，悔亡，厥宗噬肤，往何咎？\n《同人》六二云：同人于宗。以五阳为宗。宗，主也。《坤》先迷后得主是也。兹以九二为宗。艮为肤，以刚在外也，故离亦为肤。二兑体，兑口逼近离肤，故曰厥宗噬肤。然二为正应，二五相上下，各得位，故往无咎。离肤象，《易林》师之井云：范子妙材，戮辱伤肤。《井》互离，兑毁折，故曰戮辱。离兑连体，故伤肤。是焦氏以离为肤也。《井》中爻亦《睽》也。\n象曰：厥宗噬肤，往有庆也。\n得阳应，故曰有庆。\n上九，睽孤，见豕负涂，载鬼一车。先张之弧，后说之壶。匪寇，婚媾。往遇雨则吉。\n睽为反目，目反故所见不同，一目见为豕，一见为鬼；一目见张弧而惧，一见说壶而喜；一见为寇，一见为婚媾也。见字统全爻而言，反目之精神全出。旧解若只见豕负涂者，由不知《睽》之取象在反目也。离为见。互坎为豕，为涂，为车，为鬼。坎数一，故曰一车。坎为弧，为矢，张弧则欲射我矣。离为壶。说，遗也。而坎为酒。遗我以壶酒，则意善也。坎为寇。三虽坎体，而应上九，则婚媾也，寇则非矣。兑为雨，上往居三，故曰遇雨。三上相上下，各当位，故吉。上之内，宜曰来。然《蹇》五往外也，曰朋来；《需》三往上也，曰三人来，盖自本位言则曰来，去本位言则曰往，不能执也。壶，王弼作弧。兹从京、马、郑、王肃、翟子玄。说，《释文》：始锐反，音税。\n象曰：遇雨之吉，群疑亡也。\n坎为疑，疑之故全在坎。上往三成《大壮》，天雷一震，坎象消释，故曰群疑亡。坎为众，故曰群疑，即上所见诸象也。","39":"蹇卦第三十九\n蹇，利西南，不利东北。利见大人，贞吉。\n重坎，故曰蹇。坤在西南，五往居坤中，得中有应，故曰利西南。艮居东北，三阳穷于上而多凶，故不利东北。大人谓五，往得尊位，故利于出见。《传》所谓往有功也。往五当位，居中，故贞吉。\n彖曰：蹇，难也，险在前也。见险而能止，知矣哉！蹇利西南，往得中也。不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉！\n坎险艮止，故曰见险而能止。此卦义也。虞翻于利不利之故，盖茫然莫解，复以《参同契》月出庚之说解利西南，月灭癸之说解不利东北。岂知兹所谓西南确指坤位，坤为邦，五居坤中，故曰正邦。而翻则曰月生西南。夫月于三日出庚，庚岂西南哉？真管辂所谓美而伪也。\n象曰：山上有水，蹇；君子以反身修德。\n见险而止，反身修德，以俟之而已。《文言》云进德修业，《乾》三云君子终日乾乾夕惕若，修德之事也。艮为身。反身者，反而求诸己，不徒止而不前也。艮身象，《艮》彖云：艮其背不获其身。以艮为身也。故《易林》需之坎云：名困身辱，劳无所得。《坎》中爻艮，艮为名，为身，坎隐伏，故名困身辱。虞翻用卦变，以坤为身，不知艮亦为身也。\n初六，往蹇，来誉。\n四不应，二至四坎，初临之，故往蹇。来居初，静而不动，则有誉也。艮为名，故曰誉。\n象曰：往蹇来誉，宜时也。\n宜时，《正义》作宜待。《释文》云：张氏作宜时。郑本作宜待时。虞同。兹从张氏。艮为时。宜时者，谓时宜如此也。阮校云：《石经》待也二字漫漶。而不言上有宜字。可见郑、虞读似非。\n六二，王臣蹇蹇，匪躬之故。\n艮为臣，五为王，二应五，故曰王臣。艮为僮仆，古臣、仆不分，故艮亦为臣。二临重坎，故曰王臣蹇蹇。蹇蹇，言劬劳也。艮为躬。匪躬之故，言所以劬劳如此者，乃从王事，匪为私也。艮臣象，《损》上九云：得臣无家。《小过》六二云：遇其臣。《遯》六三云：畜臣妾吉。皆以艮为臣也。\n象曰：王臣蹇蹇，终无尤也。\n有应，故无尤。尤古音怡，《诗·鄘风》：大夫君子，无我有尤。与下之协。此与上时、下之协，与《诗》同。故《正义》上象作宜待非。\n九三，往蹇，来反。\n往遇险，反据下二阴则利也，故曰往蹇来反。\n象曰：往蹇来反，内喜之也。\n内谓下二阴，阴欲承阳，故曰内喜之。释来反之故也。\n六四，往蹇，来连。\n《正义》：马云连亦难也。王弼云：往来皆难，是亦训连为难。盖四居上下坎之间，故往来皆难。荀爽谓与至尊相连，朱子谓连于九三者，皆非也。又《屯》上六云：泣血涟如。《淮南子》引作连如。盖与此义同，亦连为难之一证。\n象曰：往蹇来连，当位实也。\n坎为实。当位实者，言四位当，惟所值上下皆实，故进退难也。坎刚中，故为实。《易林》屯之师云：李梅冬实。《师》震为李梅，坎为冬为实也。旧解皆以乾为实，致此句义不明了。岂知此实字谓坎。上下坎，方能明来往皆难之义也。\n九五，大蹇，朋来。\n当位居尊，故曰大蹇。阴以阳为朋，阳往阴中，故曰朋来。虞翻以下卦伏兑为朋。岂知《象传》曰中节，即谓五居坤中，如合符节，释朋义也。\n象曰：大蹇朋来，以中节也。\n言五在阴中，阴阳相遇，如符节之合。\n上六，往蹇，来硕。吉，利见大人。\n上穷，故往蹇。来硕谓应三，三阳故曰硕。《尔雅·释诂》：硕，大也。阳大，故曰硕。利见大人，谓顺五，五为大人。\n象曰：往蹇来硕，志在内也。利见大人，以从贵也。\n应三，故曰在内。三体坎，故曰志在内。五天子位，故曰从贵。","40":"解卦第四十\n解，利西南。无所往，其来复吉。有攸往，夙吉。\n震出险，故曰解。《归藏》作荔。荔与离通。《上林赋》：答遝离支。离支，即荔支。《干禄字书》：离支，俗作荔支。是离、荔音同通用。离即解也，义与《周易》同。坤位西南。四居坤初，前临重阴，阳得阴则通，故利西南。五得敌，故不利往。来复于二，各当其位，故曰其来复吉。有攸往，谓二往五。夙，早也。《礼记·孔子闲居》：夙夜基命宥密。疏：夙，即昕也。昕，明也。二坎为夜，五震为晨，二往五则由夜及晨而天明矣，明故吉也。旧解于吉之故，皆言早往得位故吉，而王注诂夙为速尤误。岂知《诗》、《书》皆以夙与夜对言。夙为早者，言早晨也，非速也。\n彖曰：解，险以动。动而免乎险，解。解利西南，往得众也。无所往，其来复吉，乃得中也。有攸往，夙吉，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲坼。解之时大矣哉！\n坎险震动，震在外，动而出险，故曰解。六五前遇阴，故曰无所往。来居二，居中当位，故吉。九二往居五，故有功。震雷坎雨，是天地解也。震为春，为百果草木。离为甲。孙星衍云：甲，皮也。震动故甲坼。坼，《说文》：裂也。言草木当春，得雷雨，胚胎迸裂，蓓蕾怒发，芽蘖潜滋，而外甲坼也。《史记·律书》：甲者言万物剖符甲而出。又《礼·月令》：其日甲乙。郑注云：时万物皆解孚甲。皆甲坼之的解也。乃马、陆皆读坼为宅，云根也。愚以为坼、宅音同，故通用。若以宅为根，则古无此训。且草木未得雷雨之先，岂皆无孚甲无根乎？郑康成盖读与马、陆同，而知其难通，故又曰：皆，读如人倦之解。以济其穷。若曰皆甲宅，即解甲宅也。岂知甲宅即甲坼，不必如是穿凿。且甲可解，根如何解哉？是仍不通也。然由郑说，可悟以宅为根之非矣。乃雅雨堂刻本从惠栋校，竟改《集解》甲坼为甲宅。岂知荀注本作甲坼，故曰草木萌芽。萌芽，即释坼义也。若作宅，荀胡以不释？且《释文》早言之矣，明本《集解》可证也。李道平作《纂疏》，不顾荀注义如何，亦改作宅，致传文与注不相应。真可异已！（《释文》只云马、陆作宅，后集荀注者，如孙堂，如马国翰，皆改荀注作宅，可谓盲从。 ）\n象曰：雷雨作，解；君子以赦过宥罪。\n坎为罪过，震为解，故赦过宥罪。\n初六，无咎。\n承阳有应，虽失位，得无咎也。\n象曰：刚柔之际，义无咎也。\n际，交也。言初承阳，刚柔交际，故义得无咎。\n九二，田获三狐，得黄矢，贞吉。\n坎为狐，坎陷故为获。二应在五，五震为田猎，数三，故曰田获三狐。坎为矢，互离色黄，故曰得黄矢。贞吉者，卜问吉也。诸家皆以离为矢。离虽为甲兵，然若斧象则专属兑，矢则专象坎。坎为棘，为匕，为直，为穿，故为矢。经从未以离为矢。\n象曰：九二贞吉，得中道也。\n离为道，二中位，故曰中道。\n六三，负且乘，致寇至，贞吝。\n三不当位，坎为车，三在车上，故曰乘。上震，向外视之艮，艮为负何，故曰负且乘。坎为寇，三上下皆坎，故曰致寇至。古者君子方得乘车，若负戴则为小人之事，今负且乘焉，望之不似，则盗贼从而生心，故曰致寇至。言招致使来也，故卜问吝矣。贞吝与上贞吉为对文，故夫从虞氏以贞吉为之正者非也。\n象曰：负且乘，亦可醜也。自我致戎，又谁咎也！\n《说文》：戎，兵也。寇至，故谓致戎。\n九四，解而拇，朋至斯孚。\n拇，陆绩云：足大指也。王肃云：手大指。手指于震象不合，故陆注是也。震为足，四前遇重阴，阳遇阴则通，故曰解而拇。言利往也。《复》彖云：朋来无咎。阴以阳为朋。九四前遇重阴，下乘阴，阴孚于阳，故曰朋至斯孚。言上下阴共孚于四也。《彖传》谓往得众，指此爻也。旧解皆从虞翻说，谓四阳从初，下兑，故朋至斯孚。致孚义全晦。\n象曰：解而拇，未当位也。\n解而拇，前进也。四失位，进至五则当位矣。申解而拇之故也。\n六五，君子维有解，吉，有孚于小人。\n震为君子，谓四。君子维有解，言四宜升五，当位而吉。小人谓阴。四升五成坎，坎上下皆阴，有孚维心亨，故曰有孚于小人。\n象曰：君子有解，小人退也。\n君子有解，谓九四升五。小人退，谓五退居四。释爻义可谓至明白矣。\n上六，公用射隼于高墉之上，获之无不利。\n震为公，为射，为隼。伏巽为墉，为高。六居巽上，故射隼于高墉之上。盖卦为重坎，上六履重坎之上，动作如意，故获之无不利也。震射，《左氏》象。震为鸿鹄，故为隼。俱见《易林》（详《焦氏易诂》 ）。\n象曰：公用射隼，以解悖也。\n坎为悖。上六居重坎之外，故曰解悖。","41":"损卦第四十一\n损，有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享。\n贞我悔彼，以我之阳，益彼之上，故曰损。《归藏》作员，朱彝尊谓即损卦。然《归藏》以益为 ，则此未必取义于损。按员，古作云。《商颂》：景员维何。笺：员，古文作云。以此例之，《归藏》必原作云也。《说文》：云，山川气也，象回转形。后人加雨作雲，是云即雲字。卦上艮下兑。《说卦》：山泽通气。气即云。中互坤，坤正为云。卦二至上正反震，震为出。云出泽中，至上而反，正回转之形，与《说文》合，与卦象合。六爻皆有应，故曰有孚。二阳遇阴，乾元通，故曰元吉。可贞，言二不宜升五再损也。利有攸往，谓上也。上九下乘重阴，《颐》曰利涉大川，利涉即利往也。《尔雅·释诂》：曷，止也。而曷与愒通。《诗·大雅》：汔可小愒。《传》：愒，息也。息、止义同。故《集韵》云：愒，或作曷也。而愒与憩通。《诗·甘棠篇》：召伯所憩。《释文》：憩，本又作愒。曷之用，言憩息之时也。上卦艮，故云憩。震为簋，坤数二，故曰二簋。兑为享。享、飨通。《左传》成十二年：享以训恭俭。《释文》：享，本亦作飨。又庄四年：止而飨之。《周语》：大臣飨其禄。注皆训飨为食。曷之用二簋可用享，言当休暇之时，可以二簋为享。二簋虽俭，然处损时，亦可也。清儒承荀氏旧说，见言簋即以为祭宗庙，侈陈礼制。岂知《仪礼·公食大夫礼》：宰夫启簋。《诗·秦风》：于我乎，每食四簋。凡宴享皆用簋，非必祭宗庙始用也。且于《易》义之谓何矣？崔憬以曷为何。荀爽等只说二簋可用享，不及曷义。于是清儒如惠栋、焦循、张惠言、孙星衍等，亦不释曷义。只一姚配中袭崔憬说，疑非也。\n彖曰：损，损下益上，其道上行。损而有孚，元吉无咎，可贞，利有攸往。曷之用，二簋可用享。二簋应有时，损刚益柔有时。损益盈虚，与时偕行。\n贞我悔彼，内与外，上与下，其亲疏迥不相同。故夫以内阳益外，则我损矣。上下即内外也。《泰》三往上，故曰其道上行。震为应，二至四震，乃上卦震覆，若反声相应者，故曰二簋应，与《中孚》之鹤鸣子和理同也。二簋应有时，言时当愒息，用二簋享，正与时应也。泰极还否，《损》者《泰》之终，《否》之始。损刚益柔有时者，按卦气《损》为七月卦，时已当否，阳日减，阴日增，正损刚益柔之时，不可不预知也。时当益则益，时当损则损，益则盈，损则虚，乾盈坤虚，应时而行。所谓穷则变，变则通也。\n象曰：山下有泽，损；君子以惩忿窒欲。\n震为决躁，为武人，故为忿。乃上卦震覆为艮，艮止，故曰惩忿。二至上正覆震，震为口有争食象，坤闭，故曰窒欲。学《易》之君子，因以取法焉。\n初九，已事遄往，无咎，酌损之。\n已，虞作祀。晁氏云：已，古文祀字。按金文《沈子它敦铭》：用 飨已公。已公即祀公。初应在四，四震为祭祀，兑为飨。遄，速也。祀事遄往者，言宜往应四也。当位，故无咎。所应为阴，故曰酌损。\n象曰：已事遄往，尚合志也。\n尚、上同。上谓四，初四婚媾，故曰合志。四坤为志。其用卦变以坎为志者，非也。\n九二，利贞，征凶。弗损，益之。\n三已损矣，二不宜再损，故利于贞定也。震为征，二阳临重阴，更利于征；然二往五则下愈损，故征凶也。弗损者，即贞于二不动，不再损下也。弗损即益二矣，故曰益之。夫贞我悔彼，《泰》三阳三阴，而阳全在我，此所以为泰也。损我一阳以益外，已非善徵，若损之不已，则成否矣。《否》天地闭，贤人隐，故于二爻著以为戒，曰利贞，曰征凶。旧解惟王弼能识二之不宜往五，谓刚全上则剥道成。若虞翻则谓二不征之五则凶，故反经为说。岂知二阳得五阴为应，利往诚为常例；独《损》二因其利往，再损内也，故因以为戒。乃后世如惠栋、张惠言等，多祖述其说。独姚配中识虞义之反经，乃又以利贞为之正，二之正成阴，阴与阴不相应，故征凶，仍以卦变为穿凿。然则不独易象失传，易理之失传更甚也。\n象曰：九二利贞，中以为志也。\n中谓二。言志贞于二，不前进也，故曰中以为志。旧解无不误者。\n六三，三人行则损一人，一人行则得其友。\n乾为人。《泰》三阳原为三人，今成兑，损一人矣。损三以益上，上乘重阴，阳以阴为友，故曰一人行则得其友。友谓四、五。旧解以下应兑为友，故于三则疑之故，无有通者。\n象曰：一人行，三则疑也。\n三阳上行则成《否》，《否》上九为四、五所阻格，所谓敌也，敌则相疑相忌，而不相友矣。释得友之故也。《易》于阴阳相遇为朋友之故，言之可谓明白矣。乃自荀、虞以来，以兑二阳、艮二阴为朋友，相承至今。岂知阳遇阳、阴遇阴，《艮》谓之敌应，《中孚》谓之得敌哉？\n六四，损其疾，使遄有喜，无咎。\n坤为疾，四得阳应，故曰损其疾。遄，往也。坤为忧，乾为喜。使遄有喜者，言往得阳应而喜也。坤疾象失传，旧解故多不当。\n象曰：损其疾，亦可喜也。\n疾损，故可喜。\n六五，或益之十朋之龟，弗克违，元吉。\n艮为龟。《汉书·食货志》注：苏林曰，两贝为朋，朋值二百一十六。元龟十朋。艮为朋友，坤数十，故曰十朋之龟。言阳在上，五得承之，若大宝之益也。阴顺阳，故曰弗克违。五卦位最尊，故曰元吉。艮龟象失传。侯果谓内柔外刚龟之象，岂知艮即为龟。\n象曰：六五元吉，自上祐也。\n上为阳，五承之，故曰自上祐。祐，福也。《释文》：或作佑。无言汉人作右者。惠栋擅改之，后学盲从之，于是《集解》之文遂乱矣，不可不知。又自虞翻以来，皆以二益五为说，清儒皆宗之，不惟与《象传》背，且与经背。经于九二言征凶，言利贞，言弗损，则二固不往五。况《象传》明言自上祐，则十朋之龟指上也。弗克违，言五承上也。则以二益五为说者，其误益明矣。\n上九，弗损益之。无咎，贞吉，利有攸往。得臣无家。\n上之三则上损矣，不动则益上，故曰弗损益之。贞吉者，卜问吉也。上乘重阴，故利有攸往。与《颐》上九同。坤为臣，上据坤，是得臣为助也。三者上九之家，上既得臣为助，即不返三，故曰得臣无家。言公而忘私也。\n象曰：弗损益之，大得志也。\n坤为志。上据坤，阳乘阴，故曰大得志。旧解皆以上返三为说，非。","42":"益卦第四十二\n益，利有攸往，利涉大川。\n贞我悔彼，以彼之阳，下来益我，故曰益也。《归藏》曰 。《说文》： ，和也。《书·召诰》：其丕能 于小民。注亦训 为和。风雷同声相应，和之至也。是《周易》以阳爻上下言，故曰益；《归藏》合上下卦言，曰 也。利有攸往，谓五。五既中且正，《传》所谓中正有庆也。利涉大川，谓初。坤为大川，震为舟，初阳遇阴而通，故曰利涉。《传》所谓木道乃行也。\n彖曰：益，损上益下，民说无疆。自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。\n坤为民，震为乐，故曰民说。坤为广，故曰无疆。《否》四来居下卦之下，故曰自上下下。震为玄黄，故曰大光。利有攸往，中正有庆，谓五。利涉大川，木道乃行，谓初。震为舟，故曰木。古刳木为舟，故谓舟为木。《涣》曰：乘木有功。《中孚》曰：乘木舟虚。皆以木为舟。利涉大川，故曰木道乃行。言舟行水上，舟楫之利用溥也。此纯释利涉之义。坤为水，震为舟，故曰木，曰行。程子不知木即为舟，改木为益。野文之害，至斯而极。阳自外来，故曰天施。震为生，坤为地，故曰地生。《益》者《否》之终，《泰》之始。《太玄》云：已用则贱，当时则贵。艮为时。与时偕行者，言时而当益，不能不益也。\n象曰：风雷，益；君子以见善则迁，有过则改。\n乾为善，坤为过。乾来初，得位得民，是迁善也。乾来初成震，坤象灭，是改过也。故学《易》之君子法之。\n初九，利用为大作，元吉，无咎。\n虞翻云：大作，谓耕播耒耜之利。按《虞书》：平秩东作。注：岁起于东，而始就耕，谓之东作。《禹贡》：恒卫既从，大陆既作。注：二水已治，从其故道，大陆之地已可耕作。是作即耕也。震为春，为耕，至春民尽耕，故曰大作。阳遇阴，故利。乾元通，故大吉无咎。\n象曰：元吉无咎，下不厚事也。\n震健而决躁，故《左氏》以为射，言其速也。厚，余也。行速故无余事。坤为事。言初虽在下，往利无阻，事无积滞。仍利涉大川之意也。\n六二，或益之十朋之龟，弗克违。永贞吉。王用享于帝，吉。\n艮为龟，为朋友，坤数十，故曰十朋之龟。二应在五，五艮，故以十朋之龟益二也。二得阳应，故曰弗克违。二当位，故永贞于二吉。震为帝，王谓五。震为祭祀，故曰享。王用享于帝吉者，言五应二，则二吉也。\n象曰：或益之，自外来也。\n外谓九五，恐人疑为初。\n六三，益之用凶事，无咎。有孚中行，告公用圭。\n三居坤中，坤为凶，为事。益之用凶事，言上来益三，为五所阻，《大畜》初九所谓有厉也，故曰凶事。二、三、四阴爻皆承五，《夬》九五云中行无咎，《泰》二云得尚于中行，中行谓五。有孚中行者，言三与二、四，同孚于五也。震为言，故为告；为玉，故为圭。坤为众，故曰公。公，共也。三震为诸侯。告公用圭者，言约同诸侯执圭，共往朝五也。圭者天子所锡予，今朝天子，故执以为信。旧解以凶事为凶丧，或为凶荒，则告之天子，告之友邦，而受其赙襚；告必将仪，或执璧，或用圭，如臧文仲以纪献玉告籴于齐。岂知告公用圭，即申有孚中行之义，与上之凶事无涉。是皆以他经例《易》，不知《易》文上下句不必相属也。\n象曰：益用凶事，固有之也。\n言阴遇阴，阳遇阳，近而不相得故凶，乃易理当然之事，故曰固有。\n六四，中行告公从，利用为依迁国。\n中行谓五。震为告，坤为臣，为众。从，谓顺五。告公从者，言下三阴宜共同承五也。坤为国，震动，故曰迁国。艮止，故曰依。《左传》隐六年：我周之东迁，晋郑焉依。《说文》：依，倚也。利用为依迁国者，言坤国播迁，至五艮而止，依以建国也。阴从阳故利，巽为利也。\n象曰：告公从，以益志也。\n坤为志。公从九五，阳益阴，故曰益志。自坤志象失传，遂令某爻变成坎，以求志象矣。\n九五，有孚惠心，勿问元吉。有孚惠我德。\n《尔雅·释言》：惠，顺也。坤为顺，为心。有孚惠心，言五孚于下坤而顺我也。震为问。五震覆，故曰勿问。五位尊，故曰元吉。勿问元吉者，言五乘重阴而大吉也。乾为德。有孚惠我德，言下三阴皆承顺我而有孚也。\n象曰：有孚惠心，勿问之矣。惠我德，大得志也。\n坤为志，阳为大。阳五下乘重阴，故曰大得志。《管子·度地》：天下之人皆归其德而惠其义。注：惠，顺也。正说此也。\n上九，莫益之，或击之。立心勿恒，凶。\n上与五为敌，故曰莫益。言益三也。上应在三，然上若益三，则为五所忌，而或击之。五艮体，艮为手，为击也。坤为心。上应在坤，下虚，处巽上风陨，进退不果，故曰立心勿恒，凶。《恒》九三云：不恒其德。《益》上九与《恒》九三同为巽上，故亦曰勿恒。缘巽下桡，故义同也。\n象曰：莫益之，偏辞也。或击之，自外来也。\n恐其被击，戒以莫益，故曰偏辞。《左传》襄三年：君子谓祁奚举其偏而不党。注：偏，属也。犹私也。外谓五，五为上敌。《下系》云：凡《易》之情，近而不相得则凶，或害之。故上欲应三，五或击之。五在外，言击之者仍在外也。《同人》九三曰：敌刚。《中孚》六三云：得敌。《子夏传》：三与四为敌。是阳遇阳，阴遇阴，愈近而愈不相得。旧解自虞翻以来，皆不知此为《周易》根本定例，故说或击之，皆不知击上九者为何爻，而无不误矣。\n按否泰者，天道之自然，为运会所必有，故以次于上经十卦之后。损益者，人事之进退，为人为之所关，故以次于下经第十卦之后。十者数之终，终则变，变则否泰迭更，损益互见，此其义也。又《损》者《泰》之终，《否》之始；《益》者《否》之终，《泰》之始。以见否泰虽属天道，而由否而泰，由泰而否，损之益之，推挽之权则在人为，有定而无定也。此上下经天人之分，动静之别，非参育之圣人，固不能知其故也。故于上经之《否》、《泰》自为一卷，下经之《损》、《益》自为一卷，以见此四卦为全经之枢纽，与他卦绝不同也。","43":"夬卦第四十三\n夬，扬于王庭，孚号有厉。告自邑，不利即戎。利有攸往。\n王育云：夬，即古文玦字。按《礼·内则》：右佩玦。《释文》：本又作决。《诗·小雅》，决拾既佽是也。而夬为决，故夬与玦同。玦，《说文》：玉佩也。《广韵》：佩似环而有缺。《夬》乾为玉，为圜，兑上缺，俨然玦形也。而决者，绝也。《左传》：晋献公赐太子申生玦，以示决绝。卦以五阳决一阴，故谓之夬也。《归藏》以夬为规。规，圜也。《夬》重乾，乾圜故为规。玦亦圜，然上缺。是《周易》取象，与《归藏》同而更切也。乾为王，伏艮为庭，一阴履五阳之上，故曰扬于王庭。兑口为号。厉，危。孚号有厉者，言阴虽孚于阳，为阳所说，然穷处于上，须危厉自警也。兑口，故曰告。兑为斧钺，故曰戎。《说文》：戎，兵也。《礼·月令》，以习五戎。注：弓殳矛戈戟。伏艮为邑。告自邑，不利即戎者，言一阴危处于上，告诫国人，不可妄动也。皆指上六言也。利有攸往，谓五。《夬》本阳息卦，五息而往则阴尽。夬者决也，决者绝也，阳决阴也。\n彖曰：夬，决也，刚决柔也。健而说，决而和。扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。\n下健上说，说故和。其危乃光者，危谓阴退，阴退则阳长，阳长故光。所尚乃穷，申不利即戎之故也。阳长乃终，终谓阴尽也。\n象曰：泽上于天，夬；君子以施禄及下，居德则忌。\n禄谓恩泽。泽在天上无用，故君子思以下施。乾为富，故为德。德、得同。《荀子·礼论篇》：贵始得之本也。注：得，当为德。居，积也。下乾，二至四、三至五皆乾，乾多故曰居德。居德则忌者，言蓄积太多，多藏厚亡，为人所忌也。象辞每相反以取义，此亦其一也。\n初九，壮于前趾，往不胜为咎。\n初震爻，震足故曰趾，震动故曰前趾。壮，伤也。阳遇阳得敌，故伤于前趾，故往不胜而有咎矣。趾，荀作止。晁氏云：止，古文。按《说文》有止无趾，止即足之象形字，加足者非也。\n象曰：不胜而往，咎也。\n前有重阳，所遇皆敌，不胜必矣。明知不胜而往，宜其有咎。\n九二，惕号，莫夜有戎，勿恤。\n乾为惕，为言，故曰惕号。言有所警戒也。二应在五，五兑，兑为昧谷，故为莫为夜。兑为兵戎，故曰莫夜有戎。言有寇警也。然五不应二，故虽莫夜有戎，无忧也。乾为惕，故为忧。旧解因不知勿恤之故何在，故用象皆误。岂知《随》象云：君子以向晦入宴息。向晦即谓兑。然则兑为莫夜，《易》有明象。而兑五不应二，故虽有虚惊，实不足忧恐也。\n象曰：有戎勿恤，得中道也。\n乾为道，二中位。\n九三，壮于頄，有凶。君子夬夬独行，遇雨，若濡。有愠，无咎。\n頄，面颧也。三居下卦之上，故曰頄。而四五皆阳，故伤及于頄，伤頄故凶。乾为君子，承乘皆阳遇敌，故夬夬独行。而应在上，上兑为雨，故曰遇雨，曰若濡。濡，沾湿也。乾为衣，衣濡故愠。然究为正应，亦无咎也。\n象曰：君子夬夬，终无咎也。\n夬夬，独行状。三于四、五虽遇敌，于上独有应，故曰终无咎。终谓上。\n九四，臀无肤，其行次且。牵羊悔亡，闻言不信。\n伏艮为肤，为尾，故为臀。臀，尾闾也。艮伏，故曰无肤。乾为行，承乘皆阳，失位，故其行次且。次且，马云：却行不前也。兑为羊。《玉篇》：牵，速也。《姤》九三云：行未牵也。亦以牵为速。次且行缓，速则无悔。牵羊悔亡者，言四宜随五，速进决阴，阴决则当位居五，故曰悔亡。旧说皆不知悔亡之故何在，则以牵字失诂也。兑为耳，故曰闻。乾为言，为信，兑口亦为言。闻言不信者，兑言向外，与乾言相背，故不信也。兑耳象，《鼎》传云：巽而耳目聪明。目谓上离，耳谓互兑也。\n象曰：其行次且，位不当也。闻言不信，聪不明也。\n兑为耳，为黯昧，故曰不明。不明犹不审，俗所谓不清。虞氏以离目当之，非。\n九五，苋陆夬夬，中行无咎。\n孟喜云：苋陆，兽名。《夬》有兑，兑为羊也。《说文》亦云苋山羊细角。诸家说此二字，人人异辞，独孟氏于象密合。凡五皆谓中行。又夬夬于羊行貌独切。郑、虞等训苋陆为草属，草焉有夬夬之象哉？\n象曰：中行无咎，中未光也。\n兑黯昧，故未光。\n上六，无号，终有凶。\n一阴在上，为阳所推，不能久也。兑为口，故曰号。无号终有凶者，言不必号啕，必消灭也。\n象曰：无号之凶，终不可长也。\n不可长，言不能长久。","44":"姤卦第四十四\n姤，女壮，勿用取女。\n《归藏》曰夜。古娶必以夜，故曰昏。姤阴遇阳，即女遇男，亦婚姤也。是夜与姤义同也。女谓阴。虞翻云：壮，伤也。阴伤阳，柔消刚，故曰女壮。勿用取女，戒词也。\n彖曰：姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！\n消息卦《乾》盈于巳，盈则必亏，故至午而一阴生于下，阴遇阳，故曰天地相遇。时当五月，万物洁齐，而巽为草木，为高，为长，故曰品物咸章。荀爽以南方夏位说品物咸章，于象亦切也。五刚既中且正，教化天下，命令大行，如风之溥遍。《姤》五月卦，故曰时。天地相遇，岁功方成，故曰时义大也。郑玄谓《姤》一女当五男，非礼之正，故谓之姤。女壮以淫，故不可取。而朱子喜用其说，便谓女德不贞。于易理太不类矣。\n象曰：天下有风，姤；后以施命诰四方。\n《复》冬至，《姤》夏至。《易林》复之履云：先王日至，不利出域。又晋之解云：二至之戒，家无凶祸。故《复》象云：先王以至日闭关，商旅不行，后不省方。至日，王弼、孔颖达皆谓二至。又《汉书·薛宣传》：至日休吏，由来已久。注：至日，夏至、冬至也。盖古时视二至最重，自周讫南宋，可考见者，至日皆停止工作。乾为后，巽为命，伏坤为四方。后以施命诰四方者，言君以夏至之日，施命令止四方行旅也。《后汉·鲁恭传》说此，最合古义。详《焦氏易诂》中。\n初六，系于金柅，贞吉。有攸往，见凶，羸豕孚蹢躅。\n巽为绳，故曰系。巽木乾金，故曰金柅。马融云：柅在车下，所以止轮。《释文》：《广雅》云止也，《说文》作 ，云络丝趺。按今本《说文》，趺讹为 ，云从木爾声，读若柅。王陶庐云：古从爾从柅之字，同音通用。《毛诗》：饮饯于祢。《韩诗》作坭。《书》：典祀勿丰于昵。《释文》引马云考也，谓祢庙也。然则柅、 古通用，后儒必谓 是者非也。况马君训作止车木，可证古文原作柅。若为 ，马君能有异说哉？按络丝者，络丝之器，王肃所谓柅织绩之器，妇人用者是也。趺者横木，安络器下，以防欹侧。在下似足，故谓之趺。唐阴宏道云：络器，关西谓之络垛，梁益谓之丝登，其下柎即柅也。按阴氏所谓柎，即《说文》之趺，故《玉篇》即作络丝柎。陈寿祺云：柎、趺同字，络缚也，与系同义。系于金柅者，言以丝缚于金柅之上，止而勿动，以喻阴不宜动而消阳，故下云往见凶，是其义也。贞吉者，卜问吉。往见凶者，进则凶也。巽为羸为豕，巽进退，故蹢躅。羸，《释文》：陆读为累，郑力追反。是仍读为纍，与《大壮》同。纍，缠绕也，羸、纍、累音同通用。巽为绳故为羸，巽伏故亦为豕。蹢躅，动也。羸豕孚蹢躅者，言豕虽拘羸，然蹢躅前进，信其必然，不可忽也。喻阴虽微，后必长也。巽豕象失传，详《焦氏易诂·易象补遗》。\n象曰：系于金柅，柔道牵也。\n《玉篇》：牵，速也。下九三，《象》释其行次且，曰行未牵也。是《象传》亦训牵为速。柔道牵者，言柔之为道，消阳甚速，故以金柅止之。诸家皆谓柔牵于二，失经旨。经旨恐阴进危阳，故止其动。《象》释为柔道牵，申系于金柅之故也。牵速之象取风疾，兼取巽绳。\n九二，苞有鱼，无咎。不利宾。\n苞，今本作包。《书·禹贡》：草木渐包。《释文》：或作苞。是包、苞古通。故虞氏作苞，见《释文》。虞云：巽为白茅。《诗》：白茅苞之。巽为鱼，二据阴居中，故曰苞有鱼。巽为宾客。不利宾者，宾指上四阳，言初为二所据，四阳不能及初也。《子夏传》作庖，而荀爽则作胞。胞、庖通，是皆以庖厨为义。然卦无是象，故虞氏合也。\n象曰：苞有鱼，义不及宾也。\n二近，宾远，故义不及。\n九三，臀无肤，其行次且。厉，无大咎。\n三居下卦之末，故亦曰臀。初阴爻，下烂，故曰无肤。乾为行，三得敌，故次且不前。然三当位，故虽危厉而无大咎也。旧解皆不知次且之故何在，而以《复》震为行为说，失之远矣。\n象曰：其行次且，行未牵也。\n行未牵，即行未速。次且者，却行未前，故曰未速。\n九四，苞无鱼，起凶。\n四应初，疑于有鱼。岂知初已为二所据，实无鱼也。无鱼则勿动。动应初则为二三所害，故凶。起，作也。\n象曰：无鱼之凶，远民也。\n阴为民。言四距初远，故无鱼也。\n九五，以杞苞瓜。含章，有陨自天。\n下巽为杞，上乾为圜，为瓜。《孟子·告子》曰：以人性为仁义，犹以杞柳为桮棬。《说文》：桮， 也；棬，屈木盂也。以杞苞瓜者，言以杞柳之器盛瓜也。乾为大明，故曰章。瓜为杞所苞，故曰含章。五承乘皆阳，行窒，故含章自守。五天位，巽为陨。有陨自天者，言不久阴消至二，五与为应，有陨落之险也。知其险而预为之备，则得矣。此圣人防微虑远之意也。自荀、虞以来，皆不知《左传》有风陨象，因之清儒亦皆不知，于是虞氏令四陨初之说，沿袭至今，而经义全晦。（《复》六五曰敦复无悔，待阳息至二，五有应而吉。此则虑阳消至二，五应之而凶。 ）\n象曰：九五含章，中正也。有陨自天，志不舍命也。\n巽为命。舍命，谓任命也。志不舍命者，言知其后有陨落之险，不任命而预防之也。\n上九，姤其角。吝，无咎。\n乾为首。上九居乾之上，角之象也，故曰姤其角。然亦无大咎也。\n象曰：姤其角，上穷吝也。\n处亢龙之位，故穷吝。","45":"萃卦第四十五\n萃，王假有庙，利见大人。亨利贞，用大牲吉，利有攸往。\n萃，聚也。坤为万物，聚于泽中，故曰萃。王谓五，艮为庙。假，格，通至也。巽为入。王假有庙，言王以至诚，格于宗庙而有事也。九五得位，故曰利见大人。二五应予，故曰亨利贞。兑为羊，巽为豕，坤为牛，皆大牲，有事于宗庙用之而吉也。利有攸往，谓二应五。五天位，故《传》曰顺天命。\n彖曰：萃，聚也。顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣！\n五天位，巽为命，坤顺。顺天命，谓二顺五也。艮为观，坤为万物。天地万物，阴阳而已，有阴阳即有情感，可见而知也。\n象曰：泽上于地，萃；君子以除戎器，戒不虞。\n戎，兵也。《月令》：以习五戎。注：五戎，弓殳戈矛戟也。兑为斧钺，艮为刀兵。除，治也。君子观于《萃》象，因以治戎器而戒不虞。坤为乱，艮为止。止乱，故曰戒不虞，言防意外也。\n初六，有孚，不终，乃乱乃萃。若号，一握为笑，勿恤，往无咎。\n四有应，故曰有孚。乃初为二三所阻格，难于应四，故曰不终。乃乱乃萃，坤为乱，为聚，言乱萃于下也。四巽为号，艮手为握。若号者，言四召初与相上下也。四下来初，则初四相握手，下卦成震，震为笑，故曰一握为笑也。坤为忧，有应故勿忧。初之四得正，故往无咎。\n象曰：乃乱乃萃，其志乱也。\n坤为志，为乱。\n六二，引吉，无咎。孚乃利用禴。\n引，进也。《礼·檀弓》：兄弟之子犹子也，盖引而进之也。引吉无咎者，言进应五则吉而无咎也。禴，薄祭也。二孚五，五兑为享，而坤为吝啬，故曰孚乃利用禴。禴，夏祭，互巽为夏也。\n象曰：引吉无咎，中未变也。\n进应五，仍中位，故曰中未变。\n六三，萃如嗟如，无攸利。往无咎，小吝。\n三无应失位，而巽为嗟，故曰嗟如。巽为利，失位无应，故无所利。三前遇重阳，故往无咎；然上无应，故往又小吝也。\n象曰：往无咎，上巽也。\n巽，顺也。上巽，言上顺四、五。四、五阳，故无咎。虞氏谓动之四故上巽，误之远矣。\n九四，大吉，无咎。\n下乘三阴，故大吉。失位，故无咎。无咎者，仅免于咎也。\n象曰：大吉无咎，位不当也。\n《系辞》云：无咎者，善补过者也。故无咎非全美之辞。\n九五，萃有位，无咎。匪孚，元永贞，悔亡。\n得位居中，故有位无咎。五孚于二，乃为四所阻，难于应二，故曰匪孚。然乾元永贞于五，居高临下，亦无悔也。\n象曰：萃有位，志未光也。\n兑为黯昧，艮为光明。艮伏，故志未光。巽为志。\n上六，赍咨涕洟，无咎。\n兑为口，故赍咨。《释文》：赍咨，嗟叹之辞。郑同。马云，悲声怨声。兑为泽，故涕洟。《玉篇》：目汁出曰涕。《说文》：洟，鼻液也。上乘阳，三无应，故悲哀若是。然当位，亦无大咎也。虞翻作赍资，云赍持资赙也，即持赙助丧也。非。\n象曰：赍咨涕洟，未安上也。\n言不安于穷吝。","46":"升卦第四十六\n升，元亨，用见大人。勿恤，南征吉。\n阳遇阴则通，故名曰升。《归藏》曰称。《牧誓》：称而戈。注：称，举也。又誉人曰称扬。升者升而上，举者亦扬之使上。故《归藏》曰称，《周易》曰升，其义并同。阳上升，故元享。元谓乾元也。大人谓二，二为三所阻格，故不曰利见大人，而曰用见。言二宜升五也。坤为忧，为恤。二升五，大人得位，故曰勿恤。震为南，为征。三临群阴，故南征吉。《左传》成十六年，晋筮遇《复》，曰南国 。以震为南。《明夷》九三曰南狩，亦以震为南。自震南象失传，清儒皆用虞氏法，以二升五互离为南。\n彖曰：柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤，有庆也。南征吉，志行也。\n二升五，故有庆。坤为志。三临重坤，故曰志行。\n象曰：地中生木，升；君子以顺德，积小以高大。\n巽为高，为长，故为高大。坤为小，为积。积小以高大者，言以坤阴柔顺之德，积累以成其高大也。象卦形也。\n初六，允升，大吉。\n允，施氏作 。《说文》同，云 ，进也。《晋》六三云众 ，即众进也。兹曰 升，仍前进而升也。进遇阳，故大吉。\n象曰：允升大吉，上合志也。\n上谓二、三。《九家》谓上爻，非。巽伏故为志。\n九二，孚乃利用禴，无咎。\n二孚五。五坤为吝啬，故曰禴。禴，夏日薄祭也。兑为祭，巽为夏，故曰孚乃利用禴，无咎矣。\n象曰：九二之孚，有喜也。\n升五故有喜。\n九三，升虚邑。\n马云：虚，丘也。按《左传》僖二十八年：晋侯登有莘之虚。《诗·卫风》：升彼虚矣。虚者，高丘。巽为高，故曰虚。坤为邑。升虚邑者，言升邑之高处也，正巽上象也。与《同人》九四之乘其墉，取象正同。荀爽作空虚解。后来诸家，以虚为坤象，多宗荀说，非。\n象曰：升虚邑，无所疑也。\n坤为迷，为疑。阳遇阴，故无所疑。\n六四，王用亨于岐山，吉，无咎。\n震为王，兑为享。震为陵，为阪，而形上歧，故曰岐山。王用享于岐山者，言望二升五，四得承阳。阴顺阳，犹臣事君；望二升五，犹望王至岐山，而有所享献也。《象》曰顺事，顺承也。二若不升五，四如何得承阳哉？故望之也。此正文王服事殷之本旨。乃后儒谓文王作爻辞，不合自称为王；若为殷王，又无至岐山之理，以爻辞为周公作。此无论《易》辞皆由象生。故韩宣子不谓为《易辞》，而曰《易象》。即只以人事言，纣尚能囚文王，何不可到岐山？且文王于此事数言之，服事忠诚，溢于言表，又岂必实有其事？乃谓王为文王，无理甚矣！（李过《西溪易说》云：若以此王为文王，则王用三驱，王假有庙，亦文王耶？驳旧说至详尽。 ）\n象曰：王用亨于岐山，顺事也。\n坤为顺。言二升五，四得承阳，故曰顺事。\n六五，贞吉，升阶。\n贞吉，卜问吉也。坤为土，为重，故有阶级之象。升阶，言二升五也。五阳，故《象》曰大得志。\n象曰：贞吉升阶，大得志也。\n坤为志。阳升五，故大得志。\n上六，冥升，利于不息之贞。\n坤为晦冥，为夜，故曰冥升。得阳应，故曰利于不息之贞。与利永贞同恉。盖上六为同性之四、五所格，不能应三，故有此象。\n象曰：冥升在上，消不富也。\n坤消，故不富。","47":"困卦第四十七\n困，亨。贞大人吉，无咎。有言不信。\n二五刚得中，处险能说，故亨。贞，占也。二五为大人，故贞大人吉也。兑口为言，三至上正反兑，所向不同，故有言不信。此其义始见于《左传》。《左传》昭五年，《明夷》之《谦》曰：于人为言，败言为谗。谓《谦》上震为人为言，下艮为反震，故曰败言。是以正反震为谗。《易林》承其义，于讼之困云：心与言反。正释此语也。坤之离云：齐鲁争言。《离》二至五正反兑，故曰争言。争言即不信。《离》二至五，与《困》三至上同也。旧解皆误，详《焦氏易诂》。\n彖曰：困，刚揜也。险以说，困而不失其所亨，其唯君子乎！贞大人吉，以刚中也。有言不信，尚口乃穷也。\n坎刚揜，三至上刚揜，阳陷阴中，故困。困而不失其所亨，唯君子能之。君子即大人，若小人即不堪矣。兑为口，三至上正反兑，故曰尚口。尚口乃穷者，言徒尚口说，必有相反而不信者，故穷也。\n象曰：泽无水，困；君子以致命遂志。\n水在泽下，则泽竭矣，故曰无水。巽为命，而兑为反巽，为毁折，故曰致命。坎为志。二入于渊不出，故曰遂志。学《易》之君子以之。\n初六，臀困于株木，入于幽谷，三岁不觌。\n初在下，故曰臀，与《夬》九四同。株木谓坎。言初欲应四，坎陷为阻，故困于株木。株，幹也。《韩非子》：守株待兔。而坎为栋，故为株木。坎为幽，坎陷为谷。初在下，故入于幽谷。离伏，故不觌。三岁，言其久。盖初失位，处坎下，故其象如此。茹敦和以坎为三岁，王昭素谓初至三三爻为三岁。以《坎》上六证之，茹说是也。\n象曰：入于幽谷，幽不明也。\n离伏坎夜，故幽不明。\n九二，困于酒食，朱绂方来，利用享祀。征凶，无咎。\n坎为酒食，《需》九五需于酒食是也。二居坎中，故困于酒食。巽为绳，为绂，坎为赤。巽在二前，故曰朱绂方来。言将膺锡命也。《博雅》：绂，绶也。朱绂，贵人所服，以祭宗庙者，故用以享祀则利也。然五不应故征凶，得中亦无咎。\n象曰：困于酒食，中有庆也。\n居阴中，故有庆。\n六三，困于石，据于蒺藜。入于其宫，不见其妻。凶。\n巽为石，坎为蒺藜。三前临巽，故困于石。下据坎，故据于蒺藜。石坚刚不可入，蒺藜刺人不可践也。巽为入，坎为宫，故入于其宫。巽为齐，妻者齐也，故巽为妻。巽为伏，又上无应，故入宫而不见妻也。象而如是，凶可知也。巽石象，宋邵雍用之，后儒怪骇。岂知《焦氏易林》同人之小畜云：戴石上山，步跌不前。《小畜》上巽为石，下乾为山、为首。石在首上，故曰戴石。馀证尚多，详《焦氏易诂》卷一。\n象曰：据于蒺藜，乘刚也。入于其宫，不见其妻，不详也。\n《释文》云：蒺藜，茨草。虞翻谓为木名，似非。《释草》：茨，蒺藜。注：布地蔓生，有子，三角刺人。《诗·鄘风》：墙有茨。《传》：茨，蒺藜。孔疏蒺藜有刺，不可践者是也。惟不可践，故以喻乘刚，若为木则不合矣。《正义》作蔾，然《尔雅》及《毛诗传》皆作藜。藜、蔾通用。阮校必谓蔾是，似亦无确证。详，善也。\n九四，来徐徐，困于金车。吝，有终。\n来应初，为二所阻，故曰徐徐。二坎为车，离色黄外坚，故曰金车。困于金车，申来徐徐之故也。仍阻于险，不得应初也。然与初为正应，初吝终合，故曰有终。\n象曰：来徐徐，志在下也。虽不当位，有与也。\n坎为志。志在下，言应初。\n九五，劓刖，困于赤绂。乃徐有说，利用祭祀。\n艮伏，鼻不见，故曰劓。兑折震，足象毁，故曰刖。坎为赤，巽为绂，故曰赤绂。乃二爻坎不应，故困于赤绂。上遇阴利往，故有说。兑为食，故利用祭祀。\n象曰：劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。\n坎为志，二无应，故志未得。坎五曰受福，兹与之同。《传》所谓祭则受福也。\n上六，困于葛藟，于臲卼。曰动悔有悔，征吉。\n巽为葛藟。三至上正反巽，而三不应上，故困于葛藟。臲卼，危险不安之貌。上乘刚，无应，故有是象。兑为口。曰者，自警也。言处此臲卼之境，时时以动悔有悔自警。动悔者，言动而应三，三不应故悔。有悔者，言下乘阳又有悔也。征吉谓三。言三往四，上得阳应而吉也。此二句向无的解，姑测其义如是。\n象曰：困于葛藟，未当也。动悔有悔，吉行也。\n未当者，言上不宜乘阳也。吉行者，三之四，上得阳应，故吉也。","48":"井卦第四十八\n井，改邑不改井，无丧无得，往来井井。汔至亦未繘 （句 ） ， 井羸其瓶，凶。\n水在泽下，泽竭故困；水在泽中，汲之不穷。故兑为井。《易林》复之旅云：井沸釜鸣。以《旅》互兑为井。郑玄以巽木为桔槔，汲水以取井象。桔槔焉有在井下者乎？\n兑为井，坤为邑。《泰》初往坤中，故改邑。二至四仍兑，与《泰》体同，故不改井。不改故无丧得。初至四正反兑，故曰往来井井。《易林》益之萃云：往来井井。即以《萃》三至上正反兑，为往来井井。荀云：汔，竟也。汔至者，言绠系至井底而尽也。繘，绠也。亦未繘者，言巽绳在下，尚未繘瓶使上也。其以汔为几，谓瓶几至井口而覆者，非也。经明曰未繘，若至井口，则已繘矣。中爻离为瓶，正当毁折之地，而巽为绳，故曰羸。羸、累通。井羸其瓶者，言瓶为井甓所拘羸钩挂也。瓶既为井所挂碍，非覆即破，故凶。扬子云《酒箴》云：子犹瓶矣，居井之湄。不得左右，牵于缠徽。一旦 碍，为瓽所轠。注： ，县也。瓽，井以砖为甃也。轠，击也。言瓶县为井砖所挂碍，而瓶受击也。是扬子读井羸其瓶，井不属上读。后荀爽袭子云，亦以井属下读。其以繘井为句者，则下文之羸其瓶，莫详其故矣，非也。羸，《易林》家人之颐云：长股羸户。长股即蟏蛸。羸户者，言以丝缠绕于户上也。是以羸为藟。故荀训为拘羸，虞释为钩羸。他若陆绩、蜀才作累，王肃作缧，其字虽异，其音皆同，其义如一。\n彖曰：巽乎水而上水，井。井养而不穷也。改邑不改井，乃以刚中也。汔至亦未繘，未有功也。井羸其瓶，是以凶也。 （句依荀读。故汲古阁所刊李氏《集解》，及雅雨堂刊本，皆井字属下。 ）\n坎在上，故曰上水。巽入也，巽乎水而上水，言以瓶入水，汲水使上也。水所以养人，取之不竭，故养而不穷。二五皆刚，故不改。未繘，故无功。井拘累其瓶，使水覆，故凶。汔至亦未繘，荀注云：汔，竟也。繘所以出水通井，今居初未得应五，故未繘也。不与井连文。井羸其瓶，荀注云：井谓二，瓶谓初。初欲应五，为二所拘羸。以井属下读，与扬子同，故从之。\n象曰：木上有水，井；君子以劳民劝相。\n坎为众，为民，为劳卦，故曰劳民。《释诂》：相，导也。兑为言，故曰劝相。言以言语劝导，使有所勉也。\n初六，井泥不食，旧井无禽。\n初在井下，故曰泥。兑口为食，兑覆故不食。井原以汲水，今无水而泥，其为旧井无疑也。禽，获也。无水故无所得。其以禽鸟为诂者非。又按，旧井者，废井也。兑为井，兑覆为巽，故井废。\n象曰：井泥不食，下也。旧井无禽，时舍也。\n舍，弃也。\n九二，井谷射鲋，瓮敝漏。\n二居兑体之下，故曰井谷。巽为鱼，故曰鲋。《子夏传》：虾蟆也。伏震为射。虾蟆穴居水际，故曰井谷射鲋。伏震为瓮，巽下缺，瓮无当，故敝漏。夫井内之穴，非矢所能加；瓮漏则水泄，而失其用。以二前遇阳，应亦阳，故动静皆不适也。\n象曰：井谷射鲋，无与也。\n言五无应与。\n九三，井渫不食，为我心恻。可用汲，王明，并受其福。\n三应在上。上居坎水上，故曰井渫。《汉书·王莽传》：愦眊不渫。注：渫，彻也，通也。扬子《方言》：渫，歇也。兹曰井渫，谓井水浑浊沉歇而清彻也。初为泥则上为渫，正上居坎水上之象也。夫水洁宜食矣，乃竟不食者，以五亦阳为阻，三不得应上也。兑为食，为使也。坎为心，为忧。为我心恻者，言三被阻，不能汲上，使我心忧也。然三与上究为正应，上水既渫而清，三尽可汲，五岂能终阻之？王谓五。五坎为隐伏，故不明。然王终有明时，王明则三上汲引，养而不穷，天下普受其福矣。凡爻有正应者，初虽有阻，终必相合。《同人》九五曰：先号啕而后笑，大师克相遇。言五克去三四之阻，终能遇二也。《渐》九五曰：终莫之胜吉，得所愿也。言五终能胜三，与二相合也。兹害三者五，五君位尊，三不敢言克言胜，只冀王明而已，王明则三上终相遇也。文王服事忠诚，情见乎辞。因五为阻，故呼王明。旧解不知不食之故，在五敌为阻；又不知王明并受其福，即言三上终能应与，特以五而变其辞耳，故无一得解者。\n象曰：井渫不食，行恻也。求王明，受福也。\n不食之故，其咎在五，故曰求王明。\n六四，井甃，无咎。\n以瓦甓砌井曰甃。兑为井。六四居兑上，则井将修成，故无咎。\n象曰：井甃无咎，修井也。\n甃，修也。\n九五，井冽寒泉 （句 ） ， 食。\n冽，甘也。坎为寒，为泉。泉既甘冽，故可食。\n象曰：寒泉之食，中正也。\n五虽无应，然位正中，故可食。\n上六，井收勿幕，有孚元吉。\n收，成也。幕，盖也，覆也。坎为隐伏，故为盖覆。六居坎上，故勿幕。言井既成，以出水为功，不宜盖覆也。三得阳应，故有孚而吉。\n象曰：元吉在上，大成也。\n成即收也。","49":"革卦第四十九\n革，己日乃孚，元亨利贞，悔亡。\n革，改也。言水火更代用事也。离为日，贞己，故曰己日。己日谓二，二离主爻，承阳应五，故曰己日乃孚。王弼等谓即日不孚，已日乃孚，训已为过往，不辞甚矣。顾炎武《日知录》谓朱子发读为戊己之己，当从之。按虞氏注云：离为日，孚谓坎，四动体离，故己日乃孚。是虞氏亦以离为己日，读为戊己之己明甚，而非始于朱子发。元亨利贞，即春夏秋冬，《彖传》所谓四时也。四时更代，乃革之最大者。卦巽居春夏之交，离为夏，兑为秋，乾为冬，故曰元亨利贞，纯取革义。辞虽与《乾》彖同，义则殊也。\n彖曰：革，水火相息。二女同居，其志不相得，曰革。己日乃孚，革而信之。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成。汤武革命，顺乎天而应乎人。革之时大矣哉！\n息，长也。言更代用事也。但兑离皆阴卦，《易》之道阴遇阳，阳遇阴方志得；若阴遇阴，阳遇阳，则为敌矣。《中孚》六三曰得敌，《艮》彖曰敌应，是也。故其志不相得。巽为志，二至上正反巽，故不相得。己，中央土。仁义礼智信，信亦隶中央，故曰己日乃孚。革而信之，信故无悔。四时相代实相革，期无或爽，信也。汤武革命，天人皆应，亦信也。不信则不能革，故时之所关甚大，此其义也。\n象曰：泽中有火，革；君子以治历明时。\n历者，日月星辰之所历，识其处以定四时。《书》所谓敬授民时，《大戴记》之《夏小正》，《小戴记》之《月令》，皆历也。卦上兑为月，下离为日，乾为寒，离为暑，兑雨巽风皆备，故君子法之，以治历明时。\n初九，巩用黄牛之革。\n离外刚，故曰巩。巩，固也。离为牛。《左传》曰纯离为牛，《离》六二云黄离，故曰黄牛。乃虞翻则谓离无牛象，干宝谓离爻本坤故曰黄牛，皆非也。离外坚为甲，故为革。革，皮去毛者也。固莫固于牛革。言初当勿用之时，不可妄动，宜固守也。牛革所以喻其固也。\n象曰：巩用黄牛，不可以有为也。\n初潜龙勿用，故不可以有为。又上无应，即不信也。不信即不可革。\n六二，己日乃革之，征吉，无咎。\n二离主爻，离贞己，故曰己日。二有应，故曰己日乃革。二遇阳，故征吉而无咎也。按二为日中，王弼以过往诂己日，故决知其非是。\n象曰：己日革之，行有嘉也。\n乾为嘉。行有嘉，谓二征则遇阳，遇阳故吉。\n九三，征凶，贞厉。革言三就，有孚。\n三临重阳，阳遇阳则窒，故征凶，卜问厉也。然三应在上，上兑为言，而兑为毁折，故曰革言。就，即也，遇也。革言三就有孚者，言三虽得敌，不能应上；若上六即三，则甚顺利而有孚也。兑为言，乾亦为言，言多，故曰三就。又三在三爻，《损》六三云三人行，《需》上六云三人来，皆以在三爻，取数于三。三就者，三遇也，谓革言来之多也。有孚者，上孚于三也。易理失传，旧解于征凶之故，莫有明者。岂知征凶贞厉，谓阳遇阳；下二句谓上应三，义不相属也。\n象曰：革言三就，又何之矣！\n之，往也。又何之者，言上六即三，不必他往也。盖革言日至则孚者众而事已审，革之而已，勿再犹豫不定也。\n九四，悔亡，有孚，改命吉。\n四失位宜有悔，无应予则无孚，然九四居乾之中，乾为信，故无悔而有孚。巽为命，四至上巽覆，是改命也。《易林》大畜之夬云：太子扶苏，出于远郊；佞幸成邪，改命生忧。即以《夬》上兑为改命，本此也。改命则革也。盖初以时未至而固守，二孚于天时，三孚于人事，至四遂实行改革矣。《乾》四云或跃在渊，与此理同也。自覆象失传，旧解皆以四变阴成《既济》为改命。既济者终止，何吉之有哉？非也。\n象曰：改命之吉，信志也。\n巽为志。改命则实行革命，故曰伸志。言得行其志也。志行故吉。\n九五，大人虎变，未占有孚。\n乾为大人，为虎。大人虎变者，喻大人履九五之尊，威德诞敷，崇高巍焕，改易旧观，故曰虎变。下有应，故未占而有孚也。乾虎象失传，后惟茹敦和、俞樾知之。虞翻以坤为虎，宋衷以兑为虎，皆非。\n象曰：大人虎变，其文炳也。\n五应二，二离为文，故其文炳。\n上六，君子豹变，小人革面。征凶，居贞吉。\n伏艮为君子，为豹。君子豹变者，谓革命后佐命之勋，皆得封拜而有茅土，尊显富贵。易世成名，故曰豹变。阴称小人。艮为面，艮伏故革面。小人革面者，谓革命之后，除旧布新，小民皆改易其视向也。面，向也。《史记·项羽本纪》，马童面之是也。上六当位，不宜动宜静，故征凶居吉。艮面象，《易林》遯之蒙云：云过吾面。以《蒙》坎为云，艮为面。虞氏谓面指四，非。\n象曰：君子豹变，其文蔚也。小人革面，顺以从君也。\n下应三，离为文。面，向也，故曰顺以从君。言下顺乾也。","50":"鼎卦第五十\n鼎，元吉，亨。\n元谓五。得位有应，故吉亨。端木国瑚曰：鼎之象不在《鼎》，而在伏象《屯》。《屯》下震为足，互坤为腹，上坎为耳，为铉，凡鼎之象无一不备。后人不知《易》于正伏象不分，谓下阴为足，中三阳为腹，五阴为耳。《易》焉有巽足、乾腹、离耳之象哉？按端木氏说是也。二千年误解，得是而正，其功甚伟。\n彖曰：鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。\n鼎之用在烹饪。以木巽火，鼎之用也。乾为圣人，离为目，兑为耳。六五为离兑主爻，故曰耳目聪明。虞翻谓三动成坎离，以坎为耳，后儒多从之。岂知三当位，焉能之不正？任意如此，何象不可得！按《易林》观之中孚云：鼎焬其耳。以《中孚》下兑为耳。比之丰云：李耳汇鹊。亦以《丰》互兑为耳。盖坎之为耳以其陷，兑亦坑坎也，故亦为耳。三爻鼎耳革，五爻鼎黄耳，象甚明也。\n象曰：木上有火，鼎；君子以正位凝命。\n鼎偏倚则势危，故贵正，不正则 覆。鼎敛实于内，故贵凝，不凝则实漫矣。故君子取之，以正位凝命。\n初六，鼎颠趾，利出否。得妾以其子，无咎。\n震为趾，震伏巽陨，故曰颠趾。巽为臭腐，故曰否。否，恶也，污也。初在下卑污之地，出之四则各当位而利矣。四兑为妾，四来初是得妾也。初之四体震，震为子，是得妾兼得子也，故利出也。\n象曰：鼎颠趾，未悖也。利出否，以从贵也。\n悖，逆也。初阴顺阳，故曰未悖。初承阳应四，故曰从贵。\n九二，鼎有实。我仇有疾，不我能即，吉。\n乾为实。仇，匹也，指五。五乘阳势逆，不能即二，故曰有疾。《豫》六五乘刚曰贞疾，兹与之同。我谓二。二为三四所隔，既不能即五；五因乘刚有疾，亦不能即二。然我与我仇，究为正应，始虽阻，终必合也，故结之曰吉。《象》曰终无尤，即谓二五终合也。\n象曰：鼎有实，慎所之也。我仇有疾，终无尤也。\n之，往也。二前临重阳，行不利，故慎所之。二五终合，故终无尤。按此爻旧解，鲜有当者。一仇字失诂，虞翻谓二据四妇，四为仇；朱子以仇为初。阳遇阳为敌之义，自汉失传，故慎所之三字，皆莫知所谓。清儒以汉为步趋，汉儒误遂无不误矣。\n九三，鼎耳革，其行塞。雉膏不食，方雨亏悔，终吉。\n三至五兑为耳，巽陨落，故曰耳革。行，道也。《易林》复之中孚云：鼎焬其耳，热不可举；大路壅塞，旅人心苦。以行为道路。盖三承乘皆阳，阳遇阳故其行塞。上离为雉，兑为膏。雉膏在上，乃上不应三，故雉膏不食。兑为雨，为昧，故曰亏悔。亏悔，不明也。吴先生云：悔，晦也。按《易林》复之鼎云：阴雾作匿，不见白日。不见白日，亏也。《子虚赋》：日月蔽亏。江淹诗：金峰各亏日。是也。阴雾作匿，晦也。吴读与《易林》同也。终吉者，初之四则三临重阴，阳得阴则通，故吉。\n象曰：鼎耳革，失其义也。\n义，宜也。鼎之用全在耳，今耳革失其用，故曰失义。\n九四，鼎折足，覆公 ，其刑剭，凶。\n震为足。三至五兑，兑二折震，震象毁，故曰鼎折足。巽为 。马云 也，郑云菜也。乃三至五巽覆，四为诸侯，三公之位，故曰覆公 。刑剭，王弼作形渥，古音同通用。《管子·心术下》云：意然后刑，刑然后思。注：意感其事，然后呈形。是刑、形古通用。兹从各家。京云：刑在頄为剭。《汉书·叙传》：底剭鼎臣。师古注：剭，厚刑。又《周礼·秋官·司煊氏》：邦若屋诛。郑注云：屋当读为其刑剭之剭。剭诛，谓不于市也。盖四不当位，故象凶如是。巽 之象，按《易林》未济之无妄云：求糜耕田。以《无妄》互巽为糜。而马氏训 为 ，与《易林》同， 即糜也。郑氏训为菜。按《韩奕》之诗曰：其蔌维何，维笋及蒲。疏引《易》曰鼎折足，覆公蔌。是 与蔌通用。而郑训与《诗》合。盖皆巽象，可从。《九家》云：三公调阴阳，犹鼎之调五味。足折 覆，犹三公不胜其任，而覆天子之美，故受此重辜也。王弼以形渥为沾濡，程子谓为汗赧。岂知《下系》云：德薄而位尊，鲜不及矣。谓及于刑辟也，即读为刑剭也。王、程所释，皆望文生义，非也。\n象曰：覆公 ，信如何也？\n乾为信。信如何者，言行为如此，信仰失也。\n六五，鼎黄耳金铉，利贞。\n兑为耳，离黄中，故曰黄耳。乾为金，故曰金铉。铉与扃同。《士冠礼》：设扃鼏。郑注：扃，今文为铉。《释文》：扃，鼎扛也。孔疏所谓贯鼎耳而扛之是也。伏坎象也。六五得中，下有应，故利贞。利贞言二五应也。\n象曰：鼎黄耳，中以为实也。\n乾为实。九二云鼎有实，五得中应二，故中以为实。实指二，黄中色，故曰中以为实。\n上九，鼎玉铉，大吉，无不利。\n乾为玉，上九阳为直，故象玉铉。又上九以铉举鼎，动作自如，无有滞碍，故大吉无不利，与《大畜》上九义同。《象》释曰刚柔节，以五阴为承也。\n象曰：玉铉在上，刚柔节也。\n上阳得五阴为承，故曰刚柔节。诸家多以三变应上成《未济》，为刚柔节。岂知六爻独三当位，胡可使其失正？且变而成《未济》，六爻皆不安，胡能大吉？此自虞翻卦变伎俩，以济其穷者。可复申述之乎？","51":"震卦第五十一\n震，亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。\n震，振也，动也。一阳伏二阴之下，阳必上升，故振动而为雷，为起。《归藏》作釐。李过曰：釐者，理也。黄宗炎曰：谓雷釐地而出以作声。愚按，震为笑乐，为喜，而釐与僖通。《史记》以鲁僖公为釐公，是其证。《说文》：僖，乐也。与喜同。又震为生为福，而釐亦为福。《前汉·文帝纪》：祠官祝釐，如淳曰福也。是釐与震义多同，故《归藏》作釐，《周易》作震。阳得出，故亨。虩虩，恐惧貌。阳来居初，故曰震来。雷之发也，万物震恐，故震来虩虩。阳遇阴则通，故笑言哑哑。哑哑，笑貌。震为百，艮为里，坎为棘匕，为鬯。鬯，秬酒也。震为黍，坎为酒，故曰鬯。震惊百里，不丧匕鬯者，言震雷虽威及百里，而不惊惧也。匕所以载牲，鬯所以降神，皆祭祀之用，故《传》曰可以守宗庙为祭主也。\n彖曰：震亨，震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。\n震为福，故曰恐致福。则，法也。互坎为法则。震为后。后有则者，言阳复于下为阴主也。震为出，为祭，为主。艮为守，为社稷，为庙。震为长子。惊远惧迩，能匕鬯不失，故可为祭主，而长守宗庙社稷也。\n象曰：洊雷，震；君子以恐惧修省。\n洊，再也。上下震，故曰洊雷。因震而恐，因恐而修省。\n初九，震来虩虩，后笑言哑哑，吉。\n阳在下，故曰后。言初虽虩虩恐惧，后则乐也。阳遇重阴故也。\n象曰：震来虩虩，恐致福也。笑言哑哑，后有则也。\n恐则修省，修省则致福。\n六二，震来厉，亿丧贝，跻于九陵。勿逐，七日得。\n来者，复也。震来厉，言阳复初，二乘之，故危厉不安也。亿、噫通。《释文》云：本亦作噫。虞翻云：惜辞也。艮为贝，震者艮之覆，故丧贝。古以贝为货币，因厉丧贝。震为言，故曰惜辞。郑作十万解，似不如虞义也。二至四艮，艮为陵，艮阳在上，阳老故曰九陵。震为跻。跻，升也。而坎为盗，在艮陵上，言有人持贝，跻九陵以去也。然不必逐也。震为逐。数七，故曰七日。震为复。勿逐七日得者，言所丧之贝，不必追逐，至七日自然来复也。旧解皆以离为贝。《易林》剥之蒙云：赍贝赎狸。《蒙》上艮为赍，为贝。又谦之蛊、讼之大畜，皆曰丧贝，亦皆以上艮为贝。盖艮坚在外，与离同也。\n象曰：震来厉，乘刚也。\n乘刚故危。\n六三，震苏苏，震行无眚。\n苏苏，郑云不安也。坎为疾病，故为眚。盖三不当位，故不安；然得阳为承，亦无眚也。\n象曰：震苏苏，位不当也。\n虞以苏为死而复生。由《象传》观之，郑释为当。\n九四，震遂泥。\n遂，隧之省文，隧即坠也。《论语》：文武之道，未坠于地。《石经》作隧。又《列子》：矢隧地而尘不扬。皆以隧为坠。遂，古文隧之省。《荀子·理论篇》：入焉而隊。杨倞注云：隊，古坠字。故荀爽作隊。四坎为泥，陷四阴中，故隧泥。震为行，隧泥则行难矣。\n象曰：震遂泥，未光也。\n坎隐伏，故未光。\n六五，震往来厉，亿无丧有事。\n往得敌，来乘阳，故往来皆危厉也。自阳遇阳、阴遇阴为敌之理失传，于是虞翻不知往厉之故在阴遇阴，只以乘刚为说。乘刚则来厉，于往无涉也。五得中位尊，匕鬯之事，故无丧也。\n象曰：震往来厉，危行也。其事在中，大无丧也。\n行，道也。大无丧，即亿无丧。\n上六，震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。\n索索，郑云：犹缩缩，足不正也。三在震上，苏苏不安，上亦同也。矍矍，郑云：目不正也。《说文》：隹欲逸走也。徐曰：左右惊顾也。震，目无上眦，故因恐惧而视矍矍也。《易林》讼之豫云：眵鸡无距，与鹊格斗；翅折目盲，为鸠所伤。眵，《说文》：目伤眦也。《豫》上震，目无上眦，故曰眵，曰盲，义即本此也。虞翻不知《易》用象之妙，以卦无视象，命三变成离取视象。《易》取象无此迂曲也。三无应，故征凶。震不于其躬于其邻，仍惊远惧迩之意。艮为躬，艮覆为震，故不于其躬于其邻。震为邻。《易林》蹇之噬嗑云：不利出邻，疾病忧患。《噬嗑》下震为邻，为出。出即与坎险遇，而有疾病忧患之苦，是明以震为邻也。邻仍谓三也。言三苏苏，即知其可惧而戒备也。知惧故无咎。卦二至上正反震，故有言。有言者争讼，与《困》之三至上正反兑有言不信同也。卦三男俱备，无一女象，故不能婚媾，如婚媾则必争讼也。自覆象失传，此句旧解二千年无一当者。只《易林》中孚之谦云：伯氏争言。《谦》亦正覆震，与震二至上同。争言即有言。震为伯也。\n象曰：震索索，中未得也。虽凶无咎，畏邻戒也。\n在震上，故曰中未得；因畏而戒，故无咎。","52":"艮卦第五十二\n艮其背，不获其身。行其庭，不见其人。无咎。\n《归藏》作狠。狠，《广韵》：很之俗字。《说文》：很，不听从也。一曰行难也。艮，郑云：艮之言很也。是很、艮义同。艮，止也。震为行，震反故止。《杂卦》：震起也，艮止也。即言正反之义也。旧说以阳在上为止，非其义也。艮为背，为身，为庭，为人。艮其背，静也。三至五互震，故又曰行其庭。行其庭，动也。乃因无应与，静则不获身上手足之用，动则不见庭除应予之人。无动作，无交际，故亦无咎也。\n彖曰：艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。\n艮为时。下艮，故曰时止则止。三至五互震，故曰时行则行。止则静，行则动，动静随时，故其道光明。艮为道路，阳在上故光明。六爻无应予，故曰敌应。阴阳相遇为朋为类，若阳遇阳，阴遇阴，则皆为敌。《同人》九三云：敌刚。以比应皆阳，故曰敌刚。以阳遇阳为敌。《中孚》六三云：得敌。《子夏传》云四与三为敌，而不释其义。荀爽解之曰：三四俱阴，故称敌也。以阴遇阴为敌。此实《易》义之根本。明乎此，则《屯》二之十年乃字，《比》三之比之匪人，《颐》六二之失类，六五之不利涉，《大壮》初九之征凶，《解》九四之解而拇，《夬》初九之往不胜，九四之其行次且，《鼎》九二之慎所之，《震》六五之往厉，皆可观象而得其义。否则不知其所谓矣，此《易》义之所以终古长夜也。然观《子夏传》之解得敌，似此义韩婴已知之，荀爽能释之。然何以于上列各爻，任其失解，抑有解而采辑者不合其意而不录欤？\n象曰：兼山，艮；君子以思不出其位。\n艮为位，艮止故不出。坎为思，得中唯心亨，亦不出。学《易》之君子法之。\n初六，艮其趾，无咎，利永贞。\n爻例在下称趾。足止不动，故无咎。利永贞者，利于永远贞定也。盖初失位，无应遇敌，故贵于无为也。趾，荀作止。止，古文趾字。\n象曰：艮其趾，未失正也。\n利永贞，故不失正。\n六二，艮其腓，不拯其随，其心不快。\n腓，胫肚也。义详《咸》卦。腓之用在行，艮其腓，是不行也。拯，京房作抍，举也。《释文》作承，曰马云举也。可证马氏、王氏本原作承。今作拯者，盖开成以后所定。然抍、承、拯音义并同。艮为手，故曰拯，艮止故不拯。然阴以顺阳为天职，仍须随阳，故曰不拯其随。坎为心，为忧。既不可动，又须随阳，不能自主，故其心不快。\n象曰：不拯其随，未退听也。\n坎为耳，故曰听。听，从也。腓之用在动而前进，不拯是不动不前，而退听也。然阳在上，义必随行，是又不能退听也。进退不克自主，故心不快也。\n九三，艮其限，列其夤，厉薰心。\n限，《说文》：阻也。《玉篇》：界也。即脊骨界左右也。故马、荀、郑、虞皆训为要。三居卦中，坎为要，故取象于限。坎为脊，为肉，故取象于夤。夤，马、虞皆以为夹脊肉。脊骨居中为限，脊肉左右分列。列、裂同。《墨子·明鬼下》云：生列兕虎。《荀子·哀公问》云：两骖列两服入厩。注皆作裂。脊肉裂分左右，脊界其中，故曰裂其夤。皆坎象也。艮为火，互坎为心，故厉薰心。自坎肉象失传，后儒皆不知《噬嗑》三四五三爻之肉象，及此夤象何属。自艮火象失传，虞翻以艮为阍，读熏为阍，谓古阍作熏字，并云马言熏灼其心，未闻《易》道以坎水熏灼人者。岂知艮为火，马氏所诂，正与《易》合。至荀氏以熏为勋，读作动；来知德又云以三十年之功，始悟薰字之由于伏离。由斯证一象之失传，可使名家易人人异词，真可叹也！艮火坎肉象，皆详《焦氏易诂》。（《易林》艮之无妄云：颠覆不制，痛熏我心。是焦亦作熏。 ）\n象曰：艮其限，危薰心也。\n厉，危也，故曰危薰心。\n六四，艮其身，无咎。\n艮为身，见上彖。虞以坤为身，为孕，非也。初趾二腓，三要四身，按爻序自下而上。故《象》释为躬。得位，故无咎。\n象曰：艮其身，止诸躬也。\n艮为躬，躬即身也。三四居卦之中，故曰要，曰身，并无他义。虞氏谓五动乘四则妊身，以止诸躬为妊身。卦无离象，强命五爻变成离。惑乱后学，莫此为甚。\n六五，艮其辅，言有序，悔亡。\n辅，《说文》：人颊车也。在颊之上，与牙车相对。《春秋》僖五年：辅车相依。注云：车，牙车。疏：牙车，牙下骨之名，在颊之下。盖凡物入口，皆赖牙车载之，故名曰车。人欲嚼物，或言语，则牙动而上与辅对，故曰辅车相依。辅在上不动，故艮为辅。《颐》即用以取象。三至五震，震为言，上卦震反，故曰艮其辅。序者次也，言不紊也。三至五震，时而当言则言；四至上震反，时而不当言则言止矣，故曰言有序。《诗·大雅》：序宾以贤。言宾之位次，与其贤相当，秩然不乱也。言行，君子之枢机。时言则言，时止则止，有序如是，故无悔也。虞氏易序作孚，言孚于上也。\n象曰：艮其辅，以中正也。\n五中而不正，正字或疑衍。又或作正中。然《未济》九二《传》：中以行正也。《大壮》九二《传》：大者正也。大谓九二。似亦不拘。\n上九，敦艮，吉。\n敦与顿通。顿，止也。《易》凡言敦，皆有止义、待义。义详敦临、敦复。敦艮者，顿止于上也。下履重阴，故吉。\n象曰：敦艮之吉，以厚终也。\n艮为山，故曰厚。而艮为终，故曰以厚终。唯厚故止也。","53":"渐卦第五十三\n渐，女归吉，利贞。\n上下卦皆阴承阳，阴承阳即妇从夫，故曰渐。渐，进也，次也。言阴次于是，宜进而承阳也。巽为妇，艮止于下，有女归之象。二五应，故利贞而吉。\n彖曰：渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位，刚得中也。止而巽，动不穷也。\n五得位，故有功。艮为邦，故曰正邦。\n象曰：山上有木，渐；君子以居贤德善俗。\n居，积也。居贤德，即积贤德也。坎为积，艮为贤，巽为风俗。有贤德故以善俗。居贤德善俗，皆非猝然可能之事，皆渐义也。\n初六，鸿渐于干。小子厉，有言，无咎。\n鸿，大雁也。艮为鸿。周公《时训》，以雁北乡当《屯》卦，是以坎为北，互艮为雁。故《易林》师之萃云：鸿雁哑哑，以水为家。以《萃》互艮为鸿也。需之遯云：去如飞鸿。亦以《遯》下艮为鸿。干，水涯也。二至四坎水，初在坎下，故曰鸿渐于干。艮少，故为小子。有言者争讼。震为言，艮为反震，败言，故曰有言。《左传》云败言为谗是也。有言故厉。然初为士，潜伏在下，亦无咎也。\n象曰：小子之厉，义无咎也。\n初勿用，故义无咎。\n六二，鸿渐于磐，饮食衎衎，吉。\n磐，大石也。三艮为石，故渐于磐。二坎体，坎为饮食。衎衎，和乐也。二当位，得中应五，故象吉如是。\n象曰：饮食衎衎，不素饱也。\n坎中实为饱。应在五，巽为白，故曰素饱。素饱，犹素餐。不素饱，言得之以道也。\n九三，鸿渐于陆，夫征不复，妇孕不育，凶。利御寇。\n马云：山上高平曰陆。艮为夫，在上，故不复。《易林》复之剥云：夫亡从军，抱膝独宿。以剥艮为夫也。孕，妊娠也。育，生也。震为孕。《左传》昭元年：武王邑姜，方震太叔是也。三震覆，故不育。郭璞《洞林》否之小过云：妇女胎反见华盖。《否》三互巽，故知为妇女。二四互艮，世变艮，艮为反震，是胎反也。胎亦孕也，义即本此也。巽为寇，三下拥群阴，而艮为守御，为坚；寇在外，守御在内，使外寇不入，故利也。旧解皆以坎为寇。岂知坎之为寇，以其隐伏，巽亦为伏，故《易》亦以巽为寇。且以坎为寇，坎寇已在内矣，如何能御之？虞翻以坎为寇，谓自上御下。自上御下，其利在上，于三何与？一象失传，使经义颠倒错乱，至于如此，真可喟也！\n象曰：夫征不复，离群醜也。妇孕不育，失其道也。利用御寇，顺相保也。\n坤为众，为醜。醜，众也。《诗·小雅》，执讯获醜是也。离，附离也。群醜，谓下二阴。言三阳系恋于下二阴，故不复也。诸家训离为去，与下顺相保之义不合，非也。艮为道，坎为失，故失道不育。下二阴顺三阳，以为保守，故曰顺相保。\n六四，鸿渐于木，或得其桷，无咎。\n巽为鸿。《九家逸象》巽为鹳，鹳、鸿皆水鸟，故亦为鸿。周公《时训》以鸿雁来当《巽》卦，是以巽为鸿。故《易林》中孚之同人云：鸿飞遵陆。以《同人》互巽为鸿。又大畜之兑云：鸿盗我襦，逃于山隅。《兑》互巽为盗，为鸿。旧以离为鸿，非也。巽为木，为桷。《说文》：椽方曰桷。得桷，言安也。四当位承阳，故无咎。\n象曰：或得其桷，顺以巽也。\n言顺承五、上二阳。\n九五，鸿渐于陵。妇三岁不孕，终莫之胜，吉。\n巽为高。五应在二，二艮体，五居艮上，故渐于陵。巽为妇，震为孕。震伏，下敝漏，故不孕。又五应在二，为三所阻，不能应二，故三岁不孕。坎为三岁，言其久。然五与二为正应，三岂能终阻之？故终胜三，得所愿而吉也。莫之胜，言三不能胜五也。\n象曰：终莫之胜吉，得所愿也。\n五终能应二，故得所愿。旧解皆从虞氏，以成《既济》定为说，强命初上变，非。\n上九，鸿渐于陆，其羽可用为仪，吉。\n在卦上，与三同，故仍渐于陆。巽为羽。仪，饰也。其羽可用为仪者，巽为高为白，言上居高明之地，羽毛鲜洁，故可用以为仪，贲一切也。巽羽之象，《易林》随之小畜云：奋翅鼓翼。以《小畜》上巽为翼。又颐之兑：六翮长翼。亦以《兑》互巽为翼。\n象曰：其羽可用为仪吉，不可乱也。\n仪型万方，秩然不紊，故不可乱。","54":"归妹卦第五十四\n归妹，征凶，无攸利。\n兑为少女，故曰妹。震为归。妇人谓嫁曰归，故曰归妹。震巽长女从长男为《恒》，则曰利有攸往。兹少女从长男，与《恒》同耳，乃彖义则与《恒》相反，曰征凶无攸利，何也？曰：《恒》下巽，巽阴承阳，与上震无一爻不相应，故利有攸往；《归妹》则巽覆为兑，阴乘阳，初三皆失应，故征凶。巽为利，巽覆故无攸利。又中四爻皆不当位，贞静自守，尚恐有咎，动则悔吝生矣，故征凶不利也。《下系》云：其为道也屡迁，变动不居，周流六虚，上下无常，刚柔相易，不可为典要，唯变所适。正谓此。《恒》与《归妹》，上卦同也，下卦同为二阳一阴也，乃巽则如彼，巽覆则如此，唯变所适也。唯变所适，谓甲卦与乙卦，一爻变动，则吉凶相反。非谓卦无是象，强命某爻变，以成其象也。自汉以来，因误解变动不居，唯变所适二语，援为护符，浪用爻变，以济其穷。前有虞翻，后有焦循，其尤也。\n彖曰：归妹，天地之大义也。天地不交，而万物不兴。归妹，人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。\n归妹而后有夫妇。天地者夫妇之义，天地交而后有万物，故归妹为女之终，生人之始。中爻皆不当位，三五皆以柔乘刚，故征凶，无攸利也。\n象曰：泽上有雷，归妹；君子以永终知敝。\n女归则永终。兑毁折，故以知敝为戒。\n初九，归妹以娣，跛能履，征吉。\n初在兑下，故曰娣。娣者，嫡之女弟也。《公羊传》：诸侯一聘九女，嫁者一娣一侄，媵者皆有侄娣。嫁者谓嫡，嫡及两媵、六侄娣共九女。兑折震，故跛。然二升五则下成震，震为足，故曰跛能覆，征吉也。《象》曰吉相承，即承二升五而吉也。\n象曰：归妹以娣，以恒也。跛能履，吉相承也。\n按初无应，二阳为阻，不能前进，有凶无吉。兹曰吉相承，谓二升五下卦成震，初临重阴，相随而吉。相承者，谓二升五吉，初承其后仍吉也。虞翻求其义而不得，强命初爻变阴承阳为说。夫初当位，胡能使变？经义之不明，此等曲说乱之也。以恒，盖谓女嫁随侄娣，乃娶妇之常道。说者动以《恒》卦为解，非。\n九二，眇能视，利幽人之贞。\n二三半离，故曰眇。《说文》：眇，一目小也。然能视者，以互离也。二应在五，五震为人，兑为昧，故曰幽人。利幽人之贞，言利与五相上下，各当位也。\n象曰：利幽人之贞，未变常也。\n未变常，言二五相应与乃常道也。\n六三，归妹以须，反归以娣。\n须，《说文》：面毛也。归，嫁也。归妹为嫡，今以须之故，反嫁为娣也。伏艮为须。《易林》同人之否云：牵于虎须。《否》互艮为虎，为须。虞氏训须为需。需，待也。六三若有待义，与九四之有待义复矣。《易林》涣之归妹云：妹为貌慹，败君正色。《庄子·田子方》：老聃新沐，方将被发而干，慹然似非人。慹，言可怖也。是焦氏亦训须为面毛也，故曰貌慹。\n象曰：归妹以须，未当也。\n未当，言不宜有是恶象也。《困》上六当位矣，《象》曰未当也，义与此同。《革》传曰革而当，义皆同宜。后雅雨堂《集解》本见虞注作位未当，竟于《象传》添一位字。岂知正文若作位未当，《释文》早言之矣。今《释文》无有，可证虞本亦无位字。雅雨本皆从惠栋校，改字甚多。昔人谓惠氏乱经，兹更添字，宜罪之者多也。\n九四，归妹愆期，迟归有时。\n震为时，坎陷故愆期。愆，过也。愆期故迟归待时，待升五也。又下无应，亦愆期之一因。卦四时俱备，故曰有时。升五则时至矣。\n象曰：愆期之志，有待而行也。\n坎为志，震为行。有待而行者，待升五也。\n六五，帝乙归妹，其君之袂，不如其娣之袂良。月既望，吉。\n震为帝，故曰帝乙。帝乙，汤也。《京房易》载其嫁妹之辞，是汤曾嫁妹，故曰帝乙归妹。震为君，为袂。而震亦为口，袂袖口也。袂在五震，故曰君袂；在二兑，故曰娣袂，皆取象于口。乃五阴二阳，故君袂不如娣良。坎为月，为中。震东兑西，坎月离日，东西相望，正望日也。惟五居坎末，时已过中，故曰既望。既望，从孟、荀读。虞作几，京作近，晁说之云：古文近、既读同。孟云既望者，十六日也。五得中有应，故吉。震君、震袂、震口象皆失传，说详《焦氏易诂》。\n象曰：帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。\n虽不正而得中。中五位尊，故曰贵。\n上六，女承筐无实，士刲羊无血。无攸利。\n下兑为女，震为筐。女在下，筐在上，故曰女承筐。乃上不应三，故无实。震为虚，亦无实也。震为士，兑为羊，为斧，为毁折，故曰士刲羊。乃三不应上，故无血。坎为血。三体离，坎伏，故无血。此与《夬》九二，因爻无应，即就无应取义。旧解坐不知此，故说之永不能通。巽为利，巽伏，上下失应，故无攸利。震虚象失传。虞翻用卦变成坤，取虚象。岂知震为苍筤竹，为苇，皆取其中虚。况《象传》曰虚筐，亦以震为虚。\n象曰：上六无实，承虚筐也。\n《象》明言震虚，故知虞氏非。","55":"丰卦第五十五\n丰，亨，王假之。勿忧，宜日中。\n雷电皆至东，故丰。《说文》：丰，豆之丰满者也。四阳遇重阴，故亨。震为王。假，至也。王假之，言四宜上升至五也。震为乐，故曰勿忧。离为日，中谓五。宜日中者，谓四升五，当位如日中也。\n彖曰：丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食。天地盈虚，与时消息。而况于人乎？况于鬼神乎？\n尚，上也。大谓阳。尚大，谓四宜上升五。四升五则日中，光照天下。兑月离日。日中则昃，月盈则食，言丰之不足恃也。\n象曰：雷电皆至，丰；君子以折狱致刑。\n先天离东，后天震东，故曰皆至。离明故可折狱，震威故宜致刑。\n初九，遇其配主，虽旬无咎，往有尚。\n阴阳相配，配主谓二。二五为卦主，故五曰夷主。配，郑作妃，义同也。离为日。日之数十，十日为旬。初居日之末，故曰旬。至旬则癸日也。《后汉·邓禹传》：明日癸亥，匡等以六甲穷日，不出。是至旬当有咎，自古相传如是也。虽旬无咎者，以初遇阴也。二阴，故往有尚。\n象曰：虽旬无咎，过旬灾也。\n旬者盈数。过旬灾，仍月盈则食之意也。\n六二，丰其蔀，日中见斗。往得疑疾，有孚发若，吉。\n二至五互大坎，坎为隐伏，故中四爻象皆暗昧。蔀，虞翻云：日蔽云中称蔀。虞未申其义。然坎云在离日之上，正日蔽云中也。离为星，故曰斗。又震亦为斗。斗七星也，言离日有障蔽，日隐而星见也。二巽体，巽为疑，为疾。《巽》初六《象》曰进退志疑是也。五不应，故往得疑疾。然二承重阳，孚于三四。发若者，言其顺利也，阴孚阳故吉。离星、巽疑象，详《焦氏易诂》。\n象曰：有孚发若，信以发志也。\n有孚，故信。巽为志。信以发志者，言阴孚于阳，得行其志也。\n九三，丰其沛，日中见沬。折其右肱，无咎。\n沛，大雨貌。《孟子》：沛然下雨。《易林》泰之丰云：龙蛇所聚，大水来处；滂滂沛沛，使我无赖。《九家》云：大暗谓之沛。沬，《子夏传》：星之小者。日中见沬者，言当日中而昏暗，见小星也。三兑体，兑为雨，故曰沛。兑为晦，故曰见沬。艮为肱。三应在上，上艮覆，故折其右肱。兑为右，为折也。然三当位有应，故无咎。\n象曰：丰其沛，不可大事也。折其右肱，终不可用也。\n三遇敌，不利往；所应为阴，阴小，故不可大事。三虽有应而折肱，故终不可用。虞氏以二至五《大过》死解，似非。\n九四，丰其蔀，日中见斗。遇其夷主，吉。\n《易林》升之临云：据斗运枢。以震为斗。兹震在日上，以为障蔽，故仍曰丰其蔀，日中见斗。主谓五。五柔爻，故曰夷主。《诗·周颂》：有夷之行。《毛传》：夷，易也。阳遇阴则通，故曰易，曰吉。\n象曰：丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉行也。\n兑为昧，故幽不明。阳遇阴，故志行。郭京《举正》：行上脱志字。宜从。\n六五，来章，有庆誉，吉。\n呼九四来五，当位居中，《彖》所谓日中也，故曰章。五得位，故有庆誉吉。或谓四往五不能曰来，岂知六五呼四，当然曰来。况《睽》上九云：往遇雨则吉。是上来内，《易》有时亦言往也。《需》上曰：有不速之客三人来。是三往上亦曰来也。《蹇》五：大蹇朋来。是阳往五亦曰来也。此曰来章，又何疑乎？\n象曰：六五之吉，有庆也。\n庆，谓阳升五得位。\n上六，丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。\n屋，家户。后儒不知其象，穿凿百出，愈说愈晦，此覆象失传之故也。按虞注云：从外窥三。又《九家》说重门击柝云：豫下艮，从外示之，上震复为艮。《丰》上六从外示内，亦艮也。艮为屋，为家，为户，中爻大坎，故障蔽其家。艮为观，下视，故曰窥其户。震为人。上应在三，三巽伏，故阒寂无人。阒，虞云空也，郑云无人貌。震为岁，数三，故曰三岁不觌而凶也。阒，孟喜作窒。窒古与空通用。《列子·黄帝篇》：玉人潜行不空。《庄子·达生篇》引作窒。然则孟、虞之诂同也。\n象曰：丰其屋，天际祥也。窥其户阒其无人，自藏也。\n五天位，上在五外，故曰天际。《说文》：祥，福也，善也。徐铉曰：凡吉凶之先见其兆者，皆曰祥。故孟喜曰：天际祥，天降下恶祥也。自藏谓三。三宜应上，而巽为伏，故曰自藏。释无人之故也。祥，从郑本。《正义》作翔，翔祥音同通用。\n此卦旧解，因易理失传，不知二五为卦主，于是遇其配主，遇其夷主，皆以震为主，杈枒不合。因卦象失传，于是爻变卦变，杂然并用，以求其象。学者只涵泳白文，或尚能明其一二；若即旧解求之，则愈茫昧疑惑，真可慨也！","56":"旅卦第五十六\n旅，小亨，旅贞吉。\n旅之卦义，先儒皆以行旅为说。然卦名皆由卦象生，火山何以为旅？侯果、孔疏皆以火在山上，势难久留，故为旅。如所诂火在山上，不久即灭耳，安见其为行旅？按《易林》剥之旅云：居正不安，大盗为咎。大畜之旅云：安其室庐，傅母何忧？是皆以居家为说，于行旅之义正相反。履之旅云：乌子鹊雏，常与母俱；愿慕群旅，不离其巢。又晋之旅云：逐旅失群。是以旅为伴旅。卦二阴随二阳，一阴随一阳，阳前阴后，有若伴侣。疑焦氏所诂者，于卦象为切。又《释诂》：旅，众也。卦离火，艮亦为火，火多故众，伴旅亦众也。九三《象》云以旅与下，以众与下也。若作行旅，此句难通矣。又初爻：旅琐琐，斯其所。斯，离也。行旅往来，有不离其所者哉？于行旅之义尤不合。故疑焦义是也。六五得尊位，故小亨，贞吉。\n彖曰：旅小亨，柔得中乎外而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉！\n六五上下皆阳，故曰顺乎刚。《离》六五云离王公，即顺乎刚也。《旅》五月卦，当中夏，故曰时。\n象曰：山上有火，旅；君子以明慎用刑，而不留狱。\n《大象》以相反见义，此亦其一也。离为明，君子不敢恃其明，故用刑必慎。艮为慎，兑为刑也。艮为止，君子不敢怠于事，故不留狱。艮为拘系，为狱也。\n初六，旅琐琐，斯其所，取灾。\n琐琐，陆绩、郑玄皆训为小。马云：疲弊貌。按《尔雅·释诂》：琐琐，小也。注：舍人曰琐琐，计谋褊浅之貌。《诗·节南山》：琐琐姻娅。盖往来猥琐，劳弊不安也。斯，《释言》：离也。斯其所，言离其所，欲应四也。二得敌，故取灾。离为灾。盖初六不当位而得敌，在下宜静不宜动。故《易林》复之旅云：二人辇车，徙去其家；井沸釜鸣，不可以居。徙去其家，即离其所；井沸釜鸣，即取灾也。义详《焦氏易诂》。\n象曰：旅琐琐，志穷灾也。\n初不当位，二得敌，不能应四，故曰志穷。\n六二，旅即次，怀其资，得僮仆，贞。 （举正作贞吉，宜从。 ）\n艮为舍，次舍也。即次，言就舍也。资，财也。巽为利，居中，故怀其资。艮为僮仆。二得位承阳，故得僮仆。贞下宜依《举正》增吉字。贞吉，与下贞厉为对文。\n象曰：得僮仆贞，终无尤也。\n即次身安，怀资用足，得僮仆役使有人，故终无尤。艮为终。\n九三，旅焚其次，丧其僮仆，贞厉。\n艮为火，故焚其次。巽为陨落，故丧其僮仆。贞，卜问也。虞翻以离火焚其次，并谓三动艮坏为焚。夫离火在外，上又不应三，焉能下焚？《易林》蹇之噬嗑云：火起上门，不为我残。《噬嗑》火在艮门上，故不焚下。《旅》火亦在上，其不能下焚同也。三当位，强命其变，以之不正，尤非。艮火象，详《焦氏易诂》。\n象曰：旅焚其次，亦以伤矣。以旅与下，其义丧也。\n兑毁折，故曰伤。以众与下，威权下移，宜其丧失。下谓初、二。言三于初、二相得，以势众付之也。\n九四，旅于处，得其资斧，我心不快。\n资斧，从王弼。各家多作齐斧。资、齐音同通用。按《周书·谥法解》，资辅供就曰齐。言佐身之具，供张整齐也。而《春秋元命苞》云：斧之言辅也。是斧、辅音义皆同，故资斧即资辅。独阳不生，孤阴不成，故阴阳互相资助。四遇阴，故曰得其资斧。而兑为斧，亦为辅。张轨云：资斧盖黄钺斧。直以为兵器，非也。毛奇龄云：处，居也。旅于处得其资斧者，言于所居之处，而得此资辅也。然而不快者，以尚未升五得位。又四为三所阻，不能应初，亦不快之一因也。巽为志，故为心。《巽》初《象》云：志疑也。即以巽为志。《杂卦》云：巽伏也。心志伏在内，故巽象之。旧解命四变成坎取心象，非。\n象曰：旅于处，未得位也。得其资斧，心未快也。\n凡九四比六五，例终升五。《归妹》九四曰：有待而行。待往五也。《丰》九四曰：遇其夷主吉行也。六五曰：来章。亦言四来五也。兹曰未得位，因未得五位，故处以俟也。下六五曰终以誉命，即谓四终升五也。\n六五，射雉，一矢亡，终以誉命。\n离为雉，兑毁折，故射雉。射必以矢，坎为矢。乃坎伏不见，故一矢亡。坎数一也。誉，令闻也。艮为誉。命，爵命也。巽为命。终以誉命者，言巽命在二，虽不应五，然四必得位升五。四升五，二应之，是誉命终及于五也。\n象曰：终以誉命，上逮也。\n逮，及也。上逮，谓二终上应五也。\n上九，鸟焚其巢，旅人先笑后号啕。丧牛于易，凶。\n离为鸟。中虚，故为巢。巽风扇火于下，故焚巢。上履阴，兑悦，故先笑；三巽体，巽为号，三不应上，故后号啕。《左传》昭五年：纯离为牛。兑毁折，故丧牛。艮为田，为易。易，田畔也。牛在艮外，故丧牛于田畔。焚巢丧牛，故凶。晁说之云：易，古文埸字。《诗·小雅》疆埸有瓜是也。\n象曰：以旅在上，其义焚也。丧牛于易，终莫之闻也。\n旅，众也。在上者众，不自敛抑，则高亢为祸。《左传》隐四年：兵犹火也，不戢将自焚。是其义也。坎为耳，坎伏故莫之闻。虞翻用爻变取震象，谓震为筐故为巢，后儒多从之。按《易林》离之需云：高木腐巢。《需》坎为木，在上，故曰高木。互离为巢，在泽水中，故曰腐巢。讼之解云：南徙无庐，鸟破其巢。《解》上震，震为南，为徙；下坎为室，震在坎外，故曰南徙无庐。互离为鸟，为巢，而坎为破，故曰鸟破其巢。以离为巢，庶得真解。","57":"巽卦第五十七\n巽，小亨，利有攸往，利见大人。\n初、四皆承阳，故曰巽。巽，顺也。顺阳故小亨，往遇阳故利。阳居二五得中，故利见大人。\n彖曰：重巽以申命。刚巽乎中正而志行，柔皆顺乎刚，是以小亨，利有攸往，利见大人。\n巽为命令。《虞书》：申命羲叔。《传》：申，重也。重巽以申命者，谓王者一再宣布命令，以示郑重也。巽为风，行莫疾于风。命令一出，传达天下，有若于风，故巽为命也。二五中正，下阴顺承，故志行。\n象曰：随风，巽；君子以申命行事。\n重巽，故曰随风。随，继也，从也。言后风之随前风也。令出惟行，万事以治，故君子以之。\n初六，进退，利武人之贞。\n初临重阳得主，故宜于进。而四无应与，故进而又退。《象》释曰志疑，疑四无应也。震为武人。此巽卦也，何以利武人之占？因震巽相反复，巽究则为震。《易》贵将来，故武人利也。\n象曰：进退，志疑也。利武人之贞，志治也。\n巽不果，故志疑。返震，故志治。言得行其志，以治天下。\n九二，巽在床下，用史巫纷若，吉，无咎。\n巽为床，初顺二，故曰巽在床下。初至四正覆兑，兑口多，故曰用史巫纷若。按《周礼·内史》云：凡命诸侯孤卿大夫，则策命之；凡四方之事书，内史读之。《仪礼》云：辞多则史。又《司巫》云：男巫女巫，凡邦之大灾，则歌哭而请。是史巫皆以口舌为用。而二居正反兑之间，故曰纷若。纷若，言不一也。二得中，故吉无咎。此义先儒无知者，只茹敦和云：巽初之阴，伏于床下，慝也，于是乎用史巫以袪之；史巫云者互兑也。象始大明。而茹氏仍不知初至三为覆兑，故纷若不得解。\n象曰：纷若之吉，得中也。\n二无应，失位，遇敌。然下孚于阴，得中，故吉。\n九三，频巽，吝。\n王弼云：频，频蹙不乐。按《玉篇》颦下云：《易》本作频。是频即古文字颦字。三居巽上，虽当位而下桡，故频蹙不安而吝也。\n象曰：频巽之吝，志穷也。\n巽为心志。上无应，下乘阳，故曰志穷。\n六四，悔亡，田获三品。\n当位承阳，故悔亡。伏震为田猎，兑羊、离牛、巽豕，故田获三品。离卦数三也。凡阴遇重阳多吉。\n象曰：田获三品，有功也。\n有所获，故有功。\n九五，贞吉，悔亡，无不利。无初有终。先庚三日，后庚三日，吉。\n九五得位，下孚于阴，故贞吉悔亡。巽为利，故无不利。震巽相反复，无初者，言巽之初为震。震纳庚，一爻当一日，故曰先庚三日。今震究为巽，故无初。有终者，言巽之究仍为震。终即后也，故曰后庚三日。以其终为震，故曰有终。震阳复，故吉。先庚三日，言巽之先；后庚三日，言巽之究。与《蛊》之先甲三日，后甲三日义同。无初有终，与《蛊》之终则有始，义亦同。\n象曰：九五之吉，位正中也。\n九五既中且正，故吉。\n上九，巽在床下，丧其资斧，贞凶。\n巽，顺也。谓四。巽在床下，言顺我者在下。上九失其辅助，故曰丧其资斧。斧、辅通用。兑为斧，亦为辅。上卦兑覆，故曰丧。丧，失也。说详《旅》卦。\n象曰：巽在床下，上穷也。丧其资斧，正乎凶也。\n九穷于上而下桡，故贞凶。《象》仍释贞为正，其义不协。","58":"兑卦第五十八\n兑，亨，利贞。\n兑，悦也。兑何以悦？以一阴见于二阳之上，阳得阴而悦也。刚中柔外，与《泰》义合，故亨。阴阳相遇，故利贞。\n彖曰：兑，说也。刚中而柔外，说以利贞，是以顺乎天而应乎人。说以先民，民忘其劳。说以犯难，民忘其死。说之大，民劝矣哉！\n阴阳相遇故悦，悦故利贞。所谓保合太和，各正性命也。五天位，上顺之，故曰顺乎天。互巽为顺也。三人位，巽于二，故曰应乎人。互巽为应也。三至上大坎。坎为民，为劳，为险难，为棺椁，故为死。而三至上正反兑，坎民来往，皆在兑说之中，故役之而忘劳，犯难而不知死也。兑见在上，故曰先民。先民说，先使民悦也，故民劝。\n象曰：丽泽，兑；君子以朋友讲习。\n《玉篇》：丽，偶也。《周礼·夏官·校人》：丽马一圉。注：丽，耦也。又《士冠礼》：主人酬宾，束帛，俪皮。注：俪皮，两鹿皮。古文俪作离。《离》传云：离，丽也。是丽与俪通，仍耦也。重兑，故曰丽泽。犹重巽曰随风。其以互离为义者，非也。阴阳相遇相悦为朋友，兑口故曰讲习。初至五正反兑相对，正朋友互相讲习之象，故君子法之。虞翻谓兑二阳同类为朋。夫阳遇阳，阴遇阴，则为害为敌，《艮》与《中孚》皆言之，岂得为朋友？又云伏艮为友。盖取义于《损》六三，一人行则得其友。岂知艮之为友，以一阳上行，遇二阴为友，与兑之以一阴下降，遇二阳为朋友同，皆取义于阴阳相遇。朋友之诂既误，于是卦无艮兑而言朋者，必百计变动以求兑象，甚至用《参同契》纳甲之法，谓八日兑象月见丁，以解《坤》彖之得朋。凡《易》之言朋者，无不误矣。\n初九，和兑，吉。\n与二并行，故曰和。当位故吉。初与二本为敌，卦以兑说为义，和以处之，自然吉矣。\n象曰：和兑之吉，行未疑也。\n初得敌，故疑于二。和以处之，故行不疑。《损》三云：三则疑也。《易》于阳遇阳相疑相忌之故，言之至为明白矣。乃竟失传，何哉？\n九二，孚兑，吉，悔亡。\n孚于三，阳遇阴，故吉。得中，故悔亡。\n象曰：孚兑之吉，信志也。\n阳遇阴，故志得伸。巽为志。三巽主爻，二遇之，故信志。\n六三，来兑，凶。\n在内称来。来就二阳以为悦，行为不正则有之，无所谓凶；但三本多凶，又不当位，来而不正遂不宜矣。\n象曰：来兑之凶，位不当也。\n来而不当位，故凶。\n九四，商兑未宁，介疾有喜。\n四不当位，无应，前又遇阳，似不吉；然而有喜者，以下履阴也。《小畜》九五曰有孚，《履》九四曰志行，皆以下遇阴而吉。此与之同。商，量度也。商兑者，以初至五正反兑相对，而四若与下对语者，故曰商兑。讲习之象，亦以此也。三至五巽，进退不果，故未宁。互大坎为疾。乃四独履阴，志行，是疾去也。介，助也。《诗》以介眉寿是也。介疾有喜者，言助疾使愈，兑悦故有喜也。\n象曰：九四之喜，有庆也。\n九四独履阴。履阴故有喜，故曰有庆。\n九五，孚于剥，有厉。\n阳遇阴则通，故二五皆孚于三上。然吉凶不同者，兑为秋，六三当正秋，万物成熟，故二孚之而吉。若上六则为季秋，其辰在戌，其卦为《剥》。《杂卦》云：剥，烂也。当此时，万物荒落，阳气为阴所剥将尽矣，九五若再孚于是，必为所剥无疑也，故曰有厉。\n象曰：孚于剥，位正当也。\n以人事言，上六处悦之极，是小人佞幸之尤。九五当人君之位，而昵近此等小人，其为祸有不可胜言者。《象》曰位正当，言正当人君之位，不可与上六近也。\n上六，引兑。\n引，开弓视的也。伏艮为手，故引兑。言上六来就五阳以为悦，犹射者之志于的也。\n象曰：上六引兑，未光也。\n兑暗昧，故未光。","59":"涣卦第五十九\n涣，亨，王假有庙。利涉大川，利贞。\n旧解皆以风行水上，涣散为说。然如涣王居、涣其躬等爻辞，散义皆不通。按《太玄》拟涣为文。司马光云：扬子盖读涣为焕。案，涣即有文义。《淮南子·说山训》：夫玉润泽而有光，涣乎其有似也。注：文采似君子也。《后汉书·延笃传》：涣烂其溢目。注：涣烂，文章貌。是涣本有文义。故《归藏》作奂。《礼·檀弓》：美哉奂焉。《释文》：奂本亦作焕。是扬子之读，与古训合。卦坎为赤，震为玄黄，巽为白，而风行水上，文理烂然，故为文也。为文则于爻辞无扞格矣。震为王，艮为庙。假，至也，言王有事于宗庙。震为舟，在水上，故利涉。皆中爻象。\n彖曰：涣亨，刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。\n刚来居二，临一阴则陷，二阴则通，故曰不穷。四当位，上承一阳固吉，承二阳尤吉。上同者，与《小畜》六四、《升》初六之上合志同也，言孚于五、上也。震为舟。古刳木为舟，五乘之，故曰乘木。乘木即乘舟。\n象曰：风行水上，涣；先王以享于帝立庙。\n享帝则礼仪繁盛，立庙则楹桷巍焕，皆属于文，正释卦义也。\n初六，用拯马壮，吉。\n震为马，初承之，故曰拯马。郑云：拯，承也。拯马即承阳，震健故壮吉。此与《明夷》六二象同，故辞同。故《象传》皆以顺释之。拯，顺也。\n象曰：初六之吉，顺也。\n言阴顺阳，以顺释拯义也。\n九二，涣奔其机，悔亡。\n焦循云：《汉·百官公卿表》，虎贲郎注，贲读与奔同。据是奔、贲古通，奔其机即贲其机。按机即几筵之几，庙中所用物。贲，文饰也。艮为几，震为玄黄，故贲其机。得中，遇阴，故悔亡。\n象曰：涣奔其机，得愿也。\n阳遇重阴，志行，故曰得愿。旧解无有知其故者。\n六三，涣其躬，无悔。\n艮为躬。涣其躬，即行有文也。得阳应，故涣其躬无悔。\n象曰：涣其躬，志在外也。\n巽为志，应在上，故志在外。\n六四，涣其群，元吉。涣有丘，匪夷所思。\n坎为众，为群；四体艮，艮为光明，在坎上，故涣其群。承阳，故元吉。艮为丘。丘陵所以设险，今去坎险而复遇山险，故曰匪夷所思。夷，平也，常也。言为恒常所不料也。\n象曰：涣其群元吉，光大也。\n遇阳故光大。按《象》曰光大，亦释涣为文。\n九五，涣汗其大号，涣王居，无咎。\n吴先生曰：涣汗，连绵字。愚按《上林赋》：采色浩汗。注：玉石符采映耀也。涣汗盖与浩汗同，与涣烂亦同。巽为号令。涣汗其大号，即颁布光显其号令，如风之无不届也。艮为居，五君位，故曰王居。涣王居，言王居巍焕也。五履万民之上，故光大如此也。得中，故无咎。\n象曰：王居无咎，正位也。\n五位中正，故曰正位。五无应，然无咎者，以得中也。\n上九，涣其血去逖出，无咎。\n血，古文恤字。逖与惕音同通用。《小畜》六四：血去惕出。与此同也。诂逖为远者非。应在三，坎为忧惕。王国维云：古易、狄同字。《山海·大荒东经》并《竹书》皆云，王亥托于有易。而《楚辞·天问》作有狄。又简狄，《古今表》作简逖。按《汉书·王商传》：卒无怵悐忧。师古云：悐，古惕字。故虞翻注云：逖，忧也。与《小畜》六四诂惕为忧同。是虞即以逖、惕同字。上九应在三，三坎为忧惕，而上九高出卦上，去坎险既远，又不为互艮所止，与《大畜》上九义同。涣其，光明貌；涣其恤去惕出，言光明在上，忧患自免也。句法与《论语》涣乎其有文章同。\n象曰：涣其血，远害也。\n坎为害。上去三远，故曰远害。","60":"节卦第六十\n节，亨，苦节不可贞。\n坎居西方，兑又居西，合为一处，故曰节。节，信也。古剖竹为符，合以取信。故《说文》云：节，竹约也。《序卦》云：物不可以终离，故受之以《节》。节之用在合，故与离对文。又曰：节而信之。是《序卦》即以节为符信也。凡卦名皆从卦象生，震为竹，而二至五正反震，两竹相合，则信成矣。而坎为信也。苦节向无通诂。虞翻命三变成离，火炎上作苦，以说苦节，而后儒多从之。诚以诂苦为甚、为过，皆不安也。按《周礼·考工记》：辨其苦良。《史纪·五帝纪》：舜陶于河滨，器皆不苦窳。皆以苦为恶。节所以取信，苦窳则难以持久，不能符合，故曰苦节不可贞。自先天象失传，节字失诂，于是苦节之义，遂亦失矣。又坎为破，兑毁折。按卦象节易苦窳，戒之所以慎始也。\n彖曰：节亨，刚柔分而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成，节以制度，不伤财不害民。\n艮为道，艮止故道穷。《荀子·性恶篇》：故善言古者必有节于今。节，信也。四时往来，不差不忒，故曰天地节而四时成。艮为时，为成，震卦数四，故曰四时成。度，丈尺也。度有制则民有信，信则不伤财，不害民。\n象曰：泽上有水，节；君子以制数度，议德行。\n数度皆所以取信于民。数纪于一，协于十，长于百，大于千，衍于万。有数而度量衡以起，度十分为寸，十寸为尺，十尺为丈。而度之生由于律。律，竹管也。累秬黍九十为九寸，以为黄钟之长，用以度长短。《虞书》云：同律度量衡。诚以日久度量衡或差，同之以律，则不失毫厘。律者，节也。人之德行，亦有定节，以取信于世，与数度同。故君子取以为法焉。\n初九，不出户庭，无咎。\n初应在四，艮为户庭；而二阳为阻，故不宜出。不出则无咎。《象》曰知通塞，言二阻塞也。\n象曰：不出户庭，知通塞也。\n初应在坎，坎为通；二遇敌，不能应四，故曰塞。知其塞，不出户庭以求通，故曰知通塞。吴先生曰：《易》以阳在前为塞，阴在前为通。初之不出，以九二在前，故曰知通塞。二则可出而不出，故有失时之凶也。\n九二，不出门庭，凶。\n互艮为门庭。二比重阴，阳遇阴则通，通则利往。乃竟不出，是失时也，故凶。\n象曰：不出门庭凶，失时极也。\n艮为时。极，中也。《说文》：极，栋也。栋居屋脊，当屋之中，故极为中。失时极，即失时之中也。\n六三，不节若，则嗟若，无咎。\n三失位无应，故曰不节。震为笑，震反为艮则嗟矣。《离》九三云：不鼓缶而歌，则大耋之嗟。与此象义并同也。王弼云：若，辞也。语助辞也。顺二故无咎。\n象曰：不节之嗟，又谁咎也？\n言其咎在己。\n六四，安节，亨。\n得位有应，上承九五，艮止为安，故安节亨。\n象曰：安节之亨，承上道也。\n言能承上，不失其道。\n九五，甘节，吉，往有尚。\n《说文》：甘，美也；美，甘也。而坎为美脊，故坎有美象。甘节，即美节也。节而美善，方可用以取信。与下苦节为对文。五当位居中，下乘重阴，正位居体，故甘节吉。爻在外为往。往得尊位，居之不疑，故曰往有尚。虞氏强命二变应五，以释往字。岂知爻在外即曰往，《泰》、《否》之大小往来可证也。\n象曰：甘节之吉，居位中也。\n艮为居，五中位。\n上六，苦节，贞凶，悔亡。\n甘为美，则苦为恶。坎为破，故曰苦节。节为信约，窳恶则不能符合，故贞凶。得位故无悔。\n象曰：苦节贞凶，其道穷也。\n在上无应，故穷。","61":"中孚卦第六十一\n中孚，豚鱼吉，利涉大川，利贞。\n上卦《节》。节，信也。节何以为信？以中爻两震竹相合。《中孚》初至五象与《节》同，仍两竹相合，而在中四爻，故曰中孚。孚，信也。《归藏》曰大明。大明者，离日。《晋》，顺而丽乎大明是也。是以小过为坎，大明为离，取义与《周易》微异也。巽为豚，为鱼。鱼象人知之，豚即失传。岂知《姤》初云：羸豕孚蹢躅。即以巽为豕。《易林》大有之姤：牝豕无猳。旅之遯：彭生为豕。皆以巽为豕。盖坎为豕以其隐伏，巽为伏故亦为豕。而《中孚》正覆巽，豚鱼合居于中，故吉。坤为大川，震为舟，为虚，为木。五履重阴，乘震舟之上，故曰利涉大川。《传》释曰：乘木舟虚。按《涣》传云：乘木有功。乘木即乘舟。又《益》传云：木道乃行。木亦谓舟。据王应麟所辑郑注云：舟，谓集板如今船。（原作自，阮校《诗·谷风正义》云：自，当为船。 ）空大木为之曰虚。即古又名曰虚，总名皆曰舟。据郑注，木舟虚三者平列为义，皆船也。利贞，《传》释为应乎天。五天位，三四皆阴爻，阳得阴则通，阴顺阳故曰应乎天。\n彖曰：中孚，柔在内而刚得中。说而巽，孚乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。\n中爻艮为邦。艮邦、震舟、震虚象皆失传，详《焦氏易诂》。\n象曰：泽上有风，中孚；君子以议狱缓死。\n《玉篇》：狱谓之牢，又谓圜土。中爻艮止为狱，两艮相合，则圜狱也。震为言，故议狱。兑为毁折，故曰死。议狱缓死，欲孚及罪人而向善也。\n初九，虞吉，有它不燕。\n《仪礼·士虞礼》注，释虞为安。初阳遇阳，不宜动，与《节》初同。《节》初九，不出户庭无咎，即谓安吉也。它谓四，四巽为陨落。有它，谓不安于初，不顾二阻而它往应四，则不燕也。燕与宴通，亦安也。兑为燕，四巽兑覆，故曰不燕。《易林》小畜之兑、随之萃，皆曰燕雀衔茅，则皆以兑为燕。除《易林》外，他无用者。故《易林》为易象薮。\n象曰：初九虞吉，志未变也。\n巽为志。志未变，言安于初而不应四。\n九二，鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。\n震为鹤，为鸣，为子。阴，山阴。二至五正反震，下震鹤鸣于山阴，三至五震反，如声回答，若相和然，故曰其子和之。其子，谓覆震，非互震，判然二物也。《易林》大有之屯云：噂噂所言。噂噂，对语也。《屯》初至五亦正覆震相对，与《中孚》同。又同人之中孚云：衣裳颠倒。震为衣，三至五震覆，故曰颠倒。涣之中孚云：闻言不信。震言，三至五震覆，故不信。不信取其相反，子和取其相对，仍同也。而二至五亦正反艮，艮纳丙为山阳，下二至四艮覆，则山阴矣。而二正当其处，故曰鸣鹤在阴。《易林》颐之中孚云：熊罴豺狼，在山阴阳。正覆艮，故既曰熊罴，又曰豺狼。上艮为山阳，下覆艮为山阴也，故曰在山阴阳。《易林》释此语，可谓明白矣。山阴之义，知者甚鲜。后独茹敦和以阴为山阴，而取义于兑。兑者艮之反，艮山阳，兑山阴。义不本《易林》，而取义与《易林》同。故夫有清一代之易家，主张自己，不随声附和者，莫茹氏若也。爵，《说文》：饮器。酒尊也。震为尊，为爵，为嘉，故曰好爵。正覆震相对，故曰吾与尔靡之。孟喜云：靡，共也。贞我悔彼，尔谓五。言二五共此爵也。\n象曰：其子和之，中心愿也。\n巽为心志。鸣和全在中四爻，故曰中心愿。\n六三，得敌，或鼓或罢，或泣或歌。\n《子夏传》：三与四为敌，故曰得敌。荀爽曰：三四俱阴，故称敌也。中四爻艮震相反覆，震为鼓，艮止故罢。罢、疲通，音婆，下与歌叶。诸家或作罢音，非也。震为歌，震反则泣矣。与艮为山阳，艮反为山阴义同也。盖三不当位而遇敌，故不常如此也。得敌，与《颐》二之失类，《艮》之敌应，为《易》义之根本，所关甚大。乃得敌，韩子夏与荀知之，失类则无知者，致阴遇阴、阳遇阳之处皆失解，可喟也！\n象曰：或鼓或罢，位不当也。\n义见前。\n六四，月既望，马匹亡，无咎。\n兑为月。十五日，日月望，乾象月盈甲；十六日，平明，巽象月退辛。六四巽主，故曰既望。既，王弼作几，孟、荀皆作既。孟云十六日也。作既于巽象方切。震为马，四匹在初。马匹亡，言不应初而承上也。承阳故无咎。\n象曰：马匹亡，绝类上也。\n阴阳相遇方为类。旧解皆以阴遇阴为类，故全《易》类字皆失诂。绝者，决也。言四遇三敌，不能应初。类上，即承上也。\n九五，有孚挛如，无咎。\n五下乘重阴，得类，故曰有孚。言孚于二阴也。挛，系也，恋也。《前书·李夫人传》：挛挛顾念我。有孚挛如者，言系挛三、四也。五得位，故无咎。\n象曰：有孚挛如，位正当也。\n五既中且正。\n上九，翰音登于天，贞凶。\n《曲礼》曰：鸡曰翰音。巽为鸡，为高。居巽上，又居卦之极上，故曰翰音登于天。上应在三，三震为翰、为音也。巽下陨，故贞凶。王注：翰，高飞也。飞音者，音飞而实不至之谓也。居卦之上，华美外扬，虚声无实，故不可久长。\n象曰：翰音登于天，何可长也？\n穷上失位，下虚，故不长。翰音取象皆在应，非只巽鸡。《易》无一字不由象生，观此益信矣！震翰象失传，详《焦氏易诂》。","62":"小过卦第六十二\n小过，亨利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。\n过之为义，《彖传》即不明释，故讫无定解。后儒于是有以经过为说者。端木国瑚谓兑巽过乾之左右，故曰大过；艮震过坤之左右，故曰小过。有以过越为说者。朱震谓《大过》阳过阴，大者过越也；《小过》四阴二阳，小者过越也。前一说只见于端木氏，后一说则易家多从之。然尚有五阳五阴之卦，何以不言过？且汉人以《大过》为死卦，阳过盛而反死，又何说乎？如谓四阳为上下二阴所束缚故死，则《小过》四阴包二阳，胡以不谓之死乎？又四阳在中为大过，四阴在中何以不谓为小过，而必以四阴在外者为小过乎？是皆可疑，而先儒无言者。按《太玄》拟大过为失，云阴大作贼，阳不能得。言阳为阴贼，而失其用也。拟小过为羡、为差，云阳气赞幽，推包羡爽，未得正行。言震阳本可直出，乃为上下四阴所包，推排曲抑，仍有羡爽。羡，邪曲；爽，差也。盖《大过》按卦气时当小雪，穷阴极寒，故阳气极衰。《小过》时当立春，阳气辟东，本可无阻，乃为阴气所包，仍不免小有回曲。大小过纯以卦义言，不以阴阳多少言也。卦二五阴得中，二阴承重阳，故亨。阴牝阳，故利贞。阴得中，故可小事。阳失位而不中，故不可大事。《左传》昭五年，筮遇《明夷》之《谦》曰：日之谦当鸟。日之谦，即离变艮。变艮而曰当鸟，是以艮为鸟。《易林》本之，以艮为黔啄，为鸟（详《焦氏易诂》 ）。《小过》下艮，故曰鸟。上震故曰飞鸟。而震为覆艮，是上下皆鸟，故《传》曰有飞鸟之象焉。宋衷谓二阳在内，上下各二阴，有似飞鸟舒翮之象。虞翻则用卦变，云《小过》从《晋》来，《晋》上离为鸟。惠士奇谓古飞、非通用，《小过》即非字象，故曰飞鸟。愈演愈奇，皆艮鸟象失传之过也。遗，送也。震为音。茹敦和云：下艮为反震，口向下若送音于人者，故飞鸟遗之音。上谓五，五失位而乘阳；下谓二，二当位而承阳，故上不宜而下大吉也。\n彖曰：小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉。飞鸟遗之音，不宜上宜下，大吉，上逆而下顺也。\n艮为时。刚失位指四，不中指三。有飞鸟之象，谓上下卦皆艮也。非如宋衷之解。艮为鸟，上艮覆故曰逆，下反是故顺。又五乘刚故逆，二承阳故顺。\n象曰：山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。\n震为行。恭或为艮象。兑毁折，故曰丧。震为乐，震反为艮，故为哀。俭亦或为艮止象。旧解皆用卦变，无确诂。姑测其义如此。又三者皆过之微，即诂小过之义也。\n初六，飞鸟以凶。\n艮为鸟。四虽有应，二得敌，应予阻格，又失位，故凶。\n象曰：飞鸟以凶，不可如何也。\n言应四难。\n六二，过其祖，遇其妣。不及其君，遇其臣。无咎。\n艮为祖。二承三，故过其祖。巽为妣。二当巽初，故遇其妣。《尔雅》：母曰妣。妣谓二，祖谓三。二应在五，五震为君，乃五不应，故不及其君。艮为臣，三艮主爻，二承之，故遇其臣。艮为祖，巽为母，震君艮臣，象皆失传，故旧解无通者。义详《焦氏易诂》。\n象曰：不及其君，臣不可过也。\n传义未详。旧说或昆仑，或浮泛，皆不安。\n九三，弗过防之，从或戕之，凶。\n四遇敌，故弗过。艮为守，为坚，下有群阴承之，利于防守，故曰防之。与《渐》九三、《蒙》上九利御寇，义同也。三应在上，戕，害也。从或戕之者，言三若应上，则四或害之也。艮为刀剑，四艮反向下，故戕之。首曰防之，所以戒也。\n象曰：从或戕之，凶如何也！\n极言其凶。\n九四，无咎，弗过遇之。往厉必戒，勿用永贞。\n四临重阴，利往，故无咎。四应在初，遇谓遇三也。三为四敌，故戒以弗过，然而遇之。往厉者，谓往应初而厉也。往应初，则三戕之，故厉。厉则宜有所戒，勿用而贞定自守可也。无咎指上行，弗过指下行。昔贤皆泥于往外为往。岂知《需》上云：三人来，是往外而曰来；《睽》上云：往遇雨，是来内而曰往。《易》固于往来不执定例也。\n象曰：弗过遇之，位不当也。往厉必戒，终不可长也。\n言之初仍勿用为宜，终不可长。\n六五，密云不雨，自我西郊。公弋取彼在穴。\n《文言》以坤为云。五上重阴，故曰密云。兑为雨，风火在下，故不雨。兑西震东，言此密云起自西郊，而东行也。震为公，为射，故曰公弋。弋者，系绳于矢以射鸟。乃不射鸟，而以弋取彼在穴之艮狐，胡能得乎？盖五应在二，二巽为绳，艮为矢。以绳系矢，弋象也。而艮为穴，为狐，艮手为取。穴居之物，岂能弋取？言二不应五，有如此也。凡《易》取象，不于本爻必于应。应爻有应予，如《明夷》初爻应在四震，则曰飞，曰翼，曰攸往，曰主人有言，全取震象而直言之。应爻无应予，亦往往取其象而明其不应。如《归妹》上六应在三兑，则曰女承筐，曰士刲羊，女与羊皆兑象；而三不应上，故又曰无实无血。及此爻皆是也。旧解不知此例，见象无著，则用卦变以当之，于是《易》义遂亡于讲说矣。\n象曰：密云不雨，已上也。\n已上，与《小畜》之上往同义。\n上六，弗遇过之，飞鸟离之。凶，是谓灾眚。\n弗遇，言为五所格，应三难也。乃竟过之，是无心相值，不虞之祸。盖艮为鸟，上卦艮覆，鸟首向下有坠象；而艮为刀兵，正坠兵刃之上。离、罹通，遭也。遭此意外之祸，故凶也。三巽体，巽为疾病，故为灾眚。是谓灾眚者，言祸非由己。致无妄之灾，不可如何也。\n象曰：弗遇过之，已亢也。\n虞翻云：飞下称亢。按《说文》：亢，人颈，或从页。是亢即颃，古通为一字。《诗·邶风》：颉之颃之。《毛传》：飞而上曰颉，飞而下曰颃。故《前书·扬雄传·解嘲》：邹衍以颉亢而取世资。颃即作亢。师古云：颉亢，上下不定也。亦训亢为下。上卦艮鸟覆，有坠象，故曰亢。已亢者，言飞鸟离灾而下也。李道平云：阳言亢，阴不言亢，故虞不从俗说。《闻见录》云：唐张师为赞皇尉，梦白鸟飞翔堕于云际，召黄贺筮之，遇《小过》，曰：雷震山上，鸟堕云间；声迹两销，不可复见。委心顺命可也。是亦以艮为鸟。艮覆，故曰鸟堕。互大坎，故曰云间。震为声迹，坎隐伏，故曰声迹两销，不可复见。是亢之为下，再见于唐人所释。以艮覆为鸟堕，黄贺独知也。","63":"既济卦第六十三\n既济，亨，小利贞，初吉终乱。\n《尔雅·释天》：济谓之霁。疏：霁，止也。《说文》同。《归藏》作岑 。 即霁字。上坎为雨，下离为日，雨过日出，故曰既济。《谦》传：天道下济。即下止也。《诗·鄘风》：不能旋济。《传》：济，止也。《庄子·齐物论》：厉风济则万窍为虚。注：济，止也。《彖传》曰：终止。《杂卦》曰：既济定。亦皆训济为止。既者，尽也。《左传》桓三年，日有食之既是也。既济者，言六爻尽当位而止其所也。止其所而不迁，则道穷，故彖辞不许其终吉。《释文》释济为度，《太玄》释为成。惟《彖传》曰终止，即明释既义、济义。既者尽也，终也，终止即既济。后儒纷纭不已者，以忽略终止即说卦义也。\n六爻皆当位有应，故亨。小利贞，小字，俞樾云：衍文，卦辞只曰亨利贞。故《传》特以小者亨也释之。如原有小字，则人人皆知，《传》不如此释矣。《子夏传》、虞翻皆以亨小断句，似非。毛奇龄云：宜以既济亨句，小利贞句。小利贞与小利有攸往同。按毛说于句读适矣。然《传》曰刚柔正，是兼大小言也，今专以属之小，于六爻当位之义不合。然则小字属上下读皆不安。征之《彖传》，其为衍文无疑。俞氏之说，似为可信。盖《易》之为道，以阳为主，阴与阳绝不平等。故阴得阳应必吉，阳得阴应则不必吉，且有以为凶者，如《大过》四爻，《中孚》初爻皆是。《既济》二四承乘皆阳，又三阴皆有阳应，故小者亨。《彖传》专以亨属小，亦谓大者不然。大何以不然？凡阳遇重阴必吉，一阴则否。《既济》三五皆陷阴中，虽三阳皆得位有应，然所应者阴，固与柔爻异也。此《传》之所以专以亨属之小也。既济者终止，其在《既济》之初，上下得所，民物咸宜，故初吉。然《易》之道以变通为贵，无或休息。止而终于是，则易道穷矣，故终乱。\n彖曰：既济亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也。\n卦三阴三阳，二为阴始得中，故曰初吉。上六则阴之终，故曰终止。则乱，坤为乱也。五刚亦得中，不许其吉者，以陷于阴中，与柔得中异也。\n象曰：水在火上，既济；君子以思患而预防之。\n治乱相循环，当治不可忘乱。坎为患，为心，故曰思患。\n初九，曳其轮，濡其尾，无咎。\n初应在四，四坎为曳，为轮，为濡。四居坎下，故曰曳，曰尾。所有象皆在应爻。旧解苦于本爻求，胡能合乎？曳、濡当有咎，得正故无咎。\n象曰：曳其轮，义无咎也。\n得正有应，当然无咎。\n六二，妇丧其茀，勿逐，七日得。\n《左传》昭五年：火，水妃也。故离为坎妇。茀，车蔽也。《诗·硕人》曰：翟茀以朝。疏：妇人乘车不露见，车之前后，障以翟羽，以自隐蔽，谓之茀。按《周礼》有巾车职，巾所以为蔽，即茀也。坎为隐伏，为茀。乃坎在外，故丧其茀。盖离为光明，二承乘皆阳，无所隐蔽，如妇人之丧其茀也。卢兆鳌云：初曳轮，二丧茀，义实相因。其改字作绂、作髢者，皆非也。震为逐，半震故勿逐。七日得者，震为复，数七。言至七日，自然来复，与《震》二同义也。\n象曰：七日得，以中道也。\n二得中，故得。\n九三，高宗伐鬼方，三年克之，小人勿用。\n《易林》于既未济，偶用半象，本之《易》也。三四形震，震为帝、为主，故曰高宗，曰伐。坎为三年，为鬼方。高宗，殷王武丁。鬼方，西羌国名。《范书·西羌传》云：殷室中衰，诸侯叛，至高宗伐西戎鬼方，三年乃克。又曰，周季历伐西落鬼戎是也。坎为艰，为劳，故三年乃克。小人谓上六。《复》上六云：反君道。《比》上六云：无首凶。《师》上六云：小人勿用。是上六反君道，无首，为小人之尤。兹于三爻发之者，以三应在上六，故预戒也。\n象曰：三年克之，惫也。\n坎为劳，故曰惫。惫，疲极也。\n六四，繻有衣袽，终日戒。\n此与《解》三用象同。 ，《说文》：缯采色。按缯，《说文》：帛也。三四震象，震为衣。 有，言有帛衣也。四五巽象，巽为帛，亦为袽。袽，败絮也。 有衣袽者，言虽有帛衣，衣败絮以自晦，终日戒备也。离为日，坎为忧，故曰终日戒。盖四居两坎之间，坎为盗，惧有所侵犯，故恶衣以自晦。袽，《说文》引作 。《释文》云：《子夏》作茹。茹、袽、 音同，故通用。又云：京作絮。按，絮即 之形讹字。《太玄·迎》首云：裳有衣襦。裳者礼服，襦者短衣。乃有裳不用而衣襦，释此句至为明晰。又《释文》： ，《子夏》作襦。薛虞云，古文作 。按襦、 古通。《周礼》罗氏注，郑司农云：襦为 有衣 之 。《弓人》注，郑司农云：帤读为襦有衣 之 。是襦、 、袽、 古通用，故各家读不同。\n象曰：终日戒，有所疑也。\n坎为疑。\n九五，东邻杀牛，不如西邻之禴祭，实受其福。\n离位东，故曰东邻。坎位西，故曰西邻。离为牛，兑为毁折，为斧，故曰东邻之杀牛。坎为饮食，故为祭。禴，薄祭也。坎为薄，故曰西邻之禴祭。乾为福。杀牛而祭，当受福矣。然不如禴祭受福者，以坎当五，得中正之时也。此离东坎西之确证。郑氏谓离日出东，故曰东邻；坎月生西，故曰西邻。而不知离即在东，坎即在西，则卦象失传之故也。又汉人往往以纣与文王之事说此爻，非。\n象曰：东邻杀牛，不如西邻之时也。实受其福，吉大来也。\n受福故吉。\n上六，濡其首，厉。\n坎为首。阴乘阳，故濡其首。与《比》上六之无首义同。《彖》所谓终乱者此爻。\n象曰：濡其首厉，何可久也！\n荀爽曰：居上濡五，处高居盛，必当复危，故何可久。","64":"未济卦第六十四\n未济，亨。小狐汔济，濡其尾，无攸利。\n济，止也。六爻皆当位，止其所而不动，故曰既济。兹六爻皆不当位，不止，故曰未济。终而止，则其道穷；终而不止，则其道不穷，故既未济相续而循环。柔得五中，故亨。艮为小狐。卦有三艮形，故《易林》涣之未济云：三虎上山，更相喧唤。是以《未济》为三艮，故曰三虎上山。兹曰小狐，是以艮为狐。汔，《说文》：涸也。干宝云：小狐力弱，汔乃可济。今水未涸，故濡其尾。艮为尾也。濡尾，故无攸利。按《九家》，坎亦为狐。兹曰小狐、曰尾，艮为小、为尾，故知取艮象。济者，济坎水也。\n彖曰：未济亨，柔得中也。小狐汔济，未出中也。濡其尾无攸利，不续终也。虽不当位，刚柔应也。\n未出中，言二陷于坎中也。六爻皆不当位，无攸利。然刚柔相应，穷则宜变，变则通，故不续终。申不止之义也。\n象曰：火在水上，未济；君子以慎辨物居方。\n乾阳物，坤阴物，阴阳各当位，是居方也。阴阳皆不当位，是聚而失其方也。辨而明之，慎其居而择所处，则无咎矣，故君子以之。\n初六，濡其尾，吝。\n在下故曰尾，濡尾故吝。\n象曰：濡其尾，亦不知极也。\n极，《说文》：栋也。栋居屋中，故极者中也。濡尾，故不知极。言初在下失中。\n九二，曳其轮，贞吉。\n坎为轮，为曳。居中，故贞吉。\n象曰：九二贞吉，中以行正也。\n以位言，九二中而不正。兹曰行正，以正释贞也，非谓位正。\n六三，未济征凶，利涉大川。\n不当位，前遇险，故征凶。征凶则不能利涉，兹曰利涉大川，上下文义反背。朱子疑利上有不字。按《象》云位不当，则不利也。缺以俟知者。\n象曰：未济征凶，位不当也。\n承乘皆险，动则必凶。柔居刚，故位不当。\n九四，贞吉，悔亡。震用伐鬼方，三年有赏于大国。\n坎为鬼。《易林》观之既济云：班马还师。是用半震。震为马，为反。既济三半震，故曰班马还师。兹《易》曰震用伐鬼方，亦以四五形震，为《易林》之所本。震为威武，为征伐。坎为三年，故曰三年。有赏于大国者，言伐鬼方有功，以大国赏之也。盖以五上半艮为国也。贞吉，卜问吉也。高士奇《天禄识馀》云：《易》震用伐鬼方，郭琛谓震乃挚伯名。《程传》训为威武，则三年有赏于大国，何人也？以文理言，此说颇胜，而述之者少。\n象曰：贞吉悔亡，志行也。\n坎为志。四承乘皆阴，故志行。\n六五，贞吉，无悔。君子之光，有孚吉。\n离为光，五君位，故君子之光。下有应，故有孚吉。\n象曰：君子之光，其晖吉也。\n离为大明，故其晖吉。晖，《说文》：光也。\n上九，有孚于饮酒，无咎。濡其首，有孚失是。\n坎为酒，为饮食。上九下履重坎，故有孚于饮酒。有应，故无咎。上应在三，三居重坎之中，故亦濡其首。六爻皆有应，故有孚。皆失位，故失是。然不续终之故，正以此也。\n象曰：饮酒濡首，亦不知节也。\n上艮为节。节，止也。过而不止，故不知节。\n既、未济之卦形，即异于常卦，故所取之象，往往为本卦所无。如曰逐，曰高宗，曰伐，曰 衣袽，曰杀，曰祭，曰福，曰大国，曰震，本卦皆无此象。于是虞氏用卦变以求其象，惝恍支离，莫可究诘。然经于九四曰震，且明以四五为震矣，故知其他皆用半象也。《易林》本之，于观之既济云：班马还师。震之既济云： 啮啮。兑之既济云：积石为山。旅之既济云：逐鹿南山。恒之既济云：三妪治民。是皆于《既济》取震马、震鹿、巽妪、兑齿、艮山象。又谦之未济：千柱百梁。是以艮为梁柱。《未济》三艮形，故曰千柱百梁。又涣之未济：三虎上山。亦以三艮为三虎。又蹇之未济云：一口三舌。亦以重兑为三舌。凡《易林》取象，无不本于《易》。此用半象，必有所受之，而其详不传。由是证施、孟、梁丘三家易学，其取象皆尚有极繁琐之口传。徒以古人尚质，竹书艰难，其所为易传，皆疏其大义，而不详其烦琐。致使象数之细微，皆存之口授，不著竹帛，以伤其方雅。故汉时学《易》者必有师。非重师，重口授也。口授一绝，后人虽欲知而莫由。幸《焦氏易林》未亡，吾人可按其辞，抽绎坠象，使《易》之晦辞得以复明，《易》之误解俾以复正。不然，且终古长夜矣！\n上经终《坎》、《离》，《坎》中爻震艮，《离》中爻巽兑，是举《坎》、《离》而六子具也。下经终《既》、《未济》，乾坤具备；而《既济》一阳一阴，则震兑也；《未济》一阴一阳，则艮巽也：是举《既》、《未济》而八卦备也。故以为六十四卦之殿。其卦既无所不包，其象遂父母与六子俱备。故《易》与《易林》，于《既》、《未济》取象，独不同欤？"};

/* ===== 工具函數 ===== */
function getLines(hex) {
  var lower = TRIGRAMS[hex.lower].lines;
  var upper = TRIGRAMS[hex.upper].lines;
  return lower.concat(upper);
}

/* 根據六爻數組查找卦 */
function findHexByLines(linesArr) {
  return HEXAGRAMS.find(function(h) {
    var hl = getLines(h);
    return hl.every(function(v, i) { return v === linesArr[i]; });
  });
}

/* 錯卦：陰陽全反 */
function getCuoGua(hex) {
  var lines = getLines(hex);
  var reversed = lines.map(function(l) { return l ? 0 : 1; });
  return findHexByLines(reversed);
}

/* 綜卦：上下顛倒（六爻順序反轉） */
function getZongGua(hex) {
  var lines = getLines(hex);
  var flipped = lines.slice().reverse();
  return findHexByLines(flipped);
}

/* 復卦（互卦）：二三四爻為下卦，三四五爻為上卦 */
function getFuGua(hex) {
  var lines = getLines(hex);
  var lower = [lines[1], lines[2], lines[3]];
  var upper = [lines[2], lines[3], lines[4]];
  return findHexByLines(lower.concat(upper));
}

/* 雜卦：雜卦傳中與該卦成對的卦（奇偶相鄰配對） */
function getZaGua(hex) {
  var pairId = hex.id % 2 === 1 ? hex.id + 1 : hex.id - 1;
  return HEXAGRAMS.find(function(h) { return h.id === pairId; });
}

/* 生成關聯卦卡片HTML */
function relatedCardHTML(typeName, typeDesc, targetHex) {
  if (!targetHex) return '';
  var tLines = getLines(targetHex);
  var sym = '';
  for (var i = 5; i >= 0; i--) {
    sym += '<div class="yao ' + (tLines[i] ? 'yang' : 'yin') + '"></div>';
  }
  return '<div class="related-card" data-id="' + targetHex.id + '">' +
    '<div class="related-type">' + typeName + '</div>' +
    '<div class="related-desc">' + typeDesc + '</div>' +
    '<div class="related-symbol">' + sym + '</div>' +
    '<div class="related-name">' + targetHex.name + '</div>' +
    '</div>';
}


/* 渲染周易集解：區分經文與注疏 */
function renderJijieLines(text) {
  var lines = text.split('\n');
  var out = '';
  lines.forEach(function(ln) {
    if (!ln) return;
    var cls = 'jj-line', display = ln;
    var isJingZhuan = /^《[序卦彖象文言易]》/.test(ln);
    var isZhushu = !isJingZhuan && (/^(《[^》]+》|[一-鿿]{1,4})曰：/.test(ln) || ln.indexOf('案：') === 0);
    if (isZhushu) {
      cls += ' zhushu';
      var am = ln.match(/^(.+?)曰：/);
      if (am) {
        display = '<span class="jj-author">' + am[1] + '曰</span>：' + ln.substring(am[1].length + 2);
      } else {
        display = '<span class="jj-author">案</span>：' + ln.substring(2);
      }
    } else {
      cls += ' jing';
      if (isJingZhuan || ln.charAt(0) === '(' || /^(初|九|六|上)[九六]/.test(ln)) {
        cls += ' title';
      }
    }
    out += '<div class="' + cls + '">' + display + '</div>';
  });
  return out;
}


/* 渲染一爻的說文解字 */
function renderShuowen(entries) {
  if (!entries || !entries.length) return '';
  var items = '';
  entries.forEach(function(en) {
    var head = en.c === en.w ? en.c : en.c + '<span class="sw-benzi">本字 ' + en.w + '</span>';
    items += '<div class="sw-item"><span class="sw-char">' + head + '</span>' +
      '<span class="sw-def">' + en.e +
      (en.p ? '<span class="sw-fan">' + en.p + '</span>' : '') +
      '</span></div>';
  });
  return '<div class="line-shuowen"><div class="sw-head">說 文 解 字</div>' + items + '</div>';
}


/* 渲染東坡易傳：爻位/經傳/卦體行標題高亮 */
function renderDongpoLines(text) {
  var out = '';
  text.split('\n').forEach(function(ln) {
    var cls = 'dp-line';
    if (/^(初九|初六|九[一二三四五]|六[一二三四五]|上九|上六|用九|用六)[，:：]/.test(ln) || /^《[彖象文言序卦]》/.test(ln) ||
        /[乾坤震艮離坎兌巽](上|下)$/.test(ln)) {
      cls += ' title';
    }
    out += '<div class="' + cls + '">' + ln + '</div>';
  });
  return out;
}

/* 三家象數古籍通用行渲染（爻位、傳目金色高亮；連寫文本先補換行） */
function renderGujiaLines(text) {
  if (!text) return '<div class="gj-line">（此卦未錄）</div>';
  var t = text.replace(/([。；;])(?=(初九|初六|九[二三四五]|六[二三四五]|上九|上六|用九|用六|彖曰|象曰|文言曰?|《彖》|《象》|《文言》))/g, '$1\n');
  var out = '';
  t.split('\n').forEach(function(ln) {
    ln = ln.trim();
    if (!ln) return;
    var cls = 'gj-line';
    if (/^.{0,4}卦第[一二三四五六七八九十百零]+$/.test(ln) ||
        /^[乾坤震艮离離坎兌兑巽](刚|柔)/.test(ln)) {
      cls += ' book-head';
    } else if (/^(初九|初六|九[二三四五]|六[二三四五]|上九|上六|用九|用六)/.test(ln) ||
               /^(彖曰|象曰|文言|《彖》|《象》|《文言》|大象|小象|序卦|杂卦|繫辭|系辞)/.test(ln) ||
               /^[乾坤震艮离離坎兌兑巽](上|下)[乾坤震艮离離坎兌兑巽]?(上|下)?[。.]?$/.test(ln)) {
      cls += ' title';
    }
    out += '<div class="' + cls + '">' + ln + '</div>';
  });
  return out;
}

/* ===== 渲染八卦 ===== */
function renderTrigrams() {
  document.querySelectorAll('.trigram').forEach(function(el) {
    var tg = el.dataset.tg;
    var lines = TRIGRAMS[tg].lines;
    var html = '';
    for (var i = lines.length - 1; i >= 0; i--) {
      html += '<div class="yao-line ' + (lines[i] ? 'yang' : 'yin') + '"></div>';
    }
    el.innerHTML = html;
  });
}

/* ===== 渲染六十四卦網格 ===== */
function renderHexGrid() {
  var grid = document.getElementById('hex-grid');
  var html = '';
  HEXAGRAMS.forEach(function(hex) {
    var lines = getLines(hex);
    var symbolHTML = '';
    for (var i = 5; i >= 0; i--) {
      symbolHTML += '<div class="yao ' + (lines[i] ? 'yang' : 'yin') + '"></div>';
    }
    html += '<div class="hex-card" data-id="' + hex.id + '">' +
      '<div class="hex-num">第 ' + hex.id + ' 卦</div>' +
      '<div class="hex-symbol">' + symbolHTML + '</div>' +
      '<div class="hex-name">' + hex.name + '</div>' +
      '</div>';
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.hex-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var id = parseInt(this.dataset.id);
      location.hash = '#/hexagram/' + id;
    });
  });
}

/* ===== 渲染開場六十四卦湧現 ===== */
function renderIntroHexGrid() {
  var grid = document.getElementById('hex-grid-intro');
  var html = '';
  HEXAGRAMS.forEach(function(hex, idx) {
    var lines = getLines(hex);
    var symbolHTML = '';
    for (var i = 5; i >= 0; i--) {
      symbolHTML += '<div class="mini-yao ' + (lines[i] ? 'yang' : 'yin') + '"></div>';
    }
    var delay = (idx * 0.02) + 's';
    html += '<div class="hex-cell-intro" style="animation-delay:' + delay + '">' +
      symbolHTML + '</div>';
  });
  grid.innerHTML = html;
}

/* ===== 渲染單卦詳情 ===== */
function renderDetail(id) {
  var hex = HEXAGRAMS.find(function(h) { return h.id === id; });
  if (!hex) return;
  var lines = getLines(hex);
  var upperTG = TRIGRAMS[hex.upper];
  var lowerTG = TRIGRAMS[hex.lower];

  var symbolHTML = '';
  for (var i = 5; i >= 0; i--) {
    var label = hex.lines[5 - i].pos;

  var linesHTML = '';
  hex.lines.forEach(function(line, li) {

    if (line.xiangXiao) {

    linesHTML += '<div class="line-item">' +
      '<div class="line-position">' + line.pos + '</div>' +
      '<div class="line-text">' + line.text + xiangHtml + swHtml + '</div>' +

  if (hex.extra) {
    var extraXiang = '';

    '<span class="jijie-sub">集漢魏三十五家易說 · 含序卦關聯 · 點擊展開</span>' +
    '<span class="jijie-arrow"></span></div>' +

    '<span class="jijie-arrow"></span></div>' +
    '<div class="jijie-body"><div class="jijie-content">' +
    renderGujiaLines(ZHANG[String(hex.id)] || '') +
    '</div></div></div></div>';

  /* 尚秉和 周易尚氏學 */
  var shangHTML = '<div class="gj-panel"><div class="jijie-panel">' +
    '<div class="jijie-header">' +
    '<span class="jijie-title">周易尚氏學 · 近代 尚秉和</span>' +
    '<span class="jijie-sub">詳考逸象 以象釋經 · 點擊展開</span>' +
    '<span class="jijie-arrow"></span></div>' +
    '<div class="jijie-body"><div class="jijie-content">' +
    renderGujiaLines(SHANG[String(hex.id)] || '') +

  var cuo = getCuoGua(hex);

    relatedCardHTML('復 卦', '窺探內情 關注過程', fu) +

      location.hash = '#/hexagram/' + rid;
    });
  });

  /* 集解 / 東坡易傳展開收起 */

}

/* ===== 視圖切換 ===== */
function showView(name) {
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById(name).classList.add('active');
  window.scrollTo(0, 0);
}

/* ===== 路由 ===== */
function handleRoute() {
  var hash = location.hash;
  if (hash.indexOf('#/hexagram/') === 0) {
    var id = parseInt(hash.replace('#/hexagram/', ''));
    if (id >= 1 && id <= 64) {
      renderDetail(id);
      showView('detail-view');
      return;
    }
  }
  showView('main-view');
}

/* ===== 開場動畫 ===== */
function playIntro() {
  var overlay = document.getElementById('intro-overlay');
  var phaseTaiji = document.getElementById('phase-taiji');
  var phaseBagua = document.getElementById('phase-bagua');
  var phaseHex = document.getElementById('phase-hexagrams');

  overlay.classList.remove('fade-out');
  overlay.style.display = 'flex';
  phaseTaiji.classList.add('visible');
  phaseBagua.classList.remove('visible');
  phaseHex.classList.remove('visible');

  setTimeout(function() {
    phaseTaiji.classList.remove('visible');
    phaseBagua.classList.add('visible');
  }, 2500);

  setTimeout(function() {
    phaseBagua.classList.remove('visible');
    phaseHex.classList.add('visible');
    renderIntroHexGrid();
  }, 5000);

  setTimeout(function() {
    overlay.classList.add('fade-out');
    setTimeout(function() {
      overlay.style.display = 'none';
    }, 1000);
  }, 7500);
}

/* ===== 隨機抽卦（點擊即出結果） ===== */
var drawModal = document.getElementById('draw-modal');
var drawCard = document.getElementById('draw-card');
var drawResult = document.getElementById('draw-result');
var currentDrawId = null;

function openDrawModal() {
  drawCard.classList.remove('flipped');
  drawModal.classList.add('active');
  currentDrawId = null;
}

function closeDrawModal() {
  drawModal.classList.remove('active');
  setTimeout(function() { drawCard.classList.remove('flipped'); }, 400);
}

drawCard.addEventListener('click', function() {
  if (!drawCard.classList.contains('flipped')) {
    var idx = Math.floor(Math.random() * HEXAGRAMS.length);
    var hex = HEXAGRAMS[idx];
    currentDrawId = hex.id;
    var lines = getLines(hex);
    var symbolHTML = '';
    for (var i = 5; i >= 0; i--) {
      symbolHTML += '<div class="yao ' + (lines[i] ? 'yang' : 'yin') + '"></div>';
    }
    drawResult.innerHTML =
      '<div class="result-num">第 ' + hex.id + ' 卦</div>' +
      '<div class="result-name">' + hex.name + '</div>' +
      '<div class="result-fullname">' + hex.full + '</div>' +
      '<div class="result-symbol">' + symbolHTML + '</div>' +
      '<div class="result-judgment">' + hex.judgment + '</div>' +
      '<div class="result-action">點 擊 查 看 詳 情</div>';
    drawCard.classList.add('flipped');
  } else if (currentDrawId) {
    closeDrawModal();
    setTimeout(function() {
      location.hash = '#/hexagram/' + currentDrawId;
    }, 400);
  }
});

document.getElementById('modal-close').addEventListener('click', closeDrawModal);
drawModal.addEventListener('click', function(e) {
  if (e.target === drawModal) closeDrawModal();
});

/* ===== 銅錢起卦 ===== */
var YAO_POS_NAMES = ['初爻','二爻','三爻','四爻','五爻','上爻'];
/* 花面(背面)=陽, 字面(乾隆通寶)=陰；以少為尊 */
var YAO_TYPE_INFO = {
  oldYin:    { name:'老陰', symbol:'⚋×', ben:0, bian:1, changing:true },
  youngYang: { name:'少陽', symbol:'⚊',  ben:1, bian:1, changing:false },
  youngYin:  { name:'少陰', symbol:'⚋',  ben:0, bian:0, changing:false },
  oldYang:   { name:'老陽', symbol:'⚊○', ben:1, bian:0, changing:true }
};

function tossCoinsOnce() {
  var coins = [];
  for (var i = 0; i < 3; i++) coins.push(Math.random() < 0.5 ? 0 : 1);
  var yang = coins[0] + coins[1] + coins[2];
  var type;
  if (yang === 0) type = 'oldYin';
  else if (yang === 1) type = 'youngYang';
  else if (yang === 2) type = 'youngYin';
  else type = 'oldYang';
  return { coins: coins, yang: yang, type: type };
}

function coinFaceHTML() {
  return '<div class="coin-face coin-zi">' +
    '<span class="coin-char cc-top">乾</span>' +
    '<span class="coin-char cc-bottom">隆</span>' +
    '<span class="coin-char cc-right">通</span>' +
    '<span class="coin-char cc-left">寶</span>' +
    '<div class="coin-hole"></div></div>' +
    '<div class="coin-face coin-hua">' +
    '<span class="coin-hua-mark">花</span>' +
    '<div class="coin-hole"></div></div>' +
    '<div class="coin-flash"></div>';
}

var coinModal = document.getElementById('coin-modal');
var coinCard = document.getElementById('coin-modal-card');
var coinState = null;

function openCoinModal() {
  coinState = { idx:0, ben:[], bian:[], types:[], tossing:false, done:false };
  coinModal.classList.add('active');
  renderCoinToss();
}

function closeCoinModal() {
  coinModal.classList.remove('active');
}

function yaoTrackHTML() {
  var rows = '';
  for (var r = 5; r >= 0; r--) {
    var done = r < coinState.idx;
    var t = coinState.types[r];
    var changing = done && YAO_TYPE_INFO[t].changing;
    var cls = 'coin-yao-row' + (done ? ' done' : '') + (changing ? ' changing' : '');
    var barCls = 'coin-yao-bar ' + (done ? (YAO_TYPE_INFO[t].ben ? 'yang' : 'yin') : 'yang');
    rows += '<div class="' + cls + '">' +
      '<div class="coin-yao-pos">' + YAO_POS_NAMES[r] + '</div>' +
      '<div class="' + barCls + '"></div></div>';
  }
  return rows;
}

function renderCoinToss() {
  var posName = YAO_POS_NAMES[coinState.idx];
  var html = '<div class="coin-modal-title">銅 錢 起 卦</div>' +
    '<div class="coin-progress-label">第 ' + (coinState.idx + 1) + ' 爻（' + posName + '）· 共六爻 · 自下而上</div>' +
    '<div class="coin-toss-area">' +
      '<div class="coin" id="coin-0">' + coinFaceHTML() + '</div>' +
      '<div class="coin" id="coin-1">' + coinFaceHTML() + '</div>' +
      '<div class="coin" id="coin-2">' + coinFaceHTML() + '</div>' +
    '</div>' +
    '<div class="toss-result-line" id="toss-result-line"></div>' +
    '<div class="coin-yao-track">' + yaoTrackHTML() + '</div>' +
    '<div class="coin-btn-row"><button class="coin-action-btn" id="btn-toss">點 擊 搖 卦</button></div>';
  coinCard.innerHTML = html;
  document.getElementById('btn-toss').addEventListener('click', doToss);
}

function doToss() {
  if (coinState.tossing) return;
  coinState.tossing = true;
  var result = tossCoinsOnce();

  for (var i = 0; i < 3; i++) {
    var el = document.getElementById('coin-' + i);
    var isYang = result.coins[i] === 1;
    var endRot = 1080 + (isYang ? 180 : 0);
    el.style.setProperty('--spin-end', endRot + 'deg');
    el.style.setProperty('--spin-mid', (endRot - 360) + 'deg');
    el.classList.add('tossing');
    el.style.animationDelay = (i * 0.05) + 's';
  }

  var btn = document.getElementById('btn-toss');
  if (btn) btn.style.visibility = 'hidden';

  setTimeout(function() {
    for (var j = 0; j < 3; j++) {
      var c = document.getElementById('coin-' + j);
      c.classList.remove('tossing');
      c.classList.add(result.coins[j] === 1 ? 'landed-hua' : 'landed-zi');
      c.classList.add('flash');
    }
    var info = YAO_TYPE_INFO[result.type];
    var line = document.getElementById('toss-result-line');
    var yangWord = result.yang + ' 陽 ' + (3 - result.yang) + ' 陰';
    line.innerHTML = '<div class="toss-yao-name">' + info.name + '</div>' +
      '<div class="toss-yao-symbol">' + info.symbol + '</div>' +
      '<div class="toss-coin-detail">' + yangWord + (info.changing ? ' · 動爻' : '') + '</div>';

    coinState.ben[coinState.idx] = info.ben;
    coinState.bian[coinState.idx] = info.bian;
    coinState.types[coinState.idx] = result.type;
    coinState.idx++;

    setTimeout(function() {
      coinState.tossing = false;
      if (coinState.idx >= 6) {
        coinState.done = true;
        renderCoinFinal();
      } else {
        renderCoinToss();
      }
    }, 1050);
  }, 1380);
}

function finalBlockHTML(label, linesArr, types, isBian, hex) {
  var sym = '';
  for (var i = 5; i >= 0; i--) {
    var changed = isBian && YAO_TYPE_INFO[types[i]].changing;
    sym += '<div class="yao ' + (linesArr[i] ? 'yang' : 'yin') + (changed ? ' changed' : '') + '"></div>';
  }
  return '<div class="coin-final-block' + (isBian ? ' bian' : '') + '">' +
    '<div class="coin-final-label">' + label + '</div>' +
    '<div class="coin-final-symbol">' + sym + '</div>' +
    '<div class="coin-final-name">' + hex.name + '</div>' +
    '<div class="coin-final-id">第 ' + hex.id + ' 卦 · ' + hex.full + '</div></div>';
}

function renderCoinFinal() {
  var benHex = findHexByLines(coinState.ben);
  var bianHex = findHexByLines(coinState.bian);
  var hasChange = coinState.types.some(function(t) { return YAO_TYPE_INFO[t].changing; });

  var html = '<div class="coin-modal-title">卦 象 已 成</div>' +
    '<div class="coin-final">' +
      finalBlockHTML('本 卦', coinState.ben, coinState.types, false, benHex) +
      (hasChange ? finalBlockHTML('變 卦', coinState.bian, coinState.types, true, bianHex) : '') +
    '</div>' +
    '<div class="coin-btn-row">' +
      '<button class="coin-action-btn" id="btn-view-ben">查看本卦詳情</button>';
  if (hasChange) html += '<button class="coin-action-btn outline" id="btn-view-bian">查看變卦詳情</button>';
  html += '<button class="coin-action-btn outline" id="btn-redo">重 新 起 卦</button></div>';
  coinCard.innerHTML = html;

  document.getElementById('btn-view-ben').addEventListener('click', function() {
    closeCoinModal();
    setTimeout(function() { location.hash = '#/hexagram/' + benHex.id; }, 300);
  });
  if (hasChange) document.getElementById('btn-view-bian').addEventListener('click', function() {
    closeCoinModal();
    setTimeout(function() { location.hash = '#/hexagram/' + bianHex.id; }, 300);
  });
  document.getElementById('btn-redo').addEventListener('click', openCoinModal);
}

document.getElementById('coin-modal-close').addEventListener('click', closeCoinModal);
coinModal.addEventListener('click', function(e) {
  if (e.target === coinModal) closeCoinModal();
});

/* ===== 事件綁定 ===== */
document.getElementById('btn-back').addEventListener('click', function() {
  location.hash = '#/';
});
document.getElementById('btn-draw').addEventListener('click', openDrawModal);
document.getElementById('btn-coin').addEventListener('click', openCoinModal);
document.getElementById('btn-replay').addEventListener('click', playIntro);
window.addEventListener('hashchange', handleRoute);

/* ===== 初始化 ===== */
renderTrigrams();
renderHexGrid();
handleRoute();

if (location.hash.indexOf('#/hexagram/') === 0) {
  document.getElementById('intro-overlay').style.display = 'none';
} else {
  playIntro();
}
</script>
