。注泰五之二，小谓二也。柔得中，故亨小。利贞。注六爻得位，各正性命，保合大和，故利贞矣。初吉。注：初，始也。谓泰乾。乾知大始，故称初。坤五之乾二，得正处中，故初吉，柔得中也。终乱。注泰坤称乱。二上之五，终止于泰，则反成否。子弑其父，臣弑其君，天下无邦，终穷成坤，故乱其道穷。初九，曳其轮，濡其尾，无咎。六二，妇丧其髴，勿逐，七日得。注离为妇，泰坤为丧。髴，发，谓鬒发也，一名妇人之首饰。坎为元云，故称髴。诗曰：鬒发如云。乾为首，坎为美，五取乾二之坤为坎，坎为盗，故妇丧其髴。泰震为七，故勿逐七日得。与睽丧马勿逐同义。髴或作茀。俗说以髴为妇人蔽膝之茀，非也。九三，高宗伐鬼方，三年克之，小人勿用。注高宗，殷王武丁。鬼方，国名。乾为高宗，坤为鬼方。乾二之坤五，故高宗伐鬼方。坤为年，位在三，故三年。坤为小人，二上克五，故三年克之，小人勿用。象曰：惫也。六四，𦈡有衣袽，终日戒。注乾为衣，故称𦈡。袽，败衣也。乾二之五，衣象裂坏，故𦈡有衣。初离为日，坎为盗，在两坎閒，故终日戒。谓伐鬼方，三年乃克。旅人懃劳，衣服皆败，鬼方之民，犹或寇窃，故终日戒也。九五，东邻，故不如西邻之礿祭。祷，夏祭也。离为夏，兑动，二体离明得正，承五顺三，故实受其福，吉大来也。上六，濡其首，厉。注乾为首，五从二，上在坎中，故濡其首厉。位极乘阳，故何可久。彖曰：既济亨，小者亨也。也。初吉，柔得中也。注中谓二。终止则乱，其道穷也。注反否终坤，故其道穷也。象曰：水在火上，既济。君子以思患而豫防之。曳其轮，义无咎也。七日得，以中道也。三年克之，惫也。注坎为劳，故惫也。终曰戒，有所疑也。东邻杀牛，不如西邻之时也。实受其福，吉大来也。濡其首厉，何可久也。","64":"坎下离上。未济，亨。注否二之五也。柔得中，天地交，故亨。济，成也。六爻皆错，故称未济也。小狐汔济。注否艮为小狐。汔，几也。济，济渡。狐济几渡而濡其尾，未出中也。濡其尾，无攸利。注艮为尾，狐，兽之长尾者也。尾谓二，在坎水中，故濡其尾。失位，故无攸利，不续终也。初六，濡其尾，吝。注应在四，故濡其尾。六三，未济，征凶，利涉大川。九四，贞吉，悔亡。注动正得位，故吉而悔亡矣。震用伐鬼方，三年有赏于大邦。注变之震，体师体既济、离三，故三年有赏于大邦。六五贞吉无悔。注之正则吉，故贞吉无悔。君子之光，有孚吉。注动之乾，离为光，谓二。二变应，已得有之，故有孚吉。坎称孚也。上九，有孚于饮酒，无咎。注坎为孚，谓四也。上之三，介四，故有孚。饮酒流颐中，故有孚于饮酒。终变之正，故无咎。濡其首，有孚失是。注乾为首，五动，首在酒中，失位，故濡其首矣。孚，信，是，正也。六位失正，故有孚失是。谓若殷纣沈湎于酒，以失天下也。彖曰：未济，亨，柔得中也。小狐汔济，未出中也。注谓二未变，在坎中也。濡其尾，无攸利，不续终也。注否阴消阳，至剥终坤，终止则乱，其道穷也。乾五之二，坤杀不行，故不续终也。虽不当位，刚柔应也。象曰：火在水上，未济。君子以慎辩物居方。注君子，否，乾也。艮为慎。辩，辩，别也。物，谓乾阳物也。坤阴也。艮为居，坤为方。乾别五以居坤二，故以慎辩物居方也。濡其尾，亦不知极也。九二，贞吉，中以行正也。注谓初已正，二动成震，故行正。未济。贞凶，位不当也。贞吉悔亡，志行也。君子之光，其晖吉也。注动之正，乾为大明，故其晖吉也。饮酒濡首，亦不知节也。注节，止也。艮为节。饮酒濡首，故不知节矣。端阳后校经周易虞氏义卷之六周易虞氏义卷之七张惠言学周易"};

var SHANG = {"1":"乾卦第一\n乾，元亨利贞。\n《说卦》：乾，健也。《子夏传》：元，始也；亨，通也；利，和也；贞，正也。盖天之体以健为用，而天之德莫大于四时。元亨利贞，即春夏秋冬，即东南西北。震元离亨，兑利坎贞，往来循环，不忒不穷。《周易》之名，即以此也。后儒释此者，莫过于《太玄》。《玄文》云：罔直蒙酋冥。罔，北方也，冬也，未有形也。直，东方也，春也，直而未有文也。蒙，南方也，夏也，物之修长也。酋，西方也，秋也，物皆成象而就也。有形则复于无形，故曰冥。故万物罔乎北，直乎东，蒙乎南，酋乎西，冥乎北。罔舍其气，直触其类，蒙极其修，酋考其就，冥反其奥。罔蒙相极，直酋相敕，出冥入冥，新故代更。将来者进，成功者退，已用则贱，当时则贵。按《太玄》阐发此四字之理，至矣尽矣。除《彖传》外，无此深奥明晰之解释也。其所谓直蒙酋，即震春离夏兑秋，即元亨利也。所谓罔、冥，即坎冬，即贞也。必以二字拟贞者，盖以子复为界。子复者冬至也，故由亥坤至子复为冥，由子复至泰寅为罔。罔，不直也。冬至以后，万物虽枉屈，不能见形于外，然阳气已生，与冬至前之冥然罔觉者异矣，故曰罔舍其气。舍者，蓄也，养也，即《彖传》所谓保合太和也。\n或曰：《彖传》释此，纯指天道。然《彖》不曰春夏秋冬，必曰元亨利贞者，何也？曰：乾之德无所不统，无所不包。言元亨利贞，则天时人事，尽括于其中。\n惟此四字，义蕴宏深，非一解所能尽。《彖传》、《象传》，皆释贞为正。而大贞、小贞、不可贞、贞吝、贞凶、不利君子贞，义皆不通。而《彖》、《象传》遇此皆不释，似委为不知而阙疑者。《文言》曰：贞固足以干事。又释贞为固。然于贞凶、贞吝等辞，仍不能通。此《彖》、《象传》与《文言》不同也。\n尤异者，《乾·彖传》以万物资始释元义，以云行雨施品物流形释亨义，以大明终始六位时成释利义，以天道变化各正性命释贞义，是以四德平列也。而于《屯》、《随》之元亨利贞，则释曰：大亨贞。于《临》、《无妄》、《革》之元亨利贞，则释曰：大亨以正。舍利不言，只为二德。是《彖传》与《彖传》，所释不同也。《文言》曰：元者善之长，亨者嘉之会，利者义之和，贞者事之干。是以四德平列，尤为显著。乃下又曰：乾元者，始而亨者也；利贞者，性情也。则以元亨为一义，利贞为一义，亦为二德。此又《文言》与《文言》所释不同也。昔儒以《彖》、《象传》释贞字，与《文言》不同，疑《十翼》非出一手。愚谓《彖传》当为一人作矣，而前后所释不同；《文言》当为一人作矣，而前后所诂仍异。此无他，乾健之德，不可名言，似必再三释，方能毕其义蕴也。\n然则元亨利贞四字，究以何解为当乎？曰：其在乾则确为四德，《彖传》之所释，宏深透辟，于四德各有推阐。而以天道变化，各正性命，保合大和，释贞之原理，尤幽隐难识。故《文言》曰：君子行此四德。盖四德缺一，即不成为天时，不成为人事。故《太玄》以罔直蒙酋冥拟之，并著其义曰春夏秋冬，指其方曰东西南北，则亦以元亨利贞为四德也。\n至于贞吝、贞凶、不利君子贞，其义与乾元亨利贞之贞，绝不相同。案《周礼·春官·天府》，季冬陈玉，贞来岁之媺恶。注：贞谓问于龟卜。郑司农曰：贞，问也。《易》曰，师贞丈人吉。又《左传》哀十七年，卫侯贞卜。《国语》，贞于阳卜。皆以贞为卜问。而师贞丈人吉，前郑引以解《周礼》。是以贞为卜问，已有先例。愚以为大贞、小贞、贞吝、贞凶、不利君子贞，皆宜诂作卜问，与乾元亨利贞之贞，判然为二义，不得混同。五经字同而义异者多矣，不独此也。盖贞有正义，又有贞固、贞定二义。朱子兼采之，曰：贞，正而固也。岂知兼二义，仍不能尽通。近儒王陶庐先生，又以全《易》贞字皆释作卜问，于文理可通矣。然若乾之利贞，亦释作卜问，则乾德不全矣，似不尽协也。\n盖元亨利贞，合之为乾德，分之为八卦之德，故即为六十四卦之根本。《彖》或曰亨，或曰元亨，或曰贞，或曰利贞，或曰亨利贞，或曰利贞亨，或曰元亨利贞。似以此四德，为衡量卦德之准的者。然如《无妄》，凶卦也，亦曰元亨利贞，则似别有标识，而非论卦德。端木国瑚曰：《易》遇东南方春夏之卦，则曰元亨；遇西北方秋冬之卦，则曰利贞。由其言推之，《屯》下震春也，故曰元亨；上坎冬也，故曰利贞。《随》下震春也，故曰元亨；上兑秋也，故曰利贞。《临》下互震，故曰元亨；上坤下兑，故曰利贞。《无妄》下震，故曰元亨；上乾为冬，故曰利贞。《革》下离互巽，故曰元亨；上兑为秋，互乾为冬，故曰利贞。其余虽不尽当，然大概如是也。\n总之，元亨利贞，春夏秋冬，东南西北，仁义礼智，一二三四，兹数者，合之一之，混之同之，融会贯通，遗貌御神，天人不分。陶冶既久，然后知此四字，已括尽易理，非言诠所能尽。而能申其义者，前惟《彖传》，后惟扬子云。\n初九，潜龙勿用。\n九者，老阳之数，动之所占。潜，隐也。阳息初，《复》，一阳伏群阴之下，故曰潜。物莫神于龙，故借龙以喻阳气。复子，时当冬至，一阳初生，伏藏地下，故曰勿用。又卦位初为士，未出世之君子，德亦如是也。\n九二，见龙在田，利见大人。\n初、二于三才为地，二在地上，故称田。乾为大人，二虽不当位而居中。利见者，言大人宜于此时出见也。郑康成谓利见九五之大人，非。五无应也。阳息至二，《临》，阳出地上，由潜而显。大人亦如此也。\n九三，君子终日乾乾，夕惕若，厉无咎。\n乾为君子；为大明，故为日。《晋》，顺而丽乎大明，大明谓离日也，故乾亦为日。《易林》困之泰云：阴云四方，日在中央。以《泰》上坤为云，下乾为日也。又蹇之咸云：日月并居。以《咸》上兑为月，互乾为日。余证尚多，皆详《焦氏易诂》中。三居下卦之终，故曰终日，曰夕。惕，忧思也。厉，危也。忧危故无咎。阳息至三，《泰》，万物思奋，人事亦如是。三四于三才为人爻，人居天地之中，宜乾惕有为也。厉，许慎作夤，后易家多从之。而《文言》作厉，并以危释厉义。注莫古于《十翼》，似当从也。\n九四，或跃在渊，无咎。\n《易林》、《九家》、荀爽，皆以乾为江河，故乾亦为渊。跃，起也。四居上卦之下，故曰跃渊。或者，言事不一定，可则为之，慎审而行，故无咎也。阳息至四，《大壮》，百果草木甲坼之时也。\n九五，飞龙在天，利见大人。\n五于三才为天位，又为天子位，贵而得中，故曰飞龙在天。大人于此，居极尊之位，履万物之上，向明而治，圣人作而万物睹，故亦曰利见大人。九五阳息至五，《夬》，万物繁荣，相见之时也。\n上九，亢龙有悔。\n王肃曰：穷高曰亢。上九居卦之极，故曰穷。在六爻之上，故曰高。高则易危，穷则事尽，故有悔。按乾盈于巳，盈则亏，满则损，乃天道之自然。《太玄》云：成功者退。又《中》首次六云：月阙其抟，不如开明于西。是其理也。\n用九，见群龙无首，吉。\n此文王以筮例示人也。《易》之本为六七八九，七九阳，八六阴。今遇阳，胡以只言九，不言七？则以《周易》以九为用，与二易殊也。用者，动也，变也。用九者，言遇九则动，遇七则不动。若作用舍诂，则《周易》竟不用七八矣。不用七八，则揲蓍时常不遇九六，将何以为占？盖九六占爻，七八占彖之义，治《易》者十六七皆忽之，故其义常晦。见群龙无首吉者，申遇九则变之义也。九何以必变？阳之数九为极多，故曰群。阳极反阴，乃天地自然之理。乾为首，以阳刚居物首，易招物忌。变坤则无首，无首则能以柔济刚，故吉。无，《说文》云奇字。王育谓天屈西北为无。\n此节自古说者常有数蔽。见说吉即疑为占辞，不知其申用九之义。一蔽也。见说群龙，即疑群龙指上六爻，不知其言九。二蔽也。见说群龙无首，即疑六爻全变，不知其指揲蓍之三变成一爻言。三蔽也。甚至以此为爻辞。四蔽也。笼统浮泛，铨释乾健大义。五蔽也。岂知六十四卦，六爻之后，独《乾》、《坤》二卦有此赘语者，诚以《乾》、《坤》者阴阳，六十四卦皆乾爻坤爻所积而成。乃《乾》卦只言九不言七，《坤》只言六不言八，不申明其故，揲蓍者胡所遵循？故于《乾》、《坤》六爻之后，申曰用九、用六。复恐人不解用九、用六之义，又曰见群龙无首吉、利永贞也。其详说皆在《周易古筮考》中。\n彖曰：大哉乾元，万物资始，乃统天。\n《系辞》云：彖者，材也。材、财通。《孟子》：有达财者。而财与裁通。《泰传》：后以财成天地之道。汉人上书，伏惟裁察，每作财察。然则材即断也，即裁度也。元亨利贞者，彖辞也。此则释彖者，先儒名曰《彖传》，《十翼》之一也。自太史公、扬子云、班固，皆以为孔子作。乾元者，乾之元气也，于时配春，故曰资始。统，《说文》，纪也。《史记·乐书》，乐统同。注，统，领也。统天者，言乾元之德统领万物，总治一切。《九家》释统为继，谓乾德统继天道。后诸家又有训统为始、为本、为合者，皆非也。按此释元义。\n云行雨施，品物流形。\n此释亨义。于时配夏。乾交坤成坎，坎为云为雨，故曰云行雨施。坤为品物，乾入坤，故曰流形。乾施坤受，和而为雨。品物润泽，万物洁齐，相见乎离，亨之义也。\n大明终始，六位时成，时乘六龙以御天。\n此释利义。于时配秋。乾为日，故曰大明。日始于离，终于坎，以成昼夜，积昼夜以成四时。六位者六爻，爻各有时。时而至秋，万物成熟，故曰时成。《太玄》拟之曰：酋，西方也，秋也，万物皆成象而就。释时成之义也。《文言》曰：利，义之和也。兑正秋，兑悦故和，秋成故利也。然乾之六时，果何属乎？六龙者六阳，乾阳卦，故其所乘之时皆阳时，即子寅辰午申戌。《乾凿度》所谓乾贞十一月子，左行阳时六是也。言乾而乾三子可知。若坤之所乘，则六阴时。《乾凿度》所谓坤贞六月未，右行阴时六是也。时乘六龙以御天，即言乾乘六阳时以统御天道。自汉以来，不知时乘六龙，即乾乘六阳时，笼统解说，与上句六位时成无以异，而传义愈晦矣。\n乾道变化，各正性命，保合太和，乃利贞。\n此释贞义。于时为冬。万物自有而入无，由动而之静，故曰变化。《太玄》拟贞为冥，曰有形则复于无形，故曰冥。又曰：冥者明之藏也，出冥入冥，新故代更。入冥者变，出冥者变后而化也。变化者，天道必然之理也。性命者精神。太和者元气。正者定也。《周礼·天官·宰夫》：令群吏正岁会，正月要。注：正，定也。各正性命者，言万物入冬而形气定也。保合者，固也。保合太和，言万物静定而无为，正所以养育其生命也。各正性命，保合太和，略如人入夜寝息，休养神明。《系辞》云：尺蠖之屈，以求信也；龙蛇之蛰，以存身也；精义入神，以致用也。正谓此也。贞者元之本，元者贞之著。下文曰首出庶物，即贞下启元之义也。后儒舍冬义，以既济定说贞者，皆未当也。\n首出庶物，万国咸宁。\n元亨利贞，相循环者也。贞非寂灭无为也，乃所以植元亨之基。故夫冬尽春来，贞久元至。首出庶物者，元也。言又复始也。春生震仁，故曰咸宁。万国咸宁者，言如圣君当阳首出，万邦有庆也。\n《乾·彖传》简括宏深，自非圣于《易》者，不能为也。自汉以来，除《太玄》外，无有明其义者。而诂六龙为六位，利贞为既济定，尤谬误之大者。首出庶物二语，解者皆不误矣，而皆不知于元亨利贞之后，再缀此语者，乃所以示四德循环之义。朱子云：不贞则无以为元。又曰：四德循环无端。知此义矣，乃讫未明指再缀此语之故。岂知六龙与六位无别，则六龙句为赘语。首出庶物，与万物资始理同，而不疏其循环之义，则首出句又为赘语。乌乎可哉？揆厥原因，皆由不确知元亨利贞即春夏秋冬，即东南西北。《彖传》与《文言》虽未明言，固皆本此为义。特义奥语文，后儒遂歧于索解。及扬子云揭出春夏秋冬、东南西北二义，然后知《彖传》所言者，皆元亨利贞之原理及其所以然，义遂明彻。然罔直蒙酋冥之演元亨利贞，除范望、司马温公外，他儒无言者。于此知《太玄》之难读，等于《易》也。\n象曰：天行健，君子以自强不息。\n《系辞》云：象者像也，像此者也。先儒以其推阐一卦之义，谓为《大象》，亦《十翼》之一。王引之云：《尔雅》，行，道也。天行健，谓天道健也，与地势顺为对文。按《左传》襄九年，晋伐郑，杞人从赵武斩行栗。注，行，道也。由是以推，《蛊》、《剥》、《复》，《彖传》皆曰天行，皆天道也。凡《大象》专以人事言。言天道强健不息，君子法之也。\n潜龙勿用，阳在下也。见龙在田，德施普也。\n初阳伏在下。德施普，言阳和之德，普及万物也。下，音户。《诗·邶风·凯风》：爰有寒泉，在浚之下；有子七人，母氏劳苦。下音户，与苦韵。此亦同也。\n终日乾乾，反复道也。\n乾盈则反巽，坤盈则复震。乾坤者震巽之终，震巽者乾坤之始。\n或跃在渊，进无咎也。飞龙在天，大人聚也。\n跃，《释文》云，上也。初与四相上下，初潜渊底，故曰或跃在渊。言由初跃四也。时可进故无咎。五天位，故曰在天。聚，原作造。《释文》云：刘歆父子皆作聚。聚与《文言》云从龙、风从虎义合。且向、歆所据皆中秘古文，必无误，故从之。\n亢龙有悔，盈不可久也。用九，天德不可为首也。\n阳在上乾盈，盈则必亏，故曰不可久。阳极则变，不变则刚柔不能相济，凶之道也，故无首吉。\n文言\n此卦爻辞全为文王作之证也。《彖传》申彖意，故曰彖曰。《大象》申卦义，《小象》申爻义，故曰象曰。此则合卦爻辞总述之。而制此《乾》、《坤》之卦爻辞者，文王也，故曰《文言》，绎文王所言耳。仍彖曰象曰之例，并无其他深奥。乃刘瓛曰：依文而言其理，故曰《文言》。姚信曰：《乾》、《坤》为门户，文说《乾》、《坤》，六十二卦皆放焉。讫不得解。揆其因，皆由王充、马融等谓文王制卦辞、周公制爻辞，后儒惑其说，疑但言文王，或遗周公故也。\n曰：元者善之长也，亨者嘉之会也，利者义之和也，贞者事之干也。君子体仁足以长人，嘉会足以合礼，利物足以和义，贞固足以干事。君子行此四德者，故曰乾元亨利贞。\n李鼎祚云：元为善长，故能体仁。仁主春生，东方木也。亨为嘉会，足以合礼。礼主夏养，南方火也。利为物宜，足以和义。义主秋成，西方金也。贞为事干，以配于智。智主冬藏，北方水也。李氏此诂最为透彻，与《太玄》罔直蒙酋冥理合，识《周易》真谛。盖此八句，为最古之易说。梁武帝任钓台谓为文王所言，固无根据，然穆姜即述之，可见其为旧说，故孔氏复述之。而欧阳公谓左氏著书，亦欲信今传后，若本孔子之言，而以为穆姜，其谁传信之？谓《文言》非孔子作。按左氏所纪古人言行，皆古人实有是言，有是行，而后纪之。非并无是事是言，尽左氏所造作也。观穆姜述是语，已曰：然，固不可诬也。即谓古易说之可信，而不我欺也。且《周易》之兴，至春秋已数百年，所传古训，必已多矣。然则穆姜述之，孔氏复述之，事之常耳。必谓甲述之为真，乙再述之即伪，似不然也。左氏非传《易》者，其是否见《十翼》，未可知也。盖《文言》皆杂采古易说，荟萃而成之。故此处以四德释元亨利贞，下又曰元亨者，始而亨者也，利贞者性情也，又为二德，与前不同，显为采集古说之证。不过古人质，不似后人之必曰某某云耳。\n初九曰，潜龙勿用。何谓也？子曰：龙德而隐者也。不易乎世，不成乎名。遯世无闷，不见是而无闷。乐则行之，忧则违之，确乎其不可拔，潜龙也。\n吴先生曰：易，当读如《论语》丘不与易之易。按《孟子》易其田畴，赵岐云，易，治也。初潜在下，与世无涉，故曰不易世，不成名。遯世无闷者，言甘于隐遯。不见是而无闷者，言人不知亦不愠也。乐则行，忧则否，坚决自守，利禄不能移，威武不能屈，故曰确乎其不可拔。《庄子·应帝王》，确乎能其事。注：确，坚也。\n九二曰，见龙在田，利见大人。何谓也？子曰：龙德而正中者也。庸言之信，庸行之谨。闲邪存其诚，善世而不伐，德博而化。《易》曰，见龙在田，利见大人。君德也。\n二居下卦之中，故曰正中。庸言、庸行，中也。中则言必信，行必谨矣。闲邪使不入，则中不乱；存诚使不出，则中可守。善世，中也；善世而伐，则偏而不中。不伐，若己无所与者，则时中矣。人能如是，其德必博，而化必广。二虽未升五为君位，然君德已具，必升五也。\n九三曰，君子终日乾乾，夕惕若，厉无咎。何谓也？子曰：君子进德修业。忠信，所以进德也；修辞立其诚，所以居业也。知至至之，可与言几也；知终终之，可与存义也。是故居上位而不骄，在下位而不忧，故乾乾因其时而惕，虽危无咎矣。\n修辞者，立言也。诚者，法则也。居者，蓄也，积也。业以积而高大也。爻至三而极，其境至高。识其高而必达其境，故曰可与言几。《说文》：几，微也。《系》云：几者动之微，吉之先见者也。爻至三而终，其道已穷。识其穷而必赴之，故曰可与存义。义者，宜也。\n九四曰，或跃在渊，无咎。何谓也？子曰：上下无常，非为邪也；进退无恒，非离群也。君子进德修业，欲及时也，故无咎。\n欲及时用其学，以济天下，故不避其嫌。四与初相上下，初潜四跃，初退四进。\n九五曰，飞龙在天，利见大人。何谓也？子曰：同声相应，同气相求。水流湿，火就燥。云从龙，风从虎。圣人作而万物睹。本乎天者亲上，本乎地者亲下，则各从其类也。\n此与象辞之大人聚义同也。《乾》、《坤》初爻交震巽，故曰同声相应。上爻交艮兑，故曰同气相求。中爻交坎离，故曰水流湿，火就燥。湿燥以方位言，荀爽谓坤湿乾燥者是也。坤原居北方，北方涸阴冱寒，故曰湿。乃乾自南往交坤成坎，故曰流湿。乾原居南方，南方炎 焦灼，故曰燥。乃坤自北往交乾成离，故曰就燥。此于先天南北之乾坤，变为后天之离坎，至明白矣。乾若不在南，如何流北？坤若不在北，如何就南？故夫方位不明，《易》本立失，所关至钜。坤为云。《易林》困之泰云：阴云四方；又未济之升云：云兴蔽日，皆以《泰》、《升》上坤为云。乾为龙，故曰云从龙。坤为风。《易林》讼之剥云：烈风雨雪；大壮之剥云：乘风驾雨，皆以《剥》下坤为风。陆绩云：风，土气也。巽，坤之所生，故为风。按陆说是。坤本为风也。乾为虎，故曰风从虎。风云者阴，龙虎者阳，言阴必从阳也。乾，虎之象。《易林》师之乾云：三奸成虎；小畜之乾云：东遇虎蛇，皆以乾为虎。此象昔儒无知者，后会稽茹敦和始发之。近师俞樾袭其说，谓虎阳物，君象。京、虞以坤为虎，马以兑为虎，皆不如《九家》以艮为虎之义长。艮何以为虎？以得乾之上爻，犹震得乾初亦为龙也。是乾本为虎也。故《履》、《革》皆以乾为虎，说与《易林》暗合。圣人作者，乾为圣人。坤为万物。圣人作而万物睹，即比象也，仍阴从阳也。天地者阴阳。本乎天者亲上，谓阳性上升顺行，故《乾》二必上升坤五，以与阴类。本乎地者亲下，谓阴性下降逆行，故《坤》五必下降乾二，以与阳类。故曰各从其类。阴阳相遇方为类，与朋友同。若阴遇阴，阳遇阳，则为敌矣，不朋不类也。《颐》六二曰：行失类也。以所遇皆阴，至明白也。乃由汉迄今，无有察觉者。\n按此节旧解所以不明彻者，一由于类字义失；二由于乾虎、坤云、坤风象失；三由于不知此说阴阳相感之理，以著大人聚及利见之义；四由于不知此言先天象，故两两对举。震巽对故相应，阴阳相应也。艮兑对故相求，阴阳相求也。水流湿，阳求阴；火就燥，阴求阳也，水火对也。云从龙，风从虎，言阴阳不相离，乾坤对也。皆所以著阴阳类之理也。二千年以来，惟一茹敦和识虎为阴象之非，其功过荀、虞远矣。\n又亲上亲下二语，使人识阴阳交之所以然也。亲上者居上，亲下者居下，则阴阳气不交而为《否》矣。亲上者居下，亲下者居上，则阴阳气接而为《泰》矣。各从其类，统相应相求各语而言之也。\n上九曰，亢龙有悔。何谓也？子曰：贵而无位，高而无民，贤人在下位而无辅，是以动而有悔也。\n在上故贵，失正故无位，失位故无民。乾为贤人，既非九五之位则臣下也。三无应，故曰无辅。有此三因，故动而有悔。\n潜龙勿用，下也。见龙在田，时舍也。终日乾乾，行事也。或跃在渊，自试也。飞龙在天，上治也。亢龙有悔，穷之灾也。乾元用九，天下治也。\n舍，发也。《诗》：舍矢如破。《易林》家人之大有云：仲春孟夏，和气所舍。皆以舍为发。作舍弃者固非，以舍为舒之假字者亦非也。自试者，试其可否。上治者，居上治民。天下治，申用九之故也。用九者，刚变柔。言天下未治，治之以刚；若天下已治，则当济以柔。明用九之故，因天下已治也。此治字与上治治字相呼应。后人因不识用九真谛，故笼统解说，多误者。○王弼曰，此一章全以人事明之。\n潜龙勿用，阳气潜藏。见龙在田，天下文明。终日乾乾，与时偕行。或跃在渊，乾道乃革。飞龙在天，乃位乎天德。亢龙有悔，与时偕极。乾元用九，乃见天则。\n王弼云：此一章全以天气明之。《彖传》曰时乘六龙以御天，即乾乘六阳时也。初乘子，阳气虽生而未出，故曰潜藏。二乘寅，阳出地上，百物思奋，故曰文明。三乘辰，百果草木，长养兴起，故曰与时偕行。四乘午，阳盈于巳消于午，阴起用事，代有终，故曰乾道乃革。其以二上变成《革》为说者，非也。五乘申，百果草木，至秋成熟，乾德乃见，故曰位乎天德。《广雅》：位，正也。言正当天德之时也。上乘戌，阳气将尽矣，故曰与时偕极。阳极反阴，阴极反阳，乃天道之自然，故曰乾元用九，乃见天则。则者，法也，一定之理也。\n乾元者，始而亨者也。利贞者，性情也。乾始能以美利利天下，不言所利。大矣哉！大哉乾乎！刚健中正，纯粹精也。六爻发挥，旁通情也。时乘六龙，以御天也。云行雨施，天下平也。\n性之与情，清惠栋、阮元、姚配中、洪震煊、胡缙诸儒说之，可谓详尽矣。而利贞何以谓之性情，只以六爻正成《既济》为说，无能了解者，则以自东汉以来，于利贞之真谛不明也。《易林》中孚之坤云：符左契右，相与合齿。乾坤利贞，乳生六子。合齿者，交也，即乾坤利贞也。盖贞之为义属冬，消息卦坤起午，至亥而为纯坤，与原居亥之纯乾相遇。阴牝阳，天地合德，阴阳和姤，万物本以出生，故曰乾坤利贞，乳生六子。然则利贞之为和合明矣。故六十四卦言利贞者，二五无不交，否则卦体自相交，如《中孚》、《小过》者也。《彖传》曰：各正性命，保合太和。正《易林》所本也。且夫阳之喜阴，阴之喜阳，乃天地自然之性。本其性之所喜，以阳求阴、以阴承阳而和合焉，则由性而入于情矣。情者，欲也，感也。利贞者性情，即谓阴之凝阳，变化和合，乃天地固有之性情，感之极正者也。崔觐云：不杂曰纯，不变曰粹。精者，专一。极形容乾德之大。发挥者，变动也，言六爻遇九六即变动也。旁，《玉篇》云：非一方也。通者，感也，应也。阴阳相感故相通。《系辞》云：探颐索隐，钩深致远。又曰：旁行而不流。皆谓正象之旁，尚有伏象，故曰索隐，曰钩深，曰旁行。而震与巽相对，艮与兑相对，阴与阳绝异也。而《文言》曰：同声相应，同气相求。盖阴阳未合，有阴阳之分；阴阳既合，则和同混一而不分矣，故曰同。同则通。故《易》辞与《易林》用象，正伏常不分。而其所以能旁通之故，则仍阴阳相求相感固有之理，故曰旁通情也。时乘六龙义见前。云行雨施，万物亨通，故曰天下平。\n君子以成德为行，日可见之行也。潜之为言也，隐而未见，行而未成，是以君子弗用也。\n此言潜龙仍志在行道，与甘心隐遯鸣高者异。然而勿用者，时未可也。夫子盖恐山栖谷隐之流，执初爻为口实，故首以成德为行，明儒者之责任。旧解鲜有当者。俞樾云：日为曰之讹。似当从之。\n君子学以聚之，问以辨之，宽以居之，仁以行之。《易》曰，见龙在田，利见大人。君德也。\n宽，博；居，蓄也。言蓄德广博也。君德既具，待升九五，则不惟居之，且行之矣。德者行之本，仁者行之用。\n九三重刚而不中，上不在天，下不在田，故乾乾因其时而惕，虽危无咎矣。\n君子终日乾乾夕惕若，是自朝及夕，无不乾惕也，故曰因时。所以然者，初二刚，三仍刚，故曰重刚。阳遇阳则窒。又卦以二五为中，三失中，上不及五，下不居二，故不敢自懈也。\n九四重刚而不中，上不在天，下不在田，中不在人，故或之。或之者，疑之也，故无咎。\n侯果曰：《下系》云，兼三才而两之。谓两爻为一才也。初兼二，地也；三兼四，人也；五兼六，天也。四是兼才，非正，故言不在人。朱子疑四非重刚。岂知重刚与卦位无涉，乃谓上下爻也。疑则慎，慎故无咎。\n夫大人者，与天地合其德，与日月合其明，与四时合其序，与鬼神合其吉凶。先天而天弗违，后天而奉天时。天且弗违，而况于人乎？况于鬼神乎？\n大人者五。五天位，二地位，上下昭列，尊卑判分。而五与二相往来，故与天地合其德。五坎位，坎月；二离位，离日。火为水妃，东西终始，故与日月合其明。夫天地日月，先天四中象也，惟大人能则之。元亨利贞，即春夏秋冬。四时之序，将来者进，成功者退，已用则贱，当时则贵，循环往来，不差不忒，故曰与四时合其序。夫震春离夏兑秋坎冬，即后天之四中象也，惟大人能兼之。消息卦乾生于东，神也；坤死于西，鬼也。生则吉，死则凶。乃乾虽主生，不杀亦不能成岁功。故生死递嬗，吉凶代更，亦惟大人能合之。先天之象，天地日月，牝牡雌雄，二仪肇分，法象自然如此，虽天亦不能违。后天之象，震兑坎离，互兴迭废，时而生，时而壮，时而老病死，人如此，物亦如此，天地亦如此。夫事而至于天不能违，人与鬼神，不待言矣。\n亢之为言也，知进而不知退，知存而不知亡，知得而不知丧。\n进也，存也，得也，阳之事也。退也，亡也，丧也，阴之事也。六者相对待，相循环。至上九亢极矣，极则宜变而知所返。懵不知返，故有悔也。按此专释上九亢龙之义，兼申下文用九之故。知退即用九也。\n其唯圣人乎！知进退存亡，而不失其正者，其唯圣人乎！\n此专释用九之故也。知进复知退，知存复知亡，故用九也。见群龙无首，即知退也，即阳变阴也。故夫用之为变，观此而益明矣。自荀、虞以来，不知此节系专释用九之义，浮泛解释。然《文言》此处舍用九不释，是其辞未毕也。李鼎祚知此说用九，而以乾元用九天下治也为解，仍不知知退知亡即释用九及无首之义。","2":"坤卦第二\n坤，元亨，利牝马之贞。君子有攸往，先迷后得主 （句 ） ， 利 （句 ） 。 西南得朋，东北丧朋。安贞吉。\n元亨，谓二五也。乾元亨，二五独吉，坤亦然。元亨并无阴阳之分。虞仲翔谓坤含光大，凝乾之元，终于坤亥，出乾初子，故元亨。案《彖传》曰：至哉坤元。是坤亦言元，不专属乾。《坤》六五云：黄裳元吉。是其证。乾为马，坤为牝。贞，卜问也。利牝马之贞，即利牝马之占也。牝马柔顺，言阴必顺阳也。君子有攸往，言具坤德之君子有所行也。惠栋、端木国瑚泥于坤为小人之象，谓君子指阳，非也。地道无成，故不可先，先则迷而失道。惟随阳之后，以阳为主，则靡不利也。西南得朋，东北丧朋，旧解以朋字、类字失诂，故鲜得解者。马融、荀爽以阴遇阴为朋，虞翻谓失之甚矣，乃用《参同契》月三日出庚震象，八日见丁方兑象，兑二阳为朋，庚西丁南，故曰西南得朋；三十日坤象，月灭乙癸，癸北乙东，故曰东北丧朋。苦心搜索，以求朋象。岂知兑之为朋，以阴遇阳，非以二阳。阳遇阳，《同人》谓之敌刚；阴遇阴，《中孚》谓之得敌，然则虞说与马、荀背易理等耳。然支离穿凿，则过于马、荀矣。《复》曰：朋来无咎。《蹇》九五曰：大蹇朋来。《解》九四曰：朋至期孚。皆以阴得阳为朋。而坤逆行，消息卦自西而南阳日增，自东而北阳递减，增则得朋，减则丧朋。而坤道无成，故安静贞定则吉也。\n彖曰：至哉坤元！万物资生，乃顺承天。坤厚载物，德合无疆；含弘光大，品物咸亨。\n何休《公羊传》元年注云：元者，气也。万物资坤元以生，坤元实顺天以行，故天道广大无疆，惟坤之德能合之也。万物皆孕毓于地，故曰含弘。万物皆成长于地，故曰光大。光大则咸亨矣。\n牝马地类，行地无疆；柔顺利贞，君子攸行。\n阴阳合为类。乾为马，故马与地类，而牝马尤与地类。君子攸行者，谓柔顺利贞之德为君子所法也。《九家》谓乾来据坤，为君子攸行，失传旨。\n先迷失道，后顺得常。西南得朋，乃与类行；东北丧朋，乃终有庆。\n夫曰行曰终，乃自西而南、自东而北而逆行也。非以西南、东北相对待也，明矣。消息卦自西而南阳日增，故曰西南得朋。阴以阳为类，故曰乃与类行。消息卦自东而北阳递减，故曰东北丧朋。夫事有终必有始，丧朋之地始于巳，终于亥。坤行至亥，阳丧尽而为纯坤，乃反曰有庆者，何也？则以《周易》之位，乾原居亥，纯坤与纯乾相遇，天地合德，万物由此出生，故曰有庆。《易》凡言有庆者，皆谓阴遇阳。《大畜》、《晋》、《睽》六五，皆上承阳，故皆曰往有庆。《易林》中孚之坤云：符左契右，相与合齿；乾坤利贞，乳生六子。《太玄·玄文》云：入冥出冥，新故代更。皆说有庆之故也。后儒皆承用虞氏解，谓坤行至西南，月又将生明为有庆。是不知终为何处也。终者艮象亥方。《周礼·宰夫》及《大司徒》岁终注，皆曰周季冬也。周季冬为亥月。又《尔雅·释天》云：月在壬曰终。壬亦亥方。是终指亥方甚明。《说卦》云：艮成终。终于亥也。故夫洞明易理者，莫过于焦延寿与扬子云也。（《焦氏易诂》有详说，可参阅。 ）\n安贞之吉，应地无疆。\n坤道主静，故曰安。《易林》云：乾坤利贞，乳生六子。安贞即利贞，利贞即天地合德，合则相感，故曰应地无疆。\n象曰：地势坤，君子以厚德载物。\n王弼曰：地形不顺，其势顺。是王弼之本，作地势顺也。宋衷曰：地有上下九等之差，故以形势言其性。夫曰性，则亦读为顺也，而皆未引《说卦》坤顺为诂。是愈证宋、王本之皆作地势顺，故不引《说卦》为证。盖坤古文作巛，而巛为顺之假字，故宋、王皆读巛为顺。自《正义》改作坤，而顺字遂无由识。至清儒王引之等，据《说卦》乾健坤顺之文，谓天行健即天行乾，地势顺即地势坤。夫乾坤之为天地，不惟《说卦》言之，《彖》、《象传》并言之，故以天代乾，以地代坤。今不从宋、王注，以坤为顺之讹字（若作巛则不讹 ），谓天行健即天行乾，地势顺即地势坤，是天行天、地势地也，尚可通乎？王又谓巛即川字，川与坤、顺声近，故借川作坤。是尤不安。夫坤古作巛，是古文作巛也。隶书原以变古文之繁重，若巛字本即简易，故隶书常因而不改。《大戴礼·保傅篇》：《易》之乾巛。《家语·执辔篇》：此乾巛之美。《后汉·舆服志》：尧舜垂裳，盖取诸乾巛。《北史》太和三年：巛德六合殿成。又坤字之见于汉碑者，无不作巛。再征之金文，周《师訇敦铭》云：用作巛宫宝。王陶庐云：巛即坤字。由此证巛即坤，非有所借也明矣。引之谓顺因川而得声。愚以为顺因巛而得声，推之训驯巡紃等字皆然。引之盖泥于《说文》坤下无重巛之文，谓巛非坤本字。王陶庐云：《玉篇》巛下注曰古文坤字，《广韵》亦曰古文以坤为巛，二书皆胚胎于《说文》。据此《说文》必有巛字，后夺之耳，不然二书不敢臆造。又云：《释文》原云，巛本又作坤，坤今字。今改为坤本又作巛，巛今字。文理谬戾已极。是皆因孔氏改巛作坤，后人遂并《释文》而亦改矣。按王说是也。《诗·周颂》有夷之行，《释文》云：巛苦魂反，字亦作坤。此处《释文》应同。然则坤本作巛，征之金石传记无不然。汉本《易》之作地势顺，征之宋注、王注亦无不然。然今本《易》何以讹作地势坤？则以汉本《易》，坤原作巛，乃借巛为顺也。何言之？顺既因巛而得声，在古文例常假借。如《大壮》卦以易为埸，《夬》以次且为趑趄，《小畜》以血为恤，皆因其得声之字而假借。今以巛假顺，正其例耳。孔氏知巛即坤，不知巛为顺之假字，遂竟改作坤矣。若宋、王则皆读作顺也，以宋、王本皆作巛也，作巛则人易知为顺矣。其以《说卦》为解者，于字之沿革，尽失其义。厚德载物者坤，君子取以为法。虞仲翔必谓君子为乾，亦非。\n又《易》以巛为大川，《焦氏易林》以巛为水、为江河淮济。《九家》注《蛊》亦以坤地为水，邵子坤水之象所本也。盖巛即川字，即水字，故《易林》复以坎为土，邵子复本之。疑古以水土为一物，能合而不能分。《比》曰地上有水，《师》曰地中有水，证以古文，稽之卦象，而益信矣。（金文水作 ，两旁画不连。刘润琴云：效鼎涉作 ，殷契衍作 ，囦作 。又永字从水，而金文作 。是皆水字两旁画皆不断，可证巛、川、水三字，古文皆同。 ）\n初六，履霜，坚冰至。\n阳进阴退，阳顺阴逆，故阳自七进九为老阳，阴自八退六为老阴。阴极则变，故《易》用六也。于卦为《姤》，时当夏至，一阴初生。初震爻，故曰履。阴微，故以霜为喻。乾为冰为坚，坤行至上当亥方，与乾相遇，故曰坚冰。言五月微阴初见，驯至亥月而极寒，必然之势，当憬然悟也。干宝以五月无霜，谓阴气既动，则必至于履霜，必至于坚冰者，非也。霜即喻此微阴，微阴见故曰履霜，非有待于后也。其待者乃坚冰也。\n象曰：履霜，阴始凝也 （依郭京读 ） 。 驯致其道，至坚冰也。\n乾为坚冰。言阴生于午，至亥纯坤与纯乾相遇，故曰至。\n六二，直方大，不习无不利。\n二为《坤》本位，《坤》二之利，与《乾》五之利同也。后人泥于乾动为直，及小往大来之文，必以直大属之乾，于是经义遂迂曲而不得解。岂知直方大皆谓坤，《彖传》、《文言》所释至明。《文言》云：直其正也。正谓二，二得位中正，故曰直。《彖传》云：含弘光大。大谓坤，坤万物资生，焉得不大？盖方者地之体，大者地之用，而二又居中直之位，故曰直方大。后儒见《象传》未言大，便疑大为衍文。然陆德明时，汉魏六朝本具在，从无谓大字衍者，况《文言》引亦有大字乎！阴消至二《遯》，前承重阳，得主有利，故不习无不利。《文言》释曰：不疑其所行。正谓二承阳也。\n象曰：六二之动，直以方也。不习无不利，地道光也。\n六二与九五相上下，故曰动。阴顺阳，故曰地道光。\n六三，含章可贞，或从王事，无成有终。\n坤为文，故曰章；坤闭，故曰含章。阴消至三《否》，正君子俭德避难之时，故虽有文章，含而不露，贞静自守。荀、虞谓三阳位，以阴据其上，故曰含章。后儒多从之，非也。《文言》释章为美，仍坤象，非谓阳位也。《否》上乾为王，三承重阳，故曰从王事。三不当位，故或之，与或跃在渊义同，言慎审也。阴顺阳，故无敢成。成，法也，式也。言不敢作法也。阴始《姤》，代乾终事，故曰有终。○按，纯坤无乾，王事之象何来乎？须知乾息从《复》始，坤消从《姤》始，故《复》、《姤》亦为小父母。《坤》消至三，上乾如故也，故曰从王事。彼夫《讼》三曰从王事，《履》三曰武人为于大君，皆以上承阳，兹与之同。观初爻曰，履霜坚冰至，言阳将以次消也。故卦虽无乾，爻辞皆视乾而系也。先儒坐不明此理，又鲜能以《易》解《易》，故说王事皆无著。\n象曰：含章可贞，以时发也。或从王事，知光大也。\n时不可，故俟时而发。或从王事，知时至矣，故曰光大。\n六四，括囊，无咎无誉。\n坤为囊。扬子《方言》：括，关闭也。坤闭，故曰括囊。阴消至四，八月《观》，天地将闭塞矣。阴在三《否》，阴阳平均，故或从王事。至四则阴盛阳衰，时不可矣，故括囊。言无所表著也。无与于世，故无咎誉。\n象曰：括囊无咎，慎不害也。\n慎故无咎，不害即无咎也。\n六五，黄裳元吉。\n坤为裳，色黄，故曰黄裳。坤为下，裳者下饰。五位正中，黄者中色，故曰黄裳元吉。元者善之长，五位极尊，故曰元。元谓五。《大有》、《鼎》皆曰元吉，皆谓六五。毛奇龄谓五降二承乾为元吉，以元专属乾，非也。\n象曰：黄裳元吉，文在中也。\n坤为文，黄裳文饰。言所以吉者，以居中位也。\n上六，龙战于野，其血玄黄。\n阴至上六，坤德全矣，故万物由以出生。然孤阴不能生也。荀爽云：消息之位，坤在于亥，下有伏乾。阴阳相和，故曰龙战于野。坤为野，龙者阳。《说文》壬下云：《易》曰龙战于野，战者接也。《乾凿度》云：乾坤合气戌亥。合气即接。《九家》云：玄黄，天地之杂。言乾坤合居。夫曰相和，曰合气，曰合居，则战之为和合明矣，皆与许诂同也。而万物出生之本由于血，血者天地所遗氤氲之气。天玄地黄，其血玄黄者，言此血为天地所和合，故能生万物也。《易林》说此云（中孚之坤 ）：符左契右，相与合齿。乾坤利贞，乳生六子。夫曰符契，曰合齿，则乾坤接也，即龙战于野也。消息卦，坤亥下即震子出，故曰乳生六子。《彖传》云：乃终有庆。庆此也。惟荀与《九家》，皆以血为阴，仍违《易》旨。《易》明言天地杂，则血非纯阴可知，纯阴则离其类矣，胡能生物？至侯果谓阴盛似阳，王弼、干宝谓阴盛逼阳，阳不堪故战，以战为战争。后孔颖达、朱子，因经言战又言血，疑阴阳两伤者，皆梦呓语也。清儒独惠士奇用许说，谓战者接也，阴阳交接，卦无伤象。识过前人远矣。\n象曰：龙战于野，其道穷也。\n阴至上六而极，故曰穷。穷，尽也。\n用六，利永贞。\n此亦明筮例也。八六皆阴，今遇阴胡以只言六不言八？则以六为用而变七也。利永贞，申用六之故也。六何以必变？六为老阴，阴极不返则太柔矣。《文言》曰：贞固足以干事。永贞，则健而阳矣。故《象》曰以大终，大者阳，言阴极则变阳也。\n象曰：用六永贞，以大终也。\n阳大阴小。以大终者，言阴极必返阳也。旧解因不知用六义意，故说大终，无有当者。\n文言曰：坤至柔而动也刚，至静而德方。后得主而有常，含万物而化光。坤道其顺乎！承天而时行。\n坤柔动刚，义与用六大终同。言坤虽至柔，遇六则变阳矣，故曰动刚。后得主而有常者，言最后变六为阳，以阳为主也。\n积善之家，必有余庆；积不善之家，必有余殃。臣弑其君，子弑其父，非一朝一夕之故，其所由来者渐矣！由辩之不早辩也。《易》曰：履霜，坚冰至。盖言顺也。\n坤为积，为殃，为恶，故曰不善。坤多，故曰余。又为臣子，为弑，为夕。君父，则指乾也。坤消阳，故曰弑君父。此正申明履霜坚冰至之理。阴在《姤》至微耳，积之不已，则阳可全消，其祸有不可胜言者，故曰余殃。余者多也。此本世界之公理，人事之自然。而李鼎祚忽以夫子不语怪力乱神为疑，若余庆余殃，有类于神道感应之说者，真可谓污蔑圣言，不识语旨矣。渐，孔疏云：徐而不速谓之渐。辩，《说文》：判也，别也。谓宜别之于先也。顺与循同义。盖言顺者，仍循其道则至坚冰之意。荀爽谓臣顺君命而成之，背经旨，不可从。（《文言》释初六，嘘吸经髓，超妙绝伦，使人惕然省，憬然悟。释上六只以阴凝阳、天玄地黄，逗露坤地生物之本，由于天地交，而总不明言，仍还经文昆仑语气。由此见圣人之言，宁使人不易知，而不能不文。《太玄》云：不约则其旨不详，不要则其应不博，不沈则其意不见。真能窥见载道之故者哉！ ）\n直其正也，方其义也。君子敬以直内，义以方外，敬义立而德不孤。直方大，不习无不利，则不疑其所行也。\n直则不挠，故曰直其正。言二中正也。方则不诡随，故曰方其义。言不苟同也。正直发于心，故曰直内。内直则必敬矣，故曰敬以直内。义方以接物，故曰方外。外方则无不宜矣，故曰义以方外。敬义之德立于下，五阳应于上，故德不孤。盖阴消至二《遯》，前承重阳，二五应予，乾先坤后，阳唱阴和，得主有利，故不疑其所行。（旧解只惠栋知以二五相应说不孤，最为卓识。 ）\n阴虽有美，含之以从王事，弗敢成也。地道也，妻道也，臣道也。地道无成，而代有终也。\n阳革于午，阴代阳用事，以讫于亥，故曰代有终。凡终皆谓亥。《彖传》曰：乃终有庆。《说卦》曰：万物之所成终。终皆谓亥。《内经》与《庄子》，所谓天门者此也。自《复》子至《乾》巳皆成事，阳主之，故地道无成。自《姤》午至《坤》亥皆终事，阴主之，故曰代有终。言代阳终事也。终字从冬，言一年之事，至亥冬而终也（子即阳复 ）。故艮居亥而艮即为终。成者，法也式也。《周礼·天官·太宰》，五曰官成以经邦治。注，官成谓官府之成事品式。又《秋官·士师》，掌士之八成。注，八成犹八法。然则成者法也。地道无成者，谓坤柔不敢先创为法式，只能代阳终事也。成与终，虚实先后，绝对不同。汉宋衷以成名为说，清惠栋谓成与终同义。夫成与终义诚可通，但此曰无成，曰有终，则判然二事，不得混同也。\n天地变化，草木蕃。天地闭，贤人隐。《易》曰：括囊，无咎无誉。盖言谨也。\n阴消至四，八月《观》，由元亨而入利贞，天地之气将变易矣。《观》下坤为茅茹为草，巽为木，坤闭艮止，故曰草木蕃。蕃与藩通，《诗·大雅》四国于蕃是也。又《周礼·地官·大司徒》，九曰蕃乐注，杜子春读蕃乐为藩乐，谓闭藏乐器而不作。贾疏：藩谓藩闭。然则草木蕃者，言草木至八月而生气藩闭也。自汉以来，无不以蕃息为解，岂知此与下天地闭贤人隐，平列为证，以释括囊之义。若作蕃息，与括囊何涉乎？《乾·彖传》云：乾道变化，各正性命，保合太和，乃利贞。言元亨时过，利贞时至也，故曰变化。此变化与彼变化同也。变化之征，在物则草木黄落，在天则阳气闭藏，在人则贤哲隐遯。谨，慎也，释括囊之故也。\n君子黄中通理，正位居体。美在其中，而畅于四支，发于事业。美之至也！\n地色黄，黄中色，五中位，故曰黄中。《玉篇》：理，文也。坤为文，故曰理。黄中通理者，言由中发外，有文理可见也。正位居体，即体居正位。坤为体、为事业，言有黄中之德者，身必润，事业必成也。\n阴凝于阳必战。为其嫌于无阳也，故称龙焉。犹未离其类也，故称血焉。夫玄黄者，天地之杂也。天玄而地黄。\n凝，王弼本作疑。《释文》云：荀、虞、姚信、蜀才作凝。兹从其多者。然疑即凝字。《庄子·达生篇》：用志不分，乃疑于神。即凝于神也。《诗·大雅》：靡所止疑。《传》：疑，定也。《正义》：音凝。可见疑、凝本通。孟喜、王弼诂作疑似之疑，致与经旨全背。夫阴阳相求相应，何疑忌之有？又何来战争？天地若至于战争，又胡由相杂？是皆由战字失诂，不知相杂者为何义也。阴凝阳即阴牝阳。阴极于亥，与伏乾相遇，坤上乾下，坤外乾内。阳不见，故曰嫌于无阳；称龙，所以明有阳也。阴阳合为类，离则为独阴独阳，独阴独阳不能生，即不成为血。既曰血，即阴阳类也，即天地杂也。其血玄黄者，言此血非阴非阳，亦阴亦阳，为天地所和合，故能生万物也。旧解不知阴阳合为类，又不知此言大地生物之本，故未离其类四句，举不知其所谓。","3":"屯卦第三\n屯，元亨，利贞。勿用有攸往，利建侯。\n上坎为险，下震为动，动乎险中，故名曰屯。屯，难也，止也。诸家皆以乾通坤为元亨，三之正成《既济》为利贞。按以乾通坤为元亨，初五得位，乾元以通是也。以三之正成《既济》，为利贞非也。利贞者，利于贞定也。勿用有攸往，申其义也。端木国瑚谓遇春夏卦，即曰元亨；秋冬卦，即曰利贞。《易》本以时为主，说颇胜于旧解。《屯》由震春以至坎冬，一年气备，故曰元亨，又曰利贞。《乾》初勿用，往遇险，故曰勿用有攸往。侯，君也，主也。震为君，初临万民，五居尊位，故曰利建侯。\n彖曰：屯，刚柔始交而难生。动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。\n始交谓初、五也。前《乾》、《坤》二卦，皆纯阳纯阴，莫能交。《屯》下震以乾交坤初，上坎以乾交坤中，以其次纯《乾》纯《坤》之后，刚柔杂始见，故曰始交。难，谓坎也。《蹇》传云：蹇，难也。即指上坎。动而遇险，故曰难生。下雷上雨，坤为多故曰满盈。造，始也；草，杂乱；昧，冥昧。坤为茅茹为乱，故曰草；地黑，故曰昧。《易林》艮之晋云：釜甑草土。即以《晋》下坤为草，为釜。天造草昧者，言天地之运，始于草昧。故宜建侯于此时，使万物有主也。\n诸家皆用虞翻说，谓刚柔始交，为《坎》二交初。如是穿凿，又何不可谓《萃》四交初？盖虞氏不知始字承前两卦《乾》、《坤》而言，而以为指《屯》初、二，故误解若是。后阅道光间卞斌《周易通解》，亦谓始交指初、五，然则此义百年前已发之。\n象曰：云雷，屯；君子以经纶。\n经纶，据《释文》，王弼本作经论。今本作经纶者，乃孔本也，因将王注亦改之矣。《释文》又云：黄颖曰：经纶，匡济也，本亦作伦。案《释名》云：纶，伦也，为之有伦理也。《论语正义》引郑玄云：论者，纶也，理也。然则纶、伦、论，字微异，义则同也。若以卦象言，震为言，初至五正反震，似论于易象较切。若《正义》所云刘表、郑玄作沦，似不合矣。\n初九，磐桓，利居贞，利建侯。\n磐桓，《释文》云：旋也。《尔雅·释水》：钩盘。郭注：水曲如钩，流盘桓不直前也。《禹贡》：西倾因桓是来。注：桓，陇阪名，其道盘旋，曲而上旋。即不能直前也。盘、磐通。《释文》云：本亦作盘。马又作槃。又或作般。皆以音同通用。外坎，故利居贞不动。震为主，建侯则坤民有主，故利。\n象曰：虽磐桓，志行正也。以贵下贱，大得民也。\n坤为民。阴贱阳贵，阳在下，故曰以贵下贱。阳为大，初阳临群阴，故曰大得民。\n六二，屯如邅如，乘马班如，匪寇婚媾。女子贞不字，十年乃字。\n阴遇阴得敌，故屯邅不进。《释文》云：邅，马行不进之貌。班，《子夏传》：相牵不进貌。郑作般。般、盘同，亦盘桓不进也。又震为马，坤、坎皆为马，马多故曰班如。言行列不前也。吴先生曰：《汉书》，车班班，往河间，义同此也。五坎为寇，二与五应，故曰匪寇，曰婚媾。乃二前为三四所阻，下为初阳所牵，体又为坤，坤虚故不字。字，妊育也。震为孕。《左传》昭元年：武王邑姜方震太叔是也。故震为妊育。王引之力辟宋耿南仲、朱子以字为许嫁之非，其说是也。今河北尚呼牝牛为字牛，义本此也。坤为年，数十，故曰十年乃字。言二五应与虽难，然究为正应，久必合也。\n象曰：六二之难，乘刚也。十年乃字，反常也。\n此难字，与《彖传》难生难字不同。彼指坎，此谓乘刚字难也。说者多混而同之，非。乘刚势逆，故字难。\n六三，即鹿无虞，惟入于林中。君子几，不如舍，往吝。\n鹿，虞翻、王肃皆作麓。鹿、麓古通。《诗》：瞻彼旱麓。《周语》作旱鹿。韦注：鹿，山足也。三为艮初，正山足也。即鹿者，言至山足而从禽也。即，就也。虞，备虞也。《孟子》曰：有不虞之誉。义同此也。言田猎而无备虞，焉能有禽？震为木，艮亦为木，故曰林中。坤虚，故空入林中。几者，事之先见者也。舍，去也。言君子见几而去也。上无应，故往吝。艮为君子。《淮南子》说此云：夫施薄而望厚者，未之有也。又《三国志·陈琳传》：《易》称即鹿无虞，夫微物尚不可欺。夫所谓欺，即无备虞也。王弼云：虽见其禽而无其虞，徒入于林中。亦诂虞为备虞。乃孔疏忽谓虞为虞官，失王义矣。《左传》隐五年：不备不虞，不可以师。正与此无虞义同。\n象曰：即鹿无虞，以从禽也。君子舍之，往吝穷也。\n从禽，义与即鹿同。吝、遴古通。《说文》：行难也。三无应得敌，故行难。吝字初见。《说文》口部引作吝，云：恨惜也。辵部引又作遴，云：行难。愚以为凡言往吝者，宜从行难义。只言吝者，宜从恨惜义。此曰往吝，即行难也。\n六四，乘马班如，求婚媾。往吉，无不利。\n坎、坤皆为马，故亦曰班如。艮为求，四与初本为正应，婚媾而已，然必求者，以二三为阻也。知其阻而求之，故往吉也。四上承阳，下有应，故曰无不利。\n象曰：求而往，明也。\n艮火，故曰明，艮阳在上亦明。自艮火、艮明象失传，诸家皆以三变互离为明矣。岂知《旅》九三云：焚其次。《易林》大壮之遯云：火烂销金。皆以艮为火。说详《焦氏易诂》中。\n九五，屯其膏。小贞吉，大贞凶。\n坎水故曰膏，坎陷故屯其膏。盖五虽下履重阴，然坤民三分之二为初所有，四又应初，五虽君位，实无一民，故膏泽无所施也。小谓二，五应二，阴得阳应故吉。大谓五，五虚拥尊位，威柄下移，孤露无辅，故大贞凶。震为威，坤为柄也。贞，卜问也。诸家强以贞正说之。夫正而有大小，已不词矣；大正而凶，益悖理矣。惠士奇知其不安，又以固为说，其不协与正无异也。\n象曰：屯其膏，施未光也。\n坎为隐伏，故曰未光。\n上六，乘马班如，泣血涟如。\n坎为血，坎水，故曰涟如。《诗·卫风》：泣涕涟涟。《释文》：泣貌。坎忧惧，下无应，故有是象。\n象曰：泣血涟如，何可长也？\n上六居卦之极，故曰不长。","4":"蒙卦第四\n蒙，亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。\n艮少，坎隐伏不明，故名曰蒙。蒙，稚也，不明也。二得中有应，故亨。艮为童蒙，为求，而二至上正反艮，自二言若求五，自五言若求二，有互相求之象。然二阳也，阳大明；五阴也，阴迷。我谓二。匪我求童蒙，童蒙求我者，言二不必求五，五自来应二也。《传》曰志应，言二五相应与，相上下也。旧解诂实匪字，定谓二不应五者，非也。坎为圣，为通，故为筮。《比》曰原筮，亦以坎为筮。震为言，故曰告。而二至上正反震，言多，故曰渎。渎，亵渎也。震反为艮，艮止，故不告。昔贤说此，总不知再三渎之故何在，由正覆象并用之义失传故也。又筮象亦失传，故初筮不知何所指。岂知坎在下故曰初筮，专指九二。艮坎皆冬日卦，故曰利贞。\n彖曰：蒙，山下有险，险而止，蒙。蒙亨，以亨行时中也。匪我求童蒙，童蒙求我，志应也。初筮告，以刚中也；再三渎，渎则不告，渎蒙也。蒙以养正，圣功也。\n志应，言二五互求也。坎为圣，故曰圣功。\n象曰：山下出泉，蒙；君子以果行育德。\n艮为君子，为坚，为果。震为行，故曰果行。果行者，言坚定不易也。《传》曰：致果为毅。是其义也。震为生，为德，故曰育德。以者，法也。言君子法《蒙》象，而果毅其行，养育其德也。\n初六，发蒙，利用刑人，用说桎梏。以往吝。\n发，启也。《诗·大雅·思齐篇》曰：刑于寡妻。《左传》襄十三年：一人刑善，数世赖之。注皆训刑为法。是刑与型同。利用刑人者，言宜树之模型，使童蒙有所法式，得为成人，永免罪辟也。坎为桎梏。《说文》：桎足械，梏手械。四无应，故往吝。《说文》引作遴，云行难也。吝、遴古通。《汉书·鲁安王传》：晚节遴。《王莽传》：性实遴啬。义皆为吝。以往，王安石、朱震、王宗传、朱子，皆训为以后，大误。\n象曰：利用刑人，以正法也。\n正，平也。坎为平，故曰正法。言以法则示人，俾童蒙有所则效。即释刑人之义也。\n九二，苞蒙吉，纳妇吉，子克家。\n阳居阴中，故曰苞蒙。五阴来应，故曰纳妇吉。震为子，艮为家。五艮体，二应之，故曰子克家。克者，能也，言能任家事也。\n象曰：子克家，刚柔接也。\n接与龙战于野战字义同，言交接也。\n六三，勿用取女，见金夫，不有躬，无攸利。\n取、娶同。坤为女。见金夫，不有躬，申勿用之故也。金夫者美称。《诗》：有匪君子，如金如锡，如圭如璧。《左传》：思我王度，式如玉，式如金。皆以金喻人之美。艮为金，为夫。人徒知乾为金，不知艮坚亦为金。《易林》随之屯云：金玉满堂。以屯之互艮为金也。人徒知震有夫象，不知三男皆为夫。《比》曰：后夫凶。以艮为夫也。《易林》复之剥云：夫亡从军。以《剥》上艮为夫也。三与上艮应，故曰见金夫。坤为躬。三体震，震为行而决躁，故见金夫而亟欲往上，不顾四五之阻，故曰不有躬。女行如此不顺，故无所利也。\n象曰：勿用取女，行不顺也。\n坤为顺，震躁动，故不顺。案此爻旧解，虞翻以阳为金，谓三为二所淫。朱子谓金夫，盖以金赂己而挑之，若鲁秋胡之事。均堪喷饭。若夫王弼以金夫为刚夫，毛大可、惠栋等用卦变，又以兑阳为金，皆非。故夫卦象一失传，无论若何揣测，皆不能当，其关系之重若是。\n六四，困蒙，吝。\n四无应，承乘皆失类，故曰困。\n象曰：困蒙之吝，独远实也。\n实谓阳。初三五皆近阳，四独否，故曰独远实。\n六五，童蒙，吉。\n艮为童蒙。上承阳，下应二，虽不当位而居中，故吉。\n象曰：童蒙之吉，顺以巽也。\n上承阳，顺阳而行，下与二相上下，故曰顺以巽。\n上九，击蒙，不利为寇，利御寇。\n艮手为击，亦启发之意。上应在三，三坎为寇，道穷于上，故不利为寇。然艮为坚为守，下拥群阴势众，故利御寇。《坎·彖传》云：王公设险以守其国。守谓互艮也，能守故利。\n象曰：利用御寇，上下顺也。\n君子守其前，小人随其后，故利御寇。上下顺者，言坤民顺上也。","5":"需卦第五\n需，有孚，光亨，贞吉。利涉大川。\n乾为行，行而遇险，故曰需。需，待也。《归藏》作溽。坎、兑皆水，故溽；溽，湿也。而溽与濡音义并同。杨氏《古音》云：溽，人余切。《归藏易》，需卦作溽，同濡。案《孟子》：是何濡滞也。是溽有迟义。古文多省笔，疑需为古文濡字，与《归藏》同。且濡滞亦有须义，与《彖传》不背。《周易》本因二易而作，溽、濡、需不过字形之辗转耳，音义并同也。卦辞皆指九五。五上下皆阴，故有孚。互离故光，得位故亨。贞吉者，卜问则吉也。坤为水，为大川。《易林》贲之损云：龙蛇所聚，大水来处。以《损》互震为龙蛇，互坤为水。又师之复：渊泉堤防，水道利通。亦以《复》坤为泉为水。此外《九家》说《蛊》之利涉大川云：此卦乾天有河，坤地有水，二爻升降，出入乾坤，利涉大川也。亦以坤为大川。利涉谓五，言五居坤中，孚于上下而利也。故《彖传》以位乎天位，往有功释之。而虞翻谓往指二，二失位变阴涉坎，故利涉。夫以坎为大川，涉之而利，则不必需矣，是背卦义也。彼夫《蹇》无坤也，而曰利西南，以《蹇》五居坤中也。《需》五亦居坤中，坤为大川，当位而尊，上下皆孚，故曰往有功。五居外，故曰往。非必内卦往外卦，方谓往也。此卦只五爻能利涉，他爻无利者。自坤水象失传，不知五所涉者为坤水，为大川，必以坎为大川，于是《易》之利涉大川，无一得解者。\n彖曰：需，须也，险在前也。刚健而不陷，其义不困穷矣。需有孚，光亨贞吉，位乎天位，以正中也。利涉大川，往有功也。\n须，待也。待则不陷于险中，故不困穷，释需之故也。位乎天位，往有功，皆谓九五。谓九五居坤水之中，上下皆孚。有功，即利涉。虞翻以二当之，失《彖传》旨矣。\n象曰：云上于天，需；君子以饮食宴乐。\n坎为云，故曰云上于天。二四兑，兑口，故曰饮食。兑悦，故曰宴乐。乾为君子。言君子饮食宴乐，从容以俟也。\n初九，需于郊，利用恒，无咎。\n乾为郊。初临重阳，阳遇阳得敌，不能行，故利用恒。恒，久也，常也。言潜龙勿用，守常不变也。守常不动，故无咎。阳遇阳行难，需而不进，故《象》曰不犯难行。《大畜》初九曰：有厉利已。厉与难皆指二三。此与《鼎》九二慎所之，《大有》初九曰无交，《大壮》初九曰征凶，《夬》初九曰往不胜，《姤》九三曰其行次且，皆因阳遇阳。乃二千年说者，皆以《需》坎为难，谓初不取四，为不犯难。岂知难为二三。二三皆阳，阳遇阳行难，故不取四而用恒，非以坎为难而不取也。故夫同性相敌、异性相感之理不明，则《易》本立失。此不犯难及有厉利已等辞，所以永不得解也。\n象曰：需于郊，不犯难行也。利用恒无咎，未失常也。\n阳遇阳得敌。需而不进，故曰不犯难行。难指二三。\n九二，需于沙。小有言，终吉。\n沙近水，二较初略进，故曰需于沙。二至四伏艮，艮为沙。有言者，争讼也。乾为言，见《左传》。兑口亦为言，见《易林》。乃兑言向外，与乾言相背，故争讼。《夬》四之闻言不信，即如此取象也。兑为小，故小有言。有言不吉，然而吉者，《象》曰衍在中，以居沙衍之中也。《穆天子传》：天子遂东征，南绝沙衍。盖水中有沙曰衍，故曰衍在中，以象中位也。《象》曰虽小有言，以吉终者，明有言本不吉，然而吉者，以得中位也。虞翻用半象，谓三四震象半见，为小有言。穿凿之说也。凡《易》云有言，及闻言不信，有言不信者，皆争讼也，非言之有无也。《左传》昭五年以谦为谗，首发其义；《焦氏易林》，畅述其旨。于是二千年有言误解，尽行暴露，与利涉大川同。说详《焦氏易诂》中。\n象曰：需于沙，衍在中也。虽小有言，以吉终也。\n解见前。\n九三，需于泥，致寇至。\n《震》九四云：震坠泥。以坎为泥也。九三去险益近，故曰需于泥。坎为寇，三近坎，故曰致寇至。\n象曰：需于泥，灾在外也。自我致寇，敬慎不败也。\n坎为灾。灾在外，明尚未罹灾。致寇至，明寇尚未至也。致之故在我，我能敬慎则不至矣，不至则不败。乾为惕，故曰敬慎。\n六四，需于血，出自穴。\n血，洫之省字。古文如此者，不可胜数。且沟洫亦坎象也。诸家以坎有血象，便作需于血，不辞甚矣。兑为穴。《易林》乾之咸云：反得丹穴。豫之兑云：秋蛇向穴。皆以兑为穴。言四之所处，前临沟洫，故曰需于洫。而居兑穴之上，故曰出自穴。毛奇龄、惠栋、焦循等，皆以坎为穴，用象既误，故于出义不合也。（只姚配中诂出字得解 ）。\n象曰：需于血，顺以听也。\n四阴宜顺五阳。坎为耳，故曰听。听，从也。\n九五，需于酒食，贞吉。\n坎为酒。食，实也。《颐》自求口实，郑作食，是食实可通用。坎中实，故坎为食。《易林》履之蹇云：天下饶食。谦之坎：食非其任。皆以坎为食。酒食在上，兑口承之，故曰需于酒食。贞吉者，卜问吉也。\n象曰：需于酒食，以中正也。\n五位中正，释贞吉之故也。\n上六，入于穴。有不速之客，三人来，敬之，终吉。\n互兑为穴。上来应三，则入于兑穴矣。而阳必上升，故曰不速之客。马云：速，召也。乾为人，上应在三，故曰三人来。坎为畏惧，故曰敬之。言阴宜顺阳也。上居卦终，故曰终吉。\n象曰：不速之客来，敬之终吉。虽不当位，未大失也。\n《象》明曰不速之客来，来而不当位，言三升上不当位也，非谓上六本不当位。王弼不明升降之理，便谓初上无位，真妄说也。荀爽云：上退居三，虽不当位，承阳有实，故未大失。固的解也。","6":"讼卦第六\n讼，有孚，窒惕，中吉。终凶，利见大人，不利涉大川。\n乾阳上升，坎水下降。乃乾即在上，坎即在下，违行，气不交，故曰讼。二阳居阴中，故有孚。坎中实，故窒。坎忧，故惕。二虽不当位，居中故吉。二无应遇敌，故终凶。九五中正，故利见大人。坤为大川，二入之不当位，无应与，不能出（若《解》则能出 ），沉沦于坤水之中，故曰不利涉大川。\n彖曰：讼，上刚下险，险而健，讼。讼有孚窒惕，中吉，刚来而得中也。终凶，讼不可成也。利见大人，尚中正也。不利涉大川，入于渊也。\n刚来得中，谓二也。中正，谓五也。坤为渊。《易林》震之复云：藏匿渊底。言《复》阳居坤下，故曰藏匿渊底。是以坤为渊也。今二入居坤中，故曰入于渊。而上无应不能出，沉溺渊中，故曰不利。\n象曰：天与水违行，讼；君子以作事谋始。\n《需》水上乾下，故气交。反之则背道而驰，愈去愈远，故曰违行。行，道也。违行言异道而行也。坎为谋，坤为事，二居坤中，故曰作事。二无应，故入不能出，若慎始则免矣。卦气以下为始。王弼云：凡讼之起，契之不明。孔疏：由于初时契要之过。慎始制契，则讼端绝。按乾坎皆为信，契要者信也。王注优于各家。\n初六，不永所事，小有言，终吉。\n事，讼事也。讼始于初，然初有应，初四相上下成《中孚》，各当位，则讼事息矣，故曰不永所事。坎上下兑口相背，故有言，有言即讼也。不永，故曰小有言。有应，故终吉。\n象曰：不永所事，讼不可长也。虽小有言，其辩明也。\n兑口多，故曰辩明。\n九二，不克讼，归而逋。其邑人三百户，无眚。\n坎为隐伏，故曰逋。上无应，故不克讼。不克讼，故逋。逋，逃也。逃归何处乎？二居坤中，坤为邑，为百，为户。茹敦和曰：坎数三，故曰其邑人三百户。言二逃于坤邑之中也。坎为眚。二逋坤中，孚于上下，故无眚。眚，《释文》：马云灾也。\n象曰：不克讼，归逋窜也。自下讼上，患至掇也。\n上谓五，五刚，二与为敌，故曰自下讼上。吴先生曰：掇，借为辍，止也。愚按，《集韵》，掇音辍，读若朵。《逸周书》曰：绵绵不绝，蔓蔓若何；毫末不掇，将成斧柯。不掇，即不辍。言毫末虽微，长而不止，即成斧柯。然则掇、辍古通用。又河北方言谓人避事曰掇避，正与此同。掇或作躲。《玉篇》：身也。无避匿之义，非也。归而逋，即辍讼矣。辍之故，因不克讼而有患也。《释文》郑作惙，忧也。近师俞樾又作缀，言祸患之来，联缀不已也。但《小象》原以释经文，作惙、作缀于逋义皆无涉。若作辍，则正释逋义也。逋而辍讼，讼止故无眚。\n六三，食旧德，贞厉。终吉，或从王事，无成。\n乾为旧为德，坎为食。三承重阳，故曰食旧德。失位，故贞厉。承阳有应，故终吉。三承乾，乾为王，故曰从王事。坤柔，故无成。义详《坤》六三前释。\n象曰：食旧德，从上吉也。\n从上即承乾。\n九四，不克讼，复即命，渝安贞，吉。\n阳遇阳则窒，故不克讼。巽为命。即，就也，安也。初有应，言复初而安命也。渝，变也。讼则争，争则不安，不讼则变而为安贞矣，故吉也。\n象曰：复即命，渝安贞吉，不失也。\n失与轶通。《荀子·哀公篇》：其马将失。即其马将轶也。轶，突也，过也。《左传》隐九年：惧其侵轶我也。《说文》：车相出也。即从后出前也。不轶即不前出也，释安贞之义也。与《随》初、《比》二、《小畜》初同。\n九五，讼元吉。\n五位极尊，故曰元。五中正，故讼吉。\n象曰：讼元吉，以中正也。\n有中而不正者，有正而不中者。中且正，无不吉。\n上九，或锡之鞶带，终朝三褫之。\n《说文》：鞶，大带也。锡，命也。上应三。三巽为带，乾大，故曰鞶带。乃巽为陨落，故终朝三褫之。褫，夺也。坤为夜，乾为朝，上居乾终，故曰终朝。与乾三终日同义。上应三，三体离，离卦数三（此数失传，只《易林》、《洞林》、邵子用之 ），故曰三褫。先儒不知巽为陨落（象本《左氏》，后只《易林》用之 ），褫之故，全在巽，故无得解者。岂知《中孚》初九云：有它不燕。以应四巽也。《姤》九四包无鱼，《鼎》九四鼎折足，《大过》九四有它吝，皆以应初巽也，例甚明也。《释文》：褫，郑本作拕。惠氏栋据《淮南·人间训》，盗拕其衣被，高诱注云：拕，夺也。是仍与褫同。乃宋项安世《周易玩辞》引郑注曰：三拕，三加之也。后杨慎、臧琳、朱芹等，颇祖述其说，谓三拕其绅，以为夸耀，故《象》曰不足敬。但《论语》之拖绅，因孔子病卧，君来视，故加绅于朝服，以为敬。今非病卧，曰束绅、垂绅皆可，曰拖绅似不合也。\n象曰：以讼受服，亦不足敬也。\n乾为敬。旋得旋失，故不足敬。","7":"师卦第七\n师，贞，大人吉，无咎。\n师，众也。坤舍于坎，俱居子方，坤坎皆为众，故曰师。犹乾舍于离，俱居午，为《同人》也。贞，卜问也。大人，《正义》作丈人。《子夏传》作大人，崔憬、李鼎祚从之，是也。此与《困》贞大人吉同，皆谓二。《乾》九二云：利见大人。利见故吉。陆绩、郑、王等皆读为丈，谓震为长子，丈者长也，故曰丈人。岂知二得中，临御万民，大人之事。以二为大人，于象方合。丈人则于卦名不类矣。陆谓丈人为圣人，王谓丈人为庄严之称，皆曲说也。且《子夏传》为韩婴所作（臧庸据《七略》，谓婴字子夏。今按《艺文志》有韩氏二篇，注曰名婴，其篇数与隋、唐志《子夏传》卷数同，疑即《子夏传》 ），与田何同时，皆秦遗老，其所据当无误也。\n彖曰：师，众也；贞，正也。能以众正，可以王矣。刚中而应，行险而顺，以此毒天下而民从之，吉又何咎矣！\n震为帝为王，故曰可以王。二应五，坎险坤顺，震为行，故曰行险而顺。《易林》以坤为害，坎为毒，震为从。干宝云：毒，荼苦也。按《列子》：宋阳里华子病忘，阖室毒之。注：毒，苦也。师旅之兴，不无所苦，然非师旅不能安天下，故民从之而吉也。《吴语》云：吾先君阖庐，以与楚昭王毒逐于中原柏举。义与此同也。马融训毒为治，与行险而顺，义不相应。行险即毒，顺即民从也。他若王弼之训毒为役，崔憬训为亭毒，俞樾训为督，皆不协。是皆因坎毒之象，人不尽知，故众说纷纭也。岂知《噬嗑》六三云：遇毒。以坎为毒，象甚明也。\n象曰：地中有水，师；君子以容民畜众。\n地中所容畜，莫多于水，故君子法之。\n初六，师出以律，否臧凶。\n坎为律。律，法也。臧，善也。否臧，即失律也。失律故凶。\n象曰：师出以律，失律凶也。\n坎为失，故曰失律。\n九二，在师中吉，无咎，王三锡命。\n居下卦之中，故曰在师中吉。失位宜有咎，在师中，故无咎。震为王、为言，故曰命。震数三。锡，予也。王三锡命者，言王以官爵或车服器物，锡予有功，而告命之也。《曲礼》：一命受爵，二命受服，三命受车马。言二为卦主，抚驭万邦，而日有所锡予也。旧解谓六五为君，锡命于二，于卦义全背。只荀爽谓王指二为得解。\n象曰：在师中吉，承天宠也。王三锡命，怀万邦也。\n五天位，言二必升五，为群阴所承也，故曰承天宠。坤为万邦。言二临万邦，而有所锡予者，正所以怀念万邦。坎为怀也。故夫旧解谓六五锡二者，不惟于经背，于《象传》亦背矣。\n六三，师或舆尸，凶。\n坎为尸，震为舆。管辂以坎为棺椁，故曰舆尸。夫陈师而出，舆尸以还，其无功甚矣，故曰凶。盖坤为死，三失位无应，以阴遇阴得敌，故凶如是。\n象曰：师或舆尸，大无功也。\n大无功，即太无功。\n六四，师左次，无咎。\n次，舍也。震为左，故曰左次。古人尚右，左次则退也。四前临重阴，阴遇阴得敌，其行难矣。知难而退，故无咎也。\n象曰：左次无咎，未失常也。\n未失常者，言四当位，量力自处，故不改其常。\n六五，田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。\n田，猎。禽，获也。《释文》云：徐本作擒。王陶庐云：《说文》无擒字，其见于经传者，皆作禽。展获字禽，不从手，是其证。下应二阳，故有禽获。二震为言。利执言者，言师出有名。如汤武历数桀纣之罪，汉高讨杀怀王者是也，故无咎。五应二，二震主爻，震长子，居师中为主，故曰长子帅师。二亦坎主爻，坎为震弟、为尸，故曰弟子舆尸。舆尸，故贞凶。贞，卜问也。言五宜与震，不宜与坎，与坎则使不当矣。\n象曰：长子帅师，以中行也。弟子舆尸，使不当也。\n二居中为震主，故为群阴之帅。二坎陷于阴中，不可使，使则有舆尸之祸也。宋衷、虞翻谓弟子指六三，非。是皆因三爻有舆尸字而误。\n上六，大君有命，开国承家，小人勿用。\n大君指二震。震为君、为言，故曰大君有命。坤为国，二升五居坤中，故曰开国。坎为室、为家，二升五仍坎体，群阴承之，故曰承家。小人指上六。二升五虽开国承家，上六独居五后，乘阳势逆，不顺承五，《比》之后夫凶即此爻也，故戒曰勿用。宋衷、虞翻解开国承家是矣。然二升五，于上六何涉？即以勿用为戒，必有故也。不申其故，只以坤为小人，笼统说之，胡可乎？惠栋知其不安，仍不能得其故，竟谓小人指初、三，益淆乱矣。\n象曰：大君有命，以正功也。小人勿用，必乱邦也。\n二升五位正，故曰正功。坤为邦、为乱，上六反君道，故曰必乱邦。","8":"比卦第八\n比，吉，原筮，元永贞，无咎。不宁方来，后夫凶。\n比，亲也，辅也。坎坤同舍于子，故曰比。唐以前，先天象失传，故卦名不得解。清毛大可、黄宗羲等知之而不认，后学不察，相率以言先天为戒，而自命为汉易，岂知康成注《月令》，于季夏云：未属巽辰，又在巽位。巽若不在西南，未能在巽位乎？是先天方位，郑且明言之。《九家》注《同人》云：乾舍于离，与日同居。荀爽注《同人》云：乾舍于离，相与同居。注阴阳之义配日月云：乾舍于离，配日而居；坤舍于坎，配月而居。已一再言之乎！《比》之义，即以坎坤同居也。原者，田也。《左传》僖二十八年：原田每每。注：高平曰原。《周礼·太卜》原兆注：原，原田也。按古皆井田，每每者，井与井相间之形。坤为拆，象原田，故曰原筮。坎为筮，坤为原，原筮，犹言野筮也。《曲礼》云：外事以刚日。郑注：外事，郊外之事。《仪礼·士丧礼》：筮于兆域。兆域在郊外，即原筮也。而干宝因《周礼》三卜，一曰原兆，即训原为卜，可谓大谬。按，《周礼》：太卜掌三兆之法，一曰玉兆，二曰瓦兆，三曰原兆。注：言龟兆似玉瓦原之璺罅。然则原者原田，田必有璺罅，象龟兆之形，故曰原兆。岂以原为卜乎！故原指坤。干训卜固非，孔颖达谓原为原究，朱子谓原为再，王夫之谓原为本，俞樾谓原为始为本，益浮泛不切。故夫说《易》而不求象，未有能当者也。元谓九五，永贞者永定也。坤为乱，故曰不宁。方，《诗·小雅》：方舟为梁。《汉书·韩信传》云：今井陉之道，车不得方轨。注皆训方为并。方来，谓下四阴并来归五也。旧解不求卦象，训方为将，为四方，皆失之。艮为夫，上六独居艮后，故曰后夫。下四阴皆承阳，独上六乘阳不顺，故凶。此卦因原象、筮象、夫象失传，故自汉迄今，无得解者。\n彖曰：比，吉也。比，辅也，下顺从也。原筮元永贞无咎，以刚中也。不宁方来，上下应也。后夫凶，其道穷也。\n上谓五，下谓四阴。上六居卦之极，故曰道穷。\n象曰：地上有水，比；先王以建万国，亲诸侯。\n先王谓五，坤为万国。国必建侯，坤多故曰诸侯。五南面称尊，抚临天下，故王者取以为法。亲，即比也。\n初六，有孚比之，无咎。有孚盈缶，终来有它，吉。\n坎为孚，五为卦主，故亦孚于初而比之。初失位，本有咎，比五故无咎。坤为缶，初居缶之最下，去五虽远，然坎雨下注始于四，以次及初，至初而缶盈矣，故曰有孚盈缶。阳性上升，五升上《剥》，剥穷上反下，则初阳复矣，故曰来。以其有待，故曰终来。有它，谓有应于他方也。《大过》九四曰有它吝，谓应初也。《中孚》初九曰有它不燕，谓应四也。此两卦皆有应，而皆不吉者，以得敌为害也，故不安，故吝。此曰有它吉者，以阳来反初，当位有应，故吉。荀爽以非应释有它，清易家多从之。岂知《大过》、《中孚》皆有应，而亦曰有它，则夫有它之不指非应甚明。虞翻谓初动成《屯》，得正故吉。岂知此谓之变，不谓之来，更不得谓之终来。曰终来，固确有所指。且果如虞说，初动之正，乃初爻自变，益不得谓之有它，理甚明矣。虞亦知其说之有鏬，复申曰在内称来。夫爻在外曰往，在内曰来，如《需》、《讼》之往来得中，《否》、《泰》之大小往来皆是。兹曰终来，若仅在内称来，复何有始终之可言乎！失经旨矣。它，古蛇字。《易林》以坤为它。损之比云：大它当路，使季畏惧。以比下坤为它。不读为谁他之他。《系辞》云：龙它之蛰，以存身也。龙谓乾，它谓坤，言蛰于戌亥也。林所本也。而巽亦为蛇，故《大过》九四、《中孚》初九亦曰有它。后儒颇有用焦说者，又一义也。\n象曰：比之初六，有它吉也。\n六二，比之自内，贞吉。\n二应五，故曰自内。言自内比五也。二当位中正，故曰贞吉。\n象曰：比之自内，不自失也。\n言自内比五，不敢安逸也。失通佚。诸家作得失诂，非。\n六三，比之匪人。\n虞氏逸象乾为人。六三不当位无应，承乘皆阴，行失类，故曰比之匪人。言不得阳也。\n象曰：比之匪人，不亦伤乎！\n三独失实，故可伤。\n六四，外比之，贞吉。\n四承五，外比即从上。贞吉者，卜问则吉也。\n象曰：外比于贤，以从上也。\n阳为贤，指五。\n九五，显比。王用三驱，失前禽，邑人不诫，吉。\n九五伏离，当阳得位，向明而治，故曰显比。王谓五。三驱，猎礼也。《汉书·五行志》：田狩有三驱之制。注：三驱之礼，一为乾豆，二为宾客，三为君庖。又《晋书·五行志》：登车有三驱之制。又《刘聪传》：校猎上林，将军负戟前导，行三驱之礼。艮数三，故曰三驱。前禽，谓下四阴。上为后，故知前为下。失、逸古通。逸前禽者，喻人皆来比，无所诛杀，任其逸也。坤为邑。不诫，谓王师宽大，所至之邑，百姓仍安居乐业，人人亲附，不惊诫也。《说文》：诫，敕也。《广韵》：言警也。《左传》桓十一年：郧人军其郊，必不诫。言无备虞也。\n象曰：显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。\n九五中正，故显。逆，迎也。下四阴皆逆我者也。逆而来归，理应舍之，故曰逸前禽。如纣师之倒戈归周是也。王注：禽顺行背我而走者，则射而取之。按顺行与我同向，同向即背我，上六是也，故取之。此四字只王注得解。虞翻谓舍逆指上六，前禽指初。岂知后夫如得舍，尚何云凶？初有孚盈缶，即孚于五，又安得独不及初？而后儒皆从之，异已！上使中者，言五所遗师徒，合乎中道，故无过举，得不诫也。唐郭京《举正》，称得辅嗣真本，以舍逆取顺，在失前禽下。朱芹引李清植曰：考《象传》，屡以禽与东部字韵，《屯》三爻禽与穷韵，《恒》四爻禽与容韵，此又与中韵，郭京所改，显失《易》韵。今按《诗·小雅》：呦呦鹿鸣，食野之芩。韵与此同。《焦氏易林》用韵如此者尤多。而履之夬以禽与功韵，与《象传》尤符。盖古音原如此。今晋人读禽为轻，正与古音合。郭京所称辅嗣本，无论真伪，不可从也。\n上六，比之无首，凶。\n坎为首。首谓五也，而五为坎主。上六乘阳，首为所蔽，故曰无首。《大过》上六曰灭顶凶，《既济》上六曰濡其首，与此义同也。而《复》于此爻，更曰反君道，无首即反君道，反君故凶。荀、虞皆不知首指五，故说皆不切。清惠士奇更实指曰首指上，谓木一在下为本，一在上为末，末即首，意谓上六为末爻，故为首也。说尤穿凿。\n象曰：比之无首，无所终也。\n道穷，故无所终。","9":"小畜卦第九\n小畜，亨。密云不雨，自我西郊。\n卦上下皆阳，一阴止于内，故曰小畜。畜，止也。《太玄》拟之曰敛，云阳气大满于外，微阴小敛于内，是其义也。旁通《豫》，坤为云，上下皆坤爻，故曰密云。兑为雨，乃兑雨前遇巽风，为风吹散，云过日出，故不雨也。兑为西，伏坤为我，乾为郊，故曰自我西郊。言密云起自西郊，过而不留也。旧解多从虞翻，以半坎为云。既曰半坎，于密义似不合也。人知坎为云，不知坤亦为云。《易林》困之泰云：阴云四方，日在中央。以《泰》上坤为云也。人知坎为雨，不知兑亦为雨。《上系》云：润之以风雨。风谓巽，雨谓兑也。《睽》上九往遇雨，亦以兑为雨。\n彖曰：小畜，柔得位，而上下应之，曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。\n云下降方为雨，尚往者，言云气为风所吹，散而往上，故不能雨。又离火上炎，将密云冲散，不能下落为雨，故膏泽未施也。上往纯对下施言。\n象曰：风行天上，小畜；君子以懿文德。\n懿，美也。乾为德，离明，故曰文德。离明照天下，巽风散布四方，故曰懿文德。\n初九，复自道，何其咎？吉。\n复，来也。初为阳本位，阳来初，故曰复。来初当位，故曰复自道。乾为道也。初前临重阳，行难，宜有咎。然当位有应，遯世无闷，故无咎也。\n象曰：复自道，其义吉也。\n义者，宜也。言行谊如此，宜其吉也。\n九二，牵复，吉。\n复，来也。伏艮手，故曰牵复。《玉篇》云：牵，速也。《礼·学记》：君子之教喻也，道而不牵。《姤》九三《象》云：其行次且，行未牵也。皆训牵为速。牵复者，速来也。言来居二得中也。若作阳复解，则九二失位，何复之有？又按九二失位无应，承乘皆阳，本不吉，兹曰吉者，徒以得中也。\n象曰：牵复在中，亦不自失也。\n二虽不当位而在中，故吉。清儒多从虞翻，以五牵二，令二变阴应五为说。若然，则各卦非先变《既济》，不能说也。惑乱后学，莫此为甚。失、佚古通。速复，故曰不自佚，言不自安逸也。\n九三，舆说輹，夫妻反目。\n輹，《正义》作辐。而马融以为车下缚，郑玄训为伏兔，则皆作輹。兹从马、郑。伏坤为舆，伏震为輹。輹者舆所恃以行，乃舆在内而輹在外，则舆脱輹矣。乾为夫，坤为妻。巽得坤之初爻，故亦为妻。巽为白眼，卦二至上正反巽，白眼与白眼相反，是反目也。三上无应，下乘重阳，故有是象。震輹象失传。《左传》僖十五年，筮遇《归妹》之《睽》，曰车脱其輹。夫《归妹》之《睽》，即震变离，震变离则震象毁，故曰车脱其輹。輹，伏兔。上承车箱，下轭车轴。《子夏传》、《释名》，皆以輹为车屐，因在箱下，有若履然。故《左传》以震为輹。屐，震象也。虞氏改作腹，非也。\n象曰：夫妻反目，不能正室也。\n坎为室，坎伏不见，故曰不能正室。言夫无如妻何也。\n六四，有孚，血去惕出，无咎。\n四卦主，五阳孚之，故曰有孚。《释文》：血，马云当作恤，忧也。是马以血为恤之省文。而荀爽、王弼等，直读为血，非也。坎为恤、为惕，乃坎伏不见，故曰恤去惕出，言不忧惧也。四当位有应，上承重阳，故无咎。\n象曰：有孚惕出，上合志也。\n上，谓五上。五上皆阳，四承之，阴遇阳得类，故曰合志。此与《升》初六之上合志义同也。巽为志。《易林》姤之小过：心志不亲。《小过》中爻正反巽，故心志不亲。又蒙之升：成子得志。亦以《升》下巽为志。盖心志在内，而巽为伏，故巽为志。\n九五，有孚挛如，富以其邻。\n孚，谓孚于四。四卦主，阳喜阴，故下三阳亦孚于四。挛，引也，牵也。言阳皆孚四，有若牵引连接也。《九家》谓五孚下三爻，虞翻强命二变谓五孚二，并非。阳于阳不孚也。五天子位，巽为利，五乘之，故富。伏震为邻。富以其邻，言五之所以富，以邻于四也。《九家》谓五以四阴作财，与下三阳共之，故曰不独富。深得经旨。\n象曰：有孚挛如，不独富也。\n不独，义见前。\n上九，既雨既处，尚德载。妇贞厉，月几望。君子征凶。\n云上往，至上九而极。兑为雨，兑覆向下，是雨已下施也，故曰既雨。既，已也。《诗·召南·江有汜》：其后也处。《毛传》，处，止也。既处者，言雨已止也。德者，雨泽也。尚德载，言雨泽下降，乾施坤受，地得载其德泽也。巽为妇。柔之为道不利远，高处在上，非妇德所宜，故妇贞得此爻者，厉也。兑为月，互离为日，月西日东，相望。几，孟、荀作既。孟云：既望，十六日也。纳甲法，十五日夜乾象，月盈甲；十六日平明巽象，月退辛。上九处巽之终，正既望也。既望则阳将消，又三无应，故征凶。自兑月象失传，《小畜》、《归妹》、《中孚》之月几望，旧解皆以坎为月。岂知《易》之言月，十九皆谓兑。《说卦》象，与经所用象不尽同也。《易林》复之临云：月出平地。以《临》上坤为地，下兑为月也。又家人之小畜云：杲杲白日，为月所食。以《小畜》互离为日，兑为月。兑月侵入离体之半，故曰为月所食。兑月象，后惟邵子知之，而清易家皆不信。岂知邵子所用，与《易林》合，与《易》合哉！\n象曰：既雨既处，德积载也。君子征凶，有所疑也。\n吴先生曰：古得、德同字。德积载，即雨泽得为大地所载也。巽为疑。下无应，阳遇阳，故疑。","10":"履卦第十\n履虎尾，不咥人，亨。\n《尔雅·释言》：履者，礼也。故《太玄》即拟为礼。礼莫大于辩上下，定尊卑。卦上天下泽，尊卑判然。人之行履，莫大于是，故曰履。乾为虎，四虎尾，兑在乾后，故曰履虎尾。履，蹑也。言三蹑乾后也。乾为人，兑口为咥。人在外，故不受咥。《彖传》曰：柔履刚。言三步乾刚之后也。荀爽谓三履二，只以下卦为说。岂知卦名皆合上下卦取义，无取一卦者。且三履二，是柔乘刚，与卦义正相背，非也。\n彖曰：履，柔履刚也。说而应乎乾，是以履虎尾，不咥人亨。刚中正，履帝位而不疚，光明也。\n说而应乎乾，谓三应上也。五下履巽，巽为病，宜有疚。疚即病也。然而不疚者，以五履帝位而中正也。互离为日，故光明。人知坎为病，不知巽亦为病，故说疚象无有合者。岂知巽为陨落，当然亦为病。《易林》巽之鼎云：病伤不治。以《鼎》下巽为病。兑之蛊云：疮痍多病。以《蛊》上艮为疮痍，下巽为病也。由《易林》推之《易》，《遯》九三云有疾厉，《丰》六二云往得疑疾，《易》原以巽为疾病。故《易林》本之也。（《集解》荀注，多利贞二字，兑秋乾冬正合。然他本皆无。 ）\n象曰：上天下泽，履；君子以辨上下，定民志。\n《谦》坤为民为志，艮止为定。民志之所以不定者，以不知上下也。上天下泽，尊卑显然，故君子法之，以定民志。周公制礼，是其事也。\n初九，素履，往无咎。\n四无应，二阳，阳遇阳得敌，宜有咎。然而无咎者，以能素位而行也，故曰素履。言屏去浮华，安常蹈素，循分自守也。能如此，故往无咎。\n象曰：素履之往，独行愿也。\n得敌无应，故曰独行。甘于独行，故无咎也。先儒于同性相违之义知者鲜，故独行之故，无有详者。\n九二，履道坦坦，幽人贞吉。\n伏艮为道路。比阴得中，故坦坦。坦坦者，宽平也。兑为昧，无应，故曰幽人。居中故贞吉。\n象曰：幽人贞吉，中不自乱也。\n《象》多释贞为正。此以不乱释贞，明贞有正、定二义也。\n六三，眇能视，跛能履。履虎尾，咥人凶。武人为于大君。\n《说文》：眇，一目小也。兑为小，离目，故曰眇能视。震为履，二三半震，故曰跛能履。眇而视，跛而履，皆力不足而不止之象，故《象》曰不足以有明，不足以与行也。三正在乾虎后，故曰履虎尾。《彖》言不咥，此言咥者，盖以上下卦言，乾虎在外，兑在后，故不咥；而以爻言，四虎尾，上虎首，三应在上，上必来三，虎首回噬，故三独受咥而凶也。伏震为武人，乾为大君，三承乾，故曰武人为于大君。言武人忠于大君。阴顺阳，代终事，与《讼》三之从王事同。《象》释曰志刚，刚即谓大君，志刚即释为义也。虞翻谓三失位，变得正成乾，直以武人变为大君，失之。近师俞荫甫谓此与《坤》、《讼》六三之或从王事同义，略露曙光。特又以三升乾上释为字，仍误也。震武之象，《国语》重耳筮遇贞屯悔豫，皆有震，曰车有震武。武，足迹也。震健，故震为武。《易林》本之，遇震即言武。于是《履》及《巽》之武人，象始大明。\n象曰：眇能视，不足以有明也。跛能履，不足以与行也。咥人之凶，位不当也。武人为于大君，志刚也。\n三承重阳，故曰志刚。言志在顺阳而行，即《坤》六三、《讼》六三之所谓从王事也。巽为志。\n九四，履虎尾，愬愬终吉。\n《子夏传》：愬愬，恐惧也。四当乾末，正为虎尾。乾为惕，故为惧。然下孚于三，三阴，阳得阴志行，故终吉。《小畜》九五云有孚，谓孚于四阴，此与同义。又《大有》上九吉，《随》九四有孚，皆以下乘阴而吉。昔贤不究阴阳相孚之理，但云惧则吉者，非也。\n象曰：愬愬终吉，志行也。\n阳孚阴故曰志行。巽为志。\n九五，夬履，贞厉。\n夬，决也，绝也。言五承乘皆阳，上下应予绝也。贞，卜问。厉，危也。五居互巽之上，巽陨落，故危。《否》九五云其亡其亡，《兑》九五云孚于剥有厉，亦皆以居巽上，故危也。\n象曰：夬履贞厉，位正当也。\n五正当巽上，故贞厉。\n上九，视履考祥，其旋元吉。\n视履谓三。祥，吉凶之朕兆。上处履之终，故可回视已往之行事，而察其善恶之征祥。三上相上下，上来三，则皆当位，故曰其旋元吉。旋，复也，来也。元吉，大吉也。祥，荀作详。祥、详古通。\n象曰：元吉在上，大有庆也。\n五阳独上有应，故大有庆。","11":"泰卦第十一\n泰，小往大来，吉，亨。\n阳性上升，阴性下降。乃阴在上，阳在下，故其气相接相交而为泰。泰，通也。阳大阴小，爻在外曰往，在内曰来，故曰小往大来。《泰》寅月卦，阳长故亨。\n彖曰：泰，小往大来吉亨，则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人。君子道长，小人道消也。\n阳上升，阴下降，故气交。坤为万物，为心志。交则万物气通，心志和合，故曰同。坤志象失传。《易林》屯之益云：心劳且忧。《益》互坤，以坤为心。又需之否云：毛羽憔悴，志如死灰。以《否》下坤为志为死（详《焦氏易诂·易象补遗》 ）。内阳外阴，内健外顺，内君子外小人，将老氏宗旨，括尽无余。乾为君子，坤为小人。《泰》本候卦，阳长故阴消。\n按上经始乾坤，终水火，而以否泰为枢纽。明否泰剥复，皆天地自然之法象，循环之原理，君子所宜居而安也，静之象也。下经始咸恒，终既未济，而以损益为枢纽。明吉凶失得，进退变化，全在人为，君子所以自强不息也，动之象也。而否泰损益，皆序于第十卦后者，数至十则盈，盈则变也。\n象曰：天地交，泰；后以财成天地之道，辅相天地之宜，以左右民。\n财、裁同。《释文》：荀作裁。《释言》疏：财、裁音义并同。汉时臣工上疏，裁察每作财察，是其证。财成，即裁成也。互震为左，互兑为右，坤为民。以左右民者，孔疏：左右，助也，以助养其民也。虞翻谓坤富称财，非。\n初九，拔茅茹，以其彙，征吉。\n初应在四，四坤为茅茹。此象失传。《易林》剥之坤云：荻芝俱死。以坤为荻芝。又同人之屯云：蓬蒿代柱，大屋颠倒。《屯》互艮为屋为柱，互坤为蓬蒿。故坤亦为茅茹。茹，菜属也。《诗·郑风》：茹藘在阪。《前汉·食货志》：菜茹有畦。茅，《说文》：菅也。茹与茅为二物。以其彙者，言茅与茹同拔，连类以及也。四有应，故征吉。\n象曰：拔茅征吉，志在外也。\n初应在四，故曰志在外。外坤为心志。\n九二，苞荒，用冯河，不遐遗。朋亡，得尚于中行。\n《释文》云：荒本亦作巟。《说文》引同，许云：水广。虞云：大川也。晁氏云：汉《易》皆作巟，彖辞巟、河是一事。象数无田秽之荒，作荒始于王弼。按，晁说是也。巟、河为对文。王弼盖以坤为乱，改作荒。岂知坤为水，巟与河皆坤象也。苞，今本作包，《唐石经》增改作苞，《释文》亦作苞。二应在五，五坤为大川，为河。言二必上升，有苞括大川，冯涉长河之势，断不以其辽远而不及也。阴以阳为朋。亡，往也，去也。朋往者，言二必往五，得尚居中正之位也。旧诂因坤水象及朋义失传，故无有得解者。（《礼记·少仪》有亡而无疾，《晋语》请从此亡，注皆训为去。 ）\n象曰：苞荒得尚于中行，以光大也。\n五位尊，故曰光大。\n九三，无平不陂，无往不复。艰贞无咎，勿恤其孚，于食有福。\n陂，倾也。复，返也。阳息至三，天地分，故曰平。然三居卦终，《乾》三云：终日乾乾，反复道也。言阳至三而盈，将反初成巽也，故曰无平不陂，无往不复。（巽陨落，故倾。 ）平陂往复，虽相循环，然三本当位，能艰贞自守，必无咎也。坤为忧恤（《临》六三云：既忧之无咎。以坤为忧。《易林》大壮之损云：使母忧叹。以《损》互坤为忧也。详《焦氏易诂》 ），三临之，孚于群阴，故无恤。兑口为食，坤多，故曰于食有福。乾为福也。\n象曰：无往不复，天地际也。\n《广韵》：际，边也，畔也。三应在上，三上居天地之极，极则返始，释平必陂、往必复之故也。宋衷曰：三位在乾极，应在坤极。以极诂际字，最为明晰。乃惠栋、李道平等解释宋注，竟从《小尔雅》，谓际者接也，天地际即天地交接也。岂知乾极坤极，正释际义。际若为交接，与无往不复之义何与哉？失宋义矣。其他更无有能解者。易理之失传，更甚于易象矣。\n六四，翩翩，不富，以其邻不戒以孚。\n震为飞，故曰翩翩。坤虚，故曰不富。以，与也。震为邻。以其邻不戒以孚者，言四及五上，皆有应予，下孚于阳也。阴得阳应必吉，故曰不戒以孚。戒，告诫也。震飞之象，《易林》屡用之。同人之坎云：出于幽谷，飞上乔木。以《坎》互震为飞也。证之《易》，《明夷》初九云：明夷于飞。《易》即以震为飞。旧解以离为飞，若《泰》无离象也。\n象曰：翩翩不富，皆失实也。不戒以孚，中心愿也。\n坤为心志。（按，《益》九五云：有孚惠心。以互坤为心也。《否》初象云：志在君也。以坤为志也。《易林》以坤为心志，证尤多。旧解皆以坎为心志。自得此象，凡《易》言心志者，始皆得解。 ）中心愿者，言阴喜应阳也。阳为实，失实言无阳。\n六五，帝乙归妹，以祉元吉。\n震为帝，坤贞乙，故曰帝乙。兑为妹，震为归。妇人谓嫁曰归，归妹谓嫁妹也。正中爻震兑象也。祉，福也。以祉元吉者，言二升五，五来二（来二即归 ），各当其位，永为俪耦，故元吉也。《象》释曰中以行愿，即谓五愿归居二也。帝乙或谓为成汤，或谓为纣父。\n象曰：以祉元吉，中以行愿也。\n五位尊，故曰元吉。中以行愿，即谓五愿归二也。\n上六，城复于隍。勿用师，自邑告命，贞吝。\n复、覆通。《诗》：陶复陶穴。《说文》引作覆，是其证。艮为城。兑为隍，城池也。三至上艮覆，正当兑泽，故曰城覆于隍。《九家》云：城覆于隍，国政崩也。崩即谓艮覆。京房于《复》卦朋来无咎，朋作崩，与此义同也。又《易林》归妹之泰云：倾夺我城，使家不宁。城倾，即谓《泰》三至上艮覆，释此爻也。坤为师。震为言，为告命。坤阴下降主退，故曰勿用。吴先生曰：邑，挹之省文。挹，损也。言自挹损其告命，如后世之下诏罪己也。贞吝，言卜问不吉。泰极将返否故也。\n象曰：城复于隍，其命乱也。\n坤为乱，其命乱者，言泰极返否，为天地自然之命运，无可避免。此命字与告命异，诸家混同之，非。","12":"否卦第十二\n否之匪人，不利君子贞。大往小来。\n阳上升，阴下降。乃阳即在上，阴即在下，愈去愈远，故天地不交而为否。否，闭也。《泰》上六《象传》云其命乱也，言泰极反否，乃天地自然之命运，必至之理，非人力所能为。此曰否之匪人，仍其义也。阳往外而诎，阴来内而信，故不利君子贞。贞，卜问。其以正为说者，无论若何斡旋，皆不能通。\n彖曰：否之匪人，不利君子贞，大往小来，则是天地不交而万物不通也，上下不交而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子。小人道长，君子道消也。\n天气本上腾而在外，地气本下降而在内。愈去愈远，故气不交；气不交，故万物不通而死矣。坤为万物，为邦国。乾上坤下，君民不亲，上下闭塞，而邦必乱，故曰无邦。《否》七月卦，阴长阳消，故曰小人道长，君子道消。\n象曰：天地不交，否；君子以俭德辟难，不可荣以禄。\n乾为德。俭，约也。坤闭，故曰俭德。言敛抑自守也。互巽为伏，故曰辟难。坤为患，为难。言遯世不出，以避世难。乾为禄，艮为荣，巽伏故不可荣以禄位。言当否之时，遯入山林，高隐不出也。\n初六，拔茅茹，以其彙。征吉，亨。\n阴皆有应，故辞与《泰》同。《泰》茅茹象，指应爻，此则用本象也。\n象曰：拔茅征吉，志在君也。\n坤为志，乾为君。志在君，言上应四也。\n六二，苞承，小人吉，大人否亨。\n苞，今本作包。依《唐石经》及《释文》，下同。包、苞古通用。《禹贡》：草木渐包。注：包，丛生。《释文》：字亦作苞。是包、苞古不分。《尔雅·释言》云：苞，稹也。疏：孙炎曰，物丛生曰苞。《诗·唐风》：集于苞栩。亦以苞为丛。是苞有多意，众义。坤为众。苞承者，言下三爻皆承阳有应也。小人谓二。二得中有应，故小人吉。凡阴得阳应必吉，阳得阴应不皆吉。而《否》卦阳气上腾，不能下降，故大人否亨。大人谓五。否，不。言五虽得二应而不亨也。朱升释承为脀。卦既无此象，荀爽谓二为四所包，朱震谓二为五所包。夫四五若能下施包二，则大人不否亨矣，非也。\n象曰：大人否亨，不乱群也。\n坤众，故曰群。坤为乱。乱，杂也。不乱群，言五不能下施应二，俾天地相杂也，故否亨。虞翻谓坤三阴，乱弑君，大人不从，故不乱群。岂知不乱群，即仍天地不交之义，言五不能交二也。群义即释苞义也。\n六三，苞羞。\n此苞字与上同义，仍坤众、坤群象也。羞，《说文》：进献也。《左传》隐三年：涧溪沼沚之毛，可荐于鬼神，可羞于王公。杜注：羞，进也。《国语·楚语下》：于是乎每朝设脯一束，以羞子文。注亦作进。苞羞者，众进也。《否》本阴长之卦，故群进而消阳也。\n象曰：苞羞，位不当也。\n六三不当位，进至于四，或与上相上下，则当位矣。言所以进者，以不当位也，释苞羞之故也。自荀爽释为羞耻，朱升释为膳羞，位不当之义，皆莫知所指矣。\n九四，有命无咎，畴离祉。\n命，《说文》：使也。《广韵》：召也。有命，言有所使命也。巽为命。《周语》：襄王锡晋文公命。盖四履群阴之上，万民（坤为民 ）顺承，故有所锡命。四不当位，宜有咎；得群阴使命，故无咎。《颐》上九云：利涉大川。与此义同也。畴、俦同。《荀子·劝学篇》云：草木畴生。注：畴，同俦。《前汉·韩信传》：其畴十三人。义亦同俦。俦，众也。下坤为众。离，附著。祉，福。畴离祉者，言众阴同附阳，得主而受福也。孔疏训畴为匹，匹谓初，言初得阳应而受福。然《象》释曰志行，荀爽谓志行于群阴，固统三阴言，不专指初也。\n象曰：有命无咎，志行也。\n四履重阴，得行其志，故曰志行。\n九五，休否，大人吉。其亡其亡，系于苞桑。\n《说文》：人依木则休。休者，憩息也。休否者，言当否之时，而休息以俟也。盖初四、三上相上下，则《既济》成。五当位居中，宜静俟也。旧解释为休美，与其亡义背，似非也。九五为大人，故曰大人吉。九五巽体，巽为桑，坤为多，故曰苞桑。陆绩《京氏易传注》云：苞桑，则丛桑也。巽为绳，为系，故曰系于苞桑。乃巽为陨落，五虽居中得正，而风陨在下，故有其亡之惧。盖系在大木，方能巩固；桑而丛生，其柔可知，系于柔木，其危可知。其亡其亡，系于苞桑者，言时时虑亡，如系于苞桑之不足恃也。王陶庐云：《唐石经》初刻作包，后增改作苞。按《禹贡》：草木渐包。《传》释为丛生，仍与苞同。自风陨象失传，后儒不知危亡之故在五履巽，于是旧解皆以坚固为说，遂与易象不协矣。\n象曰：大人之吉，位正当也。\n五位尊而中正，故曰位当。\n上九，倾否，先否后喜。\n侯果曰：倾，覆也。上应在三，三巽为陨落，故曰倾否。言倾否而出之尽也。然当未覆之先，则仍否也，故曰先否。上反下则成震，震为乐为后，故曰后喜。\n象曰：否终则倾，何可长也！\n否终则倾，言否终则泰复，不能长否。\n按《否》、《泰》云，大小往来。无平不陂，无往不复；终则曰，城复于隍，其命乱也。《否》则曰：否之匪人。皆言天地否泰之运，循环往来，自然如此，不假人为，为上经天地水火之枢纽。明天道本如斯，不可易也。至下经第十卦之《损》、《益》，则曰损益盈虚，与时偕行。曰损刚益柔。曰损下益上，损上益下。曰见善则迁，有过则改。所言皆履世之大经，修治之极轨，无丝毫委心任运之意，以为《咸》、《恒》、《既》、《未济》之枢纽，明人事宜如斯也。尽人事，听天命，斯学《易》之功也。","13":"同人卦第十三\n同人于野，亨，利涉大川，利君子贞。\n荀爽曰：乾舍于离，相与同居。《九家》曰：乾舍于离，同而为日。天日同明，故曰同人。是乾之居南，汉儒已言之矣。又荀爽注阴阳之义配日月云：乾舍于离，配日而居；坤舍于坎，配月而居。不惟乾南，且言坤北。而惠征君以为此汉儒言先天之铁证也。而欲灭其迹，曰荀氏用鬼易，以乾归合离，坤归合坎释之。按乾归为《大有》，坤归为《比》，而荀氏所言者，则《同人》、《师》，乃离归、坎归也。于游归恒例，尚不能知，而欲灭其证，其谁信之？故夫《同人》卦义，舍《九家》、荀爽说，无有当者。伏坤为野。《正义》云：野以喻宽广，言和同于人，宜无远弗届也。《易林》、《九家》、荀爽皆以乾为河为海，是乾亦为大川。利涉谓五，中正有应，故《传》释为乾行。乾为君子，故利君子贞。贞，卜问也。\n彖曰：同人，柔得位得中而应乎乾，曰同人。同人曰，同人于野亨，利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。\n坤为天下，五应二，故能通天下之志。详解在《焦氏易诂》中。\n象曰：天与火，同人；君子以类族辨物。\n《易》以阴阳相遇为类。（王引之繁称博引，释类为比。岂知皆非《易》之所谓类。 ）族，《正义》云：聚也。聚居一处，故曰同人。然所以能聚者，以其类也。设失类而为纯阳或纯阴，则不能聚矣。类族方能合异为同。乾阳物，坤阴物，同一物也，而分阴阳。辨，别也，明也。《同人》五阳一阴，阴虽少，然五阳之所类也，即五阳之所同也。同则不分。然阴物阳物，判然不同，辨而明之，方知同之中有异。《易》之道，同性相违，异物相感。自类字失诂，义遂不明。\n初九，同人于门，无咎。\n初于二阴独近，故曰同人于门。《象》曰：出门同人。亦谓二近初，初出门即遇也。虞翻以乾为门，命四变阴以应初，若卦为《家人》者。而惠栋、姚配中皆宗之。朱汉上强命初变，以艮为门，若卦为《遯》者。而毛奇龄、焦循宗之。是皆曲说害理。二坤爻，坤亦为门户也。\n象曰：出门同人，又谁咎也？\n谁咎，谓无咎。\n六二，同人于宗，吝。\n乾为主为宗，二五正应，故同人于宗。但卦五阳皆同于二，今二独亲五，则三四忌之，致吝之道也。《下系》云：远近相取，而悔吝生。远谓应，近谓比。远取应，则不能近取比。如《无妄》六二往应五而利，则不系初。近取比，则不能远取应。如《中孚》六四绝类上则不应初，而马匹亡，是也。是故远近万不能兼取。《同人》六二远应五，则有近不承阳之嫌，近承阳则失远应，故吝也。彼夫《咸》六二、《遯》六二皆有应，象皆与此同。乃《咸》六二曰居吉，《遯》六二曰执之，皆戒其动，俾远近皆不取。不取则悔吝免也。旧说皆不知其故在三四，故鲜有得解者。\n象曰：同人于宗，吝道也。\n许慎《五经异义》云：《易》曰同人于宗吝，言同姓相取，吝道也。按，此皆不明易理，不知吝之故何在，而为此穿凿之说。《同人》二与五，与《大有》五与二同也。乃《大有》五应乾，无同姓之嫌，此独曰同姓，尚能通哉？\n九三，伏戎于莽，升其高陵，三岁不兴。\n巽为伏，为寇盗（象失传，详《焦氏易诂》 ），为草莽，故曰伏戎于莽。乾为山，为陵（象失传，详《焦氏易诂》 ），巽为高，乾为行，故曰升其高陵。乾为岁，离卦数三，故曰三岁。三阳遇阳，得敌，其行塞，故升高不兴也。\n象曰：伏戎于莽，敌刚也。三岁不兴，安行也。\n敌刚，即阳遇阳。安行，谓行难。\n九四，乘其墉，弗克攻，吉。\n巽为墉，四居巽上，故曰乘其墉。乘墉据高，故不能攻之。然此爻不当位，无应予，承乘皆阳，困极矣。爻辞曰吉，则不得其义。《象》曰困而反则，似亦不得的解，而为此无可奈何之解。独虞翻命四变阴，当位有应，承乘皆阳，人人皆知其吉矣。然四变阴，则巽墉象毁，四居坎上，而谓乘其墉则不合矣。\n象曰：乘其墉，义弗克也。其吉，则困而反则也。\n则，法也。反则，言循分自守也。\n九五，同人，先号啕而后笑，大师克相遇。\n此与《屯》六二义同。《屯》二欲上应五，而为三四同性之阴所隔，故屯邅不进。然与五为正应，十年乃字，终必合也。《同人》九五欲应二，而为三四同性之阳所阻，故先号啕。然与二为正应，终必相遇，故后笑。伏震为笑，为后。虞翻以互巽为号啕。卦伏坤，故曰师。相遇，谓遇二也。从前不能相遇者，以三四之伏戎为害也。后克而胜之，故与二相遇。\n象曰：同人之先，以中直也。大师相遇，言相克也。\n端木国瑚曰：《同人》先天乾二中直，五无应，故号啕。后天离中虚，五得应，故后笑。以先后天解《同人》之先后及中直之义，虽未确切，较胜于旧解。\n上九，同人于郊，无悔。\n居外卦之上，故曰同人于郊。乾为郊。上乘阳无应，远居郊外，旷莫与俦，故曰志未得。伏坤为志。\n象曰：同人于郊，志未得也。","14":"大有卦第十四\n大有，元亨。\n离乾皆居南，故曰大有。与《同人》义同也。元亨，谓五也。五得尊位，故曰元。上下应，故曰亨。《坤》五曰元吉，《比》五曰元永贞，《损》五、《益》五、《鼎》五皆曰元吉，是其证。\n彖曰：大有柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。\n五天位，二应之，故曰应乎天。离为夏，万物相见，故曰时行。\n象曰：火在天上，大有；君子以遏恶扬善，顺天休命。\n离为恶人，乾为善。二五相应予，而皆不当位，九二云：有攸往。是二必往五也。二往五，是扬善也；二往五则五下居二，是遏恶也。乾为天为命，阴承乾，故曰顺天休命。休，美也。\n初九，无交害，匪咎。艰则无咎。\n初无应，阳遇阳失类，故无交。无交故无害。然须艰贞自守，方无咎也。\n象曰：大有初九，无交害也。\n九二，大车以载，有攸往，无咎。\n伏坤为大车，为载。按《考工记·车人》：大车，牛车也。两辕，牛在辕内。凡载物皆用大车，与马车迥异。马车皆小车，一辕，两服在左右，专备人乘。若载物必大车也，故曰大车以载。上有应，往则得位，故无咎。\n象曰：大车以载，积中不败也。\n二得中，承乘皆阳，故曰积中。乾为实，故为积也。阳上升，故曰大车以载。义则本爻，象则用伏。（卢氏以乾为大车，乾似无此象。 ）\n九三，公用亨于天子，小人弗克。\n三为三公，兑为亨。天子谓五，小人谓四。四不中不正，失位无应，故曰小人。三兑体，可受亨于五。然而弗能者，以四亦阳害之也。\n象曰：公用亨于天子，小人害也。\n九四，匪其彭，无咎。\n《释文》云：彭，《子夏传》作旁，虞作尫。云作彭、作旁，声字之误。王陶庐云：诸家《易》俱不作尫，此仲翔故生异说，与先儒为难。按《说文》云：彭，鼓声也。《释名》：彭，旁也。然则彭之与旁，音义并同。《诗·鲁颂》：以车彭彭。《毛传》：有力有容也。《齐风》：行人彭彭。《毛传》：多也。《集韵》云：强盛也。然则彭之义，为声容盛大无疑。兑为刚鲁，故曰彭。离为文，故曰匪。《考工记》：且其匪色。注：匪，采貌也。《少仪》：车马之美，匪匪翼翼。注：行而有文也。匪其彭者，言文采之盛大显著也。\n象曰：匪其彭无咎，明辨晢也。\n明辨晢，即《释文》盛之义。盖离为嘉会为礼，有礼则有文，上下秩然，明辨以晢，故无咎也。\n六五，厥孚交如，威如，吉。\n孚，信也。五阳全孚于五，故曰交如。离南面向明而治，故曰威如。\n象曰：厥孚交如，信以发志也。威如之吉，易而无备也。\n五孚于诸阳，得行其志。孚即信，故曰信以发志。伏坎为信为志也。居尊位，人皆敬之，左右咸宜，故不必有所戒备。\n上九，自天祐之，吉无不利。\n五天位。祐，助也。王弼云：余爻皆乘刚，上独履柔，故吉利也。\n象曰：大有上吉，自天祐也。","15":"谦卦第十五\n谦，亨，君子有终。\n山本高而在地下，故曰谦。谦，不自足也。三承乘皆阴，故曰亨。艮为君子，坤为终，故曰君子有终。谦、嗛同。《汉书·艺文志》：《易》之嗛嗛。《尹翁归传》：温良嗛退。注皆云同谦。嗛，不足也，少也。故《彖传》以盈为对文。\n彖曰：谦亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。\n艮为天，为光明。（象本《易林》。实《易》以艮为天、为光明之处甚多，详《焦氏易诂》。荀爽谓阳来成坎，日月之象，故光明，非。 ）居下卦，故曰下济。济，止也。言一阳止于三而成艮也。艮，止也。坤为卑，居上卦，故曰卑而上行。互震为行也。天道亏盈四句，申有终之原理。变，毁也。坤为亏，为毁，为害，为恶，为鬼。震为神（象失传，详《焦氏易诂》 ），为人。艮一阳在上，故尊（艮为官，为君子，人知之，乃为尊又不知，只《易林》以艮为贵为尊 ）而光。卑谓居下卦。虞翻谓三位贱，故卑。非也。卑不可逾者，艮为山，艮止坎险，故虽卑退而不能逾越，终获福也。\n象曰：地中有山，谦；君子以捊多益寡，称物平施。\n捊，王弼本作裒。《释文》云：郑、荀、董、蜀才皆作捊，取也。捊、裒音同通用。阳来内故曰益，艮手故曰取。《说卦》坤为众，故为多。《剥》下五阴，互三坤，多极矣；今上来益三，居中以界上下。坤为物。下物虽寡，阳来益之，上下物等，故曰称物。坎为平，物称故施平。（虞因艮多节，谓艮为多。非。多白眼、多心、多眚，多字若可取象，则巽、坎皆可为多，不只艮也。 ）\n初六，谦谦君子，用涉大川，吉。\n初临坎水，坎险坎陷，本不易涉。然初居下卦之下，谦而又谦，卑以自牧，故可用以涉此大川，而无不吉也。\n象曰：谦谦君子，卑以自牧也。\n扬子《方言》：牧，司也，治也。\n六二，鸣谦，贞吉。\n《玉篇》：鸣，声相命也。震为鸣，二承之，三阳为二友。《损》一人行则得其友，是也。《诗·小雅》：嘤其鸣矣，求其友声。言二得承三，遂其所愿，故得意而鸣也。二当位，故贞吉。\n象曰：鸣谦贞吉，中心得也。\n中心得，申鸣谦之故也。卦体坎，坎为中、为心。\n九三，劳谦，君子有终，吉。\n坎为劳卦，故曰劳谦。艮为君子，艮成终，故曰君子有终。\n象曰：劳谦君子，万民服也。\n三临群阴，坤众，故曰万民服。\n六四，无不利， 谦。\n《释文》： 、麾同，指 也。\n象曰：无不利 谦，不违则也。\n则谓三。言四顺三，而发 其谦德也。阴顺阳，故无不利。《子夏传》： 谦，化谦也。盖化于三而不违之也，则纯指三言。各家泛论之，非也。\n六五，不富 （句 ） ， 以其邻，利用侵伐，无不利。\n坤虚，故不富。震为邻，为侵伐。以，与也。言五与四顺三以征不服，无不利也。震为威武，故为侵伐，为征。李鼎祚谓六五离爻，离为戈兵，故为侵伐。毛奇龄、惠栋用之，非也。\n象曰：利用侵伐，征不服也。\n上六反君道，故曰不服。荀爽谓指五，似非。\n上六，鸣谦，利用行师，征邑国。\n俞樾云：六二鸣谦，《传》曰中心得，此曰志未得，何相反若是？疑鸣当作冥，与《豫》、《升》上六同例。按俞说是也。《豫》上六冥豫，《释文》云：郑读为鸣。鸣、冥古盖同声相假，犹捊之作裒也。坤为师为邑国，震为征为行，人众势强故利。然以冥谦行之，昧于事情，故难得志，宋襄公是也。\n象曰：鸣谦，志未得也。可用行师，征邑国也。\n上应在三，三坎为志。志未得，言上为四五所阻，应三难也。","16":"豫卦第十六\n豫，利建侯行师。\n雷出地上，得众志行，故豫。豫，和乐也。《归藏》作分。言震雷上出，与地分离也。又一阳界于五阴之间，使上下分别。与《周易》义异。震为君，故曰建侯，与《屯》同义。坤为师，顺以动，故利行师。\n彖曰：豫，刚应而志行，顺以动豫。豫顺以动，故天地如之，而况建侯行师乎？天地以顺动，故日月不过而四时不忒。圣人以顺动，则刑罚清而民服。豫之时义大矣哉！\n艮为天，坤为地，艮为日，坎为月。顺，故不过不忒。坎为刑罚，坤为民。坤顺，故刑罚清而民服。艮为时，震卦数四，故曰四时。坎为圣（《虞氏逸象》 ）。李鼎祚以震为圣，非。\n象曰：雷出地奋，豫；先王以作乐崇德，殷荐之上帝，以配祖考。\n震为乐，为仁德，为帝，为荐。荐，进也。殷，盛也。艮为祖考。（象失传，只《易林》知之。实《小过》六二过其祖，即以艮为祖。详《焦氏易诂》。 ）古帝王作乐，皆以象其功德，用以郊天，使祖考配享。雷出地奋，声容象之，故先王取以为法。震为王。\n初六，鸣豫，凶。\n初应四，四震为鸣，故曰鸣豫。爻在此而象在应，如《蒙》三之金夫，《泰》二之包巟、凭河，及此，为《易》之通例。自此例不明，于是《明夷》初九之飞及翼，皆以离为象矣。初六得敌，不能应四，故凶。\n象曰：初六鸣豫，志穷凶也。\n穷者，极也。初为二三所隔，应四难，故曰志穷。\n六二，介于石，不终日，贞吉。\n《释文》云：介，古文作砎。郑古八反，云磨砎也。马作扴，云触小石声。案《说文》：扴，刮也。古黠切。《广韵》：揩扴物也。音戞。揩扴即磨砎，皆触坚不相入之声。又《庄子·马蹄篇》：加之以衡扼，齐之以月题，而马知介倪。陆云：介，徐古八反。亦音戞。介者触，倪睨同。介倪者，即马因感触月题等物之磨砎，因而睥睨也。是《庄子》亦以介为触。然则砎、扴、介音义并同，盖非触坚，不能有磨戞之声。然则介于石即触于石。艮为石，二前遇之，故触于石。《易》之道，异性为类，同性相敌，二五无应，承乘皆阴，如触于石之不相入。触石不入，故君子见几而作，不俟终日也。旧解诂砎字是，而义则不详。须知砎于石，乃危辞，以形容二之失类，故《系》云：介如石焉，宁用终日，断可识矣。艮为终日。《易林》大过之艮云：终日至暮，不离其乡。以艮为终日，坎为暮也。夫居中位，而又能危惕自警，故贞吉也。宋翔凤以《说文》无砎字，有扴，便谓砎为讹字。岂知晋孔坦《答刘聪求降书》曰：何知几之先觉，砎石之易悟。《桓温传》亦曰，砎如石，所以成务。不止郑作砎也。\n象曰：不终日贞吉，以中正也。\n二当位，故中正。\n六三，盱豫，悔，迟有悔。\n《说文》：盱，张目也。《尔雅》：盱，忧也。又《诗·小雅》：云何盱矣。郑笺：病也。艮为视（象失传，只《易》及《易林》用之，详《焦氏易诂》 ），坤为病，故曰盱。诸爻独三得承阳，然失位，故睢盱上视，有忧悔也。艮止故迟。有、又通。迟有悔者，言迟疑不决，又有悔也。盱豫句。悔一字句。\n象曰：盱豫有悔，位不当也。\n位不当，释盱豫之故。\n九四，由豫，大有得，勿疑。朋盍簪。\n《孟子》：由由然与之偕。注：由由，自得之貌。由豫者，从容和乐也。坎为疑，上下四阴附之，阳遇阴则通，故曰大有得勿疑。阳以阴为朋。盍，合也。簪与笄同，所以括发。朋盍簪，言群阴归四，有若簪之括发也。臧庸云：象盍簪者，取一阳横贯于五阴之中。可谓观象独深。又杜诗：盍簪喧枥马。言群马絷于一杠之上，故以盍簪为喻。此语解《易》，可谓明白如画矣。艮为簪。《易林》恒之咸云：簪短带长。以《咸》艮为簪。复之节语同，亦以《节》之互艮为簪。凡《易林》象，无不本于《易》。《子夏传》为韩婴作，在汉易为最古，即作簪。故焦氏亦读为簪，与《子夏传》同。至东汉则多改字，其详皆在《焦氏易诂》中。（后之人于笄簪括发之形象，茫昧失考，故于易象维妙维肖之朋盍簪三字，皆不知其故。而尤以谓汉以前无簪名者为失考。《仪礼》：簪衣于裳。《韩非子》：周主亡玉簪。李斯《谏逐客》：宛珠之簪。谓汉以前无者非也。 ）\n象曰：由豫大有得，志大行也。\n志谓坎。上下五阴皆孚于四，故曰志大行。\n六五，贞疾，恒不死。\n坎为疾，震生故曰不死。五以阴柔处尊位，乘刚势逆，故常疾。然久而不死，以处中位也。如齐田得民，姜亦不遽亡也。\n象曰：六五贞疾，乘刚也。恒不死，中未亡也。\n中未亡之故，以得中故也。\n上六，冥豫，成有渝，无咎。\n冥昧不事事，功之成者必渐隳矣，故曰成有渝。然当位，目前虽无大咎，久则祸至，故《象》曰何可长。\n象曰：冥豫在上，何可长也！\n何可长，言不足恃。","17":"随卦第十七\n随，元亨利贞，无咎。\n《归藏》曰马徒。马徒，即《周礼》太仆职所谓前驱。《越语》：勾践亲为夫差前马。注：前马，前驱，在马前也。按震为马，互艮为徒隶。马徒皆随贵人马，前行以辟道；而兑为口，为传呼，于卦象颇合。兹《周易》名随，似取随时之义。震春，故曰元亨；兑秋，故曰利贞。言春而夏可赅，言秋而冬可赅。元亨利贞，即春夏秋冬，周而复始，循环不穷，故曰随。随时而动，不过不忒，故无咎。\n彖曰：随，刚来而下，柔动而说。随，大亨贞无咎，而天下随时。随时之义大矣哉！\n王肃本，随时皆作随之，将卦义全失。朱子从之，过矣。故夫读《易》以明理为先也。\n象曰：泽中有雷，随；君子以向晦入宴息。\n艮为君子，艮止故宴息。兑为昧，为晦。震往，往而遇兑，故曰向晦。巽伏，故君子法此象，以向晦入宴息。\n初九，官有渝，贞吉。出门交有功。\n官，蜀才作馆，见《释文》。惠栋云：官，古文馆。以《穆天子传》，官人陈牲为证。按作馆是也。艮为馆，下卦艮覆，故曰馆有渝。渝，变也。初至四为正覆艮。象覆即于覆取义，《易》通例也。自覆象失传，渝之故旧解皆不能说其所以然。而用覆之辞，如《蒙》彖，如《中孚》之二、三爻，诂皆误矣。渝而得位，故贞吉，与下贞凶为对文。艮为门，初临之，而震为出，故曰出门。出门则有交接，阳遇阴则通，故有功。凡阳临重阴者无不吉，此其一也。\n象曰：官有渝，从正吉也。出门交有功，不失也。\n失与佚通用。佚，逸也。震动故不佚，言不敢安逸也。此与《比》六二不自失，《小畜》九二亦不自失，皆读为佚。与吉韵。义详《比》九五失前禽注。\n六二，系小子，失丈夫。\n此爻旧解，淆乱至今者，一由卦象失传，二由同性相敌之理不明也。初震为小子，四艮为丈夫。二近初，故系小子。为六三所隔，不能承四，故失丈夫。《易林》家人之巽云：孩子贪饵。以伏震为孩子也。孩子即小子。是焦氏以震为小子，义即本此也。又复之剥云：夫亡从军。以《剥》上艮为夫。是艮为丈夫，焦氏仍本之《易》。盖以二人言，初生者长，后生者少，故《说卦》以震为长子，艮为少子。而以一人言，则初少、上老，故经以震为小子，艮为丈夫。先儒不知经取象往往与《说卦》不同，不敢直认。岂知《象传》所释至明也。\n象曰：系小子，弗兼与也。\n二居初四之间，近初远四，故曰弗兼与。虞翻谓二应五，以五为小子。五为少女，焉能为小子？失之远矣。\n六三，系丈夫，失小子。随有求 （句 ） ， 得 （句 ） ， 利居贞。\n三近四承阳，故上系丈夫。为二所阻，故下失小子。《象》谓志舍下，是明以震为小子，艮为丈夫也。随有求句，与下随有获对文。艮为求，阴承阳故有得。巽为利。《咸》六二云：居吉。兹云利居贞，似亦以动为戒。盖上无应，静而承阳则吉，动则不利。旧解谓之正应上，于居义相背，非也。\n象曰：系丈夫，志舍下也。\n下谓初。经以艮为丈夫，以震为小子，可谓明白矣。\n九四，随有获，贞凶。有孚，在道以明，何咎？\n下乘重阴得民，故有获。不当位，前遇敌，故贞凶。然下孚于众，光明正大，遵循正道，亦无咎也。艮为道，为光明。虞氏命三四全变成离，取明象，迂曲失经旨。（《大畜·彖传》曰：刚健笃实辉光。刚健谓乾，辉光谓艮。是艮为光明，《易》有明文。 ）\n象曰：随有获，其义凶也。有孚在道，明功也。\n其义凶者，谓四本不凶，而凶者以不当位也。（《大畜》、《颐》上九皆下孚于阴而吉。 ）\n九五，孚于嘉，吉。\n《易林》每以震为嘉，盖本此也。嘉指二。五孚于二，二震体，故曰孚于嘉。\n象曰：孚于嘉，位正中也。\n二五皆当位，故曰正中。\n上六，拘系之，乃从维之。王用亨于西山。\n伏艮为拘，为山。兑西，故曰西山。兑口，故曰享。王谓五。三至上正反巽，巽为绳，故曰系，曰维。虞翻曰：两系称维（正反两巽 ）。《诗》所谓絷之维之也。卦以随为义，六穷于上，五恐其去，拘系之，从维之，或即其隐居之处而宴享之。言六无所随，而五必随之也。（《西溪易说》云：先儒说《易》，遇西山、西邻，皆曰文王事也。可谓大谬。 ）\n象曰：拘系之，上穷也。\n穷，尽也。","18":"蛊卦第十八\n蛊，元亨，利涉大川。先甲三日，后甲三日。\n《左传》，皿虫为蛊。而《归藏》作蜀。《诗·豳风》：蜎蜎者蠋。蠋，葵中蚕也。《诗诂》蜀已有虫，再加虫，俗字。然则蜀亦虫，与蛊义同也。蛊，败也，坏也。卦上山、震木，为材木之所出；乃下卦为巽，巽陨落，故败。又巽为虫，虫蠹物朽腐。《大过》曰：栋桡。《易林》旅之履云：木内生蠹。蠹即蛊。皆以巽也，故坏。《礼·王制》：执左道以乱政。疏云：蛊者损坏之名。《周礼·秋官·庶氏》：掌除毒蛊。郑注：毒蛊，虫物而病害人者。又《翦氏》：掌除蠹物，凡庶蛊之事。注：蛊，蠹之类。又《史记》：秦德公二年，初伏，以狗御蛊。注：蛊，恶气。是蛊之为蠹、为腐坏甚明。又《左传》云：女惑男，风落山，谓之蛊。女惑男，男败；风落山，山败。亦以败坏说蛊。荀爽谓蛊为事。朱子盖以为不安，又曰坏极而有事。夫卦名皆由卦象而生，诂蛊为事、为惑，皆正训不误。而此则义为败坏，亦卦象所命也。《彖》曰巽而止蛊，亦以败坏为说。若必拘《序卦》而训为事，则此句义难通矣。阳得阴则通。坤为大川，为事，刚往坤上，下履重阴，容民得众，故曰利涉大川，曰往有事。乾元为甲，《蛊》之先为《泰》，乾为日，三爻故曰先甲三日。乃由《泰》反《否》而《蛊》为之始，初爻上为《蛊》，二三随上成《否》，甲之在下者反上，先甲变为后甲矣，故又曰后甲三日。《蛊》旁通《随》，《随》者由《否》反《泰》之始，上爻下成《随》，四五随下成《泰》，甲之在上者反下，后甲又变为先甲矣。否泰相循环相终始，来往诎信，天道固如是也。\n彖曰：蛊刚上而柔下，巽而止蛊。蛊元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。\n行，道也。《泰》者《随》之终，《蛊》者《否》之始，故曰终则有始。\n象曰：山下有风，蛊；君子以振民育德。\n风止山下，气郁不通，故蛊。蛊则不生育。振而作之，所以救蛊而育德也。象义有因卦象而取法者，有反省者。兹则反省者也。\n初六，幹父之蛊，有子考，无咎，厉终吉。\n初虽不当位，然上承重阳，与上合志，与《升》初六同，故吉。《易林》以震巽为父母（详《焦氏易诂》 ），朱汉上以《复》、《姤》为小父母。《复》、《姤》仍震巽。初伏震，故曰父，曰子。幹，正也。能正父蛊，故曰有子考。《逸周书·谥法》云：考，成也。《左氏》襄十三年祢庙疏：考，成也。言有成德也。有子考者，即谓有子能成就先业也，故无咎。风陨故厉，承阳故终吉。马融、王肃读考字绝句。王注作考无咎，非也。\n象曰：幹父之蛊，意承考也。\n意承考，谓初上承重阳，能承继先德也。承，顺也。巽象。\n九二，幹母之蛊，不可贞。\n巽为母。贞，定也。不可贞，言二宜升五也。\n象曰：幹母之蛊，得中道也。\n二五得中。\n九三，幹父之蛊，小有悔，无大咎。\n三震体，故亦曰父。按九三上虽无应，然当位，前临重阴，与《大畜》九三象同，当吉。乃《大畜》九三利往，此云小悔无大咎者，以体下断也。凡巽体上爻多不吉，先儒不知其故在本弱，故多误解。\n象曰：幹父之蛊，终无咎也。\n九三前临重阴，利往，故终无咎。\n六四，裕父之蛊，往见吝。\n裕，宽也。虞云：不能诤父过也。前遇敌，阴遇阴则窒，故往吝。\n象曰：裕父之蛊，往未得也。\n六五，幹父之蛊，用誉。\n得中有应，上承阳，而艮为名，故可致闻誉。\n象曰：幹父用誉，承以德也。\n德谓阳。承以德，言上承阳也。\n上九，不事王侯，高尚其事。\n三震为王，为诸侯，上不应之，故曰不事王侯。言不事王侯之事也。高居物表，逍遥事外，故曰高尚其事。\n象曰：不事王侯，志可则也。\n则，法也。不事王侯，若共伯和、吴季札之流是也。作奉事者非。","19":"临卦第十九\n临，元亨利贞，至于八月，有凶。\n《释诂》：临，视也。《穀梁》哀七年：有临天下之言焉。注：临，抚有之也。卦以震君临四阴，正抚有也，故曰临。《临》辟丑，阳息卦，故曰元亨。《左传》云：不行之谓临。行而不已，则至八月而凶矣。故又曰利贞，言利于贞定也。月卦始子《复》，至未《遯》正八月，故郑、陆、虞皆以八月为《遯》。而虞氏以弑君父说凶义则非。弑君父皆《否》、《遯》所同有，胡独八月凶乎？按《易林》恒之临云：神之在丑，破逆为咎。不利西南，商人休止。《临》辟丑，震为神，故曰神之在丑。乃行至未而破丑，故曰破逆为咎。又按《汉书·翼奉传》：平昌侯三来见臣，皆以正日加邪时。孟康曰：谓乙丑之日。丑为正，日加未而来，未破丑，故曰邪时。陆绩《易传》至于八月凶注曰：建丑至未也，入《遯》。亦以未破丑说凶义。徒以弑君父为说，何以解于其他消卦乎？凡《易》言八月、七日，皆言爻数。后儒往往以殷正周正为说，皆梦呓语也。\n彖曰：临，刚来浸而长，说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。\n《遯》消卦，故曰不久。\n象曰：泽上有地，临；君子以教思无穷，容保民无疆。\n震兑皆为言，故曰教思无穷。坤为民，震为仁，故曰容保民。坤广大，故曰无疆。\n初九，咸临，贞吉。\n咸，感也，初二爻皆有应，故皆曰咸临。贞，卜问也。\n象曰：咸临贞吉，志行正也。\n坤为志。应在坤，皆当位，故曰志行正。\n九二，咸临，吉，无不利。\n阳遇阴则通，故曰无不利。\n象曰：咸临吉无不利，未顺命也。\n二必升五，得尚于中行。而卦以不行为义，故曰未顺命。\n六三，甘临，无攸利。既忧之，无咎。\n《说文》：甘，美也。三独近二，阴顺阳，言甘于顺二也。然不当位，无应，故无所利。坤为忧。知无所利而忧之，故无咎也。\n象曰：甘临，位不当也。既忧之，咎不长也。\n不长，谓不久。\n六四，至临，无咎。\n虞翻曰：至，下也。谓下应初。当位有实，故无咎。\n象曰：至临无咎，位当也。\n六五，知临，大君之宜，吉。\n知音智，言宜知几也。震为大君（象失传，详《焦氏易诂》 ）。九二震主爻，应在五，二五相上下，皆当位，故曰大君之宜。言二宜升五也。\n象曰：大君之宜，行中之谓也。\n二五皆中位，故曰行中。知临者，言宜知几，与二相上下也。\n上六，敦临，吉，无咎。\n阳息即至三，上稍止即有应，故曰敦临。敦与屯、与顿皆通，有止意、待意。义详《复》卦。言稍待即有应，故曰志在内。内谓三也。故《复》六五亦曰敦复，言五少迟，阳即息至二有应，与此同也。旧解训敦为厚，非。\n象曰：敦临之吉，志在内也。\n言顿止之故，因阳息即至三，有应也。《易》之道贵将来，将来有应，故吉。不然内无应，何吉之有？凡云志在内、志在外者，皆谓应爻。《九家》谓志在二升五，清儒皆宗之，由误解敦字故也。","20":"观卦第二十\n观盥而不荐，有孚颙若。\n五得尊位，下临万民；艮为庙堂，万民瞻仰，故曰观。《易林》以艮为观，为视（象失传，详《焦氏易诂》 ），盖即本此也。国之大事，在祀与戎。礼之可观，莫盛乎宗庙。宗庙之可观，莫盛乎祭祀。初盥，降神也。马融云：进爵灌地以降神也。卦巽为白茅，茅在地上，坤水沃之，缩酒之象也。灌地降神，其诚敬之心，孚于神明。颙，敬也。及至荐牲则礼简略。孔子曰：禘自既灌而往者，吾不欲观之矣。与此义同也。\n彖曰：大观在上，顺而巽，中正以观天下。观盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒。圣人以神道设教，而天下服矣。\n坤为天下。天下化则服矣，此圣人所以以神道设教也。《观》亦候卦，故曰四时。《临》曰元亨利贞，亦四时也。\n象曰：风行地上，观；先王以省方观民设教。\n坤为方、为民，艮为观，故曰省方，曰观民。巽为命，故曰教。先王巡狩四方，观风问俗，宣布教化，亦若风行地上也。\n初六，童观，小人无咎，君子吝。\n《释文》：马云童犹独也，郑云稚也。而虞翻以艮为童，诂与郑同。按马说是也。《太玄·玄冲》云：童寡有也。而《易林》每以坤为寡。初坤体，上无应，阴遇阴失类，孤寡极矣，故曰童观。其在小人，独行踽踽，尚可无咎；若君子则狭隘为病矣，故吝。盖童之象不在艮，而在坤。初何以孤寡？则以上无应而行失类也。\n象曰：初六童观，小人道也。\n道，行也。\n六二，窥观，利女贞。\n《说文》：窥，闪也。倾头门中视也。二应五，坤为门。二在门中，上窥九五，而坤为闭为羞，故羞缩不敢正视而窥观也。圣人取象之精，非注视卦象，不知其微妙如此也。窥观乃妾妇之行，故利女占。若在丈夫，则可丑矣。\n象曰：窥观女贞，亦可丑也。\n丑谓不庄。\n六三，观我生，进退。\n凡我生皆谓应与。《诗·小雅》：虽有兄弟，不如友生。《易》以阴阳相遇为朋友，故谓应与为我生。三应在上，故曰观我生。进退，上巽为进退。进退者上下也，三与上相上下。谓三宜进居上，上宜退居三，各当位也，故《象》曰不失道。\n象曰：观我生进退，未失道也。\n道，行也。\n六四，观国之光，利用宾于王。\n艮为国，为光。四独近五，故曰观国之光，曰宾于王。王谓五，巽为利。言利于朝觐天子，作宾王家也。巽为旅客，故曰宾。\n象曰：观国之光，尚宾也。\n尚宾者，言宾于上也。\n九五，观我生，君子无咎。\n此我生谓二。五应在二，二坤为民，故《象》曰观民。九五为《观》之主，亦艮之主。艮为君子，下观万民，抚恤教养，故无咎也。\n象曰：观我生，观民也。\n观民即指二，二坤为民。\n上九，观其生，君子无咎。\n诸家或释生为出、为性、为道，一人前后，诂即不同，似非。按，其谓五，生指三。上应在三，三坤体，坤民下附，皆五之民也。上贵而无位，高而无民，宜高尚其事矣；乃犹不忘情，欲应三而观其生焉，故《象》曰志未平。\n象曰：观其生，志未平也。\n巽为志。","21":"噬嗑卦第二十一\n噬嗑，亨，利用狱。\n噬，啮也；嗑，合也。亨，通也。夫上下之不能相合者，中必有物间之；啮而去其间，则合而通矣。国家之有刑狱，亦复如是。民有梗化者，以刑克之，则顽梗去而上下通矣，故曰利用狱。震为口，《颐》利求口实是也。为口故曰噬。雷电合居于东，故曰合而章。震为口，初至四正反震口合，上离正反兑口合，故曰噬嗑。自覆象失传，及震为口之象亡，噬嗑之义遂晦而不明。卦一阴一阳，刚柔交，故曰亨。坎为狱。折狱之道，不明则人不服，不威则众不从，今威明并济，故利。\n彖曰：颐中有物曰噬嗑，噬嗑而亨。刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，利用狱也。\n有物谓四。四在《颐》中，故曰有物。《颐》上下阳，中四爻皆阴，阴顺阳，故求得口食。今四阳横互于中，阳遇阳为仇为敌，不顺；啮去此物，则合而通，故曰噬嗑而亨。卦阳爻与阴爻相间，故曰刚柔分。雷电合居于东，故曰合而章。五不当位，然文明以中，断制枉直，不失情理，故利用狱也。\n象曰：雷电，噬嗑；先王以明罚敕法。\n罚、法皆坎象。敕，正也，威之用。明则离之用也。\n初九，屦校灭趾，无咎。\n震为趾，坎为校。初临重阴，利往；往而遇坎，坎在震上，故曰屦校。校，械也。屦，贯也。言以械贯于震足之上，足不见，故曰灭趾。初当位，故无咎。\n象曰：屦校灭趾，不行也。\n此言人初有过，其过尚微，故罚亦从轻，使有所惩，而不至积累其罪，以至于诛。所谓小惩大戒也。初本利行，行而遇险，故不行。\n六二，噬肤灭鼻，无咎。\n震为噬。二艮体，故曰肤，曰鼻。言艮肤艮鼻，为震口所噬。隐伏于坎水之下，故曰灭。二乘刚，故有是象。按灭趾有类于刖刑，灭鼻有类于劓刑。皆初犯罪，刑之轻者，皆冀其有所惩于后也。二得中，故可免于咎。\n象曰：噬肤灭鼻，乘刚也。\n乘刚不顺。\n六三，噬腊肉，遇毒。小吝，无咎。\n《说文》：腊，乾肉也。艮坚故曰腊。坎为肉，故三爻四爻五爻皆言肉。坎为毒，遇毒者，坎在前也（坎肉象，详《焦氏易诂》 ）。然有应，故小吝，无咎。王弼曰：噬以喻刑人，腊以喻不服，毒以喻怨生。按三不当位，以斯用刑，民必不服；岂惟不服，怨毒以生。言小民不知惩戒，仍积恶不悛也。\n象曰：遇毒，位不当也。\n三阳位。\n九四，噬乾胏，得金矢。利艰贞，吉。\n胏，《玉篇》：肉带骨也。离艮皆为火，坎肉居中，故曰乾胏。艮为金，坎为矢（详《焦氏易诂》 ）。四艮主爻，故曰金。亦坎主爻，故曰金矢。坎陷，故利艰贞。按《周礼·大司寇》：以两造两剂，禁民狱讼，入束矢钧金，然后听之。兹云得金矢，仍寓止讼之意。夫令民入金矢，原欲止其狱讼，兹曰得金矢，是讼者不止，而益深其罪也。\n象曰：利艰贞吉，未光也。\n坎隐伏故曰未光，升五则光矣。\n六五，噬乾肉，得黄金。贞厉，无咎。\n离火，故仍曰乾肉。离色黄，五履艮金上，故曰得黄金。贞，卜问。失位，故贞厉。得中，故无咎。按五位虽尊，然不当位。以斯噬物，物亦不服，其坚有如噬乾肉之难。夫据尊位，能行其戮者也，乃物仍不服，不知诫惧，则其怙恶不悛，顽坚难化也明矣，故曰得黄金，言其坚愈进也。得黄金非吉辞，如吉则下不曰贞厉矣。\n象曰：贞厉无咎，得当也。\n得当者，得中也。\n上九，何校灭耳，凶。\n坎为校，为耳。上应在三，三坎体亦艮体，艮为背为何。坎校在艮背上，耳则遮矣，故曰灭耳。《易》爻在此，而象全在应者，此其一也。王弼曰：处罚之极，恶积不改者也。罪非所惩，故刑及其首。及首非诫，灭耳非惩，凶莫甚焉。《正义》曰：罪未及首，犹可戒惧归善；罪已及首，性命将尽，非复可戒，故云及首非戒也。校既灭耳，将欲刑杀，非可惩改，故云灭耳非惩也。\n象曰：何校灭耳，聪不明也。\n灭耳则有害于聪，故曰不明。","22":"贲卦第二十二\n贲，亨，小利有攸往。\n《归藏》作荧惑。荧惑，火星。《史记》：察刚气以处荧惑，曰南方火，主夏日，丙丁是也。卦上艮为星，离亦为星；下离为火，艮亦为火。离主夏位南，艮纳丙亦南，故曰荧惑，于象恰合。至《周易》作贲。贲，《释文》云：傅氏作斑，文章貌；郑云，文饰貌。《太玄》拟作饰。按卦一阴一阳相杂，相杂则有文，故曰斑，曰文饰。又按《尔雅》：龟三足曰贲。卦离、艮皆为龟，而震为足，数三，正龟三足也。初、二曰其趾、其须，九三云濡如，六四云皤如，言其形也。上九云白贲，言其色也。《杂卦》云：贲无色也。艮为黔，坎为隐伏、为黑，亦无色，无色即不明。不明，故《象》言无敢折狱。盖山下有火，与地下有火略同。地下有火明夷，山下有火等耳。故孔子筮得《贲》不乐，以与《明夷》同也。后人谓山下有火，明不及远，皆读下为旁，故其义永不能通。前一义旧解从之，后一义鲜有述之者。故引信其义，以俟深于易理者定夺焉。\n亨谓二。离夏故亨，《传》所谓柔来文刚也。小谓五。分《泰》二居上，五得中承阳，故曰小利有攸往。言利往五也。唐郭京举正，谓小为不，非。\n彖曰：贲亨，柔来而文刚，故亨。分刚上而文柔，故小利有攸往。天文也。文明以止，人文也。观乎天文以察时变，观乎人文以化成天下。\n卦刚柔相杂，故曰文。离日坎月，艮星震辰，天文。离礼震乐，人文。离夏震春坎冬，故曰以察时变。震为生，艮为成、为天，故曰化成天下。朱子云：先儒说天文上，当有刚柔交错四字。\n象曰：山下有火，贲；君子以明庶政，无敢折狱。\n山下非山旁。火在山下，与地下同，直明夷耳。后儒谓明不及远者误也。艮为君子。明庶政，象每以相反见义，如《同人》曰类族辨物，《无妄》曰时育万物，《蛊》曰振民育德皆是。兹因《贲》不明，君子反以明庶政。坎为狱。折狱须明，离在下不明，故无敢折狱。而无敢折狱，尤《贲》为无色无明之确征。\n初九，贲其趾，舍车而徒。\n初应在四，四震故曰趾。坎为车，初在车下，当然不乘而徒也。盖初九正当勿用之时，安于徒步，以遂其志者也。\n象曰：舍车而徒，义弗乘也。\n徒谓徒步。义弗乘者，言志行高洁，不肯苟乘也。\n六二，贲其须。\n艮为须（象失传，详《焦氏易诂》 ）。艮须在上，下离文之，故曰贲其须。其，指上卦。言六二之须，谓上艮也。《泰》二往上成艮，故曰兴。二因得当位居中，故曰与上兴。侯果谓三至上有颐象，二在颐下，故有须象。虽巧切，不知艮即为须也。\n象曰：贲其须，与上兴也。\n兴，起也。与上兴，即喜上兴也。\n九三，贲如濡如，永贞吉。\n坎水，故曰濡如。阳贞于三当位，前临重阴，故曰永贞吉。\n象曰：永贞之吉，终莫之陵也。\n之，往也。三应在上，上艮为陵。乃上不应，故终莫之陵，永贞于三吉也。又前临重阴，皆顺三，无有陵越之患也。\n六四，贲如皤如，白马翰如，匪寇婚媾。\n《左传》宣二年：皤其腹。疏：皤，腹貌。卦三至上互大离，离为大腹，故曰皤如。《释文》：皤，荀作波；郑、陆作蟠，音烦。按皤通番，番音烦，郑、陆读烦声是也。凡《易》如此等辞，往往用韵，疑番与翰协。《诗·大雅》：申伯番番，徒御啴啴，戎有良翰。番与翰协，与此同也。陆绩云：震为白，为马。按震为羽翰（翰象失传，详《焦氏易诂》 ）。翰如马行貌，言疾如羽翰也。四乘坎，坎为寇，疑其逼己。岂知四当位，下有正应，三无能害之，终得与初婚媾也。\n象曰：六四当位，疑也。匪寇婚媾，终无尤也。\n疑谓疑三。坎为疑。\n六五，贲于丘园，束帛戋戋。吝，终吉。\n艮为丘园。坤为帛，乾圜约其两端，故曰束帛。《子夏传》：五匹为束。三玄二 ，象阴阳。戋戋，马训为委积，虞作多。《易林》旅之丰云：束帛戋戋，赙我孟宣。似亦以盛多为训。俗解因戋通残，便训戋戋为薄物，又或作残落者，非也。《仪礼·士冠》、《士虞礼》，《周礼·大宗伯》注，皆以束帛为十端，每端丈八尺，两端合卷，总为五匹。皆与《子夏传》同。然则束帛五匹者，乃先王之定制。戋戋乃形容束帛之盛，谓薄物固非，残落尤谬也。下无应，故吝。上承阳，故终吉。《彖》谓小利往，以此。\n象曰：六五之吉，有喜也。\n五承阳，故有喜。\n上九，白贲，无咎。\n贲而曰白，其为物也明矣。若训为饰，为文，为斑，为黄白色（范望《太玄》视首上九注 ），为色不纯（高诱《吕览》贲字注 ），此二字皆不能通。诸儒据绘事后素，曲为之说，无当也。盖艮为贲，贲无色，故曰白贲。\n象曰：白贲无咎，上得志也。\n下乘重阴，故曰得志。言阳得阴而通也。《大畜》上九曰道大行也，《损》上九曰大得志，《益》九五曰大得志，《颐》上九曰大有庆，与此义皆同。乃二千年旧解，少能知其故者，真可喟也。","23":"剥卦第二十三\n剥，不利有攸往。\n《剥》候卦，时当九月，阴消阳，柔变刚。《杂卦》云：剥，烂也。盖阴消阳，柔变刚，皆以渐而及，非猝然为之，有似于树木老皮之剥落。《归藏》作仆。仆与扑通。《庄子·人间世》：蚊虻仆缘。仆缘即扑缘。扑，击也。而《豳风》：八月剥枣。《传》：剥，击也。是仆与剥义同也。不利有攸往，谓阴不宜再长也。《传》曰：小人长。阴长则阳消，故往不利。\n彖曰：剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。\n艮为视，为观（象失传，详《焦氏易诂》 ）。观卦，即顺而止。今一阳在上，下观群阴，仍观象也。《剥》本消卦，然相对者必息。一消一息，一盈一虚，天道循环本如此，不足异也。\n象曰：山附于地，剥；上以厚下安宅。\n上谓上九。坤为厚，为下。艮为宅，为安。\n初六，剥床以足 （句 ） ， 蔑 （句 ） ， 贞凶。\n初震位，故曰足。以，及也。《周语》：太宰以史祝。《管子·服制》：官吏以命士。《盐铁论·大论篇》：呻吟槁简，诵死人之语，则有司不以文学。以义皆同及。剥床以足，即剥床及足也。艮为床。《易林》比之贲云：展转空床，内怀忧伤。以《贲》艮为床也。《剥》全体艮象，故屡言床。虞翻不知此象，以坤消乾初，成巽为床。而惠栋又谓巽为木，坤西南卦，设木于西南奥，乾人藉之，床之象也。故夫一象之失传，可使名家《易》，迂曲至于如此，真可叹也！蔑，《释文》云：荀作灭。《象》曰灭下，盖荀之所本。王陶庐云：蔑、灭古通。《周语》：而蔑其人民。《文选·邻里相送方山诗》：音尘慰寂蔑。注皆作灭。故王注云：犹消也。惟灭属下读，似难为句。灭，《说文》：尽也。剥床以足蔑者，言床足被剥尽也，故卜问凶。虞翻下属为句，训为无，谓初失位，故曰蔑贞。谓失正也。然二爻当位，亦曰蔑贞，则不合矣。而清易家多从之，非。\n象曰：剥床以足，以灭下也。\n灭下，即释蔑义。\n六二，剥床以辨 （句 ） ， 蔑 （句 ） ， 贞凶。\n《释文》云：辨，徐音办具之办，足上也。马、郑同。薛虞云：膝下也。王弼亦云足上。按马、郑、王等似皆以二在初上，故云足上。虞翻谓为指间。王引之读为蹁。蹁，膝头也。俞樾谓辨通胖。胖，胁侧也。似皆未安。按《周礼·天官·小宰》：六曰廉辨。注：杜子春云，廉辨或作廉端。故贾疏云经本作廉端。是辨、端音近通用。端，首也。剥床以端，是剥及床头也。剥之而尽，故贞凶。\n象曰：剥床以辨，未有与也。\n未有与，言上无应。\n六三，剥，无咎。\n《释文》：一本作剥之无咎，非。按之字，乃从象辞而衍，无者是也。三处五阴之中，独能从善，不党于上下二阴，故曰失上下。\n象曰：剥之无咎，失上下也。\n六四，剥床以肤，凶。\n四艮体，艮为肤，故曰剥床以肤。足、辨、肤，皆指床言，肤犹言床面也。人卧床，身与床切，剥及于是，故言近灾。自王肃以肤指人身言，岂知剥及人身，则灾及矣，胡得曰近？乃后儒惑之，谓床不能称肤。王引之谓：王弼云剥床之足、剥床之辨，下文亦可曰剥床之肤乎？夫床既可曰足，曰辨，又何不可称肤？似皆惑于肃说，故拘泥若是。\n象曰：剥床以肤，切近灾也。\n六五，贯鱼以宫人宠，无不利。\n坤为鱼（象失传，详《焦氏易诂》 ），除《易林》外，后唯郭璞知之。《洞林》：璞筮迁徙，得《明夷》，曰：嗟呼黔黎，时漂异类；桑梓之邦，其为鱼乎。《明夷》上坤为鱼、为邦，震为桑梓，故曰桑梓之邦，其为鱼乎。《剥》重坤，故曰贯鱼。艮为宫，为宠。以宫人宠者，《周礼·九嫔》注云：女御八十一人当九夕，世妇二十七人当三夕，三夫人当一夕。是天子之宫人进御，每夜九人或三人，故曰贯鱼以宫人宠。言宫人之宠御，以次而进，若贯鱼也。即五率群阴以承阳，鱼贯而进也。《诗·邶风》：宴尔新婚，不我屑以。笺：以，用也。以宫人宠，即用宫人宠也。《蒙》之用说桎梏，《益》之利用为依迁国，皆与此以字义同也。此与《豫》九四之朋盍簪，皆为易象之最神妙，而最难于形容者。王陶庐云：《易》辞有非注视卦象不能解者。此等是也。而二千年来，因簪象、鱼象之失传，遂改簪为戠、为攒，以求与坎象合；命《剥》五变巽，以求与鱼象合，而易理遂亡于解说矣。杜甫云：盍簪喧枥马。鲍照云：鱼贯度飞梁。皆此二句之确诂。而杜诗尤非真知《易》者，不敢如此道也。（宋蔡弼注杜诗，遂误为宴朋友。 ）\n象曰：以宫人宠，终无尤也。\n五得承阳，故无尤悔。\n上九，硕果不食，君子得舆，小人剥庐。\n艮为果蓏。硕，大也。孤阳在上，故曰硕果。震为食，震覆故不食（震食象失传，详《焦氏易诂》 ）。卦一阳未消，剩余在上，是其义也。艮为君子，坤为大舆、为载。艮在坤上，乘舆之象也，故曰得舆。坤为小人，艮为庐。候卦阴终消阳，故曰剥庐。君子得舆，由上视下取象。小人剥庐，由下视上取象。\n象曰：君子得舆，民所载也。小人剥庐，终不可用也。\n坤为民，艮为终。","24":"复卦第二十四\n复，亨。出入无疾，朋来无咎；反复其道，七日来复。利有攸往。\n阳反，故曰复。出入反复，皆对《姤》言。《复》者《姤》之反，若舍《姤》不言，则《复》何所自乎？入者入巽，出者出震。坤为疾（象失传，详《焦氏易诂》 ）。阳通故无疾。阴以阳为朋，《剥》穷上反下，故曰朋来。阳遇阴，故无咎。阳自《姤》而消，消至《剥》上，六日，反《复》则七日。自《复》而息，息至《夬》上，六日，反《姤》仍七日。循环不已，故曰反复其道，七日来复。《复》阳长，故曰利有攸往。\n彖曰：复亨，刚反。动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎！\n震动坤顺，故曰动而以顺。天行，天道也。言阴阳刚柔往来消长，天道固如斯也。此天地之心也。坤为心（象失传，详《焦氏易诂》 ）。此以爻数括天地间之公例公理。其谓卦气起《中孚》，至《复》为七日，不惟于数不合（只六日七分 ），且于理大谬。是皆执于自《姤》至《复》为七月，经言七日，故疑也。岂知《易》辞皆举一例，包括万有（十日数至七必相反，辰数亦然 ）。即以日言，《豳诗》云：一之日，二之日。日皆谓月，侯果已言之矣。阴阳相遇为朋。自此象失传，皆用卦变，俟阳息至二成兑，二阳为朋，虞氏之说讹误至今。\n又《五行志》：《京房易传》曰，《复》崩来无咎。读朋为崩。是用覆象，谓《剥》艮覆在下为山崩。而《易林》遇此象，亦往往曰山崩。京所受也。其详皆在《焦氏易诂》中。覆象久失传，后惟惠栋用此说。实《易》言覆象者，不止此也。\n象曰：雷在地中，复；先王以至日闭关，商旅不行，后不省方。\n曰至日，则兼二至言也。《姤》云：施命诰四方。即诰戒商旅将闭关也。《易林》晋之解，所谓二至之戒也。盖古最重二至。《汉书·薛宣传》：日至休吏，所繇来久。《后汉·鲁恭传》：《易》五月《姤》用事，先王施命令止四方行者。是夏至亦休息，与冬至同。坤为门户，故曰关。震为商旅。坤闭，故曰闭关，曰不行。坤为方，震为王。\n初九，不远复，无祇悔，元吉。\n复在内，故曰不远复。严元照云：祇从氐，非，此当从氏。氏、是同用，故王肃作禔。《坎》祇既平，京房亦作禔。王陶庐云：《唐石经》即作祇。氏、是古同部，故得同用。若氐则另为一部，不同部者不相假，古之例也。然则今作祗者误也。祇，郑云病也。段玉裁云：郑盖借祇为疧。按祇之训病，《诗·小雅·何人斯》：壹者之来，俾我祇也。《毛传》：祇，病也。兹训为病，正本《毛传》。段谓借祇为疧，非。病犹灾也。《复》出入无疾，故无灾悔。乾元通，故元吉。\n象曰：不远之复，以修身也。\n坤为身。阳微，故宜修养以待。\n六二，休复，吉。\n休者，俟也。俟阳息至二，故吉。\n象曰：休复之吉，以下仁也。\n仁者，初也。阳主生，故曰仁。以下仁者，言下阳即息至二，静俟则吉也。\n六三，频复，厉，无咎。\n虞翻曰：频蹙也，三失位，故频复。按频古文颦字，故云频蹙。三失位，承乘皆阴，又无应予，失类极矣，故频复厉也。知其危厉而振奋焉，则无咎矣。\n象曰：频复之厉，义无咎也。\n六四，中行独复。\n《文言》乾九四云：中不在人。中谓三四，居一卦之中也。又《系辞》云：其初难知，其上易知；若夫杂物撰德，非其中爻不备。中爻谓中四爻，即下所谓二与四、三与五也。四居卦中，独与初应，故曰中行独复。虞翻谓四不在二五，何得称中行？岂知三四称中爻，《易》固有明例也。\n象曰：中行独复，以从道也。\n道谓初，从道谓应初。\n六五，敦复，无悔。\n敦与屯通。《诗·大雅》：铺敦淮 。笺：敦当作屯。扬雄《甘泉赋》：敦万骑于中营兮。注：敦与屯同。又按《豳风》云：敦彼独宿。即屯彼独宿也。屯者止也，次也。而敦又与顿同。《尔雅·释丘》：丘一成为敦丘。疏：即《卫风》之顿丘。顿亦止也。《史记·王翦传》：三日三夜不顿舍，是也。是敦有止意、待意。敦复者，言五应在二，阳即升二，五稍待即有应也。故《临》上六亦曰敦临，以上六亦稍待，阳即息三，有应也。旧诂皆训为敦厚，非。\n象曰：敦复无悔，中以自考也。\n向秀曰：考，察也。五中位，应在二，亦中位；阳息即至二，五有应，故无悔。中以自考者，释敦之故。《易》之道贵将来，言顿止以待中二之阳息，自考省也。与《临》上之志在内义同。\n上六，迷复，凶，有灾眚。用行师，终有大败。以其国君凶，至于十年不克征。\n凡上六多不吉。上穷也，坤为迷、为死丧，故有灾眚。坤为众，故为师。坤为死丧，故行师终有大败。坤为国，震为君（象失传，详《焦氏易诂》 ），故曰国君。坤为十年，震为征。不克征，言不能兴起也。《比》上六后夫凶，《师》上六小人勿用，皆以其不承阳也（他爻皆可承阳，独上六不能 ）。不承阳则背叛君命，而殃及国君，故曰以其国君凶。君者国之本，国君受胁，根本动摇，故其凶至于十年也。\n象曰：迷复之凶，反君道也。\n反君道，即谓上六不承阳。旧解皆以不顺君命为反君道，然上六之何以独反君道，其故无能明者。此与六五敦复，及《临》之敦临义晦同也。","25":"无妄卦第二十五\n无妄，元亨利贞。其匪正有眚，不利有攸往。\n震、巽为草木、为禾稼，下艮为火，故焦、京、王充皆以无望为大旱之卦。而乾为年，巽为入，年收失望，故曰无妄。元亨者，谓乾元通也。初当位，前临重阴，五中正，故乾元以通。利贞者，利于贞定也。正亦定也。匪正谓三上，三上不当位，妄动，故有眚。眚，病也。巽为疾病。其匪正有眚者，言不能贞定而躁动，即有眚也。不利有攸往，仍以动为戒也。震为决躁。躁动于内，外与刚健遇，必无幸矣，故曰不利有攸往。妄，《释文》云：马、郑、王肃皆作望，谓无所希望也。按此训最古。《史记·春申君传》云：世有毋望之福，又有毋望之祸；今君处毋望之世，事毋望之主。是自战国即读为望。《归藏》作毋亡。亡，古文妄之省。王陶庐云：妄、望同音相借。《大戴礼·文王篇》：故得望誉。望誉即妄誉。史迁受《易》于杨何，固无误也。又按《杂卦》云：无妄灾也。故《太玄》拟无妄为去。《汉书·谷永传》：遭无妄之卦运。应劭云：天必先云而后雷，雷而后雨，今无云而雷；无妄者无所望也，万物无所望于天，灾异之最大者也。《后汉·崔篆传》：值无妄之世。王充《论衡》：《易》无妄之应，水旱之至。蔡邕《邓皇后谥议》：消无妄之运。举两汉之人，无作虚妄及失亡解者。无妄，犹《孟子》所谓不虞也。六爻爻辞皆不虞之事。又无妄灾也，以艮火象失传之故，皆莫知灾之自来。而焦、京以无妄为大旱（《易林》屡见，详《焦氏易诂》 ）之卦，其故自荀、虞莫明矣。（卞斌云：匪正宜作匪贞，经无作正者。 ）\n虞翻知巽为禾稼，而不知艮火象，故不知大旱之义，斥京氏为非，诂为亡失，不亡失则卦吉矣。然何以解于《杂卦》之无妄灾及《彖传》？《彖传》曰：无妄之往，何之矣？天命不佑，行矣哉！《无妄》若为吉卦，而曰天命不佑，曰无所往，有是理乎？虞翻最忌郑学，郑作望故驳之。其所谓俗儒，殆即指郑。（后崔憬、何妥竟作虚妄解，益与《传》背。世岂有忠信之人，天命不佑，往无所合者哉？害理乱道，莫斯为甚。 ）\n彖曰：无妄，刚自外来，而为主于内。动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往，无妄之往，何之矣？天命不佑，行矣哉！\n震为主，谓初也。先儒谓《遯》上来初，故曰自外来。震为躁卦，躁动于内，而外遇乾刚，故所之不合。五刚中，二有应，故曰刚中而应。大亨者，元亨也。以正者，利贞也。元亨利贞，循环来往，天命固如斯也。乾为天，巽为命也。《临》传云：大亨以正，天之道也。天命与天道同也。故时当元亨而动，时当利贞即不宜动。不宜动而强动，违天者也。违天而行，天所不福。佑，福也。何之者，言时值无望，无往而可也。盖《易》之旨，阳刚不宜在外，在外则气穷，有阳九之厄。故卦辞以行为戒，以贞定为主。\n象曰：天下雷行，物与无妄；先王以茂对时育万物。\n与，举也。天下雷行，万物震恐，举失其求望。茂与懋通，勉也。对，答也。言因雷而勉答天威。傅亮文云：祇服往命，茂对天休。潘岳《秋兴赋》：览花莳之时育兮。是茂对连文，时育连文，古读如是。《释文》作茂对时，非也。艮为时，震、巽皆为草莽，而震为生，故曰时育万物。即严畏天命，顺时育物也。《象》有以相反为义者，如《蛊》曰振民育德，《剥》曰上以厚下安宅，《明夷》曰用晦而明，及此皆是也。虞仲翔不知此旨，据《象》言时育，证万物皆死之非。审如是也，将《蛊》曰振育，亦可谓之不蛊；《剥》曰安宅，亦可谓之非剥，尚可通乎？\n初九，无妄，往吉。\n阳遇阴则通，故往吉。\n象曰：无妄之往，得志也。\n得志，谓往遇二阴也。《大畜》九三云：上合志。《涣》九二云：得愿。上皆无应，皆以前遇二阴。虞翻不知此为《易》不刊之定理，命四爻变阴，初得应，释得志。清儒从之，讹误至今。\n六二，不耕获，不菑畬，则利有攸往。\n获，《说文》：刈谷也。《诗·小雅》：于此菑亩。疏：菑，灾也。始灾杀其草木也。故《说文》云：不耕田也。畬，《说文》：三岁治田。《诗·周颂》：如何新畬。《传》：一岁曰菑，二岁曰新田，三岁曰畬。《尔雅》同。独郑康成及虞翻谓田二岁曰畬（皆以在二爻 ）。岂知《诗》明曰新畬，是第一年菑田，第二年便为新田，然尚未柔和也，故第三年为畬田。观《诗》不曰畬新，而曰新畬，郑、虞误也。盖二居艮震之间，震为耕、为菑；乃前遇艮，艮止，故不耕不菑。艮手为获，艮成终，为畬。不耕而获，不菑而畬，为必无望之事，故《象》以未富为释。据《坊记》引，则，为凶字。又据《说文》引，畬下多田字，段玉裁以为即凶之形讹字。然则，则为凶字无疑。乃王注谓不耕而获，不菑而畬，只代终，不造始，臣道固如是也，故利往。如王诂，是亦获亦畬也，与《象》未富之义不合。按《易林》无妄之讼云：不耕而获，家食不给。谓既不耕，获必无得，故家食不给。读虽与王同，而义则与《小象》不背矣。又《礼·坊记》引此，郑彼注云：言必先耕乃得获，先菑乃得畬，安有无事而取利者乎？皆正诂，宜从。二有应，故利往。此自为一义，与上二句不相属，与《困》彖同。\n象曰：不耕获，未富也。\n六三，无妄之灾，或系之牛，行人之得，邑人之灾。\n无妄之灾，犹不虞之灾也。艮为牛（象失传，详《焦氏易诂·补遗》 ）。巽为系，故或系之牛。震为行、为人，巽为盗，故行人之得。艮为邑，艮火故曰灾。言或系之牛，被行人牵去，居者反有盗嫌，遭诘捕之祸也。爻辞取象，神妙已极。乃自艮牛、艮火象失传，自虞翻以来，皆用卦变，致妙用全失。盖三不当位，而巽伏为盗（象失传，详《焦氏易诂·补遗》 ），故有是象。灾之无妄，莫过于是。\n象曰：行人得牛，邑人灾也。\n九四，可贞，无咎。\n阳遇阳则窒，下又无应，不宜于动，故曰可贞。贞，定也。然得重阴履之，故亦无咎。\n象曰：可贞无咎，固有之也。\n固有，即谓二阴。虞翻亦用卦变说之，非。\n九五，无妄之疾，勿药有喜。\n巽为疾；为草莽，故为药。无妄之疾，言疾之愈已失望，乃勿药而愈，其喜可知。五应在二，震为笑乐，故有喜也。勿药者，言巽药为艮火所焚也。\n象曰：无妄之药，不可试也。\n不可试，言此为事之偶然，非所期望，不可尝试。盖五虽当位有应，然承乘皆阳，未为全吉。\n上九，无妄，行有眚，无攸利。\n上应在三。巽为疾病，为眚，为利。然四五遇敌，故行有眚而无所利也。\n象曰：无妄之行，穷之灾也。","26":"大畜卦第二十六\n大畜，利贞，不家食吉。利涉大川。\n乾为大。乾阳上升，为艮所止，故曰大畜。阳为艮畜，故利于贞定也。兑为食，艮为家，皆在外，故不家食吉。坤为大川，上居坤水之颠，下履重阴，得行其志，故曰利涉大川。与《颐》上九之利涉大川同也。\n彖曰：大畜，刚健笃实辉光，日新其德，刚上而尚贤。能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。\n刚健笃实，谓乾。辉光谓艮。艮为日，故曰日新。艮为君子，故曰尚贤，曰养贤。五天位，上孚于五，故曰应乎天。\n象曰：天在山中，大畜；君子以多识前言往行，以畜其德。\n识，《论语》：女以为多学而识之者欤。注：识，记也。乾为前，为言，为行，为德。艮止于下，故多识前言往行，以畜其德。艮为君子。\n初九，有厉，利已。\n厉，危也。已，止也。初有应，似利往，然二三皆阳遇敌，故曰有厉。初勿用，故利已。言往应四则有灾也。旧解皆不知有厉之故在二三，于是虞氏命二变成坎，四在坎体，以取灾象。经义之晦，至于如此，真可叹也！\n象曰：有厉利已，不犯灾也。\n不犯灾，释利已之故也。灾即厉，指二三。\n九二，舆说輹。\n伏坤为舆，震为輹。二应在五。五震体，乃舆在内，輹在外，故曰舆脱輹。车之行全恃輹，輹脱则车不能行。二承乘皆阳，阳遇阳则窒，故有是象。旧说以二应五，便谓利涉大川指二者，非也。如二能利涉，焉与此象哉？然爻辞无吉凶，无咎悔，故《象》曰中无尤。言无尤之故，以得中也。\n象曰：舆说輹，中无尤也。\n九三，良马逐，利艰贞。日闲舆卫，利有攸往。\n乾为良马，震为逐。三多惧，故利艰贞。乾为日。《尔雅·释诂》：闲，习也。《诗·秦风》：游于北园，四马既闲。《传》亦训闲为习。震为舆卫。日闲舆卫者，言车马已闲习，利于行也。三临重阴，故行利。\n象曰：利有攸往，上合志也。\n三遇重阴，阳遇阴则通，故曰上合志。上谓四五。此与《升》初六之上合志同。初六之上谓二三，阴遇阳则通，与阳遇阴同也。虞翻谓上为上爻。故《易》本一失，说无不误。\n六四，童牛之牿，元吉。\n《释文》：童牛，无角牛也。按《太玄·更》次五云：童牛角马，不今不古。即谓牛无角也。牿，《释文》云：陆作角；刘云牿之言角也；《九家》作告，云牛触，角著横木，所以告人。按刘、陆作角者是也。牿、角音同通用。艮为牛（象失传，详《焦氏易诂》 ），艮少故为童牛。而艮为角，四居艮初，有若初生之角，言小牛角初生也。四应初，故吉。\n象曰：六四元吉，有喜也。\n应在初阳，故有喜。（卢浙云：《说文》，牿，牛马牢。牛在牢则范而不越，故吉。于艮止义亦合。 ）\n六五，豮豕之牙，吉。\n《尔雅·释兽》：豕子猪 豮。注云：俗呼小豮猪为 子。是豮豕为小豕。艮少象也，二兑为牙，五应之，故曰豮豕之牙，言小豕初生牙也。按艮为黔喙，兽之黔喙者莫过于豕，疑艮或有豕象。又《姤》以巽为豕，《大畜》三至五伏巽，或仍以巽为豕也。（李鼎祚深知豮豕二字皆由象生，然求之不得，谓五应二，二坎爻为豕。非。又卢浙云：《埤雅》，以杙系豕，谓之牙。牙者，系之者也。系而不去故吉。亦与艮止义合。 ）\n象曰：六五之吉，有庆也。\n六五承阳，故有庆。《晋》六五、《睽》六五，皆上承阳，皆曰往有庆。兹与之同。\n上九，何天之衢，亨。\n艮一阳在上为天。又为背，故曰何。艮为道路，故曰何天之衢。《左传·昭二年》：尸诸周氏之衢。注：衢，道也。又《尔雅·释宫》：四达谓之衢。何天之衢者，言阳在上不为所畜，通达之甚。《象》曰道大行，亦释衢为道。大行即谓其通达。虞翻释何为当。王弼竟释何为何乃，朱子取之，益非。盖皆以天衢如何负何为疑。岂知《易》辞皆摄取象之精神，而不能执其解，执则《易》辞无一可通。\n象曰：何天之衢，道大行也。\n艮为天。《易林》豫之旅云：入天门。随之蹇云：戴瓶望天。皆以艮为天。","27":"颐卦第二十七\n颐，贞吉。观颐，自求口实。\n郑玄曰：颐者，口车辅也。震动于下，艮止于上，口车动而上，因辅嚼物以养人，故谓之颐。按《左传》：辅车相依。注：辅，辅颊；车，牙车。凡物入口，牙车载之，故曰车。辅在上不动，车在下动而上，故曰因辅嚼物。《颐》上艮，辅也，不动者也。下震，牙车也，动而上，因辅以嚼物者也。故郑释最得卦义。颐能养人，故贞吉。艮为观，为求。震为口，坤为物，故曰口实。实者，食也，言口含物以自养也。虞翻谓离为目，郑玄谓二五皆离爻，故能观。岂知艮一阳在上为光明，为目，为观（象失传，详《焦氏易诂》 ），不必用卦变及爻位也。\n彖曰：颐贞吉，养正则吉也。观颐，观其所养也。自求口实，观其自养也。天地养万物，圣人养贤以及万民。颐之时大矣哉！\n天地谓初上。坤为万物，为民。艮为君子，为贤。伏乾为圣人。\n象曰：山下有雷，颐；君子以慎言语，节饮食。\n艮为君子。震为言，为食。正反震言语相背，有相讼意，慎则讼息。饮食者人之所欲。震为口，正反艮手相对，有争意，节则饮食平。慎与节皆艮止象。此《易》用覆象，最为神妙之语。旧说惟《易林》能阐其义（说详《焦氏易诂》 ）。\n初九，舍尔灵龟，观我朵颐，凶。\n离为龟，以刚在外。艮亦刚在外，故《颐》、《损》、《益》皆以艮为龟。此其义，唯《易林》知之。屯之震云：龟鳖列市。以《震》互艮为龟。泰之节云：龟厌河海。以《节》互艮为龟。虞翻用卦变，以《晋》离为龟。《易》取象无此迂曲也。初爻艮覆，故曰舍尔灵龟。朵，《释文》云动也。人食物则颐动。初应在四，四当颐中，故曰观我朵颐。言初当位，拥有群阴，贞静自养，斯亦足矣；乃舍其自有之灵宝，而窥观他人之宠禄（四艮体，艮为贵为官 ），则躁竞贻讥，而殃咎或至，故曰凶。按初当位有应，前临重阴，阳遇阴则通，本无凶理。《随》初出门有功，《益》初利用为大作，其证也。此则凶者，以艮震相反覆，内动外止，故宜静不宜动。《屯》初云利居贞，是其义也。《屯》初至五，亦《颐》也。由此悟《随》初有功者，以外兑，兑悦震喜。《益》初利用为大作者，以外巽，同声相应。故皆动而吉。独《屯》初利居贞，以外坎，坎为险难，故宜贞定。其故全在外卦。《颐》外艮，艮止故不宜动。旧解皆不详凶之故何在，则易理失传，不能观其会通也。\n象曰：观我朵颐，亦不足贵也。\n言初本可贵，反因妄动而不足贵也。\n六二，颠颐，拂经于丘颐，征凶。\n颠与阗通。《礼·玉藻》：盛气颠实。注：颠，读为阗。而阗与窴通。《前汉·游侠传》：人无贤不肖阗门。注：阗与窴字同。窴，塞也。三四五皆阴，故曰窴颐。丘，《前汉·息夫躬传》：寄宿丘亭。师古云：丘，空也。经，常；拂，违也。丘颐，空颐也。盖颐以空为用，今乃窴塞，违颐之常，故曰窴颐，拂经于丘颐。前得敌，故征凶。其以颠颐拂经为句，或以拂经于丘为句者，非。\n象曰：六二征凶，行失类也。\n二无应，前遇重阴，阴遇阴则窒，故曰征凶。阴阳相遇方为类，今六二不遇阳，故曰失类。象义如此明白，乃二千年易家，皆以阴遇阴为类。于是《文言》之各从其类，《坤·彖传》之乃与类行，《系辞》之方以类聚，及此皆失解。与朋友同（说详《焦氏易诂》 ）。\n六三，拂颐，贞凶。十年勿用，无攸利。\n吴先生曰：拂颐，犹不可口也。贞，占也。坤为十年，三不当位，承乘皆阴，故十年不用，无攸利也。按三有应，阴得阳应多吉；此独不吉者，以四五得敌，应上甚难，故曰无攸利。\n象曰：十年勿用，道大悖也。\n艮震皆为道路，乃艮震上下象皆相反，故曰道大悖。《玉篇》：悖，逆也。言艮震皆有覆象相逆也。（艮震皆为道，乃上卦覆震，与下震相逆；下卦覆艮，与上艮相逆。象下一悖字，寻味无穷。 ）\n六四，颠颐，吉。虎视眈眈，其欲逐逐，无咎。\n六二无应，以阴窴颐，故凶。六四有应，窴颐以阳，故吉。艮为虎，为视。眈眈，视貌。《说文》云：视近志远。坤为欲。逐逐，言所欲在初，乃为二三所阻，不能遽遂其欲，故逐逐不已。\n象曰：颠颐之吉，上施光也。\n初阳应四，故曰上施光。三有应不当位，故凶。四当位有应，故吉。然四虽有应，为二三所隔，难以下施，故须初上施而吉也。\n六五，拂经，居贞吉，不可涉大川。\n拂经，王注作拂颐。五不当位，故拂颐。居，安也。安居五位，顺上承阳，故贞吉。若下涉坤水，阴遇阴则窒，故不可也。\n象曰：居贞之吉，顺以从上也。\n上阳，故当顺从。\n上九，由颐，厉吉，利涉大川。\n由，自得也。义详《豫》九四。九四下乘重阴，故曰由豫；此亦下乘重阴，故曰由颐。然高居万民之上，恐逸豫随之，故振厉方吉也。坤为大川，阳遇阴则通，故利涉大川。此与五爻旧解所以全误者，一由坤水象失传，必用虞翻再三变之法，始得坎为大川；二由类字失诂，故不知利涉不利涉之故何在也。\n象曰：由颐厉吉，大有庆也。\n大有庆，谓上九乘重阴。","28":"大过卦第二十八\n大过，栋桡。利有攸往，亨。\n过，失也。谓中四阳陷于阴中，失其用也。《说文》：栋，极也。《尔雅》：栋谓之桴。郭璞云：屋脊也。《易林》以坎为栋，为屋极。大过本大坎也，坎以中爻为栋，大过以三四为栋。桡，《释文》云：曲折也。兑毁折，巽陨落，故栋桡。以易理言，阴承阳则利。利有攸往，应指初。《升》初六曰允升，曰上合志。《大过》初与《升》初同，而四有应，故往利也。虞翻知阳爻无利往者，乃谓二变应五，故利往。如虞说，《传》云栋桡本末弱，本谓初，初亦失位可变也，尚何弱之有哉？乃自宋朱震以来，即承其说。甚矣其不思也！\n彖曰：大过，大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往乃亨。大过之时大矣哉！\n《卦气图》，大过十月卦。闭塞成冬，故曰大过时。\n大过过字，《彖传》未明释。后儒或以过往为说（先天位兑左巽右，中过乾 ），或以过盛为说（此说尤不协，四阳五阳卦多矣，胡此独盛？ ），皆有可疑。愚按《太玄》拟大过为失，言四阳为阴所锢，失其用也。故汉人皆谓《大过》为死卦。《易林》明夷之大过云：言笑未毕，忧来暴卒。又大壮之大过云：道绝不通，商旅失意。又既济之大过云：身加槛缆，囚系缚束。《太玄》又拟为剧。剧，甚也，病也，皆谓阴大贼阳，阳失其用。与《易林》说合若符契。\n象曰：泽灭木，大过；君子以独立不惧，遯世无闷。\n不曰泽中有木，而曰泽灭木，此汉人死卦之说所由来也。灭者人之所惧，君子则独立不惧。巽为寡故曰独，乾为惕故曰惧。兑悦故不惧。阳陷阴中，隐伏不出，故曰遯世。遯世宜有忧矣，乃君子则遯世无闷，以兑悦在终也。《大象》每反以见义，此亦其一也。\n初六，藉用白茅，无咎。\n藉，荐也。凡以物承物曰籍。《曲礼》：执玉，其有藉者则裼，无藉者则袭。注：藉，藻也。疏：执玉必有藻以承玉。巽为伏，初在下，故曰藉。巽为白，为茅。茅柔物，初阴，故曰藉用白茅。又祭时藉茅于地，用以缩酒。而巽为漏（《井》九三瓮敝漏 ），于象尤切。\n象曰：藉用白茅，柔在下也。\n初柔在下，承阳故无咎。\n九二，枯杨生稊，老夫得其女妻，无不利。\n巽为杨，为陨落，为枯。《易林》泰之咸云：老杨日衰，条多枯枝。噬嗑之否云：朽根枯树。是以《咸》、《否》互巽为枯也。稊，郑作荑，木更生。按《诗·卫风》：手如柔荑。《传》云：如荑之新生。然则荑为木新生之条。盖稊、荑同字。《庄子·知北游》云：在荑稗。《释文》云：荑本又作稊。是其证。乾为生，巽为木，巽柔，故曰枯杨生稊。伏震为老夫，巽为女妻。女妻者，少妻。二下孚于阴，故无不利。巽为利也。《易林》遇震即曰老夫，遇巽即曰少齐、曰少姬，本此也（详《焦氏易诂》 ）。虞翻以乾老为枯，岂知乾实虽老不枯。又以乾老为老夫，兑为少女，创二应上、初应五之例，以圆其说。是贞悔不必拘，而应与常例可破也！乃清儒翕然从之，异已！（只俞樾以虞说为不通，知用旁通，打破二千年之谬误，为功甚伟。特又以《大过》二五与《颐》二五相升降以取象。岂知巽即为少妻，兑即为老妇，《易林》有明征，不必如是穿凿也。故夫象一失传，虽以俞氏之深识旁通，且洞明阳顺阴逆之理，亦无如何也。 ）\n象曰：老夫女妻，过以相与也。\n过以相与，言其不当。非谓初可过四应五，二可过五应上也。\n九三，栋桡，凶。\n初爻本弱，故栋桡。上虽有应，然四五皆阳，得敌，九三不能应上，故曰不可以有辅。\n象曰：栋桡之凶，不可以有辅也。\n辅，佐助也。\n九四，栋隆吉，有它吝。\n巽为高，四居巽上，故曰栋隆吉。有它吝者，言四应在初，四若它往应之，则为二三所忌，而致吝矣。四与三不同，三与初同体，本弱无如何。若四只不与初应，则吉也。\n象曰：栋隆之吉，不桡乎下也。\n不桡乎下，即不应初。\n九五，枯杨生华，老妇得其士夫，无咎无誉。\n兑为反巽，故仍曰枯杨。兑为华。《易林》否之咸云：华落实槁。以《咸》上兑为华。需之剥云：老妇亡夫。以《剥》伏兑为老妇。又否之中孚：老妾据机。以《中孚》下兑为老妾。伏艮为士夫，故曰老妇得其士夫。五比阴志行故无咎，下无应故无誉。虞翻以五应初，巽为老妇，《易》无此例也。盖《易》有伏象，伏即旁通，即对象，人知之。而旁通之原理，鲜能明之。《文言》云：旁通情也。情者感也，言阴阳不能相离也。故夫茅茹坤象也，《泰》初爻亦言之；云雨坤坎象也，《小畜》亦言之。（《否》初言茅茹，《小过》言云雨，则用正象。 ）《易林》本之，正伏象常不分。略如见一男子，可推知其家必有妇；见一妇人，可推知其家必有夫也。然非以夫为妇，以妇为夫，使男女无别也。《易》系辞取象可用伏，而义则正也。彼夫王引之讥虞翻用旁通，致阴阳无别。是皆于旁通情，情字失诂，故于易理隔阂如斯也。《大过》老夫、士夫，皆在对象。而自荀、虞以来，皆苦于本象求之，胡有得乎？\n象曰：枯杨生华，何可久也？老妇士夫，亦可丑也。\n匹配失宜，故可丑。\n上六，过涉灭顶，凶，无咎。\n乾为首，故为顶；泽水在上，故灭顶。与《比》之无首义同也。灭顶则死，故凶。《大过》之为死卦在此。然上六当位有应，凶则有之，咎则无也，故《象》曰不可咎。\n象曰：过涉之凶，不可咎也。\n不可咎，言致命遂义，杀身成仁，属于天者虽凶，而咎则未有也。\n《颐》、《大过》四象，在先天处四隅，而包天地水火于其中。天地水火四正卦，上经首尾也，亦即离坎也。而即列于离坎之前，以结上经，最耐寻味。","29":"坎卦第二十九\n习坎，有孚，维心亨。行有尚。\n《归藏》曰荦。李过曰：荦者，劳也。以万物劳于坎也。黄宗炎曰：物莫劳于牛，故从牛。按，《说文》：荦，驳牛也。坤为牛，阳入坤中，色不纯，故曰荦。而牛为物之最劳者，故取于驳牛。《周易》名坎，则取于陷险二义。上下坎，故曰习。罗汝怀云：习当为褶。《礼·玉藻》：帛为褶。注：衣有表里而无著也。《急就篇》注：褶，谓重衣。皆重复之义。而褶又假袭。《礼》：裼袭。《书》：卜不袭吉。故习当作袭。《彖》曰重险，《象》曰水洊至，即释习坎之义。自注有便习之说，后儒多从之。夫谙练于行事，此事理之常，岂有谙练于行险者哉？按罗说是也。《彖传》、《象传》，皆有明释。王注及《正义》，诂为便习，此所以有野文之讥也。孚，信也。有孚，谓二五居中遇阴，阳孚于上下阴也。旧解不知孚之故在阳遇阴，故说皆不当。坎为心。亨，通也。心亨亦谓二五，《传》所谓刚中也。行有尚，则专谓五。五往外得尊位，故曰有尚，曰有功。\n彖曰：习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也，王公设险以守其国。险之时用大矣哉！\n水流若盈，则非坎矣。既曰坎则不盈也。坎为失，为信；阳居中，故不失其信。五天位，居坎中，故曰天险。艮止，故不可升。二地位，居坎中，故曰地险。艮为山，为丘陵，坎为川，故曰山川丘陵也。震为王公。艮为国，为守，为时，为天。\n象曰：水洊至，习坎；君子以常德行，习教事。\n洊，再也。重坎，故曰再至。艮为君子。震为德行，为言，故曰教。习则教之不已，而德行有常矣。\n初六，习坎，入于坎窞，凶。\n《说文》：窞，坎中更有坎。王肃云：坎底也。《字林》云：坎中小坎，一曰旁入。案王肃说是也。初居坎之最下，故入于坎底。\n象曰：习坎入坎，失道凶也。\n震为大涂，故曰道。初于震无应，故曰失道凶。\n九二，坎有险，求小得。\n二失位，故有险。阴为小。二居中，孚于上下阴，故曰求小得。\n象曰：求小得，未出中也。\n《象》曰未出中，言五无应，故曰未出。有应则上升五而当位，所得大矣。\n六三，来之坎坎，检 （从郑、向本 ） 且枕。入于坎窞，勿用。\n三居上下坎之间，来内为坎，之外亦坎，故曰来之坎坎。《孟子》：狗彘食人食而不知检。赵岐云：检，敛也。又《释名》云：枕，检也，所以检项也。然则枕与检义同。检且枕，仍承来之坎坎言，言内外俱受检制。既检且枕，仍与初爻之入坎窞同。夫前检后枕，来往既陷于险境，其不能用也必矣，故曰勿用。\n象曰：来之坎坎，终无功也。\n勿用，故曰无功。艮为枕。《易林》需之大壮云：婚姻配合，同枕共牢。《大壮》通《观》，以艮为枕。坤众故同枕。\n六四，樽酒，簋贰用缶，纳约自牖，终无咎。\n坎为酒，震为尊，故曰尊酒。震为簋。簋，祭器，以盛黍稷。中爻正覆震，故曰簋贰。贰、二同。《曲礼》虽贰不辞。注：贰谓重殽。此簋贰与《损》之二簋同。缶，《说文》：瓦器。簋贰用缶者，言用瓦簋。《周礼》：旊人为簋。疏：祭宗庙用木簋，今用瓦，祭天地尚质，器用陶匏。《郊特牲》亦云：器用陶匏，象天地之性。王夫之谓缶瓦也，与《礼经》合，得其义矣。约，神约也。《周礼·秋官·司约》：掌六约，治神之约为上，治民之约次之。爻辞言尊簋，则祭神也。故知此约为神约。注：神约，命祀郊社群望及祖宗也。《汉书·高帝纪》：约先入关者。注：约，要也。《吕览·淫辞》：秦赵相与约。注：约，盟也。艮为牖，震为言，故曰纳约自牖。言诏明神而要誓，荐其盟祝之载辞于牖下也。又《春官·诅祝》：作盟诅之载辞，以叙国之信用。坎为信，故要誓于神也。四承阳当位，故无咎。艮为终，故曰终无咎。酒、缶、牖、咎为韵。\n象曰：樽酒簋贰，刚柔际也。\n四承阳，故曰刚柔际。际，《说文》：会也。\n九五，坎不盈，祇既平，无咎。\n坎不盈，义见前。祇，京、虞作禔，曰安也。郑云当作坁，小丘也。按《易》字不能定者，当定之以象。郑于《复》卦无祇悔，训祇为病，兹又训为坁，诚以坎不盈与祇既平为对文，则祇为实字无疑。又五为艮主爻，艮山故曰坁。而坁与氏通。《说文》：氏，巴蜀名山。岸胁之堆，旁箸欲落 者，曰氏。氏崩声闻数百里。扬雄赋：响若氏 。而《文选·解嘲》作坁 。应劭云：天水有大坂名曰陇坁。韦昭云：坁音若是理之是。是坁与氏通。俞樾云：祇既平，即氏 之氏。氏 即平矣。古本《易》盖止作氏既平，后人误加示耳。案郑诂为坁，盖即疑祇为氏，俞说正与郑合。而韦昭音坁为是。由是证祇、坁、禔音皆由氏得，从氐者误也。王引之谓郑作宛在水中坻之坻为误，岂知郑并未作坻。坻，《毛传》云：小渚。《释水》云：小洲曰渚。兹曰小丘，明非渚也。以郑作坁与《解嘲》同，与《说文》同也。不然，郑岂不知仍诂为病，使前后一律哉？坎为平，故曰坁既平。坎不盈为一事，坁既平又为一事，上下对文。诂祇为安者固非。仍诂为病，于象虽合，于义未安也。\n象曰：坎不盈，中未光大也。\n阳陷阴中，虽得中而未光大。\n上六，系用徽纆，置于丛棘，三岁不得，凶。\n刘表云：三股为徽，两股为纆，皆索名，以系缚罪人。虞翻云：徽纆，黑索也。徽纆之象，虞用卦变，以《观》巽为绳，非也。盖坎为矫 ，物之能矫 者，莫过于绳，故以徽纆取象。坎为棘，上坎下坎，故曰丛棘。置、示通，《周礼·朝士》郑司农注，及《穀梁·宣二年》范宁注引，皆作示于丛棘。而《诗·鹿鸣》：示我周行。郑则云示当作寘。寘，置也。置于丛棘，旧解皆谓以黑索系罪人，置于狱，或议于九棘之下也。三岁不得，言三年不得出也。茹敦和云：坎为三岁。\n象曰：上六失道，凶三岁也。\n上六应在三，三震为道。乃三不应上，故曰失道。\n案以丛棘为狱者，虞说也。虞谓狱外种棘。张惠言以不知所本而疑之矣。以《周礼·秋官·朝士》为本，使公卿议于九棘之下而定罪者，郑说也。然不曰九棘，而曰丛棘。文王演《易》之时仍殷制，殷是否有三槐九棘之制不可知，则亦可疑也。况爻词曰三岁不得，不得者，不能遂其愿也。《象》曰上六失道，失道者，言所为不当也。不当故不得。于入狱词意皆不合。按《列子·说符篇》：臣有所与共担纆薪菜者，曰九方皋。是徽纆可以约薪菜。扬雄《酒箴》云：子犹瓶矣，居井之湄，不得左右，牵于纆徽。是徽纆可为井索。胡为必束缚罪人？若以丛棘为疑，《诗》云：园有棘，其实之食。又云：墓门有棘，斧以斯之。是棘常生于墓门及园囿。《羽猎赋》：斩丛棘，夷野草。《吴志·诸葛恪传》：升山赴险，抵突丛棘。是丛棘常生于山林。安在必为狱？故《易林》需之坎云：凿井求玉，非卞氏宝；名困身辱，劳无所得。上二句谓所施不得地，释置于丛棘，及失道之义也。下二句谓徒劳无功，释置于丛棘，三岁不得之义也。依《易林》此释，似言徽纆所以系物，然施于丛棘，则杈枒刺激，难于施设，故久不得。不得之故，则由于所置失道也。如是，则不得与失道之故，与上文皆协洽矣。徽纆，皆绳索名耳，系物之用甚多。必谓专系罪人，无乃执乎！","30":"离卦第三十\n离，利贞，亨，畜牝牛吉。\n乾交坤为坎，坤交乾为离。坎为隐而离则明矣。凡相对之卦，其义皆对。二五中正，故利贞。二五丽于阳中，故亨。坤为牛，离得坤中爻，故亦为牛。俞云：《说文》，牝，畜母也。牝牛即母牛。虞翻谓以离为牝牛为俗说，岂知《左传·昭五年》明云纯离为牛。由是证虞翻未见《左氏》。\n《彖》曰：离，丽也。日月丽乎天，百穀草木丽乎地。重明以丽乎正，乃化成天下。柔丽乎中正，故亨。是以畜牝牛吉也。\n五为天位。离日兑月（象失传，详《焦氏易诂》 ），皆在五，故曰日月丽乎天。《礼·王制》：邮罚丽于事。注：丽，附也。言日月附于天也。二四互巽，为百穀，为草木，而二为地位，故曰丽乎地（从王肃不作土 ）。两象，故重明。万物得日以化成。\n象曰：明两作，离；大人以继明照于四方。\n向明而治，故曰大人。重明，故曰继。\n初九，履错然，敬之 （句 ） ， 无咎。\n王注：错然，敬慎之貌。处离之始，故宜慎所履，以敬为务，避其咎也。按初为震爻，震为履。错然，盖又有郑重不苟之意，故曰敬。以敬之连无咎读者，非。\n象曰：履错之敬，以辟咎也。\n六二，黄离，元吉。\n坤色黄，《离》得坤中爻，故曰黄离。得中，故大吉。\n象曰：黄离元吉，得中道也。\n九三，日昃之离，不鼓缶而歌，则大耋之嗟，凶。\n三居离终，故曰日昃，故《象》曰不可久。此爻全用伏象。伏震为鼓，为缶，为歌。伏艮为坚，故《易林》常以艮为寿、为老。《释言》：耋，老也。盖三居下卦之终，时已迟暮，故曰不鼓缶而歌。《诗》：坎其击缶。缶固古乐也。而三居互艮之初，艮为大耋，言不及时行乐，则将有衰老之嗟也。震为乐，震反为艮则嗟矣。此与《中孚》六三之或鼓或罢，或泣或歌，皆正覆象并用。与《杂卦》震起艮止，兑见巽伏之义同也。而能识此旨者，在古则《左传》，在西汉则《易林》，后则无知者。\n象曰：日昃之离，何可久也！\n九四，突如其来如，焚如，死如，弃如。\n九四虽失位，然其凶不至如此之甚。盖此爻之义，仍取覆象。自覆象失传，故说者皆莫明其故。《离》二至四巽，巽顺；三至五巽覆，即不顺矣。兑刚卤，故突如其来如。突与 同，亦作 。《说文》云：不顺忽出也，从倒子，《易》曰突如其来如，不孝子突出，不容于内也。 亦作 者，《说文》 下云：或从倒古文子，即《易》突字。按古文子作 ，倒之即为 。惠栋校《集解》，竟改为 。然《说文》明曰即《易》突字，是古本《易》作突，与今同。改作 ，非也。巽覆故不顺，子体倒故曰不孝子，不孝子无所容于世。体离，故焚如。兑毁折，故死如，弃如。《说文》：弃，捐也。从 ， 不孝子也。故《匈奴传》：王莽造焚如之刑。如淳云：焚如死如弃如者，谓不孝子也。不畜于父母，不容于朋友，故烧杀弃之。按如淳及许慎之说，皆与《象传》无所容义合，盖古义如此也。\n象曰：突如其来如，无所容也。\n六五，出涕沱若，戚嗟若，吉。\n目汁出曰涕。五离为目，兑为雨水。（《夬》九三：往遇雨。《革》传：水火相息。 ）水出自目，故曰涕沱。沱，《说文》：水别流。言涕被面而支溢也。清儒皆以伏坎为涕，于卦象之神妙全失。兑口为嗟。若者，语辞。象本不吉，然而云吉者，以丽于阳中也。\n象曰：六五之吉，丽王公也。\n乾为王为公，谓四上。\n上九，王用出征，有嘉，折首，获匪其醜，无咎。\n此与《大有》、《鼎》上九义同也。《大有》上九云：自天右之，吉无不利。《鼎》上九云：大吉。盖《大有》、《鼎》中爻皆不利，凡中爻不通利者，上九必利。《大畜》中爻为艮所畜，至上九忽亨，则以上九高出庶物，不为所畜也。《大有》、《鼎》、《离》与《大畜》理同也。茹敦和云：离有征伐象。《明夷》九三曰：南狩，得其大首。《晋》上九曰：维用伐邑。皆为离上爻。盖一阳突出兑说之上，而兑为斧钺，离为甲兵，故曰王用出征。兑为毁折，乾为首。先儒皆谓坎折坤，则离亦折乾也（皆以中爻 ），故离有杀象。《既济》云东邻杀牛是也。折首，谓杀敌。于思泊云：虢季盘，折首五百，执讯五十，不 ，女多禽折首，执讯。征之金文，皆谓杀敌，非谓魁首。按于说是也。匪与分古通。《周礼·地官·廪人》：以待国之匪颁。注：匪读为分。获匪其醜者，谓匪颁所获醜虏于有功，以为奴隶也。\n象曰：王用出征，以正邦也。\n征，正也。折首获醜，皆正邦之事。邦象未详。诸家皆以坤为邦。按三至五伏艮，艮为邦。","31":"咸卦第三十一\n咸，亨，利贞，取女吉。\n咸，感也。《归藏》曰钦。《诗·秦风》：忧心钦钦。《传》：思望之，心中钦钦然。盖以少男仰求少女，有钦慕之情。是钦亦有感意，与咸义同。六爻皆有应，故曰亨利贞。少女在前，少男在后，而艮为求，兑为悦，艮男求女，兑悦应之，得婚姻之正，故曰取女吉。\n彖曰：咸，感也。柔上而刚下，二气感应以相与。止而悦，男下女，是以亨利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平。观其所感，而天地万物之情可见矣！\n《否》三上交，故曰柔上而刚下。山泽通气，故曰二气感应以相与。艮止兑悦，故曰止而悦。兑上艮下，故曰男下女。天地感即阴阳和合，和合则万物生。圣人感人则仁义兼施，仁义浃则天下和平。盖天地万物之事，莫不由感而通，由感而成，而其所以能感之故则情也，故曰其情可见。\n象曰：山上有泽，咸；君子以虚受人。\n艮为君子。艮男下兑女，卑以自牧，故曰以虚受人。虞翻曰：《否》坤为虚，乾为人。今坤虚三受上，故以虚受人。\n初六，咸其拇。\n拇，《释文》：马、郑、薛云，足大指也。初在下震爻，故曰咸其拇。感及拇，则欲行矣。\n象曰：咸其拇，志在外也。\n外谓四。初应在四，初四相上下，则各当其位。足者人所恃以行，今感在拇，故欲之外也。巽伏，故亦为志。见《易林》，亦失传象也。\n六二，咸其腓，凶，居吉。\n胫腓所恃以行，感及于腓，则欲前进。乃进而凶者，何也？按二当位，承阳有应，与《革》二至上同。《革》六二征吉，此应与之同。然而凶者，以《革》义取革新，故利于征；若《咸》则义取阴阳相感，感在五为正应，乃三四亦阳，二独与五，则为三四所忌，故动凶居吉。此与《同人》六二同。二同于五，原为正应，然而吝者，以三四亦阳，二不与同而独同五，则招忌也。其故皆在三四。近比三则失五之正应，远应五则有近不承阳之嫌。《遯》六二絷以牛革，亦戒其动，以《遯》二与《同人》、《咸》体同也。腓，《说文》：胫腨也。腨，《说文》：腓肠也。段玉裁云：腓肠谓胫骨后之肉。腓之言肥，似中有肠者，故曰腓肠。按段释腓肠，至为明晰，即今俗所谓腿肚也。《庄子·天下篇》：禹腓无胈。注：胈，细毛也。腓因劳受摩揩，故胈不生。然则腓为胫肚明矣。人之行恃胫，感及于胫，必前进矣。进则有咎，故曰凶。居则不动而承阳，故曰居吉。此爻凶义，鲜有详其故者。崔憬谓二应五，失艮止义。惠栋谓二比三，失五正应。义皆未备。\n象曰：虽凶居吉，顺不害也。\n二承阳有应，当位，本无凶理。象词恐人生疑，故释其故。言爻辞虽云动凶居吉，然阴顺阳为天职，六二但上承诸阳，亦无害也。《传》意似重近取，不必远应也。翼经之大，莫过于是。\n九三，咸其股，执其随，往吝。\n巽为股。股在腓上，故感及于股。阳遇阳则窒，上虽有应，不能往也，往则为四五所忌而吝生矣。若初、二，则随三者也，三下履重阴，止于是可矣。执者，止也。止于三，下比于阴，不必前进。否则吝穷也。\n象曰：咸其股，亦不处也。志在随人，所执下也。\n股所以行，故曰不处。巽为志，乾为人。言初、二志在随三，故三之所执，宜于下也。\n九四，贞吉，悔亡。憧憧往来，朋从尔思。\n四不当位，承乘皆阳，故必贞定无为，方免悔吝。朋谓初，尔谓四。憧憧，思不定也。盖四来应初则三害之，初往应四则二害之，故初、四不宜动宜静。然阻愈多则感愈切，朋从尔思者，言初不得应阳，而慕思四也。\n象曰：贞吉悔亡，未感害也。憧憧往来，未光大也。\n《下系》云：凡《易》之情，近而不相得则凶，或害之。三近四，二近初。然三亦阳，为四敌；二亦阴，为初敌，故二三为初四害。知其害而不动，害斯免矣，故曰未感害也。初四相上下成离，离为光大；今不能相上下，故曰未光大。\n九五，咸其脢，无悔。\n脢，《说文》：背脊肉也。郑、虞同。伏艮，艮为背，故曰咸其脢。当位得中，故无悔。脢居人身之上，故《象》曰志末。末谓上六。言九五感上，近而无阻，故无悔也。案五正应在二，而舍二感上者，以三四害之也。\n象曰：咸其脢，志末也。\n《大过》云：本末弱。以上为末也。兹曰志末，谓五为三四所阻，不能应二，故舍远取近，感在上也。\n上六，咸其辅颊舌。\n虞翻曰：耳目之间曰辅颊。按《说文》：辅，人颊车也。颊，面旁也。《左传》：辅车相依。注：辅，辅颊。车，牙车。《正义》云：《易》以辅颊舌三者并言，则三物也。故郑注《颐》卦云：颐者，口车辅也。震动于下，艮止于上，口车动而上，因辅嚼物以养人。按郑所谓口车，即牙车。牙车在口下，故曰动而上。辅在口上，故曰因辅嚼物以养人。是辅与牙车对，在口中。颊在面旁，居口上，与颐连。不过颊在上，颐在下；颊以骨言，颐以肉言耳。是辅与颊确为二物，又皆为口之属，故与舌并言。兑为口为言，辅颊舌皆兑象，所用以言者。感及于是，则言说多矣，故《象》曰滕口说。来矣鲜云：舌动则辅应而颊随之，三者相须用事，皆所以言者，皆兑象。\n象曰：咸其辅颊舌，滕口说也。\n《释文》：滕，达也。《九家》作乘。虞作媵。郑云：送也。按郑、虞说非也。朱子云：滕与腾通，即达也。李鼎祚本正作腾。","32":"恒卦第三十二\n恒，亨，无咎，利贞，利有攸往。\n《咸》男下女，男求女，得婚姻之正。夫妇之道既立，则长男在前，长女在后，夫倡妇随，终身以之，故受之以《恒》。恒，常也，久也。卦六爻皆有应，故亨利贞。《易林》大畜之未济云：乾坤利贞，乳生六子。利贞者，和合也。二五应初承重阳，四临重阴，故曰利有攸往。虞翻谓终变成《益》者是也。\n彖曰：恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒。恒亨无咎利贞，久于其道也。天地之道，恒久而不已也。利有攸往，终则有始也。日月得天而能久照，四时变化而能久成，圣人久于其道而天下化成。观其所恒，而天地万物之情可见矣！\n《泰》初四相上下，成震巽，故曰刚上而柔下。震巽相反覆，乾坤者震巽之终，震巽者乾坤之始，故曰终则有始。《蛊》先甲三日，后甲三日，终则有始，与此理同也。夫妇者天地也，天地之道循环往来，恒久不已。乾为日，兑为月，日月久照，恒也。震为春，巽为夏，兑秋，乾冬，四时反覆，无有穷期，恒也。乾为圣人。震巽为草木，故曰万物之情。\n象曰：雷风，恒；君子以立不易方。\n雷风同声相应，可常可久。立而易方，则不恒矣。故此卦六爻皆有应，而爻辞皆不取。《论语》：有勇知方。注：方，义也。立不易方，即蹈义而行，无或违也。\n初六，浚恒，贞凶，无攸往。\n浚，深也。虞翻云：乾初为渊，故深。深谓阳。乃《泰》初阳上居四，四阴下居初，虽皆失位，而仍有相求相交之象，故曰浚恒。乃四阳为二三所隔，不能应初，若初则可应四也。惟初远应四，则有近不承阳之嫌，为二三所忌，故曰贞凶，无攸利。贞，卜问。巽为利也。\n象曰：浚恒之凶，始求深也。\n爻在初称始，宜静不宜动。况阴居初失位，尤不宜动，以违恒久之义。乃初六求与四阳交，不知二三之有厉，故曰浚恒之凶，始求深也。言凶之故在初六求与四交也。《焦氏易林》泰之恒云：蔡侯适楚，流连江滨；逾日历月，思其后君。巽为草莽，故为蔡。丛木为楚，故震为楚。言初求四，故曰蔡侯适楚。乾为江海，初在乾下，故曰流连江滨。乾为日，兑为月，初前临乾兑，故曰逾日历月。初求交四，震为君，故曰思其后君。林词专释此爻与四之关系。而曰思其后君，释求深之义，尤为明白。故本焦义以为诂。\n九二，悔亡。\n二不当位，前临重阳，宜有悔矣。然得中位，进虽不利，中正自守，亦无悔也。\n象曰：九二悔亡，能久中也。\n乾为久。为三四所隔，不能应五，故久于中。卦以恒为义，久中故悔亡。\n九三，不恒其德，或承之羞，贞吝。\n乾为德。三承乘皆阳，宜静不宜动。倘亟于应上，而四或害之，则羞吝生矣，故贞吝也。又三居巽上，下桡，进退不定，亦不恒之一因也。\n象曰：不恒其德，无所容也。\n乾为德。承乘皆阳，进退有阻，故曰无所容。\n九四，田无禽。\n震为田猎。禽，获也。下应初，三二遇敌为阻，故无禽。按四前临重阴，例之《豫》四、《大壮》、《解》、《丰》，四爻皆吉，兹独不吉者，卦以恒久贞定为义，故不取利往也。\n象曰：久非其位，安得禽也？\n乾为久。乾四失位，故曰久非其位。\n六五，恒其德，贞妇人吉，夫子凶。\n二五为夫妇，乾为德。六五下遇重阳，而正应在九二，通利极矣。阴得阳应，终身顺承，故贞妇人吉。乾为夫。《大过》九二老夫得女妻是也，故夫子谓九二。六五者九二之妇，本为正应，然二若应五而从妇，则三四遇敌，横犯灾难，故曰夫子凶。《大畜》初九曰不犯灾，《需》初九曰不犯难行，二卦初九皆有正应，而皆二三得敌，故曰灾难。兹与之同。\n象曰：妇人贞吉，从一而终也。夫子制义，从妇凶也。\n五应二，故曰从一而终。坤为义，乾制义者也。阳得阴应，本无足贵，况应之而犯灾难乎？故曰从妇凶也。\n上六，振恒，凶。\n上六居动之极，故曰振恒。振，起也。卦以贞静恒久为义，振则于恒德或违，故凶。\n象曰：振恒在上，大无功也。\n爻至上而穷，不宜动。大谓三。三欲应上，为四所隔，故曰大无功。","33":"遯卦第三十三\n遯，亨，小利贞。\n《遯》，月卦辟未，阴长阳消，小人道长，君子道消。遯者，退也，避也。当阴盛之时，势须退避，否则其祸有不可胜言者矣，故曰遯亨。盖以行止论，洁身退隐，《否》所谓俭德避难也，无所谓亨。而以祸福论，防微虑远，不事王侯，高尚其事，优游事外，亨莫亨于是矣。故《传》曰遯而亨也。阳大阴小。小利贞者，谓宜贞定也。《传》曰浸而长，谓阴方长，长则消阳，故利于静，不利于动也。\n彖曰：遯亨，遯而亨也。刚当位而应，与时行也。小利贞，浸而长也。遯之时义大矣哉！\n五当位，二有应，故曰刚当位而应。然而不能不遯者，时不可也，故曰与时行。遯太早则有过情之讥，如严光是也；太晚则不能遯，沉溺于小人之中而不能免，如刘歆是也。行而宜之之谓义，故夫子极叹时义之大。\n象曰：天下有山，遯；君子以远小人，不恶而严。\n凡卦皆合上下卦以立名。乾健艮止，皆无退义，然而遯者，以乾与艮先后天皆居西北也。西北者，幽潜无用之地，《太玄》谓曰冥。冥者，明之藏也，故曰遯。乾为君子，远遯在外，故曰远小人。五应二，故曰不恶。然以有阻隔故，绝难为与，故曰不恶而严。盖外不与绝，内实远之也。\n初六，遯尾，厉，勿用有攸往。\n爻象初为尾。初往应四，则为同性之二所阻，危厉之道也。勿往则免矣。\n象曰：遯尾之厉，不往何灾也？\n艮为止，在艮宜静。勿用有攸往，则无灾矣。\n六二，执之用黄牛之革，莫之胜说。\n艮为牛，《无妄》六三或系之牛是也。二居中，故曰黄牛。《易林》既济之艮云：伺候牛羊。同人之无妄云：负牛上山。皆以艮为牛。艮为皮革。执，持也，止也。艮手为执。言二得中正，宜贞定自持，如牛革之固，莫能胜我而说去也。仍小利贞之恉也。说、脱同。\n象曰：执用黄牛，固志也。\n巽为志。牛革者至固之物，持志如是，贞定极矣，故曰固志。固则不动，不动则不消阳。\n九三，系遯，有疾厉。畜臣妾，吉。\n巽为绳，故曰系。艮止，故曰系遯。言系恋而不即遯也。巽为疾。三无应，往遇敌，故有疾厉。然下有重阴，承顺于三，畜臣妾则吉。艮为臣妾也。巽疾象，详《履卦·彖传》注。艮臣象亦本《易林》。《易林》夬之坎云：君臣扰忧。《坎》中爻艮震，震为君，艮为臣，故曰君臣扰忧。又兑之艮云：臣围其君。亦以艮为臣。盖艮为僮为仆，故为妾。臣与仆古不分，故为臣。由是知《蹇》六二曰王臣蹇蹇，《小过》六二曰遇其臣，《易》原以艮为臣也。\n象曰：系遯之厉，有疾惫也。畜臣妾吉，不可大事也。\n《广韵》：惫，羸困也。陆绩云：大事，谓天下之政。潜遯之世，但可居家，畜养臣妾，不可治国之大事。\n九四，好遯，君子吉，小人否。\n虞翻曰：《否》乾为好为君子，阴称小人。按四与初有应，好遯者。外不与小人绝，当祸患未形之时，从容而遯也。然知几其神，惟君子能之，若小人则系恋而不去也，故曰君子吉，小人否。\n象曰：君子好遯，小人否也。\n否，不也。小人不肯退，不退则凶咎至矣。\n九五，嘉遯，贞吉。\n乾为嘉。五居中当位，下有应与，不必遯也；乃识微虑远，及此嘉时而遯焉，故曰贞吉。\n象曰：嘉遯贞吉，以正志也。\n五应在二。二互巽，巽为伏，故为心志。虞翻用卦变，谓四与初已易位，三已变成坎，上来之三，成坎为志。夫圣人观象系辞，其所用象，乃在三变之后，迂曲如此，使后学乌从测之哉？\n上九，肥遯，无不利。\n《子夏传》释肥为饶裕，虞翻以乾盈为肥，皆非。《后汉·张衡传》注引《淮南九师道训》云：遯而能飞，吉孰大焉。《易林》需之遯云：去如飞鸿。节之遯云：奋翅鼓翼。王弼云：矰缴不能及。并皆读为飞。朱芹引姚宽《西溪丛语》云：肥古作 ， 、蜚同字。是肥即蜚，蜚即飞也。盖上九居极上，高飞远引，无有阻隔，故无不利。而乾为行，故为飞，《乾》九五飞龙在天是也。\n象曰：肥遯无不利，无所疑也。\n上九逍遥世外，故无所疑。","34":"大壮卦第三十四\n大壮，利贞。\n《杂卦》云：大壮则止。《序卦》云：物不可以终壮，故授之以《晋》，晋者进也。是亦训为止，故与进对文。《太玄》拟为格。格，阻也，亦止也。又拟为夷。夷，伤也。故马、虞皆训壮为伤。吴先生曰：伤则必止，二义相因。按《说卦》震为蕃，蕃有闭义。《诗》：四国于蕃。笺云：蕃，屏也。《周礼·大司徒》：蕃乐。杜子春读蕃为藩，谓藩闭乐器而不用。是蕃与藩通。《大壮》之所以为止者，以震藩屏闭在前也。四不应初，二三遇敌，下阳全为四所格阻，故曰利贞。言利于贞定不动也，即止也。不止则伤，四五两爻是也。郑、王谓为强盛，然注莫古于《十翼》，莫精于《太玄》，皆不如是言，疑非《易》本旨。\n彖曰：大壮，大者壮也。刚以动，故壮。大壮利贞，大者正也。正大而天地之情可见矣！\n大谓乾。乾在下为四所格，故曰大者壮也。盖刚宜静，刚而动必多阻格，释壮之故也。利贞者，贞定。《乾·彖传》云：各正性命，保合太和，乃利贞。天地之情，本如是也。\n象曰：雷在天上，大壮；君子以非礼弗履。\n震为履。震履乾，即卑履尊，非礼甚矣。陆绩曰：君子见卑履尊，终必消除，故以为戒。《大象》每相反为义，此其一也。\n初九，壮于趾，征凶，有孚。\n初应在四，四震为趾。乃四亦阳，初失应，故壮于趾。言趾有所阻格也。又二三亦阳，阳遇阳则窒，故征凶。有，《说文》：有，不宜有也，《春秋传》日月有食之是也。依《说文》，有孚者，谓不宜于有也，即不孚也。正与《象辞》孚穷之义合也。\n象曰：壮于趾，其孚穷也。\n初得敌，无应，故孚穷。\n九二，贞吉。\n二得中，故贞吉。与下贞厉为对文。\n象曰：九二贞吉，以中也。\n二承乘皆阳，得敌，似不吉。然而吉者，以位中也。\n九三，小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。\n三应在上，小人谓上六，君子谓三。乃上六欲应三，而为五所格，故用壮。三欲应上，而为四所格，故用罔。罔，无也。言三上皆失其用也，故卜问厉。中爻互兑，故曰羝羊。四震为藩。羸，缠绕也。三在下卦之上，于爻象为角。羝羊触藩，羸其角者，言三欲上升，为九四所阻格，若羝羊以角触藩而不能决，角反为藩所困也。荀爽以五为角。五为角，则藩已决矣，胡有羸象哉？震藩象。《易林》乾之丰云：藩屏周卫。同人之师云：藩屏汤武。皆以震为藩。而藩与蕃通。《说卦》震为蕃，即《易林》所本也。\n象曰：小人用壮，君子罔也。\n罔，犹否也。\n九四，贞吉，悔亡。藩决不羸，壮于大舆之輹。\n四前临重阴，利往，故贞吉无悔，故藩决不羸。震为舆，为輹。《象》曰尚往，是四往五也。四往五，震象毁，而兑为毁折，故曰壮于大舆之輹。盖卦以止为义，藩决则进，进则有伤，五爻丧羊相因而至矣。虞翻因不知輹象，改輹为腹，非。\n象曰：藩决不羸，尚往也。\n尚往，言上进居五。\n六五，丧羊于易，无悔。\n兑为羊，兑毁折，故丧羊。易，《释文》云：陆作埸，谓疆埸也。古文往往如是。《说文》：埸，田畔也。《诗·小雅》：疆埸有瓜。丧羊于埸，言丧羊于田畔也。诸家作难易解，不辞甚矣。惟埸象无有详者。按震为阪。《说文》：阪，坡也，山胁也。《诗·小雅》：瞻彼阪田。埸既为田畔，疑仍震象也。然虽丧羊，下有应得中，亦无悔也。\n象曰：丧羊于易，位不当也。\n位不当，释丧羊之故也。\n上六，羝羊触藩，不能退，不能遂。无攸利，艰则吉。\n卦全体兑象，故仍曰羝羊。上欲应三，而为五所格，五亦阴，得敌。三之藩在四，上之藩在五。故退欲来三，为藩所阻；进欲前往，而道已穷，故不能退不能遂。巽为利，巽伏故无攸利。然上当位有应，艰贞自守，终吉也。\n象曰：不能退不能遂，不详也。艰则吉，咎不长也。\n《释文》云：详，审也。审，慎也。言不能退不能遂之故，咎在不慎审于始而妄动也。郑、虞、王肃、王弼皆释详为善，于义亦通。三上为正应，终必和合，故曰咎不长。","35":"晋卦第三十五\n晋，康侯用锡马蕃庶，昼日三接。\n离出地居五，南面向明而治，故曰晋。晋，进也。四诸侯。康，美也，大也。《礼·祭统》：康周公。注：康，犹褒，大也。《易林》随之恒云：实沉参虚，封为康侯。康侯略如大侯，为诸侯之美称，犹《诗》之言齐侯，言平王也。坎为马，坤亦为马；坎为众，坤亦为众，故曰用锡马蕃庶。艮为手故曰锡。锡，予也。言康侯恭顺，来宾于王，锡赍众多。《杂卦》：晋，昼也。艮为手，数三，离为昼，故曰昼日三接。侯果曰：《大行人职》曰，诸公三飨三问三劳，诸侯三飨再问再劳，子男三飨一问一劳。即天子三接诸侯之礼也。昼日三接，即一昼三觌也。\n彖曰：晋，进也，明出地上。顺而丽乎大明，柔进而上行，是以康侯用锡马蕃庶，昼日三接也。\n明出地上谓离，顺谓坤，柔进而上行谓五。进居地上，得君位也。\n象曰：明出地上，晋；君子以自昭明德。\n明出地上，自然显著，德不求明而自明，故学《易》之君子，取法乎此，以自昭明德。言明德在己，自然昭朗，视能进与否耳。苟进而上行，未有不显著者。昭，《正义》云：周氏等作照。按昭、照古通，无异义也。\n初六，晋如摧如，贞吉。罔孚，裕无咎。\n初阴，二三亦阴，得敌，故进而见摧。有应，故贞吉。然初虽应四，以为二三所隔，应为甚难，故曰罔孚。裕，缓也。言初与四终为正应，缓以俟之，则无咎也。与《屯》六二，十年乃字，义同也。旧解皆不知得敌之理，虞翻以失位诂摧如，以罔罟诂罔孚，遂歧误百出矣。\n象曰：晋如摧如，独行正也。裕无咎，未受命也。\n初阴遇阴得敌，故曰独行。有应，故曰正。未受命者，言初居勿用之位，尚未膺官守之命也。\n六二，晋如愁如，贞吉。受兹介福，于其王母。\n二无应，进遇坎，坎为忧，故曰愁如。贞吉者，卜问吉也。介，虞、《九家》皆训为大。坤为母，伏乾为大、为福、为王，故曰受兹介福，于其王母。王母谓二，言二虽不宜于进，然得中为坤本位，必受此大福也。旧解谓王母指六五。六五亦阴，焉能福二？故夫阴遇阴、阳遇阳，敌应之理不明，说《易》无不误也。\n象曰：受兹介福，以中正也。\n言二所以受兹大福者，以得此中正之位也。若六五，则中而不正。各家因曰王母疑非五莫能当，岂知下坤方为母，伏乾故曰王母。《易林》此例甚多也。\n六三，众允，悔亡。\n施氏于《升》初六允升，读作 。 ，进也，此允字当与之同。故吴澄亦读作众 。众 者，众进。坤为众。言群阴并进而承阳也，故曰悔亡。虞翻诂允为信，朱子从之，与《象传》上行之义不合。\n象曰：众允之志，上行也。\n坎为志。上行谓进而承阳，即释 义，可见施读合也。\n九四，晋如鼫鼠，贞厉。\n《释文》：《子夏传》作硕鼠，云五技鼠也。古盖音同通用。艮为鼠，为穴。坎为盗。鼠居穴中，伺隙盗窃，昼伏夜动。四失位，前临夷主，下拥万民，而坎为隐伏，为畏怯，欲进居五，恐下民生疑；欲下应初，又恐失五位。进退周章，有类于鼫鼠，故贞厉也。\n象曰：鼫鼠贞厉，位不当也。\n位不当，即谓不中不正。\n六五，悔亡，矢得勿恤。往吉，无不利。\n六五得尊位，向明而治，故悔亡。矢，辅嗣作失。兹从孟、马、荀、虞、郑、王肃诸家。坎为矢，五坎体，是得矢也。坎为恤，得矢为用，故勿恤。承阳，故往吉。坎矢象。《噬嗑》九四云得金矢，以坎为矢也。《易林》常用，乃至汉末竟失传。\n象曰：矢得勿恤，往有庆也。\n往遇阳，故曰往有庆。虞翻强命五变得乾为有庆，岂知六五上下皆乾阳，五居其中，往承阳故有庆。若五变为阳，往遇阳得敌，尚能有庆哉？\n上九，晋其角，维用伐邑，厉吉，无咎。贞吝。\n爻例上为角，故曰晋其角。坤为邑。《离》上九云：王用出征，有嘉折首。是离有征伐象。盖离为甲兵，故维用伐邑。然下应柔爻，故必振厉方吉无咎。以不全吉，故贞吝。\n象曰：维用伐邑，道未光也。\n离为光明，至上光将熄矣。夫王道大光，则无用征伐。用征伐，必未光也。","36":"明夷卦第三十六\n明夷，利艰贞。\n郑云：夷，伤也。日出地上，其明乃光；至其入地，明则伤矣。按二至四互坎，故曰艰。坤安，故曰贞。利艰贞者，言当明夷之世，宜以艰苦贞定自守也。\n彖曰：明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。利艰贞，晦其明也。内难而能正其志，箕子以之。\n离文明，坤柔顺，离内坤外，故曰内文明而外柔顺。坎为难，故曰以蒙大难。坤为文，震为王，故曰文王。文王囚羑里，几经艰
